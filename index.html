    },
    apply: (state, rows) => {
      state.trainingGuests = rows.map(r => ({
        convocationId: r.convocation_id,
        guestPlayerId: r.guest_player_id,
        instanceDate: r.instance_date,
        createdAt: r.created_at ? Date.parse(r.created_at) : null
      }));
    }
  },
  // ==========================================================================
  // TRAINING PLANS — Phase 2 (cf. migration 20260529_001_training_plans.sql).
  // Plan d'entraînement (exercices + notes + validation) attaché à une instance
  // de convocation training SPÉCIFIQUE (couple convocation_id + instance_date,
  // pour les trainings récurrents). Persisté en Supabase pour la sync cross-
  // device. PK applicative `id` = `${convocationId}::${instanceDate}`
  // (déterministe → upsert idempotent). Contenu dans `plan` (jsonb libre :
  // { exercises, validated, validatedAt, completedExercises }).
  // ==========================================================================
  {
    key: 'trainingPlans', table: 'training_plans', pk: 'id', realtime: true, auth: 'anon',
    dump: (state) => {
      const out = {};
      (state.trainingPlans || []).forEach(tp => {
        const idate = tp.instanceDate;
        if (!tp.convocationId || !idate) return; // colonnes NOT NULL en DB
        const id = `${tp.convocationId}::${idate}`;
        out[id] = {
          id,
          convocation_id: tp.convocationId,
          instance_date: idate,
          season_id: tp.seasonId || null,
          plan: tp.plan || {},
          // updated_at stable par contenu : pas de new Date() ici (sinon le hash
          // change à chaque flush → ré-upsert en boucle infinie).
          updated_at: tp.updatedAt ? new Date(tp.updatedAt).toISOString() : null,
        };
      });
      return out;
    },
    apply: (state, rows) => {
      // FIX binding orphelin (Option B) : on PRÉSERVE la référence de l'objet
      // `plan` des entrées déjà locales. resolveTrainingPlan a fait pointer
      // c.trainingPlan dessus (live-binding) ; si on recréait un nouvel objet ici,
      // c.trainingPlan deviendrait orphelin et les éditions en cours (groupes…)
      // partiraient à la poubelle. On remplace donc le CONTENU du plan EN PLACE.
      // Garde anti-écho : on n'écrase le contenu QUE si le remote est strictement
      // plus récent (updatedAt) que l'édition locale → un écho realtime de notre
      // propre push n'efface pas une édition locale encore en vol. (cf persist()
      // qui bumpe updatedAt pendant l'édition.)
      const local = state.trainingPlans || [];
      const byId = new Map(local.map(tp => [`${tp.convocationId}::${tp.instanceDate}`, tp]));
      rows.forEach(r => {
        const id = r.id;
        const remoteUpdated = r.updated_at ? Date.parse(r.updated_at) : (r.created_at ? Date.parse(r.created_at) : 0);
        const remotePlan = r.plan || { exercises: [], validated: false, completedExercises: {} };
        const existing = byId.get(id);
        if (existing) {
          if (remoteUpdated > (existing.updatedAt || 0)) {
            if (existing.plan && typeof existing.plan === 'object') {
              Object.keys(existing.plan).forEach(k => delete existing.plan[k]); // vide en place
              Object.assign(existing.plan, remotePlan);                          // réf préservée
            } else {
              existing.plan = remotePlan;
            }
            existing.updatedAt = remoteUpdated;
          }
          existing.seasonId = r.season_id || existing.seasonId || null;
        } else {
          byId.set(id, {
            convocationId: r.convocation_id,
            instanceDate: r.instance_date,
            seasonId: r.season_id || null,
            plan: remotePlan,
            updatedAt: remoteUpdated || null,
          });
        }
      });
      // Map = ordre d'insertion : entrées locales (réfs conservées, y compris les
      // pending pas encore en remote) puis nouvelles entrées venues du remote.
      state.trainingPlans = Array.from(byId.values());
    }
  }
];

// Caches : { entityKey: { rowKey: hash } }
const _lastSeen = Object.fromEntries(ENTITIES.map(e => [e.key, {}]));
let _flushPending = null;

// PK composite : compose la clé string PostgREST (col1=eq.v1&col2=eq.v2…)
function _pkFilter(entity, row) {
  const cols = Array.isArray(entity.pk) ? entity.pk : [entity.pk];
  return cols.map(c => `${c}=eq.${encodeURIComponent(row[c])}`).join('&');
}

// Pousse les deltas d'une entité vers Supabase
async function _flushEntity(entity, currentMap) {
  const cache = _lastSeen[entity.key];
  const toUpsert = [];
  const newCache = {};
  Object.entries(currentMap).forEach(([k, row]) => {
    const h = _stableJson(row);
    newCache[k] = h;
    if (cache[k] !== h) toUpsert.push(row);
  });
  const toDelete = Object.keys(cache).filter(k => !(k in currentMap));

  if (toUpsert.length) {
    const { error } = await sb.from(entity.table).upsert(toUpsert, {
      onConflict: Array.isArray(entity.pk) ? entity.pk.join(',') : entity.pk
    });
    if (error) { console.warn(`[sync] upsert ${entity.table}:`, error.message); return; }
  }
  for (const k of toDelete) {
    // Reconstruire les valeurs PK à partir de la clé "v1|v2|v3"
    const cols = Array.isArray(entity.pk) ? entity.pk : [entity.pk];
    const vals = k.split('|');
    let q = sb.from(entity.table).delete();
    cols.forEach((c, i) => { q = q.eq(c, vals[i]); });
    const { error } = await q;
    if (error) { console.warn(`[sync] delete ${entity.table}:`, error.message); }
  }
  _lastSeen[entity.key] = newCache;
}

// Hook public : appelé après chaque persist() côté main script
async function _flushAll(state) {
  if (!Pb.online) return;
  for (const entity of ENTITIES) {
    if (entity.auth === 'l2' && !Pb.user) continue;
    try {
      const map = entity.dump(state);
      await _flushEntity(entity, map);
    } catch (e) { console.warn(`[sync] dump ${entity.key}:`, e.message); }
  }
}

// Helper : calcule la clé PK d'une row remote (single ou composite)
function _rowKey(entity, row) {
  if (Array.isArray(entity.pk)) return entity.pk.map(c => row[c]).join('|');
  return String(row[entity.pk]);
}

// Helper : init le cache à partir des rows remote (PAS du state). Comme ça,
// items locaux pas encore dans remote → absents du cache → next flush les push.
function _seedCacheFromRemote(entity, rows, state) {
  // On dump le state APRÈS apply pour avoir le format exact que dump produirait
  const map = entity.dump(state);
  const remoteKeys = new Set(rows.map(r => _rowKey(entity, r)));
  const cache = {};
  Object.entries(map).forEach(([k, row]) => {
    if (remoteKeys.has(k)) cache[k] = _stableJson(row);
    // sinon : pas dans cache → sera pushé au prochain flush
  });
  _lastSeen[entity.key] = cache;
}

window.PbSync = {
  schedule(state) {
    if (_flushPending) return;
    _flushPending = setTimeout(() => { _flushPending = null; _flushAll(state); }, 400);
  },
  async fetchAll(state) {
    if (!Pb.online) return;
    for (const entity of ENTITIES) {
      if (entity.auth === 'l2' && !Pb.user) continue;
      try {
        const { data, error } = await sb.from(entity.table).select('*');
        if (error) { console.warn(`[sync] fetch ${entity.table}:`, error.message); continue; }
        const rows = data || [];
        // CRITIQUE : n'apply QUE si remote a des données. Sinon on garde le seed
        // local et on laisse le prochain flush pousser local → remote.
        if (rows.length > 0) {
          try { entity.apply(state, rows); }
          catch (e) { console.warn(`[sync] apply ${entity.key}:`, e.message); }
        }
        _seedCacheFromRemote(entity, rows, state);
      } catch (e) { console.warn(`[sync] fetch ${entity.key}:`, e.message); }
    }
  },
  subscribeAll(state, onApplied) {
    ENTITIES.filter(e => e.realtime).forEach(entity => {
      const ch = sb.channel('sync-' + entity.table)
        .on('postgres_changes', { event: '*', schema: 'public', table: entity.table }, async () => {
          try {
            const { data, error } = await sb.from(entity.table).select('*');
            if (error) return;
            const rows = data || [];
            const prevCache = _lastSeen[entity.key] || {};
            // Apply d'abord pour avoir l'état post-merge (préserve les extras
            // locaux non synchronisés comme images/concepts/attachments).
            if (rows.length > 0) {
              try { entity.apply(state, rows); } catch(e) {}
            }
            // Anti-self-echo : compare le hash COMPLET (clés + contenu) du
            // dump post-apply au cache _lastSeen. Si tout matche pile, c'est
            // notre propre broadcast → skip render. Si une row a changé de
            // contenu (UPDATE par un autre browser), ou un INSERT/DELETE est
            // arrivé, on render. Avant : comparait seulement les clés, donc
            // les UPDATE sur le même set de clés n'étaient JAMAIS rendus.
            const newMap = entity.dump(state);
            const newKeys = Object.keys(newMap);
            let identical = (Object.keys(prevCache).length === newKeys.length);
            if (identical) {
              for (const k of newKeys) {
                if (prevCache[k] !== _stableJson(newMap[k])) { identical = false; break; }
              }
            }
            _seedCacheFromRemote(entity, rows, state);
            if (!identical && onApplied) onApplied(entity.key);
          } catch(e) { /* swallow */ }
        });
      ch.subscribe();
    });
  },
  // Force un flush immédiat (utilisé sur pagehide pour ne pas perdre les
  // écritures encore dans la fenêtre de debounce 400ms si l'utilisateur ferme
  // l'onglet rapidement après avoir créé/modifié un play).
  flushNow(state) {
    if (_flushPending) { clearTimeout(_flushPending); _flushPending = null; }
    return _flushAll(state);
  }
};
</script>

// Game Score (formule Hollinger adaptée) - reflète la contribution globale
// PTS + 0.4*PD + 0.7*REB + INT + 0.7*DEF - 0.4*(tirs ratés) - PB - 0.4*Fautes
function gameScore(s) {
  if (!s) return 0;
  const tirsRates = (s.p2iA||0) - (s.p2i||0) + (s.p2eA||0) - (s.p2e||0) + (s.p3A||0) - (s.p3||0);
  const lfRates = (s.ftA||0) - (s.ft||0);
  const gs = (s.pts||0)
    + 0.4 * (s.ast||0)
    + 0.7 * (s.reb||0)
    + (s.stl||0)
    + 0.7 * (s.def||0)
    - 0.4 * tirsRates
    - 0.4 * lfRates
    - (s.to||0)
    - 0.4 * (s.fouls||0);
  return Math.round(gs * 10) / 10;
}

function load(k, d) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : d; } catch { return d; } }
// save() : sync localStorage avec gestion explicite du QuotaExceededError.
// Avant : setItem brut → si quota dépassé (typique : 5 MB), throw silencieux
// remontait à persist() qui sortait sans avoir tout sauvé. Conséquence
// utilisateur : modal de save play stays open, image dans state mémoire
// mais perdue au reload. Le throw cassait aussi le chaînage closeModal/render.
// Maintenant : on emet `pb:storage_full` (custom event) et on retry sans
// le payload qui a explosé, en gardant trace dans console pour debug.
function save(k, v) {
  try {
    localStorage.setItem(k, JSON.stringify(v));
    return true;
  } catch (e) {
    const isQuota = e && (e.name === 'QuotaExceededError' || e.code === 22 || /quota/i.test(String(e.message || '')));
    console.warn('[storage] save failed for', k, ':', e && e.message, '(quota:', isQuota, ')');
    if (isQuota) {
      // Notification globale : un seul handler doit afficher l'alerte
      // (pour éviter 10 popups sur un persist() en cascade)
      try {
        const evt = new CustomEvent('pb:storage_full', { detail: { key: k, error: e } });
        window.dispatchEvent(evt);
      } catch (_) {}
    }
    return false;
  }
}

// Listener global : 1 alerte max par minute pour éviter le spam

    "Le navigateur n'accepte plus de nouvelles données. " +
    "Tu as probablement trop d'images stockées localement.\n\n" +
    'Pour libérer : retire des images des plays anciens ou des selfies de match.'
  ), 0);
});

  if (window.PbSync) PbSync.schedule(state);

// ============================================================
// SAISON HELPERS (v1)
// ============================================================
// Toutes les vues principales filtrent par state.currentSeasonId via ces
// helpers. Pour les matches/convocations/challenges legacy (avant migration)
// qui n'ont pas de seasonId, on les rattache visuellement à currentSeasonId
// uniquement si currentSeasonId === activeSeasonId (par défaut). Pas de
// mutation auto en DB : la migration SQL fait déjà le backfill.

function getActiveSeasonId() {
  const s = (state.seasons || []).find(x => x.status === 'active');
  return s ? s.id : null;
}

function getCurrentSeason() {
  if (!state.currentSeasonId) return null;
  return (state.seasons || []).find(s => s.id === state.currentSeasonId) || null;
}

// Garantit que state.currentSeasonId est valide. Appelé après chaque sync.
// - coach : si currentSeasonId pointe vers rien (ou null), fallback active.
// - joueuse : toujours forcé sur active.
function ensureCurrentSeasonId() {
  const isCoach = state.auth && state.auth.role === 'coach';
  const activeId = getActiveSeasonId();
  if (!isCoach) {
    state.currentSeasonId = activeId;
    return;
  }
  if (!state.currentSeasonId || !(state.seasons || []).find(s => s.id === state.currentSeasonId)) {
    state.currentSeasonId = activeId;
  }
}

function setCurrentSeasonId(id) {
  if (!id) return;
  if (!(state.seasons || []).find(s => s.id === id)) return;
  state.currentSeasonId = id;
  save(K.currentSeasonId, id);
  if (typeof render === 'function') render();
}

// Multi-effectif : une joueuse appartient à une équipe SI son tag matche le
// filtre demandé, OU si elle est 'both' (présente dans les 2), OU si on demande
// 'all' (vue coach « Toutes »). Mono-équipe (tout en 'e1', filtre 'all') → tout
// passe, comportement historique inchangé.
function teamTagMatches(tag, want) {
  if (!want || want === 'all') return true;
  const t = tag || 'e1';
  return t === want || t === 'both';
}

// Joueuses d'une saison. includeLeft=true affiche aussi les parties (badge).
// team : 'all' (défaut) | 'e1' | 'e2' → scope sur season_players.team_tag.
function getSeasonPlayers(seasonId, { includeLeft = false, team = 'all' } = {}) {
  if (!seasonId) return state.players || [];
  const links = (state.seasonPlayers || []).filter(sp => sp.seasonId === seasonId);
  return links.map(link => {
    const p = (state.players || []).find(p => p.id === link.playerId);
    if (!p) return null;
    if (!includeLeft && link.leftAt) return null;
    if (!teamTagMatches(link.teamTag, team)) return null;
    return { ...p, _seasonLink: link };
  }).filter(Boolean);
}

// Plays actifs sur une saison. includeInactive=true pour le coach (badge inactif).
function getSeasonPlays(seasonId, { includeInactive = false } = {}) {
  if (!seasonId) return state.plays || [];
  const links = (state.seasonPlays || []).filter(sp => sp.seasonId === seasonId);
  const filtered = includeInactive ? links : links.filter(l => l.active !== false);
  return filtered.map(link => {
    const play = (state.plays || []).find(p => p.id === link.playId);
    if (!play) return null;
    return { ...play, _seasonActive: link.active !== false };
  }).filter(Boolean);
}

// Matches / convocations / challenges de la saison courante. Inclut aussi
// les entries legacy sans seasonId si on est sur la saison active (backward
// compat : avant la migration, tout match était implicitement "saison active").
// Si state.seasons est vide (pas encore fetché depuis Supabase, premier
// render avant que PbSync.fetchAll ait peuplé le state), on bypasse le
// filtre — sinon le coach voit une app vide au boot avant la 1re sync.
function _seasonsLoaded() { return (state.seasons || []).length > 0; }
function _matchesSeasonId(seasonId) {
  if (!_seasonsLoaded()) return state.matches || [];
  const activeId = getActiveSeasonId();
  return (state.matches || []).filter(m => {
    if (m.seasonId) return m.seasonId === seasonId;
    return seasonId === activeId; // legacy : rattaché à active par défaut
  });
}
function _convocsSeasonId(seasonId) {
  if (!_seasonsLoaded()) return state.convocations || [];
  const activeId = getActiveSeasonId();
  return (state.convocations || []).filter(c => {
    if (c.seasonId) return c.seasonId === seasonId;
    return seasonId === activeId;
  });
}
function _challengesSeasonId(seasonId) {
  if (!_seasonsLoaded()) return state.challenges || [];
  const activeId = getActiveSeasonId();
  return (state.challenges || []).filter(ch => {
    if (ch.seasonId) return ch.seasonId === seasonId;
    return seasonId === activeId;
  });
}
function currentSeasonMatches()      { return _matchesSeasonId(state.currentSeasonId); }
function currentSeasonConvocations() { return _convocsSeasonId(state.currentSeasonId); }
function currentSeasonChallenges()   { return _challengesSeasonId(state.currentSeasonId); }
function currentSeasonPlays(opts)    { return getSeasonPlays(state.currentSeasonId, opts); }

// Helper court : joueuses de la saison courante. Fallback rétrocompat sur
// state.players si seasons pas encore chargés (bypass legacy avant migration
// DB, cf. _seasonsLoaded). Utilisé dans toutes les vues saison-scopées :
// effectif, qui-joue, convocs, lineups, live tracker, wellness, ressentis,
// leaderboard saison, etc.
function currentSeasonPlayers(opts) {
  if (!_seasonsLoaded() || !state.currentSeasonId) return state.players || [];
  const o = opts || {};
  // team explicite (appelant qui sait ce qu'il veut) sinon filtre effectif.
  const team = o.team || effectiveTeamFilter();
  return getSeasonPlayers(state.currentSeasonId, { ...o, team });
}

// MULTI-EFFECTIF (E1/E2) — filtre effectif + helpers
// ============================================================
// Tag équipe de la joueuse connectée (sur la saison courante). Défaut 'e1'.
function currentPlayerTeamTag() {
  const a = state.auth;
  if (!a || a.role !== 'player') return null;
  const link = (state.seasonPlayers || []).find(
    sp => sp.seasonId === state.currentSeasonId && sp.playerId === a.playerId
  );
  return (link && link.teamTag) || 'e1';
}

// Filtre équipe EFFECTIF appliqué aux vues saison-scopées :
//   - multi off          → 'all' (mono-équipe, tout en e1 : aucun changement)
//   - joueuse e1/e2      → son propre tag (scope auto, pas de pillule)
//   - joueuse both       → 'all' (voit les deux équipes)
//   - coach / stat       → la pillule topbar (state.teamFilter)
function effectiveTeamFilter() {
  if (!(state.team && state.team.multiSquad)) return 'all';
  if (state.auth && state.auth.role === 'player') {
    const tag = currentPlayerTeamTag();
    return tag === 'both' ? 'all' : tag;
  }
  return state.teamFilter || 'all';
}

// Pillule coach/stat : bascule le filtre actif et re-render.
function setTeamFilter(tag) {
  state.teamFilter = (tag === 'e1' || tag === 'e2') ? tag : 'all';
  save(K.teamFilter, state.teamFilter);
  if (typeof render === 'function') render();
}

// Pool roster scopé sur le tag d'un ÉVÉNEMENT (match/convoc/défi). Un événement
// 'both' (entraînement commun, défi partagé) tire tout l'effectif (e1+e2+both).
// Un match est toujours e1|e2. Fallback : tag de l'événement absent → 'e1'.
function eventTeamPool(ev) {
  const seasonId = (ev && ev.seasonId) || state.currentSeasonId;
  const tag = (ev && ev.teamTag) || 'e1';
  const team = tag === 'both' ? 'all' : tag;
  return getSeasonPlayers(seasonId, { team });
}
// Alias explicite côté match (jamais 'both').
function matchTeamPool(m) { return eventTeamPool(m); }

// Libellé d'affichage d'un tag équipe. short=true → version compacte (pillule,
// badges). Les libellés perso (e1Label/e2Label) viennent de team_settings.
function teamLabel(tag, short) {
  const t = state.team || {};
  if (tag === 'e1') return t.e1Label || (short ? 'E1' : 'Équipe 1');
  if (tag === 'e2') return t.e2Label || (short ? 'E2' : 'Équipe 2');
  if (tag === 'both') return short ? 'E1+E2' : 'Les deux';
  return short ? 'Toutes' : 'Toutes les équipes';
}
function isMultiSquad() { return !!(state.team && state.team.multiSquad); }

// Lecture seule si la saison courante est archivée
function isCurrentSeasonReadOnly() {
  const s = getCurrentSeason();
  return !!(s && s.status === 'archived');
}

function esc(s) { return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid() { return 'x' + Date.now() + Math.random().toString(36).slice(2,6); }

function parseVideo(url) {
  if (!url) return null;
  url = url.trim();
  const isVertical = /shorts\/|tiktok\.com|instagram\.com\/reels?/i.test(url);
  let m = url.match(/(?:youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*?&)?v=|embed\/|shorts\/|v\/|live\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})(?:[?&#\/]|$)/);
  if (m) {
    const id = m[1];
    // Préserve un timestamp éventuel (?t=42, &t=1m23s, &start=83, #t=2m).
    // Accepte les formats numériques, "Xs", "XmYs", "XhYmZs".
    const tMatch = url.match(/[?&#](?:t|start)=([0-9hms]+)/i);
    let startSec = 0;
    if (tMatch) {
      const raw = tMatch[1];
      if (/^\d+$/.test(raw)) startSec = parseInt(raw, 10);
      else {
        const h = (raw.match(/(\d+)h/i) || [])[1] | 0;
        const mn = (raw.match(/(\d+)m/i) || [])[1] | 0;
        const s = (raw.match(/(\d+)s/i) || [])[1] | 0;
        startSec = h * 3600 + mn * 60 + s;
      }
    }
    const embed = `https://www.youtube.com/embed/${id}?rel=0&modestbranding=1&playsinline=1${startSec > 0 ? '&start=' + startSec : ''}`;
    const watchUrl = isVertical
      ? `https://www.youtube.com/shorts/${id}`
      : `https://www.youtube.com/watch?v=${id}${startSec > 0 ? '&t=' + startSec + 's' : ''}`;
    return {
      provider: 'youtube', id,
      embed,
      watchUrl,
      thumb: `https://img.youtube.com/vi/${id}/hqdefault.jpg`,
      thumbHQ: `https://img.youtube.com/vi/${id}/maxresdefault.jpg`,
      vertical: isVertical,
      startSec
    };
  }
  m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (m) return { provider: 'vimeo', id: m[1], embed: `https://player.vimeo.com/video/${m[1]}`, watchUrl: `https://vimeo.com/${m[1]}`, thumb: null, vertical: isVertical };

  // === INSTAGRAM (posts, reels, IGTV) ===
  // Accepte instagram.com/p/<id>/, /reel/<id>/, /reels/<id>/, /tv/<id>/
  m = url.match(/instagram\.com\/(?:p|reel|reels|tv)\/([A-Za-z0-9_-]+)/i);
  if (m) {
    const id = m[1];
    const isReel = /\/reels?\//i.test(url);
    return {
      provider: 'instagram', id,
      embed: `https://www.instagram.com/p/${id}/embed/`,
      watchUrl: `https://www.instagram.com/${isReel ? 'reel' : 'p'}/${id}/`,
      thumb: null,
      vertical: isReel || isVertical
    };
  }

  // === TIKTOK ===
  // Format long : tiktok.com/@user/video/<numeric_id>
  m = url.match(/tiktok\.com\/@[^\/]+\/video\/(\d+)/i);
  if (m) {
    const id = m[1];
    return {
      provider: 'tiktok', id,
      embed: `https://www.tiktok.com/embed/v2/${id}`,
      watchUrl: url,
      thumb: null,
      vertical: true
    };
  }
  // Format court : vm.tiktok.com/<code> ou tiktok.com/t/<code>
  m = url.match(/(?:vm\.tiktok\.com\/([A-Za-z0-9]+)|tiktok\.com\/t\/([A-Za-z0-9]+))/i);
  if (m) {
    const code = m[1] || m[2];
    return {
      provider: 'tiktok', id: code,
      embed: null, // pas d'ID numérique : on ouvre dans l'app
      watchUrl: url,
      thumb: null,
      vertical: true
    };
  }

  if (/\.(mp4|webm|ogg)(\?|$)/i.test(url)) return { provider: 'direct', id: url, embed: url, watchUrl: url, thumb: null, vertical: isVertical };
  return null;
}

function videoEmbed(url) {
  const v = parseVideo(url);
  if (!v) return `<div class="v-tile-media-emoji">▶</div>`;
  if (v.provider === 'direct') return `<video controls preload="metadata"><source src="${v.embed}"></video>`;
  return `<iframe src="${v.embed}" allowfullscreen loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>`;
}

// Lecteur vidéo : Vimeo / Instagram / TikTok = iframe embed inline,
// YouTube = card preview (embed peu fiable sur mobile), fichiers directs = <video>
function videoPlayer(url, defaultVertical) {
  const v = parseVideo(url);
  if (!v) return '';
  const vertical = v.vertical || defaultVertical || false;

  // === VIMEO : embed iframe inline (fiable, pas de blocage) ===
  // Respecte la classe vertical/horizontal selon `defaultVertical` (passé
  // depuis l'éditeur de play). Vimeo URL ne porte PAS l'orientation, donc
  // pour un play marqué "vertical" dans son data, on utilise .vertical
  // (aspect 9:16) sinon .horizontal (aspect 16:9, default).
  if (v.provider === 'vimeo') {
    const sep = v.embed.includes('?') ? '&' : '?';
    return `
      <div class="video-wrap">
        <div class="video-player ${vertical ? 'vertical' : 'horizontal'}">
          <iframe
            src="${v.embed}${sep}playsinline=1&dnt=1&byline=0&portrait=0&title=0"
            width="100%" height="100%"
            frameborder="0"
            allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media"
            allowfullscreen
            loading="lazy"></iframe>
        </div>
      </div>
    `;
  }

  // === INSTAGRAM : iframe embed officiel (post + reel) ===
  if (v.provider === 'instagram') {
    return `
      <div class="video-wrap">
        <div class="video-player ${vertical ? 'vertical' : 'horizontal'}">
          <iframe
            src="${v.embed}"
            allow="autoplay; encrypted-media; picture-in-picture; web-share"
            allowfullscreen
            loading="lazy"
            scrolling="no"></iframe>
        </div>
        <a class="video-open-link" href="${esc(v.watchUrl)}" target="_blank" rel="noopener">↗ Ouvrir sur Instagram</a>
      </div>
    `;
  }

  // === TIKTOK : iframe si ID numérique, sinon card preview (URL courte) ===
  if (v.provider === 'tiktok') {
    if (v.embed) {
      return `
        <div class="video-wrap">
          <div class="video-player vertical">
            <iframe
              src="${v.embed}"
              allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
              allowfullscreen
              loading="lazy"></iframe>
          </div>
          <a class="video-open-link" href="${esc(v.watchUrl)}" target="_blank" rel="noopener">↗ Ouvrir sur TikTok</a>
        </div>
      `;
    }
    // URL courte vm.tiktok.com : pas d'ID numérique → preview card seulement
    return `
      <div class="video-wrap">
        <a class="video-preview-card vertical" href="${esc(v.watchUrl)}" target="_blank" rel="noopener">
          <div class="video-preview-thumb">
            <div class="video-preview-fallback">🎵</div>
            <div class="video-preview-play-overlay">
              <div class="video-preview-play-btn">▶</div>
            </div>
          </div>
          <div class="video-preview-info">
            <div class="video-preview-provider">
              <span class="video-preview-provider-icon">🎵</span>
              <span class="video-preview-provider-name">TikTok</span>
              <span class="video-preview-format-tag">Short</span>
            </div>
            <div class="video-preview-action">↗ Ouvrir</div>
          </div>
        </a>
      </div>
    `;
  }

  // === FICHIER VIDÉO DIRECT (.mp4, .webm) : balise HTML5 native ===
  if (v.provider === 'direct') {
    return `
      <div class="video-wrap">
        <div class="video-player ${vertical ? 'vertical' : 'horizontal'}">
          <video controls playsinline preload="metadata"><source src="${v.embed}"></video>
        </div>
      </div>
    `;
  }

  // === YOUTUBE : lazy embed (thumbnail + bouton play → iframe au clic) ===
  // Économise les requêtes YT/cookies tant que la vidéo n'est pas lue.
  // Click handler inline : remplace le bouton par l'iframe avec autoplay=1.
  const thumb = v.thumb || `https://img.youtube.com/vi/${v.id}/hqdefault.jpg`;
  const thumbHQ = v.thumbHQ || `https://img.youtube.com/vi/${v.id}/maxresdefault.jpg`;
  const embedAutoplay = `${v.embed}${v.embed.includes('?') ? '&' : '?'}autoplay=1`;
  return `
    <div class="video-wrap">
      <div class="video-player ${vertical ? 'vertical' : 'horizontal'}">
        <button class="yt-lazy" type="button" aria-label="Lire la vidéo YouTube"
          onclick="this.outerHTML='&lt;iframe src=&quot;${esc(embedAutoplay)}&quot; allowfullscreen allow=&quot;accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture&quot;&gt;&lt;/iframe&gt;'">
          <img src="${esc(thumbHQ)}" alt=""
            onerror="this.onerror=null;this.src='${esc(thumb)}'"
            loading="lazy" decoding="async">
          <span class="yt-lazy-play">▶</span>
        </button>
      </div>
      <a class="video-open-link" href="${esc(v.watchUrl)}" target="_blank" rel="noopener">↗ Ouvrir sur YouTube</a>
    </div>
  `;
}

function formatDate(iso, format = 'short') {
  if (!iso) return '';
  const d = new Date(iso);
  if (format === 'short') return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' });
  if (format === 'long') return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  return iso;
}
function daysUntil(iso) {
  const d = new Date(iso + 'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((d - today) / 86400000);
}

function secondsAgo(timestamp) {
  if (!timestamp) return '';
  const sec = Math.floor((Date.now() - timestamp) / 1000);
  if (sec < 5) return "À L'INSTANT";
  if (sec < 60) return sec + 's';
  const min = Math.floor(sec / 60);
  if (min < 60) return min + 'min';
  return Math.floor(min/60) + 'h';
}

// ============================================================
// MOTEUR DE RÉCURRENCE
// ============================================================
const DAY_NAMES_FR = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];
const DAY_NAMES_FR_FULL = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];

function isoDate(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// Génère toutes les instances d'une convocation entre deux dates
function getConvocInstances(convoc, fromISO, toISO) {
  const instances = [];
  const from = new Date(fromISO + 'T00:00:00');
  const to = new Date(toISO + 'T00:00:00');

  if (!convoc.recurrence) {
    // Pas de récurrence : juste la date elle-même si dans la plage
    const d = new Date(convoc.date + 'T00:00:00');
    if (d >= from && d <= to) {
      instances.push(makeConvocInstance(convoc, convoc.date));
    }
    return instances;
  }

  // Récurrence hebdo
  const r = convoc.recurrence;
  if (r.type === 'weekly' && r.days && r.days.length > 0) {
    const start = new Date(convoc.date + 'T00:00:00');
    const until = r.until ? new Date(r.until + 'T00:00:00') : new Date(to.getTime());
    // Parcourir jour par jour de start à min(to, until)
    const stopAt = until < to ? until : to;
    let cursor = new Date(Math.max(start.getTime(), from.getTime()));
    cursor.setHours(0,0,0,0);
    while (cursor <= stopAt) {
      if (cursor >= start && r.days.includes(cursor.getDay())) {
        const dateStr = isoDate(cursor);
        if (!(convoc.cancelledInstances || []).includes(dateStr)) {
          instances.push(makeConvocInstance(convoc, dateStr));
        }
      }
      cursor.setDate(cursor.getDate() + 1);
    }
  }

  return instances;
}

// Crée une instance enrichie (convoc + override éventuel + flag virtuel)
function makeConvocInstance(convoc, dateStr) {
  const override = (convoc.instanceOverrides || {})[dateStr] || {};
  return {
    ...convoc,
    date: dateStr,
    responses: override.responses || convoc.responses || {},
    note: override.note !== undefined ? override.note : convoc.note,
    title: override.title || convoc.title,
    location: override.location || convoc.location,
    time: override.time || convoc.time,
    attachments: override.attachments || convoc.attachments || [],
    _isInstance: true,
    _instanceDate: dateStr,
    _parentId: convoc.id,
    _instanceKey: convoc.id + '__' + dateStr,
    closed: (override.closed || convoc.closed) === true,
  };
}

// Tous les événements (instances) entre deux dates, triés.
// SAISON : on filtre les convocations sur state.currentSeasonId (les
// convocs legacy sans seasonId sont rattachées à la saison `active`).
// Pas d'argument de saison explicite : on s'appuie sur le state global,
// car les vues coach et joueuse partagent la même source. La joueuse a
// currentSeasonId forcé sur active au boot, donc le résultat est correct.
function getAllEventsBetween(fromISO, toISO) {
  const all = [];
  const convocs = currentSeasonConvocations();
  convocs.forEach(c => {
    getConvocInstances(c, fromISO, toISO).forEach(i => all.push(i));
  });
  return all.sort((a, b) => {
    if (a.date !== b.date) return a.date.localeCompare(b.date);
    return (a.time || '').localeCompare(b.time || '');
  });
}

// Annuler une instance précise d'une récurrence
function cancelInstance(parentId, dateStr) {
  const c = state.convocations.find(x => x.id === parentId);
  if (!c) return;
  c.cancelledInstances = c.cancelledInstances || [];
  if (!c.cancelledInstances.includes(dateStr)) {
    c.cancelledInstances.push(dateStr);
  }
  persist();
}

// Restaurer une instance annulée
function restoreInstance(parentId, dateStr) {
  const c = state.convocations.find(x => x.id === parentId);
  if (!c) return;
  c.cancelledInstances = (c.cancelledInstances || []).filter(d => d !== dateStr);
  persist();
}

function getCatLabel(cat) { return (PLAY_CATEGORIES.find(c => c.id === cat) || {}).label || ''; }
function getCatClass(cat) { return (PLAY_CATEGORIES.find(c => c.id === cat) || {}).class || ''; }
function getCatShort(cat) {
  return { off: 'OFF', def: 'DÉF', rem: 'REM', sp: 'SP', exo: 'EXO', con: 'CON' }[cat] || 'OFF';
}

function currentSections() {
  if (!state.auth) return [];
  if (state.auth.role === 'coach') return SECTIONS_COACH;
  if (state.auth.role === 'stat') return SECTIONS_STAT;
  return SECTIONS_PLAYER;
}

function currentPlayer() {
  if (!state.auth || state.auth.role !== 'player') return null;
  return state.players.find(p => p.id === state.auth.playerId);
}

function pickRole(role) {

  if (role === 'player') {

  } else {

function pickPlayer(pid) {
  state.authFlow.playerId = pid;

function pinKey(key) {
  if (key === 'exit') {
    state.authFlow = { stage: 'role', role: null, playerId: null, pinInput: '' };
    render(); return;
  }
  // Bloquer toute saisie si verrouillé (sauf exit)
  const { role, playerId } = state.authFlow;
  if (role) {
    const k = getRateLimitKey(role, playerId);
    if (getRemainingLockMs(k) > 0) return;
  }
  if (key === 'clear') { state.authFlow.pinInput = ''; state.authFlow.pinError = false; render(); return; }
  if (key === 'back') { state.authFlow.pinInput = state.authFlow.pinInput.slice(0, -1); state.authFlow.pinError = false; render(); return; }
  if (state.authFlow.pinInput.length >= 4) return;
  state.authFlow.pinInput += key;
  state.authFlow.pinError = false;
  if (state.authFlow.pinInput.length === 4) {
    setTimeout(() => tryPin(), 200);
  }
  render();
}
// Identifiant unique pour le rate-limit selon le rôle
function getRateLimitKey(role, playerId) {
  if (role === 'player') return 'player_' + playerId;
  return role; // 'coach' ou 'stat'
}

// Délai exponentiel APRÈS la 3e erreur
// Tentatives 1, 2, 3 = libres (0s)
// 4e échec = 5s, 5e = 10s, 6e = 20s, 7e = 40s, 8e = 80s, 9e = 160s, 10e+ = 300s (cap 5min)
function computeCooldown(failedCount) {
  if (failedCount <= 3) return 0;
  const base = 5;
  const exp = failedCount - 4;
  const delay = base * Math.pow(2, exp);
  return Math.min(delay * 1000, 300 * 1000);
}

function getRemainingLockMs(key) {
  const att = state.pinAttempts[key];
  if (!att || !att.lockedUntil) return 0;
  return Math.max(0, att.lockedUntil - Date.now());
}

async function tryPin() {
  const { role, playerId, pinInput } = state.authFlow;
  const key = getRateLimitKey(role, playerId);

  // Vérifier si encore en cooldown
  const remaining = getRemainingLockMs(key);
  if (remaining > 0) {
    state.authFlow.pinInput = '';
    render();
    return;
  }

  let valid = false;
  // 1) Tentative RPC Supabase (source de vérité si en ligne)
  if (window.SbPin) {
    try {
      const res = await SbPin.verify(role, playerId || null, pinInput);
      if (res.source === 'remote') valid = !!res.ok;
    } catch(e) { /* on retombe sur local */ }
  }
  // 2) Fallback local (compat 100 % avec l'existant si offline ou pas encore migré)
  if (!valid) {
    if (role === 'coach' && pinInput === (state.pins.coach || '1234')) valid = true;
    else if (role === 'stat' && pinInput === (state.pins.stat || '1234')) valid = true;
    else if (role === 'player') {
      const p = state.players.find(p => p.id === playerId);
      if (p && p.pin === pinInput) valid = true;
    }
  }

  if (valid) {
    // Reset compteur en cas de succès
    delete state.pinAttempts[key];
    state.auth = { role, playerId: role === 'player' ? playerId : null };
    // Email binding strict : si un compte cloud est déjà connecté, on lie cette
    // identité (player/coach) à ce compte. Stat = rôle partagé → pas de binding.
    try { _enforceEmailBinding(); } catch (e) {}
    state.authFlow = { stage: 'role', role: null, playerId: null, pinInput: '' };
    if (role === 'stat') state.section = 'live';
    else state.section = 'home';
    persist();
    // Dernière connexion : login frais d'une joueuse → tampon immédiat.
    try { _touchCurrentPlayerLastSeen(); } catch (e) {}
    render();
    return;
  }

  // Échec : incrémenter compteur
  state.pinAttempts[key] = state.pinAttempts[key] || { count: 0, lockedUntil: 0 };
  state.pinAttempts[key].count++;
  const cooldown = computeCooldown(state.pinAttempts[key].count);
  if (cooldown > 0) {
    state.pinAttempts[key].lockedUntil = Date.now() + cooldown;
  }
  state.authFlow.pinError = true;
  state.authFlow.pinInput = '';
  persist();
  render();

  // Démarrer un timer pour rafraîchir l'UI quand le cooldown se termine
  if (cooldown > 0) startCooldownTimer();
}

let _cooldownInterval = null;
function startCooldownTimer() {
  if (_cooldownInterval) return;
  _cooldownInterval = setInterval(() => {
    // Si on n'est plus sur l'écran de PIN, arrêter
    if (state.auth || !state.authFlow || state.authFlow.stage !== 'pin') {
      clearInterval(_cooldownInterval);
      _cooldownInterval = null;
      return;
    }
    const key = getRateLimitKey(state.authFlow.role, state.authFlow.playerId);
    const remaining = getRemainingLockMs(key);
    // Rafraîchir l'affichage pour mettre à jour le compte à rebours
    render();
    if (remaining === 0) {
      clearInterval(_cooldownInterval);
      _cooldownInterval = null;
    }
  }, 1000);
}

  // Maintenant : ouvre le menu réglages au lieu de demander confirmation brute
  openSettings();
}

function openModal(html) {
  let root = document.getElementById('modal-root');
  if (!root) {
    root = document.createElement('div');
    root.id = 'modal-root';
    document.body.appendChild(root);
  }
  root.innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-handle"></div>
        ${html}
      </div>
    </div>
  `;
  document.body.style.overflow = 'hidden';
  _pbModalPush();
}
function closeModal() {
  const r = document.getElementById('modal-root');
  if (r) r.innerHTML = '';
  document.body.style.overflow = '';
  // Révoque l'URL blob de l'export victoire challenge si présente (évite
  // de garder le JPEG en mémoire après fermeture du preview).
  if (state && state._challengeStoryUrl) {
    try { URL.revokeObjectURL(state._challengeStoryUrl); } catch {}
    state._challengeStoryUrl = null;
  }
  // BACK BUTTON : retire proprement l'entrée d'historique de la modal
  // (history.back) en ignorant le popstate qui en résulte.
  if (_pbModalDepth > 0 && !_pbInPop) {
    _pbModalDepth = 0;
    _pbSuppressPop = true;
    try { history.back(); } catch (e) { _pbSuppressPop = false; }
  }
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// --- Préservation du scroll des modales à re-render plein (full-repaint) ---
// openModal() reconstruit toute la .modal-body via innerHTML : tout re-render du
// même modal (ajout d'un groupe, retour depuis un sous-modal, etc.) repart en
// haut de liste. Le vrai conteneur scrollable est .modal (CSS : max-height:92vh;
// overflow-y:auto), PAS .modal-body (overflow:visible) → on écoute/restaure sur
// .modal. _modalScrollAttr(key) pose juste un marqueur data- sur .modal-body ;
// _restoreModalScroll(key) attache l'écouteur scroll sur .modal et y réapplique
// la position mémorisée dans state._modalScroll[key] (transient, non persisté),
// juste après openModal. La clé survit aux allers-retours modal → sous-modal →
// retour. (bugs #9b, #3)
function _modalScrollAttr(key) {
  return `data-scroll-key="${key}"`;
}
function _restoreModalScroll(key) {
  const m = document.querySelector('#modal-root .modal');
  if (!m) return;
  m.addEventListener('scroll', () => {
    state._modalScroll = state._modalScroll || {};
    state._modalScroll[key] = m.scrollTop;
  });
  if (state._modalScroll && state._modalScroll[key] != null) m.scrollTop = state._modalScroll[key];
}

// ============================================================
// FILE TO BASE64
// ============================================================
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

// ============================================================
// ATTACHMENTS UNIVERSEL (images + PDF)
// ============================================================
// Format : { id, type: 'image'|'pdf', name, data (base64), size }

function isImageFile(file) { return file.type.startsWith('image/'); }
function isPdfFile(file) { return file.type === 'application/pdf'; }

async function makeAttachment(file) {
  const data = await fileToBase64(file);
  return {
    id: uid(),
    type: isImageFile(file) ? 'image' : isPdfFile(file) ? 'pdf' : 'other',
    name: file.name,
    data,
    size: file.size
  };
}

// Render universel d'une liste d'attachments
function renderAttachments(attachments, canEdit, deleteCallback) {
  if (!attachments || attachments.length === 0) return '';
  return `
    <div class="attachments-grid">
      ${attachments.map((a, i) => {
        if (a.type === 'image') {
          return `
            <div class="attachment-tile" onclick="viewImage('${a.data.replace(/'/g, "\\'")}')">
              <img src="${a.data}" alt="${esc(a.name)}">
              ${canEdit ? `<button class="attachment-delete" onclick="event.stopPropagation();${deleteCallback}(${i})">✕</button>` : ''}
            </div>
          `;
        }
        if (a.type === 'pdf') {
          return `
            <div class="attachment-tile attachment-pdf" onclick="viewPdf('${a.id}', '${a.data.replace(/'/g, "\\'")}', '${esc(a.name).replace(/'/g, "\\'")}')">

              ${canEdit ? `<button class="attachment-delete" onclick="event.stopPropagation();${deleteCallback}(${i})">✕</button>` : ''}
            </div>
          `;
        }
        return '';
      }).join('')}
    </div>
  `;
}

function createSeasonFromModal() {
  const id = (document.getElementById('ns-id').value || '').trim();
  const name = (document.getElementById('ns-name').value || '').trim();
  const startDate = document.getElementById('ns-start').value;
  const endDate = document.getElementById('ns-end').value;
  if (!id) return alert('ID de saison requis.');
  if ((state.seasons || []).find(s => s.id === id)) return alert('Une saison avec cet ID existe déjà.');
  if (!name) return alert('Nom de saison requis.');
  if (!startDate || !endDate) return alert('Dates de début et de fin requises.');
  if (startDate >= endDate) return alert('La date de fin doit être après la date de début.');

  const clonePlayers = document.getElementById('ns-clone-players').checked;
  const clonePlays = document.getElementById('ns-clone-plays').checked;
  const sourceSeasonId = state.currentSeasonId;

  // 1. Crée la saison en draft
  state.seasons = state.seasons || [];
  state.seasons.push({
    id, name, startDate, endDate, status: 'draft',
    createdAt: Date.now(), activatedAt: null, archivedAt: null
  });

  // 2. Clone effectif si demandé
  if (clonePlayers && sourceSeasonId) {
    state.seasonPlayers = state.seasonPlayers || [];
    const fromLinks = state.seasonPlayers.filter(sp => sp.seasonId === sourceSeasonId && !sp.leftAt);
    fromLinks.forEach(link => {
      // Évite doublons (sécurité, ne devrait pas arriver)
      if (state.seasonPlayers.find(sp => sp.seasonId === id && sp.playerId === link.playerId)) return;
      state.seasonPlayers.push({
        seasonId: id, playerId: link.playerId,
        joinedAt: startDate, leftAt: '', role: ''
      });
    });
  }

  // 3. Clone plays actifs si demandé
  if (clonePlays && sourceSeasonId) {
    state.seasonPlays = state.seasonPlays || [];
    const fromLinks = state.seasonPlays.filter(sp => sp.seasonId === sourceSeasonId && sp.active !== false);
    fromLinks.forEach(link => {
      if (state.seasonPlays.find(sp => sp.seasonId === id && sp.playId === link.playId)) return;
      state.seasonPlays.push({ seasonId: id, playId: link.playId, active: true });
    });
  }

  persist();
  closeModal();
  setTimeout(() => {
    alert('✓ Saison créée en brouillon.\n\nTu y es maintenant. Active-la depuis l\'écran Saisons quand tu seras prêt.');
    setCurrentSeasonId(id);
  }, 50);
}

async function confirmActivateSeason(id) {
  const target = (state.seasons || []).find(s => s.id === id);
  if (!target || target.status !== 'draft') return;
  const active = (state.seasons || []).find(s => s.status === 'active');
  const msg = active
    ? `Activer "${target.name}" ?\n\nLa saison active "${active.name}" sera archivée. Les joueuses verront immédiatement la nouvelle saison.\n\nContinuer ?`
    : `Activer "${target.name}" ?\n\nLes joueuses la verront immédiatement.\n\nContinuer ?`;
  if (!confirm(msg)) return;

  const now = Date.now();

  // SAISON · Activation atomique : on tente d'abord la RPC `activate_season`
  // (transaction côté BD : archive active + active draft dans le même order).
  // Si la RPC échoue (migration pas encore appliquée → 404, ou autre erreur),
  // on retombe sur le pattern legacy 2 UPDATE séquentiels via PbSync.
  let rpcOk = false;
  if (window.sb) {
    try {
      const { error } = await sb.rpc('activate_season', { target_id: id });
      if (!error) {
        rpcOk = true;
      } else {
        console.warn('[season] activate_season RPC failed, fallback to 2-step:', error.message);
      }
    } catch (e) {
      console.warn('[season] activate_season RPC threw, fallback to 2-step:', e.message);
    }
  }

  // Mise à jour optimiste du state local (que la RPC ait réussi ou non —
  // dans les deux cas l'état final attendu est le même : target=active,
  // active=archived). Si la RPC a réussi, PbSync va re-fetcher et corriger
  // si besoin. Si fallback, PbSync push les 2 UPDATE séquentiels.
  if (active) {
    active.status = 'archived';
    active.archivedAt = now;
  }
  target.status = 'active';
  target.activatedAt = now;

  state.currentSeasonId = id;
  persist();
  closeModal();
  setTimeout(() => alert(rpcOk
    ? '✓ Saison activée.'
    : '✓ Saison activée (mode legacy).'
  ), 50);
  render();
}

function confirmArchiveSeason(id) {
  const target = (state.seasons || []).find(s => s.id === id);
  if (!target || target.status !== 'active') return;
  if (!confirm(`Archiver la saison "${target.name}" ?\n\nL'app n'aura plus de saison active jusqu'à ce que tu en crées/actives une nouvelle. Les joueuses ne verront plus rien.\n\nContinuer ?`)) return;
  target.status = 'archived';
  target.archivedAt = Date.now();
  persist();
  closeModal();
  render();
}

    .map(link => ({ link, player: (state.players || []).find(p => p.id === link.playerId) }))

    ? '<span style="font-size:9px;font-family:\'JetBrains Mono\';color:#ff6b00;background:rgba(255,107,0,0.10);padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:0.06em">Brouillon</span>'

      ? '<span style="font-size:9px;font-family:\'JetBrains Mono\';color:#888;background:rgba(128,128,128,0.10);padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:0.06em">Archivée</span>'
      : '<span style="font-size:9px;font-family:\'JetBrains Mono\';color:#22c55e;background:rgba(34,197,94,0.10);padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:0.06em">● Active</span>';

      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        ${statusTag}
        ${readOnly ? '<span style="font-size:10px;color:var(--ink-3);font-family:\'JetBrains Mono\';text-transform:uppercase">🔒 Lecture seule</span>' : ''}
      </div>

      ${readOnly ? '' : `
        <button class="btn btn-primary btn-block mb-2" onclick="openAddPlayersToSeasonModal()">+ Ajouter joueuse à la saison</button>
        <button class="btn btn-secondary btn-block mb-3" onclick="openCreateNewPlayerForSeason()">+ Créer une nouvelle joueuse</button>
      `}

      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;padding:8px 10px;background:var(--bg-3);border-radius:6px;margin-bottom:10px">
        <input type="checkbox" ${showHistory ? 'checked' : ''} onchange="toggleSeasonRosterHistory()">
        <span>Afficher l'historique (joueuses parties)</span>
      </label>

      ${active.length === 0 ? `
        <div class="empty" style="padding:18px">
          <div class="empty-icon">○</div>
          <div class="empty-title">Aucune joueuse dans cet effectif</div>

        </div>

        <div style="display:flex;flex-direction:column;gap:6px">

              ${p.photo ? `<img src="${p.photo}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--orange)">` : `<div style="width:36px;height:36px;border-radius:50%;background:var(--bg-3);display:flex;align-items:center;justify-content:center;font-family:'Anton';font-size:14px;color:var(--orange);border:2px solid var(--border)">${esc((p.name||'?').charAt(0).toUpperCase())}</div>`}
              <div style="font-family:'Anton';font-size:16px;color:var(--orange);min-width:36px">#${p.num}</div>
              <div style="flex:1;min-width:0">
                <div style="font-family:'Anton';text-transform:uppercase;font-size:13px">${esc(p.name)}</div>
                ${(() => { const ls = _lastSeenBadge(p.lastSeenAt); return `<div style="font-size:9px;color:${ls.color};font-family:'JetBrains Mono';margin-top:2px"><span style="font-size:7px;vertical-align:middle">${ls.dot}</span> ${ls.label}</div>`; })()}

            ${left.map(({ link, player: p }) => `
              <div style="display:flex;align-items:center;gap:8px;padding:10px;background:var(--bg-1);border-radius:8px;border:1px solid var(--border);opacity:0.6">

          </div>
        </div>
      ` : ''}
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary btn-block" onclick="closeModal();setTimeout(()=>managePlayers(),50)">Gérer PIN / photos (roster global) →</button>
      <button class="btn btn-primary btn-block" onclick="closeModal();render()">Terminé</button>

// Format court "DD/MM/YYYY" depuis un ISO date "YYYY-MM-DD"
function formatLeftDate(iso) {
  if (!iso) return '';
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return iso;
  return m[3] + '/' + m[2] + '/' + m[1];
}

// Sous-modal : liste des joueuses du roster global PAS dans la saison
// courante (ou avec leftAt set). Coche celles à ajouter.
function openAddPlayersToSeasonModal() {
  const seasonId = state.currentSeasonId;
  if (!seasonId) return;
  if (isCurrentSeasonReadOnly()) return;

  // IDs présents ET non partis dans la saison
  const presentIds = new Set(
    (state.seasonPlayers || [])
      .filter(sp => sp.seasonId === seasonId && !sp.leftAt)
      .map(sp => sp.playerId)
  );

  // Roster global moins celles déjà dans la saison (mais on autorise à
  // re-ajouter celles parties : leur link existe avec leftAt)
  const candidates = (state.players || [])
    .filter(p => !presentIds.has(p.id))
    .sort((a, b) => (a.num || 0) - (b.num || 0));

  closeModal();
  setTimeout(() => {
    openModal(`
      <div class="modal-header">
        <div class="modal-title">+ Ajouter à la saison</div>
        <button class="modal-close" onclick="closeModal();setTimeout(()=>openSeasonRosterEditor(),50)">✕</button>
      </div>
      <div class="modal-body">
        <div style="padding:10px 12px;background:var(--bg-3);border-left:3px solid var(--orange);border-radius:6px;margin-bottom:14px;font-size:11px;color:var(--ink-2);line-height:1.5">
          Coche les joueuses à intégrer à la saison courante. Tu peux aussi <strong>créer une nouvelle joueuse</strong> depuis l'écran précédent.
        </div>
        ${candidates.length === 0 ? `
          <div class="empty" style="padding:18px">
            <div class="empty-icon">✓</div>
            <div class="empty-title">Toutes les joueuses sont déjà dans la saison</div>
            <div class="empty-desc">Crée une nouvelle joueuse depuis l'écran précédent</div>
          </div>
        ` : `
          <div style="display:flex;flex-direction:column;gap:6px">
            ${candidates.map(p => {
              // Si elle a déjà un link parti, on l'indique
              const oldLink = (state.seasonPlayers || []).find(sp => sp.seasonId === seasonId && sp.playerId === p.id && sp.leftAt);
              return `
                <label style="display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg-1);border-radius:8px;border:1px solid var(--border);cursor:pointer">
                  <input type="checkbox" class="sp-add-cb" data-pid="${esc(p.id)}" style="width:18px;height:18px">
                  <div style="font-family:'Anton';font-size:16px;color:var(--orange);min-width:32px">#${p.num}</div>
                  <div style="flex:1;font-family:'Anton';text-transform:uppercase;font-size:13px">${esc(p.name)}</div>
                  ${oldLink ? `<span style="font-size:9px;color:var(--orange);font-family:'JetBrains Mono';text-transform:uppercase">↺ Réintégration</span>` : ''}
                </label>
              `;
            }).join('')}
          </div>
        `}
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-block" onclick="closeModal();setTimeout(()=>openSeasonRosterEditor(),50)">Annuler</button>
        ${candidates.length === 0 ? '' : '<button class="btn btn-primary btn-block" onclick="confirmAddSelectedPlayersToSeason()">Ajouter à la saison</button>'}
      </div>
    `);
  }, 50);
}

function confirmAddSelectedPlayersToSeason() {
  const seasonId = state.currentSeasonId;
  if (!seasonId) return;
  if (isCurrentSeasonReadOnly()) return;
  const checks = document.querySelectorAll('.sp-add-cb');
  const ids = [];
  checks.forEach(cb => { if (cb.checked) ids.push(cb.getAttribute('data-pid')); });
  if (ids.length === 0) { alert('Aucune joueuse sélectionnée.'); return; }
  const today = isoDate(new Date());
  state.seasonPlayers = state.seasonPlayers || [];
  ids.forEach(pid => {
    // Si link existant (cas réintégration) : on resette leftAt et on bump joinedAt
    const existing = state.seasonPlayers.find(sp => sp.seasonId === seasonId && sp.playerId === pid);
    if (existing) {
      existing.leftAt = '';
      if (!existing.joinedAt) existing.joinedAt = today;
    } else {
      state.seasonPlayers.push({ seasonId, playerId: pid, joinedAt: today, leftAt: '', role: '' });
    }
  });
  persist();
  closeModal();
  setTimeout(() => {
    alert(`✓ ${ids.length} joueuse${ids.length>1?'s':''} ajoutée${ids.length>1?'s':''} à la saison.`);
    openSeasonRosterEditor();
  }, 50);
}

function createNewPlayerForSeason() {
  const seasonId = state.currentSeasonId;
  if (!seasonId) return;
  if (isCurrentSeasonReadOnly()) return;
  const name = (document.getElementById('snp-name').value || '').trim();
  const num = parseInt(document.getElementById('snp-num').value) || 0;
  if (!name) { alert('Le prénom est requis.'); return; }
  const newP = { id: uid(), name, num, pin: '0000' };
  state.players = state.players || [];
  state.players.push(newP);
  // Push roster global (PbStore.upsertPlayer = pattern existant)
  if (window.PbStore) PbStore.upsertPlayer(newP).catch(e => console.warn('[sync] upsertPlayer:', e.message));
  // Ajoute à la saison
  state.seasonPlayers = state.seasonPlayers || [];
  state.seasonPlayers.push({
    seasonId, playerId: newP.id,
    joinedAt: isoDate(new Date()), leftAt: '', role: ''

  const seasonId = state.currentSeasonId;
  if (!seasonId) return;
  if (isCurrentSeasonReadOnly()) return;
  const p = (state.players || []).find(x => x.id === playerId);
  if (!p) return;
  if (!confirm(`Retirer ${p.name} de la saison ?\n\nLa joueuse reste dans le roster global et son historique est conservé. Tu pourras la réintégrer plus tard.`)) return;
  const link = (state.seasonPlayers || []).find(sp => sp.seasonId === seasonId && sp.playerId === playerId);
  if (!link) return;
  link.leftAt = isoDate(new Date());
  persist();
  openSeasonRosterEditor();
}

  openSeasonRosterEditor();
}

// ============================================================
// EMAIL BINDING STRICT
// ------------------------------------------------------------
// Player/coach = associé à un compte cloud UNIQUE (1 email = 1 personne).
// Stat'man = rôle partagé/anonyme → jamais de compte associé, jamais d'auto-logout.
// Règle : si l'identité applicative (state.auth) est liée à un compte cloud
// (boundUserId) et que le compte cloud ACTIF devient un AUTRE compte (email
// différent), la personne au clavier n'est plus la titulaire → déconnexion
// stricte de l'identité applicative.
// Volontairement LENIENT sur la déconnexion cloud (curUserId null) : au boot la
// session cloud se restaure de façon asynchrone, et un coach peut vouloir se
// déconnecter du cloud tout en gardant l'accès PIN. On ne déconnecte donc QUE
// sur bascule vers un compte différent et non-null (vrai changement d'email).
// ============================================================
function _enforceEmailBinding() {
  if (!state || !state.auth) return;
  if (state.auth.role === 'stat') return; // rôle partagé : aucun binding
  const curUserId = (window.Pb && Pb.user && Pb.user.id) || null;
  const curEmail = (window.Pb && Pb.user && Pb.user.email) || null;
  const bound = state.auth.boundUserId || null;

  if (!bound) {
    // Pas encore lié : si un compte cloud est présent, on lie cette identité à lui.
    if (curUserId) {
      state.auth.boundUserId = curUserId;
      state.auth.boundEmail = curEmail;
      persist();
    }
    return;
  }
  // Déjà lié : bascule vers un AUTRE compte cloud non-null → binding rompu.
  if (curUserId && curUserId !== bound) {
    console.warn('[auth] email binding rompu (' + (state.auth.boundEmail || bound) + ' → ' + (curEmail || curUserId) + ') → déconnexion auto');
    _autoLogoutBindingBroken();
  }
}

function _autoLogoutBindingBroken() {
  state.auth = null;
  state.authFlow = { stage: 'role', role: null, playerId: null, pinInput: '' };
  state.view = null;
  state.live = null;
  persist();
  try { closeModal(); } catch (e) {}
  render();
  setTimeout(() => { try { alert('Compte cloud changé — déconnexion automatique par sécurité. Reconnecte-toi avec ton identité.'); } catch (e) {} }, 60);
}

function saveMyPin() {
  const role = state.auth.role;
  const player = currentPlayer();
  const currentPin = role === 'player' ? player.pin : state.pins[role];

  const oldVal = document.getElementById('pin-old').value;
  const newVal = document.getElementById('pin-new').value;
  const confirmVal = document.getElementById('pin-confirm').value;
  const errEl = document.getElementById('pin-error');

  function showErr(msg) {
    errEl.style.display = 'block';
    errEl.textContent = msg;
  }

  if (oldVal !== currentPin) return showErr('✕ Code actuel incorrect');
  if (!/^\d{4}$/.test(newVal)) return showErr('✕ Le nouveau code doit être 4 chiffres');
  if (newVal !== confirmVal) return showErr('✕ Les codes ne correspondent pas');

  if (role === 'player') {
    player.pin = newVal;
  } else {
    state.pins[role] = newVal;
  }
  persist();
  closeModal();
  setTimeout(() => alert('✓ Code PIN modifié'), 200);
}
