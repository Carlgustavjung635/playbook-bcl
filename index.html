            ${isCoach ? `<button class="btn btn-icon" onclick="deleteChallenge('${c.id}')" style="color:var(--red)">🗑</button>` : ''}
          </div>
        `).join('')}
      </div>
    ` : ''}
  `;
}

// Création rapide depuis une idée pré-remplie
function createChallengeFromIdea(idea) {
  const challenge = {
    id: uid(),
    title: idea.title,
    desc: idea.desc,
    scope: idea.scope,
    type: idea.scope === 'collective' ? 'collective' : 'skill',
    metric: idea.metric,
    endDate: '',
    scores: {},
  };
  if (idea.scope === 'collective') {
    challenge.target = idea.target;
    challenge.teamScore = 0;
  }
  state.challenges.unshift(challenge);
  persist();
  render();
}

function challengeCard(c, isCoach) {
  const scores = c.scores || {};
  const isCollective = c.scope === 'collective';
  const isAuto = c.autoCount;
  const scopeBadge = isCollective ? '🤝 Collectif' : (c.scope === 'season' ? '📅 Saison' : '🎯 Individuel');
  const scopeColor = isCollective ? 'chip-purple' : (c.scope === 'season' ? 'chip-blue' : 'chip-orange');

  // === MODE COLLECTIF : compteur somme des contributions individuelles ===
  if (isCollective) {
    // Total = somme des contributions de chaque joueuse
    const contributors = state.players.map(pl => ({ player: pl, score: (c.scores || {})[pl.id] || 0 }));
    const teamScore = contributors.reduce((acc, x) => acc + x.score, 0);
    const target = c.target || 1;
    const pct = Math.min(100, Math.round((teamScore / target) * 100));
    const done = teamScore >= target;
    // Top contributrices (>0, triées)
    const topContributors = contributors.filter(x => x.score > 0).sort((a, b) => b.score - a.score);
    const isPlayer = state.auth.role === 'player';
    const myPid = isPlayer ? state.auth.playerId : null;
    const myContrib = myPid ? ((c.scores || {})[myPid] || 0) : 0;

    return `
      <div class="list-section">
        <div style="padding:14px 16px;border-bottom:1px solid var(--border-soft)">
          <div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap">
            <span class="chip ${scopeColor}">${scopeBadge}</span>
            ${c.endDate ? `<span class="chip">Fin ${formatDate(c.endDate)}</span>` : ''}
            ${done ? `<span class="chip chip-green">✓ Objectif atteint</span>` : ''}
          </div>
          <div style="font-family:'Anton';font-size:18px;text-transform:uppercase;letter-spacing:0.02em;margin-bottom:4px">${esc(c.title)}</div>
          <div style="font-size:12px;color:var(--ink-3);line-height:1.5;margin-bottom:14px">${esc(c.desc)}</div>

          <!-- Compteur collectif géant -->
          <div style="text-align:center;padding:18px;background:var(--bg-2);border-radius:12px;border:1px solid ${done?'var(--green)':'var(--orange)'};margin-bottom:12px">
            <div style="display:flex;align-items:baseline;justify-content:center;gap:8px;margin-bottom:6px">
              <div style="font-family:'Anton';font-size:48px;color:${done?'var(--green)':'var(--orange)'};line-height:1">${teamScore}</div>
              <div style="font-family:'Anton';font-size:24px;color:var(--ink-4);line-height:1">/ ${target}</div>
            </div>
            <div style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px">${esc(c.metric)} · ${pct}%</div>
            <div style="height:8px;background:var(--bg-1);border-radius:4px;overflow:hidden;position:relative">
              <div style="position:absolute;top:0;left:0;height:100%;width:${pct}%;background:linear-gradient(90deg,var(--orange),${done?'var(--green)':'#cc5400'});transition:width 0.3s"></div>
            </div>
          </div>

          ${isPlayer && myPid ? `
            <div style="text-align:center;margin-bottom:10px;padding:10px;background:rgba(255,107,0,0.06);border-radius:8px">
              <div style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.06em">Ma contribution</div>
              <div style="font-family:'Anton';font-size:24px;color:var(--orange);margin-top:2px">${myContrib} <span style="font-size:14px;color:var(--ink-3)">${esc(c.metric)}</span></div>
            </div>
          ` : ''}

          ${!done ? `
            <!-- Boutons d'ajout : pour la joueuse, contribution perso. Pour le coach, choisir qui contribue -->
            ${isPlayer ? `
              <div style="display:flex;gap:4px;justify-content:center;flex-wrap:wrap">
                <button class="btn btn-secondary" onclick="contributeToCollective('${c.id}','${myPid}', 1)" style="min-width:56px;font-family:'Anton';font-size:14px">+1</button>
                <button class="btn btn-secondary" onclick="contributeToCollective('${c.id}','${myPid}', 5)" style="min-width:56px;font-family:'Anton';font-size:14px">+5</button>
                <button class="btn btn-secondary" onclick="contributeToCollective('${c.id}','${myPid}', 10)" style="min-width:56px;font-family:'Anton';font-size:14px">+10</button>
                <button class="btn btn-primary" onclick="contributeToCollectiveCustom('${c.id}','${myPid}')" style="min-width:64px;font-family:'Anton';font-size:14px">+ Custom</button>
              </div>
              <div style="text-align:center;margin-top:8px;font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase">Tape pour ajouter à TA contribution</div>
            ` : `
              <button class="btn btn-primary btn-block" onclick="openCollectiveContributor('${c.id}')">+ Ajouter une contribution</button>
              <div style="text-align:center;margin-top:8px;font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase">Choisis la joueuse qui contribue</div>
            `}
          ` : `
            <div style="text-align:center;padding:10px;font-family:'Anton';color:var(--green);font-size:16px;text-transform:uppercase;letter-spacing:0.04em">🎉 Objectif atteint !</div>
          `}

          ${isCoach ? `
            <div style="display:flex;gap:4px;margin-top:12px;justify-content:flex-end;flex-wrap:wrap">
              ${!c.badgesAwarded ? `<button class="btn btn-secondary" onclick="closeChallengeNow('${c.id}')" style="font-size:10px;padding:6px 10px">🏁 Clôturer & attribuer trophées</button>` : '<span class="chip chip-green">🏆 Trophées attribués</span>'}
              <button class="btn btn-icon" onclick="editChallenge('${c.id}')" title="Modifier">✎</button>
              <button class="btn btn-icon" onclick="resetCollective('${c.id}')" title="Réinitialiser le compteur">↺</button>
              <button class="btn btn-icon" onclick="deleteChallenge('${c.id}')" style="color:var(--red)">🗑</button>
            </div>
          ` : ''}
        </div>

        ${topContributors.length > 0 ? `
          <div style="padding:10px 16px 4px;font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.06em">Top contributrices · ${topContributors.length} joueuses</div>
          ${topContributors.map((x, i) => {
            const medal = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
            const isMine = myPid && x.player.id === myPid;
            const contribPct = teamScore > 0 ? Math.round((x.score / teamScore) * 100) : 0;
            return `
              <div class="lb-row${isMine?' lb-row-me':''}">
                <div class="lb-medal ${medal}">${medal ? (i===0?'🥇':i===1?'🥈':'🥉') : (i+1)}</div>
                <div>
                  <div style="font-family:'Anton';font-size:13px;text-transform:uppercase">${isMine ? '⭐ ' : ''}#${x.player.num} ${esc(x.player.name)}${isMine ? ' · TOI' : ''}</div>
                  <div class="lb-progress"><div class="lb-progress-fill" style="width:${contribPct}%"></div></div>
                </div>
                <div style="text-align:right">
                  <div style="font-family:'Anton';font-size:18px;color:${isMine?'var(--orange)':'var(--ink)'}">${x.score}</div>
                  <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase">${contribPct}%</div>
                </div>
              </div>
            `;
          }).join('')}
        ` : '<div style="padding:14px;text-align:center;color:var(--ink-3);font-size:11px;font-style:italic;font-family:\'JetBrains Mono\'">Aucune contribution pour le moment</div>'}
      </div>
    `;
  }

  // === MODE INDIVIDUEL / SAISON : classement entre joueuses ===
  const entries = state.players.map(p => ({ id: p.id, name: p.name, num: p.num, score: scores[p.id] || 0 }));
  if (c.lowerIsBetter) {
    entries.sort((a,b) => a.score - b.score);
  } else {
    entries.sort((a,b) => b.score - a.score);
  }
  const max = Math.max(...entries.map(e => e.score), 1);

  return `
    <div class="list-section">
      <div style="padding:14px 16px;border-bottom:1px solid var(--border-soft)">
        <div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap">
          <span class="chip ${scopeColor}">${scopeBadge}</span>
          ${isAuto ? `<span class="chip chip-purple">AUTO</span>` : ''}
          ${c.endDate ? `<span class="chip">Fin ${formatDate(c.endDate)}</span>` : ''}
        </div>
        <div style="font-family:'Anton';font-size:18px;text-transform:uppercase;letter-spacing:0.02em;margin-bottom:4px">${esc(c.title)}</div>
        <div style="font-size:12px;color:var(--ink-3);line-height:1.5">${esc(c.desc)}</div>
        ${isAuto ? `<div style="margin-top:8px;font-size:11px;color:var(--orange);font-family:'JetBrains Mono'">⚙ Compte automatiquement</div>` : ''}
        ${isCoach ? `

        ` : ''}

        const medal = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
        const myPid = state.auth && state.auth.role === 'player' ? state.auth.playerId : null;
        const isMine = myPid && myPid === e.id;
        const canEdit = !isAuto && (isCoach || isMine);
        const clickAttr = canEdit ? `onclick="updateChallengeScore('${c.id}','${e.id}')"` : '';
        return `
          <div class="lb-row${isMine ? ' lb-row-me' : ''}" ${clickAttr} style="${canEdit ? '' : 'cursor:default'}">
            <div class="lb-medal ${medal}">${i + 1}</div>
            <div>
              <div style="font-family:'Anton';font-size:14px;text-transform:uppercase">${isMine ? '⭐ ' : ''}#${e.num} ${esc(e.name)}${isMine ? ' · TOI' : ''}</div>
              <div class="lb-progress"><div class="lb-progress-fill" style="width:${(e.score/max)*100}%"></div></div>
            </div>
            <div style="display:flex;align-items:center;gap:6px">
              ${isMine && !isAuto ? `<button class="lb-quick-btn" onclick="event.stopPropagation();quickIncrementChallenge('${c.id}','${e.id}',1)" title="+1">+1</button>` : ''}
              <div style="text-align:right">
                <div style="font-family:'Anton';font-size:20px;color:${isMine?'var(--orange)':'var(--ink)'}">${e.score}</div>
                <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase">${esc(c.metric)}</div>
              </div>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

// Ajouter une contribution d'une joueuse à un challenge collectif
function contributeToCollective(cid, pid, delta) {
  const c = state.challenges.find(x => x.id === cid);
  if (!c || c.scope !== 'collective') return;
  if (!pid) { alert('Aucune joueuse sélectionnée'); return; }
  c.scores = c.scores || {};
  const before = Object.values(c.scores).reduce((a,b) => a+b, 0);
  c.scores[pid] = Math.max(0, (c.scores[pid] || 0) + delta);
  const after = Object.values(c.scores).reduce((a,b) => a+b, 0);
  persist();
  render();
  // Confirmation visuelle si on vient d'atteindre l'objectif
  if (after >= (c.target || 0) && before < (c.target || 0)) {
    setTimeout(() => alert('🎉 Objectif équipe atteint !\n\n' + c.title + '\n' + after + ' / ' + c.target + ' ' + c.metric), 100);
  }
}

function contributeToCollectiveCustom(cid, pid) {
  const c = state.challenges.find(x => x.id === cid);
  if (!c) return;
  const val = prompt('Combien ajouter à TA contribution sur "' + c.title + '" ?', '1');
  if (val === null) return;
  const n = parseInt(val);
  if (isNaN(n) || n === 0) return;
  contributeToCollective(cid, pid, n);
}

// Clôturer un défi manuellement : attribuer les badges immédiatement
const BADGE_MEDALS = ['🥇', '🥈', '🥉'];

function renderBadge(b) {
  const medal = BADGE_MEDALS[(b.rank || 1) - 1] || '🏆';
  const rankLabel = b.rank === 1 ? '1ère' : b.rank === 2 ? '2ème' : b.rank === 3 ? '3ème' : '';
  const dateLabel = b.date ? formatDate(b.date, 'short') : '';
  return `
    <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)">
      <div style="font-size:26px;line-height:1">${medal}</div>

        <div style="font-family:'Anton';font-size:14px;text-transform:uppercase;letter-spacing:0.02em;line-height:1.2">${esc(b.challengeTitle || 'Trophée')}</div>
        <div style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.04em;margin-top:3px">${rankLabel}${rankLabel ? ' · ' : ''}${b.score || 0} ${esc(b.metric || '')}${dateLabel ? ' · ' + dateLabel : ''}</div>
      </div>
    </div>
  `;
}

function closeChallengeNow(cid) {
  const c = state.challenges.find(x => x.id === cid);
  if (!c) return;
  // Calculer le podium actuel
  const scores = c.scores || {};
  const entries = state.players.map(p => ({ pid: p.id, name: p.name, score: scores[p.id] || 0 }));
  if (c.lowerIsBetter) entries.sort((a,b) => a.score - b.score);
  else entries.sort((a,b) => b.score - a.score);
  const podium = entries.filter(e => e.score > 0).slice(0, 3);

  if (podium.length === 0) {
    alert('Aucune contribution pour le moment · personne ne peut recevoir de trophée');
    return;
  }

  const msg = 'Clôturer ce défi maintenant ?\n\nPodium :\n' + podium.map((e, i) => `${BADGE_MEDALS[i]} ${e.name} · ${e.score} ${c.metric}`).join('\n') + '\n\nLes trophées seront ajoutés au palmarès des joueuses concernées.';
  if (!confirm(msg)) return;

  podium.forEach((e, i) => {
    const player = state.players.find(p => p.id === e.pid);
    if (!player) return;
    player.badges = player.badges || [];
    if (player.badges.find(b => b.challengeId === c.id)) return;
    player.badges.push({
      id: uid(),
      challengeId: c.id,
      challengeTitle: c.title,
      rank: i + 1,
      score: e.score,
      metric: c.metric,
      scope: c.scope,
      date: new Date().toISOString().slice(0,10),
    });
  });
  c.badgesAwarded = true;
  // Si pas de endDate, la fixer à aujourd'hui pour l'archivage
  if (!c.endDate) c.endDate = new Date().toISOString().slice(0,10);
  persist();
  alert('🏆 Trophées attribués !');
  render();
}

function resetCollective(cid) {
  if (!confirm('Réinitialiser TOUTES les contributions à 0 ?')) return;
  const c = state.challenges.find(x => x.id === cid);

  c.scores = {};
  c.teamScore = 0;
  persist();
  render();
}

function updateChallengeScore(cid, pid) {
  const c = state.challenges.find(x => x.id === cid);
  const p = state.players.find(x => x.id === pid);
  // Verrouiller pour joueuse : elle ne peut éditer que son propre score
  if (state.auth.role === 'player' && state.auth.playerId !== pid) {
    return; // safety
  }
  if (c.autoCount) return; // auto : non éditable
  const current = (c.scores || {})[pid] || 0;
  const isMine = state.auth.role === 'player';
  openModal(`
    <div class="modal-header">
      <div>
        <div class="eyebrow">${esc(c.title)}</div>
        <div class="modal-title">${isMine ? 'Mon score' : esc(p.name)}</div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div style="font-size:12px;color:var(--ink-2);margin-bottom:14px;line-height:1.5">${esc(c.desc || '')}</div>
      <div style="display:flex;align-items:center;gap:14px;padding:14px;background:var(--bg-2);border-radius:10px;margin-bottom:14px">
        <button class="btn btn-secondary" onclick="document.getElementById('sc-val').value = Math.max(0, parseInt(document.getElementById('sc-val').value)-1)" style="width:48px;height:48px;font-size:24px;padding:0">−</button>

        <button class="btn btn-primary" onclick="document.getElementById('sc-val').value = (parseInt(document.getElementById('sc-val').value)||0)+1" style="width:48px;height:48px;font-size:24px;padding:0">+</button>
      </div>
      <div style="text-align:center;font-size:11px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.06em">${esc(c.metric)}</div>
      ${isMine ? `<div style="margin-top:14px;padding:10px;background:rgba(255,107,0,0.08);border-left:3px solid var(--orange);border-radius:6px;font-size:11px;color:var(--ink-2);line-height:1.5">💪 Sois honnête ! C'est ton défi. Ton score est public dans le classement.</div>` : ''}
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="saveChallengeScore('${cid}','${pid}')">Enregistrer</button>
    </div>
  `);
  setTimeout(() => { const i = document.getElementById('sc-val'); if (i) { i.focus(); i.select(); } }, 100);
}

function quickIncrementChallenge(cid, pid, delta) {
  const c = state.challenges.find(x => x.id === cid);
  if (!c || c.autoCount) return;
  if (state.auth.role === 'player' && state.auth.playerId !== pid) return;
  c.scores = c.scores || {};
  c.scores[pid] = Math.max(0, (c.scores[pid] || 0) + delta);
  persist();
  render();
}
function saveChallengeScore(cid, pid) {
  const c = state.challenges.find(x => x.id === cid);
  c.scores = c.scores || {};
  c.scores[pid] = parseInt(document.getElementById('sc-val').value) || 0;
  persist(); closeModal(); render();
}

    </div>
  `);
}
function saveChallenge(id, isNew) {
  const title = document.getElementById('c-title').value.trim();
  if (!title) return alert('Titre requis');
  const existing = isNew ? null : state.challenges.find(x => x.id === id);
  const scope = document.getElementById('c-scope').value;
  const obj = {
    id, title,
    scope,
    type: document.getElementById('c-type').value || (scope === 'collective' ? 'collective' : 'skill'),
    endDate: document.getElementById('c-end').value,
    metric: document.getElementById('c-metric').value.trim() || 'points',
    desc: document.getElementById('c-desc').value.trim(),
    scores: existing ? existing.scores : {},
  };
  if (scope === 'collective') {
    obj.target = parseInt(document.getElementById('c-target').value) || 0;
    obj.teamScore = existing && existing.teamScore ? existing.teamScore : 0;
  }
  if (isNew) state.challenges.unshift(obj);
  else { const i = state.challenges.findIndex(x => x.id === id); state.challenges[i] = obj; }
  persist(); closeModal(); render();
}
function deleteChallenge(id) {
  if (!confirm('Supprimer ?')) return;
  state.challenges = state.challenges.filter(x => x.id !== id);
  persist(); render();
}

// Stocké directement dans state.players[i].feedback = { positives: [], negatives: [], updatedAt }

const FB_SUGGEST_POS = ['Énergie défensive', 'Lecture du jeu', 'Adresse à 3pts', 'Communication terrain', 'Boxing-out efficace', 'Vitesse en transition', 'Décision rapide', 'Leadership', 'Esprit d\'équipe', 'Régularité', 'Adresse aux lancers', 'Discipline défensive'];
const FB_SUGGEST_NEG = ['Choix de tirs', 'Placement défensif', 'Communication', 'Boxing-out', 'Concentration LF', 'Fautes inutiles', 'Pertes de balle', 'Aide défensive', 'Lecture des écrans', 'Préparation physique', 'Gestion émotion', 'Vision périphérique'];

function getFeedback(p) {
  return p && p.feedback ? p.feedback : { positives: [], negatives: [] };
}

function openPlayerFeedback(pid) {
  const p = state.players.find(x => x.id === pid);
  if (!p) return;
  const fb = getFeedback(p);
  state._editingFeedback = {
    pid,
    positives: [...(fb.positives || [])],
    negatives: [...(fb.negatives || [])],
  };
  renderFeedbackEditor();
}

function renderFeedbackEditor() {
  const fb = state._editingFeedback;
  const p = state.players.find(x => x.id === fb.pid);

  openModal(`
    <div class="modal-header">
      <div>
        <div class="eyebrow">#${p.num} · Feedback général</div>
        <div class="modal-title">${esc(p.name)}</div>

    <div class="modal-body">
      <div style="padding:10px 12px;background:var(--bg-3);border-left:3px solid var(--orange);border-radius:6px;margin-bottom:14px;font-size:11px;color:var(--ink-2);line-height:1.5">
        Note les <strong>qualités générales</strong> et <strong>axes de progression long terme</strong> de cette joueuse. Elle les verra dans sa section "Mes stats".

      <!-- POSITIFS -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-family:'Anton';color:var(--green);font-size:15px;text-transform:uppercase">✓ Qualités / points forts</span>

        </div>
        ${fb.positives.length < 5 ? `<button class="btn btn-ghost" onclick="addFeedbackItem('positives')" style="color:var(--green);font-size:11px">+ Ajouter</button>` : ''}
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:8px">
        ${fb.positives.length === 0 ? `<div style="padding:14px;background:var(--bg-2);border:1px dashed var(--border);border-radius:8px;text-align:center;color:var(--ink-3);font-size:12px;font-style:italic">Aucune qualité notée</div>` : fb.positives.map((txt, i) => `
          <div class="feedback-item-edit" style="border-left-color:var(--green)">

          <div style="display:flex;flex-wrap:wrap;gap:4px">
            ${FB_SUGGEST_POS.filter(s => !fb.positives.includes(s)).map(s => `
              <button class="feedback-suggest-chip suggest-pos" onclick="addFeedbackSuggestion('positives','${esc(s).replace(/'/g, "\\'")}')">+ ${esc(s)}</button>
            `).join('')}
          </div>
        </div>
      ` : ''}

        </div>
        ${fb.negatives.length < 5 ? `<button class="btn btn-ghost" onclick="addFeedbackItem('negatives')" style="color:var(--red);font-size:11px">+ Ajouter</button>` : ''}

      <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:8px">
        ${fb.negatives.length === 0 ? `<div style="padding:14px;background:var(--bg-2);border:1px dashed var(--border);border-radius:8px;text-align:center;color:var(--ink-3);font-size:12px;font-style:italic">Aucun axe de progression noté</div>` : fb.negatives.map((txt, i) => `
          <div class="feedback-item-edit" style="border-left-color:var(--red)">

            <button class="btn btn-icon" onclick="removeFeedbackItem('negatives',${i})" style="color:var(--red);flex-shrink:0">✕</button>
          </div>
        `).join('')}
      </div>
      ${fb.negatives.length < 5 ? `
        <div>
          <div class="eyebrow-muted" style="margin-bottom:6px;font-size:9px">Suggestions rapides</div>
          <div style="display:flex;flex-wrap:wrap;gap:4px">
            ${FB_SUGGEST_NEG.filter(s => !fb.negatives.includes(s)).map(s => `
              <button class="feedback-suggest-chip suggest-neg" onclick="addFeedbackSuggestion('negatives','${esc(s).replace(/'/g, "\\'")}')">+ ${esc(s)}</button>
            `).join('')}
          </div>
        </div>
      ` : ''}
    </div>

        <button class="btn btn-secondary btn-block" onclick="closeModal();state._editingFeedback=null;setTimeout(()=>editPlayer('${fb.pid}'),50)">Annuler</button>
        <button class="btn btn-primary btn-block" onclick="saveFeedback()">Enregistrer</button>
      </div>
    </div>
  `);
}

function addFeedbackItem(type) {
  if (state._editingFeedback[type].length >= 5) return;
  state._editingFeedback[type].push('');
  renderFeedbackEditor();
  setTimeout(() => {
    const inputs = document.querySelectorAll('.feedback-item-edit input');
    if (inputs.length > 0) inputs[inputs.length - 1].focus();
  }, 50);
}

function addFeedbackSuggestion(type, text) {
  if (state._editingFeedback[type].length >= 5) return;
  state._editingFeedback[type].push(text);
  renderFeedbackEditor();
}

function removeFeedbackItem(type, idx) {
  state._editingFeedback[type].splice(idx, 1);
  renderFeedbackEditor();
}

function saveFeedback() {
  const fb = state._editingFeedback;
  const p = state.players.find(x => x.id === fb.pid);
  if (!p) return;
  const positives = fb.positives.map(s => s.trim()).filter(s => s.length > 0);
  const negatives = fb.negatives.map(s => s.trim()).filter(s => s.length > 0);
  if (positives.length === 0 && negatives.length === 0) {
    delete p.feedback;
  } else {
    p.feedback = { positives, negatives, updatedAt: Date.now() };
  }
  state._editingFeedback = null;
  persist();
  closeModal();
  setTimeout(() => editPlayer(fb.pid), 50);
}

function removeReviewItem(type, idx) {

function savePlayerReview() {
  const r = state._editingReview;
  const m = state.matches.find(x => x.id === r.matchId);
  if (!m) return;
  if (r.rating === 0) { alert('Choisis une note ⭐ avant d\'envoyer'); return; }
  m.playerReviews = m.playerReviews || {};
  m.playerReviews[r.pid] = {
    rating: r.rating,
    positives: r.positives.map(s => s.trim()).filter(s => s.length > 0),
    negatives: r.negatives.map(s => s.trim()).filter(s => s.length > 0),
    comment: r.comment.trim(),
    updatedAt: Date.now(),
  };

  persist();

function deletePlayerReview() {
  const r = state._editingReview;
  if (!confirm('Supprimer ton ressenti pour ce match ?')) return;
  const m = state.matches.find(x => x.id === r.matchId);
  if (m && m.playerReviews) delete m.playerReviews[r.pid];
  state._editingReview = null;
  persist();
  closeModal();
  render();
}

function openTeamReviewsDashboard() {
  const reviews = state.teamReviews || [];

  // Dernière review par joueuse
  const latestByPlayer = {};
  reviews.forEach(r => {
    if (!latestByPlayer[r.pid] || r.updatedAt > latestByPlayer[r.pid].updatedAt) {
      latestByPlayer[r.pid] = r;
    }
  });

  // Moyennes globales sur la dernière review de chaque joueuse
  const latest = Object.values(latestByPlayer);
  const avg = {};
  TEAM_REVIEW_FIELDS.forEach(f => {
    const vals = latest.map(r => r[f.key]).filter(v => v != null);
    avg[f.key] = vals.length > 0 ? (vals.reduce((a,b)=>a+b,0)/vals.length) : null;
  });

  const totalReviews = reviews.length;
  const playersWithReviews = Object.keys(latestByPlayer).length;

  openModal(`
    <div class="modal-header">
      <div>
        <div class="eyebrow">${totalReviews} ressenti${totalReviews>1?'s':''} · ${playersWithReviews}/${state.players.length} joueuses</div>

      <button class="modal-close" onclick="closeModal()">✕</button>

          <div class="empty-icon">💭</div>
          <div class="empty-title">Aucun ressenti</div>
          <div class="empty-desc">Les joueuses peuvent en envoyer depuis leur Home</div>
        </div>
      ` : `
        <!-- Moyennes équipe -->
        <div class="eyebrow-muted mb-2">Moyennes équipe · dernière entrée de chaque joueuse</div>
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:18px">
          ${TEAM_REVIEW_FIELDS.map(f => {
            const v = avg[f.key];
            if (v == null) return '';
            const color = v >= 4 ? 'var(--green)' : v <= 2 ? 'var(--red)' : 'var(--orange)';
            return `
              <div style="padding:10px 12px;background:var(--bg-2);border:1px solid var(--border-soft);border-radius:8px;border-left:3px solid ${color}">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
                  <div style="display:flex;align-items:center;gap:8px">
                    <span style="font-size:18px">${f.icon}</span>
                    <span style="font-family:'Anton';font-size:13px;text-transform:uppercase">${f.label}</span>
                  </div>
                  <div style="font-family:'Anton';font-size:20px;color:${color}">${v.toFixed(1)}<span style="color:var(--ink-4);font-size:12px">/5</span></div>
                </div>
                <div style="display:flex;gap:3px">
                  ${[1,2,3,4,5].map(n => `<div style="flex:1;height:5px;background:${v>=n?color:'var(--bg-3)'};border-radius:3px"></div>`).join('')}
                </div>
              </div>
            `;
          }).join('')}

// =========== STORY INSTAGRAM 9:16 ===========

async function exportStory(matchId, style, customMessage) {
  const m = state.matches.find(x => x.id === matchId);
  if (!m) return;
  const win = m.scoreUs > m.scoreOpp;
  style = style || 'simple';

  // Top 3 par Game Score (si stats dispo)
  const players = Object.entries(m.playerStats || {})
    .map(([pid, s]) => ({ player: state.players.find(p => p.id === pid), stats: s, gs: gameScore(s) }))
    .filter(r => r.player && r.gs > 0)
    .sort((a,b) => b.gs - a.gs)
    .slice(0, 3);

  const canvas = document.createElement('canvas');
  canvas.width = 1080;
  canvas.height = 1920;
  const ctx = canvas.getContext('2d');

  // Fond dégradé noir
  const grad = ctx.createLinearGradient(0, 0, 0, 1920);
  grad.addColorStop(0, '#000000');
  grad.addColorStop(0.5, '#0f0f0f');
  grad.addColorStop(1, win ? '#1a0e00' : '#0f0000');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1080, 1920);

  // Accent orange en haut
  const accGrad = ctx.createLinearGradient(0, 0, 1080, 0);
  accGrad.addColorStop(0, 'transparent');
  accGrad.addColorStop(0.5, '#ff6b00');
  accGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = accGrad;
  ctx.fillRect(0, 0, 1080, 4);

  // === HEADER ===
  ctx.fillStyle = '#ff6b00';
  ctx.font = 'bold 32px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('IE-BASKET CLUB L\'ISLOIS · 2', 540, 130);

  ctx.fillStyle = '#888';
  ctx.font = '24px monospace';
  ctx.fillText(formatDate(m.date, 'long').toUpperCase(), 540, 175);

  // === ZONE STYLE 'SELFIE' : photo en grand au centre ===
  if (style === 'selfie' && m.winSelfie) {
    // Charger la photo
    await new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        // Calc dimensions pour fit dans 880x880 centré
        const targetSize = 880;
        const x = (1080 - targetSize) / 2;
        const y = 240;
        // Cadre orange
        ctx.fillStyle = '#ff6b00';
        roundedRect(ctx, x - 6, y - 6, targetSize + 12, targetSize + 12, 20);
        ctx.fill();
        // Photo (cover crop)
        ctx.save();
        roundedRect(ctx, x, y, targetSize, targetSize, 16);
        ctx.clip();
        const ratio = img.width / img.height;
        let dw = targetSize, dh = targetSize;
        if (ratio > 1) { dw = targetSize * ratio; }
        else { dh = targetSize / ratio; }
        const dx = x - (dw - targetSize) / 2;
        const dy = y - (dh - targetSize) / 2;
        ctx.drawImage(img, dx, dy, dw, dh);
        ctx.restore();
        // Bandeau noir bas
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(x, y + targetSize - 130, targetSize, 130);
        // Score sur le bandeau
        ctx.fillStyle = win ? '#22c55e' : '#ef4444';
        ctx.font = 'bold 18px monospace';
        ctx.fillText(win ? 'VICTOIRE' : 'DÉFAITE', 540, y + targetSize - 88);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 70px sans-serif';
        ctx.fillText((m.scoreUs||0) + '–' + (m.scoreOpp||0), 540, y + targetSize - 30);
        resolve();
      };
      img.onerror = () => resolve();
      img.src = m.winSelfie;
    });
    // Sous photo : adversaire
    ctx.fillStyle = '#aaa';
    ctx.font = '32px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('vs ' + (m.opponent || '').toUpperCase(), 540, 1240);
    ctx.fillStyle = '#666';
    ctx.font = '22px monospace';
    ctx.fillText(m.home ? 'À DOMICILE' : 'À L\'EXTÉRIEUR', 540, 1280);
  } else {
    // === BANDEAU VICTOIRE/DÉFAITE ===
    ctx.fillStyle = win ? '#22c55e' : '#ef4444';
    ctx.font = 'bold 80px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(win ? 'VICTOIRE' : 'DÉFAITE', 540, 320);

    // === SCORE GÉANT ===
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 280px sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText((m.scoreUs || 0) + '–' + (m.scoreOpp || 0), 540, 530);
    ctx.textBaseline = 'alphabetic';

    // === VS Adversaire ===
    ctx.fillStyle = '#aaa';
    ctx.font = '40px monospace';
    ctx.fillText('vs ' + (m.opponent || '').toUpperCase(), 540, 740);

    ctx.fillStyle = '#666';
    ctx.font = '24px monospace';
    ctx.fillText(m.home ? 'À DOMICILE' : 'À L\'EXTÉRIEUR', 540, 785);

    // Trait orange
    ctx.fillStyle = '#ff6b00';
    ctx.fillRect(390, 850, 300, 3);
  }

  // === CONTENU PRINCIPAL SELON LE STYLE ===
  if (style === 'stats' && players.length > 0) {
    // Top 3
    ctx.fillStyle = '#ff6b00';
    ctx.font = 'bold 28px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('TOP 3 · CONTRIBUTRICES', 540, 920);

    const medals = ['🥇', '🥈', '🥉'];
    for (let i = 0; i < 3; i++) {
      const r = players[i];
      const y = 1020 + i * 200;
      ctx.fillStyle = 'rgba(255,107,0,' + (0.15 - i*0.03) + ')';
      ctx.strokeStyle = 'rgba(255,107,0,0.4)';
      ctx.lineWidth = 2;
      const cardW = 880, cardH = 170, cardX = 100;
      roundedRect(ctx, cardX, y, cardW, cardH, 16);
      ctx.fill();
      ctx.stroke();
      if (r) {
        ctx.font = '80px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#fff';
        ctx.fillText(medals[i], cardX + 90, y + 110);
        ctx.font = 'bold 44px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillStyle = '#fff';
        const name = '#' + r.player.num + ' ' + r.player.name.toUpperCase();
        ctx.fillText(name.length > 22 ? name.slice(0,22) : name, cardX + 180, y + 70);
        ctx.font = '28px monospace';
        ctx.fillStyle = '#ff6b00';
        ctx.fillText((r.stats.pts || 0) + ' PTS  ·  ' + (r.stats.reb || 0) + ' REB  ·  ' + (r.stats.ast || 0) + ' PD', cardX + 180, y + 115);
        ctx.font = 'bold 24px monospace';
        ctx.fillStyle = r.gs >= 15 ? '#22c55e' : r.gs < 5 ? '#ef4444' : '#ff6b00';

      } else {
        ctx.font = '32px monospace';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#555';
        ctx.fillText('—', 540, y + 100);
      }
    }
  } else if (style === 'custom' && customMessage) {
    // Message personnalisé
    ctx.fillStyle = '#ff6b00';
    ctx.font = 'bold 24px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('— MOT DU COACH —', 540, 940);

    // Texte : on découpe les lignes pour qu'elles tiennent dans 960px
    ctx.fillStyle = '#fff';
    ctx.font = '46px sans-serif';
    const maxWidth = 920;
    const lineHeight = 70;
    const lines = wrapText(ctx, customMessage, maxWidth);
    const startY = 1080;
    lines.slice(0, 8).forEach((line, idx) => {
      ctx.fillText(line, 540, startY + idx * lineHeight);
    });
  } else if (style === 'simple' || (style === 'stats' && players.length === 0) || (style === 'selfie' && !m.winSelfie)) {
    // Style minimaliste : juste le score, espace propre + adversaire en bas

    ctx.font = 'bold 28px monospace';

    ctx.fillText('— MATCH ' + (win ? 'GAGNÉ' : 'JOUÉ') + ' —', 540, 970);

    const totalStl = Object.values(m.playerStats||{}).reduce((acc,s) => acc + (s.stl||0), 0);
    if (totalReb + totalAst + totalStl > 0) {
      ctx.fillStyle = '#aaa';
      ctx.font = '40px monospace';
      ctx.fillText(totalReb + ' REB · ' + totalAst + ' PD · ' + totalStl + ' INT', 540, 1100);

    // Citation motivante au centre

    const quote = quotes[Math.floor(Math.random() * quotes.length)];

    ctx.font = 'italic 54px sans-serif';

    ctx.font = 'bold 32px monospace';
    ctx.fillText('#BCL2', 540, 1600);
  }

  // === FOOTER ===
  ctx.fillStyle = '#444';
  ctx.font = '20px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('PLAYBOOK BCL · ' + new Date().toLocaleDateString('fr-FR'), 540, 1870);

  // === EXPORT ===
  const dataUrl = canvas.toDataURL('image/png');
  const shareSupported = navigator.share && navigator.canShare;

  openModal(`
    <div class="modal-header">

          Sur iPhone : appui long sur l'image → "Enregistrer dans Photos" → publier dans ton app.
        </div>

  `);

  state._lastStoryDataUrl = dataUrl;

}

// Découpe un texte en lignes qui rentrent dans maxWidth
function wrapText(ctx, text, maxWidth) {
  const lines = [];
  // On respecte d'abord les \n explicites
  text.split('\n').forEach(paragraph => {
    if (!paragraph.trim()) { lines.push(''); return; }
    const words = paragraph.split(' ');
    let line = '';
    words.forEach(word => {
      const test = line ? line + ' ' + word : word;
      const w = ctx.measureText(test).width;
      if (w > maxWidth && line) {
        lines.push(line);
        line = word;
      } else {
        line = test;
      }
    });
    if (line) lines.push(line);
  });
  return lines;
}

async function shareStory(matchId, btn) {
  if (!state._lastStoryDataUrl) return;
  try {
    // Convertir dataUrl en blob
    const resp = await fetch(state._lastStoryDataUrl);
    const blob = await resp.blob();
    const m = state.matches.find(x => x.id === matchId);
    const file = new File([blob], 'playbook-match.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({
        files: [file],
        title: 'BCL vs ' + (m.opponent || 'Match'),
        text: (m.scoreUs > m.scoreOpp ? 'Victoire ' : 'Match ') + m.scoreUs + '–' + m.scoreOpp + ' vs ' + (m.opponent || ''),
      });
    } else {
      alert('Partage non supporté · télécharge l\'image et partage manuellement.');
    }
  } catch (e) {
    if (e.name !== 'AbortError') alert('Partage annulé ou erreur : ' + e.message);
  }
}

function roundedRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function saveInjury(pid) {
  const p = state.players.find(x => x.id === pid);
  if (!p) return;
  const status = document.getElementById('inj-status-val').value;
  p.injury = {
    status,
    description: document.getElementById('inj-desc').value.trim(),
    startDate: document.getElementById('inj-start').value,
    returnDate: document.getElementById('inj-return').value,
    restrictions: document.getElementById('inj-restrictions').value.trim(),
  };
  persist();
  closeModal();
  setTimeout(() => editPlayer(pid), 50);
}

function markAsHealed(pid) {
  const p = state.players.find(x => x.id === pid);
  if (!p || !p.injury) return;
  if (!confirm('Marquer comme guéri·e ? L\'épisode sera archivé dans l\'historique.')) return;
  // Archiver l'épisode en cours
  p.injuryHistory = p.injuryHistory || [];
  p.injuryHistory.push({
    ...p.injury,
    endDate: new Date().toISOString().slice(0,10),
  });
  delete p.injury;
  persist();
  closeModal();
  setTimeout(() => editPlayer(pid), 50);
}

// Badge compact pour afficher le statut sur les listes (convoc)
function injuryBadge(p) {
  const inj = p.injury;
  if (!inj || !inj.status || inj.status === 'apte') return '';
  const cfg = INJURY_STATUS[inj.status];
  if (!cfg) return '';
  return `<span class="injury-badge" style="background:${cfg.bg};color:${cfg.color};border:1px solid ${cfg.color}40" title="${esc(inj.description || cfg.label)}">${cfg.icon} ${cfg.label}</span>`;

// Renvoie la clé semaine ISO (ex '2026-W23')
function getWeekKey(date) {
  const d = date ? new Date(date) : new Date();
  // ISO week : adapter le jeudi de la semaine pour avoir le bon n°
  const target = new Date(d.valueOf());
  const dayNr = (d.getDay() + 6) % 7; // 0 = lundi
  target.setDate(target.getDate() - dayNr + 3);
  const firstThursday = new Date(target.getFullYear(), 0, 4);
  const diff = target - firstThursday;
  const weekNum = 1 + Math.round(diff / (7 * 24 * 3600 * 1000));
  return target.getFullYear() + '-W' + String(weekNum).padStart(2, '0');
}

// Renvoie le lundi et dimanche de la semaine actuelle
function getWeekRange(date) {
  const d = date ? new Date(date) : new Date();
  const day = (d.getDay() + 6) % 7; // 0 = lundi
  const monday = new Date(d);
  monday.setDate(d.getDate() - day);
  monday.setHours(0,0,0,0);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  return { monday, sunday };
}

function formatWeekRange(date) {
  const { monday, sunday } = getWeekRange(date);
  return monday.getDate() + ' ' + monday.toLocaleDateString('fr-FR', {month:'short'}) + ' → ' + sunday.getDate() + ' ' + sunday.toLocaleDateString('fr-FR', {month:'short'});
}

// Vérifie si la prépa est active aujourd'hui
function isOffseasonActive() {
  const o = state.offseason;
  if (!o || !o.startDate || !o.endDate) return false;
  const today = new Date().toISOString().slice(0,10);
  return today >= o.startDate && today <= o.endDate;
}

function addOffseasonStep() {
  state._editingOffseason.exercises.push({ id: uid(), label: '', target: 0, unit: '', notes: '' });
  renderOffseasonEditor();
}

function addOffseasonTemplate(idx) {
  const t = OFFSEASON_TEMPLATES[idx];
  state._editingOffseason.exercises.push({ id: uid(), label: t.label, target: t.target, unit: t.unit, notes: t.notes });
  renderOffseasonEditor();
}

function removeOffseasonStep(idx) {
  state._editingOffseason.exercises.splice(idx, 1);
  renderOffseasonEditor();
}

function moveOffseasonStep(idx, delta) {
  const arr = state._editingOffseason.exercises;
  const newIdx = idx + delta;
  if (newIdx < 0 || newIdx >= arr.length) return;
  const tmp = arr[idx]; arr[idx] = arr[newIdx]; arr[newIdx] = tmp;
  renderOffseasonEditor();
}

function saveOffseason() {
  const e = state._editingOffseason;
  const title = document.getElementById('os-title').value.trim() || 'Prépa estivale';
  const startDate = document.getElementById('os-start').value;
  const endDate = document.getElementById('os-end').value;
  if (!startDate || !endDate) { alert('Date de début et de fin requises'); return; }
  const exercises = e.exercises.filter(ex => (ex.label || '').trim());
  if (exercises.length === 0) { alert('Au moins un exercice est requis'); return; }
  // Réassigner des id pour s'assurer qu'ils sont uniques
  exercises.forEach(ex => { if (!ex.id) ex.id = uid(); });
  state.offseason = { title, startDate, endDate, exercises };
  state._editingOffseason = null;
  persist();
  closeModal();
  render();
}

function deleteOffseason() {
  if (!confirm('Supprimer le programme et tous les suivis associés ?')) return;
  state.offseason = null;
  state.offseasonLogs = {};
  state._editingOffseason = null;
  persist();
  closeModal();
  render();
}

// === JOUEUSE : cocher les exercices ===

function openMyOffseason() {
  if (state.auth.role !== 'player') return;
  const o = state.offseason;
  const pid = state.auth.playerId;
  if (!o || !pid) return;
  const todayStr = new Date().toISOString().slice(0,10);
  const beforeStart = o.startDate && todayStr < o.startDate;
  const afterEnd = o.endDate && todayStr > o.endDate;
  const active = !beforeStart && !afterEnd;
  const weekKey = getWeekKey();
  state.offseasonLogs = state.offseasonLogs || {};
  state.offseasonLogs[pid] = state.offseasonLogs[pid] || {};
  state.offseasonLogs[pid][weekKey] = state.offseasonLogs[pid][weekKey] || {};
  const log = state.offseasonLogs[pid][weekKey];
  const doneCount = active ? o.exercises.filter(ex => log[ex.id] && log[ex.id].done).length : 0;
  const pct = active && o.exercises.length > 0 ? Math.round((doneCount / o.exercises.length) * 100) : 0;

  // Bandeau d'info selon l'état
  let infoBanner;
  if (beforeStart) {
    infoBanner = `<div style="padding:10px 12px;background:rgba(99,102,241,0.10);border-left:3px solid #6366f1;border-radius:6px;margin-bottom:14px;font-size:12px;color:var(--ink-2);line-height:1.5">📅 <strong>Démarre le ${formatDate(o.startDate)}</strong>.<br>Découvre le programme dès maintenant pour t'organiser.</div>`;
  } else if (afterEnd) {
    infoBanner = `<div style="padding:10px 12px;background:rgba(34,197,94,0.10);border-left:3px solid var(--green);border-radius:6px;margin-bottom:14px;font-size:12px;color:var(--ink-2);line-height:1.5">🏁 <strong>Programme terminé le ${formatDate(o.endDate)}</strong>.<br>Tu peux consulter ton historique ci-dessous.</div>`;
  } else {
    infoBanner = `<div style="padding:10px 12px;background:var(--bg-3);border-left:3px solid var(--orange);border-radius:6px;margin-bottom:14px;font-size:11px;color:var(--ink-2);line-height:1.5">Coche chaque exercice fait cette semaine. Reset auto chaque lundi. Ton coach voit ta progression.</div>`;
  }

  openModal(`
    <div class="modal-header">
      <div>
        <div class="eyebrow">${active ? formatWeekRange() : (beforeStart ? 'À venir' : 'Terminé')}</div>
        <div class="modal-title">☀ ${esc(o.title)}</div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      ${infoBanner}

      <!-- Progression semaine -->
      ${active ? `
      <div style="text-align:center;padding:14px;background:var(--bg-2);border-radius:10px;margin-bottom:14px;border:1px solid ${pct===100?'var(--green)':'var(--border)'}">
        <div style="font-family:'Anton';font-size:36px;color:${pct===100?'var(--green)':'var(--orange)'};line-height:1">${doneCount}<span style="font-size:18px;color:var(--ink-4)">/${o.exercises.length}</span></div>
        <div style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.06em;margin:6px 0 10px">Exercices · ${pct}%</div>
        <div style="height:6px;background:var(--bg-1);border-radius:3px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--orange),${pct===100?'var(--green)':'#cc5400'});transition:width 0.3s"></div>
        </div>
      </div>
      ` : ''}

      <!-- Liste exos -->
      <div style="display:flex;flex-direction:column;gap:8px">
        ${o.exercises.map(ex => {
          const entry = log[ex.id] || {};
          const isDone = active && !!entry.done;
          const clickAttr = active ? `onclick="toggleOffseasonExercise('${ex.id}')"` : '';
          return `
            <div class="warmup-step-do ${isDone ? 'done' : ''}" ${clickAttr} style="${active ? '' : 'cursor:default;opacity:0.85'}">
              <div style="font-family:'Anton';font-size:18px;color:${isDone?'var(--green)':'var(--orange)'};min-width:32px;text-align:center">${isDone ? '✓' : '○'}</div>
              <div style="flex:1;min-width:0">
                <div style="font-family:'Anton';font-size:14px;text-transform:uppercase;${isDone?'text-decoration:line-through;color:var(--ink-3)':''}">${esc(ex.label)}</div>
                <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:3px">
                  ${ex.target > 0 ? `<span style="font-size:10px;color:var(--orange);font-family:'JetBrains Mono';text-transform:uppercase">🎯 ${ex.target} ${esc(ex.unit || '')}</span>` : ''}
                  ${ex.notes ? `<span style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';font-style:italic">${esc(ex.notes)}</span>` : ''}
                </div>
              </div>
            </div>
          `;
        }).join('')}
      </div>

      <!-- Historique des semaines passées -->
      ${(() => {
        const allWeeks = Object.keys(state.offseasonLogs[pid] || {}).filter(w => w !== weekKey).sort().reverse().slice(0, 4);
        if (allWeeks.length === 0) return '';
        return `
          <div class="eyebrow-muted mb-2" style="margin-top:18px">Semaines passées</div>
          <div style="display:flex;flex-direction:column;gap:4px">
            ${allWeeks.map(wk => {
              const wLog = state.offseasonLogs[pid][wk] || {};
              const wDone = o.exercises.filter(ex => wLog[ex.id] && wLog[ex.id].done).length;
              const wPct = o.exercises.length > 0 ? Math.round((wDone / o.exercises.length) * 100) : 0;
              const color = wPct >= 80 ? 'var(--green)' : wPct >= 50 ? 'var(--orange)' : 'var(--red)';
              return `
                <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg-2);border-radius:6px">
                  <div style="font-family:'JetBrains Mono';font-size:10px;color:var(--ink-3);text-transform:uppercase;min-width:60px">${wk}</div>
                  <div style="flex:1;height:5px;background:var(--bg-1);border-radius:3px;overflow:hidden">
                    <div style="height:100%;width:${wPct}%;background:${color}"></div>
                  </div>
                  <div style="font-family:'Anton';font-size:13px;color:${color};min-width:50px;text-align:right">${wDone}/${o.exercises.length}</div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      })()}
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary btn-block" onclick="closeModal()">Fermer</button>
    </div>
  `);
}

function toggleOffseasonExercise(exId) {
  if (state.auth.role !== 'player') return;
  const pid = state.auth.playerId;
  const weekKey = getWeekKey();
  state.offseasonLogs = state.offseasonLogs || {};
  state.offseasonLogs[pid] = state.offseasonLogs[pid] || {};
  state.offseasonLogs[pid][weekKey] = state.offseasonLogs[pid][weekKey] || {};
  const log = state.offseasonLogs[pid][weekKey];
  log[exId] = log[exId] || {};
  log[exId].done = !log[exId].done;
  if (log[exId].done) log[exId].at = Date.now();
  persist();
  // 1. MAJ home en arrière-plan (carte progression)
  render();
  // 2. Préserver scroll dans le modal avant re-render
  const mb = document.querySelector('#modal-root .modal-body');
  const prevScroll = mb ? mb.scrollTop : 0;
  // 3. Re-monter le modal avec le nouvel état
  openMyOffseason();
  // 4. Restaurer scroll
  const newMb = document.querySelector('#modal-root .modal-body');
  if (newMb) newMb.scrollTop = prevScroll;
}

// === COACH : dashboard de suivi ===

function openOffseasonDashboard() {
  const o = state.offseason;
  if (!o) return;
  const weekKey = getWeekKey();
  const logs = state.offseasonLogs || {};

  // Stats par joueuse pour la semaine en cours
  const playersStats = state.players.map(p => {
    const playerLogs = (logs[p.id] || {})[weekKey] || {};
    const doneCount = o.exercises.filter(ex => playerLogs[ex.id] && playerLogs[ex.id].done).length;
    const pct = o.exercises.length > 0 ? Math.round((doneCount / o.exercises.length) * 100) : 0;
    // Calcul moyenne sur les 4 dernières semaines
    const allWeeks = Object.keys(logs[p.id] || {}).sort().reverse().slice(0, 4);
    let totalDone = 0, totalExpected = 0;
    allWeeks.forEach(wk => {
      const wLog = (logs[p.id] || {})[wk] || {};
      o.exercises.forEach(ex => { totalExpected++; if (wLog[ex.id] && wLog[ex.id].done) totalDone++; });
    });
    const avgPct = totalExpected > 0 ? Math.round((totalDone / totalExpected) * 100) : 0;
    return { player: p, doneCount, pct, avgPct, weeksTracked: allWeeks.length };
  }).sort((a,b) => b.pct - a.pct);

  // Stats globales équipe
  const totalDone = playersStats.reduce((acc, x) => acc + x.doneCount, 0);
  const totalExpected = state.players.length * o.exercises.length;
  const teamPct = totalExpected > 0 ? Math.round((totalDone / totalExpected) * 100) : 0;

  openModal(`
    <div class="modal-header">
      <div>
        <div class="eyebrow">${formatWeekRange()}</div>
        <div class="modal-title">☀ ${esc(o.title)} · Suivi</div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <!-- Stats globales équipe -->
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px">
        <div class="stat-tile">
          <div class="stat-tile-label">Engagement</div>
          <div class="stat-tile-value" style="color:${teamPct>=70?'var(--green)':teamPct>=40?'var(--orange)':'var(--red)'}">${teamPct}%</div>
        </div>
        <div class="stat-tile">
          <div class="stat-tile-label">Exos done</div>
          <div class="stat-tile-value">${totalDone}<span style="font-size:14px;color:var(--ink-4)">/${totalExpected}</span></div>
        </div>
        <div class="stat-tile">
          <div class="stat-tile-label">Période</div>
          <div class="stat-tile-value" style="font-size:14px">${formatDate(o.startDate, 'short')}<br><span style="font-size:10px;color:var(--ink-3)">→ ${formatDate(o.endDate, 'short')}</span></div>
        </div>
      </div>

      <!-- Détail par joueuse -->
      <div class="eyebrow-muted mb-2">Cette semaine · classement par engagement</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${playersStats.map((x, i) => {

function openOffseasonPlayerDetail(pid) {

  const weeks = Object.keys(logs).sort().reverse().slice(0, 8); // 8 semaines max

  openModal(`
    <div class="modal-header">
      <div>
        <div class="eyebrow">${weeks.length} semaine${weeks.length>1?'s':''} suivie${weeks.length>1?'s':''}</div>

function renderWarmupEditor() {

            <div style="flex:1;min-width:0">

              ${i > 0 ? `<button class="btn btn-icon" onclick="moveWarmupStep(${i},-1)" style="width:24px;height:20px;font-size:10px;padding:0">▲</button>` : ''}
              ${i < r.steps.length - 1 ? `<button class="btn btn-icon" onclick="moveWarmupStep(${i},1)" style="width:24px;height:20px;font-size:10px;padding:0">▼</button>` : ''}
            </div>
            <button class="btn btn-icon" onclick="removeWarmupStep(${i})" style="color:var(--red);flex-shrink:0">✕</button>
          </div>
        `).join('')}

          <button class="feedback-suggest-chip suggest-pos" onclick="addWarmupTemplate(${i})">+ ${esc(t.label)} ${t.count > 1 ? '×' + t.count : ''}</button>

function addWarmupStep() {
  state._editingRoutine.steps.push({ label: '', count: 0, notes: '' });
  renderWarmupEditor();
}

function addWarmupTemplate(idx) {
  const t = WARMUP_TEMPLATES[idx];
  state._editingRoutine.steps.push({ label: t.label, count: t.count || 0, notes: '' });
  renderWarmupEditor();
}

function removeWarmupStep(idx) {
  state._editingRoutine.steps.splice(idx, 1);
  renderWarmupEditor();
}

function moveWarmupStep(idx, delta) {
  const r = state._editingRoutine;
  const newIdx = idx + delta;
  if (newIdx < 0 || newIdx >= r.steps.length) return;
  const tmp = r.steps[idx];
  r.steps[idx] = r.steps[newIdx];
  r.steps[newIdx] = tmp;
  renderWarmupEditor();
}

function saveWarmupRoutine() {
  const r = state._editingRoutine;
  const p = state.players.find(x => x.id === r.pid);
  if (!p) return;
  const steps = r.steps.map(s => ({ ...s, label: (s.label || '').trim() })).filter(s => s.label.length > 0);
  if (steps.length === 0) {
    delete p.warmupRoutine;
  } else {
    p.warmupRoutine = { steps, updatedAt: Date.now() };
  }
  state._editingRoutine = null;
  persist();
  closeModal();
  setTimeout(() => editPlayer(r.pid), 50);
}

  const file = event.target.files[0];
  if (!file) return;
  const p = currentPlayer();

  try {

    p.photo = compressed;
    persist();
    closeModal();
    setTimeout(() => editMyPhoto(), 50);
  } catch (e) {
    alert('Erreur : ' + e.message);

function removePlayer(pid) {
  const p = state.players.find(x => x.id === pid);
  if (!p || !confirm('Retirer ' + p.name + ' ?')) return;
  state.players = state.players.filter(x => x.id !== pid);
  state.challenges.forEach(c => { if (c.scores) delete c.scores[pid]; });

  state.matches.forEach(m => { if (m.playerStats) delete m.playerStats[pid]; });

  managePlayers();
}

// Compression d'image basique pour rester sous une taille raisonnable
function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => {
      img.onload = () => {
        let { width, height } = img;
        if (width > height) {
          if (width > maxDim) { height *= maxDim / width; width = maxDim; }
        } else {
          if (height > maxDim) { width *= maxDim / height; height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('Image invalide'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Lecture impossible'));
    reader.readAsDataURL(file);
  });
}

// CHAMPIONNAT FFBB (scraping via proxy public)
// ============================================================
// Utilise allorigins.win comme proxy CORS (gratuit, instable)
// À terme, remplacer par /.netlify/functions/ffbb-scraper

// Proxy 1 : notre fonction Netlify (fiable, hébergée avec l'app)
// Proxy 2-4 : proxies publics en fallback (peuvent tomber en panne)
const FFBB_PROXIES = [
  url => '/api/ffbb?url=' + encodeURIComponent(url), // Netlify Function (notre proxy)
  url => 'https://api.allorigins.win/get?url=' + encodeURIComponent(url),
  url => 'https://corsproxy.io/?' + encodeURIComponent(url),
  url => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url),
];

async function fetchViaProxy(targetUrl) {
  let lastErr = null;
  for (const proxyFn of FFBB_PROXIES) {
    try {
      const proxyUrl = proxyFn(targetUrl);
      const resp = await fetch(proxyUrl, { method: 'GET' });
      if (!resp.ok) { lastErr = 'HTTP ' + resp.status; continue; }
      const contentType = resp.headers.get('content-type') || '';
      // allorigins renvoie { contents: "..." }
      if (contentType.includes('application/json') && proxyUrl.includes('allorigins')) {
        const j = await resp.json();
        if (j.contents) return j.contents;
        lastErr = 'allorigins empty';
        continue;
      }
      // Les autres renvoient le HTML brut
      const text = await resp.text();
      if (text && text.length > 500) return text;
      lastErr = 'short response';
    } catch (e) {
      lastErr = e.message;
    }
  }
  throw new Error('Tous les proxies ont échoué : ' + lastErr);
}

// FFBB v2 (2026) : Next.js App Router → plus de __NEXT_DATA__.
// On parse directement le HTML rendu côté serveur. Les matchs apparaissent avec
// une structure régulière (compétition + date + équipes + score/heure + salle).

// Parser principal : extrait les matchs depuis le HTML brut de la page club
function parseClubMatchesFromHTML(html, clubTeamHint) {
  const matches = [];
  if (!html) return matches;

  // On utilise un DOMParser pour naviguer le HTML proprement
  let doc;
  try {
    doc = new DOMParser().parseFromString(html, 'text/html');
  } catch (e) {
    console.error('DOMParser failed', e);
    return matches;
  }

  // Méthode 1 : chercher les blocs "Match" qui contiennent les images d'équipes + score/heure
  // Pattern observé : un titre h3/h4 avec "Journée X", suivi d'une date+heure, puis 2 liens vers équipes avec image, et un lien score/feuille de match.
  
  // On cherche tous les liens vers une page de match : .../match/<id>
  const matchLinks = Array.from(doc.querySelectorAll('a[href*="/match/"]'));
  const processedMatchIds = new Set();

  matchLinks.forEach(link => {
    const href = link.getAttribute('href') || '';
    const idMatch = href.match(/\/match\/(\d+)/);
    if (!idMatch) return;
    const matchId = idMatch[1];
    if (processedMatchIds.has(matchId)) return;
    processedMatchIds.add(matchId);

    // Le lien contient le score ou "Voir la feuille de match"
    const linkText = (link.textContent || '').trim();
    // Le score est sous la forme "AABB" sans séparateur (ex: "9914" = 99-14) ou avec séparateur
    let scoreHome = null, scoreAway = null, played = false;
    const scoreMatch = linkText.match(/^(\d{1,3})\s*[-–]?\s*(\d{1,3})$/);
    if (scoreMatch) {
      scoreHome = parseInt(scoreMatch[1]);
      scoreAway = parseInt(scoreMatch[2]);
      played = true;
    } else if (/^\d{4,6}$/.test(linkText)) {
      // Format collé style "9914" → on prend la moitié de chaque côté en supposant 2 ou 3 chiffres
      const len = linkText.length;
      if (len === 4) {
        scoreHome = parseInt(linkText.slice(0, 2));
        scoreAway = parseInt(linkText.slice(2));
      } else if (len === 6) {
        scoreHome = parseInt(linkText.slice(0, 3));
        scoreAway = parseInt(linkText.slice(3));
      } else if (len === 5) {
        // Ambigü - on tente 2+3 et 3+2, on prend celui qui a des scores plausibles
        const a = [parseInt(linkText.slice(0, 2)), parseInt(linkText.slice(2))];
        const b = [parseInt(linkText.slice(0, 3)), parseInt(linkText.slice(3))];
        // Préférence : scores entre 20 et 200
        if (a[0] >= 20 && a[0] <= 200 && a[1] >= 20 && a[1] <= 200) {
          scoreHome = a[0]; scoreAway = a[1];
        } else {
          scoreHome = b[0]; scoreAway = b[1];
        }
      }
      if (scoreHome !== null && scoreAway !== null && !isNaN(scoreHome) && !isNaN(scoreAway) && (scoreHome > 0 || scoreAway > 0)) {
        played = true;
      } else {
        scoreHome = null; scoreAway = null;
        played = false;
      }
    }

    // Sécurité supplémentaire : si played mais l'un des deux scores est null, on annule
    if (played && (scoreHome === null || scoreAway === null || isNaN(scoreHome) || isNaN(scoreAway))) {
      played = false;
      scoreHome = null;
      scoreAway = null;
    }

    // Remonter dans le DOM pour récupérer le contexte (équipes + date + compétition + salle)
    let context = link.parentElement;
    for (let i = 0; i < 6 && context; i++) {
      // On cherche une zone qui contient au moins 2 liens vers /equipes/
      const teamLinks = context.querySelectorAll('a[href*="/equipes/"]');
      if (teamLinks.length >= 2) break;
      context = context.parentElement;
    }
    if (!context) return;

    // Récupérer les 2 équipes (par les liens /equipes/)
    const teamLinks = Array.from(context.querySelectorAll('a[href*="/equipes/"]'));
    if (teamLinks.length < 2) return;

    // Le nom de l'équipe est dans le title ou le texte du lien (souvent dupliqué image + texte)
    function extractTeamName(a) {
      const title = a.getAttribute('title') || '';
      if (title) return title.trim();
      const txt = (a.textContent || '').trim();
      // Souvent "URL_image Nom Equipe" — on prend après le dernier slash si présent
      const cleaned = txt.replace(/^https?:[^\s]+\s*/, '').trim();
      return cleaned;
    }

    const homeTeam = extractTeamName(teamLinks[0]);
    const awayTeam = extractTeamName(teamLinks[1]);
    if (!homeTeam || !awayTeam) return;

    // Chercher la date / heure dans le contexte (avant ou juste avant le score)
    const ctxText = context.textContent || '';
    // Patterns possibles : "9 mai 13h00", "9/05/2025", "9 mai 2025 13:00", "15 mars 18:30"
    const dateMatch = ctxText.match(/(\d{1,2})\s+(janvier|f[ée]vrier|mars|avril|mai|juin|juillet|ao[uû]t|septembre|octobre|novembre|d[ée]cembre)(?:\s+(\d{4}))?\s*(?:à\s*)?(\d{1,2})[h:](\d{2})?/i);
    let dateStr = null, timeStr = null;
    const MONTHS = { 'janvier':1,'fevrier':2,'fevrier':2,'mars':3,'avril':4,'mai':5,'juin':6,'juillet':7,'aout':8,'aout':8,'septembre':9,'octobre':10,'novembre':11,'decembre':12 };
    if (dateMatch) {
      const day = parseInt(dateMatch[1]);
      const monthName = dateMatch[2].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      const month = MONTHS[monthName];
      let year = dateMatch[3] ? parseInt(dateMatch[3]) : null;
      const hour = parseInt(dateMatch[4]);
      const minutes = dateMatch[5] ? parseInt(dateMatch[5]) : 0;
      // Si pas d'année : deviner d'après la saison sportive en cours (sept-juin)
      if (!year) {
        const now = new Date();
        const currentMonth = now.getMonth() + 1;
        const currentYear = now.getFullYear();
        // Si on est en sept-dec → match peut être de cette année (sept-dec) ou suivante (jan-juin)
        if (currentMonth >= 9) {
          year = month >= 9 ? currentYear : currentYear + 1;
        } else {
          year = month >= 9 ? currentYear - 1 : currentYear;
        }
      }
      dateStr = year + '-' + String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0');
      timeStr = String(hour).padStart(2, '0') + ':' + String(minutes).padStart(2, '0');
    }

    // Chercher la compétition (h3, h4 ou texte avant le match)
    let competition = '';
    let cur = context;
    for (let i = 0; i < 8 && cur; i++) {
      const heading = cur.querySelector('h2, h3, h4');
      if (heading) {
        const t = (heading.textContent || '').trim();
        if (t && !competition) competition = t;
      }
      cur = cur.parentElement;
    }
    // Nettoyer : "U13M HON P2 | Journée 8" → on garde tout, "Inter-départementale masculine U13 - Division 2" si dispo
    competition = competition.replace(/\s*\|\s*Journée\s*\d+/i, '').trim();

    // Chercher le numéro de journée
    let journee = null;
    const jMatch = ctxText.match(/Journée\s*(\d+)/i);
    if (jMatch) journee = parseInt(jMatch[1]);

    // Salle : souvent le dernier élément de texte non-link (genre "CENTRE ANDRE GIRARD")
    let venue = '';
    // On cherche un élément de texte court en majuscules après les liens (heuristique)
    const allText = ctxText;
    const lines = allText.split(/\n+/).map(s => s.trim()).filter(Boolean);
    for (const line of lines) {
      if (line.length > 4 && line.length < 80
          && line === line.toUpperCase()
          && !/^\d/.test(line)
          && !line.includes('JOURNÉE')
          && !line.includes('JOURNEE')
          && line !== homeTeam.toUpperCase()
          && line !== awayTeam.toUpperCase()) {
        venue = line;
        break;
      }
    }

    matches.push({
      id: matchId,
      date: dateStr,
      time: timeStr,
      home: homeTeam,
      away: awayTeam,
      homeScore: scoreHome,
      awayScore: scoreAway,
      played,
      competition,
      journee,
      venue,
      matchUrl: 'https://competitions.ffbb.com' + (href.startsWith('http') ? new URL(href).pathname : href),
    });
  });

  // Filtrer par hint d'équipe si fourni (ne garder que les matchs de cette équipe)
  if (clubTeamHint) {
    const hint = clubTeamHint.toLowerCase();
    return matches.filter(m =>
      (m.home || '').toLowerCase().includes(hint) ||
      (m.away || '').toLowerCase().includes(hint)
    );
  }

  return matches;
}

async function syncFFBB() {
  const url = (state.ffbb.clubUrl || '').trim();
  if (!url) { alert('URL du club FFBB requise'); return; }
  state.ffbb.syncing = true;
  state.ffbb.syncError = null;
  render();

  try {
    const html = await fetchViaProxy(url);
    if (!html || html.length < 500) throw new Error('Page FFBB vide ou trop courte');

    // Nouveau parser HTML direct (FFBB 2026 = Next.js App Router)
    const teamHint = (state.ffbb.teamName || '').trim();
    const matches = parseClubMatchesFromHTML(html, teamHint || null);
    const standings = parseStandingsFromHTML(html);

    if (matches.length === 0) {
      // Diag : extraire un échantillon de HTML pour comprendre la structure
      const snippet = html.replace(/\s+/g, ' ').slice(0, 300);
      throw new Error('Aucun match trouvé sur cette page. Vérifie l\'URL du club FFBB. Aperçu : ' + snippet);
    }

    state.ffbb.matches = matches;
    state.ffbb.standings = standings;
    state.ffbb.lastSync = new Date().toISOString();
    state.ffbb.syncing = false;
    persist();

  } catch (e) {
    state.ffbb.syncing = false;
    state.ffbb.syncError = e.message || String(e);

  }
}

          </div>

              ⚠ ${esc(f.syncError)}<br>
              <span style="color:var(--ink-3);font-size:10px">Le proxy public peut être saturé. Réessaie dans 1 min ou change d'URL.</span>

        ${upcoming.length > 0 ? `
          <div class="section-header">
            <div>
              <div class="eyebrow">À venir</div>
              <h2 class="display-md mt-2">Prochains matchs</h2>
            </div>
          </div>
          <div class="list-section">
            ${upcoming.map(m => ffbbMatchRow(m, f.teamName)).join('')}

        ${recent.length > 0 ? `

            <div>
              <div class="eyebrow">Résultats</div>
              <h2 class="display-md mt-2">Derniers matchs</h2>
            </div>
          </div>
          <div class="list-section">
            ${recent.map(m => ffbbMatchRow(m, f.teamName)).join('')}

        ${standings.length > 0 ? `
          <div class="section-header">
            <div>
              <div class="eyebrow">Classement</div>
              <h2 class="display-md mt-2">Poule</h2>

          </div>
          <div class="list-section">
            <div class="stats-wrap">
              <table class="stats-table">
                <thead><tr><th>#</th><th>Équipe</th><th>MJ</th><th>V</th><th>D</th><th>Pts</th></tr></thead>
                <tbody>
                  ${standings.map(s => {
                    const isMe = (s.team || '').toLowerCase().includes(teamLower);
                    return `<tr style="${isMe ? 'background:var(--orange-soft)' : ''}">

                      <td>${s.played ?? '-'}</td>
                      <td>${s.wins ?? '-'}</td>
                      <td>${s.losses ?? '-'}</td>

      <div style="padding:20px 18px;text-align:center;font-size:10px;color:var(--ink-4);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.1em">

  `;
}

function ffbbMatchRow(m, myTeamName) {
  const teamLower = (myTeamName || '').toLowerCase();
  const isHome = (m.home || '').toLowerCase().includes(teamLower);
  const myScore = isHome ? m.scoreHome : m.scoreAway;
  const oppScore = isHome ? m.scoreAway : m.scoreHome;
  const opp = isHome ? m.away : m.home;
  // Détermine résultat seulement si on a 2 scores valides
  const hasValidScores = m.played && myScore != null && oppScore != null && !isNaN(myScore) && !isNaN(oppScore);
  const win = hasValidScores && myScore > oppScore;
  const loss = hasValidScores && myScore < oppScore;
  const badge = hasValidScores
    ? (win ? '<div class="match-result-badge match-result-w">V</div>' : '<div class="match-result-badge match-result-l">D</div>')
    : '<div class="match-result-badge" style="background:var(--bg-3);color:var(--ink-3)">→</div>';

  // Date formatée
  let dateLabel = '';
  if (m.date && typeof m.date === 'string' && m.date.match(/^\d{4}-\d{2}-\d{2}$/)) {
    const d = new Date(m.date + 'T00:00:00');
    dateLabel = d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' });
  } else if (m.date) {
    dateLabel = String(m.date);
  } else {
    dateLabel = 'Date inconnue';
  }

  return `
    <div class="match-row" style="cursor:default">
      ${badge}
      <div style="flex:1;min-width:0">
        <div style="font-family:'Anton';font-size:14px;text-transform:uppercase;letter-spacing:0.02em">${isHome ? '' : '@ '}${esc(opp || 'Adversaire inconnu')}</div>
        <div style="font-size:11px;color:var(--ink-3);margin-top:2px;font-family:'JetBrains Mono';text-transform:uppercase">${dateLabel}${m.time ? ' · ' + m.time : ''}${isHome ? ' · DOM' : ' · EXT'}</div>
      </div>
      ${hasValidScores
        ? `<div class="match-score">${myScore}–${oppScore}</div>`
        : (m.time
          ? `<div style="font-family:'JetBrains Mono';font-size:11px;color:var(--orange);text-transform:uppercase">${esc(m.time)}</div>`
          : `<div style="font-family:'JetBrains Mono';font-size:10px;color:var(--ink-3);text-transform:uppercase">À venir</div>`
        )}
    </div>
  `;
}

function editFFBBConfig() {
  const f = state.ffbb;
  openModal(`
    <div class="modal-header">
      <div class="modal-title">Configuration FFBB</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div style="padding:10px 12px;background:var(--bg-3);border-left:3px solid var(--orange);border-radius:6px;margin-bottom:14px;font-size:12px;color:var(--ink-2);line-height:1.5">
        Va sur <strong>competitions.ffbb.com</strong>, cherche ton club, copie l'URL de la page de ton équipe (qui contient ton calendrier et classement).
      </div>
      <div class="fld">
        <label class="fld-label">URL de la page club/équipe FFBB</label>
        <input id="ffbb-url" value="${esc(f.clubUrl || '')}" placeholder="https://competitions.ffbb.com/ligues/occ/comites/0065/clubs/...">
      </div>
      <div class="fld">
        <label class="fld-label">Nom de mon équipe (pour la détection auto)</label>
        <input id="ffbb-team" value="${esc(f.teamName || '')}" placeholder="IE - BASKET CLUB L'ISLOIS - 2">
        <div style="margin-top:6px;font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono'">Permet de détecter automatiquement V/D et de surligner ta ligne dans le classement</div>
      </div>
      ${f.rawDataSnippet ? `
        <div style="margin-top:14px;padding:10px;background:var(--bg-1);border:1px solid var(--border);border-radius:6px">
          <div class="eyebrow-muted" style="margin-bottom:4px">Debug · 200 premiers car. du dernier scrape</div>
          <div style="font-family:'JetBrains Mono';font-size:9px;color:var(--ink-3);word-break:break-all;line-height:1.4">${esc(f.rawDataSnippet)}...</div>
        </div>
      ` : ''}
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="saveFFBBConfig()">Enregistrer & synchroniser</button>
    </div>
  `);
  setTimeout(() => document.getElementById('ffbb-url')?.focus(), 100);

function saveFFBBConfig() {
  state.ffbb.clubUrl = document.getElementById('ffbb-url').value.trim();
  state.ffbb.teamName = document.getElementById('ffbb-team').value.trim();
  persist();
  closeModal();
  syncFFBB();
}

            </div>
            <div style="font-family:'Anton';font-size:28px;text-transform:uppercase;line-height:1;margin-bottom:8px;letter-spacing:0.02em">L'Islois vs ${esc(liveStreamMatch.opponent)}</div>
            <div style="font-size:13px;opacity:0.95;font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.06em">${liveStreamMatch.home ? 'À domicile' : 'À l\'extérieur'} · ${formatDate(liveStreamMatch.date, 'long')}</div>
            <a href="${esc(liveStreamMatch.liveStreamUrl)}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;margin-top:16px;padding:13px 20px;background:black;color:white;text-decoration:none;border-radius:8px;font-family:'JetBrains Mono';font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em">▶ Regarder le live ↗</a><div style="font-size:10px;opacity:0.7;margin-top:6px;font-family:'JetBrains Mono';letter-spacing:0.06em">OUVRE LA PLATEFORME (YOUTUBE / TWITCH / FFBB.TV)</div>

// Réagir au changement de hash dans l'URL
window.addEventListener('hashchange', () => render());

// ============================================================
// MAIN RENDER
// ============================================================
function render() {
  // Cleanup : convoc match orphelines + création auto convoc pour matchs sans convoc
  if (typeof cleanupOrphanMatchConvocs === 'function') cleanupOrphanMatchConvocs();
  // Vérifier l'attribution automatique des badges pour les défis terminés
  if (typeof checkAndAwardBadges === 'function') checkAndAwardBadges();
  // Portail public via hash #public
  if (window.location.hash === '#public') {
    document.getElementById('root').innerHTML = renderPublic();
    // Auto-refresh toutes les 5 sec si un match est diffusé
    if (state.matches.some(m => m.publicLive)) {
      if (!window._publicRefresh) {
        window._publicRefresh = setInterval(() => {
          // Recharger l'état depuis localStorage (changements faits par le stat'man)
          state.matches = load(K.matches, []);
          document.getElementById('root').innerHTML = renderPublic();
        }, 5000);
      }
    }
    return;
  }

  if (!state.auth) {
    document.getElementById('root').innerHTML = renderAuth();
    return;
  }

  const role = state.auth.role;
  let content = '';

  if (role === 'coach') {
    if (state.section === 'home') content = renderHomeCoach();
    else if (state.section === 'plays') content = renderPlays();
    else if (state.section === 'matches') content = renderMatches();
    else if (state.section === 'team') content = renderTeam();
    else if (state.section === 'inspire') content = renderInspire();
    else if (state.section === 'ffbb') content = renderFFBB();
  } else if (role === 'stat') {
    if (state.section === 'live') content = renderLive();
    else if (state.section === 'matches') content = renderMatches();
    else if (state.section === 'team') content = renderTeam();
    else if (state.section === 'ffbb') content = renderFFBB();
  } else if (role === 'player') {
    // Legacy section IDs → redirection vers la nouvelle archi 5 onglets
    if (state.section === 'matches') state.section = 'calendrier';
    if (state.section === 'mystats') state.section = 'home';
    if (state.section === 'team') state.section = 'calendrier';
    if (state.section === 'ffbb') state.section = 'calendrier';
    if (state.section === 'home') content = renderHomePlayer();
    else if (state.section === 'plays') content = renderPlays();
    else if (state.section === 'challenges') content = renderPlayerChallenges();
    else if (state.section === 'calendrier') content = renderPlayerCalendrier();
    else if (state.section === 'programme') content = renderPlayerProgramme();
    else content = renderHomePlayer();
  }

  document.getElementById('root').innerHTML = `
    <div class="app">
      ${renderTopbar()}
      <main>${content}</main>
    </div>
    ${renderNav()}
  `;
}

render();
</script>
