// Joueuses actuellement sur le terrain (max 5)
function getOnCourt(m) {
  if (!m.onCourt) return [];
  return state.players.filter(p => m.onCourt.includes(p.id));
}

// Initialise les 5 du terrain : prend les 5 premières du roster (si pas déjà défini)
function ensureOnCourt(m) {
  if (m.onCourt && Array.isArray(m.onCourt) && m.onCourt.length > 0) return;
  const roster = getMatchRoster(m);
  m.onCourt = roster.slice(0, 5).map(p => p.id);
}

// Récupère la liste des joueuses retenues pour un match
// Priorité : m.roster.included si défini, sinon présentes à la convoc 'match' du même jour, sinon toutes
// SAISON : si roster.included n'est pas défini (cas legacy ou match sans
// convoc liée), on fallback sur l'effectif de la SAISON du match (ou la
// saison courante si m.seasonId absent). On laisse intentionnellement le
// lookup global pour les IDs déjà persistés dans m.roster.included (cas
// joueuse partie depuis : on veut quand même la voir au boxscore).
function getMatchRoster(m) {
  if (m.roster && Array.isArray(m.roster.included)) {
    return (state.players || []).filter(p => m.roster.included.includes(p.id));
  }
  const _matchSeasonId = m.seasonId || state.currentSeasonId;
  const _seasonPool = _seasonsLoaded() && _matchSeasonId
    ? getSeasonPlayers(_matchSeasonId)
    : (state.players || []);
  // Chercher la convoc match du même jour
  const sameDayConvoc = (state.convocations || []).find(c =>
    c.type === 'match' && c.date === m.date
  );
  if (sameDayConvoc) {
    const responses = sameDayConvoc.responses || {};
    // Présentes = ceux sans réponse ou avec status 'present'
    return _seasonPool.filter(p => !responses[p.id] || responses[p.id].status === 'present');
  }
  // Fallback : tout l'effectif de la saison
  return _seasonPool;
}

// Initialise le roster du match si pas encore défini
function ensureMatchRoster(m) {
  if (m.roster && Array.isArray(m.roster.included)) return;
  const auto = getMatchRoster(m);
  m.roster = { included: auto.map(p => p.id) };
}

// Modale de gestion de l'effectif du match (ajouter/retirer une joueuse)
function openRosterManager(matchId) {
  const m = state.matches.find(x => x.id === matchId);
  if (!m) return;
  ensureMatchRoster(m);

  // SAISON :
  // - included = on résout TOUS les IDs déjà persistés dans m.roster.included
  //   (cross-saison voulu : si une joueuse a quitté la saison entre-temps,
  //   on la garde visible sur la feuille de match déjà figée).
  // - excluded = joueuses dispo à AJOUTER : on les prend uniquement parmi
  //   l'effectif de la saison du match (pas de joueuses parties proposées).
  const included = (state.players || []).filter(p => m.roster.included.includes(p.id));
  const _matchSeasonId = m.seasonId || state.currentSeasonId;
  const _seasonPool = _seasonsLoaded() && _matchSeasonId
    ? getSeasonPlayers(_matchSeasonId)
    : (state.players || []);
  const excluded = _seasonPool.filter(p => !m.roster.included.includes(p.id));

  // Chercher la convoc match du même jour pour afficher contexte
  const sameDayConvoc = (state.convocations || []).find(c => c.type === 'match' && c.date === m.date);

  openModal(`
    <div class="modal-header">
      <div>
        <div class="eyebrow">vs ${esc(m.opponent)}</div>
        <div class="modal-title">👥 Effectif du match</div>
      </div>

        ${sameDayConvoc ? 'Liste initiale basée sur les présences de la convocation du jour.' : 'Aucune convocation match trouvée pour cette date. L\'effectif est manuel.'} Tu peux retirer/ajouter une joueuse à tout moment.
      </div>

      <!-- Sur le terrain (retenues) -->
      <div class="eyebrow-muted" style="margin-bottom:8px">✓ Sur la feuille de match (${included.length})</div>
      <div style="display:flex;flex-direction:column;gap:4px;margin-bottom:14px">
        ${included.length === 0 ? `<div style="padding:14px;text-align:center;color:var(--ink-3);font-size:12px;font-style:italic">Aucune joueuse retenue</div>` : included.map(p => `
          <div class="roster-row">
            ${p.photo ? `<img src="${p.photo}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;border:1.5px solid var(--orange)">` : `<div style="width:32px;height:32px;border-radius:50%;background:var(--bg-3);display:flex;align-items:center;justify-content:center;font-family:'Anton';font-size:12px;color:var(--orange)">${esc(p.name.charAt(0).toUpperCase())}</div>`}
            <div style="flex:1;min-width:0">
              <div style="font-family:'Anton';font-size:13px;text-transform:uppercase">#${p.num} ${esc(p.name)}</div>
              ${p.injury && p.injury.status && p.injury.status !== 'apte' ? `<div style="font-size:9px;color:var(--orange);font-family:'JetBrains Mono';margin-top:2px">⚠ ${esc((INJURY_STATUS[p.injury.status]||{}).label || '')}</div>` : ''}
            </div>
            <button class="btn btn-icon" onclick="toggleRosterPlayer('${matchId}','${p.id}',false)" style="color:var(--red)" title="Retirer">✕</button>
          </div>
        `).join('')}
      </div>

      <!-- Pas retenues -->
      ${excluded.length > 0 ? `
        <div class="eyebrow-muted" style="margin-bottom:8px;color:var(--ink-4)">○ Pas sur la feuille (${excluded.length})</div>
        <div style="display:flex;flex-direction:column;gap:4px">
          ${excluded.map(p => {
            // Récupérer raison absence si dispo
            const resp = sameDayConvoc && sameDayConvoc.responses && sameDayConvoc.responses[p.id];
            const reason = resp && resp.status === 'absent' ? resp.reason : null;
            return `
              <div class="roster-row" style="opacity:0.7">
                ${p.photo ? `<img src="${p.photo}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;border:1.5px solid var(--border);filter:grayscale(0.5)">` : `<div style="width:32px;height:32px;border-radius:50%;background:var(--bg-3);display:flex;align-items:center;justify-content:center;font-family:'Anton';font-size:12px;color:var(--ink-3)">${esc(p.name.charAt(0).toUpperCase())}</div>`}
                <div style="flex:1;min-width:0">
                  <div style="font-family:'Anton';font-size:13px;text-transform:uppercase;color:var(--ink-3)">#${p.num} ${esc(p.name)}</div>
                  ${reason ? `<div style="font-size:9px;color:var(--red);font-family:'JetBrains Mono';margin-top:2px;text-transform:uppercase">${esc(reason)}</div>` : ''}
                </div>
                <button class="btn btn-icon" onclick="toggleRosterPlayer('${matchId}','${p.id}',true)" style="color:var(--green)" title="Ajouter">+</button>
              </div>
            `;
          }).join('')}
        </div>
      ` : ''}
      ${(state.auth.role === 'coach' || state.auth.role === 'stat') ? `
        <div style="margin-top:18px;padding:12px;background:var(--bg-2);border:1px dashed var(--orange);border-radius:8px">
          <div class="eyebrow-muted" style="margin-bottom:6px;color:var(--orange)">📋 Déléguer la saisie stats</div>
          <div style="font-size:11px;color:var(--ink-2);line-height:1.5;margin-bottom:10px">
            Tu peux confier le tracker stats à une joueuse du banc. Elle pourra saisir les actions sans avoir besoin du PIN stat'man. Tu reprends le contrôle en sortant via le bouton ← Quitter.
          </div>
          <button class="btn btn-primary btn-block" onclick="delegateStatsToPlayer('${matchId}')" style="font-size:11px">
            👤 → 📋 Passer en mode délégation
          </button>
        </div>
      ` : ''}
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary btn-block" onclick="closeModal()">Fermer</button>
    </div>
  `);
}

// Délégation : passer le tracker en mode "kiosque" pour une joueuse du banc
function delegateStatsToPlayer(matchId) {
  const m = state.matches.find(x => x.id === matchId);
  if (!m) return;
  if (!confirm("Passer en mode délégation ?\n\nLa joueuse pourra saisir les stats. Pour reprendre le contrôle, sors via ← Quitter puis re-logue-toi.\n\nLe match en cours est conservé.")) return;

  // Sauvegarder le rôle actuel pour pouvoir revenir
  state._delegationFrom = { role: state.auth.role, playerId: state.auth.playerId };
  // Passer en mode stat'man
  state.auth = { role: 'stat', playerId: null, delegated: true };
  state.section = 'live';
  // S'assurer que le live est actif sur ce match
  if (!state.live || state.live.matchId !== matchId) {
    state.live = { matchId, mode: 'tap', selectedPlayer: null, log: load(K.liveSession + '_' + matchId, []) };
  }
  persist();
  closeModal();
  render();
  alert('✓ Mode délégation activé.\n\nLa joueuse peut saisir les stats. Pour reprendre, sors via ← Quitter en haut à droite.');
}

// ============================================================
// ROTATION : gérer le 5 sur le terrain (stat'man / coach)
// ============================================================

// Modale de rotation : terrain + banc côte à côte
function openRotationModal(matchId) {
  const m = state.matches.find(x => x.id === matchId);
  if (!m) return;
  ensureMatchRoster(m);
  ensureOnCourt(m);
  state._rotationSelectedCourt = null; // pid du terrain sélectionné pour échange
  renderRotationModal(matchId);
}

function renderRotationModal(matchId) {
  const m = state.matches.find(x => x.id === matchId);
  if (!m) return;
  const roster = getMatchRoster(m);
  const onCourtIds = m.onCourt || [];
  const courtPlayers = roster.filter(p => onCourtIds.includes(p.id));
  const benchPlayers = roster.filter(p => !onCourtIds.includes(p.id));
  const selectedCourt = state._rotationSelectedCourt;

  openModal(`
    <div class="modal-header">
      <div>
        <div class="eyebrow">${courtPlayers.length}/5 sur le terrain</div>
        <div class="modal-title">🔄 Rotation</div>
      </div>
      <button class="modal-close" onclick="state._rotationSelectedCourt=null;closeModal();render()">✕</button>
    </div>
    <div class="modal-body">
      <div style="padding:10px 12px;background:var(--bg-3);border-left:3px solid var(--orange);border-radius:6px;margin-bottom:14px;font-size:11px;color:var(--ink-2);line-height:1.5">
        ${selectedCourt ? '<strong style="color:var(--orange)">⇄ Tap une joueuse du banc pour l\'échanger</strong>' : 'Pour échanger : tap une joueuse du terrain (elle devient sélectionnée), puis tap une du banc.<br>Ou tap directement une joueuse du banc pour faire entrer.'}
      </div>

      <!-- TERRAIN -->
      <div class="eyebrow-muted mb-2" style="color:var(--orange)">● Sur le terrain (${courtPlayers.length}/5)</div>
      <div class="rotation-grid">
        ${courtPlayers.map(p => `
          <div class="rotation-tile court ${selectedCourt === p.id ? 'selected-out' : ''}" onclick="selectCourtForSwap('${matchId}','${p.id}')">
            ${p.photo ? `<img src="${p.photo}" class="rotation-tile-photo">` : `<div class="rotation-tile-photo rotation-tile-photo-fallback">${esc(p.name.charAt(0).toUpperCase())}</div>`}
            <div class="rotation-tile-info">
              <div style="font-family:'Anton';font-size:13px;text-transform:uppercase;line-height:1.1">#${p.num} ${esc(p.name.split(' ')[0])}</div>
              ${selectedCourt === p.id ? '<div style="font-size:9px;color:var(--red);font-family:\'JetBrains Mono\';margin-top:2px;text-transform:uppercase;letter-spacing:0.06em">⇆ SORT</div>' : ''}
            </div>
          </div>
        `).join('')}
        ${Array.from({length: Math.max(0, 5 - courtPlayers.length)}, () => `
          <div class="rotation-tile court empty">
            <div style="font-family:'Anton';font-size:28px;color:var(--ink-4);text-align:center;line-height:60px">+</div>
            <div style="font-size:9px;color:var(--ink-4);font-family:'JetBrains Mono';text-align:center;text-transform:uppercase">Vide</div>
          </div>
        `).join('')}
      </div>

      <!-- BANC -->
      <div class="eyebrow-muted mb-2" style="margin-top:18px">Banc (${benchPlayers.length})</div>
      ${benchPlayers.length === 0 ? `<div style="padding:14px;text-align:center;color:var(--ink-3);font-size:12px;font-style:italic">Banc vide</div>` : `
        <div class="rotation-grid">
          ${benchPlayers.map(p => `
            <div class="rotation-tile bench" onclick="rotateFromBench('${matchId}','${p.id}')">
              ${p.photo ? `<img src="${p.photo}" class="rotation-tile-photo">` : `<div class="rotation-tile-photo rotation-tile-photo-fallback">${esc(p.name.charAt(0).toUpperCase())}</div>`}
              <div class="rotation-tile-info">
                <div style="font-family:'Anton';font-size:13px;text-transform:uppercase;line-height:1.1;color:var(--ink-2)">#${p.num} ${esc(p.name.split(' ')[0])}</div>
                ${selectedCourt ? '<div style="font-size:9px;color:var(--green);font-family:\'JetBrains Mono\';margin-top:2px;text-transform:uppercase;letter-spacing:0.06em">⇆ ENTRE</div>' : '<div style="font-size:9px;color:var(--green);font-family:\'JetBrains Mono\';margin-top:2px;text-transform:uppercase;letter-spacing:0.06em">+ ENTRER</div>'}
              </div>
            </div>
          `).join('')}
        </div>
      `}
    </div>
    <div class="modal-footer">
      ${selectedCourt ? `<button class="btn btn-secondary btn-block" onclick="state._rotationSelectedCourt=null;renderRotationModal('${matchId}')">Annuler sélection</button>` : ''}
      <button class="btn btn-primary btn-block" onclick="state._rotationSelectedCourt=null;closeModal();render()">Terminé</button>
    </div>
  `);
}

// Tap une joueuse du terrain : la marque comme "à sortir" (ou désélectionne)
function selectCourtForSwap(matchId, pid) {
  if (state._rotationSelectedCourt === pid) {
    state._rotationSelectedCourt = null;
  } else {
    state._rotationSelectedCourt = pid;
  }
  renderRotationModal(matchId);
}

// Tap une joueuse du banc : soit échange (si terrain sélectionné), soit entre directement (si <5 sur terrain)
function rotateFromBench(matchId, benchPid) {
  const m = state.matches.find(x => x.id === matchId);
  if (!m) return;
  ensureOnCourt(m);

  if (state._rotationSelectedCourt) {
    // Échange : retire la sélectionnée + ajoute celle du banc
    m.onCourt = m.onCourt.filter(id => id !== state._rotationSelectedCourt);
    m.onCourt.push(benchPid);
    state._rotationSelectedCourt = null;
  } else if (m.onCourt.length < 5) {
    // Pas besoin d'échange : juste entrer
    m.onCourt.push(benchPid);
  } else {
    // Terrain plein, pas de sélection → demander
    alert("Tap d'abord une joueuse du terrain à faire sortir.");
    return;
  }
  persist();
  renderRotationModal(matchId);
}

// Échange rapide depuis le bandeau "Banc" du tracker : ouvre la modale de rotation
// avec déjà la joueuse du banc présélectionnée si terrain plein
function quickSwapToCourtPrompt(matchId, benchPid) {
  const m = state.matches.find(x => x.id === matchId);
  if (!m) return;
  ensureOnCourt(m);
  if (m.onCourt.length < 5) {
    // Pas plein, on fait entrer direct
    m.onCourt.push(benchPid);
    persist();
    render();
    return;
  }
  // Terrain plein : ouvrir la modale pour choisir qui sort
  state._rotationSelectedCourt = null;
  state._pendingBenchEntry = benchPid;
  openRotationModalWithEntry(matchId);
}

function openRotationModalWithEntry(matchId) {
  const m = state.matches.find(x => x.id === matchId);
  if (!m) return;
  const pid = state._pendingBenchEntry;
  state._pendingBenchEntry = null;
  const benchPlayer = state.players.find(p => p.id === pid);

  openModal(`
    <div class="modal-header">
      <div>
        <div class="eyebrow">${esc(benchPlayer.name)} veut entrer</div>
        <div class="modal-title">🔄 Choisir qui sort</div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div style="padding:10px 12px;background:var(--bg-3);border-left:3px solid var(--orange);border-radius:6px;margin-bottom:14px;font-size:11px;color:var(--ink-2);line-height:1.5">
        Tap la joueuse à faire sortir pour que <strong>${esc(benchPlayer.name)}</strong> prenne sa place.
      </div>
      <div class="rotation-grid">
        ${(m.onCourt || []).map(courtPid => {
          const p = state.players.find(x => x.id === courtPid);
          if (!p) return '';
          return `
            <div class="rotation-tile court" onclick="confirmSwap('${matchId}','${courtPid}','${pid}')">
              ${p.photo ? `<img src="${p.photo}" class="rotation-tile-photo">` : `<div class="rotation-tile-photo rotation-tile-photo-fallback">${esc(p.name.charAt(0).toUpperCase())}</div>`}
              <div class="rotation-tile-info">
                <div style="font-family:'Anton';font-size:13px;text-transform:uppercase;line-height:1.1">#${p.num} ${esc(p.name.split(' ')[0])}</div>
                <div style="font-size:9px;color:var(--red);font-family:'JetBrains Mono';margin-top:2px;text-transform:uppercase;letter-spacing:0.06em">⇆ Tap pour sortir</div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary btn-block" onclick="closeModal()">Annuler</button>
    </div>
  `);
}

function confirmSwap(matchId, outPid, inPid) {
  const m = state.matches.find(x => x.id === matchId);
  if (!m) return;
  ensureOnCourt(m);
  m.onCourt = m.onCourt.filter(id => id !== outPid);
  m.onCourt.push(inPid);
  persist();
  closeModal();
  render();
}

function toggleRosterPlayer(matchId, pid, include) {
  const m = state.matches.find(x => x.id === matchId);
  if (!m) return;
  ensureMatchRoster(m);
  if (include) {
    if (!m.roster.included.includes(pid)) m.roster.included.push(pid);
  } else {
    m.roster.included = m.roster.included.filter(x => x !== pid);
    // Si elle avait des stats, on les retire aussi (sinon elles restent fantômes)
    if (m.playerStats && m.playerStats[pid]) {
      if (!confirm('Cette joueuse a déjà des stats enregistrées. Les retirer aussi ?\n\nAnnuler pour la retirer de l\'effectif mais conserver ses stats.')) {
        // On la retire de l'effectif mais on garde les stats
      } else {
        delete m.playerStats[pid];
      }
    }
  }
  recalcMatchScore(m);
  persist();
  // Re-render la modale + la vue live
  closeModal();
  setTimeout(() => {
    openRosterManager(matchId);
    render();
  }, 50);
}

function startLive(matchId) {
  state.live = {
    matchId,
    mode: 'tap',
    selectedPlayer: null,
    log: load(K.liveSession + '_' + matchId, []),
  };
  render();
}

function exitLive() {
  // Si on était en délégation, restaurer le rôle d'origine
  if (state.auth && state.auth.delegated && state._delegationFrom) {
    if (!confirm('Quitter le mode délégation ?')) return;
    state.auth = state._delegationFrom;
    state._delegationFrom = null;
    state.section = state.auth.role === 'coach' ? 'home' : (state.auth.role === 'player' ? 'calendrier' : 'matches');
    persist();
    render();
    return;
  }
  _exitLiveOriginal();
}
function _exitLiveOriginal() {
  state.live = null;
  render();
}

function renderLiveTracker() {
  const m = state.matches.find(x => x.id === state.live.matchId);
  if (!m) { state.live = null; return renderLivePicker(); }

  const mode = state.live.mode;
  const selectedPid = state.live.selectedPlayer;

  // Effectif retenu pour ce match (basé sur les présences ou roster custom)
  ensureMatchRoster(m);
  ensureOnCourt(m);
  const roster = getMatchRoster(m);

  // Players avec leurs stats actuelles - SEULEMENT les retenues
  const playersWithStats = roster.map(p => {
    const s = (m.playerStats || {})[p.id] || {};
    return { ...p, stats: s, onCourt: (m.onCourt || []).includes(p.id) };
  });

  // Joueuses sur le terrain (max 5)
  const onCourtPlayers = playersWithStats.filter(p => p.onCourt);
  const benchPlayers = playersWithStats.filter(p => !p.onCourt);

  const myScore = m.scoreUs || 0;
  const oppScore = m.scoreOpp || 0;
  const isLeading = myScore > oppScore;
  const isTied = myScore === oppScore;
  const isPublic = m.publicLive;

  return `
    <div class="fade-up live-tracker">
      <div class="live-tracker-header">
        <div>
          <div class="eyebrow" style="display:flex;align-items:center;gap:6px">
            <span class="live-dot"></span>LIVE${isPublic ? '<span style="color:var(--orange);margin-left:8px;font-weight:700">· PORTAIL ON</span>' : ''}
          </div>
          <div class="display-md mt-2">vs ${esc(m.opponent)}</div>
          <div style="font-size:11px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:4px">${formatDate(m.date, 'long')} · ${roster.length} joueuses</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px">
          <button class="btn btn-secondary" onclick="openRosterManager('${m.id}')" style="font-size:10px;padding:6px 10px">👥 Effectif</button>
          <button class="btn btn-secondary" onclick="exitLive()" style="font-size:10px;padding:6px 10px">← Quitter</button>
        </div>
      </div>

      <!-- SCOREBOARD LIVE -->
      <div class="scoreboard-live">
        <div class="scoreboard-team scoreboard-us ${isLeading ? 'winning' : ''}">
          <div class="scoreboard-label">NOUS</div>
          <div class="scoreboard-value">${myScore}</div>
          <div class="scoreboard-sub">auto · depuis stats</div>
        </div>
        <div class="scoreboard-vs">${isTied ? '=' : (isLeading ? '▲' : '▼')}</div>
        <div class="scoreboard-team scoreboard-them ${!isLeading && !isTied ? 'winning' : ''}">
          <div class="scoreboard-label">${esc((m.opponent || '').slice(0,10).toUpperCase())}</div>
          <div class="scoreboard-value">${oppScore}</div>
          <div class="scoreboard-controls">
            <button class="sc-btn" onclick="oppScoreAdd(-1)">−1</button>
            <button class="sc-btn sc-plus" onclick="oppScoreAdd(1)">+1</button>
            <button class="sc-btn sc-plus" onclick="oppScoreAdd(2)">+2</button>
            <button class="sc-btn sc-plus" onclick="oppScoreAdd(3)">+3</button>
          </div>
        </div>
      </div>

      <div style="display:flex;gap:6px;margin:0 0 14px">
        <button class="btn ${isPublic ? 'btn-primary' : 'btn-secondary'} btn-block" onclick="togglePublicLive()" style="font-size:11px">
          ${isPublic ? '● DIFFUSION ACTIVE — clic pour arrêter' : '○ Diffuser sur le portail public'}
        </button>
        ${isPublic ? `<button class="btn btn-secondary" onclick="copyPublicLink()" style="font-size:11px;white-space:nowrap">🔗 Lien</button>` : ''}
      </div>

      <!-- Panneau 5 sur le terrain -->
      <div class="on-court-panel">
        <div class="on-court-header">
          <div class="eyebrow-muted" style="font-size:9px;color:var(--orange);letter-spacing:0.1em">● ${onCourtPlayers.length}/5 sur le terrain</div>
          <button class="btn btn-secondary" onclick="openRotationModal('${m.id}')" style="font-size:11px;padding:6px 12px">🔄 Rotation</button>
        </div>
        <div class="on-court-grid">
          ${onCourtPlayers.map(p => `
            <div class="court-tile ${selectedPid === p.id ? 'selected' : ''}" onclick="state.live.selectedPlayer='${p.id}';render()">
              ${p.photo ? `<img src="${p.photo}" class="court-tile-photo">` : `<div class="court-tile-photo court-tile-photo-fallback">${esc(p.name.charAt(0).toUpperCase())}</div>`}
              <div class="court-tile-num">#${p.num}</div>
              <div class="court-tile-name">${esc(p.name.split(' ')[0])}</div>
              <div class="court-tile-stats">${p.stats.pts || 0}<span style="color:var(--ink-4);font-size:8px">PTS</span> · ${p.stats.fouls || 0}<span style="color:var(--ink-4);font-size:8px">F</span></div>
            </div>
          `).join('')}
          ${Array.from({length: Math.max(0, 5 - onCourtPlayers.length)}, () => `
            <div class="court-tile court-tile-empty" onclick="openRotationModal('${m.id}')">
              <div style="font-family:'Anton';font-size:32px;color:var(--ink-4)">+</div>
              <div style="font-size:9px;color:var(--ink-4);font-family:'JetBrains Mono';text-transform:uppercase">Vide</div>
            </div>
          `).join('')}
        </div>
        ${benchPlayers.length > 0 ? `
          <div class="bench-strip">
            <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.1em;margin-right:4px;flex-shrink:0">Banc ·</div>
            ${benchPlayers.map(p => `
              <button class="bench-chip" onclick="quickSwapToCourtPrompt('${m.id}','${p.id}')" title="Faire entrer ${esc(p.name)}">
                #${p.num} ${esc(p.name.split(' ')[0])}
              </button>
            `).join('')}
          </div>
        ` : ''}
      </div>

      <div class="segmented" style="margin:0 0 14px">
        <button class="segmented-btn ${mode === 'tap' ? 'active' : ''}" onclick="state.live.mode='tap';render()">Tap actions</button>
        <button class="segmented-btn ${mode === 'counter' ? 'active' : ''}" onclick="state.live.mode='counter';render()">+/− Compteurs</button>
        <button class="segmented-btn ${mode === 'numpad' ? 'active' : ''}" onclick="state.live.mode='numpad';render()">Pavé num.</button>
      </div>

      ${mode === 'tap' ? renderLiveTap(m, onCourtPlayers, selectedPid) : ''}
      ${mode === 'counter' ? renderLiveCounter(m, onCourtPlayers) : ''}
      ${mode === 'numpad' ? renderLiveNumpad(m, playersWithStats) : ''}

      ${state.live.log.length > 0 ? `
        <div style="margin-top:20px">
          <div class="eyebrow-muted mb-2">Dernières actions</div>
          <div class="list-section" style="margin:0">
            <div class="log-list">
              ${state.live.log.slice(-10).reverse().map(entry => `
                <div class="log-item">
                  <span class="log-time">${entry.time}</span>
                  <span style="flex:1">${esc(entry.label)}</span>
                  <span style="color:${entry.value > 0 ? 'var(--green)' : 'var(--red)'}">${entry.value > 0 ? '+' : ''}${entry.value}</span>
                </div>
              `).join('')}
            </div>
          </div>
          <button class="btn btn-ghost btn-block mt-2" onclick="undoLastAction()">↶ Annuler la dernière action</button>
        </div>
      ` : ''}
    </div>
  `;
}

function renderLiveTap(m, players, selectedPid) {
  const selectedPlayer = players.find(p => p.id === selectedPid);
  return `
    <div>
      ${selectedPlayer ? `
        <div class="selected-banner">
          ${selectedPlayer.photo ? `<img src="${selectedPlayer.photo}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--orange)">` : `<div style="width:36px;height:36px;border-radius:50%;background:var(--orange);color:black;display:flex;align-items:center;justify-content:center;font-family:'Anton';font-size:14px">${esc(selectedPlayer.name.charAt(0).toUpperCase())}</div>`}
          <div style="flex:1">
            <div style="font-family:'Anton';font-size:14px;text-transform:uppercase;color:var(--orange)">#${selectedPlayer.num} ${esc(selectedPlayer.name)}</div>
            <div style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:2px;text-transform:uppercase">Joueuse sélectionnée · tap l'action ↓</div>
          </div>
        </div>
        <div class="action-grid">
          <button class="action-btn score" onclick="liveAction('p2i')"><span class="action-btn-icon">2I</span><span class="action-btn-label">2pts INT</span></button>
          <button class="action-btn score" onclick="liveAction('p2e')"><span class="action-btn-icon">2E</span><span class="action-btn-label">2pts MID</span></button>
          <button class="action-btn score" onclick="liveAction('p3')"><span class="action-btn-icon">3</span><span class="action-btn-label">3 PTS</span></button>
          <button class="action-btn score" onclick="liveAction('ca')" style="background:rgba(255,107,0,0.15);border-color:var(--orange)"><span class="action-btn-icon" style="color:var(--orange)">CA</span><span class="action-btn-label" style="color:var(--orange)">+2 C.ATTAQUE</span></button>
          <button class="action-btn miss" onclick="liveAction('p2iA')"><span class="action-btn-icon">2I</span><span class="action-btn-label">RATÉ INT</span></button>

function liveAction(key, increment) {
  if (!state.live.selectedPlayer) return;
  liveActionFor(state.live.selectedPlayer, key, increment);
}

function liveActionFor(playerId, key, increment) {
  const m = state.matches.find(x => x.id === state.live.matchId);
  if (!m) return;
  m.playerStats = m.playerStats || {};
  m.playerStats[playerId] = m.playerStats[playerId] || { min: 0, pts: 0, p2i: 0, p2iA: 0, p2e: 0, p2eA: 0, p3: 0, p3A: 0, ft: 0, ftA: 0, ca: 0, reb: 0, ast: 0, stl: 0, def: 0, to: 0, fouls: 0 };
  const s = m.playerStats[playerId];
  const inc = increment || 1;
  s[key] = (s[key] || 0) + inc;

  // Si tir réussi (clic sans increment), augmenter aussi tentatives + points
  if (key === 'p2i' && !increment) { s.p2iA = (s.p2iA || 0) + 1; s.pts = (s.pts || 0) + 2; }
  else if (key === 'p2e' && !increment) { s.p2eA = (s.p2eA || 0) + 1; s.pts = (s.pts || 0) + 2; }
  else if (key === 'p3' && !increment) { s.p3A = (s.p3A || 0) + 1; s.pts = (s.pts || 0) + 3; }
  else if (key === 'ft' && !increment) { s.ftA = (s.ftA || 0) + 1; s.pts = (s.pts || 0) + 1; }
  // CA = contre-attaque réussie : +2 au total + +1 sur p2i (puisque c'est un panier intérieur)
  else if (key === 'ca' && !increment) {
    s.pts = (s.pts || 0) + 2;
    s.p2i = (s.p2i || 0) + 1;
    s.p2iA = (s.p2iA || 0) + 1;
  }

  recalcMatchScore(m);

  const player = state.players.find(p => p.id === playerId);
  const labels = {
    p2i: '2pts INT ✓', p2iA: '2pts INT ✕', p2e: '2pts MID ✓', p2eA: '2pts MID ✕',
    p3: '3pts ✓', p3A: '3pts ✕', ft: 'LF ✓', ftA: 'LF ✕',
    ca: 'Contre-attaque ✓ (+2)',
    reb: 'Rebond', ast: 'Passe D.', stl: 'Interception', def: 'Déflexion',
    to: 'Perte', fouls: 'Faute', min: '+1 minute',
  };
  const points = { p2i: 2, p2e: 2, p3: 3, ft: 1, ca: 2 };
  const entryLabel = `#${player.num} ${player.name} · ${labels[key] || key}`;
  const entryValue = points[key] || (increment || 1);
  state.live.log.push({
    time: new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
    label: entryLabel,
    value: entryValue,
    playerId, key, inc,
  });
  save(K.liveSession + '_' + state.live.matchId, state.live.log);
  persist();
  // Realtime broadcast (uniquement si match en diffusion publique)
  if (m.publicLive && window.PbStore) {
    PbStore.upsertPlayerStats(m.id, playerId, s);
    PbStore.pushLiveEvent({ matchId: m.id, playerId, key, inc, value: entryValue, label: entryLabel });
    pushLiveScore(m);
  }
  render();
}

function recalcMatchScore(m) {
  let total = 0;
  Object.values(m.playerStats || {}).forEach(s => total += (s.pts || 0));
  m.scoreUs = total;
  m.lastLiveUpdate = Date.now();
}

// Push score live vers Supabase (no-op si pas connecté)
function pushLiveScore(m) {
  if (!window.PbStore || !m) return;
  try {
    PbStore.pushMatchScore(m.id, { scoreUs: m.scoreUs, scoreOpp: m.scoreOpp });
  } catch(e) {}
}

// Incrémenter le score adverse (boutons -1, +1, +2, +3)
function oppScoreAdd(delta) {
  const m = state.matches.find(x => x.id === state.live.matchId);
  if (!m) return;
  m.scoreOpp = Math.max(0, (m.scoreOpp || 0) + delta);
  m.lastLiveUpdate = Date.now();
  // Log dans la liste pour pouvoir annuler
  state.live.log.push({
    time: new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
    label: `Adversaire ${delta > 0 ? '+' : ''}${delta}`,
    value: delta,
    playerId: null, key: 'opp', inc: delta,
  });
  save(K.liveSession + '_' + state.live.matchId, state.live.log);
  persist();
  // Realtime broadcast
  if (m.publicLive && window.PbStore) {
    PbStore.pushLiveEvent({ matchId: m.id, playerId: null, key: 'opp', inc: delta, value: delta, label: `Adversaire ${delta > 0 ? '+' : ''}${delta}` });
    pushLiveScore(m);
  }
  render();
}

// Activer/désactiver la diffusion publique
function togglePublicLive() {
  const m = state.matches.find(x => x.id === state.live.matchId);
  if (!m) return;
  if (m.publicLive) {
    m.publicLive = false;
    persist();
    // Coupe la diffusion côté backend
    if (window.PbStore) PbStore.pushMatchScore(m.id, { scoreUs: m.scoreUs, scoreOpp: m.scoreOpp, publicLive: false });
    render();
    return;
  }
  // Désactiver les autres lives publics (un seul à la fois)
  state.matches.forEach(other => { if (other.id !== m.id) other.publicLive = false; });
  m.publicLive = true;
  m.publicLiveStartedAt = Date.now();
  persist();
  // Upsert le match dans Supabase pour que RLS autorise les events live
  if (window.PbStore) {
    PbStore.upsertMatch(m).then(() => {
      // Push initial des stats par joueuse pour pré-remplir
      Object.entries(m.playerStats || {}).forEach(([pid, s]) => PbStore.upsertPlayerStats(m.id, pid, s));
    });
  }
  render();
  setTimeout(() => {
    if (confirm('Diffusion activée ! Veux-tu copier le lien à partager ?')) copyPublicLink();
  }, 100);
}

function copyPublicLink() {
  const url = window.location.origin + window.location.pathname + '#public';
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => {
      alert('Lien copié :\n\n' + url + '\n\nPartage-le sur WhatsApp / groupe pour suivre en live.');
    }).catch(() => prompt('Copie ce lien :', url));
  } else {
    prompt('Copie ce lien :', url);
  }
}

function undoLastAction() {
  if (state.live.log.length === 0) return;
  const last = state.live.log.pop();
  const m = state.matches.find(x => x.id === state.live.matchId);

  // Cas spécial : score adverse
  if (last.key === 'opp') {
    m.scoreOpp = Math.max(0, (m.scoreOpp || 0) - (last.inc || 0));
    m.lastLiveUpdate = Date.now();
    save(K.liveSession + '_' + state.live.matchId, state.live.log);
    persist();
    render();
    return;
  }

  const s = m.playerStats[last.playerId];
  if (s) {
    s[last.key] = Math.max(0, (s[last.key] || 0) - (last.inc || 1));
    if (last.key === 'p2i' && !last.inc) { s.p2iA = Math.max(0, (s.p2iA || 0) - 1); s.pts = Math.max(0, (s.pts || 0) - 2); }
    else if (last.key === 'p2e' && !last.inc) { s.p2eA = Math.max(0, (s.p2eA || 0) - 1); s.pts = Math.max(0, (s.pts || 0) - 2); }
    else if (last.key === 'p3' && !last.inc) { s.p3A = Math.max(0, (s.p3A || 0) - 1); s.pts = Math.max(0, (s.pts || 0) - 3); }
    else if (last.key === 'ft' && !last.inc) { s.ftA = Math.max(0, (s.ftA || 0) - 1); s.pts = Math.max(0, (s.pts || 0) - 1); }
    else if (last.key === 'ca' && !last.inc) { s.p2i = Math.max(0, (s.p2i||0) - 1); s.p2iA = Math.max(0, (s.p2iA||0) - 1); s.pts = Math.max(0, (s.pts||0) - 2); }
  }
  recalcMatchScore(m);
  save(K.liveSession + '_' + state.live.matchId, state.live.log);
  persist();
  render();
}

        </div>
        <div class="stat-tile">
          <div class="stat-tile-label">+/− Moyen</div>
          <div class="stat-tile-value" style="color:${avgGS>=15?'var(--green)':avgGS<5?'var(--red)':'var(--orange)'}">${avgGS>=0?'+':''}${avgGS}</div>
          <div class="stat-tile-sub">contribution / match</div>

        <h2 class="display-md">Match par match</h2>

        <div class="empty">
          <div class="empty-icon">○</div>
          <div class="empty-title">Aucune stat enregistrée</div>
          <div class="empty-desc">Tes stats apparaîtront ici après les matchs</div>
        </div>

            return `

                  </div>
                </div>
                <div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px">
                  <div style="display:flex;align-items:baseline;gap:6px">
                    <div style="font-family:'Anton';font-size:22px">${s.pts || 0}</div>
                    <div style="font-family:'JetBrains Mono';font-size:11px;color:${gameScore(s)>=15?'var(--green)':gameScore(s)<5?'var(--red)':'var(--orange)'};font-weight:700">${gameScore(s)>=0?'+':''}${gameScore(s).toFixed(1)}</div>

const POSTES = [
  { id: 'pg', label: 'Meneuse', short: 'PG', num: '1' },
  { id: 'sg', label: 'Arrière', short: 'SG', num: '2' },
  { id: 'sf', label: 'Ailière', short: 'SF', num: '3' },
  { id: 'pf', label: 'Ailière forte', short: 'PF', num: '4' },
  { id: 'c',  label: 'Pivot', short: 'C',  num: '5' },
];

function renderLineups() {
  const lineups = state.lineups || [];
  return `
    <div class="px" style="padding-top:14px">
      <div style="padding:10px 12px;background:var(--bg-3);border-left:3px solid var(--orange);border-radius:6px;margin-bottom:14px;font-size:11px;color:var(--ink-2);line-height:1.5">
        <strong style="color:var(--orange)">🔒 Visible uniquement par le coach.</strong><br>
        Crée tes 5 de départ, rotations, ou compos spécifiques (ex : compo défense, compo zone, 5 finish).
      </div>
      <button class="btn btn-primary btn-block mb-3" onclick="editLineup()">+ Nouvelle composition</button>
    </div>

    ${lineups.length === 0 ? `
      <div class="empty">
        <div class="empty-icon">⛹</div>
        <div class="empty-title">Aucune composition</div>
        <div class="empty-desc">Crée ta 1ère compo : 5 de départ ou rotations</div>
      </div>
    ` : `
      <div class="list-section">
        ${lineups.map(l => lineupCard(l)).join('')}
      </div>
    `}
  `;
}

function lineupCard(l) {
  const starters = POSTES.map(p => {
    const pid = (l.starters || {})[p.id];
    const player = state.players.find(x => x.id === pid);
    return { poste: p, player };
  });
  return `
    <div class="lineup-card" onclick="viewLineup('${l.id}')">
      <div class="lineup-card-header">
        <div>
          <div class="eyebrow">${esc(l.tag || 'Composition')}</div>
          <h3 class="display-md mt-2">${esc(l.name)}</h3>
          ${l.notes ? `<div style="font-size:11px;color:var(--ink-3);margin-top:4px;font-style:italic">${esc(l.notes.slice(0, 80))}${l.notes.length > 80 ? '...' : ''}</div>` : ''}
        </div>
      </div>
      <div class="lineup-court">
        ${starters.map(s => `
          <div class="lineup-slot ${s.player ? '' : 'empty'}">
            <div class="lineup-slot-poste">${s.poste.num}</div>
            <div class="lineup-slot-name">${s.player ? esc(s.player.name.split(' ')[0]) : '—'}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function viewLineup(id) {
  const l = state.lineups.find(x => x.id === id);
  if (!l) return;
  openModal(`
    <div class="modal-header">
      <div>
        <div class="eyebrow">${esc(l.tag || 'Composition')}</div>
        <div class="modal-title">${esc(l.name)}</div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      ${l.notes ? `
        <div style="padding:10px 12px;background:var(--bg-3);border-radius:6px;margin-bottom:14px;font-size:12px;color:var(--ink-2);line-height:1.5;font-style:italic">
          ${esc(l.notes)}
        </div>
      ` : ''}
      <div class="eyebrow-muted mb-2">5 de départ</div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:18px">
        ${POSTES.map(p => {
          const titularePid = (l.starters || {})[p.id];
          const remplacantPid = (l.bench || {})[p.id];
          const titulaire = state.players.find(x => x.id === titularePid);
          const remplacant = state.players.find(x => x.id === remplacantPid);
          return `
            <div class="lineup-row">
              <div class="lineup-poste-badge">${p.num}</div>
              <div style="flex:1">
                <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.06em">${p.label} · ${p.short}</div>
                <div style="font-family:'Anton';font-size:15px;text-transform:uppercase;margin-top:2px;color:${titulaire?'var(--ink)':'var(--ink-4)'}">${titulaire ? esc(titulaire.name) : 'Non assigné'}</div>
                ${remplacant ? `<div style="font-size:10px;color:var(--orange);font-family:'JetBrains Mono';margin-top:2px;text-transform:uppercase">↻ ${esc(remplacant.name)}</div>` : ''}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
    <div class="modal-footer" style="flex-direction:column;gap:6px">
      <div style="display:flex;gap:6px;width:100%">
        <button class="btn btn-secondary btn-block" onclick="duplicateLineup('${id}')">⎘ Dupliquer</button>
        <button class="btn btn-secondary btn-block" onclick="editLineup('${id}')">✎ Modifier</button>
      </div>
      <button class="btn btn-ghost btn-block" style="color:var(--red)" onclick="deleteLineup('${id}')">🗑 Supprimer</button>
    </div>
  `);
}

function editLineup(id) {
  const existing = id ? state.lineups.find(x => x.id === id) : null;
  const l = existing ? JSON.parse(JSON.stringify(existing)) : {
    id: uid(), name: '', tag: '', notes: '', starters: {}, bench: {},
  };
  state._editingLineup = l;
  renderLineupEditor();
}

function renderLineupEditor() {
  const l = state._editingLineup;
  const isNew = !state.lineups.find(x => x.id === l.id);
  openModal(`
    <div class="modal-header">
      <div class="modal-title">${isNew ? 'Nouvelle compo' : 'Modifier compo'}</div>
      <button class="modal-close" onclick="closeModal();state._editingLineup=null">✕</button>
    </div>
    <div class="modal-body">
      <div class="fld">
        <label class="fld-label">Nom de la composition</label>
        <input id="l-name" value="${esc(l.name)}" placeholder="5 de départ, Compo zone, 5 finish..." oninput="state._editingLineup.name=this.value">
      </div>
      <div class="fld">
        <label class="fld-label">Tag (optionnel)</label>
        <input id="l-tag" value="${esc(l.tag)}" placeholder="Départ · Défense · Attaque · Rotation" oninput="state._editingLineup.tag=this.value">
      </div>

      <div class="eyebrow-muted" style="margin:14px 0 8px">Postes & joueuses</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${(() => {
          // SAISON : rotations / compos = saison courante uniquement
          const _seasonPool = currentSeasonPlayers();
          return POSTES.map(p => `
            <div class="lineup-edit-row">
              <div class="lineup-poste-badge">${p.num}</div>
              <div style="flex:1;min-width:0">
                <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px">${p.label} · ${p.short}</div>
                <select onchange="state._editingLineup.starters['${p.id}']=this.value||null" style="width:100%;padding:8px;background:var(--bg-2);border:1px solid var(--border);border-radius:6px;color:var(--ink);font-family:'Inter';font-size:12px;margin-bottom:4px">
                  <option value="">— Titulaire —</option>
                  ${_seasonPool.map(pl => `<option value="${pl.id}" ${(l.starters||{})[p.id]===pl.id?'selected':''}>#${pl.num} ${esc(pl.name)}</option>`).join('')}
                </select>
                <select onchange="state._editingLineup.bench['${p.id}']=this.value||null" style="width:100%;padding:6px;background:var(--bg-1);border:1px dashed var(--border);border-radius:6px;color:var(--orange);font-family:'Inter';font-size:11px">
                  <option value="">↻ Remplaçante (optionnel)</option>
                  ${_seasonPool.map(pl => `<option value="${pl.id}" ${(l.bench||{})[p.id]===pl.id?'selected':''}>↻ #${pl.num} ${esc(pl.name)}</option>`).join('')}
                </select>
              </div>
            </div>
          `).join('');
        })()}
      </div>

      <div class="fld" style="margin-top:14px">
        <label class="fld-label">Notes tactiques</label>
        <textarea id="l-notes" placeholder="Quand utiliser cette compo, points forts, points d'attention..." oninput="state._editingLineup.notes=this.value">${esc(l.notes)}</textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary btn-block" onclick="closeModal();state._editingLineup=null">Annuler</button>
      <button class="btn btn-primary btn-block" onclick="saveLineup()">Enregistrer</button>
    </div>
  `);
  setTimeout(() => document.getElementById('l-name')?.focus(), 100);
}

function saveLineup() {
  const l = state._editingLineup;
  if (!l.name || !l.name.trim()) { alert('Le nom est requis'); return; }
  const existing = state.lineups.findIndex(x => x.id === l.id);
  if (existing >= 0) state.lineups[existing] = l;
  else state.lineups.push(l);
  state._editingLineup = null;
  persist();
  closeModal();
  render();
}

function duplicateLineup(id) {
  const orig = state.lineups.find(x => x.id === id);
  if (!orig) return;
  const copy = JSON.parse(JSON.stringify(orig));
  copy.id = uid();
  copy.name = orig.name + ' (copie)';
  state.lineups.push(copy);
  persist();
  closeModal();
  render();
}

function deleteLineup(id) {
  if (!confirm('Supprimer cette composition ?')) return;
  state.lineups = state.lineups.filter(x => x.id !== id);
  persist();
  closeModal();
  render();
}

function renderConvocs() {
  const today = new Date(); today.setHours(0,0,0,0);
  const todayStr = isoDate(today);
  const isCoach = state.auth.role === 'coach';

  // 3 prochaines semaines d'instances
  const threeWeeksLater = new Date(today.getTime() + 21 * 86400000);
  const upcoming = getAllEventsBetween(todayStr, isoDate(threeWeeksLater));

  // Passées : derniers 30 jours
  const monthAgo = new Date(today.getTime() - 30 * 86400000);
  const past = getAllEventsBetween(isoDate(monthAgo), isoDate(new Date(today.getTime() - 86400000)));
  past.reverse();

  // Grouper upcoming par semaine
  const weeks = groupEventsByWeek(upcoming, today);

  return `
    <div style="padding:0 18px 12px;display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:12px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.05em">${upcoming.length} événement${upcoming.length>1?'s':''} sur 3 semaines</div>
      ${isCoach ? `<button class="btn btn-primary" onclick="editConvoc()">+ Nouveau</button>` : ''}
    </div>

    ${upcoming.length === 0 && past.length === 0 ? `
      <div class="empty">
        <div class="empty-icon">○</div>
        <div class="empty-title">Aucun événement</div>
        ${isCoach ? '<div class="empty-desc">Crée ton premier événement</div>' : ''}
      </div>
    ` : `
      ${weeks.map(w => `
        <div style="padding:14px 18px 6px">
          <div class="eyebrow">${w.label}</div>
        </div>
        ${w.events.length === 0 ? `
          <div style="padding:0 18px 12px;font-size:12px;color:var(--ink-4);font-style:italic">Aucun événement</div>
        ` : `
          <div class="list-section">
            ${w.events.map(e => eventInstanceRow(e, isCoach)).join('')}
          </div>
        `}
      `).join('')}

      ${past.length > 0 ? `
        <div style="padding:18px 18px 6px"><div class="eyebrow-muted">Passées (30 derniers jours)</div></div>
        <div class="list-section" style="opacity:0.7">
          ${past.slice(0, 10).map(e => eventInstanceRow(e, isCoach)).join('')}
        </div>
      ` : ''}
    `}
  `;
}

function groupEventsByWeek(events, today) {
  const weeks = [
    { label: 'Cette semaine', events: [] },
    { label: 'Semaine prochaine', events: [] },
    { label: 'Dans 2 semaines', events: [] },
  ];
  // Trouver le lundi de la semaine courante
  const monday = new Date(today);
  const offset = (today.getDay() + 6) % 7;
  monday.setDate(today.getDate() - offset);
  const w1End = new Date(monday.getTime() + 7 * 86400000);
  const w2End = new Date(monday.getTime() + 14 * 86400000);

  events.forEach(e => {
    const d = new Date(e.date + 'T00:00:00');
    if (d < w1End) weeks[0].events.push(e);
    else if (d < w2End) weeks[1].events.push(e);
    else weeks[2].events.push(e);
  });
  return weeks;
}

function convocCard(c, isPast, isCoach) {
  const responses = c.responses || {};
  // SAISON : on calcule présents/absents parmi l'effectif de la saison de
  // la convoc (ou saison courante en fallback).
  const _seasonId = c.seasonId || state.currentSeasonId;
  const _seasonPool = _seasonsLoaded() && _seasonId
    ? getSeasonPlayers(_seasonId)
    : (state.players || []);
  const present = _seasonPool.filter(p => !responses[p.id] || responses[p.id].status === 'present');
  const absent = _seasonPool.filter(p => responses[p.id] && responses[p.id].status === 'absent');
  const days = daysUntil(c.date);
  let dateLabel;
  if (isPast) dateLabel = formatDate(c.date, 'long');
  else if (days === 0) dateLabel = "Aujourd'hui";
  else if (days === 1) dateLabel = 'Demain';
  else if (days < 7) dateLabel = `Dans ${days}j`;
  else dateLabel = formatDate(c.date, 'long');

  // Match lié : récupérer pour afficher des infos contextuelles
  const linkedMatch = c.matchId ? state.matches.find(x => x.id === c.matchId) : null;
  const matchPlace = linkedMatch ? (linkedMatch.place || c.location || '') : (c.location || c.place || '');

  return `
    <div class="list-section" style="${isPast ? 'opacity:0.6' : ''}">
      <div style="padding:14px 16px;border-bottom:1px solid var(--border-soft)">
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
          <span class="chip ${c.type === 'match' ? 'chip-orange' : 'chip-blue'}">${c.type === 'match' ? '🏀 Match' : '● Entraînement'}</span>
          <span class="chip">${dateLabel}${c.time ? ' · ' + c.time : ''}</span>
          ${linkedMatch && !linkedMatch.home ? '<span class="chip">Extérieur</span>' : ''}
          ${linkedMatch && linkedMatch.home ? '<span class="chip">Domicile</span>' : ''}
        </div>
        <div style="font-family:'Anton';font-size:18px;text-transform:uppercase;letter-spacing:0.02em;margin-bottom:4px">${esc(c.title)}</div>
        ${matchPlace ? `<div style="font-size:12px;color:var(--ink-3);font-family:'JetBrains Mono'">⌖ ${esc(matchPlace)}</div>` : ''}
        ${linkedMatch && linkedMatch.time ? `<div style="font-size:11px;color:var(--orange);font-family:'JetBrains Mono';margin-top:4px;text-transform:uppercase;letter-spacing:0.04em">⏰ Match à ${esc(linkedMatch.time)}${linkedMatch.rdvTime ? ' · RDV ' + esc(linkedMatch.rdvTime) : ''}</div>` : ''}
        ${c.note ? `<div style="margin-top:10px;padding:10px 12px;background:var(--bg-3);border-left:2px solid var(--orange);border-radius:6px;font-size:13px;color:var(--ink-2);line-height:1.5;font-style:italic">"${esc(c.note)}"</div>` : ''}
        ${linkedMatch ? `<button class="btn btn-secondary" onclick="event.stopPropagation();openMatch('${linkedMatch.id}')" style="margin-top:10px;font-size:11px">🏀 Voir la fiche du match →</button>` : ''}
      </div>

      <div style="padding:12px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap">
        <div>
          <div style="font-family:'Anton';font-size:22px;color:var(--green);line-height:1">${present.length}</div>
          <div style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:2px">Présentes</div>
        </div>
        <div>
          <div style="font-family:'Anton';font-size:22px;color:${absent.length>0?'var(--red)':'var(--ink-4)'};line-height:1">${absent.length}</div>
          <div style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:2px">Absentes</div>
        </div>
        ${isCoach ? `
          <div style="flex:1;display:flex;justify-content:flex-end;gap:4px;align-items:center;flex-wrap:wrap">
            ${!c.closed ? `<button class="btn btn-secondary" style="font-size:10px;padding:6px 10px" onclick="closeConvocation('${c.id}')">✓ Clôturer</button>` : `<span class="chip chip-green" style="font-size:9px">✓ Comptabilisé</span>`}
            <button class="btn btn-icon" onclick="editConvoc('${c.id}')">✎</button>
            <button class="btn btn-icon" onclick="deleteConvoc('${c.id}')" style="color:var(--red)">🗑</button>
          </div>
        ` : ''}
      </div>

      ${!isPast && isCoach ? `
        <div style="padding:12px 16px;border-top:1px solid var(--border-soft)">
          <div class="eyebrow-muted mb-2">Présentes par défaut · tap pour signaler absence</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${present.map(p => {
              const inj = p.injury;
              const isAtRisk = inj && inj.status && inj.status !== 'apte';
              return `<button class="convoc-chip ${isAtRisk ? 'convoc-chip-at-risk' : ''}" onclick="coachDeclareAbsence('${c.id}','${p.id}')" title="${isAtRisk ? esc(inj.description || INJURY_STATUS[inj.status].label) : ''}">${isAtRisk ? (INJURY_STATUS[inj.status].icon + ' ') : ''}${esc(p.name)}</button>`;
            }).join('')}
          </div>
          ${absent.length > 0 ? `
            <div style="margin-top:12px">
              <div class="eyebrow-muted mb-2" style="color:var(--red)">Absentes</div>
              ${absent.map(p => {
                const r = responses[p.id];
                return `<div class="convoc-absent-row">
                  <div style="flex:1">

function toggleRecDay(d) {
  if (!state._tempRecurrence) state._tempRecurrence = { type: 'weekly', days: [], until: '' };

function saveConvoc(id, isNew) {
  const title = document.getElementById('cv-title').value.trim();
  if (!title) return alert('Titre requis');
  const existing = isNew ? null : state.convocations.find(x => x.id === id);
  const recType = state._tempRecurrence ? state._tempRecurrence.type : 'none';
  let recurrence = null;
  if (recType === 'weekly' && state._tempRecurrence.days.length > 0) {
    recurrence = {
      type: 'weekly',
      days: state._tempRecurrence.days,
      until: document.getElementById('cv-until') ? document.getElementById('cv-until').value : ''
    };
  }
  const obj = {
    id, title,
    type: document.getElementById('cv-type').value,
    date: document.getElementById('cv-date').value,
    time: document.getElementById('cv-time').value,
    location: document.getElementById('cv-loc').value.trim(),
    note: document.getElementById('cv-note').value.trim(),
    responses: existing ? (existing.responses || {}) : {},
    attachments: state._tempAttachments || [],
    recurrence,
    cancelledInstances: existing ? (existing.cancelledInstances || []) : [],
    instanceOverrides: existing ? (existing.instanceOverrides || {}) : {},
    // Préserver les liens et metadata match
    matchId: existing ? existing.matchId : undefined,
    home: existing ? existing.home : undefined,
    place: existing ? existing.place : undefined,
    callSheet: existing ? existing.callSheet : undefined,
    seasonId: existing ? (existing.seasonId || state.currentSeasonId || null) : (state.currentSeasonId || null),
  };
  if (isNew) state.convocations.unshift(obj);
  else { const i = state.convocations.findIndex(x => x.id === id); state.convocations[i] = obj; }
  state._tempAttachments = null;
  state._tempRecurrence = null;
  persist(); closeModal(); render();
}
function deleteConvoc(id) {
  const c = state.convocations.find(x => x.id === id);
  if (!c) return;
  // Si convoc liée à un match, prévenir
  if (c.matchId) {
    if (!confirm('Cette convocation est liée à un match.\n\nPour supprimer le match (et la convoc), va dans la section Matchs.\n\nVeux-tu quand même supprimer juste la convocation ?')) return;
    // Détacher le match de la convoc supprimée
    const m = state.matches.find(x => x.id === c.matchId);
    if (m) m.convocId = null;
  } else {
    if (!confirm('Supprimer cette convocation ?')) return;
  }
  state.convocations = state.convocations.filter(x => x.id !== id);
  persist(); render();
}

function closeConvocation(cid, instanceDate) {
  const c = state.convocations.find(x => x.id === cid);
  if (!c) return;
  // SAISON : comptabilise uniquement les joueuses de la saison de la convoc
  const _seasonId = c.seasonId || state.currentSeasonId;
  const _seasonPool = _seasonsLoaded() && _seasonId
    ? getSeasonPlayers(_seasonId)
    : (state.players || []);
  // Pour récurrence : clôturer l'instance spécifique
  if (c.recurrence && instanceDate) {
    c.instanceOverrides = c.instanceOverrides || {};
    c.instanceOverrides[instanceDate] = c.instanceOverrides[instanceDate] || {};
    if (c.instanceOverrides[instanceDate].closed) return;
    if (!confirm("Cloturer cette occurrence ?\nLes presences seront comptabilisees.")) return;
    const ov = c.instanceOverrides[instanceDate];
    const responses = ov.responses || c.responses || {};
    const presentPlayers = _seasonPool.filter(p => !responses[p.id] || responses[p.id].status === 'present');
    const targetType = c.type === 'match' ? 'attendance_match' : 'attendance_training';
    const ch = state.challenges.find(x => x.type === targetType && x.autoCount);
    if (ch) {
      ch.scores = ch.scores || {};
      presentPlayers.forEach(p => { ch.scores[p.id] = (ch.scores[p.id] || 0) + 1; });
    }
    ov.closed = true;
  } else {
    if (c.closed) return;
    if (!confirm("Cloturer cette convocation ?\nLes presences seront comptabilisees.")) return;
    const responses = c.responses || {};
    const presentPlayers = _seasonPool.filter(p => !responses[p.id] || responses[p.id].status === 'present');
    const targetType = c.type === 'match' ? 'attendance_match' : 'attendance_training';
    const ch = state.challenges.find(x => x.type === targetType && x.autoCount);
    if (ch) {
      ch.scores = ch.scores || {};
      presentPlayers.forEach(p => { ch.scores[p.id] = (ch.scores[p.id] || 0) + 1; });
    }
    c.closed = true;
  }
  persist(); render();
}

// Ouvre la modale détail d'une instance (récurrente ou non)
// ============================================================
// V8: PRÉPARATION ENTRAÎNEMENT (plans liés aux convocs training)
// ============================================================
// c.trainingPlan = {
//   exercises: [{ id, source: 'play'|'custom', playId?, title, description, duration, groups: [{name, players:[]}] }],
//   validated: bool,
//   validatedAt: timestamp,
//   completedExercises: { exerciseId: true } // côté joueuse
// }

// ============================================================
// PHASE 2 — Plans d'entraînement persistés PAR INSTANCE (sync cross-device)
// ------------------------------------------------------------
// Le plan vivait sur c.trainingPlan (localStorage only). On le déporte dans
// l'entité synchronisée state.trainingPlans, indexée par (convocationId,
// instanceDate). Pour ne pas réécrire les ~48 sites qui lisent/mutent
// c.trainingPlan, on utilise un LIVE-BINDING : resolveTrainingPlan() fait
// pointer c.trainingPlan vers l'objet `plan` de l'entrée per-instance. Toutes
// les mutations existantes + persist() (qui dump l'entité) restent valides.
// ============================================================
function _emptyPlan() { return { exercises: [], validated: false, completedExercises: {} }; }

function _normalizePlan(plan) {
  if (!plan) return _emptyPlan();
  if (!plan.exercises) plan.exercises = [];
  if (!plan.completedExercises) plan.completedExercises = {};
  if (typeof plan.validated !== 'boolean') plan.validated = false;
  return plan;
}

// Lecture seule : retourne le plan per-instance s'il existe, sinon le plan
// legacy (c.trainingPlan) pour la date de base, sinon un plan vide. NE CRÉE
// PAS d'entrée (évite de polluer la BD quand le coach ne fait que consulter).
function getTrainingPlan(convocId, instanceDate) {
  const c = state.convocations.find(x => x.id === convocId);
  if (!c) return null;
  const idate = instanceDate || c.date;
  const entry = (state.trainingPlans || []).find(tp => tp.convocationId === convocId && tp.instanceDate === idate);
  if (entry) return _normalizePlan(entry.plan);
  // Fallback legacy (plan convoc-level non encore migré), uniquement date de base
  if (idate === c.date && c.trainingPlan && (c.trainingPlan.exercises || []).length) {
    return _normalizePlan(c.trainingPlan);
  }
  return _emptyPlan();
}

// Résout (et crée si besoin) l'entrée per-instance, puis bind c.trainingPlan
// dessus. À appeler à chaque ENTRÉE d'édition/lecture mutante d'un plan.
function resolveTrainingPlan(c, instanceDate) {
  if (!c) return _emptyPlan();
  const idate = instanceDate || c.date;
  state.trainingPlans = state.trainingPlans || [];
  let entry = state.trainingPlans.find(tp => tp.convocationId === c.id && tp.instanceDate === idate);
  if (!entry) {
    entry = {
      convocationId: c.id,
      instanceDate: idate,
      seasonId: c.seasonId || state.currentSeasonId || null,
      plan: _emptyPlan(),
      updatedAt: Date.now(),
    };
    state.trainingPlans.push(entry);
  }
  _normalizePlan(entry.plan);
  // LIVE-BINDING : les 48 sites existants mutent c.trainingPlan → on le fait
  // pointer sur l'objet synchronisé. persist() dump state.trainingPlans qui
  // contient CE MÊME objet → la mutation est capturée sans réécriture.
  c.trainingPlan = entry.plan;
  return entry.plan;
}

// Migration one-shot, idempotente : pour chaque convoc portant un ancien plan
// convoc-level (c.trainingPlan avec exercices) sans entrée per-instance pour sa
// date de base, on crée l'entrée per-instance (date de base). Sûr à rejouer.
function _migrateLegacyTrainingPlans() {
  if (!Array.isArray(state.convocations)) return;
  state.trainingPlans = state.trainingPlans || [];
  let migrated = 0;
  state.convocations.forEach(c => {
    const legacy = c.trainingPlan;
    if (!legacy || !(legacy.exercises || []).length) return;
    const idate = c.date;
    const exists = state.trainingPlans.find(tp => tp.convocationId === c.id && tp.instanceDate === idate);
    if (exists) return;
    state.trainingPlans.push({
      convocationId: c.id,
      instanceDate: idate,
      seasonId: c.seasonId || state.currentSeasonId || null,
      plan: _normalizePlan(legacy),
      updatedAt: Date.now(),
    });
    migrated++;
  });
  if (migrated) { console.log('[migration] training plans legacy → per-instance:', migrated); persist(); }
}

function ensureTrainingPlan(c) {
  if (!c.trainingPlan) c.trainingPlan = { exercises: [], validated: false, completedExercises: {} };
  if (!c.trainingPlan.exercises) c.trainingPlan.exercises = [];
  if (!c.trainingPlan.completedExercises) c.trainingPlan.completedExercises = {};
}

// Modale principale : préparer/éditer le plan d'entraînement
function openTrainingPlanEditor(convocId, dateStr) {
  const c = state.convocations.find(x => x.id === convocId);
  if (!c) {
    alert('Convocation introuvable.');
    return;
  }
  const _idate = dateStr || c.date;
  // PHASE 2 : bind c.trainingPlan sur le plan per-instance synchronisé (le crée
  // si besoin). Toutes les mutations en aval (add/move/remove/validate) opèrent
  // donc sur l'objet synchronisé, capturé par persist() → dump.
  resolveTrainingPlan(c, _idate);
  state._editingTraining = { convocId, dateStr: _idate };
  renderTrainingPlanEditor();
}

function renderTrainingPlanEditor() {
  if (!state._editingTraining) {
    console.warn('renderTrainingPlanEditor: state._editingTraining manquant');

  // PHASE 2 : re-bind à chaque render (un apply() realtime a pu reconstruire
  // les objets de state.trainingPlans → la ref c.trainingPlan serait orpheline).
  const plan = resolveTrainingPlan(c, dateStr || c.date);
  const totalDuration = plan.exercises.reduce((acc, ex) => acc + (ex.duration || 0), 0);

  openModal(`

    </div>
    <div class="modal-body">
      ${plan.validated ? `
        <div style="padding:10px 12px;background:rgba(34,197,94,0.10);border-left:3px solid var(--green);border-radius:6px;margin-bottom:14px;font-size:11px;color:var(--ink-2);line-height:1.5">

          🔒 <strong style="color:var(--orange)">Brouillon</strong> — pas encore visible par les joueuses. Valide en bas quand c'est prêt.
        </div>
      `}

      <!-- Stats du plan -->
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:14px">
        <div class="stat-tile">
          <div class="stat-tile-label">Exercices</div>
          <div class="stat-tile-value">${plan.exercises.length}</div>
        </div>
        <div class="stat-tile">
          <div class="stat-tile-label">Durée totale</div>
          <div class="stat-tile-value">${totalDuration}<span style="font-size:14px;color:var(--ink-4)">min</span></div>
        </div>
      </div>

      <!-- Liste des exercices avec drag-and-drop -->
      ${plan.exercises.length === 0 ? `
        <div class="empty" style="padding:30px 16px;border:1px dashed var(--border);border-radius:8px">

          <div class="empty-title">Plan vide</div>
          <div class="empty-desc">Ajoute des exos depuis la bibliothèque ou crée-en un</div>

// ============================================================
// OPTION B (2026-06) — ATELIERS + ROTATIONS RETIRÉS
// ------------------------------------------------------------
// La matrice ateliers × rotations était sur-conçue et peu utilisée (un coach
// annonce ses rotations sur le terrain). On ne garde QUE les groupes de joueuses
// par exercice (cf. section 👥 dans renderExerciseDetail). Les données existantes
// (ex.workshops / ex.rotations, et l'ancien plan.workshop_rotations global) sont
// ARCHIVÉES dans ex._archive_workshop_rotations (au cas où on réactiverait), puis
// retirées de la structure vivante. Fonction conservée sous son ancien nom pour
// ne pas toucher l'appel au boot ; idempotente (rejouée = no-op une fois archivé).
// ============================================================
function _migrateLegacyWorkshopRotations() {
  let archived = 0;
  const archivePlan = (plan) => {
    if (!plan) return;
    // 1) ancien format global (PR #36) → on le rabat sur le 1er exercice avant archive
    if (plan.workshop_rotations) {
      const wr = plan.workshop_rotations;
      if (Array.isArray(plan.exercises) && plan.exercises.length) {
        const ex0 = plan.exercises[0];
        if (!Array.isArray(ex0.workshops) || ex0.workshops.length === 0) ex0.workshops = wr.workshops || [];
        if (!Array.isArray(ex0.rotations) || ex0.rotations.length === 0) ex0.rotations = wr.rotations || [];
      }
      delete plan.workshop_rotations;
    }
    // 2) per-exercice (PR #38) → archive + strip
    (plan.exercises || []).forEach(ex => {
      const hasW = Array.isArray(ex.workshops) && ex.workshops.length;
      const hasR = Array.isArray(ex.rotations) && ex.rotations.length;
      if (hasW || hasR) {
        ex._archive_workshop_rotations = {
          workshops: ex.workshops || [],
          rotations: ex.rotations || [],
        };
        archived++;
      }
      delete ex.workshops;
      delete ex.rotations;
    });
  };
  (state.trainingPlans || []).forEach(tp => { try { archivePlan(tp.plan); } catch (e) {} });
  (state.convocations || []).forEach(c => { try { archivePlan(c.trainingPlan); } catch (e) {} });
  if (archived) {
    console.warn('[archive] ateliers/rotations retirés (Option B), archivés sur ' + archived + ' exercice(s)');
    persist();
  }
}

// Indicateur transitoire "✓ Sauvegardé" (rassure le coach que l'édition du plan

function _flashSaved(msg) {

      el.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99999;background:var(--green,#22c55e);color:#fff;font-family:\'JetBrains Mono\',monospace;font-size:12px;font-weight:700;padding:8px 16px;border-radius:20px;box-shadow:0 4px 16px rgba(0,0,0,0.3);opacity:0;transition:opacity .2s;pointer-events:none';
      document.body.appendChild(el);

// Calcule l'heure de début/fin de chaque exo à partir de l'heure de la convoc
function computeExerciseTimes(plan, startHHMM) {
  if (!startHHMM || !/^\d{1,2}:\d{2}$/.test(startHHMM)) return null;
  const [h, m] = startHHMM.split(':').map(Number);
  let cursor = h * 60 + m;
  const times = [];
  for (const ex of (plan.exercises || [])) {
    const startH = Math.floor(cursor / 60);
    const startM = cursor % 60;
    const dur = parseInt(ex.duration) || 0;
    cursor += dur;
    const endH = Math.floor(cursor / 60);
    const endM = cursor % 60;
    times.push({
      start: String(startH).padStart(2, '0') + ':' + String(startM).padStart(2, '0'),
      end: String(endH).padStart(2, '0') + ':' + String(endM).padStart(2, '0'),
    });
  }
  return times;
}

// Drag-and-drop entre lignes
function initTrainingDragDrop() {
  const list = document.getElementById('training-exos-list');
  if (!list) return;
  let dragIdx = null;

  list.querySelectorAll('.training-exo-row').forEach(row => {
    row.addEventListener('dragstart', e => {
      dragIdx = parseInt(row.dataset.idx);
      row.style.opacity = '0.4';
      e.dataTransfer.effectAllowed = 'move';
    });
    row.addEventListener('dragend', () => {
      row.style.opacity = '';
    });
    row.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      row.style.borderTop = '2px solid var(--orange)';
    });
    row.addEventListener('dragleave', () => {
      row.style.borderTop = '';
    });
    row.addEventListener('drop', e => {
      e.preventDefault();
      row.style.borderTop = '';
      const dropIdx = parseInt(row.dataset.idx);
      if (dragIdx === null || dragIdx === dropIdx) return;
      const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
      const arr = c.trainingPlan.exercises;
      const [moved] = arr.splice(dragIdx, 1);
      arr.splice(dropIdx, 0, moved);
      persist();
      renderTrainingPlanEditor();
    });
  });
}

function moveTrainingExercise(idx, delta) {
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
  const arr = c.trainingPlan.exercises;
  const newIdx = idx + delta;
  if (newIdx < 0 || newIdx >= arr.length) return;
  const tmp = arr[idx]; arr[idx] = arr[newIdx]; arr[newIdx] = tmp;
  persist();
  renderTrainingPlanEditor();
}

function removeTrainingExercise(idx) {
  if (!state._editingTraining) return;
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
  if (!c || !c.trainingPlan) return;
  const ex = c.trainingPlan.exercises[idx];
  if (!ex) return;
  // Modale de confirmation custom (confirm() natif peut être bloqué en sandbox)
  openModal(`
    <div class="modal-header">
      <div class="modal-title">Retirer l'exercice ?</div>

function doRemoveTrainingExercise(idx) {
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);

  c.trainingPlan.exercises.splice(idx, 1);

  if (!state._editingTraining) return;
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);

function renderPlayPicker() {

  if (filter.concept) filtered = filtered.filter(p => (p.concepts || []).includes(filter.concept));
  if (filter.search) {
    const q = filter.search.toLowerCase();
    filtered = filtered.filter(p =>
      p.title.toLowerCase().includes(q) ||
      (p.desc || '').toLowerCase().includes(q) ||
      (p.tags || []).some(t => t.toLowerCase().includes(q))
    );
  }

  // Tous les concepts utilisés dans les plays pour filtres rapides
  const usedConcepts = new Set();
  state.plays.forEach(p => (p.concepts || []).forEach(c => usedConcepts.add(c)));
  const conceptList = [...usedConcepts].sort();

  openModal(`
    <div class="modal-header">
      <div>
        <div class="eyebrow">${filtered.length} / ${state.plays.length} plays</div>

        `).join('')}
      </div>

      <!-- Filtre concept -->
      ${conceptList.length > 0 ? `
        <div class="eyebrow-muted" style="margin-bottom:6px;font-size:9px">Filtrer par concept</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px">

function addPlayToTrainingPlan(playId) {
  if (!state._editingTraining) {
    console.warn('addPlayToTrainingPlan: pas de training en édition');
    return;
  }
  const p = state.plays.find(x => x.id === playId);
  if (!p) return;
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
  if (!c) return;
  ensureTrainingPlan(c);
  c.trainingPlan.exercises.push({
    id: uid(),
    source: 'play',
    playId: p.id,
    title: p.title,
    description: p.desc || '',
    duration: 10,
    groups: [{ name: 'Toute l\'équipe', players: [] }],
  });
  persist();
  // Ferme la modale picker actuelle puis ré-ouvre l'éditeur du plan après animation
  closeModal();
  setTimeout(() => renderTrainingPlanEditor(), 80);
}

async function addCustomExoImages(event) {
  const files = Array.from(event.target.files || []);
  if (!files.length) return;
  for (const file of files) {
    try {
      const compressed = await compressImage(file, 1000, 0.8);
      state._customExoBuffer.images.push(compressed);
    } catch (e) { console.error(e); }
  }
  renderCustomExerciseModal();
}

function removeCustomExoImage(idx) {
  state._customExoBuffer.images.splice(idx, 1);
  renderCustomExerciseModal();
}

async function addCustomExoFiles(event) {
  const files = Array.from(event.target.files || []);
  if (!files.length) return;
  for (const file of files) {
    // Limite : 5 Mo par fichier pour éviter d'exploser localStorage
    if (file.size > 5 * 1024 * 1024) {
      alert('Fichier trop volumineux : ' + file.name + ' (max 5 Mo)');
      continue;
    }
    try {
      const dataUrl = await new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = reject;
        r.readAsDataURL(file);
      });
      state._customExoBuffer.files.push({
        name: file.name,
        type: file.type || 'application/pdf',
        size: file.size,
        data: dataUrl
      });
    } catch (e) { console.error(e); }
  }
  renderCustomExerciseModal();
}

function removeCustomExoFile(idx) {
  state._customExoBuffer.files.splice(idx, 1);
  renderCustomExerciseModal();
}

function confirmAddCustomExercise() {
  const title = (document.getElementById('custom-ex-title')?.value || '').trim();
  if (!title) { alert('Titre requis'); return; }
  const duration = parseInt(document.getElementById('custom-ex-duration')?.value) || 10;
  const desc = (document.getElementById('custom-ex-desc')?.value || '').trim();
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
  if (!c) return;
  ensureTrainingPlan(c);
  const buf = state._customExoBuffer || { images: [], files: [] };
  c.trainingPlan.exercises.push({
    id: uid(),
    source: 'custom',
    title,
    description: desc,
    duration,
    images: buf.images.slice(),
    attachments: buf.files.slice(),
    groups: [{ name: "Toute l'équipe", players: [] }],
  });
  state._customExoBuffer = null;
  persist();
  closeModal();
  setTimeout(() => renderTrainingPlanEditor(), 50);
}

// === Détail / édition d'un exercice du plan ===
function openTrainingExerciseDetail(idx) {
  if (!state._editingTraining) return;
  state._editingExerciseIdx = idx;
  // Fermer modale plan, ouvrir modale exo
  closeModal();
  setTimeout(() => renderExerciseDetail(), 80);
}

function renderExerciseDetail() {
  if (!state._editingTraining) return;
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
  if (!c || !c.trainingPlan) return;
  const idx = state._editingExerciseIdx;
  const ex = c.trainingPlan.exercises[idx];
  if (!ex) return;
  const linkedPlay = ex.source === 'play' && ex.playId ? state.plays.find(p => p.id === ex.playId) : null;

  // Auto-nettoyage : retirer les IDs orphelins des groupes (joueuses qui n'existent plus).
  // Les guests sont stockées préfixées `guest:<id>` — on les préserve si la guest existe encore.
  const validIds = new Set(state.players.map(p => p.id));
  const validGuestIds = new Set((state.guestPlayers || []).map(g => g.id));
  let cleaned = false;
  (ex.groups || []).forEach(g => {
    const before = (g.players || []).length;
    g.players = (g.players || []).filter(pid => {
      if (typeof pid === 'string' && pid.startsWith('guest:')) {
        return validGuestIds.has(pid.slice(6));
      }
      return validIds.has(pid);
    });
    if (g.players.length !== before) cleaned = true;
  });
  if (cleaned) persist();

  const groups = ex.groups || [{ name: 'Toute l\'équipe', players: [] }];

  // Joueuses présentes ce jour-là (basé sur les responses de la convoc)
  // SAISON : on scope l'effectif sur la saison de la convoc
  const { dateStr } = state._editingTraining;
  const _instDate = dateStr || c.date;
  const instance = makeConvocInstance(c, _instDate);
  const responses = instance.responses || {};
  const _seasonId = c.seasonId || state.currentSeasonId;
  const _seasonPool = _seasonsLoaded() && _seasonId
    ? getSeasonPlayers(_seasonId)
    : (state.players || []);
  const presentPlayers = _seasonPool.filter(p => {
    const r = responses[p.id];
    return !r || r.status !== 'absent';

  // INVITÉES de l'instance — ajoutées au pool sélectionnable comme les régulières.
  // Clé interne préfixée pour distinguer dans `g.players` (rétrocompat : les IDs
  // existants restent en uuid brut, seules les nouvelles entrées guest sont préfixées).
  const instanceGuests = (c.type === 'training') ? getTrainingGuests(c.id, _instDate) : [];
  const presentEntities = [
    ...presentPlayers.map(p => ({ kind: 'player', key: p.id, full: p })),
    ...instanceGuests.map(g => ({ kind: 'guest', key: 'guest:' + g.id, full: g })),

  // Entités non encore assignées à un groupe dans cet exo (parmi les présentes + invitées)
  const assignedKeys = new Set();

    <div class="modal-body" ${_modalScrollAttr('exo')}>

      <div class="fld">
        <label class="fld-label">Titre</label>
        <input id="ex-title" value="${esc(ex.title)}" onchange="updateExerciseField('title',this.value)">
      </div>

      <div class="fld">
        <label class="fld-label">Durée (minutes)</label>
        <input id="ex-duration" type="number" min="1" max="180" value="${ex.duration || 10}" onchange="updateExerciseField('duration',parseInt(this.value)||10)">
      </div>

      <div class="fld">
        <label class="fld-label">Description / consignes</label>
        <textarea id="ex-desc" rows="3" placeholder="Objectif, consignes, variantes..." onchange="updateExerciseField('description',this.value)">${esc(ex.description || '')}</textarea>

          📚 Lié au play <strong style="color:var(--orange)">${esc(linkedPlay.title)}</strong>
          ${(linkedPlay.concepts && linkedPlay.concepts.length > 0) ? `
            <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px">
              ${linkedPlay.concepts.map(c => {

                return `<span class="concept-chip selected" style="--color:${CONCEPT_CAT_COLORS[cat]};font-size:9px;padding:3px 7px">${esc(c)}</span>`;

          <button class="btn btn-ghost" onclick="goToPlayFromTraining('${linkedPlay.id}')" style="display:block;margin-top:8px;font-size:10px">→ Voir la fiche play complète</button>

                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}

        <!-- Images propres à l'exo (éditables) -->
        ${ex.images && ex.images.length > 0 ? `

        <!-- Bouton ajouter -->
        <label class="btn btn-secondary btn-block" style="cursor:pointer;font-size:11px;margin-top:4px">

      <!-- VIDÉO HÉRITÉE DU PLAY LIÉ -->

        <!-- Documents hérités du play -->

          <div style="display:flex;flex-direction:column;gap:4px;margin-bottom:8px">
            ${linkedPlay.attachments.map(f => `
              <a href="${f.data || f.url || '#'}" target="_blank" rel="noopener" download="${esc(f.name || 'document')}" style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,107,0,0.06);border:1px solid var(--border-soft);border-radius:6px;text-decoration:none;color:inherit">
