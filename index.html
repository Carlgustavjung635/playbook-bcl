// ============================================================
// PLAYER · Onglet "Agenda" — convocations / matchs + FFBB read-only
// ============================================================
function renderPlayerCalendrier() {
  const p = currentPlayer();
  if (!p) return renderHomeCoach();
  const today = new Date(); today.setHours(0,0,0,0);
  const todayStr = isoDate(today);
  const fourWeeksLater = new Date(today.getTime() + 28 * 86400000);
  const upcoming = getAllEventsBetween(todayStr, isoDate(fourWeeksLater));
  // Événements passés sur 30j
  const pastStart = new Date(today.getTime() - 30 * 86400000);
  const past = getAllEventsBetween(isoDate(pastStart), todayStr).reverse();

  const f = state.ffbb || {};
  const ffbbMatches = f.matches || [];
  const ffbbStandings = f.standings || [];
  const isPlayed = m => m.played && m.scoreHome != null && m.scoreAway != null && !isNaN(m.scoreHome) && !isNaN(m.scoreAway);
  const teamLower = (f.teamName || '').toLowerCase();
  const ffbbUpcoming = ffbbMatches.filter(m => !isPlayed(m) && (
    (m.home || '').toLowerCase().includes(teamLower) ||
    (m.away || '').toLowerCase().includes(teamLower)
  )).slice(0, 6);
  const ffbbRecent = ffbbMatches.filter(m => isPlayed(m) && (
    (m.home || '').toLowerCase().includes(teamLower) ||
    (m.away || '').toLowerCase().includes(teamLower)
  )).reverse().slice(0, 6);

  return `
    <div class="fade-up">
      <div class="section-header">
        <div>
          <div class="eyebrow">${upcoming.length} à venir · ${past.length} récent${past.length>1?'s':''}</div>
          <h2 class="display-lg mt-2">Agenda</h2>
        </div>
      </div>

      ${upcoming.length > 0 ? `
        <div class="section-header"><div><div class="eyebrow">4 prochaines semaines</div><h2 class="display-md mt-2">À venir</h2></div></div>
        <div class="list-section">
          ${upcoming.slice(0, 10).map(ev => playerEventRow(ev, p.id)).join('')}
        </div>
      ` : `
        <div class="empty" style="padding:24px"><div class="empty-icon">○</div><div class="empty-title">Aucun événement prévu</div></div>
      `}

      ${past.length > 0 ? `
        <div class="section-header"><div><div class="eyebrow">30 derniers jours</div><h2 class="display-md mt-2">Récent</h2></div></div>
        <div class="list-section">
          ${past.slice(0, 6).map(ev => playerEventRow(ev, p.id)).join('')}
        </div>
      ` : ''}

      <!-- FFBB read-only -->
      ${(ffbbUpcoming.length > 0 || ffbbRecent.length > 0 || ffbbStandings.length > 0) ? `
        <div class="section-header" style="margin-top:8px">
          <div>
            <div class="eyebrow">Championnat</div>
            <h2 class="display-md mt-2">FFBB</h2>
          </div>
        </div>
        ${f.teamName ? `
          <div style="padding:0 18px;margin-bottom:12px">
            <div style="padding:10px 12px;background:var(--bg-2);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;gap:10px">
              <div style="width:28px;height:28px;border-radius:6px;background:var(--orange-soft);display:flex;align-items:center;justify-content:center;font-family:'Anton';color:var(--orange);font-size:13px">F</div>
              <div style="flex:1;min-width:0">
                <div style="font-family:'Anton';font-size:12px;text-transform:uppercase;letter-spacing:0.02em">${esc(f.teamName)}</div>
                <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono'">${f.lastSync ? 'Sync ' + new Date(f.lastSync).toLocaleString('fr-FR', {dateStyle:'short', timeStyle:'short'}) : '○ Non synchro'}</div>
              </div>
            </div>
          </div>
        ` : ''}

        ${ffbbUpcoming.length > 0 ? `
          <div class="section-header"><div><div class="eyebrow-muted">Calendrier FFBB</div><h2 class="display-md mt-2" style="font-size:16px;color:var(--ink-2)">Prochains</h2></div></div>
          <div class="list-section">
            ${ffbbUpcoming.map(m => ffbbMatchRow(m, f.teamName)).join('')}
          </div>
        ` : ''}

        ${ffbbRecent.length > 0 ? `
          <div class="section-header"><div><div class="eyebrow-muted">Résultats FFBB</div><h2 class="display-md mt-2" style="font-size:16px;color:var(--ink-2)">Derniers</h2></div></div>
          <div class="list-section">
            ${ffbbRecent.map(m => ffbbMatchRow(m, f.teamName)).join('')}
          </div>
        ` : ''}

        ${ffbbStandings.length > 0 ? `
          <div class="section-header"><div><div class="eyebrow-muted">Classement</div><h2 class="display-md mt-2" style="font-size:16px;color:var(--ink-2)">Poule</h2></div></div>
          <div class="list-section">
            <div class="stats-wrap">
              <table class="stats-table">
                <thead><tr><th>#</th><th>Équipe</th><th>MJ</th><th>V</th><th>D</th><th>Pts</th></tr></thead>
                <tbody>
                  ${ffbbStandings.map(s => {
                    const isMe = (s.team || '').toLowerCase().includes(teamLower);
                    return `<tr style="${isMe ? 'background:var(--orange-soft)' : ''}">
                      <td class="num">${s.rank ?? '-'}</td>
                      <td style="font-family:'Anton';font-size:12px;text-transform:uppercase">${esc(s.team)}</td>
                      <td>${s.played ?? '-'}</td>
                      <td>${s.wins ?? '-'}</td>
                      <td>${s.losses ?? '-'}</td>
                      <td class="num">${s.points ?? '-'}</td>
                    </tr>`;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        ` : ''}
      ` : ''}
    </div>
  `;
}

// ============================================================
// PLAYER · Onglet "Forme" — programme estival + exercices à valider
// ============================================================
function renderPlayerProgramme() {
  const p = currentPlayer();
  if (!p) return renderHomeCoach();
  const o = state.offseason;
  const myBadges = (p.badges || []).length;

  if (!o) {
    return `
      <div class="fade-up">
        <div class="section-header">
          <div><div class="eyebrow">Prépa physique</div><h2 class="display-lg mt-2">Forme</h2></div>
        </div>
        <div class="empty"><div class="empty-icon">💪</div><div class="empty-title">Aucun programme</div><div class="empty-desc">Ton coach n'a pas encore configuré la prépa.</div></div>
      </div>
    `;
  }

  const todayStr = new Date().toISOString().slice(0,10);
  const beforeStart = o.startDate && todayStr < o.startDate;
  const afterEnd = o.endDate && todayStr > o.endDate;
  const active = !beforeStart && !afterEnd;
  const weekKey = getWeekKey();
  state.offseasonLogs = state.offseasonLogs || {};
  state.offseasonLogs[p.id] = state.offseasonLogs[p.id] || {};
  state.offseasonLogs[p.id][weekKey] = state.offseasonLogs[p.id][weekKey] || {};
  const log = state.offseasonLogs[p.id][weekKey];
  const doneCount = active ? o.exercises.filter(ex => log[ex.id] && log[ex.id].done).length : 0;
  const pct = active && o.exercises.length > 0 ? Math.round((doneCount / o.exercises.length) * 100) : 0;
  const color = pct >= 70 ? 'var(--green)' : pct >= 40 ? 'var(--orange)' : pct > 0 ? 'var(--orange)' : 'var(--red)';

  let banner;
  if (beforeStart) banner = `<div style="padding:10px 12px;background:rgba(99,102,241,0.10);border-left:3px solid #6366f1;border-radius:6px;margin:0 18px 14px;font-size:12px;color:var(--ink-2);line-height:1.5">📅 <strong>Démarre le ${formatDate(o.startDate)}</strong>. Découvre le programme dès maintenant.</div>`;
  else if (afterEnd) banner = `<div style="padding:10px 12px;background:rgba(34,197,94,0.10);border-left:3px solid var(--green);border-radius:6px;margin:0 18px 14px;font-size:12px;color:var(--ink-2);line-height:1.5">🏁 <strong>Programme terminé le ${formatDate(o.endDate)}</strong>.</div>`;
  else banner = `<div style="padding:10px 12px;background:var(--bg-3);border-left:3px solid var(--orange);border-radius:6px;margin:0 18px 14px;font-size:11px;color:var(--ink-2);line-height:1.5">Coche chaque exercice fait cette semaine. Reset auto chaque lundi.</div>`;

  const allWeeks = Object.keys(state.offseasonLogs[p.id] || {}).filter(w => w !== weekKey).sort().reverse().slice(0, 4);

  return `
    <div class="fade-up">
      <div class="section-header">
        <div>
          <div class="eyebrow" style="color:var(--orange)">${active ? formatWeekRange() : (beforeStart ? 'À venir' : 'Terminé')}</div>
          <h2 class="display-lg mt-2">☀ ${esc(o.title)}</h2>
        </div>
      </div>

      ${banner}

      ${active ? `
        <div style="padding:0 18px;margin-bottom:14px">
          <div style="text-align:center;padding:14px;background:var(--bg-2);border-radius:10px;border:1px solid ${pct===100?'var(--green)':'var(--border)'}">
            <div style="font-family:'Anton';font-size:36px;color:${pct===100?'var(--green)':color};line-height:1">${doneCount}<span style="font-size:18px;color:var(--ink-4)">/${o.exercises.length}</span></div>
            <div style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.06em;margin:6px 0 10px">Exercices · ${pct}%</div>
            <div style="height:6px;background:var(--bg-1);border-radius:3px;overflow:hidden">
              <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--orange),${pct===100?'var(--green)':'#cc5400'});transition:width 0.3s"></div>
            </div>
          </div>
        </div>
      ` : ''}

      <div style="padding:0 18px;display:flex;flex-direction:column;gap:8px">
        ${o.exercises.map(ex => {
          const entry = log[ex.id] || {};
          const isDone = active && !!entry.done;
          const clickAttr = active ? `onclick="togglePlayerProgrammeExercise('${ex.id}')"` : '';
          return `
            <div class="warmup-step-do ${isDone ? 'done' : ''}" ${clickAttr} style="${active ? '' : 'cursor:default;opacity:0.85'}">
              <div style="font-family:'Anton';font-size:18px;color:${isDone?'var(--green)':'var(--orange)'};min-width:32px;text-align:center">${isDone ? '✓' : '○'}</div>
              <div style="flex:1;min-width:0">
                <div style="font-family:'Anton';font-size:14px;text-transform:uppercase;${isDone?'text-decoration:line-through;color:var(--ink-3)':''}">${esc(ex.label)}</div>
                <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:3px">
                  ${ex.target > 0 ? `<span style="font-size:10px;color:var(--orange);font-family:'JetBrains Mono';text-transform:uppercase">🎯 ${ex.target} ${esc(ex.unit || '')}</span>` : ''}
                  ${ex.notes ? `<span style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';font-style:italic">${esc(ex.notes)}</span>` : ''}
                </div>
              </div>
            </div>
          `;
        }).join('')}
      </div>

      ${allWeeks.length > 0 ? `
        <div class="section-header"><div><div class="eyebrow-muted">Historique</div><h2 class="display-md mt-2" style="font-size:16px;color:var(--ink-2)">Semaines passées</h2></div></div>
        <div style="padding:0 18px;display:flex;flex-direction:column;gap:4px;margin-bottom:18px">
          ${allWeeks.map(wk => {
            const wLog = state.offseasonLogs[p.id][wk] || {};
            const wDone = o.exercises.filter(ex => wLog[ex.id] && wLog[ex.id].done).length;
            const wPct = o.exercises.length > 0 ? Math.round((wDone / o.exercises.length) * 100) : 0;
            const c = wPct >= 80 ? 'var(--green)' : wPct >= 50 ? 'var(--orange)' : 'var(--red)';
            return `
              <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg-2);border-radius:6px">
                <div style="font-family:'JetBrains Mono';font-size:10px;color:var(--ink-3);text-transform:uppercase;min-width:60px">${wk}</div>
                <div style="flex:1;height:5px;background:var(--bg-1);border-radius:3px;overflow:hidden">
                  <div style="height:100%;width:${wPct}%;background:${c}"></div>
                </div>
                <div style="font-family:'Anton';font-size:13px;color:${c};min-width:50px;text-align:right">${wDone}/${o.exercises.length}</div>
              </div>
            `;
          }).join('')}
        </div>
      ` : ''}
    </div>
  `;
}

// Toggle exo programme intégré dans la page (pas modal) — render() suffit
function togglePlayerProgrammeExercise(exId) {
  if (state.auth.role !== 'player') return;
  const pid = state.auth.playerId;
  const weekKey = getWeekKey();
  state.offseasonLogs = state.offseasonLogs || {};
  state.offseasonLogs[pid] = state.offseasonLogs[pid] || {};
  state.offseasonLogs[pid][weekKey] = state.offseasonLogs[pid][weekKey] || {};
  const log = state.offseasonLogs[pid][weekKey];
  log[exId] = log[exId] || {};
  log[exId].done = !log[exId].done;
  if (log[exId].done) log[exId].at = Date.now();
  persist();
  // Préserver position de scroll lors du re-render
  const scroll = window.scrollY;
  render();
  window.scrollTo(0, scroll);
}

function playerChallengeRow(c, playerId) {
  const scores = c.scores || {};
  const myScore = scores[playerId] || 0;
  // Mon rang (selon lowerIsBetter)
  const sorted = state.players.map(p => ({ id: p.id, score: scores[p.id] || 0 }));
  if (c.lowerIsBetter) {
    sorted.sort((a,b) => a.score - b.score);
  } else {
    sorted.sort((a,b) => b.score - a.score);
  }
  const myRank = sorted.findIndex(s => s.id === playerId) + 1;
  const total = state.players.length;
  const max = Math.max(...sorted.map(s => s.score), 1);
  const isAuto = c.autoCount;
  const pctOfMax = max > 0 ? (myScore / max) * 100 : 0;
  const medal = myRank === 1 ? '🥇' : myRank === 2 ? '🥈' : myRank === 3 ? '🥉' : '';

  return `
    <div class="player-challenge-row" onclick="${isAuto ? `openAllChallenges()` : `updateChallengeScore('${c.id}','${playerId}')`}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px">
        <div style="flex:1;min-width:0">
          <div style="font-family:'Anton';font-size:14px;text-transform:uppercase;letter-spacing:0.02em;line-height:1.2">${medal} ${esc(c.title)}</div>
          <div style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;margin-top:2px">${myRank}<sup>${myRank===1?'er':'ème'}</sup>/${total} · ${esc(c.metric)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
          <div style="text-align:right">
            <div style="font-family:'Anton';font-size:22px;color:var(--orange);line-height:1">${myScore}</div>
          </div>
          ${!isAuto ? `<button class="lb-quick-btn" onclick="event.stopPropagation();quickIncrementChallenge('${c.id}','${playerId}',1)">+1</button>` : `<span style="font-size:9px;color:var(--ink-4);font-family:'JetBrains Mono'">AUTO</span>`}
        </div>
      </div>
      <div class="lb-progress"><div class="lb-progress-fill" style="width:${pctOfMax}%"></div></div>
    </div>
  `;
}

function openAllChallenges() {
  openModal(`
    <div class="modal-header">
      <div class="modal-title">Tous les défis</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" style="padding:0">
      ${renderChallenges()}
    </div>
  `);
}

function playerEventRow(ev, playerId) {
  const responses = ev.responses || {};
  const r = responses[playerId];
  const isPresent = !r || r.status === 'present';
  const d = new Date(ev.date + 'T00:00:00');
  const day = d.getDate();
  const month = d.toLocaleDateString('fr-FR', { month: 'short' });
  const parentId = ev._parentId || ev.id;
  const instanceDate = ev._instanceDate || ev.date;
  return `
    <div class="list-row" onclick="openEventInstance('${parentId}','${instanceDate}')">
      <div class="event-date-badge" style="background:${isPresent ? 'var(--green-soft)' : 'var(--red-soft)'};border-color:${isPresent ? 'rgba(34,197,94,0.3)' : 'rgba(239,68,68,0.3)'}">
        <div class="event-date-day" style="color:${isPresent ? 'var(--green)' : 'var(--red)'}">${day}</div>
        <div class="event-date-month">${month}</div>
      </div>
      <div class="list-row-content">
        <div class="list-row-title">${esc(ev.title)}</div>
        <div class="list-row-subtitle">${ev.time ? ev.time + ' · ' : ''}<span style="color:${isPresent?'var(--green)':'var(--red)'}">${isPresent ? '✓ Présente' : '✕ Absente'}</span></div>
      </div>
      <span class="list-row-trail">›</span>
    </div>
  `;
}

function playerToggleAbsence(cid) {
  const p = currentPlayer();
  if (!p) return;
  const c = state.convocations.find(x => x.id === cid);
  if (!c) return;
  const r = (c.responses || {})[p.id];
  const isPresent = !r || r.status === 'present';

  if (!isPresent) {
    // Currently absent → reset to present
    delete c.responses[p.id];
    persist(); render(); return;
  }

  // Declare absence
  openModal(`
    <div class="modal-header">
      <div class="modal-title">Signaler absence</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div style="font-size:12px;color:var(--ink-3);margin-bottom:14px;font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.05em">${esc(c.title)} · ${formatDate(c.date, 'long')}</div>
      <div class="fld">
        <label class="fld-label">Raison</label>
        <select id="ab-reason">${ABSENCE_REASONS.map(r => `<option value="${r}">${r}</option>`).join('')}</select>
      </div>
      <div class="fld">
        <label class="fld-label">Mot pour l'équipe (optionnel)</label>
        <textarea id="ab-msg" placeholder="Ex : Désolée, je serai de retour la semaine prochaine"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="confirmPlayerAbsence('${cid}')">Confirmer absence</button>
    </div>
  `);
}
function confirmPlayerAbsence(cid) {
  const p = currentPlayer(); if (!p) return;
  const c = state.convocations.find(x => x.id === cid); if (!c) return;
  c.responses = c.responses || {};
  c.responses[p.id] = {
    status: 'absent',
    reason: document.getElementById('ab-reason').value,
    message: document.getElementById('ab-msg').value.trim(),
  };
  persist(); closeModal(); render();
}

// ============================================================
// PLAYS
// ============================================================
function renderPlays() {
  if (state.view && state.view.type === 'play') return renderPlayDetail();

  // Fallback : si state.playsCat est invalide (legacy 'all' ou cat supprimée), revenir à 'off'
  if (!PLAY_CATEGORIES.some(c => c.id === state.playsCat)) state.playsCat = 'off';

  let items = state.plays.filter(p => p.cat === state.playsCat);
  if (state.playsTag) items = items.filter(p => (p.tags || []).includes(state.playsTag));

  // Tags pertinents seulement pour la catégorie courante
  const usedTags = [...new Set(state.plays.filter(p => p.cat === state.playsCat).flatMap(p => p.tags || []))].sort();
  const isCoach = state.auth.role === 'coach';

  return `
    <div class="fade-up">
      <div class="section-header">
        <div>
          <div class="eyebrow-muted">${items.length} ${items.length > 1 ? 'plays' : 'play'}</div>
          <h2 class="display-lg mt-2">Playbook</h2>
        </div>
        ${isCoach ? `<button class="btn btn-primary" onclick="editPlay()">+ NOUVEAU</button>` : ''}
      </div>

      <div class="segmented">
        ${PLAY_CATEGORIES.map(c => `
          <button class="segmented-btn ${state.playsCat === c.id ? 'active' : ''}" onclick="setPlaysCat('${c.id}')">${c.label}</button>
        `).join('')}
      </div>

      ${usedTags.length > 0 ? `
        <div style="padding:0 18px 14px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none">
          <button class="chip ${!state.playsTag ? 'chip-orange' : ''}" onclick="setPlaysTag(null)" style="cursor:pointer">Tous tags</button>
          ${usedTags.map(t => `
            <button class="chip ${state.playsTag === t ? 'chip-orange' : ''}" onclick="setPlaysTag('${esc(t).replace(/'/g, "\\'")}')" style="cursor:pointer;flex-shrink:0">${esc(t)}</button>
          `).join('')}
        </div>
      ` : ''}

      ${items.length === 0 ? `
        <div class="empty">
          <div class="empty-icon">○</div>
          <div class="empty-title">Aucun play</div>
          <div class="empty-desc">${isCoach ? 'Crée ton premier play' : 'Aucun play dans cette catégorie'}</div>
        </div>
      ` : `
        <div class="plays-grid">
          ${items.map(p => playTile(p)).join('')}
        </div>
      `}
    </div>
  `;
}

function setPlaysCat(c) { state.playsCat = c; state.playsTag = null; render(); }
function setPlaysTag(t) { state.playsTag = t; render(); }

function openPlay(id) {
  state.view = { type: 'play', id };
  render(); window.scrollTo(0, 0);
}

function renderPlayDetail() {
  const p = state.plays.find(x => x.id === state.view.id);
  if (!p) { state.view = null; return renderPlays(); }
  const isCoach = state.auth.role === 'coach';
  const images = p.images || [];
  const concepts = p.concepts || [];
  const hasGallery = images.length > 0;
  const hasVideo = !!p.videoUrl;
  const hasDesc = !!(p.desc || '').trim();

  return `
    <div class="fade-up">
      <button class="detail-back" onclick="state.view=null;render()">← Retour</button>
      <div style="padding:0 18px 8px;display:flex;gap:6px;flex-wrap:wrap">
        <span class="chip chip-${PLAY_CATEGORIES.find(c=>c.id===p.cat).color}">${getCatLabel(p.cat)}</span>
        ${hasGallery ? `<span class="chip" style="background:rgba(255,107,0,0.15);border-color:var(--orange);color:var(--orange)">📷 ${images.length}</span>` : ''}
        ${(p.tags || []).map(t => `<span class="chip">${esc(t)}</span>`).join('')}
      </div>
      <div class="detail-title">${esc(p.title)}</div>

      ${hasGallery ? `
        <!-- Galerie images : carrousel scrollable -->
        <div class="play-gallery" id="play-gal-${p.id}">
          ${images.map((img, idx) => `
            <div class="play-gallery-slide">
              <img src="${img}" alt="Schéma ${idx+1}" onclick="openPlayImageFull('${p.id}',${idx})">
            </div>
          `).join('')}
        </div>
        ${images.length > 1 ? `
          <div style="display:flex;justify-content:center;gap:5px;margin:6px 0 14px">
            ${images.map((_, idx) => `<div class="play-dot" data-idx="${idx}"></div>`).join('')}
          </div>
        ` : '<div style="margin-bottom:14px"></div>'}
      ` : ''}

      ${hasDesc ? `
        <div class="list-section">
          <div style="padding:16px">
            <div class="eyebrow-muted mb-2">Description</div>
            <div style="line-height:1.6;color:var(--ink-2);white-space:pre-wrap">${esc(p.desc)}</div>
          </div>
        </div>
      ` : ''}

      ${concepts.length > 0 ? `
        <div class="list-section">
          <div style="padding:14px 16px">
            <div class="eyebrow-muted mb-2">🧠 Concepts couverts</div>
            <div style="display:flex;flex-wrap:wrap;gap:4px">
              ${concepts.map(c => {
                const cat = getConceptCategory(c);
                return `<span class="concept-chip selected" style="--color:${CONCEPT_CAT_COLORS[cat]}">${esc(c)}</span>`;
              }).join('')}
            </div>
          </div>
        </div>
      ` : ''}

      ${hasVideo ? `
        <div class="list-section">
          <div style="padding:14px 16px 0">
            <div class="eyebrow-muted mb-2">🎬 ${hasGallery ? 'Vidéo associée' : 'Vidéo'}</div>
          </div>
          ${videoPlayer(p.videoUrl, false)}
        </div>
      ` : ''}

      ${!hasGallery && !hasVideo && !hasDesc ? `
        <div class="empty">
          <div class="empty-icon">○</div>
          <div class="empty-title">Play vide</div>
          ${isCoach ? `<div class="empty-desc">Ajoute description, photos ou vidéo via Modifier</div>` : ''}
        </div>
      ` : ''}

      ${isCoach ? `
        <div style="padding:14px 18px 24px;display:flex;gap:8px">
          <button class="btn btn-secondary btn-block" onclick="editPlay('${p.id}')">✎ Modifier</button>
          <button class="btn btn-danger" onclick="deletePlay('${p.id}')">🗑</button>
        </div>
      ` : ''}
    </div>
  `;
}

// Galerie plein écran pour les images d'un play
function openPlayImageFull(playId, startIdx) {
  const p = state.plays.find(x => x.id === playId);
  if (!p || !p.images || !p.images.length) return;
  const images = p.images;
  window._playFullIdx = startIdx;
  const showSlide = () => {
    const img = document.getElementById('play-full-img');
    const counter = document.getElementById('play-full-counter');
    if (img) img.src = images[window._playFullIdx];
    if (counter) counter.textContent = (window._playFullIdx + 1) + ' / ' + images.length;
  };
  openModal(`
    <div style="position:relative;background:#000;min-height:80vh;display:flex;flex-direction:column">
      <button class="modal-close" onclick="closeModal()" style="position:absolute;top:12px;right:12px;z-index:10;background:rgba(0,0,0,0.7);color:white">✕</button>
      <div id="play-full-counter" style="position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(0,0,0,0.7);color:white;padding:4px 10px;border-radius:12px;font-family:'JetBrains Mono';font-size:11px"></div>
      <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:40px 12px">
        <img id="play-full-img" src="" style="max-width:100%;max-height:75vh;object-fit:contain">
      </div>
      ${images.length > 1 ? `
        <div style="display:flex;justify-content:space-between;padding:12px 18px;background:rgba(0,0,0,0.5)">
          <button class="btn btn-secondary" onclick="navPlayFull('${playId}',-1)">← Précédent</button>
          <button class="btn btn-secondary" onclick="navPlayFull('${playId}',1)">Suivant →</button>
        </div>
      ` : ''}
    </div>
  `);
  setTimeout(showSlide, 50);
}

function navPlayFull(playId, delta) {
  const p = state.plays.find(x => x.id === playId);
  if (!p || !p.images) return;
  window._playFullIdx = ((window._playFullIdx || 0) + delta + p.images.length) % p.images.length;
  document.getElementById('play-full-img').src = p.images[window._playFullIdx];
  document.getElementById('play-full-counter').textContent = (window._playFullIdx + 1) + ' / ' + p.images.length;
}

function editPlay(id) {
  const isNew = !id;
  const p = isNew
    ? { id: uid(), cat: 'off', title: '', desc: '', tags: [], videoUrl: '', images: [], concepts: [], attachments: [] }
    : state.plays.find(x => x.id === id);
  state._editingPlay = {
    ...p,
    images: [...(p.images || [])],
    concepts: [...(p.concepts || [])],
    attachments: [...(p.attachments || [])]
  };
  renderPlayEditor(isNew);
}

function renderPlayEditor(isNew) {

                <button class="btn btn-icon" style="position:absolute;top:2px;right:2px;width:22px;height:22px;background:rgba(239,68,68,0.9);color:white" onclick="removePlayImage(${idx})">✕</button>
                ${idx > 0 ? `<button class="btn btn-icon" style="position:absolute;bottom:2px;left:2px;width:22px;height:22px;background:rgba(0,0,0,0.7);color:white" onclick="movePlayImage(${idx},-1)">◀</button>` : ''}
                ${idx < p.images.length - 1 ? `<button class="btn btn-icon" style="position:absolute;bottom:2px;right:2px;width:22px;height:22px;background:rgba(0,0,0,0.7);color:white" onclick="movePlayImage(${idx},1)">▶</button>` : ''}
              </div>

        <label class="btn btn-secondary btn-block" style="cursor:pointer">

      </div>

      <!-- CONCEPTS -->
      <div class="fld" style="padding-top:14px;border-top:1px solid var(--border-soft);margin-top:14px">
        <label class="fld-label">🧠 Concepts couverts (${p.concepts.length})</label>
        <div style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';margin-bottom:10px;line-height:1.5">Principes tactiques travaillés. Aide à trouver les exos correspondants.</div>
        ${p.concepts.length > 0 ? `
          <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px">
            ${p.concepts.map(c => {
              const cat = getConceptCategory(c);
              const color = CONCEPT_CAT_COLORS[cat];
              return `<button class="concept-chip selected" style="--color:${color}" onclick="togglePlayConcept('${esc(c).replace(/'/g, "\\'")}')">${esc(c)} ✕</button>`;

// === Gestion images play ===
async function addPlayImages(event) {
  const files = Array.from(event.target.files || []);
  if (!files.length) return;
  for (const file of files) {
    try {
      const compressed = await compressImage(file, 1000, 0.8);
      state._editingPlay.images.push(compressed);
    } catch (e) { console.error(e); }
  }
  const isNew = state.plays.findIndex(x => x.id === state._editingPlay.id) === -1;
  renderPlayEditor(isNew);
}

function removePlayImage(idx) {
  state._editingPlay.images.splice(idx, 1);
  const isNew = state.plays.findIndex(x => x.id === state._editingPlay.id) === -1;
  renderPlayEditor(isNew);
}

function movePlayImage(idx, delta) {
  const arr = state._editingPlay.images;
  const newIdx = idx + delta;
  if (newIdx < 0 || newIdx >= arr.length) return;
  const tmp = arr[idx]; arr[idx] = arr[newIdx]; arr[newIdx] = tmp;
  const isNew = state.plays.findIndex(x => x.id === state._editingPlay.id) === -1;
  renderPlayEditor(isNew);
}

// === Gestion concepts play ===
function togglePlayConcept(label) {
  const p = state._editingPlay;
  if (p.concepts.includes(label)) {
    p.concepts = p.concepts.filter(c => c !== label);
  } else {
    p.concepts.push(label);
  }
  const isNew = state.plays.findIndex(x => x.id === p.id) === -1;
  renderPlayEditor(isNew);
}

function openConceptPicker() {
  const p = state._editingPlay;
  const all = getAllConcepts();
  const byCategory = {};
  all.forEach(c => {
    byCategory[c.category] = byCategory[c.category] || [];
    byCategory[c.category].push(c);
  });

  openModal(`
    <div class="modal-header">
      <div class="modal-title">🧠 Concepts</div>
      <button class="modal-close" onclick="closeModal();setTimeout(()=>renderPlayEditor(${state.plays.findIndex(x => x.id === p.id) === -1}),50)">✕</button>
    </div>
    <div class="modal-body">
      <div style="padding:10px 12px;background:var(--bg-3);border-left:3px solid var(--orange);border-radius:6px;margin-bottom:14px;font-size:11px;color:var(--ink-2);line-height:1.5">
        Tap pour ajouter/retirer. Tu peux aussi créer un concept custom en bas.
      </div>
      ${Object.entries(byCategory).map(([cat, concepts]) => `
        <div style="margin-bottom:14px">
          <div class="eyebrow-muted" style="margin-bottom:6px;color:${CONCEPT_CAT_COLORS[cat]}">${CONCEPT_CAT_LABELS[cat]}</div>
          <div style="display:flex;flex-wrap:wrap;gap:4px">
            ${concepts.map(c => {
              const selected = p.concepts.includes(c.label);
              return `<button class="concept-chip ${selected?'selected':''}" style="--color:${CONCEPT_CAT_COLORS[cat]}" onclick="togglePlayConceptInPicker('${esc(c.label).replace(/'/g, "\\'")}')">${selected?'✓ ':'+'} ${esc(c.label)}</button>`;
            }).join('')}
          </div>
        </div>
      `).join('')}

      <div style="padding-top:14px;border-top:1px solid var(--border-soft);margin-top:14px">
        <div class="eyebrow-muted" style="margin-bottom:8px">+ Créer un concept custom</div>
        <div style="display:flex;gap:6px">
          <input id="new-concept" placeholder="Ex : Inversion rapide" style="flex:1;background:var(--bg-1);border:1px solid var(--border);border-radius:6px;color:var(--ink);padding:8px 10px;font-size:13px;outline:none">
          <button class="btn btn-primary" onclick="addCustomConcept()">Ajouter</button>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary btn-block" onclick="closeModal();setTimeout(()=>renderPlayEditor(${state.plays.findIndex(x => x.id === p.id) === -1}),50)">Terminé (${p.concepts.length})</button>
    </div>
  `);
}

function togglePlayConceptInPicker(label) {
  const p = state._editingPlay;
  if (p.concepts.includes(label)) {
    p.concepts = p.concepts.filter(c => c !== label);
  } else {
    p.concepts.push(label);
  }
  openConceptPicker(); // re-render picker
}

function addCustomConcept() {
  const input = document.getElementById('new-concept');
  const val = (input?.value || '').trim();
  if (!val) return;
  state.customConcepts = state.customConcepts || [];
  if (!state.customConcepts.includes(val) && !Object.values(DEFAULT_CONCEPTS).some(list => list.includes(val))) {
    state.customConcepts.push(val);
  }
  // Et l'ajouter au play en cours
  if (!state._editingPlay.concepts.includes(val)) {
    state._editingPlay.concepts.push(val);
  }
  persist();
  openConceptPicker();
}
function savePlay(id, isNew) {
  const title = document.getElementById('p-title').value.trim();
  if (!title) return alert('Titre requis');
  const e = state._editingPlay;
  const obj = {
    id, title,
    cat: document.getElementById('p-cat').value,
    videoUrl: document.getElementById('p-video').value.trim(),
    desc: document.getElementById('p-desc').value.trim(),
    tags: document.getElementById('p-tags').value.split(',').map(t => t.trim().toLowerCase()).filter(Boolean),
    images: e.images || [],
    concepts: e.concepts || [],
    attachments: e.attachments || [],
  };
  if (isNew) state.plays.unshift(obj);
  else { const i = state.plays.findIndex(x => x.id === id); state.plays[i] = obj; }
  state._editingPlay = null;
  persist(); closeModal(); render();
}
function deletePlay(id) {
  if (!confirm('Supprimer ce play ?')) return;
  state.plays = state.plays.filter(x => x.id !== id);
  state.view = null;
  persist(); render();
}

// ============================================================
// MATCHES
// ============================================================
function renderMatches() {
  if (state.view && state.view.type === 'match') return renderMatchDetail();

  const matches = [...state.matches].sort((a,b) => b.date.localeCompare(a.date));
  // Seuls les matchs joués (avec un score) entrent dans le bilan
  const playedMatches = matches.filter(m => (m.scoreUs || 0) > 0 || (m.scoreOpp || 0) > 0);
  const wins = playedMatches.filter(m => m.scoreUs > m.scoreOpp).length;
  const losses = playedMatches.filter(m => m.scoreUs < m.scoreOpp).length;
  const avgFor = playedMatches.length ? (playedMatches.reduce((a,m) => a + m.scoreUs, 0) / playedMatches.length).toFixed(1) : '0';
  const avgAgainst = playedMatches.length ? (playedMatches.reduce((a,m) => a + m.scoreOpp, 0) / playedMatches.length).toFixed(1) : '0';
  const isCoach = state.auth.role === 'coach';
  const isStat = state.auth.role === 'stat';

  return `
    <div class="fade-up">
      <div class="section-header">
        <div>
          <div class="eyebrow-muted">${matches.length} match${matches.length > 1 ? 's' : ''}</div>
          <h2 class="display-lg mt-2">Saison</h2>
        </div>
        <div style="display:flex;gap:6px">
          ${matches.length > 0 ? `<button class="btn btn-secondary" onclick="openDashboard()" style="font-size:11px">📊 Dashboard</button>` : ''}
          ${(isCoach || isStat) ? `<button class="btn btn-primary" onclick="editMatch()">+ MATCH</button>` : ''}
        </div>
      </div>

      <div class="stat-grid mb-3">
        <div class="stat-tile">
          <div class="stat-tile-label">Bilan</div>
          <div class="stat-tile-value">${wins}<span style="color:var(--ink-4)"> · ${losses}</span></div>
        </div>
        <div class="stat-tile">
          <div class="stat-tile-label">PPG</div>
          <div class="stat-tile-value">${avgFor}<span style="font-size:20px;color:var(--ink-4)"> / ${avgAgainst}</span></div>
        </div>
      </div>

      <div class="section-header">
        <h2 class="display-md">Historique</h2>
      </div>

      ${matches.length === 0 ? `
        <div class="empty">
          <div class="empty-icon">○</div>
          <div class="empty-title">Aucun match</div>
        </div>
      ` : `
        <div class="list-section">${matches.map(m => matchRow(m)).join('')}</div>
      `}
    </div>
  `;
}

function matchRow(m) {
  const played = (m.scoreUs || 0) > 0 || (m.scoreOpp || 0) > 0;
  const win = played && m.scoreUs > m.scoreOpp;
  const todayStr = new Date().toISOString().slice(0,10);
  const upcoming = !played && m.date >= todayStr;
  const badgeClass = played ? (win ? 'match-result-w' : 'match-result-l') : '';
  const badgeStyle = !played ? 'background:var(--bg-3);color:var(--ink-3);border:1px solid var(--border)' : '';
  const badgeLabel = played ? (win ? 'V' : 'D') : (upcoming ? '→' : '○');
  return `
    <div class="match-row" onclick="openMatch('${m.id}')">
      <div class="match-result-badge ${badgeClass}" style="${badgeStyle}">${badgeLabel}</div>
      <div style="flex:1;min-width:0">
        <div style="font-family:'Anton';font-size:16px;text-transform:uppercase;letter-spacing:0.02em">${esc(m.opponent)}</div>
        <div style="font-size:11px;color:var(--ink-3);margin-top:2px;font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.05em">
          ${formatDate(m.date)} · ${m.home ? 'Domicile' : 'Extérieur'}${m.videoUrl ? ' · ▶' : ''}
        </div>
      </div>
      ${played ? `<div class="match-score">${m.scoreUs}–${m.scoreOpp}</div>` : `<div style="font-family:'JetBrains Mono';font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.06em">${upcoming ? 'À venir' : '—'}</div>`}
    </div>
  `;
}

function openMatch(id) {
  state.view = { type: 'match', id };
  render(); window.scrollTo(0, 0);
}

function openDashboard() {
  state.dashTab = state.dashTab || 'team';
  renderDashboard();
}

function renderDashboard() {
  const matches = [...state.matches].sort((a,b) => a.date.localeCompare(b.date));
  const played = matches.filter(m => (m.scoreUs || 0) > 0 || (m.scoreOpp || 0) > 0);
  const tab = state.dashTab || 'team';

  openModal(`
    <div class="modal-header">
      <div class="modal-title">📊 Dashboard saison</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" style="padding:0">
      <div class="segmented" style="margin:14px 14px 8px">
        <button class="segmented-btn ${tab === 'team' ? 'active' : ''}" onclick="state.dashTab='team';renderDashboard()">Équipe</button>
        <button class="segmented-btn ${tab === 'players' ? 'active' : ''}" onclick="state.dashTab='players';renderDashboard()">Joueuses</button>
        <button class="segmented-btn ${tab === 'records' ? 'active' : ''}" onclick="state.dashTab='records';renderDashboard()">Records</button>
      </div>
      <div style="padding:0 14px 18px">
        ${tab === 'team' ? renderDashTeam(played) : ''}
        ${tab === 'players' ? renderDashPlayers(played) : ''}
        ${tab === 'records' ? renderDashRecords(played) : ''}
      </div>
    </div>
  `);
}

function renderDashTeam(matches) {
  if (matches.length === 0) {
    return `<div class="empty" style="padding:30px"><div class="empty-icon">○</div><div class="empty-title">Aucun match joué</div></div>`;
  }
  const wins = matches.filter(m => m.scoreUs > m.scoreOpp);
  const losses = matches.filter(m => m.scoreUs < m.scoreOpp);
  const winRate = Math.round(100 * wins.length / matches.length);
  const avgFor = matches.reduce((a,m) => a + (m.scoreUs||0), 0) / matches.length;
  const avgAgainst = matches.reduce((a,m) => a + (m.scoreOpp||0), 0) / matches.length;
  const diff = avgFor - avgAgainst;

  // Last 5
  const last5 = matches.slice(-5);
  const last5W = last5.filter(m => m.scoreUs > m.scoreOpp).length;

  // Domicile vs Extérieur
  const home = matches.filter(m => m.home);
  const away = matches.filter(m => !m.home);
  const homeW = home.filter(m => m.scoreUs > m.scoreOpp).length;
  const awayW = away.filter(m => m.scoreUs > m.scoreOpp).length;

  return `
    <div class="stat-grid mb-3">
      <div class="stat-tile">
        <div class="stat-tile-label">Bilan</div>
        <div class="stat-tile-value">${wins.length}<span style="color:var(--ink-4)">−${losses.length}</span></div>
        <div class="stat-tile-sub">${winRate}% de victoires</div>
      </div>
      <div class="stat-tile">
        <div class="stat-tile-label">Différentiel</div>
        <div class="stat-tile-value" style="color:${diff>=0?'var(--green)':'var(--red)'}">${diff>=0?'+':''}${diff.toFixed(1)}</div>
        <div class="stat-tile-sub">par match</div>
      </div>
    </div>

    <div class="stat-grid mb-3">
      <div class="stat-tile">
        <div class="stat-tile-label">PTS marqués</div>
        <div class="stat-tile-value">${avgFor.toFixed(1)}</div>
        <div class="stat-tile-sub">moyenne / match</div>
      </div>
      <div class="stat-tile">
        <div class="stat-tile-label">PTS encaissés</div>
        <div class="stat-tile-value">${avgAgainst.toFixed(1)}</div>
        <div class="stat-tile-sub">moyenne / match</div>
      </div>
    </div>

    <div class="eyebrow-muted mb-2" style="margin-top:14px">Forme récente · 5 derniers</div>
    <div style="display:flex;gap:4px;margin-bottom:14px">
      ${last5.map(m => {
        const w = m.scoreUs > m.scoreOpp;
        return `<div title="${esc(m.opponent)} ${m.scoreUs}-${m.scoreOpp}" style="flex:1;padding:8px 4px;text-align:center;background:${w?'rgba(34,197,94,0.15)':'rgba(239,68,68,0.15)'};border:1px solid ${w?'var(--green)':'var(--red)'};border-radius:6px;font-family:'Anton';font-size:16px;color:${w?'var(--green)':'var(--red)'}">${w?'V':'D'}</div>`;
      }).join('')}
      ${last5.length < 5 ? Array.from({length: 5-last5.length}, () => '<div style="flex:1"></div>').join('') : ''}
    </div>
    <div style="text-align:center;font-family:'JetBrains Mono';font-size:11px;color:var(--ink-3);margin-bottom:14px">${last5W} V · ${last5.length-last5W} D sur les 5 derniers</div>

    <div class="stat-grid mb-3">
      <div class="stat-tile">
        <div class="stat-tile-label">À domicile</div>
        <div class="stat-tile-value">${homeW}<span style="color:var(--ink-4)">−${home.length-homeW}</span></div>
        <div class="stat-tile-sub">${home.length} matchs</div>
      </div>
      <div class="stat-tile">
        <div class="stat-tile-label">À l'extérieur</div>
        <div class="stat-tile-value">${awayW}<span style="color:var(--ink-4)">−${away.length-awayW}</span></div>
        <div class="stat-tile-sub">${away.length} matchs</div>
      </div>
    </div>

    <div class="eyebrow-muted mb-2" style="margin-top:14px">Évolution scores</div>
    ${renderScoreSparkline(matches)}
  `;
}

function renderScoreSparkline(matches) {
  if (matches.length < 2) return '<div style="font-size:11px;color:var(--ink-3);text-align:center;padding:14px">Plus de matchs nécessaires</div>';
  const w = 320, h = 80;
  const padding = 6;
  const allScores = matches.flatMap(m => [m.scoreUs||0, m.scoreOpp||0]);
  const maxS = Math.max(...allScores, 60);
  const minS = 0;
  const xStep = (w - 2*padding) / Math.max(1, matches.length - 1);
  const ptToCoord = (s, i) => {
    const x = padding + i * xStep;
    const y = h - padding - ((s - minS) / (maxS - minS)) * (h - 2*padding);
    return [x, y];
  };
  const usPath = matches.map((m, i) => {
    const [x, y] = ptToCoord(m.scoreUs || 0, i);
    return (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
  const oppPath = matches.map((m, i) => {
    const [x, y] = ptToCoord(m.scoreOpp || 0, i);
    return (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');

  return `
    <div style="background:var(--bg-2);border:1px solid var(--border);border-radius:8px;padding:10px 6px">
      <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
        <path d="${oppPath}" stroke="var(--red)" stroke-width="1.5" fill="none" opacity="0.7"></path>
        <path d="${usPath}" stroke="var(--orange)" stroke-width="2" fill="none"></path>
        ${matches.map((m, i) => {
          const [xu, yu] = ptToCoord(m.scoreUs || 0, i);
          const [xo, yo] = ptToCoord(m.scoreOpp || 0, i);
          return `<circle cx="${xu.toFixed(1)}" cy="${yu.toFixed(1)}" r="2.5" fill="var(--orange)"></circle><circle cx="${xo.toFixed(1)}" cy="${yo.toFixed(1)}" r="2" fill="var(--red)"></circle>`;
        }).join('')}
      </svg>
      <div style="display:flex;gap:14px;justify-content:center;margin-top:6px;font-size:10px;font-family:'JetBrains Mono'">
        <span style="color:var(--orange)">━ Nous</span>
        <span style="color:var(--red)">━ Adversaire</span>
      </div>
    </div>
  `;
}

function renderDashPlayers(matches) {
  if (matches.length === 0) {
    return `<div class="empty" style="padding:30px"><div class="empty-icon">○</div><div class="empty-title">Aucun match joué</div></div>`;
  }
  // Calculer stats agrégées par joueuse
  const agg = {};
  state.players.forEach(p => {
    agg[p.id] = { player: p, games: 0, pts: 0, reb: 0, ast: 0, stl: 0, fouls: 0, gs: 0, p2i:0, p2iA:0, p2e:0, p2eA:0, p3:0, p3A:0, ft:0, ftA:0, ca:0, def:0, to:0 };
  });
  matches.forEach(m => {
    Object.entries(m.playerStats || {}).forEach(([pid, s]) => {
      if (!agg[pid]) return;
      agg[pid].games++;
      ['pts','reb','ast','stl','fouls','p2i','p2iA','p2e','p2eA','p3','p3A','ft','ftA','ca','def','to'].forEach(k => {
        agg[pid][k] += (s[k] || 0);
      });
      agg[pid].gs += gameScore(s);
    });
  });
  // Tendance : 3 derniers matchs vs reste
  state.players.forEach(p => {
    const recent = matches.slice(-3);
    const older = matches.slice(0, -3);
    let recentGS = 0, olderGS = 0, rN = 0, oN = 0;
    recent.forEach(m => { const s = (m.playerStats || {})[p.id]; if (s) { recentGS += gameScore(s); rN++; } });
    older.forEach(m => { const s = (m.playerStats || {})[p.id]; if (s) { olderGS += gameScore(s); oN++; } });
    if (rN > 0 && oN > 0) {
      agg[p.id].trend = (recentGS/rN) - (olderGS/oN);
    } else {
      agg[p.id].trend = 0;
    }
  });
  // Tri par GS moyen décroissant
  const rows = Object.values(agg).filter(r => r.games > 0).sort((a,b) => (b.gs/b.games) - (a.gs/a.games));

  if (rows.length === 0) return `<div class="empty" style="padding:30px"><div class="empty-title">Aucune stat joueuse</div></div>`;

  return `
    <div class="eyebrow-muted mb-2">Tri par +/− moyen (Game Score)</div>
    <div style="display:flex;flex-direction:column;gap:6px">
      ${rows.map((r, idx) => {
        const avgGS = r.gs / r.games;
        const avgPts = r.pts / r.games;
        const trend = r.trend || 0;
        const trendIcon = Math.abs(trend) < 0.5 ? '→' : (trend > 0 ? '↗' : '↘');
        const trendColor = Math.abs(trend) < 0.5 ? 'var(--ink-3)' : (trend > 0 ? 'var(--green)' : 'var(--red)');
        const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '';
        return `
          <div style="display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg-2);border-radius:8px;border:1px solid var(--border-soft)">
            <div style="font-family:'Anton';font-size:14px;color:var(--orange);min-width:24px">#${r.player.num}</div>
            <div style="flex:1;min-width:0">
              <div style="font-family:'Anton';font-size:13px;text-transform:uppercase">${medal}${esc(r.player.name)}</div>
              <div style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:2px">${r.games} matchs · ${avgPts.toFixed(1)} pts</div>
            </div>
            <div style="text-align:right">
              <div style="display:flex;align-items:baseline;gap:6px">
                <span style="font-family:'Anton';font-size:18px;color:${avgGS>=15?'var(--green)':avgGS<5?'var(--red)':'var(--orange)'}">${avgGS>=0?'+':''}${avgGS.toFixed(1)}</span>
                <span style="font-size:14px;color:${trendColor}">${trendIcon}</span>
              </div>
              <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono'">+/− moyen</div>
            </div>
          </div>
        `;
      }).join('')}
    </div>
    <div style="margin-top:14px;padding:10px;background:var(--bg-1);border-radius:6px;font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';line-height:1.5">
      <strong>↗</strong> = progression (3 derniers vs reste) · <strong>↘</strong> = baisse · <strong>→</strong> = stable
    </div>
  `;
}

function renderDashRecords(matches) {
  if (matches.length === 0) return `<div class="empty" style="padding:30px"><div class="empty-icon">○</div><div class="empty-title">Aucun record</div></div>`;
  // Plus large victoire
  let widest = null, widestDiff = -Infinity;
  matches.forEach(m => {
    const d = (m.scoreUs||0) - (m.scoreOpp||0);
    if (d > widestDiff) { widestDiff = d; widest = m; }
  });
  // Plus serré
  let tightest = null, tightestDiff = Infinity;
  matches.filter(m => m.scoreUs > m.scoreOpp).forEach(m => {
    const d = m.scoreUs - m.scoreOpp;
    if (d < tightestDiff) { tightestDiff = d; tightest = m; }
  });
  // Records individuels
  const allStats = [];
  matches.forEach(m => {
    Object.entries(m.playerStats || {}).forEach(([pid, s]) => {
      const p = state.players.find(x => x.id === pid);
      if (p) allStats.push({ match: m, player: p, stats: s, gs: gameScore(s) });
    });
  });
  const topPts = allStats.slice().sort((a,b) => (b.stats.pts||0) - (a.stats.pts||0))[0];
  const topReb = allStats.slice().sort((a,b) => (b.stats.reb||0) - (a.stats.reb||0))[0];
  const topAst = allStats.slice().sort((a,b) => (b.stats.ast||0) - (a.stats.ast||0))[0];
  const topGS = allStats.slice().sort((a,b) => b.gs - a.gs)[0];

  const recordCard = (label, value, sub) => `
    <div style="padding:12px;background:var(--bg-2);border:1px solid var(--border-soft);border-radius:8px;border-left:3px solid var(--orange)">
      <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px">${label}</div>
      <div style="font-family:'Anton';font-size:14px;text-transform:uppercase;line-height:1.3">${value}</div>
      ${sub ? `<div style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:4px">${sub}</div>` : ''}
    </div>
  `;

  return `
    <div style="display:flex;flex-direction:column;gap:8px">
      ${widest && widestDiff > 0 ? recordCard('🏆 Plus large victoire', '+' + widestDiff + ' pts vs ' + esc(widest.opponent), widest.scoreUs + '−' + widest.scoreOpp + ' · ' + formatDate(widest.date)) : ''}
      ${tightest ? recordCard('💪 Victoire la plus serrée', '+' + tightestDiff + ' pt' + (tightestDiff>1?'s':'') + ' vs ' + esc(tightest.opponent), tightest.scoreUs + '−' + tightest.scoreOpp + ' · ' + formatDate(tightest.date)) : ''}
      ${topPts && topPts.stats.pts > 0 ? recordCard('🎯 Record points', topPts.player.name + ' · ' + topPts.stats.pts + ' pts', 'vs ' + esc(topPts.match.opponent) + ' · ' + formatDate(topPts.match.date)) : ''}
      ${topReb && topReb.stats.reb > 0 ? recordCard('💥 Record rebonds', topReb.player.name + ' · ' + topReb.stats.reb + ' reb', 'vs ' + esc(topReb.match.opponent) + ' · ' + formatDate(topReb.match.date)) : ''}
      ${topAst && topAst.stats.ast > 0 ? recordCard('👁 Record passes décisives', topAst.player.name + ' · ' + topAst.stats.ast + ' PD', 'vs ' + esc(topAst.match.opponent) + ' · ' + formatDate(topAst.match.date)) : ''}
      ${topGS && topGS.gs > 0 ? recordCard('⭐ MVP de la saison (meilleur +/−)', topGS.player.name + ' · ' + topGS.gs.toFixed(1), 'vs ' + esc(topGS.match.opponent) + ' · ' + formatDate(topGS.match.date)) : ''}
    </div>
  `;
}

function renderStatsTable(m, stats, canEdit) {
  const playerIds = Object.keys(stats);
  let totals = {};
  STAT_FIELDS.forEach(f => totals[f.key] = 0);
  totals.p2iA = totals.p2eA = totals.p3A = totals.ftA = 0;

  playerIds.forEach(pid => {
    const s = stats[pid];
    Object.keys(totals).forEach(k => totals[k] += (s[k] || 0));
  });
  const pct = (a, b) => b > 0 ? Math.round(100*a/b) : 0;

  // Calc Game Score total
  const totalGS = playerIds.reduce((acc, pid) => acc + gameScore(stats[pid]), 0);
  // Trouver MVP (meilleur GS)
  let mvpPid = null, mvpGS = -Infinity;
  playerIds.forEach(pid => {
    const gs = gameScore(stats[pid]);
    if (gs > mvpGS) { mvpGS = gs; mvpPid = pid; }
  });

  return `
    <table class="stats-table">
      <thead>
        <tr>
          <th>Joueuse</th>
          <th>MIN</th><th>PTS</th><th>CA</th>
          <th>2P INT</th><th>2P EXT</th><th>3PT</th><th>LF</th>
          <th>REB</th><th>PD</th><th>INT</th><th>DEF</th><th>PB</th><th>FT</th>
          <th style="color:var(--orange)">+/−</th>
        </tr>
      </thead>
      <tbody>
        ${playerIds.map(pid => {
          const player = state.players.find(p => p.id === pid);
          if (!player) return '';
          const s = stats[pid];
          const clickHandler = canEdit ? `onclick="addPlayerStat('${m.id}','${pid}')"` : '';
          const gs = gameScore(s);
          const isMVP = pid === mvpPid && mvpGS > 0;
          const myPid = state.auth && state.auth.role === 'player' ? state.auth.playerId : null;
          const isMe = myPid && pid === myPid;
          const hasReview = state.auth.role === 'coach' && m.playerReviews && m.playerReviews[pid];
          return `<tr ${clickHandler} style="${canEdit ? 'cursor:pointer;' : ''}${isMe ? 'background:rgba(255,107,0,0.10);border-left:3px solid var(--orange)' : ''}">
            <td style="font-family:'Anton';font-size:14px;text-transform:uppercase">${isMVP ? '👑 ' : ''}${isMe ? '⭐ ' : ''}${esc(player.name)}${isMe ? ' · TOI' : ''}${hasReview ? ' <span title="A donné son ressenti" style="font-size:11px;opacity:0.8">📝</span>' : ''}</td>
            <td>${s.min||0}'</td>
            <td class="num">${s.pts||0}</td>
            <td style="color:var(--orange)">${s.ca||0}</td>
            <td>${s.p2i||0}/${s.p2iA||0} <span class="pct">${pct(s.p2i, s.p2iA)}%</span></td>
            <td>${s.p2e||0}/${s.p2eA||0} <span class="pct">${pct(s.p2e, s.p2eA)}%</span></td>
            <td>${s.p3||0}/${s.p3A||0} <span class="pct">${pct(s.p3, s.p3A)}%</span></td>
            <td>${s.ft||0}/${s.ftA||0} <span class="pct">${pct(s.ft, s.ftA)}%</span></td>
            <td>${s.reb||0}</td>
            <td>${s.ast||0}</td>
            <td>${s.stl||0}</td>
            <td>${s.def||0}</td>
            <td>${s.to||0}</td>
            <td style="color:${(s.fouls||0)>=4?'var(--red)':'var(--ink)'}">${s.fouls||0}</td>
            <td class="num" style="color:${gs>=15?'var(--green)':gs<5?'var(--red)':'var(--orange)'}">${gs>0?'+':''}${gs.toFixed(1)}</td>
          </tr>`;
        }).join('')}
        <tr class="stats-total-row">
          <td>TOTAL</td>
          <td>${totals.min}'</td>
          <td class="num">${totals.pts}</td>
          <td>${totals.ca||0}</td>
          <td>${totals.p2i}/${totals.p2iA} <span class="pct">${pct(totals.p2i, totals.p2iA)}%</span></td>
          <td>${totals.p2e}/${totals.p2eA} <span class="pct">${pct(totals.p2e, totals.p2eA)}%</span></td>
          <td>${totals.p3}/${totals.p3A} <span class="pct">${pct(totals.p3, totals.p3A)}%</span></td>
          <td>${totals.ft}/${totals.ftA} <span class="pct">${pct(totals.ft, totals.ftA)}%</span></td>
          <td>${totals.reb}</td><td>${totals.ast}</td><td>${totals.stl}</td>
          <td>${totals.def}</td><td>${totals.to}</td><td>${totals.fouls}</td>
          <td class="num" style="color:var(--orange)">${totalGS.toFixed(1)}</td>
        </tr>
      </tbody>
    </table>
    <div style="padding:12px 16px;background:var(--bg-3);font-size:11px;color:var(--ink-3);line-height:1.5;border-top:1px solid var(--border-soft)">
      <strong style="color:var(--orange)">+/−</strong> = Game Score (Hollinger). Pts + 0.7×Reb + 0.4×PD + Int + 0.7×Def − 0.4×TirsRatés − PB − 0.4×Fautes.<br>
      <span style="color:var(--ink-4)">Indicateur de contribution globale. Vert : ≥15 (excellent) · Orange : 5-15 · Rouge : &lt;5</span>
    </div>
  `;
}

function saveMatch(id, isNew) {
  const opp = document.getElementById('m-opp').value.trim();
  if (!opp) return alert('Adversaire requis');
  const existing = isNew ? null : state.matches.find(x => x.id === id);
  const matchTime = document.getElementById('m-time').value || '';
  const home = document.getElementById('m-home').value === 'true';
  let rdvTime = document.getElementById('m-rdv-time').value || '';
  let rdvPlace = document.getElementById('m-rdv-place').value.trim();
  // Auto-fill RDV pour les extérieurs si vide
  if (!home && !rdvTime && matchTime) {
    const [hh, mm] = matchTime.split(':').map(n => parseInt(n));
    let h = hh - 1;
    if (h < 0) h = 0;
    rdvTime = String(h).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
  }

  const obj = {
    id, opponent: opp,
    date: document.getElementById('m-date').value,
    home,
    time: matchTime,
    place: document.getElementById('m-place').value.trim(),
    rdvTime,
    rdvPlace,
    scoreUs: parseInt(document.getElementById('m-us').value) || 0,
    scoreOpp: parseInt(document.getElementById('m-them').value) || 0,
    notes: document.getElementById('m-notes').value.trim(),
    videoUrl: existing ? existing.videoUrl : '',
    positives: existing ? existing.positives : [],
    negatives: existing ? existing.negatives : [],
    playerStats: existing ? existing.playerStats : {},
    transport: existing ? existing.transport : null,
    winSelfie: existing ? existing.winSelfie : undefined,
    roster: existing ? existing.roster : undefined,
    onCourt: existing ? existing.onCourt : undefined,
    playerFeedback: existing ? existing.playerFeedback : undefined,
    playerReviews: existing ? existing.playerReviews : undefined,
    convocId: existing ? existing.convocId : null,
  };
  if (isNew) { state.matches.unshift(obj); state.view = { type: 'match', id: obj.id }; }
  else { const i = state.matches.findIndex(x => x.id === id); state.matches[i] = obj; }
  // Synchronisation convocation associée
  syncConvocFromMatch(obj);
  persist(); closeModal(); render();
}

// Crée/met à jour la convocation liée à un match
function syncConvocFromMatch(m) {
  state.convocations = state.convocations || [];
  let convoc = m.convocId ? state.convocations.find(c => c.id === m.convocId) : null;
  // Heure d'événement : RDV si défini, sinon heure du match
  const effectiveTime = m.rdvTime || m.time || '';
  const effectivePlace = m.rdvPlace || m.place || '';
  if (!convoc) {
    // Création
    convoc = {
      id: uid(),
      type: 'match',
      matchId: m.id,
      title: 'vs ' + m.opponent,
      date: m.date,
      time: effectiveTime,
      place: effectivePlace,
      home: m.home,
      notes: m.notes || '',
      responses: {},
    };
    state.convocations.unshift(convoc);
    m.convocId = convoc.id;
  } else {
    // Mise à jour des champs synchronisés (on ne touche pas aux responses/callSheet)
    convoc.title = 'vs ' + m.opponent;
    convoc.date = m.date;
    convoc.time = effectiveTime;
    convoc.place = effectivePlace;
    convoc.home = m.home;
    convoc.matchId = m.id;
  }
}

function deleteMatch(id) {
  if (!confirm('Supprimer ce match ?\nLa convocation associée sera aussi supprimée.')) return;
  const m = state.matches.find(x => x.id === id);
  if (m && m.convocId) {
    state.convocations = state.convocations.filter(c => c.id !== m.convocId);
  }
  state.matches = state.matches.filter(x => x.id !== id);
  state.view = null;
  persist(); render();
}

// ============================================================
// TRANSPORT / COVOITURAGE MATCHS EXTÉRIEURS
// ============================================================

// Nettoyage : supprime les convocations 'match' orphelines (sans matchId) — appelé au démarrage
function cleanupOrphanMatchConvocs() {
  if (!state.convocations) return;
  const before = state.convocations.length;
  state.convocations = state.convocations.filter(c => {
    if (c.type !== 'match') return true; // garder tout sauf match
    if (c.matchId && state.matches.find(m => m.id === c.matchId)) return true; // garder si liée à un match valide
    return false; // supprimer les orphelines
  });
  // Vérifier l'inverse : matchs avec convocId pointant vers rien → recréer la convoc
  let recreated = 0;
  (state.matches || []).forEach(m => {
    if (m.convocId && !state.convocations.find(c => c.id === m.convocId)) {
      m.convocId = null; // sera recréé au sync
    }
    if (!m.convocId) {
      // Créer la convoc maintenant
      const effectiveTime = m.rdvTime || m.time || '';
      const effectivePlace = m.rdvPlace || m.place || '';
      const convoc = {
        id: uid(),
        type: 'match',
        matchId: m.id,
        title: 'vs ' + (m.opponent || '?'),
        date: m.date,
        time: effectiveTime,
        place: effectivePlace,
        home: m.home,
        notes: m.notes || '',
        responses: {},
      };
      state.convocations.unshift(convoc);
      m.convocId = convoc.id;
      recreated++;
    }
  });
  if (state.convocations.length !== before || recreated > 0) {
    persist();
    console.log('[cleanup] convocs match orphelines supprimées :', before - state.convocations.length, '· convocs recréées :', recreated);
  }
}

function ensureTransport(m) {
  if (!m.transport) m.transport = { drivers: {}, coachDriving: null, direct: [] };

// Coach : bilan saison transport (qui a conduit combien de fois)
function openTransportSummary(matchId) {
  // Calculer les stats sur tous les matchs
  const stats = state.players.map(p => {
    let droveCount = 0;
    let directCount = 0;
    let extMatchCount = 0;
    state.matches.forEach(mt => {
      if (mt.home) return; // ignore domiciles
      extMatchCount++;
      const t = mt.transport || {};
      if ((t.drivers || {})[p.id]) droveCount++;
      if ((t.direct || []).includes(p.id)) directCount++;
    });
    return { player: p, droveCount, directCount, extMatchCount };
  });
  // Tri : moins conduit en premier (à inciter)
  stats.sort((a,b) => a.droveCount - b.droveCount);

  const totalExtMatches = state.matches.filter(m => !m.home).length;

  openModal(`
    <div class="modal-header">
      <div>
        <div class="eyebrow">${totalExtMatches} match${totalExtMatches>1?'s':''} extérieur${totalExtMatches>1?'s':''}</div>
        <div class="modal-title">📊 Bilan transport saison</div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div style="padding:10px 12px;background:var(--bg-3);border-left:3px solid var(--orange);border-radius:6px;margin-bottom:14px;font-size:11px;color:var(--ink-2);line-height:1.5">
        Joueuses triées de <strong>celles qui ont le moins conduit</strong> à celles qui ont le plus, pour identifier qui solliciter prochainement.
      </div>
      <div style="display:flex;flex-direction:column;gap:4px">
        ${stats.map(x => {
          const ratio = totalExtMatches > 0 ? (x.droveCount / totalExtMatches) : 0;
          const color = ratio === 0 ? 'var(--ink-3)' : ratio < 0.2 ? 'var(--orange)' : ratio < 0.4 ? '#fbbf24' : 'var(--green)';
          return `
            <div class="transport-row">
              ${x.player.photo ? `<img src="${x.player.photo}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;border:1.5px solid var(--border)">` : `<div style="width:32px;height:32px;border-radius:50%;background:var(--bg-3);display:flex;align-items:center;justify-content:center;font-family:'Anton';font-size:12px;color:var(--orange)">${esc(x.player.name.charAt(0).toUpperCase())}</div>`}
              <div style="flex:1;min-width:0">
                <div style="font-family:'Anton';font-size:13px;text-transform:uppercase">#${x.player.num} ${esc(x.player.name)}</div>
                <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:2px;text-transform:uppercase">Direct: ${x.directCount}x</div>
              </div>
              <div style="text-align:right">
                <div style="font-family:'Anton';font-size:20px;color:${color}">${x.droveCount}<span style="font-size:11px;color:var(--ink-4)">x</span></div>
                <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase">A conduit</div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary btn-block" onclick="closeModal()">Fermer</button>
    </div>
  `);
}

// FOCUS POINTS avec images
function addFocus(matchId, type) { openFocusModal(matchId, type, null); }
function editFocus(matchId, type, focusId) { openFocusModal(matchId, type, focusId); }
function openFocusModal(matchId, type, focusId) {
  const m = state.matches.find(x => x.id === matchId);
  m[type] = m[type] || [];
  const isNew = !focusId;
  const f = isNew ? { id: uid(), text: '', minute: '', images: [] } : m[type].find(x => x.id === focusId);
  if (!f) return;
  f.images = f.images || [];

  // Stocker temporairement les images dans state pour les manipuler
  state._focusImages = [...f.images];

  renderFocusModal(matchId, type, f.id, isNew);
}

function renderFocusModal(matchId, type, focusId, isNew) {
  const m = state.matches.find(x => x.id === matchId);
  const f = isNew ? { text: '', minute: '' } : m[type].find(x => x.id === focusId);
  const images = state._focusImages || [];

  openModal(`
    <div class="modal-header">
      <div class="modal-title">${type === 'positives' ? '✓ Point positif' : '✕ À corriger'}</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="fld"><label class="fld-label">Minute (optionnel)</label><input id="fo-min" value="${esc(f.minute || '')}" placeholder="24"></div>
      <div class="fld"><label class="fld-label">Commentaire</label><textarea id="fo-text" placeholder="Décris le point...">${esc(f.text || '')}</textarea></div>
      <div class="fld">
        <label class="fld-label">Images / Photos d'écran</label>
        <div class="focus-images">
          ${images.map((img, i) => `
            <div class="focus-img-thumb" style="position:relative">
              <img src="${img}" alt="" onclick="viewImage('${img.replace(/'/g, "\\'")}')">
              <button onclick="event.stopPropagation();removeFocusImage(${i});renderFocusModal('${matchId}','${type}','${focusId}',${isNew})"
                style="position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,0.8);color:white;border:none;cursor:pointer;font-size:11px">✕</button>
            </div>
          `).join('')}
          <label class="focus-img-add" for="focus-file-${focusId}">+</label>
        </div>
        <input id="focus-file-${focusId}" type="file" accept="image/*" multiple style="display:none" onchange="addFocusImages(event, '${matchId}', '${type}', '${focusId}', ${isNew})">
        <div style="margin-top:6px;font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono'">Photos d'écran de vidéo, schémas tactiques, captures</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="saveFocus('${matchId}','${type}','${focusId}',${isNew})">Enregistrer</button>
    </div>
  `);
}

async function addFocusImages(e, matchId, type, focusId, isNew) {
  const files = Array.from(e.target.files);
  for (const file of files) {
    try {
      const b64 = await fileToBase64(file);
      // Compresser si trop gros : skip pour simplicité
      state._focusImages.push(b64);
    } catch (err) {
      console.error(err);
    }
  }
  renderFocusModal(matchId, type, focusId, isNew);
}
function removeFocusImage(idx) {
  state._focusImages.splice(idx, 1);
}

function saveFocus(matchId, type, focusId, isNew) {
  const m = state.matches.find(x => x.id === matchId);
  const text = document.getElementById('fo-text').value.trim();
  if (!text) return alert('Commentaire requis');
  const minute = document.getElementById('fo-min').value.trim();
  m[type] = m[type] || [];
  const obj = { id: focusId, text, minute, images: state._focusImages || [] };
  if (isNew) m[type].push(obj);
  else { const i = m[type].findIndex(x => x.id === focusId); m[type][i] = obj; }
  state._focusImages = null;
  persist(); closeModal(); render();
}
function deleteFocus(matchId, type, focusId) {
  if (!confirm('Supprimer ?')) return;
  const m = state.matches.find(x => x.id === matchId);
  m[type] = m[type].filter(x => x.id !== focusId);
  persist(); render();
}

function savePlayerStat(matchId, isNew) {
  const m = state.matches.find(x => x.id === matchId);
  const pid = document.getElementById('ps-pid').value;
  if (!pid) return alert('Joueuse requise');
  const g = id => parseInt(document.getElementById(id).value) || 0;
  const p2i = g('ps-p2i'), p2e = g('ps-p2e'), p3 = g('ps-p3'), ft = g('ps-ft');
  const pts = (p2i + p2e) * 2 + p3 * 3 + ft;
  m.playerStats = m.playerStats || {};
  m.playerStats[pid] = {
    min: g('ps-min'), pts, fouls: g('ps-fouls'),
    p2i, p2iA: g('ps-p2iA'), p2e, p2eA: g('ps-p2eA'),
    p3, p3A: g('ps-p3A'), ft, ftA: g('ps-ftA'),
    reb: g('ps-reb'), ast: g('ps-ast'), stl: g('ps-stl'), def: g('ps-def'), to: g('ps-to'),
    ca: g('ps-ca'),
  };
  persist(); closeModal(); render();
}
function deletePlayerStat(matchId, pid) {
  if (!confirm('Supprimer ces stats ?')) return;
  const m = state.matches.find(x => x.id === matchId);
  delete m.playerStats[pid];
  persist(); closeModal(); render();
}

// Joueuses actuellement sur le terrain (max 5)
function getOnCourt(m) {
  if (!m.onCourt) return [];
  return state.players.filter(p => m.onCourt.includes(p.id));
}

// Initialise les 5 du terrain : prend les 5 premières du roster (si pas déjà défini)
function ensureOnCourt(m) {
  if (m.onCourt && Array.isArray(m.onCourt) && m.onCourt.length > 0) return;
  const roster = getMatchRoster(m);
  m.onCourt = roster.slice(0, 5).map(p => p.id);
}

// Récupère la liste des joueuses retenues pour un match
// Priorité : m.roster.included si défini, sinon présentes à la convoc 'match' du même jour, sinon toutes
function getMatchRoster(m) {
  if (m.roster && Array.isArray(m.roster.included)) {
    return state.players.filter(p => m.roster.included.includes(p.id));
  }
  // Chercher la convoc match du même jour
  const sameDayConvoc = (state.convocations || []).find(c =>
    c.type === 'match' && c.date === m.date
  );
  if (sameDayConvoc) {
    const responses = sameDayConvoc.responses || {};
    // Présentes = ceux sans réponse ou avec status 'present'
    return state.players.filter(p => !responses[p.id] || responses[p.id].status === 'present');
  }
  // Fallback : tout l'effectif
  return state.players;
}

// Initialise le roster du match si pas encore défini
function ensureMatchRoster(m) {
  if (m.roster && Array.isArray(m.roster.included)) return;
  const auto = getMatchRoster(m);
  m.roster = { included: auto.map(p => p.id) };
}

// Délégation : passer le tracker en mode "kiosque" pour une joueuse du banc
function delegateStatsToPlayer(matchId) {
  const m = state.matches.find(x => x.id === matchId);
  if (!m) return;
  if (!confirm("Passer en mode délégation ?\n\nLa joueuse pourra saisir les stats. Pour reprendre le contrôle, sors via ← Quitter puis re-logue-toi.\n\nLe match en cours est conservé.")) return;

  // Sauvegarder le rôle actuel pour pouvoir revenir
  state._delegationFrom = { role: state.auth.role, playerId: state.auth.playerId };
  // Passer en mode stat'man
  state.auth = { role: 'stat', playerId: null, delegated: true };
  state.section = 'live';
  // S'assurer que le live est actif sur ce match
  if (!state.live || state.live.matchId !== matchId) {
    state.live = { matchId, mode: 'tap', selectedPlayer: null, log: load(K.liveSession + '_' + matchId, []) };
  }
  persist();
  closeModal();
  render();
  alert('✓ Mode délégation activé.\n\nLa joueuse peut saisir les stats. Pour reprendre, sors via ← Quitter en haut à droite.');
}

// Tap une joueuse du terrain : la marque comme "à sortir" (ou désélectionne)
function selectCourtForSwap(matchId, pid) {
  if (state._rotationSelectedCourt === pid) {
    state._rotationSelectedCourt = null;
  } else {
    state._rotationSelectedCourt = pid;
  }
  renderRotationModal(matchId);
}

// Tap une joueuse du banc : soit échange (si terrain sélectionné), soit entre directement (si <5 sur terrain)
function rotateFromBench(matchId, benchPid) {
  const m = state.matches.find(x => x.id === matchId);
  if (!m) return;
  ensureOnCourt(m);

  if (state._rotationSelectedCourt) {
    // Échange : retire la sélectionnée + ajoute celle du banc
    m.onCourt = m.onCourt.filter(id => id !== state._rotationSelectedCourt);
    m.onCourt.push(benchPid);
    state._rotationSelectedCourt = null;
  } else if (m.onCourt.length < 5) {
    // Pas besoin d'échange : juste entrer
    m.onCourt.push(benchPid);
  } else {
    // Terrain plein, pas de sélection → demander
    alert("Tap d'abord une joueuse du terrain à faire sortir.");
    return;
  }
  persist();
  renderRotationModal(matchId);
}

// Échange rapide depuis le bandeau "Banc" du tracker : ouvre la modale de rotation
// avec déjà la joueuse du banc présélectionnée si terrain plein
function quickSwapToCourtPrompt(matchId, benchPid) {
  const m = state.matches.find(x => x.id === matchId);
  if (!m) return;
  ensureOnCourt(m);
  if (m.onCourt.length < 5) {
    // Pas plein, on fait entrer direct
    m.onCourt.push(benchPid);
    persist();
    render();
    return;
  }
  // Terrain plein : ouvrir la modale pour choisir qui sort
  state._rotationSelectedCourt = null;
  state._pendingBenchEntry = benchPid;
  openRotationModalWithEntry(matchId);
}

function confirmSwap(matchId, outPid, inPid) {
  const m = state.matches.find(x => x.id === matchId);
  if (!m) return;
  ensureOnCourt(m);
  m.onCourt = m.onCourt.filter(id => id !== outPid);
  m.onCourt.push(inPid);
  persist();
  closeModal();
  render();
}

function toggleRosterPlayer(matchId, pid, include) {
  const m = state.matches.find(x => x.id === matchId);
  if (!m) return;
  ensureMatchRoster(m);
  if (include) {
    if (!m.roster.included.includes(pid)) m.roster.included.push(pid);
  } else {
    m.roster.included = m.roster.included.filter(x => x !== pid);
    // Si elle avait des stats, on les retire aussi (sinon elles restent fantômes)
    if (m.playerStats && m.playerStats[pid]) {
      if (!confirm('Cette joueuse a déjà des stats enregistrées. Les retirer aussi ?\n\nAnnuler pour la retirer de l\'effectif mais conserver ses stats.')) {
        // On la retire de l'effectif mais on garde les stats
      } else {
        delete m.playerStats[pid];
      }
    }
  }
  recalcMatchScore(m);
  persist();
  // Re-render la modale + la vue live
  closeModal();
  setTimeout(() => {
    openRosterManager(matchId);
    render();
  }, 50);
}

function startLive(matchId) {
  state.live = {
    matchId,
    mode: 'tap',
    selectedPlayer: null,
    log: load(K.liveSession + '_' + matchId, []),
  };
  render();
}

function exitLive() {
  // Si on était en délégation, restaurer le rôle d'origine
  if (state.auth && state.auth.delegated && state._delegationFrom) {
    if (!confirm('Quitter le mode délégation ?')) return;
    state.auth = state._delegationFrom;
    state._delegationFrom = null;
    state.section = state.auth.role === 'coach' ? 'home' : (state.auth.role === 'player' ? 'calendrier' : 'matches');
    persist();
    render();
    return;
  }
  _exitLiveOriginal();
}
function _exitLiveOriginal() {
  state.live = null;
  render();
}

function renderLiveTracker() {
  const m = state.matches.find(x => x.id === state.live.matchId);
  if (!m) { state.live = null; return renderLivePicker(); }

  const mode = state.live.mode;
  const selectedPid = state.live.selectedPlayer;

  // Effectif retenu pour ce match (basé sur les présences ou roster custom)
  ensureMatchRoster(m);
  ensureOnCourt(m);
  const roster = getMatchRoster(m);

  // Players avec leurs stats actuelles - SEULEMENT les retenues
  const playersWithStats = roster.map(p => {
    const s = (m.playerStats || {})[p.id] || {};
    return { ...p, stats: s, onCourt: (m.onCourt || []).includes(p.id) };
  });

  // Joueuses sur le terrain (max 5)
  const onCourtPlayers = playersWithStats.filter(p => p.onCourt);
  const benchPlayers = playersWithStats.filter(p => !p.onCourt);

  const myScore = m.scoreUs || 0;
  const oppScore = m.scoreOpp || 0;
  const isLeading = myScore > oppScore;
  const isTied = myScore === oppScore;
  const isPublic = m.publicLive;

  return `
    <div class="fade-up live-tracker">
      <div class="live-tracker-header">

          <div class="eyebrow" style="display:flex;align-items:center;gap:6px">

          </div>

        </div>
        <div style="display:flex;flex-direction:column;gap:4px">
          <button class="btn btn-secondary" onclick="openRosterManager('${m.id}')" style="font-size:10px;padding:6px 10px">👥 Effectif</button>
          <button class="btn btn-secondary" onclick="exitLive()" style="font-size:10px;padding:6px 10px">← Quitter</button>
        </div>
      </div>

      <!-- SCOREBOARD LIVE -->
      <div class="scoreboard-live">
        <div class="scoreboard-team scoreboard-us ${isLeading ? 'winning' : ''}">
          <div class="scoreboard-label">NOUS</div>
          <div class="scoreboard-value">${myScore}</div>
          <div class="scoreboard-sub">auto · depuis stats</div>
        </div>
