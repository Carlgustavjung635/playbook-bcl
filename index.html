function liveAction(key, increment) {
  if (!state.live.selectedPlayer) return;
  liveActionFor(state.live.selectedPlayer, key, increment);
}

function liveActionFor(playerId, key, increment) {
  const m = state.matches.find(x => x.id === state.live.matchId);
  if (!m) return;
  m.playerStats = m.playerStats || {};
  m.playerStats[playerId] = m.playerStats[playerId] || { min: 0, pts: 0, p2i: 0, p2iA: 0, p2e: 0, p2eA: 0, p3: 0, p3A: 0, ft: 0, ftA: 0, ca: 0, reb: 0, ast: 0, stl: 0, def: 0, to: 0, fouls: 0 };
  const s = m.playerStats[playerId];
  const inc = increment || 1;
  s[key] = (s[key] || 0) + inc;

  // Si tir réussi (clic sans increment), augmenter aussi tentatives + points
  if (key === 'p2i' && !increment) { s.p2iA = (s.p2iA || 0) + 1; s.pts = (s.pts || 0) + 2; }
  else if (key === 'p2e' && !increment) { s.p2eA = (s.p2eA || 0) + 1; s.pts = (s.pts || 0) + 2; }
  else if (key === 'p3' && !increment) { s.p3A = (s.p3A || 0) + 1; s.pts = (s.pts || 0) + 3; }
  else if (key === 'ft' && !increment) { s.ftA = (s.ftA || 0) + 1; s.pts = (s.pts || 0) + 1; }
  // CA = contre-attaque réussie : +2 au total + +1 sur p2i (puisque c'est un panier intérieur)
  else if (key === 'ca' && !increment) {
    s.pts = (s.pts || 0) + 2;
    s.p2i = (s.p2i || 0) + 1;
    s.p2iA = (s.p2iA || 0) + 1;
  }

  recalcMatchScore(m);

  const player = state.players.find(p => p.id === playerId);
  const labels = {
    p2i: '2pts INT ✓', p2iA: '2pts INT ✕', p2e: '2pts MID ✓', p2eA: '2pts MID ✕',
    p3: '3pts ✓', p3A: '3pts ✕', ft: 'LF ✓', ftA: 'LF ✕',
    ca: 'Contre-attaque ✓ (+2)',
    reb: 'Rebond', ast: 'Passe D.', stl: 'Interception', def: 'Déflexion',
    to: 'Perte', fouls: 'Faute', min: '+1 minute',
  };
  const points = { p2i: 2, p2e: 2, p3: 3, ft: 1, ca: 2 };
  state.live.log.push({
    time: new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
    label: `#${player.num} ${player.name} · ${labels[key] || key}`,
    value: points[key] || (increment || 1),
    playerId, key, inc,
  });
  save(K.liveSession + '_' + state.live.matchId, state.live.log);
  persist();
  render();
}

function recalcMatchScore(m) {
  let total = 0;
  Object.values(m.playerStats || {}).forEach(s => total += (s.pts || 0));
  m.scoreUs = total;
  m.lastLiveUpdate = Date.now();
}

// Incrémenter le score adverse (boutons -1, +1, +2, +3)
function oppScoreAdd(delta) {
  const m = state.matches.find(x => x.id === state.live.matchId);
  if (!m) return;
  m.scoreOpp = Math.max(0, (m.scoreOpp || 0) + delta);
  m.lastLiveUpdate = Date.now();
  // Log dans la liste pour pouvoir annuler
  state.live.log.push({
    time: new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
    label: `Adversaire ${delta > 0 ? '+' : ''}${delta}`,
    value: delta,
    playerId: null, key: 'opp', inc: delta,
  });
  save(K.liveSession + '_' + state.live.matchId, state.live.log);
  persist();
  render();
}

// Activer/désactiver la diffusion publique
function togglePublicLive() {
  const m = state.matches.find(x => x.id === state.live.matchId);
  if (!m) return;
  if (m.publicLive) {
    m.publicLive = false;
    persist();
    render();
    return;
  }
  // Désactiver les autres lives publics (un seul à la fois)
  state.matches.forEach(other => { if (other.id !== m.id) other.publicLive = false; });
  m.publicLive = true;
  m.publicLiveStartedAt = Date.now();
  persist();
  render();
  setTimeout(() => {
    if (confirm('Diffusion activée ! Veux-tu copier le lien à partager ?')) copyPublicLink();
  }, 100);
}

function copyPublicLink() {
  const url = window.location.origin + window.location.pathname + '#public';
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => {
      alert('Lien copié :\n\n' + url + '\n\nPartage-le sur WhatsApp / groupe pour suivre en live.');
    }).catch(() => prompt('Copie ce lien :', url));
  } else {
    prompt('Copie ce lien :', url);
  }
}

function undoLastAction() {
  if (state.live.log.length === 0) return;
  const last = state.live.log.pop();
  const m = state.matches.find(x => x.id === state.live.matchId);

  // Cas spécial : score adverse
  if (last.key === 'opp') {
    m.scoreOpp = Math.max(0, (m.scoreOpp || 0) - (last.inc || 0));
    m.lastLiveUpdate = Date.now();
    save(K.liveSession + '_' + state.live.matchId, state.live.log);
    persist();
    render();
    return;
  }

  const s = m.playerStats[last.playerId];
  if (s) {
    s[last.key] = Math.max(0, (s[last.key] || 0) - (last.inc || 1));
    if (last.key === 'p2i' && !last.inc) { s.p2iA = Math.max(0, (s.p2iA || 0) - 1); s.pts = Math.max(0, (s.pts || 0) - 2); }
    else if (last.key === 'p2e' && !last.inc) { s.p2eA = Math.max(0, (s.p2eA || 0) - 1); s.pts = Math.max(0, (s.pts || 0) - 2); }
    else if (last.key === 'p3' && !last.inc) { s.p3A = Math.max(0, (s.p3A || 0) - 1); s.pts = Math.max(0, (s.pts || 0) - 3); }
    else if (last.key === 'ft' && !last.inc) { s.ftA = Math.max(0, (s.ftA || 0) - 1); s.pts = Math.max(0, (s.pts || 0) - 1); }
    else if (last.key === 'ca' && !last.inc) { s.p2i = Math.max(0, (s.p2i||0) - 1); s.p2iA = Math.max(0, (s.p2iA||0) - 1); s.pts = Math.max(0, (s.pts||0) - 2); }
  }
  recalcMatchScore(m);
  save(K.liveSession + '_' + state.live.matchId, state.live.log);
  persist();
  render();
}

const POSTES = [
  { id: 'pg', label: 'Meneuse', short: 'PG', num: '1' },
  { id: 'sg', label: 'Arrière', short: 'SG', num: '2' },
  { id: 'sf', label: 'Ailière', short: 'SF', num: '3' },
  { id: 'pf', label: 'Ailière forte', short: 'PF', num: '4' },
  { id: 'c',  label: 'Pivot', short: 'C',  num: '5' },
];

function renderLineups() {
  const lineups = state.lineups || [];
  return `
    <div class="px" style="padding-top:14px">
      <div style="padding:10px 12px;background:var(--bg-3);border-left:3px solid var(--orange);border-radius:6px;margin-bottom:14px;font-size:11px;color:var(--ink-2);line-height:1.5">
        <strong style="color:var(--orange)">🔒 Visible uniquement par le coach.</strong><br>
        Crée tes 5 de départ, rotations, ou compos spécifiques (ex : compo défense, compo zone, 5 finish).
      </div>
      <button class="btn btn-primary btn-block mb-3" onclick="editLineup()">+ Nouvelle composition</button>
    </div>

    ${lineups.length === 0 ? `
      <div class="empty">
        <div class="empty-icon">⛹</div>
        <div class="empty-title">Aucune composition</div>
        <div class="empty-desc">Crée ta 1ère compo : 5 de départ ou rotations</div>
      </div>
    ` : `
      <div class="list-section">
        ${lineups.map(l => lineupCard(l)).join('')}
      </div>
    `}
  `;
}

function lineupCard(l) {
  const starters = POSTES.map(p => {
    const pid = (l.starters || {})[p.id];
    const player = state.players.find(x => x.id === pid);
    return { poste: p, player };
  });
  return `
    <div class="lineup-card" onclick="viewLineup('${l.id}')">
      <div class="lineup-card-header">
        <div>
          <div class="eyebrow">${esc(l.tag || 'Composition')}</div>
          <h3 class="display-md mt-2">${esc(l.name)}</h3>
          ${l.notes ? `<div style="font-size:11px;color:var(--ink-3);margin-top:4px;font-style:italic">${esc(l.notes.slice(0, 80))}${l.notes.length > 80 ? '...' : ''}</div>` : ''}
        </div>
      </div>
      <div class="lineup-court">
        ${starters.map(s => `
          <div class="lineup-slot ${s.player ? '' : 'empty'}">
            <div class="lineup-slot-poste">${s.poste.num}</div>
            <div class="lineup-slot-name">${s.player ? esc(s.player.name.split(' ')[0]) : '—'}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function viewLineup(id) {
  const l = state.lineups.find(x => x.id === id);
  if (!l) return;
  openModal(`
    <div class="modal-header">
      <div>
        <div class="eyebrow">${esc(l.tag || 'Composition')}</div>
        <div class="modal-title">${esc(l.name)}</div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      ${l.notes ? `
        <div style="padding:10px 12px;background:var(--bg-3);border-radius:6px;margin-bottom:14px;font-size:12px;color:var(--ink-2);line-height:1.5;font-style:italic">
          ${esc(l.notes)}
        </div>
      ` : ''}
      <div class="eyebrow-muted mb-2">5 de départ</div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:18px">
        ${POSTES.map(p => {
          const titularePid = (l.starters || {})[p.id];
          const remplacantPid = (l.bench || {})[p.id];
          const titulaire = state.players.find(x => x.id === titularePid);
          const remplacant = state.players.find(x => x.id === remplacantPid);
          return `
            <div class="lineup-row">
              <div class="lineup-poste-badge">${p.num}</div>
              <div style="flex:1">
                <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.06em">${p.label} · ${p.short}</div>
                <div style="font-family:'Anton';font-size:15px;text-transform:uppercase;margin-top:2px;color:${titulaire?'var(--ink)':'var(--ink-4)'}">${titulaire ? esc(titulaire.name) : 'Non assigné'}</div>
                ${remplacant ? `<div style="font-size:10px;color:var(--orange);font-family:'JetBrains Mono';margin-top:2px;text-transform:uppercase">↻ ${esc(remplacant.name)}</div>` : ''}
              </div>
            </div>

      </div>

    <div class="modal-footer" style="flex-direction:column;gap:6px">
      <div style="display:flex;gap:6px;width:100%">
        <button class="btn btn-secondary btn-block" onclick="duplicateLineup('${id}')">⎘ Dupliquer</button>
        <button class="btn btn-secondary btn-block" onclick="editLineup('${id}')">✎ Modifier</button>
      </div>
      <button class="btn btn-ghost btn-block" style="color:var(--red)" onclick="deleteLineup('${id}')">🗑 Supprimer</button>
    </div>
  `);
}

function editLineup(id) {
  const existing = id ? state.lineups.find(x => x.id === id) : null;
  const l = existing ? JSON.parse(JSON.stringify(existing)) : {
    id: uid(), name: '', tag: '', notes: '', starters: {}, bench: {},
  };
  state._editingLineup = l;
  renderLineupEditor();
}

function renderLineupEditor() {
  const l = state._editingLineup;
  const isNew = !state.lineups.find(x => x.id === l.id);
  openModal(`
    <div class="modal-header">
      <div class="modal-title">${isNew ? 'Nouvelle compo' : 'Modifier compo'}</div>
      <button class="modal-close" onclick="closeModal();state._editingLineup=null">✕</button>
    </div>
    <div class="modal-body">
      <div class="fld">
        <label class="fld-label">Nom de la composition</label>
        <input id="l-name" value="${esc(l.name)}" placeholder="5 de départ, Compo zone, 5 finish..." oninput="state._editingLineup.name=this.value">
      </div>
      <div class="fld">
        <label class="fld-label">Tag (optionnel)</label>
        <input id="l-tag" value="${esc(l.tag)}" placeholder="Départ · Défense · Attaque · Rotation" oninput="state._editingLineup.tag=this.value">
      </div>

      <div class="eyebrow-muted" style="margin:14px 0 8px">Postes & joueuses</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${POSTES.map(p => `
          <div class="lineup-edit-row">
            <div class="lineup-poste-badge">${p.num}</div>
            <div style="flex:1;min-width:0">
              <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px">${p.label} · ${p.short}</div>
              <select onchange="state._editingLineup.starters['${p.id}']=this.value||null" style="width:100%;padding:8px;background:var(--bg-2);border:1px solid var(--border);border-radius:6px;color:var(--ink);font-family:'Inter';font-size:12px;margin-bottom:4px">
                <option value="">— Titulaire —</option>
                ${state.players.map(pl => `<option value="${pl.id}" ${(l.starters||{})[p.id]===pl.id?'selected':''}>#${pl.num} ${esc(pl.name)}</option>`).join('')}
              </select>
              <select onchange="state._editingLineup.bench['${p.id}']=this.value||null" style="width:100%;padding:6px;background:var(--bg-1);border:1px dashed var(--border);border-radius:6px;color:var(--orange);font-family:'Inter';font-size:11px">
                <option value="">↻ Remplaçante (optionnel)</option>
                ${state.players.map(pl => `<option value="${pl.id}" ${(l.bench||{})[p.id]===pl.id?'selected':''}>↻ #${pl.num} ${esc(pl.name)}</option>`).join('')}
              </select>
            </div>
          </div>
        `).join('')}
      </div>

      <div class="fld" style="margin-top:14px">
        <label class="fld-label">Notes tactiques</label>
        <textarea id="l-notes" placeholder="Quand utiliser cette compo, points forts, points d'attention..." oninput="state._editingLineup.notes=this.value">${esc(l.notes)}</textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary btn-block" onclick="closeModal();state._editingLineup=null">Annuler</button>
      <button class="btn btn-primary btn-block" onclick="saveLineup()">Enregistrer</button>
    </div>
  `);
  setTimeout(() => document.getElementById('l-name')?.focus(), 100);
}

function saveLineup() {
  const l = state._editingLineup;
  if (!l.name || !l.name.trim()) { alert('Le nom est requis'); return; }
  const existing = state.lineups.findIndex(x => x.id === l.id);
  if (existing >= 0) state.lineups[existing] = l;
  else state.lineups.push(l);
  state._editingLineup = null;
  persist();
  closeModal();
  render();
}

function duplicateLineup(id) {
  const orig = state.lineups.find(x => x.id === id);
  if (!orig) return;
  const copy = JSON.parse(JSON.stringify(orig));
  copy.id = uid();
  copy.name = orig.name + ' (copie)';
  state.lineups.push(copy);
  persist();
  closeModal();
  render();
}

function deleteLineup(id) {
  if (!confirm('Supprimer cette composition ?')) return;
  state.lineups = state.lineups.filter(x => x.id !== id);
  persist();
  closeModal();
  render();
}

function renderConvocs() {
  const today = new Date(); today.setHours(0,0,0,0);
  const todayStr = isoDate(today);
  const isCoach = state.auth.role === 'coach';

  // 3 prochaines semaines d'instances
  const threeWeeksLater = new Date(today.getTime() + 21 * 86400000);
  const upcoming = getAllEventsBetween(todayStr, isoDate(threeWeeksLater));

  // Passées : derniers 30 jours
  const monthAgo = new Date(today.getTime() - 30 * 86400000);
  const past = getAllEventsBetween(isoDate(monthAgo), isoDate(new Date(today.getTime() - 86400000)));
  past.reverse();

  // Grouper upcoming par semaine
  const weeks = groupEventsByWeek(upcoming, today);

  return `
    <div style="padding:0 18px 12px;display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:12px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.05em">${upcoming.length} événement${upcoming.length>1?'s':''} sur 3 semaines</div>
      ${isCoach ? `<button class="btn btn-primary" onclick="editConvoc()">+ Nouveau</button>` : ''}
    </div>

    ${upcoming.length === 0 && past.length === 0 ? `
      <div class="empty">
        <div class="empty-icon">○</div>
        <div class="empty-title">Aucun événement</div>
        ${isCoach ? '<div class="empty-desc">Crée ton premier événement</div>' : ''}
      </div>
    ` : `
      ${weeks.map(w => `
        <div style="padding:14px 18px 6px">
          <div class="eyebrow">${w.label}</div>
        </div>
        ${w.events.length === 0 ? `
          <div style="padding:0 18px 12px;font-size:12px;color:var(--ink-4);font-style:italic">Aucun événement</div>
        ` : `
          <div class="list-section">
            ${w.events.map(e => eventInstanceRow(e, isCoach)).join('')}
          </div>
        `}
      `).join('')}

      ${past.length > 0 ? `
        <div style="padding:18px 18px 6px"><div class="eyebrow-muted">Passées (30 derniers jours)</div></div>
        <div class="list-section" style="opacity:0.7">
          ${past.slice(0, 10).map(e => eventInstanceRow(e, isCoach)).join('')}
        </div>
      ` : ''}
    `}
  `;
}

function groupEventsByWeek(events, today) {
  const weeks = [
    { label: 'Cette semaine', events: [] },
    { label: 'Semaine prochaine', events: [] },
    { label: 'Dans 2 semaines', events: [] },
  ];
  // Trouver le lundi de la semaine courante
  const monday = new Date(today);
  const offset = (today.getDay() + 6) % 7;
  monday.setDate(today.getDate() - offset);
  const w1End = new Date(monday.getTime() + 7 * 86400000);
  const w2End = new Date(monday.getTime() + 14 * 86400000);

  events.forEach(e => {
    const d = new Date(e.date + 'T00:00:00');
    if (d < w1End) weeks[0].events.push(e);
    else if (d < w2End) weeks[1].events.push(e);
    else weeks[2].events.push(e);
  });
  return weeks;
}

function convocCard(c, isPast, isCoach) {
  const responses = c.responses || {};
  const present = state.players.filter(p => !responses[p.id] || responses[p.id].status === 'present');
  const absent = state.players.filter(p => responses[p.id] && responses[p.id].status === 'absent');
  const days = daysUntil(c.date);
  let dateLabel;
  if (isPast) dateLabel = formatDate(c.date, 'long');
  else if (days === 0) dateLabel = "Aujourd'hui";
  else if (days === 1) dateLabel = 'Demain';
  else if (days < 7) dateLabel = `Dans ${days}j`;
  else dateLabel = formatDate(c.date, 'long');

  // Match lié : récupérer pour afficher des infos contextuelles
  const linkedMatch = c.matchId ? state.matches.find(x => x.id === c.matchId) : null;
  const matchPlace = linkedMatch ? (linkedMatch.place || c.location || '') : (c.location || c.place || '');

  return `
    <div class="list-section" style="${isPast ? 'opacity:0.6' : ''}">

function setRecType(type) {
  state._tempRecurrence.type = type;
  if (type === 'weekly' && state._tempRecurrence.days.length === 0) {
    state._tempRecurrence.days = [3, 5]; // mercredi + vendredi par défaut
  }
  // Re-render
  const id = document.querySelector('.modal-footer .btn-primary').getAttribute('onclick').match(/saveConvoc\('([^']+)'/)[1];
  const isNew = document.querySelector('.modal-title').textContent.includes('Nouvel');
  const c = isNew ? { id, type: document.getElementById('cv-type').value, title: document.getElementById('cv-title').value, date: document.getElementById('cv-date').value, time: document.getElementById('cv-time').value, location: document.getElementById('cv-loc').value, note: document.getElementById('cv-note').value, recurrence: state._tempRecurrence } : state.convocations.find(x => x.id === id);
  // Re-render simplement
  document.getElementById('rec-options').style.display = type === 'weekly' ? 'block' : 'none';
  // Update button styles
  const btns = document.querySelectorAll('.modal-body > .fld:nth-of-type(6) button, .modal-body > .fld:nth-of-type(7) button');
  document.querySelectorAll('[onclick^="setRecType"]').forEach(b => {
    const t = b.getAttribute('onclick').match(/setRecType\('([^']+)'\)/)[1];
    b.className = 'btn ' + (t === type ? 'btn-primary' : 'btn-secondary') + ' btn-block';
  });
  // Refresh days
  document.querySelectorAll('[data-day]').forEach(b => {
    const d = parseInt(b.getAttribute('data-day'));
    b.className = 'btn ' + (state._tempRecurrence.days.includes(d) ? 'btn-primary' : 'btn-secondary');
    b.style.cssText = 'padding:8px 0;font-size:10px';
  });
}

function toggleRecDay(d) {
  if (!state._tempRecurrence) state._tempRecurrence = { type: 'weekly', days: [], until: '' };
  const idx = state._tempRecurrence.days.indexOf(d);
  if (idx >= 0) state._tempRecurrence.days.splice(idx, 1);
  else state._tempRecurrence.days.push(d);
  // Update visuel
  const btn = document.querySelector(`[data-day="${d}"]`);
  if (btn) {
    btn.className = 'btn ' + (state._tempRecurrence.days.includes(d) ? 'btn-primary' : 'btn-secondary');
    btn.style.cssText = 'padding:8px 0;font-size:10px';
  }
}

async function addTempAttachments(e) {
  const files = Array.from(e.target.files);
  for (const file of files) {
    try {
      const a = await makeAttachment(file);
      state._tempAttachments.push(a);
    } catch(err) { console.error(err); }
  }
  refreshTempAttachmentsUI();
}
function removeTempAttachment(idx) {
  state._tempAttachments.splice(idx, 1);
  refreshTempAttachmentsUI();
}
function refreshTempAttachmentsUI() {
  // Trouve le conteneur attachments-grid dans le modal et le re-render
  const modal = document.querySelector('.modal-body');
  if (!modal) return;
  const grids = modal.querySelectorAll('.attachments-grid');
  const lastGrid = grids[grids.length - 1];
  if (lastGrid) {
    const html = renderAttachments(state._tempAttachments, true, 'removeTempAttachment');
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    if (tmp.firstElementChild) lastGrid.replaceWith(tmp.firstElementChild);
    else lastGrid.replaceWith(document.createElement('div'));
  } else {
    // Premier ajout : créer la grille
    const uploader = modal.querySelector('label[for="cv-files"], label[for="play-files"], label[for="match-files"], label[for="insp-files"], label[for="chal-files"]');
    if (uploader) {
      const html = renderAttachments(state._tempAttachments, true, 'removeTempAttachment');
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      if (tmp.firstElementChild) uploader.parentNode.insertBefore(tmp.firstElementChild, uploader);
    }
  }
}

function saveConvoc(id, isNew) {
  const title = document.getElementById('cv-title').value.trim();
  if (!title) return alert('Titre requis');
  const existing = isNew ? null : state.convocations.find(x => x.id === id);
  const recType = state._tempRecurrence ? state._tempRecurrence.type : 'none';
  let recurrence = null;
  if (recType === 'weekly' && state._tempRecurrence.days.length > 0) {
    recurrence = {
      type: 'weekly',
      days: state._tempRecurrence.days,
      until: document.getElementById('cv-until') ? document.getElementById('cv-until').value : ''
    };
  }
  const obj = {
    id, title,
    type: document.getElementById('cv-type').value,
    date: document.getElementById('cv-date').value,
    time: document.getElementById('cv-time').value,
    location: document.getElementById('cv-loc').value.trim(),
    note: document.getElementById('cv-note').value.trim(),
    responses: existing ? (existing.responses || {}) : {},
    attachments: state._tempAttachments || [],
    recurrence,
    cancelledInstances: existing ? (existing.cancelledInstances || []) : [],
    instanceOverrides: existing ? (existing.instanceOverrides || {}) : {},
    // Préserver les liens et metadata match
    matchId: existing ? existing.matchId : undefined,
    home: existing ? existing.home : undefined,
    place: existing ? existing.place : undefined,
    callSheet: existing ? existing.callSheet : undefined,
  };
  if (isNew) state.convocations.unshift(obj);
  else { const i = state.convocations.findIndex(x => x.id === id); state.convocations[i] = obj; }
  state._tempAttachments = null;
  state._tempRecurrence = null;
  persist(); closeModal(); render();
}
function deleteConvoc(id) {
  const c = state.convocations.find(x => x.id === id);
  if (!c) return;
  // Si convoc liée à un match, prévenir
  if (c.matchId) {
    if (!confirm('Cette convocation est liée à un match.\n\nPour supprimer le match (et la convoc), va dans la section Matchs.\n\nVeux-tu quand même supprimer juste la convocation ?')) return;
    // Détacher le match de la convoc supprimée
    const m = state.matches.find(x => x.id === c.matchId);
    if (m) m.convocId = null;
  } else {
    if (!confirm('Supprimer cette convocation ?')) return;
  }
  state.convocations = state.convocations.filter(x => x.id !== id);
  persist(); render();
}

function closeConvocation(cid, instanceDate) {
  const c = state.convocations.find(x => x.id === cid);
  if (!c) return;
  // Pour récurrence : clôturer l'instance spécifique
  if (c.recurrence && instanceDate) {
    c.instanceOverrides = c.instanceOverrides || {};
    c.instanceOverrides[instanceDate] = c.instanceOverrides[instanceDate] || {};
    if (c.instanceOverrides[instanceDate].closed) return;
    if (!confirm("Cloturer cette occurrence ?\nLes presences seront comptabilisees.")) return;
    const ov = c.instanceOverrides[instanceDate];
    const responses = ov.responses || c.responses || {};
    const presentPlayers = state.players.filter(p => !responses[p.id] || responses[p.id].status === 'present');
    const targetType = c.type === 'match' ? 'attendance_match' : 'attendance_training';
    const ch = state.challenges.find(x => x.type === targetType && x.autoCount);
    if (ch) {
      ch.scores = ch.scores || {};
      presentPlayers.forEach(p => { ch.scores[p.id] = (ch.scores[p.id] || 0) + 1; });
    }
    ov.closed = true;
  } else {
    if (c.closed) return;
    if (!confirm("Cloturer cette convocation ?\nLes presences seront comptabilisees.")) return;
    const responses = c.responses || {};
    const presentPlayers = state.players.filter(p => !responses[p.id] || responses[p.id].status === 'present');
    const targetType = c.type === 'match' ? 'attendance_match' : 'attendance_training';
    const ch = state.challenges.find(x => x.type === targetType && x.autoCount);
    if (ch) {
      ch.scores = ch.scores || {};
      presentPlayers.forEach(p => { ch.scores[p.id] = (ch.scores[p.id] || 0) + 1; });
    }
    c.closed = true;
  }
  persist(); render();
}

function ensureTrainingPlan(c) {

  if (!c.trainingPlan.completedExercises) c.trainingPlan.completedExercises = {};

function openTrainingPlanEditor(convocId, dateStr) {
  const c = state.convocations.find(x => x.id === convocId);
  if (!c) {
    alert('Convocation introuvable.');
    return;
  }
  ensureTrainingPlan(c);
  state._editingTraining = { convocId, dateStr: dateStr || c.date };
  renderTrainingPlanEditor();
}

  if (!state._editingTraining) {
    console.warn('renderTrainingPlanEditor: state._editingTraining manquant');
    return;

  const { convocId, dateStr } = state._editingTraining;
  const c = state.convocations.find(x => x.id === convocId);

        </div>

      <!-- Liste des exercices avec drag-and-drop -->

          ${(() => {
            const times = computeExerciseTimes(plan, c.time);
            return plan.exercises.map((ex, idx) => trainingExerciseRow(ex, idx, plan.exercises.length, times ? times[idx].start : null, times ? times[idx].end : null)).join('');
          })()}
        </div>
      `}

      <!-- Boutons d'ajout -->
      <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px">
        <button class="btn btn-secondary btn-block" onclick="closeModal();setTimeout(()=>openPlayPicker(),80)">📚 Piocher dans la bibliothèque (${state.plays.length})</button>
        <button class="btn btn-secondary btn-block" onclick="addCustomExercise()">+ Créer un exo à la volée</button>
      </div>
    </div>
    <div class="modal-footer" style="flex-direction:column;gap:6px">
      ${plan.exercises.length > 0 ? `
        ${!plan.validated ? `
          <button class="btn btn-primary btn-block" onclick="validateTrainingPlan()">✓ Valider et envoyer aux joueuses</button>
        ` : `
          <button class="btn btn-secondary btn-block" onclick="unvalidateTrainingPlan()">↩ Repasser en brouillon</button>
        `}
      ` : ''}
      <button class="btn btn-secondary btn-block" onclick="closeModal();state._editingTraining=null;setTimeout(()=>openEventInstance('${convocId}','${dateStr||c.date}'),50)">Fermer</button>
      ${plan.exercises.length > 0 ? `<button class="btn btn-ghost btn-block" onclick="clearTrainingPlan()" style="color:var(--red);font-size:11px">🗑 Vider le plan</button>` : ''}
    </div>
  `);

  // Activer drag-and-drop sur la liste si exos
  if (plan.exercises.length > 1) {
    setTimeout(() => initTrainingDragDrop(), 100);
  }
}

  const images = (ex.images && ex.images.length > 0) ? ex.images : (linkedPlay && linkedPlay.images ? linkedPlay.images : []);

  const totalGroupPlayers = (ex.groups || []).reduce((acc, g) => acc + (g.players || []).length, 0);

        <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:rgba(255,107,0,0.08);border-bottom:1px solid var(--border-soft);font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.06em;text-transform:uppercase">
          <span style="color:var(--orange)">▶ ${startTime}${endTime ? ' → ' + endTime : ''}</span>

      <div style="display:flex;align-items:stretch;gap:0">

          <div class="training-exo-handle" style="font-size:14px;line-height:1">≡</div>
          <div class="training-exo-num" style="font-size:16px;margin-top:4px">${idx + 1}</div>
        </div>

        ${firstImg ? `
          <div style="position:relative;flex-shrink:0;width:80px;cursor:pointer" onclick="openTrainingExerciseDetail(${idx})">
            <img src="${firstImg}" style="width:100%;height:100%;object-fit:cover;display:block;background:var(--bg-2)">
            ${images.length > 1 ? `<div style="position:absolute;bottom:3px;right:3px;background:rgba(0,0,0,0.7);color:white;font-family:'JetBrains Mono';font-size:8px;padding:1px 5px;border-radius:3px">📷 ${images.length}</div>` : ''}
          </div>

        <div style="flex:1;min-width:0;padding:10px 12px;cursor:pointer" onclick="openTrainingExerciseDetail(${idx})">

          </div>

// Calcule l'heure de début/fin de chaque exo à partir de l'heure de la convoc
function computeExerciseTimes(plan, startHHMM) {
  if (!startHHMM || !/^\d{1,2}:\d{2}$/.test(startHHMM)) return null;
  const [h, m] = startHHMM.split(':').map(Number);
  let cursor = h * 60 + m;
  const times = [];
  for (const ex of (plan.exercises || [])) {
    const startH = Math.floor(cursor / 60);
    const startM = cursor % 60;
    const dur = parseInt(ex.duration) || 0;
    cursor += dur;
    const endH = Math.floor(cursor / 60);
    const endM = cursor % 60;
    times.push({
      start: String(startH).padStart(2, '0') + ':' + String(startM).padStart(2, '0'),
      end: String(endH).padStart(2, '0') + ':' + String(endM).padStart(2, '0'),
    });
  }
  return times;
}

// Drag-and-drop entre lignes
function initTrainingDragDrop() {
  const list = document.getElementById('training-exos-list');
  if (!list) return;
  let dragIdx = null;

  list.querySelectorAll('.training-exo-row').forEach(row => {
    row.addEventListener('dragstart', e => {
      dragIdx = parseInt(row.dataset.idx);
      row.style.opacity = '0.4';
      e.dataTransfer.effectAllowed = 'move';
    });
    row.addEventListener('dragend', () => {
      row.style.opacity = '';
    });
    row.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      row.style.borderTop = '2px solid var(--orange)';
    });
    row.addEventListener('dragleave', () => {
      row.style.borderTop = '';
    });
    row.addEventListener('drop', e => {
      e.preventDefault();
      row.style.borderTop = '';
      const dropIdx = parseInt(row.dataset.idx);
      if (dragIdx === null || dragIdx === dropIdx) return;
      const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
      const arr = c.trainingPlan.exercises;
      const [moved] = arr.splice(dragIdx, 1);
      arr.splice(dropIdx, 0, moved);
      persist();
      renderTrainingPlanEditor();
    });
  });
}

function moveTrainingExercise(idx, delta) {
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
  const arr = c.trainingPlan.exercises;
  const newIdx = idx + delta;
  if (newIdx < 0 || newIdx >= arr.length) return;
  const tmp = arr[idx]; arr[idx] = arr[newIdx]; arr[newIdx] = tmp;
  persist();
  renderTrainingPlanEditor();
}

function removeTrainingExercise(idx) {
  if (!state._editingTraining) return;
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
  if (!c || !c.trainingPlan) return;
  const ex = c.trainingPlan.exercises[idx];
  if (!ex) return;

  openModal(`

function doRemoveTrainingExercise(idx) {
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
  if (!c || !c.trainingPlan) return;
  c.trainingPlan.exercises.splice(idx, 1);

  if (!state._editingTraining) return;

function renderPlayPicker() {
  const filter = state._playPickerFilter;
  let filtered = [...state.plays];
  if (filter.cat !== 'all') filtered = filtered.filter(p => p.cat === filter.cat);
  if (filter.concept) filtered = filtered.filter(p => (p.concepts || []).includes(filter.concept));
  if (filter.search) {
    const q = filter.search.toLowerCase();
    filtered = filtered.filter(p =>
      p.title.toLowerCase().includes(q) ||
      (p.desc || '').toLowerCase().includes(q) ||
      (p.tags || []).some(t => t.toLowerCase().includes(q))
    );
  }

  // Tous les concepts utilisés dans les plays pour filtres rapides
  const usedConcepts = new Set();
  state.plays.forEach(p => (p.concepts || []).forEach(c => usedConcepts.add(c)));
  const conceptList = [...usedConcepts].sort();

  openModal(`
    <div class="modal-header">
      <div>
        <div class="eyebrow">${filtered.length} / ${state.plays.length} plays</div>
        <div class="modal-title">📚 Piocher un exo</div>
      </div>
      <button class="modal-close" onclick="closeModal();setTimeout(()=>renderTrainingPlanEditor(),80)">✕</button>
    </div>
    <div class="modal-body">
      <!-- Recherche -->
      <div class="fld">
        <input id="picker-search" placeholder="Rechercher dans les plays..." value="${esc(filter.search)}" oninput="state._playPickerFilter.search=this.value;renderPlayPicker()">
      </div>

      <!-- Filtre catégorie -->
      <div class="segmented" style="margin-bottom:10px;overflow-x:auto;flex-wrap:nowrap">
        <button class="segmented-btn ${filter.cat==='all'?'active':''}" onclick="state._playPickerFilter.cat='all';renderPlayPicker()">Tous</button>
        ${PLAY_CATEGORIES.map(c => `
          <button class="segmented-btn ${filter.cat===c.id?'active':''}" onclick="state._playPickerFilter.cat='${c.id}';renderPlayPicker()">${c.label}</button>
        `).join('')}
      </div>

      <!-- Filtre concept -->
      ${conceptList.length > 0 ? `
        <div class="eyebrow-muted" style="margin-bottom:6px;font-size:9px">Filtrer par concept</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px">

          ${conceptList.slice(0, 12).map(c => {
            const cat = getConceptCategory(c);
            return `<button class="concept-chip ${filter.concept===c?'selected':''}" style="--color:${CONCEPT_CAT_COLORS[cat]}" onclick="state._playPickerFilter.concept='${esc(c).replace(/'/g, "\\'")}';renderPlayPicker()">${esc(c)}</button>`;
          }).join('')}
        </div>
      ` : ''}

      <!-- Liste résultats -->
      ${filtered.length === 0 ? `
        <div class="empty" style="padding:30px">
          <div class="empty-icon">○</div>
          <div class="empty-title">Aucun résultat</div>
        </div>
      ` : `
        <div style="display:flex;flex-direction:column;gap:6px">
          ${filtered.map(p => `
            <div class="picker-row" onclick="addPlayToTrainingPlan('${p.id}')">
              ${p.images && p.images.length > 0
                ? `<img src="${p.images[0]}" style="width:48px;height:48px;border-radius:6px;object-fit:cover;flex-shrink:0">`
                : `<div style="width:48px;height:48px;border-radius:6px;background:var(--bg-3);display:flex;align-items:center;justify-content:center;font-family:'Anton';font-size:14px;color:var(--orange);flex-shrink:0">${getCatShort(p.cat)}</div>`}

                <div style="font-family:'Anton';font-size:13px;text-transform:uppercase;line-height:1.2">${esc(p.title)}</div>

  `);

}

function addPlayToTrainingPlan(playId) {
  if (!state._editingTraining) {
    console.warn('addPlayToTrainingPlan: pas de training en édition');
    return;
  }
  const p = state.plays.find(x => x.id === playId);
  if (!p) return;
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
  if (!c) return;
  ensureTrainingPlan(c);
  c.trainingPlan.exercises.push({
    id: uid(),
    source: 'play',
    playId: p.id,
    title: p.title,
    description: p.desc || '',
    duration: 10,
    groups: [{ name: 'Toute l\'équipe', players: [] }],
  });
  persist();
  // Ferme la modale picker actuelle puis ré-ouvre l'éditeur du plan après animation
  closeModal();
  setTimeout(() => renderTrainingPlanEditor(), 80);
}

async function addCustomExoImages(event) {
  const files = Array.from(event.target.files || []);
  if (!files.length) return;
  for (const file of files) {
    try {
      const compressed = await compressImage(file, 1000, 0.8);
      state._customExoBuffer.images.push(compressed);
    } catch (e) { console.error(e); }
  }
  renderCustomExerciseModal();
}

function removeCustomExoImage(idx) {
  state._customExoBuffer.images.splice(idx, 1);
  renderCustomExerciseModal();
}

async function addCustomExoFiles(event) {
  const files = Array.from(event.target.files || []);
  if (!files.length) return;
  for (const file of files) {
    // Limite : 5 Mo par fichier pour éviter d'exploser localStorage
    if (file.size > 5 * 1024 * 1024) {
      alert('Fichier trop volumineux : ' + file.name + ' (max 5 Mo)');
      continue;
    }
    try {
      const dataUrl = await new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = reject;
        r.readAsDataURL(file);
      });
      state._customExoBuffer.files.push({
        name: file.name,
        type: file.type || 'application/pdf',
        size: file.size,
        data: dataUrl
      });
    } catch (e) { console.error(e); }
  }
  renderCustomExerciseModal();
}

function removeCustomExoFile(idx) {
  state._customExoBuffer.files.splice(idx, 1);
  renderCustomExerciseModal();
}

function confirmAddCustomExercise() {
  const title = (document.getElementById('custom-ex-title')?.value || '').trim();
  if (!title) { alert('Titre requis'); return; }
  const duration = parseInt(document.getElementById('custom-ex-duration')?.value) || 10;
  const desc = (document.getElementById('custom-ex-desc')?.value || '').trim();
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
  if (!c) return;
  ensureTrainingPlan(c);
  const buf = state._customExoBuffer || { images: [], files: [] };
  c.trainingPlan.exercises.push({
    id: uid(),
    source: 'custom',
    title,
    description: desc,
    duration,
    images: buf.images.slice(),
    attachments: buf.files.slice(),
    groups: [{ name: "Toute l'équipe", players: [] }],
  });
  state._customExoBuffer = null;
  persist();
  closeModal();
  setTimeout(() => renderTrainingPlanEditor(), 50);
}

// === Détail / édition d'un exercice du plan ===
function openTrainingExerciseDetail(idx) {
  if (!state._editingTraining) return;
  state._editingExerciseIdx = idx;
  // Fermer modale plan, ouvrir modale exo
  closeModal();
  setTimeout(() => renderExerciseDetail(), 80);
}

function renderExerciseDetail() {
  if (!state._editingTraining) return;
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
  if (!c || !c.trainingPlan) return;
  const idx = state._editingExerciseIdx;
  const ex = c.trainingPlan.exercises[idx];
  if (!ex) return;
  const linkedPlay = ex.source === 'play' && ex.playId ? state.plays.find(p => p.id === ex.playId) : null;

  // Auto-nettoyage : retirer les IDs orphelins des groupes (joueuses qui n'existent plus)
  const validIds = new Set(state.players.map(p => p.id));
  let cleaned = false;
  (ex.groups || []).forEach(g => {
    const before = (g.players || []).length;
    g.players = (g.players || []).filter(pid => validIds.has(pid));
    if (g.players.length !== before) cleaned = true;
  });
  if (cleaned) persist();

  const groups = ex.groups || [{ name: 'Toute l\'équipe', players: [] }];

  // Joueuses présentes ce jour-là (basé sur les responses de la convoc)
  const { dateStr } = state._editingTraining;
  const instance = makeConvocInstance(c, dateStr || c.date);
  const responses = instance.responses || {};
  const presentPlayers = state.players.filter(p => {
    const r = responses[p.id];
    return !r || r.status !== 'absent';
  });

  // Joueuses non encore assignées à un groupe dans cet exo (parmi les présentes uniquement)

        <label class="fld-label">Description / consignes</label>

            <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px">

function updateExerciseField(field, value) {
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
  c.trainingPlan.exercises[state._editingExerciseIdx][field] = value;
  persist();
}

function addExerciseGroup() {
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
  const ex = c.trainingPlan.exercises[state._editingExerciseIdx];
  ex.groups = ex.groups || [];
  const next = ex.groups.length + 1;
  ex.groups.push({ name: 'Groupe ' + String.fromCharCode(64 + next), players: [] });
  persist();
  renderExerciseDetail();
}

function removeExerciseGroup(gIdx) {
  // Suppression directe sans confirm() (bloqué en sandbox) — l'utilisateur peut recréer si erreur
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
  if (!c || !c.trainingPlan) return;
  const ex = c.trainingPlan.exercises[state._editingExerciseIdx];
  if (!ex || !ex.groups) return;
  ex.groups.splice(gIdx, 1);
  if (ex.groups.length === 0) ex.groups.push({ name: 'Toute l\'équipe', players: [] });
  persist();
  renderExerciseDetail();
}

function updateGroupField(gIdx, field, value) {
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
  const ex = c.trainingPlan.exercises[state._editingExerciseIdx];
  ex.groups[gIdx][field] = value;
  persist();
}

function removePlayerFromGroup(gIdx, pid) {
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
  const ex = c.trainingPlan.exercises[state._editingExerciseIdx];
  ex.groups[gIdx].players = (ex.groups[gIdx].players || []).filter(x => x !== pid);
  persist();
  renderExerciseDetail();
}

function openAssignPlayerToGroup(pid) {
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
  const ex = c.trainingPlan.exercises[state._editingExerciseIdx];
  const groups = ex.groups || [];
  const p = state.players.find(x => x.id === pid);
  openModal(`
    <div class="modal-header">
      <div class="modal-title">Placer ${esc(p.name)}</div>
      <button class="modal-close" onclick="closeModal();setTimeout(()=>renderExerciseDetail(),50)">✕</button>
    </div>
    <div class="modal-body">
      <div style="display:flex;flex-direction:column;gap:6px">
        ${groups.map((g, gIdx) => `
          <button class="btn btn-secondary btn-block" style="text-align:left;padding:14px" onclick="assignPlayerToGroup('${pid}',${gIdx})">
            <div style="font-family:'Anton';font-size:13px;text-transform:uppercase">${esc(g.name)}</div>
            <div style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:2px;text-transform:uppercase">${(g.players || []).length} joueuses actuellement</div>
          </button>
        `).join('')}
      </div>
    </div>
  `);
}

function assignPlayerToGroup(pid, gIdx) {
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
  const ex = c.trainingPlan.exercises[state._editingExerciseIdx];
  ex.groups[gIdx].players = ex.groups[gIdx].players || [];
  if (!ex.groups[gIdx].players.includes(pid)) ex.groups[gIdx].players.push(pid);
  persist();
  closeModal();
  setTimeout(() => renderExerciseDetail(), 50);
}

// Place toutes les joueuses présentes non assignées dans un nouveau groupe
function groupAllRemaining() {
  const { convocId, dateStr } = state._editingTraining;
  const c = state.convocations.find(x => x.id === convocId);
  const ex = c.trainingPlan.exercises[state._editingExerciseIdx];

  // Recalculer les non assignées (parmi présentes uniquement)
  const instance = makeConvocInstance(c, dateStr || c.date);
  const responses = instance.responses || {};
  const presentIds = state.players
    .filter(p => { const r = responses[p.id]; return !r || r.status !== 'absent'; })
    .map(p => p.id);
  const assignedIds = new Set();
  (ex.groups || []).forEach(g => (g.players || []).forEach(pid => assignedIds.add(pid)));
  const remainingIds = presentIds.filter(pid => !assignedIds.has(pid));

  if (remainingIds.length === 0) {
    alert('Toutes les présentes sont déjà placées.');
    return;
  }

  // Nom intelligent : si un groupe existe déjà, l'appeler "Groupe B" sinon "Toute l'équipe"
  const existingCount = (ex.groups || []).filter(g => (g.players || []).length > 0).length;
  let name;
  if (existingCount === 0) {
    name = "Toute l'équipe";
  } else if (existingCount === 1) {
    name = "Reste de l'effectif";
  } else {
    name = 'Groupe ' + String.fromCharCode(65 + existingCount); // A, B, C...
  }

  ex.groups = ex.groups || [];
  ex.groups.push({ name, players: remainingIds });
  persist();
  renderExerciseDetail();
}

// === Édition images/PDF dans le détail exo (après création) ===
async function addExerciseImagesInDetail(event) {
  const files = Array.from(event.target.files || []);
  if (!files.length) return;
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
  const ex = c.trainingPlan.exercises[state._editingExerciseIdx];
  if (!ex) return;
  ex.images = ex.images || [];
  for (const file of files) {
    try {
      const compressed = await compressImage(file, 1000, 0.8);
      ex.images.push(compressed);
    } catch (e) { console.error(e); }
  }
  persist();
  renderExerciseDetail();
}

function removeExerciseImageInDetail(idx) {
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
  const ex = c.trainingPlan.exercises[state._editingExerciseIdx];
  if (!ex || !ex.images) return;
  ex.images.splice(idx, 1);
  persist();
  renderExerciseDetail();
}

async function addExerciseFilesInDetail(event) {
  const files = Array.from(event.target.files || []);
  if (!files.length) return;
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
  const ex = c.trainingPlan.exercises[state._editingExerciseIdx];
  if (!ex) return;
  ex.attachments = ex.attachments || [];
  for (const file of files) {
    if (file.size > 5 * 1024 * 1024) {
      alert('Fichier trop volumineux : ' + file.name + ' (max 5 Mo)');
      continue;
    }
    try {
      const dataUrl = await new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = reject;
        r.readAsDataURL(file);
      });
      ex.attachments.push({
        name: file.name,
        type: file.type || 'application/pdf',
        size: file.size,
        data: dataUrl
      });
    } catch (e) { console.error(e); }
  }
  persist();
  renderExerciseDetail();
}

function removeExerciseFileInDetail(idx) {
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
  const ex = c.trainingPlan.exercises[state._editingExerciseIdx];
  if (!ex || !ex.attachments) return;
  ex.attachments.splice(idx, 1);
  persist();
  renderExerciseDetail();
}

function applyLineupToGroups(lineupId) {
  const l = state.lineups.find(x => x.id === lineupId);
  if (!l) return;
  const { convocId, dateStr } = state._editingTraining;
  const c = state.convocations.find(x => x.id === convocId);
  const ex = c.trainingPlan.exercises[state._editingExerciseIdx];

  // Récupérer toutes les joueuses de la compo (titulaires + banc)
  const rawLineupIds = [
    ...Object.entries(l.starters || {}).filter(([_, pos]) => pos).map(([pid]) => pid),
    ...Object.entries(l.bench || {}).filter(([_, pos]) => pos).map(([pid]) => pid),
  ];

  // CRITIQUE : ne garder QUE les IDs qui existent réellement dans l'effectif actuel
  // (évite les IDs orphelins si la compo a été créée avec d'anciens joueurs)
  const validPlayerIds = new Set(state.players.map(p => p.id));
  const lineupPlayerIds = rawLineupIds.filter(pid => validPlayerIds.has(pid));

  if (rawLineupIds.length > lineupPlayerIds.length) {
    console.log('[importCompo] IDs orphelins filtrés:', rawLineupIds.length - lineupPlayerIds.length);
  }

  if (lineupPlayerIds.length === 0) {
    alert('Cette compo ne contient aucune joueuse de l\'effectif actuel.\n\nLes IDs des joueuses ne correspondent pas. Tu peux recréer la compo depuis l\'onglet Équipe → Compos.');
    return;
  }

  // Filtrer celles qui sont PRÉSENTES à l'événement (pas absentes)
  const instance = makeConvocInstance(c, dateStr || c.date);
  const responses = instance.responses || {};
  const presentLineupIds = lineupPlayerIds.filter(pid => {
    const r = responses[pid];
    return !r || r.status !== 'absent';
  });

  if (presentLineupIds.length === 0) {
    alert('Aucune joueuse de cette compo n\'est présente aujourd\'hui.');
    return;
  }

  // Demander confirmation si groupes déjà remplis
  const totalCurrent = (ex.groups || []).reduce((acc, g) => acc + (g.players || []).length, 0);
  if (totalCurrent > 0) {
    if (!confirm('Remplacer les groupes actuels par les ' + presentLineupIds.length + ' joueuses présentes de la compo "' + l.name + '" ?')) return;
  }

  // Tout dans un seul groupe nommé d'après la compo (sans doublons par sécurité)
  ex.groups = [{ name: l.name, players: [...new Set(presentLineupIds)] }];

  persist();
  closeModal();
  setTimeout(() => renderExerciseDetail(), 50);
}

                      ${linkedPlay.concepts.map(c => {

// Récupère la "feuille d'appel" stockée dans l'instance/convoc
// Format : { arrivals: { pid: { at: timestamp, lateMin: number } } }
function getCallSheet(c, dateStr) {
  if (c.recurrence && dateStr) {
    c.instanceOverrides = c.instanceOverrides || {};
    c.instanceOverrides[dateStr] = c.instanceOverrides[dateStr] || {};
    c.instanceOverrides[dateStr].callSheet = c.instanceOverrides[dateStr].callSheet || { arrivals: {} };
    return c.instanceOverrides[dateStr].callSheet;
  }
  c.callSheet = c.callSheet || { arrivals: {} };
  return c.callSheet;
}

// Calcule le retard en minutes par rapport à l'heure prévue
function computeLateMinutes(scheduledTime, dateStr, validatedAt) {
  if (!scheduledTime || !dateStr) return 0;
  const [hh, mm] = scheduledTime.split(':').map(n => parseInt(n));
  if (isNaN(hh) || isNaN(mm)) return 0;
  const scheduled = new Date(dateStr + 'T' + scheduledTime.padStart(5, '0') + ':00');
  const validated = new Date(validatedAt);
  const diffMs = validated - scheduled;
  return Math.max(0, Math.round(diffMs / 60000));
}

function openCallSheet(parentId, dateStr) {
  const c = state.convocations.find(x => x.id === parentId);
  if (!c) return;
  const instance = makeConvocInstance(c, dateStr);
  const responses = instance.responses || {};
  const present = state.players.filter(p => !responses[p.id] || responses[p.id].status === 'present');
  const absent = state.players.filter(p => responses[p.id] && responses[p.id].status === 'absent');
  const sheet = getCallSheet(c, c.recurrence ? dateStr : null);
  const arrivals = sheet.arrivals || {};

  // Trier : pas encore validée en premier, puis validées à l'heure, puis en retard
  const sorted = [...present].sort((a, b) => {
    const ra = arrivals[a.id];
    const rb = arrivals[b.id];
    if (!ra && !rb) return 0;
    if (!ra) return -1;
    if (!rb) return 1;
    return ra.at - rb.at;
  });

  const pendingCount = present.filter(p => !arrivals[p.id]).length;
  const onTimeCount = present.filter(p => arrivals[p.id] && arrivals[p.id].lateMin === 0).length;
  const lateCount = present.filter(p => arrivals[p.id] && arrivals[p.id].lateMin > 0).length;
  const totalLateMin = present.reduce((acc, p) => acc + (arrivals[p.id] ? arrivals[p.id].lateMin : 0), 0);

  openModal(`
    <div class="modal-header">
      <div>
        <div class="eyebrow">${formatDate(dateStr)} · ${esc(instance.time || '?')}</div>
        <div class="modal-title">📋 Appel · ${esc(instance.title)}</div>

      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div style="padding:10px 12px;background:var(--bg-3);border-left:3px solid var(--orange);border-radius:6px;margin-bottom:14px;font-size:11px;color:var(--ink-2);line-height:1.5">
        Tap <strong>✓ Présente</strong> quand chaque joueuse est <strong>prête</strong> (équipée, sur le terrain). Le retard est calculé automatiquement par rapport à l'heure prévue (${esc(instance.time || '?')}).
      </div>

      <!-- Compteurs -->
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px">
        <div class="stat-tile" style="padding:8px;text-align:center">
          <div style="font-family:'Anton';font-size:22px;color:var(--ink-3)">${pendingCount}</div>
          <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase">Attente</div>
        </div>
        <div class="stat-tile" style="padding:8px;text-align:center">
          <div style="font-family:'Anton';font-size:22px;color:var(--green)">${onTimeCount}</div>
          <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase">À l'heure</div>
        </div>
        <div class="stat-tile" style="padding:8px;text-align:center">
          <div style="font-family:'Anton';font-size:22px;color:var(--red)">${lateCount}</div>
          <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase">En retard</div>
        </div>
        <div class="stat-tile" style="padding:8px;text-align:center">
          <div style="font-family:'Anton';font-size:22px;color:${totalLateMin>0?'var(--orange)':'var(--ink-3)'}">${totalLateMin}</div>
          <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase">Min total</div>
        </div>
      </div>

      <!-- Liste joueuses présentes -->
      <div class="eyebrow-muted mb-2">Joueuses convoquées (${present.length})</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${sorted.map(p => {
          const r = arrivals[p.id];
          const validated = !!r;
          const onTime = validated && r.lateMin === 0;
          const lateMin = validated ? r.lateMin : 0;
          const arrivalTime = validated ? new Date(r.at).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}) : '';
          return `
            <div class="call-row ${validated ? (onTime ? 'on-time' : 'late') : 'pending'}">
              <div style="flex-shrink:0">
                ${p.photo ? `<img src="${p.photo}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid ${validated ? (onTime ? 'var(--green)' : 'var(--red)') : 'var(--border)'}">` : `<div style="width:36px;height:36px;border-radius:50%;background:var(--bg-3);display:flex;align-items:center;justify-content:center;font-family:'Anton';font-size:14px;color:var(--orange);border:2px solid ${validated ? (onTime ? 'var(--green)' : 'var(--red)') : 'var(--border)'}">${esc(p.name.charAt(0).toUpperCase())}</div>`}
              </div>
              <div style="flex:1;min-width:0">
                <div style="font-family:'Anton';font-size:14px;text-transform:uppercase">#${p.num} ${esc(p.name)}</div>
                ${validated ? `
                  <div style="font-size:10px;font-family:'JetBrains Mono';margin-top:2px;text-transform:uppercase;letter-spacing:0.04em">
                    ${onTime ? `<span style="color:var(--green)">✓ Arrivée ${arrivalTime} · À l'heure</span>` : `<span style="color:var(--red)">⚠ Arrivée ${arrivalTime} · +${lateMin} min retard</span>`}

            return `<span style="padding:6px 10px;background:var(--bg-2);border:1px solid var(--border);border-radius:16px;font-size:11px;color:var(--ink-3);font-family:'JetBrains Mono'">#${p.num} ${esc(p.name)} · ${esc(r.reason || '?')}</span>`;
          }).join('')}
        </div>
      ` : ''}

      <div style="margin-top:18px;padding:10px 12px;background:var(--bg-1);border-radius:6px;font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';line-height:1.5">
        💡 Quand l'appel est terminé, ferme la fenêtre. Les retards sont ajoutés au challenge <strong>Ponctualité</strong> automatiquement à chaque validation.
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary btn-block" onclick="closeModal()">Fermer l'appel</button>
    </div>
  `);
}

// Valider l'arrivée d'une joueuse (le coach tap quand elle est prête)
function validateArrival(parentId, dateStr, pid) {
  const c = state.convocations.find(x => x.id === parentId);
  if (!c) return;
  const instance = makeConvocInstance(c, dateStr);
  const sheet = getCallSheet(c, c.recurrence ? dateStr : null);
  sheet.arrivals = sheet.arrivals || {};

  const now = Date.now();
  const lateMin = computeLateMinutes(instance.time, dateStr, now);

  // Récupérer le retard précédent s'il existe (cas de re-validation)
  const oldEntry = sheet.arrivals[pid];
  const oldLate = oldEntry ? oldEntry.lateMin : 0;

  sheet.arrivals[pid] = { at: now, lateMin };

  // Mettre à jour le challenge ponctualité (delta)
  const ch = state.challenges.find(x => x.type === 'punctuality' && x.autoCount);
  if (ch) {
    ch.scores = ch.scores || {};
    ch.scores[pid] = Math.max(0, (ch.scores[pid] || 0) - oldLate + lateMin);
  }

  persist();
  closeModal();
  setTimeout(() => openCallSheet(parentId, dateStr), 50);
}

// Annuler une validation (cas d'erreur)
function undoArrival(parentId, dateStr, pid) {
  const c = state.convocations.find(x => x.id === parentId);
  if (!c) return;
  const sheet = getCallSheet(c, c.recurrence ? dateStr : null);
  const entry = sheet.arrivals && sheet.arrivals[pid];
  if (!entry) return;

  // Retirer du challenge
  const ch = state.challenges.find(x => x.type === 'punctuality' && x.autoCount);
  if (ch && ch.scores) {
    ch.scores[pid] = Math.max(0, (ch.scores[pid] || 0) - entry.lateMin);
  }

  delete sheet.arrivals[pid];
  persist();
  closeModal();
  setTimeout(() => openCallSheet(parentId, dateStr), 50);
}

function markAbsentDuringCall(parentId, dateStr, pid) {

  openModal(`

      </div>

      <button class="btn btn-secondary btn-block" onclick="closeModal();setTimeout(()=>openCallSheet('${parentId}','${dateStr}'),50)">Annuler</button>

    </div>

function confirmAbsentDuringCall(parentId, dateStr, pid) {
  const c = state.convocations.find(x => x.id === parentId);
  if (!c) return;
  const reason = document.getElementById('ab-call-reason').value;
  // Stocker l'absence dans les responses de l'instance
  if (c.recurrence) {
    c.instanceOverrides = c.instanceOverrides || {};
    c.instanceOverrides[dateStr] = c.instanceOverrides[dateStr] || {};
    c.instanceOverrides[dateStr].responses = c.instanceOverrides[dateStr].responses || {};
    c.instanceOverrides[dateStr].responses[pid] = { status: 'absent', reason };
  } else {
    c.responses = c.responses || {};
    c.responses[pid] = { status: 'absent', reason };
  }
  persist();
  closeModal();
  setTimeout(() => openCallSheet(parentId, dateStr), 50);
}

async function addTempInstanceAttachments(e) {
  const files = Array.from(e.target.files);
  for (const file of files) {
    try {
      const a = await makeAttachment(file);
      state._tempInstanceAttachments.push(a);
    } catch(err) { console.error(err); }
  }
  // Refresh
  const modal = document.querySelector('.modal-body');
  if (modal) {
    const grids = modal.querySelectorAll('.attachments-grid');
    const lastGrid = grids[grids.length - 1];
    const html = renderAttachments(state._tempInstanceAttachments, true, 'removeTempInstanceAttachment');
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    if (lastGrid && tmp.firstElementChild) lastGrid.replaceWith(tmp.firstElementChild);
    else if (tmp.firstElementChild) {
      const uploader = modal.querySelector('label[for="iov-files"]');
      if (uploader) uploader.parentNode.insertBefore(tmp.firstElementChild, uploader);
    }
  }
}
function removeTempInstanceAttachment(idx) {
  state._tempInstanceAttachments.splice(idx, 1);
  // Refresh
  const modal = document.querySelector('.modal-body');
  if (modal) {
    const grids = modal.querySelectorAll('.attachments-grid');
    const lastGrid = grids[grids.length - 1];
    const html = renderAttachments(state._tempInstanceAttachments, true, 'removeTempInstanceAttachment');
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    if (lastGrid && tmp.firstElementChild) lastGrid.replaceWith(tmp.firstElementChild);
  }
}

function saveInstanceOverride(parentId, dateStr) {
  const c = state.convocations.find(x => x.id === parentId);
  if (!c) return;
  c.instanceOverrides = c.instanceOverrides || {};
  const existing = c.instanceOverrides[dateStr] || {};
  const ov = { ...existing };
  const title = document.getElementById('iov-title').value.trim();
  const time = document.getElementById('iov-time').value;
  const loc = document.getElementById('iov-loc').value.trim();
  const note = document.getElementById('iov-note').value.trim();

  // Stocker seulement les diffs
  if (title) ov.title = title; else delete ov.title;
  if (time && time !== c.time) ov.time = time; else delete ov.time;
  if (loc && loc !== (c.location || '')) ov.location = loc; else delete ov.location;
  if (note !== (c.note || '')) ov.note = note; else delete ov.note;
  if (state._tempInstanceAttachments && state._tempInstanceAttachments.length > 0) {
    ov.attachments = state._tempInstanceAttachments;
  } else {
    delete ov.attachments;
  }

  if (Object.keys(ov).length === 0) {
    delete c.instanceOverrides[dateStr];
  } else {
    c.instanceOverrides[dateStr] = ov;
  }
  state._tempInstanceAttachments = null;
  persist();
  closeModal();
  openEventInstance(parentId, dateStr);
}

function resetInstanceOverride(parentId, dateStr) {
  if (!confirm("Retirer toutes les modifs de ce jour et revenir aux paramètres de la série ?")) return;
  const c = state.convocations.find(x => x.id === parentId);
  if (!c) return;
  if (c.instanceOverrides) delete c.instanceOverrides[dateStr];
  state._tempInstanceAttachments = null;
  persist();
  closeModal();
  openEventInstance(parentId, dateStr);
}

function cancelEventInstance(parentId, dateStr) {
  if (!confirm("Annuler cette occurrence ?\nLes autres dates de la récurrence ne sont pas affectées.")) return;
  cancelInstance(parentId, dateStr);
  closeModal(); render();
}
function uncancelEventInstance(parentId, dateStr) {
  restoreInstance(parentId, dateStr);
  closeModal(); openEventInstance(parentId, dateStr);
}

// === Côté JOUEUSE : signaler/modifier absence + revenir présente ===

function playerDeclareAbsence(parentId, dateStr) {
  if (state.auth.role !== 'player') return;
  const c = state.convocations.find(x => x.id === parentId);
  if (!c) return;
  const playerId = state.auth.playerId;
  openModal(`
    <div class="modal-header">
      <div>
        <div class="eyebrow">${esc(c.title)}</div>
        <div class="modal-title">Signaler mon absence</div>
      </div>
      <button class="modal-close" onclick="closeModal();setTimeout(()=>openEventInstance('${parentId}','${dateStr}'),50)">✕</button>
    </div>
    <div class="modal-body">
      <div style="padding:10px 12px;background:var(--bg-3);border-left:3px solid var(--orange);border-radius:6px;margin-bottom:14px;font-size:11px;color:var(--ink-2);line-height:1.5">
        ${formatDate(dateStr, 'long')}${c.time ? ' · ' + c.time : ''}<br>Préviens ton coach avec une raison et un petit mot si tu veux.
      </div>
      <div class="fld">
        <label class="fld-label">Raison</label>
        <select id="ab-reason">${ABSENCE_REASONS.map(r => `<option value="${r}">${r}</option>`).join('')}</select>
      </div>
      <div class="fld">
        <label class="fld-label">Petit mot (optionnel)</label>
        <textarea id="ab-msg" placeholder="Ex : désolée, je rattraperai au prochain entraînement"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary btn-block" onclick="closeModal();setTimeout(()=>openEventInstance('${parentId}','${dateStr}'),50)">Annuler</button>
      <button class="btn btn-primary btn-block" onclick="saveInstanceAbsence('${parentId}','${dateStr}','${playerId}')">Confirmer mon absence</button>
    </div>
  `);
}

function playerEditAbsence(parentId, dateStr) {
  if (state.auth.role !== 'player') return;
  const c = state.convocations.find(x => x.id === parentId);
  if (!c) return;
  const playerId = state.auth.playerId;
  // Récupérer la réponse actuelle pour pré-remplir
  let myResp = null;
  if (c.recurrence && c.instanceOverrides && c.instanceOverrides[dateStr] && c.instanceOverrides[dateStr].responses) {
    myResp = c.instanceOverrides[dateStr].responses[playerId];
  } else if (c.responses) {
    myResp = c.responses[playerId];
  }
  const currentReason = myResp ? myResp.reason : '';
  const currentMsg = myResp ? (myResp.message || '') : '';

  openModal(`
    <div class="modal-header">
      <div>
        <div class="eyebrow">${esc(c.title)}</div>
        <div class="modal-title">Modifier mon absence</div>
      </div>
      <button class="modal-close" onclick="closeModal();setTimeout(()=>openEventInstance('${parentId}','${dateStr}'),50)">✕</button>
    </div>
    <div class="modal-body">
      <div style="padding:10px 12px;background:var(--bg-3);border-left:3px solid var(--orange);border-radius:6px;margin-bottom:14px;font-size:11px;color:var(--ink-2);line-height:1.5">
        ${formatDate(dateStr, 'long')}${c.time ? ' · ' + c.time : ''}
      </div>
      <div class="fld">
        <label class="fld-label">Raison</label>
        <select id="ab-reason">${ABSENCE_REASONS.map(r => `<option value="${r}" ${r===currentReason?'selected':''}>${r}</option>`).join('')}</select>
      </div>
      <div class="fld">
        <label class="fld-label">Petit mot (optionnel)</label>
        <textarea id="ab-msg" placeholder="Ex : désolée, je rattraperai au prochain entraînement">${esc(currentMsg)}</textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary btn-block" onclick="closeModal();setTimeout(()=>openEventInstance('${parentId}','${dateStr}'),50)">Annuler</button>
      <button class="btn btn-primary btn-block" onclick="saveInstanceAbsence('${parentId}','${dateStr}','${playerId}')">Enregistrer</button>
    </div>
  `);
}

function playerRestorePresence(parentId, dateStr) {
  if (state.auth.role !== 'player') return;
  const playerId = state.auth.playerId;
  restoreInstancePresent(parentId, dateStr, playerId);
}

function declareInstanceAbsence(parentId, dateStr, playerId) {
  const c = state.convocations.find(x => x.id === parentId);
  if (!c) return;
  const player = state.players.find(p => p.id === playerId);
  if (!player) return;
  openModal(`
    <div class="modal-header">
      <div class="modal-title">Absence · ${esc(player.name)}</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div style="font-size:12px;color:var(--ink-3);margin-bottom:14px;font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.05em">${esc(c.title)} · ${formatDate(dateStr, 'long')}</div>
      <div class="fld">
        <label class="fld-label">Raison</label>
        <select id="ab-reason">${ABSENCE_REASONS.map(r => `<option value="${r}">${r}</option>`).join('')}</select>
      </div>
      <div class="fld">
        <label class="fld-label">Mot pour l'équipe</label>
        <textarea id="ab-msg" placeholder="Optionnel"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="saveInstanceAbsence('${parentId}','${dateStr}','${playerId}')">Confirmer</button>
    </div>
  `);
}
function saveInstanceAbsence(parentId, dateStr, playerId) {
  const c = state.convocations.find(x => x.id === parentId);
  if (!c) return;
  if (c.recurrence) {
    c.instanceOverrides = c.instanceOverrides || {};
    c.instanceOverrides[dateStr] = c.instanceOverrides[dateStr] || { responses: {...(c.responses||{})} };
    c.instanceOverrides[dateStr].responses = c.instanceOverrides[dateStr].responses || {};
    c.instanceOverrides[dateStr].responses[playerId] = {
      status: 'absent',
      reason: document.getElementById('ab-reason').value,
      message: document.getElementById('ab-msg').value.trim(),
    };
  } else {
    c.responses = c.responses || {};
    c.responses[playerId] = {
      status: 'absent',
      reason: document.getElementById('ab-reason').value,
      message: document.getElementById('ab-msg').value.trim(),
    };
  }
  persist(); closeModal(); openEventInstance(parentId, dateStr);
}
function restoreInstancePresent(parentId, dateStr, playerId) {
  const c = state.convocations.find(x => x.id === parentId);
  if (!c) return;
  if (c.recurrence && c.instanceOverrides && c.instanceOverrides[dateStr] && c.instanceOverrides[dateStr].responses) {
    delete c.instanceOverrides[dateStr].responses[playerId];
  } else if (c.responses) {
    delete c.responses[playerId];
  }
  persist(); openEventInstance(parentId, dateStr);
}

// Challenges
function renderChallenges() {
  const isCoach = state.auth.role === 'coach';
  const todayStr = new Date().toISOString().slice(0,10);
  // Grouper par scope
  const season = state.challenges.filter(c => c.scope === 'season');
  const individual = state.challenges.filter(c => c.scope === 'individual' && (!c.endDate || c.endDate >= todayStr));
  const collective = state.challenges.filter(c => c.scope === 'collective' && (!c.endDate || c.endDate >= todayStr));
  const archived = state.challenges.filter(c => c.scope !== 'season' && c.endDate && c.endDate < todayStr);

  // Incitation : si coach et aucun challenge actif (individuel/collectif), on suggère
  const hasActive = individual.length > 0 || collective.length > 0;
  const ideas = [
    { scope: 'collective', icon: '🤝', title: '100 paniers à 3pts', desc: 'Équipe entière jusqu\'à atteindre 100 tirs réussis', metric: 'paniers', target: 100 },
    { scope: 'collective', icon: '💪', title: '500 pompes en équipe', desc: 'Total cumulé sur la semaine', metric: 'pompes', target: 500 },
    { scope: 'collective', icon: '🏃', title: '50 km collectifs', desc: 'Footings cumulés à reporter', metric: 'km', target: 50 },
    { scope: 'individual', icon: '🎯', title: 'Free Throw Streak', desc: 'Plus longue série de LF consécutifs', metric: 'LF' },
    { scope: 'individual', icon: '🏀', title: 'Tirs à 3pts du mois', desc: 'Nombre de 3pts marqués', metric: '3pts' },
  ];

  return `
    <div style="padding:0 18px 12px;display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:12px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.05em">${state.challenges.length} défi${state.challenges.length>1?'s':''}</div>
      ${isCoach ? `<button class="btn btn-primary" onclick="editChallenge()">+ Challenge</button>` : ''}
    </div>

    ${isCoach && !hasActive ? `
      <div style="margin:0 18px 18px;padding:14px;background:linear-gradient(135deg,rgba(255,107,0,0.10),var(--surface));border:1.5px dashed var(--orange);border-radius:var(--radius)">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
          <span style="font-size:24px">💡</span>
          <div style="flex:1">
            <div style="font-family:'Anton';font-size:14px;text-transform:uppercase">Aucun challenge actif</div>
            <div style="font-size:11px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:2px">Lance-en un pour motiver le groupe !</div>
          </div>
        </div>
        <div style="font-size:11px;color:var(--ink-2);line-height:1.5;margin-bottom:10px">
          Idées rapides à lancer en 1 tap :
        </div>
        <div style="display:flex;flex-direction:column;gap:6px">
          ${ideas.map(idea => `
            <button class="btn btn-secondary" style="text-align:left;padding:10px 12px;display:flex;align-items:center;gap:10px;width:100%" onclick='createChallengeFromIdea(${JSON.stringify(idea).replace(/"/g, "&quot;")})'>
              <span style="font-size:22px">${idea.icon}</span>
              <div style="flex:1;min-width:0">
                <div style="font-family:'Anton';font-size:12px;text-transform:uppercase">${esc(idea.title)}</div>
                <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:2px;text-transform:uppercase">${idea.scope === 'collective' ? '🤝 Collectif · cible ' + idea.target : '🎯 Individuel'}</div>
              </div>
              <span style="color:var(--orange);font-size:18px;font-family:'Anton'">+</span>
            </button>
          `).join('')}
        </div>
        <button class="btn btn-ghost btn-block" onclick="editChallenge()" style="margin-top:8px;font-size:11px">… ou créer un challenge personnalisé →</button>
      </div>
    ` : ''}

    ${collective.length > 0 ? `
      <div class="section-header" style="margin-top:8px">
        <div><div class="eyebrow" style="color:var(--orange)">🤝 Collectif</div><h2 class="display-md mt-2">Objectifs équipe</h2></div>
      </div>
      ${collective.map(c => challengeCard(c, isCoach)).join('')}
    ` : ''}

    ${individual.length > 0 ? `
      <div class="section-header" style="margin-top:8px">
        <div><div class="eyebrow" style="color:var(--orange)">🎯 Individuel</div><h2 class="display-md mt-2">Performances perso</h2></div>
      </div>
      ${individual.map(c => challengeCard(c, isCoach)).join('')}
    ` : ''}

    ${season.length > 0 ? `
      <div class="section-header" style="margin-top:8px">
        <div><div class="eyebrow" style="color:var(--orange)">📅 Saison</div><h2 class="display-md mt-2">Compteurs auto</h2></div>
      </div>
      ${season.map(c => challengeCard(c, isCoach)).join('')}
    ` : ''}

    ${archived.length > 0 ? `
      <div class="section-header" style="margin-top:8px">
        <div><div class="eyebrow" style="color:var(--ink-3)">Terminés</div><h2 class="display-md mt-2" style="color:var(--ink-3)">Archives (${archived.length})</h2></div>
      </div>
      <div style="padding:0 18px 18px;display:flex;flex-direction:column;gap:6px">
        ${archived.map(c => `
          <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg-2);border:1px solid var(--border-soft);border-radius:8px;opacity:0.7">
            <div style="flex:1">
              <div style="font-family:'Anton';font-size:13px;text-transform:uppercase">${esc(c.title)}</div>
              <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:2px;text-transform:uppercase">Fin ${formatDate(c.endDate)} · ${c.scope === 'collective' ? '🤝 Collectif' : '🎯 Individuel'}</div>
