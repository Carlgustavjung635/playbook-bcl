          <div class="empty" style="padding:24px"><div class="empty-icon">○</div><div class="empty-title">Aucun match</div></div>
        ` : recentMatches.map(m => matchRow(m)).join('')}
      </div>

      ${(() => {
        try {
          const reviews = state.teamReviews || [];
          if (reviews.length === 0) return '';
          // Dernière par joueuse
          const latestByPlayer = {};
          reviews.forEach(r => {
            if (!latestByPlayer[r.pid] || (r.updatedAt || 0) > (latestByPlayer[r.pid].updatedAt || 0)) latestByPlayer[r.pid] = r;
          });
          const latest = Object.values(latestByPlayer);
          // Moyennes (null-safe : un champ sans valeur → avg = null pour ce champ)
          const avg = {};
          TEAM_REVIEW_FIELDS.forEach(f => {
            const vals = latest.map(r => r[f.key]).filter(v => v != null && !isNaN(v));
            avg[f.key] = vals.length > 0 ? (vals.reduce((a,b)=>a+b,0)/vals.length) : null;
          });
          // Overall : moyenne des moyennes non-null uniquement (évite NaN/crash)
          const filledAvgs = Object.values(avg).filter(v => v != null);
          const overallAvg = filledAvgs.length > 0 ? filledAvgs.reduce((a,b)=>a+b,0) / filledAvgs.length : null;
          const color = overallAvg == null ? 'var(--ink-3)' : overallAvg >= 4 ? 'var(--green)' : overallAvg <= 2.5 ? 'var(--red)' : 'var(--orange)';
          return `
            <div class="section-header">
              <div>
                <div class="eyebrow">${latest.length}/${currentSeasonPlayers().length} joueuses</div>
                <h2 class="display-md mt-2">État d'esprit équipe</h2>
              </div>
              <button class="section-action" onclick="openTeamReviewsDashboard()">Détail →</button>
            </div>
            <div style="padding:0 18px;margin-bottom:18px">
              <div onclick="openTeamReviewsDashboard()" style="padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
                  <div style="font-family:'JetBrains Mono';font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.06em">Moyenne équipe</div>
                  <div style="font-family:'Anton';font-size:28px;color:${color};line-height:1">${overallAvg == null ? '—' : overallAvg.toFixed(1)}<span style="color:var(--ink-4);font-size:14px">/5</span></div>
                </div>
                <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">
                  ${TEAM_REVIEW_FIELDS.map(f => {
                    const v = avg[f.key];
                    const c = v == null ? 'var(--ink-4)' : v >= 4 ? 'var(--green)' : v <= 2 ? 'var(--red)' : 'var(--orange)';
                    return `
                      <div style="text-align:center">
                        <div style="font-size:16px;margin-bottom:2px">${f.icon}</div>
                        <div style="font-family:'Anton';font-size:18px;color:${c};line-height:1">${v == null ? '—' : v.toFixed(1)}</div>
                        <div style="font-size:8px;color:var(--ink-4);font-family:'JetBrains Mono';text-transform:uppercase;margin-top:2px">${f.label.slice(0,8)}</div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            </div>
          `;
        } catch (e) {
          console.warn('[home/ressenti] render error:', e.message);
          return '';
        }
      })()}

      ${(() => {
        const o = state.offseason;
        const active = isOffseasonActive();
        if (!o) {
          return `
            <div style="padding:0 18px;margin-bottom:18px">
              <div onclick="openOffseasonConfig()" style="padding:14px;background:var(--bg-2);border:1.5px dashed var(--ink-3);border-radius:var(--radius);cursor:pointer;display:flex;align-items:center;gap:12px">
                <span style="font-size:32px">☀</span>
                <div style="flex:1">
                  <div style="font-family:'Anton';font-size:14px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-2)">Configurer la prépa estivale</div>
                  <div style="font-size:11px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:2px;text-transform:uppercase;letter-spacing:0.04em">Programme hebdo de prépa physique pour les joueuses</div>
                </div>
                <span style="color:var(--ink-3);font-size:18px;font-family:'Anton'">+</span>
              </div>
            </div>
          `;
        }
        // PHASE 4 : mode journalier → carte dédiée (engagement du jour), car
        // o.exercises est vide en daily et le calcul hebdo donnerait 0%.
        if (o.mode === 'daily') {
          const today = new Date().toISOString().slice(0, 10);
          const sched = o.dailySchedule || {};
          const todayItems = sched[today] || [];
          const _pool = currentSeasonPlayers();
          const logs2 = state.offseasonLogs || {};
          const todayExpected = _pool.length * todayItems.length;
          const todayDone = _pool.reduce((acc, p) => {
            const pLog = (logs2[p.id] || {})[today] || {};
            return acc + todayItems.filter(it => pLog[it.id] && pLog[it.id].done).length;
          }, 0);
          const dPct = todayExpected > 0 ? Math.round((todayDone / todayExpected) * 100) : 0;
          const dColor = dPct >= 70 ? 'var(--green)' : dPct >= 40 ? 'var(--orange)' : 'var(--red)';
          const plannedDates = Object.keys(sched).length;
          return `
            <div class="section-header">
              <div>
                <div class="eyebrow" style="color:${active?'var(--orange)':'var(--ink-3)'}">${active ? '🗓 Journalier · actif' : '○ Journalier · inactif'}</div>
                <h2 class="display-md mt-2">${esc(o.title)}</h2>
              </div>
              <button class="section-action" onclick="openOffseasonDashboard()">Suivi →</button>
            </div>
            <div style="padding:0 18px;margin-bottom:18px">
              <div onclick="openOffseasonDashboard()" style="padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
                  <div style="font-family:'JetBrains Mono';font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.06em">${todayItems.length ? "Engagement équipe · aujourd'hui" : "Aucun exo prévu aujourd'hui"}</div>
                  ${todayItems.length ? `<div style="font-family:'Anton';font-size:28px;color:${dColor};line-height:1">${dPct}%</div>` : ''}
                </div>
                ${todayItems.length ? `<div style="height:6px;background:var(--bg-1);border-radius:3px;overflow:hidden;margin-bottom:8px"><div style="height:100%;width:${dPct}%;background:${dColor}"></div></div>` : ''}
                <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase">
                  <span>${plannedDates} date${plannedDates>1?'s':''} planifiée${plannedDates>1?'s':''}</span>
                  <span>${todayItems.length} exo${todayItems.length>1?'s':''} aujourd'hui</span>
                </div>
              </div>
            </div>
          `;
        }
        // Calcul engagement équipe semaine en cours
        // SAISON : la prépa estivale concerne l'effectif de la saison courante,
        // pas tout l'historique du roster.
        const weekKey = getWeekKey();
        const logs = state.offseasonLogs || {};
        const _seasonPool = currentSeasonPlayers();
        const totalDone = _seasonPool.reduce((acc, p) => {
          const pLog = (logs[p.id] || {})[weekKey] || {};
          return acc + o.exercises.filter(ex => pLog[ex.id] && pLog[ex.id].done).length;
        }, 0);
        const totalExpected = _seasonPool.length * o.exercises.length;
        const teamPct = totalExpected > 0 ? Math.round((totalDone / totalExpected) * 100) : 0;
        const color = teamPct >= 70 ? 'var(--green)' : teamPct >= 40 ? 'var(--orange)' : 'var(--red)';
        // Joueuses actives cette semaine
        const activePlayers = _seasonPool.filter(p => {
          const pLog = (logs[p.id] || {})[weekKey] || {};
          return o.exercises.some(ex => pLog[ex.id] && pLog[ex.id].done);
        }).length;
        return `
          <div class="section-header">
            <div>
              <div class="eyebrow" style="color:${active?'var(--orange)':'var(--ink-3)'}">${active ? '☀ Actif · ' + formatWeekRange() : '○ Inactif · ' + formatDate(o.startDate, 'short') + ' → ' + formatDate(o.endDate, 'short')}</div>
              <h2 class="display-md mt-2">${esc(o.title)}</h2>
            </div>
            <button class="section-action" onclick="openOffseasonDashboard()">Suivi →</button>
          </div>
          <div style="padding:0 18px;margin-bottom:18px">
            <div onclick="openOffseasonDashboard()" style="padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
                <div style="font-family:'JetBrains Mono';font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.06em">Engagement équipe · semaine</div>
                <div style="font-family:'Anton';font-size:28px;color:${color};line-height:1">${teamPct}%</div>
              </div>
              <div style="height:6px;background:var(--bg-1);border-radius:3px;overflow:hidden;margin-bottom:8px">
                <div style="height:100%;width:${teamPct}%;background:${color}"></div>
              </div>
              <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase">
                <span>${activePlayers}/${_seasonPool.length} joueuses actives</span>
                <span>${o.exercises.length} exos × semaine</span>
              </div>
            </div>
          </div>
        `;
      })()}

    </div>
  `;
}

// Row pour une instance d'événement (utilisée Home + Team)
function eventInstanceRow(ev, isCoach) {
  const d = new Date(ev.date + 'T00:00:00');
  const dayName = DAY_NAMES_FR_FULL[d.getDay()];
  const day = d.getDate();
  const month = d.toLocaleDateString('fr-FR', { month: 'short' });
  const isToday = isoDate(new Date()) === ev.date;
  const isMatch = ev.type === 'match';
  const instanceKey = ev._instanceKey || ev.id;
  const parentId = ev._parentId || ev.id;
  const instanceDate = ev._instanceDate || ev.date;
  // Invitées : chip + raccourci "+ ajouter" sur training, coach uniquement, non annulé
  const parentConvoc = state.convocations.find(x => x.id === parentId);
  const isCancelled = parentConvoc && (parentConvoc.cancelledInstances || []).includes(instanceDate);
  const showGuestUI = isCoach && !isMatch && !isCancelled;
  const guestCount = showGuestUI ? getTrainingGuests(parentId, instanceDate).length : 0;
  return `
    <div class="list-row" onclick="openEventInstance('${parentId}','${instanceDate}')">
      <div class="event-date-badge">
        <div class="event-date-day">${day}</div>
        <div class="event-date-month">${month}</div>
      </div>
      <div class="list-row-content">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px;flex-wrap:wrap">
          <div class="list-row-title">${esc(ev.title)}</div>
          ${isMatch ? '<span class="chip chip-orange" style="font-size:9px;padding:2px 6px">MATCH</span>' : ''}
          ${isToday ? '<span class="chip chip-red" style="font-size:9px;padding:2px 6px">AUJOURD\'HUI</span>' : ''}
          ${guestCount > 0 ? `<span class="chip" style="font-size:9px;padding:2px 6px;background:rgba(255,107,0,0.15);border-color:var(--orange);color:var(--orange)" title="${guestCount} invitée${guestCount>1?'s':''}">+${guestCount} 👤</span>` : ''}
        </div>
        <div class="list-row-subtitle">${dayName}${ev.time ? ' · ' + ev.time : ''}${ev.location ? ' · ' + esc(ev.location) : ''}</div>
      </div>
      ${showGuestUI ? `<button class="btn btn-icon" onclick="event.stopPropagation();openAddGuestModal('${parentId}','${instanceDate}')" title="Ajouter une joueuse temporaire" style="color:var(--orange);font-size:16px;margin-right:2px">+👤</button>` : ''}
      <span class="list-row-trail">›</span>
    </div>
  `;
}

function heroCard(ev) {
  const days = daysUntil(ev.date);
  const daysLabel = days === 0 ? "Aujourd'hui" : days === 1 ? 'Demain' : `Dans ${days} jours`;
  const responses = ev.responses || {};
  // SAISON : compte les absentes parmi l'effectif courant.
  const absent = currentSeasonPlayers().filter(p => responses[p.id] && responses[p.id].status === 'absent').length;
  const parentId = ev._parentId || ev.id;
  const instanceDate = ev._instanceDate || ev.date;

  return `
    <div class="hero-card fade-up" onclick="openEventInstance('${parentId}','${instanceDate}')">
      <div class="hero-eyebrow">${ev.type === 'match' ? '◆ Prochain match' : '● Prochain entraînement'} · ${daysLabel}</div>
      <div class="hero-title">${esc(ev.title)}</div>
      <div class="hero-meta">
        <div>◷ ${formatDate(ev.date, 'long')}${ev.time ? ' · ' + ev.time : ''}</div>
        ${ev.location ? `<div>⌖ ${esc(ev.location)}</div>` : ''}
      </div>
      ${absent > 0 ? `
        <div class="hero-meta mt-2">
          <div style="color:#ffe5d6">⚠ ${absent} absente${absent>1?'s':''}</div>
        </div>
      ` : ''}
      <button class="hero-cta" onclick="event.stopPropagation();openEventInstance('${parentId}','${instanceDate}')">Détails →</button>
    </div>
  `;
}

function playTile(p, opts) {
  opts = opts || {};
  const images = p.images || [];
  const hasGallery = images.length > 0;
  const v = p.videoUrl ? parseVideo(p.videoUrl) : null;
  const hasVideo = !!v;
  const previewSrc = hasGallery ? images[0] : (v && v.thumb ? v.thumb : null);
  const concepts = p.concepts || [];

  // SAISON : surcouches optionnelles
  // opts.seasonActive : true/false/undefined — affiche un badge "Inactif" si false
  // opts.seasonToggleBtn : HTML pour le bouton toggle (rendu après le body)
  // opts.seasonOrphan : true → badge "Pas dans cette saison"
  // opts.dimmed : true → opacity réduite (play inactif sur la saison)
  const dim = !!opts.dimmed;
  const inactiveBadge = (opts.seasonActive === false)
    ? '<div class="v-tile-badge" style="background:rgba(128,128,128,0.85);color:white">⚪ Inactif</div>'
    : '';
  const orphanBadge = opts.seasonOrphan
    ? '<div class="v-tile-badge" style="background:rgba(255,107,0,0.85);color:black">+ saison</div>'
    : '';

  return `
    <div class="v-tile" style="${dim ? 'opacity:0.55' : ''}">
      <div class="v-tile-media" onclick="openPlay('${p.id}')" style="cursor:pointer">
        ${previewSrc
          ? `<img src="${previewSrc}" alt="" onerror="this.style.display='none'">`
          : `<div class="v-tile-placeholder">
              <div class="v-tile-placeholder-icon">${hasVideo ? '▶' : '🏀'}</div>
              ${concepts.length > 0
                ? `<div class="v-tile-placeholder-tags">${concepts.slice(0,2).map(c => esc(c)).join(' · ')}</div>`
                : (p.tags && p.tags.length > 0
                  ? `<div class="v-tile-placeholder-tags">${p.tags.slice(0,2).map(t => esc(t)).join(' · ')}</div>`
                  : `<div class="v-tile-placeholder-tags">${esc((p.desc || '').slice(0, 40))}${(p.desc || '').length > 40 ? '…' : ''}</div>`)}
            </div>`}
        <div style="position:absolute;top:6px;left:6px;display:flex;gap:4px;flex-wrap:wrap">
          ${hasGallery ? `<div class="v-tile-badge" style="background:rgba(255,107,0,0.9);color:black">📷 ${images.length}</div>` : ''}
          ${hasVideo ? `<div class="v-tile-badge">▶</div>` : ''}
          ${inactiveBadge}
          ${orphanBadge}
        </div>
        <div class="v-tile-cat ${getCatClass(p.cat)}">${getCatShort(p.cat)}</div>
      </div>
      <div class="v-tile-body" onclick="openPlay('${p.id}')" style="cursor:pointer">
        <div class="v-tile-title">${esc(p.title)}</div>
        <div class="v-tile-meta">${esc(p.desc || (concepts.length > 0 ? concepts.slice(0,3).join(' · ') : ''))}</div>
      </div>
      ${opts.seasonToggleBtn || ''}
    </div>
  `;
}

// ============================================================
// PLAYER VIEW — Architecture 5 onglets (v2)
// 1. home (Mon Playbook = dashboard compact)
// 2. plays (catalogue — utilise renderPlays)
// 3. challenges (renderPlayerChallenges)
// 4. calendrier (renderPlayerCalendrier : convoc + matchs + FFBB)
// 5. programme (renderPlayerProgramme : prépa estivale)
// ============================================================

function renderHomePlayer() {
  const p = currentPlayer();
  if (!p) return renderHomeCoach();

  const today = new Date(); today.setHours(0,0,0,0);
  const todayStr = isoDate(today);
  const threeWeeksLater = new Date(today.getTime() + 21 * 86400000);
  const upcoming = getAllEventsBetween(todayStr, isoDate(threeWeeksLater));
  const nextEvent = upcoming[0];

  // Dernières stats persos (compact)
  const myMatches = state.matches
    .filter(m => m.playerStats && m.playerStats[p.id])
    .sort((a,b) => b.date.localeCompare(a.date));
  const lastStats = myMatches.length > 0 ? myMatches[0].playerStats[p.id] : null;

  // Challenges actifs (non clôturés)
  const myActiveChallenges = (state.challenges || []).filter(c => !c.badgesAwarded).slice(0, 3);
  const myBadgesCount = (p.badges || []).length;

  // Carrousel plays récents
  const featuredPlays = state.plays.slice(0, 6);

  return `
    <div class="fade-up">
      <div class="section-header">
        <div>
          <div class="eyebrow">Salut #${p.num}</div>
          <h2 class="display-lg mt-2">${esc(p.name)}</h2>
        </div>
      </div>

      <!-- 1. Prochain événement (RSVP en 1 clic via heroCard / openEventInstance) -->
      ${nextEvent ? heroCard(nextEvent) : `
        <div style="padding:0 18px;margin-bottom:14px">
          <div class="card" style="padding:14px;display:flex;align-items:center;gap:12px;cursor:default">
            <div style="font-size:32px">📅</div>
            <div style="flex:1">
              <div style="font-family:'Anton';font-size:15px;text-transform:uppercase">Aucun match prévu</div>
              <div style="font-size:11px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:2px;text-transform:uppercase">Ton coach te préviendra</div>
            </div>
          </div>
        </div>
      `}

      <!-- 2. Challenges actifs (preview 2-3, lien Tout → onglet) -->
      ${myActiveChallenges.length > 0 ? `
        <div class="section-header">
          <div>
            <div class="eyebrow">Défis en cours</div>
            <h2 class="display-md mt-2">Challenges</h2>
          </div>
          <button class="section-action" onclick="goSection('challenges')">Tout →</button>
        </div>
        <div style="padding:0 18px;display:flex;flex-direction:column;gap:8px;margin-bottom:18px">
          ${myActiveChallenges.map(c => playerChallengeRow(c, p.id)).join('')}
        </div>
      ` : ''}

      <!-- 3. Carrousel plays récents (lien → onglet Plays) -->
      <div class="section-header">
        <div>
          <div class="eyebrow">Plays à revoir</div>
          <h2 class="display-md mt-2">Playbook</h2>
        </div>
        <button class="section-action" onclick="goSection('plays')">Voir tout →</button>
      </div>
      <div class="scroll-row">
        ${featuredPlays.map(pl => playTile(pl)).join('')}
      </div>

      <!-- 4. Mini stats persos (en arrière-plan, compact) -->
      ${lastStats ? `
        <div class="section-header">
          <div>
            <div class="eyebrow-muted">Dernier match · vs ${esc(myMatches[0].opponent)}</div>
            <h2 class="display-md mt-2" style="font-size:18px;color:var(--ink-2)">Mes stats</h2>
          </div>
        </div>
        <div class="stat-grid mb-3">
          <div class="stat-tile">
            <div class="stat-tile-label">PTS</div>
            <div class="stat-tile-value" style="font-size:24px">${lastStats.pts || 0}</div>
            <div class="stat-tile-sub">${lastStats.min || 0} min</div>
          </div>
          <div class="stat-tile">
            <div class="stat-tile-label">REB · PD</div>
            <div class="stat-tile-value" style="font-size:24px">${lastStats.reb || 0}<span style="color:var(--ink-4)"> · ${lastStats.ast || 0}</span></div>
            <div class="stat-tile-sub">${myBadgesCount} trophée${myBadgesCount>1?'s':''}</div>
          </div>
        </div>
      ` : (myBadgesCount > 0 ? `
        <div style="padding:0 18px;margin-bottom:18px">
          <div onclick="openAllBadges()" style="padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);display:flex;align-items:center;gap:10px;cursor:pointer">
            <div style="font-size:28px">🏆</div>
            <div style="flex:1">
              <div style="font-family:'Anton';font-size:14px;text-transform:uppercase">Mon palmarès</div>
              <div style="font-size:11px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:2px;text-transform:uppercase">${myBadgesCount} trophée${myBadgesCount>1?'s':''}</div>
            </div>
            <div style="color:var(--orange);font-family:'Anton';font-size:18px">›</div>
          </div>
        </div>
      ` : '')}

    </div>
  `;
}

// Ressenti équipe : CTA réutilisable (rendu dans l'onglet Forme). Demande
// utilisatrice : relocaliser depuis Accueil vers Forme, où il prend tout
// son sens (à côté du ressenti physique / mental).
function teamReviewCta(p) {
  const myReviews = (state.teamReviews || []).filter(r => r.pid === p.id);
  const last = myReviews.length > 0 ? myReviews[myReviews.length - 1] : null;
  return `
    <div style="padding:0 18px;margin-bottom:18px">
      <div onclick="openTeamReview()" style="padding:12px 14px;background:var(--bg-2);border:1px dashed var(--border);border-radius:var(--radius);display:flex;align-items:center;gap:10px;cursor:pointer">
        <div style="font-size:22px">💭</div>
        <div style="flex:1;min-width:0">
          <div style="font-family:'Anton';font-size:13px;text-transform:uppercase;letter-spacing:0.02em">Mon ressenti équipe</div>
          <div style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:2px;text-transform:uppercase">${last ? 'Dernière : ' + formatDate(last.date, 'short') : 'Confidentiel · visible coach uniquement'}</div>
        </div>
        <div style="color:var(--orange);font-family:'Anton';font-size:16px">${last ? '✎' : '+'}</div>
      </div>
    </div>
  `;
}

// ============================================================
// PLAYER · Onglet "Défis" — challenges actifs / terminés + palmarès
// ============================================================
function renderPlayerChallenges() {
  const p = currentPlayer();
  if (!p) return renderHomeCoach();
  const isAuto = c => !!c.autoCount || c.scope === 'season';
  const sortRecent = (a, b) => {
    if (a.endDate && b.endDate) return b.endDate.localeCompare(a.endDate);
    if (a.endDate) return -1;
    if (b.endDate) return 1;
    return (b.updatedAt || 0) - (a.updatedAt || 0);
  };
  // SAISON : on filtre par saison courante (la joueuse est forcée sur la
  // saison active, cf. ensureCurrentSeasonId). currentSeasonChallenges()
  // gère le bypass legacy si seasons pas encore loadés.
  const seasonChallenges = currentSeasonChallenges();
  // Cohérence vue coach : collectif + individuel manuel en haut, auto en bas
  const activeAll = seasonChallenges.filter(c => !c.badgesAwarded);
  const collective = activeAll.filter(c => c.scope === 'collective' && !isAuto(c)).sort(sortRecent);
  const individual = activeAll.filter(c => c.scope === 'individual' && !isAuto(c)).sort(sortRecent);
  const auto       = activeAll.filter(isAuto).sort(sortRecent);
  const orderedActive = [...collective, ...individual, ...auto];
  const finished = seasonChallenges.filter(c => c.badgesAwarded);
  const myBadges = (p.badges || []).slice().sort((a,b) => (b.date || '').localeCompare(a.date || ''));

  return `
    <div class="fade-up">
      <div class="section-header">
        <div>
          <div class="eyebrow">${orderedActive.length} en cours · ${myBadges.length} trophée${myBadges.length>1?'s':''}</div>
          <h2 class="display-lg mt-2">Défis</h2>
        </div>
      </div>

      ${collective.length > 0 ? `
        <div class="section-header"><div><div class="eyebrow" style="color:var(--orange)">🤝 Collectif</div><h2 class="display-md mt-2">Équipe</h2></div></div>
        <div style="padding:0 18px;display:flex;flex-direction:column;gap:8px;margin-bottom:18px">
          ${collective.map(c => playerChallengeRow(c, p.id)).join('')}
        </div>
      ` : ''}

      ${individual.length > 0 ? `
        <div class="section-header"><div><div class="eyebrow" style="color:var(--orange)">🎯 Individuel</div><h2 class="display-md mt-2">Perso</h2></div></div>
        <div style="padding:0 18px;display:flex;flex-direction:column;gap:8px;margin-bottom:18px">
          ${individual.map(c => playerChallengeRow(c, p.id)).join('')}
        </div>
      ` : ''}

      ${auto.length > 0 ? `
        <div class="section-header"><div><div class="eyebrow" style="color:var(--ink-3)">⚙ Auto</div><h2 class="display-md mt-2" style="color:var(--ink-2)">Compteurs</h2></div></div>
        <div style="padding:0 18px;display:flex;flex-direction:column;gap:8px;margin-bottom:18px">
          ${auto.map(c => playerChallengeRow(c, p.id)).join('')}
        </div>
      ` : ''}

      ${orderedActive.length === 0 ? `
        <div class="empty"><div class="empty-icon">🎯</div><div class="empty-title">Aucun défi actif</div><div class="empty-desc">Reviens plus tard, ton coach va en lancer.</div></div>
      ` : ''}

      ${myBadges.length > 0 ? `
        <div class="section-header">
          <div><div class="eyebrow">${myBadges.length} trophée${myBadges.length>1?'s':''}</div><h2 class="display-md mt-2">🏆 Mon palmarès</h2></div>
          ${myBadges.length > 5 ? `<button class="section-action" onclick="openAllBadges()">Tout →</button>` : ''}
        </div>
        <div style="padding:0 18px;display:flex;flex-direction:column;gap:6px;margin-bottom:18px">
          ${myBadges.slice(0, 5).map(b => renderBadge(b)).join('')}
        </div>
      ` : ''}

      ${finished.length > 0 ? `
        <div class="section-header"><div><div class="eyebrow">Archivés</div><h2 class="display-md mt-2">Terminés</h2></div></div>
        <div style="padding:0 18px;display:flex;flex-direction:column;gap:8px;margin-bottom:18px">
          ${finished.slice(0, 8).map(c => playerChallengeRow(c, p.id)).join('')}
        </div>
      ` : ''}
    </div>
  `;
}

// ============================================================
// PLAYER · Onglet "Match" — focus matchs (à venir + passés avec résultats)
// L'agenda reste pour la vue mixte (entraînements + matchs). Ici on extrait
// uniquement les matchs : prochains (depuis les convocations type='match')
// et passés avec score (depuis state.matches, qui porte les stats + détails).
// ============================================================
function renderPlayerMatches() {
  if (state.view && state.view.type === 'match') return renderMatchDetail();
  const p = currentPlayer();
  if (!p) return renderHomeCoach();
  const today = new Date(); today.setHours(0,0,0,0);
  const todayStr = isoDate(today);
  // Horizon prochains matchs : 90 jours (fin de saison typique)
  const horizon = new Date(today.getTime() + 90 * 86400000);
  const upcoming = getAllEventsBetween(todayStr, isoDate(horizon))
    .filter(ev => ev.type === 'match');

  // Passés : on prend currentSeasonMatches() (saison forcée=active pour
  // la joueuse). Lien direct vers la vue détail match riche.
  const playedMatches = currentSeasonMatches()
    .filter(m => (m.scoreUs || 0) > 0 || (m.scoreOpp || 0) > 0)
    .sort((a, b) => b.date.localeCompare(a.date));

  // FFBB read-only : prochains + résultats (filtrés sur notre équipe)
  const f = state.ffbb || {};
  const ffbbMatches = f.matches || [];
  const isPlayed = m => m.played && m.scoreHome != null && m.scoreAway != null && !isNaN(m.scoreHome) && !isNaN(m.scoreAway);
  const teamLower = (f.teamName || '').toLowerCase();
  const isMyTeam = m => (m.home || '').toLowerCase().includes(teamLower) || (m.away || '').toLowerCase().includes(teamLower);
  const ffbbUpcoming = ffbbMatches.filter(m => !isPlayed(m) && isMyTeam(m)).slice(0, 6);
  const ffbbRecent = ffbbMatches.filter(m => isPlayed(m) && isMyTeam(m)).reverse().slice(0, 6);

  const pastMatchRow = m => {
    const win = m.scoreUs > m.scoreOpp;
    const tie = m.scoreUs === m.scoreOpp;
    const color = tie ? 'var(--ink-3)' : (win ? 'var(--green)' : 'var(--red)');
    const tag = tie ? 'NUL' : (win ? 'V' : 'D');
    const d = new Date(m.date + 'T00:00:00');
    const day = d.getDate();
    const month = d.toLocaleDateString('fr-FR', { month: 'short' });
    const hasMyStats = m.playerStats && m.playerStats[p.id];
    return `
      <div class="list-row" onclick="openMatch('${m.id}')">
        <div class="event-date-badge" style="background:var(--bg-2);border-color:${color}">
          <div class="event-date-day" style="color:${color}">${day}</div>
          <div class="event-date-month">${month}</div>
        </div>
        <div class="list-row-content">
          <div class="list-row-title">${m.home ? '🏠 ' : '✈ '}${esc(m.opponent)}</div>
          <div class="list-row-subtitle">
            <span style="color:${color};font-family:'Anton';letter-spacing:0.04em">${tag} · ${m.scoreUs}–${m.scoreOpp}</span>
            ${hasMyStats ? ` · <span style="color:var(--ink-3)">${m.playerStats[p.id].pts || 0} pts · ${m.playerStats[p.id].min || 0}'</span>` : ''}
          </div>
        </div>
        <span class="list-row-trail">›</span>
      </div>
    `;
  };

  return `
    <div class="fade-up">
      <div class="section-header">
        <div>
          <div class="eyebrow">${upcoming.length} à venir · ${playedMatches.length} joué${playedMatches.length>1?'s':''}</div>
          <h2 class="display-lg mt-2">Match</h2>
        </div>
      </div>

      ${upcoming.length > 0 ? `
        <div class="section-header"><div><div class="eyebrow">90 prochains jours</div><h2 class="display-md mt-2">À venir</h2></div></div>
        <div class="list-section">
          ${upcoming.slice(0, 12).map(ev => playerEventRow(ev, p.id)).join('')}
        </div>
      ` : `
        <div class="empty" style="padding:24px"><div class="empty-icon">🏀</div><div class="empty-title">Aucun match prévu</div><div class="empty-desc">Ton coach va programmer la suite.</div></div>
      `}

      ${playedMatches.length > 0 ? `
        <div class="section-header"><div><div class="eyebrow">Bilan saison</div><h2 class="display-md mt-2">Joués</h2></div></div>
        <div class="list-section">
          ${playedMatches.slice(0, 20).map(pastMatchRow).join('')}
        </div>
      ` : ''}

      ${(ffbbUpcoming.length > 0 || ffbbRecent.length > 0) ? `
        <div class="section-header" style="margin-top:8px">
          <div>
            <div class="eyebrow">Championnat</div>
            <h2 class="display-md mt-2">FFBB</h2>
          </div>
        </div>
        ${ffbbUpcoming.length > 0 ? `
          <div class="section-header"><div><div class="eyebrow-muted">Calendrier FFBB</div><h2 class="display-md mt-2" style="font-size:16px;color:var(--ink-2)">Prochains</h2></div></div>
          <div class="list-section">
            ${ffbbUpcoming.map(m => ffbbMatchRow(m, f.teamName)).join('')}
          </div>
        ` : ''}
        ${ffbbRecent.length > 0 ? `
          <div class="section-header"><div><div class="eyebrow-muted">Résultats FFBB</div><h2 class="display-md mt-2" style="font-size:16px;color:var(--ink-2)">Derniers</h2></div></div>
          <div class="list-section">
            ${ffbbRecent.map(m => ffbbMatchRow(m, f.teamName)).join('')}
          </div>
        ` : ''}
      ` : ''}
    </div>
  `;
}

// PLAYER · Onglet "Agenda" — convocations / matchs + FFBB read-only
// ============================================================
function renderPlayerCalendrier() {
  const p = currentPlayer();
  if (!p) return renderHomeCoach();
  const today = new Date(); today.setHours(0,0,0,0);
  const todayStr = isoDate(today);
  const fourWeeksLater = new Date(today.getTime() + 28 * 86400000);
  const upcoming = getAllEventsBetween(todayStr, isoDate(fourWeeksLater));
  // Événements passés sur 30j
  const pastStart = new Date(today.getTime() - 30 * 86400000);
  const past = getAllEventsBetween(isoDate(pastStart), todayStr).reverse();

  const f = state.ffbb || {};
  const ffbbMatches = f.matches || [];
  const ffbbStandings = f.standings || [];
  const isPlayed = m => m.played && m.scoreHome != null && m.scoreAway != null && !isNaN(m.scoreHome) && !isNaN(m.scoreAway);
  const teamLower = (f.teamName || '').toLowerCase();
  const ffbbUpcoming = ffbbMatches.filter(m => !isPlayed(m) && (
    (m.home || '').toLowerCase().includes(teamLower) ||
    (m.away || '').toLowerCase().includes(teamLower)
  )).slice(0, 6);
  const ffbbRecent = ffbbMatches.filter(m => isPlayed(m) && (
    (m.home || '').toLowerCase().includes(teamLower) ||
    (m.away || '').toLowerCase().includes(teamLower)
  )).reverse().slice(0, 6);

  return `
    <div class="fade-up">
      <div class="section-header">
        <div>
          <div class="eyebrow">${upcoming.length} à venir · ${past.length} récent${past.length>1?'s':''}</div>
          <h2 class="display-lg mt-2">Agenda</h2>
        </div>
      </div>

      ${upcoming.length > 0 ? `
        <div class="section-header"><div><div class="eyebrow">4 prochaines semaines</div><h2 class="display-md mt-2">À venir</h2></div></div>
        <div class="list-section">
          ${upcoming.slice(0, 10).map(ev => playerEventRow(ev, p.id)).join('')}
        </div>
      ` : `
        <div class="empty" style="padding:24px"><div class="empty-icon">○</div><div class="empty-title">Aucun événement prévu</div></div>
      `}

      ${past.length > 0 ? `
        <div class="section-header"><div><div class="eyebrow">30 derniers jours</div><h2 class="display-md mt-2">Récent</h2></div></div>
        <div class="list-section">
          ${past.slice(0, 6).map(ev => playerEventRow(ev, p.id)).join('')}
        </div>
      ` : ''}

      <!-- FFBB read-only -->
      ${(ffbbUpcoming.length > 0 || ffbbRecent.length > 0 || ffbbStandings.length > 0) ? `
        <div class="section-header" style="margin-top:8px">
          <div>
            <div class="eyebrow">Championnat</div>
            <h2 class="display-md mt-2">FFBB</h2>
          </div>
        </div>
        ${f.teamName ? `
          <div style="padding:0 18px;margin-bottom:12px">
            <div style="padding:10px 12px;background:var(--bg-2);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;gap:10px">
              <div style="width:28px;height:28px;border-radius:6px;background:var(--orange-soft);display:flex;align-items:center;justify-content:center;font-family:'Anton';color:var(--orange);font-size:13px">F</div>
              <div style="flex:1;min-width:0">
                <div style="font-family:'Anton';font-size:12px;text-transform:uppercase;letter-spacing:0.02em">${esc(f.teamName)}</div>
                <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono'">${f.lastSync ? 'Sync ' + new Date(f.lastSync).toLocaleString('fr-FR', {dateStyle:'short', timeStyle:'short'}) : '○ Non synchro'}</div>
              </div>
            </div>
          </div>
        ` : ''}

        ${ffbbUpcoming.length > 0 ? `
          <div class="section-header"><div><div class="eyebrow-muted">Calendrier FFBB</div><h2 class="display-md mt-2" style="font-size:16px;color:var(--ink-2)">Prochains</h2></div></div>
          <div class="list-section">
            ${ffbbUpcoming.map(m => ffbbMatchRow(m, f.teamName)).join('')}
          </div>
        ` : ''}

        ${ffbbRecent.length > 0 ? `
          <div class="section-header"><div><div class="eyebrow-muted">Résultats FFBB</div><h2 class="display-md mt-2" style="font-size:16px;color:var(--ink-2)">Derniers</h2></div></div>
          <div class="list-section">
            ${ffbbRecent.map(m => ffbbMatchRow(m, f.teamName)).join('')}
          </div>
        ` : ''}

        ${ffbbStandings.length > 0 ? `
          <div class="section-header"><div><div class="eyebrow-muted">Classement</div><h2 class="display-md mt-2" style="font-size:16px;color:var(--ink-2)">Poule</h2></div></div>
          <div class="list-section">
            <div class="stats-wrap">
              <table class="stats-table">
                <thead><tr><th>#</th><th>Équipe</th><th>MJ</th><th>V</th><th>D</th><th>Pts</th></tr></thead>
                <tbody>
                  ${ffbbStandings.map(s => {
                    const isMe = (s.team || '').toLowerCase().includes(teamLower);
                    return `<tr style="${isMe ? 'background:var(--orange-soft)' : ''}">
                      <td class="num">${s.rank ?? '-'}</td>
                      <td style="font-family:'Anton';font-size:12px;text-transform:uppercase">${esc(s.team)}</td>
                      <td>${s.played ?? '-'}</td>
                      <td>${s.wins ?? '-'}</td>

// ============================================================
// PLAYER · Onglet "Forme" — programme estival + exercices à valider
// ============================================================
function renderPlayerProgramme() {
  const p = currentPlayer();
  if (!p) return renderHomeCoach();
  const o = state.offseason;
  const myBadges = (p.badges || []).length;
  const todayStr = new Date().toISOString().slice(0,10);

  // Ressenti équipe (relocalisé depuis Accueil)
  const teamReview = teamReviewCta(p);

  if (!o) {
    return `
      <div class="fade-up">
        <div class="section-header">
          <div><div class="eyebrow">Forme du jour</div><h2 class="display-lg mt-2">Forme</h2></div>
        </div>
        ${teamReview}
        <div class="empty"><div class="empty-icon">💪</div><div class="empty-title">Aucun programme physique</div><div class="empty-desc">Ton coach n'a pas encore configuré la prépa estivale.</div></div>
      </div>
    `;
  }

  // PHASE 4 : onglet Forme en mode journalier.
  if (o.mode === 'daily') return renderPlayerProgrammeDaily(p, o, teamReview);

  const beforeStart = o.startDate && todayStr < o.startDate;
  const afterEnd = o.endDate && todayStr > o.endDate;
  const active = !beforeStart && !afterEnd;
  const weekKey = getWeekKey();
  state.offseasonLogs = state.offseasonLogs || {};
  state.offseasonLogs[p.id] = state.offseasonLogs[p.id] || {};
  state.offseasonLogs[p.id][weekKey] = state.offseasonLogs[p.id][weekKey] || {};
  const log = state.offseasonLogs[p.id][weekKey];
  const doneCount = active ? o.exercises.filter(ex => log[ex.id] && log[ex.id].done).length : 0;
  const pct = active && o.exercises.length > 0 ? Math.round((doneCount / o.exercises.length) * 100) : 0;
  const color = pct >= 70 ? 'var(--green)' : pct >= 40 ? 'var(--orange)' : pct > 0 ? 'var(--orange)' : 'var(--red)';

  let banner;
  if (beforeStart) banner = `<div style="padding:10px 12px;background:rgba(99,102,241,0.10);border-left:3px solid #6366f1;border-radius:6px;margin:0 18px 14px;font-size:12px;color:var(--ink-2);line-height:1.5">📅 <strong>Démarre le ${formatDate(o.startDate)}</strong>. Découvre le programme dès maintenant.</div>`;
  else if (afterEnd) banner = `<div style="padding:10px 12px;background:rgba(34,197,94,0.10);border-left:3px solid var(--green);border-radius:6px;margin:0 18px 14px;font-size:12px;color:var(--ink-2);line-height:1.5">🏁 <strong>Programme terminé le ${formatDate(o.endDate)}</strong>.</div>`;
  else banner = `<div style="padding:10px 12px;background:var(--bg-3);border-left:3px solid var(--orange);border-radius:6px;margin:0 18px 14px;font-size:11px;color:var(--ink-2);line-height:1.5">Coche chaque exercice fait cette semaine. Reset auto chaque lundi.</div>`;

  const allWeeks = Object.keys(state.offseasonLogs[p.id] || {}).filter(w => w !== weekKey).sort().reverse().slice(0, 4);

  return `
    <div class="fade-up">
      <div class="section-header">
        <div>
          <div class="eyebrow" style="color:var(--orange)">${active ? formatWeekRange() : (beforeStart ? 'À venir' : 'Terminé')}</div>
          <h2 class="display-lg mt-2">☀ ${esc(o.title)}</h2>
        </div>
      </div>

      ${teamReview}

      ${banner}

      ${active ? `
        <div style="padding:0 18px;margin-bottom:14px">
          <div style="text-align:center;padding:14px;background:var(--bg-2);border-radius:10px;border:1px solid ${pct===100?'var(--green)':'var(--border)'}">
            <div style="font-family:'Anton';font-size:36px;color:${pct===100?'var(--green)':color};line-height:1">${doneCount}<span style="font-size:18px;color:var(--ink-4)">/${o.exercises.length}</span></div>
            <div style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.06em;margin:6px 0 10px">Exercices · ${pct}%</div>
            <div style="height:6px;background:var(--bg-1);border-radius:3px;overflow:hidden">
              <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--orange),${pct===100?'var(--green)':'#cc5400'});transition:width 0.3s"></div>
            </div>
          </div>
        </div>
      ` : ''}

      <div style="padding:0 18px;display:flex;flex-direction:column;gap:8px">
        ${o.exercises.map(ex => {
          const entry = log[ex.id] || {};
          const isDone = active && !!entry.done;
          const clickAttr = active ? `onclick="togglePlayerProgrammeExercise('${ex.id}')"` : '';
          return `
            <div class="warmup-step-do ${isDone ? 'done' : ''}" ${clickAttr} style="${active ? '' : 'cursor:default;opacity:0.85'}">
              <div style="font-family:'Anton';font-size:18px;color:${isDone?'var(--green)':'var(--orange)'};min-width:32px;text-align:center">${isDone ? '✓' : '○'}</div>
              <div style="flex:1;min-width:0">
                <div style="font-family:'Anton';font-size:14px;text-transform:uppercase;${isDone?'text-decoration:line-through;color:var(--ink-3)':''}">${esc(ex.label)}</div>
                <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:3px">
                  ${ex.target > 0 ? `<span style="font-size:10px;color:var(--orange);font-family:'JetBrains Mono';text-transform:uppercase">🎯 ${ex.target} ${esc(ex.unit || '')}</span>` : ''}
                  ${ex.notes ? `<span style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';font-style:italic">${esc(ex.notes)}</span>` : ''}
                </div>
              </div>
            </div>
          `;
        }).join('')}
      </div>

      ${allWeeks.length > 0 ? `
        <div class="section-header"><div><div class="eyebrow-muted">Historique</div><h2 class="display-md mt-2" style="font-size:16px;color:var(--ink-2)">Semaines passées</h2></div></div>
        <div style="padding:0 18px;display:flex;flex-direction:column;gap:4px;margin-bottom:18px">
          ${allWeeks.map(wk => {
            const wLog = state.offseasonLogs[p.id][wk] || {};
            const wDone = o.exercises.filter(ex => wLog[ex.id] && wLog[ex.id].done).length;
            const wPct = o.exercises.length > 0 ? Math.round((wDone / o.exercises.length) * 100) : 0;
            const c = wPct >= 80 ? 'var(--green)' : wPct >= 50 ? 'var(--orange)' : 'var(--red)';
            return `
              <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg-2);border-radius:6px">
                <div style="font-family:'JetBrains Mono';font-size:10px;color:var(--ink-3);text-transform:uppercase;min-width:60px">${wk}</div>
                <div style="flex:1;height:5px;background:var(--bg-1);border-radius:3px;overflow:hidden">
                  <div style="height:100%;width:${wPct}%;background:${c}"></div>
                </div>
                <div style="font-family:'Anton';font-size:13px;color:${c};min-width:50px;text-align:right">${wDone}/${o.exercises.length}</div>
              </div>
            `;
          }).join('')}
        </div>
      ` : ''}
    </div>
  `;
}

// PHASE 4 : onglet Forme en mode journalier (programme du jour + à venir).
function renderPlayerProgrammeDaily(p, o, teamReview) {
  const pid = p.id;
  const sched = o.dailySchedule || {};
  const todayStr = new Date().toISOString().slice(0, 10);
  const allDates = Object.keys(sched).sort();
  const upcoming = allDates.filter(d => d > todayStr).slice(0, 7);
  const past = allDates.filter(d => d < todayStr).reverse().slice(0, 5);
  // Prochain jour FUTUR portant au moins 1 exercice (forward-looking) : permet
  // d'indiquer à la joueuse quand tombe sa prochaine séance même si rien
  // aujourd'hui (ex : ouvre l'app un dimanche, prochain exo mardi).
  const nextTrainingDate = allDates.find(d => d > todayStr && (sched[d] || []).length > 0);
  const nextTrainingCount = nextTrainingDate ? sched[nextTrainingDate].length : 0;
  const nextTrainingDelta = nextTrainingDate ? daysUntil(nextTrainingDate) : null;
  const nextTrainingWhen = nextTrainingDelta === 1 ? 'demain'
    : (nextTrainingDelta != null ? 'dans ' + nextTrainingDelta + ' jours' : '');
  state.offseasonLogs = state.offseasonLogs || {};
  state.offseasonLogs[pid] = state.offseasonLogs[pid] || {};
  const todayItems = sched[todayStr] || [];

  const exoRow = (date, it, clickable) => {
    const dLog = state.offseasonLogs[pid][date] || {};
    const isDone = !!(dLog[it.id] && dLog[it.id].done);
    const meta = [it.sets?it.sets+' séries':'', it.reps?it.reps+' reps':'', it.durationMin?it.durationMin+' min':''].filter(Boolean).join(' · ');
    const clickAttr = clickable ? `onclick="togglePlayerProgrammeDailyExercise('${date}','${it.id}')"` : '';
    return `
      <div class="warmup-step-do ${isDone ? 'done' : ''}" ${clickAttr} style="${clickable ? '' : 'cursor:default;opacity:0.85'}">
        <div style="font-family:'Anton';font-size:18px;color:${isDone?'var(--green)':'var(--orange)'};min-width:32px;text-align:center">${isDone ? '✓' : '○'}</div>
        <div style="flex:1;min-width:0">
          <div style="font-family:'Anton';font-size:14px;text-transform:uppercase;${isDone?'text-decoration:line-through;color:var(--ink-3)':''}">${esc(it.label)}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:3px">
            ${meta ? `<span style="font-size:10px;color:var(--orange);font-family:'JetBrains Mono';text-transform:uppercase">🎯 ${esc(meta)}</span>` : ''}
            ${it.notes ? `<span style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';font-style:italic">${esc(it.notes)}</span>` : ''}
          </div>
        </div>
      </div>`;
  };

  const doneToday = todayItems.filter(it => { const dl = state.offseasonLogs[pid][todayStr] || {}; return dl[it.id] && dl[it.id].done; }).length;
  const pctToday = todayItems.length ? Math.round((doneToday / todayItems.length) * 100) : 0;

  return `
    <div class="fade-up">
      <div class="section-header">
        <div>
          <div class="eyebrow" style="color:var(--orange)">Programme journalier</div>
          <h2 class="display-lg mt-2">☀ ${esc(o.title)}</h2>
        </div>
      </div>
      ${teamReview}
      ${todayItems.length ? `
        <div style="padding:0 18px;margin-bottom:14px">
          <div style="text-align:center;padding:14px;background:var(--bg-2);border-radius:10px;border:1px solid ${pctToday===100?'var(--green)':'var(--border)'}">
            <div class="eyebrow" style="color:var(--orange);margin-bottom:4px">Aujourd'hui · ${formatDate(todayStr, 'long')}</div>
            <div style="font-family:'Anton';font-size:36px;color:${pctToday===100?'var(--green)':'var(--orange)'};line-height:1">${doneToday}<span style="font-size:18px;color:var(--ink-4)">/${todayItems.length}</span></div>
            <div style="height:6px;background:var(--bg-1);border-radius:3px;overflow:hidden;margin-top:10px">
              <div style="height:100%;width:${pctToday}%;background:linear-gradient(90deg,var(--orange),${pctToday===100?'var(--green)':'#cc5400'})"></div>
            </div>
          </div>
        </div>
        <div style="padding:0 18px;display:flex;flex-direction:column;gap:8px;margin-bottom:18px">
          ${todayItems.map(it => exoRow(todayStr, it, true)).join('')}
        </div>
      ` : `
        <div style="padding:14px;background:var(--bg-3);border-left:3px solid var(--ink-3);border-radius:6px;margin:0 18px ${nextTrainingDate ? '10px' : '18px'};font-size:12px;color:var(--ink-2);line-height:1.5">Rien de prévu aujourd'hui. Repos ou séance libre 💪</div>
        ${nextTrainingDate ? `
          <div style="padding:0 18px;margin-bottom:18px">
            <div style="padding:14px;background:var(--bg-2);border-radius:10px;border:1px solid var(--orange);display:flex;align-items:center;gap:12px">
              <div style="font-size:26px;line-height:1">📅</div>
              <div style="flex:1;min-width:0">
                <div class="eyebrow" style="color:var(--orange);margin-bottom:3px">Prochain entraînement · ${nextTrainingWhen}</div>
                <div style="font-family:'Anton';font-size:16px;text-transform:uppercase;line-height:1.2">${formatDate(nextTrainingDate, 'long')}</div>
                <div style="font-size:11px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:2px">${nextTrainingCount} exercice${nextTrainingCount > 1 ? 's' : ''} prévu${nextTrainingCount > 1 ? 's' : ''}</div>
              </div>
            </div>
          </div>
        ` : ''}
      `}
      ${upcoming.length ? `
        <div class="section-header"><div><div class="eyebrow-muted">À venir</div></div></div>
        <div style="padding:0 18px;display:flex;flex-direction:column;gap:10px;margin-bottom:18px">
          ${upcoming.map(date => `
            <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden">
              <div style="padding:8px 10px;background:var(--bg-3);font-family:'Anton';font-size:12px;text-transform:uppercase">${formatDate(date, 'long')} · ${(sched[date]||[]).length} exo${(sched[date]||[]).length>1?'s':''}</div>
              <div style="padding:8px 10px;display:flex;flex-direction:column;gap:6px">${(sched[date]||[]).map(it => exoRow(date, it, false)).join('')}</div>
            </div>
          `).join('')}
        </div>
      ` : ''}
      ${past.length ? `
        <div class="section-header"><div><div class="eyebrow-muted">Jours passés</div></div></div>
        <div style="padding:0 18px;display:flex;flex-direction:column;gap:4px;margin-bottom:18px">
          ${past.map(date => {
            const items = sched[date] || [];
            const dLog = state.offseasonLogs[pid][date] || {};
            const wDone = items.filter(it => dLog[it.id] && dLog[it.id].done).length;
            const wPct = items.length ? Math.round((wDone / items.length) * 100) : 0;
            const c = wPct >= 80 ? 'var(--green)' : wPct >= 50 ? 'var(--orange)' : 'var(--red)';
            return `
              <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg-2);border-radius:6px">
                <div style="font-family:'JetBrains Mono';font-size:10px;color:var(--ink-3);text-transform:uppercase;min-width:90px">${formatDate(date, 'short')}</div>
                <div style="flex:1;height:5px;background:var(--bg-1);border-radius:3px;overflow:hidden"><div style="height:100%;width:${wPct}%;background:${c}"></div></div>
                <div style="font-family:'Anton';font-size:13px;color:${c};min-width:50px;text-align:right">${wDone}/${items.length}</div>
              </div>`;
          }).join('')}
        </div>
      ` : ''}
    </div>
  `;
}

function togglePlayerProgrammeDailyExercise(date, exId) {
  if (state.auth.role !== 'player') return;
  const pid = state.auth.playerId;
  state.offseasonLogs = state.offseasonLogs || {};
  state.offseasonLogs[pid] = state.offseasonLogs[pid] || {};
  state.offseasonLogs[pid][date] = state.offseasonLogs[pid][date] || {};
  const log = state.offseasonLogs[pid][date];
  log[exId] = log[exId] || {};
  log[exId].done = !log[exId].done;
  if (log[exId].done) log[exId].at = Date.now();
  persist();
  render();
}

// Toggle exo programme intégré dans la page (pas modal) — render() suffit
function togglePlayerProgrammeExercise(exId) {
  if (state.auth.role !== 'player') return;
  const pid = state.auth.playerId;
  const weekKey = getWeekKey();
  state.offseasonLogs = state.offseasonLogs || {};
  state.offseasonLogs[pid] = state.offseasonLogs[pid] || {};
  state.offseasonLogs[pid][weekKey] = state.offseasonLogs[pid][weekKey] || {};
  const log = state.offseasonLogs[pid][weekKey];
  log[exId] = log[exId] || {};
  log[exId].done = !log[exId].done;
  if (log[exId].done) log[exId].at = Date.now();
  persist();
  // Scroll position préservé automatiquement par _doRender (snapshot .app.scrollTop)
  render();
}

function playerChallengeRow(c, playerId) {
  const scores = c.scores || {};
  const myScore = scores[playerId] || 0;
  // Mon rang (selon lowerIsBetter)
  // SAISON : ranking parmi l'effectif courant uniquement (sinon une joueuse
  // partie continue à peser dans le classement de la saison en cours).
  const _seasonPool = currentSeasonPlayers();
  const sorted = _seasonPool.map(p => ({ id: p.id, score: scores[p.id] || 0 }));
  if (c.lowerIsBetter) {
    sorted.sort((a,b) => a.score - b.score);
  } else {
    sorted.sort((a,b) => b.score - a.score);
  }
  const myRank = sorted.findIndex(s => s.id === playerId) + 1;
  const total = _seasonPool.length;
  const max = Math.max(...sorted.map(s => s.score), 1);
  const isAuto = c.autoCount;
  const pctOfMax = max > 0 ? (myScore / max) * 100 : 0;
  const medal = myRank === 1 ? '🥇' : myRank === 2 ? '🥈' : myRank === 3 ? '🥉' : '';

  return `
    <div class="player-challenge-row" onclick="${isAuto ? `openAllChallenges()` : `updateChallengeScore('${c.id}','${playerId}')`}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px">
        <div style="flex:1;min-width:0">
          <div style="font-family:'Anton';font-size:14px;text-transform:uppercase;letter-spacing:0.02em;line-height:1.2">${medal} ${esc(c.title)}</div>
          <div style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;margin-top:2px">${myRank}<sup>${myRank===1?'er':'ème'}</sup>/${total} · ${esc(c.metric)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
          <div style="text-align:right">
            <div style="font-family:'Anton';font-size:22px;color:var(--orange);line-height:1">${myScore}</div>
          </div>
          ${!isAuto ? `<button class="lb-quick-btn" onclick="event.stopPropagation();quickIncrementChallenge('${c.id}','${playerId}',1)">+1</button>` : `<span style="font-size:9px;color:var(--ink-4);font-family:'JetBrains Mono'">AUTO</span>`}
        </div>
      </div>
      <div class="lb-progress"><div class="lb-progress-fill" style="width:${pctOfMax}%"></div></div>
    </div>
  `;
}

function openAllChallenges() {
  openModal(`
    <div class="modal-header">
      <div class="modal-title">Tous les défis</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" style="padding:0">
      ${renderChallenges()}
    </div>
  `);
}

function playerEventRow(ev, playerId) {
  const responses = ev.responses || {};
  const r = responses[playerId];
  const isPresent = !r || r.status === 'present';
  const d = new Date(ev.date + 'T00:00:00');
  const day = d.getDate();
  const month = d.toLocaleDateString('fr-FR', { month: 'short' });
  const parentId = ev._parentId || ev.id;
  const instanceDate = ev._instanceDate || ev.date;
  const isMatch = ev.type === 'match';
  // Si match avec un matchId lié, on route vers la vue détail Match riche
  // (stats + selfie + vidéo + ressenti joueuse). Sinon (entraînement / match
  // sans lien), fallback sur le modal d'événement générique.
  const linkedMatchId = isMatch && ev.matchId ? ev.matchId : null;
  const onClick = linkedMatchId
    ? `openMatch('${linkedMatchId}')`
    : `openEventInstance('${parentId}','${instanceDate}')`;
  // Badge "MATCH" pour différencier visuellement
  const matchBadge = isMatch ? '<span class="chip chip-orange" style="font-size:8px;padding:2px 5px;margin-left:6px;vertical-align:middle">MATCH</span>' : '';
  return `
    <div class="list-row" onclick="${onClick}">
      <div class="event-date-badge" style="background:${isPresent ? 'var(--green-soft)' : 'var(--red-soft)'};border-color:${isPresent ? 'rgba(34,197,94,0.3)' : 'rgba(239,68,68,0.3)'}">
        <div class="event-date-day" style="color:${isPresent ? 'var(--green)' : 'var(--red)'}">${day}</div>
        <div class="event-date-month">${month}</div>
      </div>
      <div class="list-row-content">
        <div class="list-row-title">${esc(ev.title)}${matchBadge}</div>
        <div class="list-row-subtitle">${ev.time ? ev.time + ' · ' : ''}<span style="color:${isPresent?'var(--green)':'var(--red)'}">${isPresent ? '✓ Présente' : '✕ Absente'}</span></div>
      </div>
      <span class="list-row-trail">›</span>
    </div>
  `;
}

function playerToggleAbsence(cid) {
  const p = currentPlayer();
  if (!p) return;
  const c = state.convocations.find(x => x.id === cid);
  if (!c) return;
  const r = (c.responses || {})[p.id];
  const isPresent = !r || r.status === 'present';

  if (!isPresent) {
    // Currently absent → reset to present
    delete c.responses[p.id];
    persist(); render(); return;
  }

  // Declare absence
  openModal(`
    <div class="modal-header">
      <div class="modal-title">Signaler absence</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div style="font-size:12px;color:var(--ink-3);margin-bottom:14px;font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.05em">${esc(c.title)} · ${formatDate(c.date, 'long')}</div>
      <div class="fld">
        <label class="fld-label">Raison</label>
        <select id="ab-reason">${ABSENCE_REASONS.map(r => `<option value="${r}">${r}</option>`).join('')}</select>
      </div>
      <div class="fld">
        <label class="fld-label">Mot pour l'équipe (optionnel)</label>
        <textarea id="ab-msg" placeholder="Ex : Désolée, je serai de retour la semaine prochaine"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="confirmPlayerAbsence('${cid}')">Confirmer absence</button>
    </div>
  `);
}
function confirmPlayerAbsence(cid) {
  const p = currentPlayer(); if (!p) return;
  const c = state.convocations.find(x => x.id === cid); if (!c) return;
  c.responses = c.responses || {};
  c.responses[p.id] = {
    status: 'absent',
    reason: document.getElementById('ab-reason').value,
    message: document.getElementById('ab-msg').value.trim(),
  };
  persist(); closeModal(); render();
}

// ============================================================
// PLAYS
// ============================================================
function renderPlays() {
  if (state.view && state.view.type === 'play') return renderPlayDetail();

  // Fallback : si state.playsCat est invalide (legacy 'all' ou cat supprimée), revenir à 'off'
  if (!PLAY_CATEGORIES.some(c => c.id === state.playsCat)) state.playsCat = 'off';

  const isCoach = state.auth.role === 'coach';
  const readOnly = isCurrentSeasonReadOnly();

  // SAISON : filtre les plays par saison via state.seasonPlays. Si aucune
  // liaison n'existe pour la saison courante (cas migration : DB pas encore
  // poussée), on retombe sur state.plays complet (mode legacy). Le coach
  // peut basculer state._showInactivePlays pour voir aussi les plays
  // désactivés sur cette saison (badge "inactif").
  const includeInactive = isCoach && !!state._showInactivePlays;
  const seasonId = state.currentSeasonId;
  const hasSeasonLinks = !!seasonId && (state.seasonPlays || []).some(sp => sp.seasonId === seasonId);

  // Plays "linkés" (présents dans season_plays pour cette saison) — actifs
  // et éventuellement inactifs. On utilise getSeasonPlays qui ajoute
  // _seasonActive sur chaque play.
  const linkedPlays = hasSeasonLinks
    ? getSeasonPlays(seasonId, { includeInactive })
    : (state.plays || []);

  // Plays orphelins : pas de link season_plays pour cette saison. Surfacés
  // au coach uniquement, dans une section dédiée "Plays disponibles".
  // Cas typique : un play créé après la saison, ou non cloné.
  let orphanPlays = [];
  if (isCoach && hasSeasonLinks && _seasonsLoaded()) {
    const linkedIds = new Set(
      (state.seasonPlays || [])
        .filter(sp => sp.seasonId === seasonId)
        .map(sp => sp.playId)
    );
    orphanPlays = (state.plays || []).filter(p => !linkedIds.has(p.id));
  }

  let items = linkedPlays.filter(p => p.cat === state.playsCat);
  if (state.playsTag) items = items.filter(p => (p.tags || []).includes(state.playsTag));

  let orphanItems = orphanPlays.filter(p => p.cat === state.playsCat);
  if (state.playsTag) orphanItems = orphanItems.filter(p => (p.tags || []).includes(state.playsTag));

  // Tags pertinents seulement pour la catégorie courante (basé sur le pool saison)
  const usedTags = [...new Set(linkedPlays.filter(p => p.cat === state.playsCat).flatMap(p => p.tags || []))].sort();

  // NB: le toggle activer/désactiver par saison a été déplacé dans la modal
  // d'édition du play (cf renderPlayEditor → togglePlayEditorSeasonActive).
  // Sur la carte, seul un indicateur visuel discret subsiste (dim opacity +
  // badge "⚪ Inactif" via playTile.opts.seasonActive). Pour modifier l'état,
  // ouvrir le play et utiliser le wizard d'édition.

  return `
    <div class="fade-up">
      <div class="section-header">
        <div>
          <div class="eyebrow-muted">${items.length} ${items.length > 1 ? 'plays' : 'play'}${orphanItems.length > 0 ? ' · ' + orphanItems.length + ' dispo' : ''}</div>
          <h2 class="display-lg mt-2">Playbook</h2>
        </div>
        ${isCoach ? `<button class="btn btn-primary" onclick="editPlay()">+ NOUVEAU</button>` : ''}
      </div>

      <div class="segmented">
        ${PLAY_CATEGORIES.map(c => `
          <button class="segmented-btn ${state.playsCat === c.id ? 'active' : ''}" onclick="setPlaysCat('${c.id}')">${c.label}</button>
        `).join('')}
      </div>

      ${isCoach && hasSeasonLinks ? `
        <div style="padding:0 18px 10px">
          <label style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:11px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.05em">
            <input type="checkbox" ${state._showInactivePlays ? 'checked' : ''} onchange="toggleShowInactivePlays()">
            <span>Afficher les plays inactifs</span>
          </label>
        </div>
      ` : ''}

      ${usedTags.length > 0 ? `
        <div style="padding:0 18px 14px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none">
          <button class="chip ${!state.playsTag ? 'chip-orange' : ''}" onclick="setPlaysTag(null)" style="cursor:pointer">Tous tags</button>
          ${usedTags.map(t => `
            <button class="chip ${state.playsTag === t ? 'chip-orange' : ''}" onclick="setPlaysTag('${esc(t).replace(/'/g, "\\'")}')" style="cursor:pointer;flex-shrink:0">${esc(t)}</button>
          `).join('')}
        </div>
      ` : ''}

      ${items.length === 0 ? `
        <div class="empty">
          <div class="empty-icon">○</div>
          <div class="empty-title">Aucun play</div>
          <div class="empty-desc">${isCoach ? 'Crée ton premier play' : 'Aucun play dans cette catégorie'}</div>
        </div>
      ` : `
        <div class="plays-grid">
          ${items.map(p => playTile(p, {
            seasonActive: p._seasonActive,
            dimmed: hasSeasonLinks && p._seasonActive === false
          })).join('')}
        </div>
      `}

      ${isCoach && orphanItems.length > 0 && !readOnly ? `
        <div class="section-header" style="margin-top:18px">
          <div>
            <div class="eyebrow-muted">Pas dans la saison</div>
            <h2 class="display-md mt-2">Plays disponibles</h2>
          </div>
        </div>
        <div style="padding:0 18px 10px;font-size:11px;color:var(--ink-3);font-family:'JetBrains Mono';line-height:1.5">
          Ces plays existent dans le catalogue mais ne sont pas rattachés à la saison courante. Ajoute-les pour les rendre visibles aux joueuses.
        </div>
        <div class="plays-grid">
          ${orphanItems.map(p => playTile(p, {
            seasonOrphan: true,
            dimmed: true,
            seasonToggleBtn: `
              <button class="btn btn-ghost" style="font-size:10px;padding:8px 10px;border-top:1px solid var(--border);border-radius:0;width:100%;text-align:center;color:var(--orange)"
                onclick="event.stopPropagation();addPlayToCurrentSeason('${esc(p.id)}')">
                + Ajouter à la saison
              </button>`
          })).join('')}
        </div>
      ` : ''}
    </div>
  `;
}

function toggleShowInactivePlays() {
  state._showInactivePlays = !state._showInactivePlays;
  render();
}

// SAISON · Bascule actif/inactif d'un play pour la saison courante.
// Met à jour le link season_plays.active (true → false ou inverse). Si pas
// de link existant (cas orphan), on en crée un en actif (cas rare via cette
// fonction, normalement addPlayToCurrentSeason est utilisée).
// NB: variante depuis le wizard d'édition (modal) : togglePlayEditorSeasonActive.
function toggleSeasonPlayActive(playId) {
  const seasonId = state.currentSeasonId;
  if (!seasonId) return;
  if (isCurrentSeasonReadOnly()) return;
  state.seasonPlays = state.seasonPlays || [];
  const link = state.seasonPlays.find(sp => sp.seasonId === seasonId && sp.playId === playId);
  if (link) {
    link.active = !(link.active !== false); // toggle (default true)
  } else {
    state.seasonPlays.push({ seasonId, playId, active: true });
  }
  persist();
  render();
}

// SAISON · Bascule depuis le wizard d'édition d'un play. Identique à
// toggleSeasonPlayActive mais re-render la modal d'édition au lieu de la vue
// (sinon la modal est fermée par render() global).
function togglePlayEditorSeasonActive() {
  if (!state._editingPlay) return;
  const seasonId = state.currentSeasonId;
  if (!seasonId) return;
  if (isCurrentSeasonReadOnly()) return;
  const playId = state._editingPlay.id;
  state.seasonPlays = state.seasonPlays || [];
  const link = state.seasonPlays.find(sp => sp.seasonId === seasonId && sp.playId === playId);
  if (link) {
    link.active = !(link.active !== false);
  } else {
    state.seasonPlays.push({ seasonId, playId, active: true });
  }
  persist();
  const isNew = state.plays.findIndex(x => x.id === playId) === -1;
  renderPlayEditor(isNew);
}

// SAISON · Ajoute un play (orphan) à la saison courante en actif.
function addPlayToCurrentSeason(playId) {
  const seasonId = state.currentSeasonId;
  if (!seasonId) return;
  if (isCurrentSeasonReadOnly()) return;
  state.seasonPlays = state.seasonPlays || [];
  const existing = state.seasonPlays.find(sp => sp.seasonId === seasonId && sp.playId === playId);
  if (existing) {
    existing.active = true;
  } else {
    state.seasonPlays.push({ seasonId, playId, active: true });

// Pour les vidéos Vimeo sans orientation, fetch oEmbed pour deviner
// (height > width = vertical). Persiste le résultat dans state + Supabase.
async function _autoDetectVimeoOrientations(playId) {
  const p = state.plays.find(x => x.id === playId);
  if (!p || !p.videos || !p.videos.length) return;
  let changed = false;
  for (const video of p.videos) {
    if (video.orientation) continue; // déjà set
    if (!video.url) continue;
    if (!/vimeo\.com/i.test(video.url)) continue;
    try {
      const oembedUrl = 'https://vimeo.com/api/oembed.json?url=' + encodeURIComponent(video.url);
      const res = await fetch(oembedUrl);
      if (!res.ok) continue;
      const data = await res.json();
      if (data.width && data.height) {
        video.orientation = data.height > data.width ? 'vertical' : 'horizontal';
        changed = true;
      }
    } catch (e) { /* swallow : oEmbed peut échouer si vidéo privée */ }
  }
  if (changed) {
    persist();
    if (typeof scheduleRender === 'function') scheduleRender(); else render();
  }
}

// === Gestion images play ===
// Upload via Supabase Storage (bucket 'play-images') puis push de la PUBLIC URL
// dans state._editingPlay.images. Avant : on stockait du base64 inline (~100 KB
// chacune) en localStorage → 5 MB quota → save() silent fail → image perdue
// au reload, ET aucune sync cross-device (la colonne plays.images n'existait
// même pas en DB). Maintenant : URL dans la jsonb → ~100 octets / image, sync
// instant via realtime, pas de quota localStorage.
async function addPlayImages(event) {
  const files = Array.from(event.target.files || []);
  if (!files.length) return;
  if (!window.sb || !window.Pb || !window.Pb.online) {
    alert('⚠ Hors ligne. Reconnecte-toi pour ajouter des images.');
    event.target.value = '';
    return;
  }
  const remaining = Math.max(0, 8 - (state._editingPlay.images || []).length);
  if (remaining === 0) {
    alert('⚠ Max 8 images par play. Retire-en une pour pouvoir en ajouter.');
    event.target.value = '';
    return;
  }
  const toProcess = files.slice(0, remaining);
  if (files.length > remaining) {
    alert(`⚠ ${files.length - remaining} image(s) ignorée(s) (max 8 / play)`);
  }
  const errors = [];
  const playId = state._editingPlay.id;
  for (const file of toProcess) {
    try {
      // Compression côté client → Blob JPEG. maxDim 900 / 0.75 → ~80-150 KB.
      const blob = await compressImageBlob(file, 900, 0.75);
      const fname = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
      const path = `${playId}/${fname}`;
      const { error: upErr } = await sb.storage.from('play-images').upload(path, blob, {
        contentType: 'image/jpeg', cacheControl: '31536000', upsert: false
      });
      if (upErr) throw upErr;
      const { data: pub } = sb.storage.from('play-images').getPublicUrl(path);
      const url = pub && pub.publicUrl;
      if (!url) throw new Error('publicUrl manquante');
      state._editingPlay.images.push(url);
    } catch (e) {
      console.error('[addPlayImages]', file.name, e && e.message ? e.message : e);
      errors.push(file.name);
    }
  }
  event.target.value = '';
  if (errors.length) {
    alert(`⚠ Échec sur ${errors.length} image(s) : ${errors.slice(0,3).join(', ')}\n\nVérifie ta connexion puis recommence.`);
  }
  const isNew = state.plays.findIndex(x => x.id === state._editingPlay.id) === -1;
  renderPlayEditor(isNew);
}

function removePlayImage(idx) {
  const arr = state._editingPlay.images || [];
  const url = arr[idx];
  arr.splice(idx, 1);
  // Best-effort : si c'est une URL Storage de notre bucket, on tente la suppr
  // côté serveur pour ne pas accumuler des orphelins. On n'attend pas le
  // résultat (UI doit rester fluide) et on swallow les erreurs.
  if (typeof url === 'string' && url.includes('/play-images/') && window.sb) {
    const m = url.match(/\/play-images\/(.+?)(?:\?|$)/);
    if (m && m[1]) {
      sb.storage.from('play-images').remove([decodeURIComponent(m[1])]).catch(() => {});
    }
  }
  const isNew = state.plays.findIndex(x => x.id === state._editingPlay.id) === -1;
  renderPlayEditor(isNew);
}

function movePlayImage(idx, delta) {
  const arr = state._editingPlay.images;
  const newIdx = idx + delta;
  if (newIdx < 0 || newIdx >= arr.length) return;
  const tmp = arr[idx]; arr[idx] = arr[newIdx]; arr[newIdx] = tmp;
  const isNew = state.plays.findIndex(x => x.id === state._editingPlay.id) === -1;
  renderPlayEditor(isNew);
}

// === Gestion concepts play ===
function togglePlayConcept(label) {
  const p = state._editingPlay;
  if (p.concepts.includes(label)) {
    p.concepts = p.concepts.filter(c => c !== label);
  } else {
    p.concepts.push(label);
  }
  const isNew = state.plays.findIndex(x => x.id === p.id) === -1;
  renderPlayEditor(isNew);
}

  openModal(`
    <div class="modal-header">
      <div class="modal-title">🧠 Concepts</div>
      <button class="modal-close" onclick="closeModal();setTimeout(()=>renderPlayEditor(${state.plays.findIndex(x => x.id === p.id) === -1}),50)">✕</button>
    </div>
    <div class="modal-body">
      <div style="padding:10px 12px;background:var(--bg-3);border-left:3px solid var(--orange);border-radius:6px;margin-bottom:14px;font-size:11px;color:var(--ink-2);line-height:1.5">
        Tap pour ajouter/retirer. Tu peux aussi créer un concept custom en bas.
      </div>
      ${Object.entries(byCategory).map(([cat, concepts]) => `
        <div style="margin-bottom:14px">
          <div class="eyebrow-muted" style="margin-bottom:6px;color:${CONCEPT_CAT_COLORS[cat]}">${CONCEPT_CAT_LABELS[cat]}</div>
          <div style="display:flex;flex-wrap:wrap;gap:4px">
            ${concepts.map(c => {
              const selected = p.concepts.includes(c.label);
              return `<button class="concept-chip ${selected?'selected':''}" style="--color:${CONCEPT_CAT_COLORS[cat]}" onclick="togglePlayConceptInPicker('${esc(c.label).replace(/'/g, "\\'")}')">${selected?'✓ ':'+'} ${esc(c.label)}</button>`;
            }).join('')}
          </div>
        </div>
      `).join('')}

      <div style="padding-top:14px;border-top:1px solid var(--border-soft);margin-top:14px">
        <div class="eyebrow-muted" style="margin-bottom:8px">+ Créer un concept custom</div>
        <div style="display:flex;gap:6px">
          <input id="new-concept" placeholder="Ex : Inversion rapide" style="flex:1;background:var(--bg-1);border:1px solid var(--border);border-radius:6px;color:var(--ink);padding:8px 10px;font-size:13px;outline:none">
          <button class="btn btn-primary" onclick="addCustomConcept()">Ajouter</button>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary btn-block" onclick="closeModal();setTimeout(()=>renderPlayEditor(${state.plays.findIndex(x => x.id === p.id) === -1}),50)">Terminé (${p.concepts.length})</button>
    </div>
  `);
}

function togglePlayConceptInPicker(label) {
  const p = state._editingPlay;
  if (p.concepts.includes(label)) {
    p.concepts = p.concepts.filter(c => c !== label);
  } else {
    p.concepts.push(label);
  }
  openConceptPicker(); // re-render picker
}

function addCustomConcept() {
  const input = document.getElementById('new-concept');
  const val = (input?.value || '').trim();
  if (!val) return;
  state.customConcepts = state.customConcepts || [];
  if (!state.customConcepts.includes(val) && !Object.values(DEFAULT_CONCEPTS).some(list => list.includes(val))) {
    state.customConcepts.push(val);
  }
  // Et l'ajouter au play en cours
  if (!state._editingPlay.concepts.includes(val)) {
    state._editingPlay.concepts.push(val);
  }
  persist();
  openConceptPicker();
}
function savePlay(id, isNew) {
  try {
    const title = document.getElementById('p-title').value.trim();
    if (!title) return alert('Titre requis');
    const e = state._editingPlay;
    if (!e) return alert('Session édition perdue. Réouvre le play.');
    // Lire les vidéos depuis le DOM (les rows ont pu être ajoutées/supprimées)
    _syncPlayEditorVideoInputs();
    const videos = (e.videos || []).filter(v => v.url && v.url.trim())
      .map(v => ({
        url: v.url.trim(),
        ...(v.label ? { label: v.label.trim() } : {}),
        orientation: v.orientation === 'vertical' ? 'vertical' : 'horizontal'
      }));
    const obj = {
      id, title,
      cat: document.getElementById('p-cat').value,
      videos: videos,
      videoUrl: videos[0] ? videos[0].url : '',  // legacy : 1re vidéo
      desc: document.getElementById('p-desc').value.trim(),
      tags: document.getElementById('p-tags').value.split(',').map(t => t.trim().toLowerCase()).filter(Boolean),
      images: e.images || [],
      concepts: e.concepts || [],
      attachments: e.attachments || [],
    };
    // Backup avant mutation : si persist throw quota, on rollback pour éviter
    // un état mémoire orphelin (visible mais pas sauvé → perdu au reload)
    const backup = state.plays.slice();
    if (isNew) state.plays.unshift(obj);
    else { const i = state.plays.findIndex(x => x.id === id); state.plays[i] = obj; }
    state._editingPlay = null;
    // persist() ne throw plus (save() catch maintenant), donc on continue toujours
    persist();
    closeModal();
    render();
  } catch (err) {
    console.error('[savePlay]', err);
    alert('⚠ Erreur sauvegarde play : ' + (err && err.message ? err.message : err));
  }
}
function deletePlay(id) {
  if (!confirm('Supprimer ce play ?')) return;
  state.plays = state.plays.filter(x => x.id !== id);
  state.view = null;
  persist(); render();
}
