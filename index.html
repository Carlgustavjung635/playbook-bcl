<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Playbook BCL</title>
<meta name="description" content="Playbook BCL — IE-Basket Club l'Islois : plays, matchs, convocations, stats.">
<meta name="theme-color" content="#000000">
<meta name="background-color" content="#000000">
<meta name="color-scheme" content="dark">
<!-- PWA manifest -->
<link rel="manifest" href="/manifest.json">
<!-- iOS / Safari standalone -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Playbook BCL">
<!-- Android Chrome -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Playbook BCL">
<!-- Icons -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --bg-1: #0a0a0a;
    --bg-2: #141414;
    --bg-3: #1c1c1c;
    --surface: #181818;
    --surface-2: #222222;
    --border: #2a2a2a;
    --border-soft: #1f1f1f;
    --ink: #ffffff;
    --ink-2: #b8b8b8;
    --ink-3: #707070;
    --ink-4: #4a4a4a;

    --orange: #ff6b00;
    --orange-2: #ff8533;
    --orange-soft: rgba(255, 107, 0, 0.12);
    --orange-glow: rgba(255, 107, 0, 0.3);

    --green: #22c55e;
    --green-soft: rgba(34, 197, 94, 0.12);
    --red: #ef4444;
    --red-soft: rgba(239, 68, 68, 0.12);
    --blue: #3b82f6;
    --blue-soft: rgba(59, 130, 246, 0.12);
    --yellow: #eab308;
    --yellow-soft: rgba(234, 179, 8, 0.12);
    --purple: #a855f7;
    --purple-soft: rgba(168, 85, 247, 0.12);

    --radius: 10px;
    --radius-sm: 6px;
    --radius-lg: 16px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  html { background: #000000; height: 100%; }
  /* CRITIQUE (fix scroll past footer iOS) : on lock le BODY à la hauteur
     du viewport et on désactive son overflow. Le scroll vertical est délégué
     au container .app (interne). Avant : body avait min-height:100dvh, donc
     pouvait grandir au-delà → iOS Safari révélait une zone vide sous le
     footer fixed quand l'URL bar collapse / au rebond. Avec body en height
     fixé + overflow:hidden, plus rien ne dépasse car le body ne scrolle pas. */
  body {
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
  }
  .font-display { font-family: 'Anton', sans-serif; letter-spacing: 0.01em; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }

  /* ========== APP SHELL ========== */
  /* .app devient le container scrollable principal. Sa hauteur = viewport
     dynamic (dvh) donc s'adapte quand URL bar iOS collapse/expand. */
  .app {
    max-width: 480px; margin: 0 auto;
    height: 100dvh;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    background: var(--bg);
    padding-bottom: calc(72px + env(safe-area-inset-bottom));
  }
  @media (min-width: 768px) {
    .app {
      max-width: 560px;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }
  }
  /* Bottom nav reste fixed : il flotte au-dessus du scroll interne du .app.
     Comme .app a padding-bottom pour réserver la zone, le contenu ne passe
     jamais sous la nav. */

  /* ========== TOP BAR ========== */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    padding: 14px 18px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border-soft);
  }
  .topbar-logo {
    display: flex; align-items: center; gap: 10px;
  }
  .topbar-orb {
    width: 32px; height: 32px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ff8533, var(--orange));
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    box-shadow: 0 0 16px var(--orange-glow);
  }
  .topbar-title {
    font-family: 'Anton', sans-serif;
    font-size: 18px; letter-spacing: 0.04em;
  }
  .topbar-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; color: var(--orange);
    text-transform: uppercase; letter-spacing: 0.18em;
    margin-top: -2px;
  }
  .role-badge {
    padding: 4px 8px; border-radius: 999px;
    background: var(--orange-soft); color: var(--orange);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em;
    font-weight: 700;
    border: 1px solid rgba(255, 107, 0, 0.3);
  }

  /* ========== BOTTOM NAV ========== */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
    background: rgba(0, 0, 0, 0.92);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: 1px solid var(--border);
    padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
    display: flex; justify-content: space-around;
  }
  @media (min-width: 768px) {
    .bottom-nav {
      max-width: 560px; left: 50%; transform: translateX(-50%);
      border-left: 1px solid var(--border); border-right: 1px solid var(--border);
    }
  }
  .nav-btn {
    flex: 1; min-width: 0; background: none; border: none;
    padding: 8px 4px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    color: var(--ink-3); transition: color 0.15s;
  }
  .nav-btn:active { color: var(--ink-2); }
  .nav-btn.active { color: var(--orange); }
  .nav-btn-icon {
    font-size: 20px; line-height: 1;
    font-family: 'Anton', sans-serif;
  }
  .nav-btn-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* Très petits écrans (< 360px) : 6 onglets joueuse → rogne le letter-spacing
     pour ne pas wrap le label. */
  @media (max-width: 359px) {
    .nav-btn { padding: 8px 2px; }
    .nav-btn-label { font-size: 8px; letter-spacing: 0.02em; }
  }

  /* ========== TYPOGRAPHY ========== */
  .display-xl {
    font-family: 'Anton', sans-serif;
    font-size: 48px; line-height: 0.95;
    letter-spacing: 0.005em;
    text-transform: uppercase;
  }
  .display-lg {
    font-family: 'Anton', sans-serif;
    font-size: 32px; line-height: 1;
    text-transform: uppercase;
  }
  .display-md {
    font-family: 'Anton', sans-serif;
    font-size: 22px; line-height: 1;
    text-transform: uppercase;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.15em; color: var(--orange);
    font-weight: 600;
  }
  .eyebrow-muted {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--ink-3);
    font-weight: 500;
  }

  /* ========== SECTION HEADERS ========== */
  .section-header {
    padding: 20px 18px 10px;
    display: flex; align-items: end; justify-content: space-between;
    gap: 12px;
  }
  .section-action {
    background: none; border: none; color: var(--orange);
    font-size: 12px; font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase; letter-spacing: 0.1em;
    cursor: pointer; padding: 4px 0;
  }
  .section-action:active { opacity: 0.6; }

  /* ========== CARDS ========== */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
    transition: all 0.15s; cursor: pointer;
  }
  .card:active { transform: scale(0.98); }

  /* HERO CARD (next event) */
  .hero-card {
    margin: 0 18px 14px;
    background: linear-gradient(135deg, var(--orange) 0%, #cc5500 100%);
    color: white;
    border-radius: var(--radius-lg);
    padding: 22px 20px;
    position: relative; overflow: hidden;
    cursor: pointer;
  }
  .hero-card::before {
    content: ''; position: absolute;
    inset: 0;
    background: radial-gradient(circle at top right, rgba(255,255,255,0.15), transparent 50%);
    pointer-events: none;
  }
  .hero-card::after {
    content: '🏀'; position: absolute;
    right: -30px; bottom: -30px;
    font-size: 180px; opacity: 0.08;
    transform: rotate(-15deg);
  }
  .hero-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.15em; color: rgba(255,255,255,0.85);
    margin-bottom: 8px; font-weight: 700;
  }
  .hero-title {
    font-family: 'Anton', sans-serif;
    font-size: 30px; line-height: 1; text-transform: uppercase;
    letter-spacing: 0.01em; margin-bottom: 14px;
    position: relative;
  }
  .hero-meta {
    display: flex; gap: 14px; flex-wrap: wrap;
    font-size: 12px; color: rgba(255,255,255,0.95);
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase; letter-spacing: 0.05em;
    position: relative;
  }
  .hero-cta {
    margin-top: 16px; padding: 11px 16px;
    background: black; color: white;
    border-radius: 8px; font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
    border: none; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    position: relative;
  }

  /* SCROLL ROW (horizontal) */
  .scroll-row {
    display: flex; gap: 10px; padding: 0 18px 4px;
    overflow-x: auto; scrollbar-width: none;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
  }
  .scroll-row::-webkit-scrollbar { display: none; }
  .scroll-row > * { scroll-snap-align: start; flex-shrink: 0; }

  /* VIDEO TILE */
  .v-tile {
    width: 100%;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
    cursor: pointer; transition: transform 0.15s, border-color 0.15s;
  }
  .v-tile:hover { border-color: var(--orange); }
  /* Dans un carousel horizontal : largeur fixe pour effet "peek" cohérent */
  .scroll-row .v-tile { width: 138px; flex-shrink: 0; }
  @media (min-width: 768px) {
    .scroll-row .v-tile { width: 150px; }
  }
  .v-tile:active { transform: scale(0.96); }
  /* Grid responsive : 2 col mobile par défaut, 3 col >= 720px, 4 col >= 1100px */
  .plays-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    padding: 0 18px;
  }
  @media (min-width: 720px) { .plays-grid { grid-template-columns: repeat(3, 1fr); gap: 14px; } }
  @media (min-width: 1100px) { .plays-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; } }
  /* Lazy YouTube embed : thumbnail + bouton play, devient iframe au clic */
  .yt-lazy {
    position: relative; width: 100%; height: 100%;
    cursor: pointer; background: #000; border: 0;
    padding: 0; margin: 0; display: block; overflow: hidden;
  }
  .yt-lazy img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform 0.4s, opacity 0.2s;
  }
  .yt-lazy:hover img { transform: scale(1.04); opacity: 0.85; }
  .yt-lazy-play {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 68px; height: 48px;
    background: rgba(0, 0, 0, 0.75);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 22px;
    pointer-events: none;
    transition: background 0.2s;
  }
  .yt-lazy:hover .yt-lazy-play { background: rgba(255, 0, 0, 0.92); }
  .v-tile-media {
    aspect-ratio: 9/16;
    background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  /* Thumbnails dans tuiles : pas interactifs (juste preview) */
  .v-tile-media iframe, .v-tile-media video, .v-tile-media img {
    width: 100%; height: 100%; border: 0;
    object-fit: cover; pointer-events: none;
  }
  /* Lecteur vidéo : iframe embed propre */
  .video-wrap {
    padding: 0 18px;
    margin-bottom: 14px;
  }
  .video-player {
    position: relative;
    width: 100%;
    background: #000;
    border-radius: var(--radius);
    overflow: hidden;
  }
  .video-player.horizontal {
    aspect-ratio: 16 / 9;
  }
  .video-player.vertical {
    aspect-ratio: 9 / 16;
    max-width: 100%;
    margin: 0 auto;
  }
  /* Onglets vidéos pour les plays multi-vidéos */
  .video-tabs {
    display: flex; gap: 6px; padding: 0 18px 8px;
    overflow-x: auto; scrollbar-width: none;
  }
  .video-tabs::-webkit-scrollbar { display: none; }
  .video-tab {
    flex-shrink: 0;
    padding: 7px 12px;
    background: var(--bg-2); border: 1px solid var(--border);
    color: var(--ink-2);
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    font-weight: 600; letter-spacing: 0.04em;
    cursor: pointer; transition: all 0.15s;
  }
  .video-tab:hover { border-color: var(--orange); color: var(--ink); }
  .video-tab.active {
    background: var(--orange); border-color: var(--orange);
    color: black;
  }
  /* Lignes URL+label pour l'édition multi-vidéos */
  .video-edit-row {
    display: flex; gap: 6px; margin-bottom: 6px;
    align-items: center;
  }
  .video-edit-row input { flex: 1; min-width: 0; }
  .video-edit-row input.label-input { max-width: 130px; }
  .video-player iframe,
  .video-player video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
  .video-open-link {
    display: block;
    text-align: center;
    margin-top: 8px;
    padding: 8px 12px;
    color: var(--ink-3);
    text-decoration: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border: 1px solid var(--border);
    border-radius: 6px;
    transition: all 0.15s;
  }
  .video-open-link:active,
  .video-open-link:hover {
    color: var(--orange);
    border-color: var(--orange);
  }
  .v-tile-media-emoji {
    font-family: 'Anton', sans-serif;
    font-size: 48px; color: var(--ink-4);
  }
  .v-tile-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 18px 12px;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(255,107,0,0.06), var(--bg-2));
    text-align: center;
  }
  .v-tile-placeholder-icon {
    font-size: 36px;
    line-height: 1;
    opacity: 0.85;
  }
  .v-tile-placeholder-tags {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    line-height: 1.4;
    max-width: 90%;
  }

  /* === V8: Plan d'entraînement === */
  .training-exo-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    transition: all 0.15s;
  }
  .training-exo-row:hover { border-color: var(--orange); }
  .training-exo-handle {
    color: var(--ink-3);
    font-size: 18px;
    line-height: 1;
    cursor: grab;
    padding: 0 4px;
    user-select: none;
  }
  .training-exo-num {
    font-family: 'Anton', sans-serif;
    font-size: 18px;
    color: var(--orange);
    min-width: 24px;
    text-align: center;
  }
  .training-exo-info {
    flex: 1;
    min-width: 0;
    cursor: pointer;
  }
  /* Picker plays (depuis bibliothèque) */
  .picker-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--bg-2);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .picker-row:active { transform: scale(0.99); }
  .picker-row:hover { border-color: var(--orange); }
  /* Carte groupe dans détail exo */
  .group-card {
    padding: 10px 12px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  /* Chip joueuse (non assignée) */
  .player-chip {
    background: var(--bg-1);
    border: 1px solid var(--border);
    color: var(--ink-2);
    border-radius: 12px;
    padding: 4px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    cursor: pointer;
  }
  .player-chip:active { transform: scale(0.94); }
  .player-chip:hover { border-color: var(--orange); color: var(--orange); }
  /* Chip joueuse assignée à un groupe */
  .player-chip-assigned {
    background: rgba(255,107,0,0.15);
    border: 1px solid var(--orange);
    color: var(--orange);
    border-radius: 12px;
    padding: 4px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    cursor: pointer;
  }
  .player-chip-assigned:active { transform: scale(0.94); }
  /* Côté joueuse : exo à cocher */
  .player-exo-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 14px;
    background: var(--bg-2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .player-exo-row:active { transform: scale(0.99); }
  .player-exo-row.done {
    background: rgba(34,197,94,0.06);
    border-color: rgba(34,197,94,0.3);
  }
  /* === V8: Concept chips === */
  .concept-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 10px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    color: var(--ink-2);
    border-radius: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.12s;
  }
  .concept-chip:active { transform: scale(0.96); }
  .concept-chip.selected {
    background: color-mix(in srgb, var(--color, var(--orange)) 15%, var(--bg-2));
    border-color: var(--color, var(--orange));
    color: var(--color, var(--orange));
  }
  /* === V8: Galerie play (carrousel) === */
  .play-gallery {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    margin: 0 0 8px;
    padding: 0 18px;
  }
  .play-gallery::-webkit-scrollbar { display: none; }
  .play-gallery-slide {
    flex: 0 0 calc(100% - 36px);
    scroll-snap-align: center;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--bg-2);
    aspect-ratio: 3 / 4;
    max-height: 60vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .play-gallery-slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    cursor: zoom-in;
  }
  .play-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--ink-4);
    transition: all 0.2s;
  }
  .play-dot.active {
    background: var(--orange);
    width: 18px;
    border-radius: 3px;
  }
  .v-tile-badge {
    position: absolute; top: 8px; left: 8px;
    background: rgba(0,0,0,0.85); color: white;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; font-weight: 700;
    padding: 3px 7px; border-radius: 4px;
    text-transform: uppercase; letter-spacing: 0.08em;
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .v-tile-cat {
    position: absolute; bottom: 8px; left: 8px;
    background: var(--orange); color: black;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; font-weight: 800;
    padding: 3px 7px; border-radius: 4px;
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .v-tile-cat.def { background: var(--blue); color: white; }
  .v-tile-cat.rem { background: var(--red); color: white; }
  .v-tile-cat.sp { background: var(--purple); color: white; }
  .v-tile-cat.exo { background: var(--yellow); color: black; }
  .v-tile-cat.con { background: var(--green); color: black; }
  .v-tile-body { padding: 10px 12px 12px; }
  .v-tile-title {
    font-family: 'Anton', sans-serif;
    font-weight: 400; font-size: 14px; line-height: 1.1;
    text-transform: uppercase; letter-spacing: 0.02em;
    margin-bottom: 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .v-tile-meta {
    font-size: 11px; color: var(--ink-3); line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ========== STATS GRID ========== */
  .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 0 18px; }
  .stat-tile {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px;
    position: relative; overflow: hidden;
  }
  .stat-tile::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; height: 2px;
    background: var(--orange);
  }
  .stat-tile-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--ink-3);
    margin-bottom: 8px; font-weight: 600;
  }
  .stat-tile-value {
    font-family: 'Anton', sans-serif;
    font-size: 36px; line-height: 0.9;
  }
  .stat-tile-sub {
    font-size: 11px; color: var(--ink-3);
    margin-top: 4px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* ========== LIST ========== */
  .list-section {
    margin: 0 18px 14px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  .list-row {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border-soft);
    cursor: pointer; transition: background 0.15s;
  }
  .list-row:last-child { border-bottom: 0; }
  .list-row:active { background: var(--bg-3); }
  .list-row-icon {
    width: 36px; height: 36px; border-radius: 8px;
    background: var(--bg-3);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Anton', sans-serif; font-size: 16px;
    flex-shrink: 0; color: var(--orange);
  }
  .list-row-content { flex: 1; min-width: 0; }
  .list-row-title {
    font-family: 'Anton', sans-serif;
    font-size: 15px; line-height: 1.2;
    text-transform: uppercase; letter-spacing: 0.02em;
  }
  .list-row-subtitle {
    font-size: 12px; color: var(--ink-3); margin-top: 2px;
  }
  .list-row-trail { color: var(--ink-4); font-size: 16px; }

  /* ========== CHIPS ========== */
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 8px; border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
    background: var(--bg-3); color: var(--ink-2);
    white-space: nowrap;
    border: 1px solid var(--border);
  }
  .chip-orange { background: var(--orange-soft); color: var(--orange); border-color: rgba(255, 107, 0, 0.3); }
  .chip-green { background: var(--green-soft); color: var(--green); border-color: rgba(34, 197, 94, 0.3); }
  .chip-red { background: var(--red-soft); color: var(--red); border-color: rgba(239, 68, 68, 0.3); }
  .chip-blue { background: var(--blue-soft); color: var(--blue); border-color: rgba(59, 130, 246, 0.3); }
  .chip-yellow { background: var(--yellow-soft); color: var(--yellow); border-color: rgba(234, 179, 8, 0.3); }
  .chip-purple { background: var(--purple-soft); color: var(--purple); border-color: rgba(168, 85, 247, 0.3); }

  /* ========== BUTTONS ========== */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 11px 16px; border-radius: var(--radius-sm);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    border: none; cursor: pointer;
    transition: all 0.15s;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary {
    background: var(--orange); color: black;
    box-shadow: 0 4px 16px rgba(255, 107, 0, 0.3);
  }
  .btn-primary:hover { background: var(--orange-2); }
  .btn-secondary {
    background: var(--surface-2); color: var(--ink);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--bg-3); border-color: var(--ink-4); }
  .btn-ghost {
    background: transparent; color: var(--ink-2);
    padding: 8px 12px; font-size: 10px;
  }
  .btn-ghost:hover { background: var(--bg-3); color: var(--ink); }
  .btn-danger { background: transparent; color: var(--red); padding: 8px 12px; font-size: 10px; }
  .btn-danger:hover { background: var(--red-soft); }
  .btn-block { width: 100%; }
  .btn-lg { padding: 14px 20px; font-size: 12px; }
  .btn-icon {
    width: 32px; height: 32px; padding: 0;
    background: var(--bg-3); color: var(--ink-2);
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  /* ========== FORMS ========== */
  /* Note : on exclut explicitement les checkbox/radio sinon la règle
     width:100% + padding + background les transforme en gros rectangles
     sombres (au lieu d'une vraie case native). */
  input:not([type="checkbox"]):not([type="radio"]), textarea, select {
    width: 100%; padding: 12px 14px;
    background: var(--bg-1); border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: inherit; font-size: 15px; color: var(--ink);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="checkbox"], input[type="radio"] {
    width: 18px; height: 18px;
    accent-color: var(--orange);
    cursor: pointer;
    flex-shrink: 0;
  }
  input::placeholder, textarea::placeholder { color: var(--ink-4); }
  input:not([type="checkbox"]):not([type="radio"]):focus, textarea:focus, select:focus {
    outline: none; border-color: var(--orange);
    box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.15);
  }
  textarea { min-height: 80px; resize: vertical; }
  .fld { margin-bottom: 12px; }
  .fld-label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--ink-3);
    margin-bottom: 6px; font-weight: 600;
  }
  .fld-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  /* ========== MODAL ========== */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100;
    backdrop-filter: blur(6px);
    display: flex; align-items: flex-end; justify-content: center;
    animation: fadeIn 0.2s;
  }
  @media (min-width: 640px) {
    .modal-bg { align-items: center; padding: 20px; }
  }
  .modal {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    max-width: 480px; width: 100%;
    max-height: 92vh; overflow-y: auto;
    animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    padding-bottom: env(safe-area-inset-bottom);
  }
  @media (min-width: 640px) {
    .modal { border-radius: var(--radius-lg); animation: scaleIn 0.2s ease-out; }
  }
  .modal-handle {
    width: 36px; height: 4px; border-radius: 2px;
    background: var(--ink-4); margin: 8px auto 0;
  }
  @media (min-width: 640px) { .modal-handle { display: none; } }
  .modal-header {
    padding: 18px 20px 14px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border-soft);
  }
  .modal-title {
    font-family: 'Anton', sans-serif;
    font-size: 20px; letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .modal-close {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--bg-3); border: 1px solid var(--border); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-2); font-size: 14px;
  }
  .modal-body { padding: 18px 20px; }
  .modal-footer {
    padding: 14px 20px;
    border-top: 1px solid var(--border-soft);
    display: flex; gap: 8px; justify-content: flex-end;
  }

  /* ========== EMPTY ========== */
  .empty {
    text-align: center; padding: 48px 20px;
  }
  .empty-icon {
    font-family: 'Anton', sans-serif;
    font-size: 64px; color: var(--ink-4);
    margin-bottom: 12px;
  }
  .empty-title {
    font-family: 'Anton', sans-serif;
    font-size: 18px; margin-bottom: 4px;
    text-transform: uppercase; letter-spacing: 0.02em;
  }
  .empty-desc {
    font-size: 13px; color: var(--ink-3); margin-bottom: 16px;
  }

  /* ========== ANIMATIONS ========== */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes scaleIn { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .fade-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }

  /* ========== MATCH ROW ========== */
  .match-row {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border-soft);
    cursor: pointer; transition: background 0.15s;
  }
  .match-row:last-child { border-bottom: 0; }
  .match-row:active { background: var(--bg-3); }
  .match-result-badge {
    width: 38px; height: 38px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Anton', sans-serif; font-size: 18px;
    flex-shrink: 0;
  }
  .match-result-w { background: var(--green-soft); color: var(--green); border: 1px solid rgba(34, 197, 94, 0.3); }
  .match-result-l { background: var(--red-soft); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.3); }
  .match-score {
    font-family: 'Anton', sans-serif;
    font-size: 22px; line-height: 1;
  }

  /* ========== TABLE STATS ========== */
  .stats-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .stats-table {
    min-width: 100%;
    width: max-content;
    border-collapse: collapse; font-size: 12px;
  }
  .stats-table th {
    text-align: left; padding: 10px 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--ink-3);
    border-bottom: 1px solid var(--border);
    font-weight: 700; background: var(--bg-2);
    white-space: nowrap;
  }
  .stats-table td {
    padding: 11px 8px; white-space: nowrap;
    border-bottom: 1px solid var(--border-soft);
    color: var(--ink);
  }
  .stats-table tr:last-child td { border-bottom: 0; }
  .stats-table tr:active { background: var(--bg-3); }
  .stats-total-row td {
    background: var(--bg-3); border-top: 2px solid var(--orange);
    font-weight: 700;
  }
  .stats-table .num {
    font-family: 'Anton', sans-serif; font-size: 15px;
  }
  .stats-table .pct {
    color: var(--ink-3); font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* ========== LEADERBOARD ========== */
  .lb-row {
    display: grid; grid-template-columns: 36px 1fr auto; gap: 12px;
    align-items: center; padding: 12px 16px;
    border-bottom: 1px solid var(--border-soft);
    cursor: pointer; transition: background 0.15s;
  }
  .lb-row:last-child { border-bottom: 0; }
  .lb-row:active { background: var(--bg-3); }
  .lb-medal {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Anton', sans-serif; font-size: 13px;
    background: var(--bg-3); color: var(--ink-2);
    border: 1px solid var(--border);
  }
  .lb-medal.gold { background: linear-gradient(135deg, #ffd700, #b8860b); color: #000; border-color: #ffd700; }
  .lb-medal.silver { background: linear-gradient(135deg, #d4d4d4, #888); color: #000; border-color: #c0c0c0; }
  .lb-medal.bronze { background: linear-gradient(135deg, #cd7f32, #8b4513); color: white; border-color: #cd7f32; }
  .lb-progress {
    height: 3px; background: var(--bg-3); border-radius: 2px;
    overflow: hidden; margin-top: 6px;
  }
  .lb-progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--orange), var(--yellow));
    transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* ========== CONVOC ========== */
  .convoc-chip {
    padding: 8px 12px; border-radius: 999px;
    background: var(--green-soft); color: var(--green);
    border: 1px solid rgba(34, 197, 94, 0.3);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em;
    cursor: pointer; transition: all 0.15s;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .convoc-chip:active { transform: scale(0.94); }
  .convoc-absent-row {
    display: flex; gap: 10px; padding: 12px;
    background: var(--red-soft);
    border: 1px solid rgba(239, 68, 68, 0.2);
    border-radius: 8px; margin-bottom: 6px;
  }

  /* ========== SEGMENTED ========== */
  .segmented {
    display: flex; padding: 3px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin: 0 18px 14px;
    overflow-x: auto; scrollbar-width: none;
  }
  .segmented::-webkit-scrollbar { display: none; }
  .segmented-btn {
    flex: 1; min-width: max-content;
    padding: 8px 12px;
    background: none; border: none; border-radius: 7px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-3); cursor: pointer;
    transition: all 0.15s; white-space: nowrap;
  }
  .segmented-btn.active {
    background: var(--orange); color: black;
    box-shadow: 0 2px 6px rgba(255, 107, 0, 0.3);
  }

  /* ========== DETAIL ========== */
  .detail-back {
    display: inline-flex; align-items: center; gap: 4px;
    background: none; border: none; cursor: pointer;
    color: var(--ink-2);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 14px 18px 0;
  }
  .detail-back:active { color: var(--orange); }
  .detail-title {
    font-family: 'Anton', sans-serif;
    font-size: 38px; line-height: 0.95;
    text-transform: uppercase;
    padding: 10px 18px 6px;
  }
  .detail-subtitle {
    color: var(--ink-3); font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 0 18px 16px;
  }

  /* ========== FAB ========== */
  .fab {
    position: fixed; bottom: 86px;
    right: max(18px, calc(50vw - 240px + 18px));
    z-index: 35;
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--orange); color: black;
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 300;
    box-shadow: 0 8px 24px rgba(255, 107, 0, 0.4);
    transition: all 0.2s;
  }
  .fab:active { transform: scale(0.92); }
  @media (min-width: 768px) {
    .fab { right: calc(50vw - 280px + 18px); }
  }
  @media (max-width: 480px) {
    .fab { right: 18px; }
  }

  /* ========== AUTH SCREEN ========== */
  .auth-screen {
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 30px 20px;
    background: var(--bg);
    position: relative; overflow: hidden;
  }
  .auth-bg-glow {
    position: absolute; width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--orange-soft), transparent 70%);
    top: -100px; right: -100px;
    pointer-events: none;
  }
  .auth-logo {
    width: 80px; height: 80px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ff8533, var(--orange));
    display: flex; align-items: center; justify-content: center;
    font-size: 44px;
    box-shadow: 0 0 60px var(--orange-glow), inset 0 0 30px rgba(0,0,0,0.3);
    margin-bottom: 24px;
    animation: pulseGlow 2.5s ease-in-out infinite;
  }
  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 60px var(--orange-glow), inset 0 0 30px rgba(0,0,0,0.3); }
    50% { box-shadow: 0 0 100px rgba(255, 107, 0, 0.5), inset 0 0 30px rgba(0,0,0,0.3); }
  }
  .auth-title {
    font-family: 'Anton', sans-serif;
    font-size: 38px; letter-spacing: 0.02em;
    text-align: center; margin-bottom: 4px;
    text-transform: uppercase;
  }
  .auth-subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--orange);
    text-transform: uppercase; letter-spacing: 0.2em;
    margin-bottom: 40px; text-align: center;
    font-weight: 700;
  }
  .role-picker {
    display: flex; flex-direction: column; gap: 10px;
    width: 100%; max-width: 320px;
  }
  .role-btn {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    display: flex; align-items: center; gap: 14px;
    cursor: pointer; transition: all 0.15s;
    text-align: left; width: 100%;
    color: var(--ink);
  }
  .role-btn:active { transform: scale(0.98); }
  .role-btn:hover { border-color: var(--orange); background: var(--bg-3); }
  .role-icon {
    width: 44px; height: 44px; border-radius: 10px;
    background: var(--bg-3); display: flex;
    align-items: center; justify-content: center;
    font-family: 'Anton', sans-serif; font-size: 20px;
    color: var(--orange); flex-shrink: 0;
  }
  .role-info { flex: 1; }
  .role-name {
    font-family: 'Anton', sans-serif;
    font-size: 16px; text-transform: uppercase; letter-spacing: 0.02em;
  }
  .role-desc {
    font-size: 12px; color: var(--ink-3); margin-top: 2px;
  }

  /* PIN PAD */
  .pin-display {
    display: flex; gap: 10px; justify-content: center;
    margin: 30px 0 20px;
  }
  .pin-dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--bg-3); border: 2px solid var(--border);
    transition: all 0.15s;
  }
  .pin-dot.filled { background: var(--orange); border-color: var(--orange); box-shadow: 0 0 12px var(--orange-glow); }
  .pin-pad {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    max-width: 280px; margin: 0 auto;
    touch-action: manipulation;
  }
  .pin-btn {
    aspect-ratio: 1; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--border);
    font-family: 'Anton', sans-serif; font-size: 26px;
    color: var(--ink); cursor: pointer;
    transition: all 0.1s;
    display: flex; align-items: center; justify-content: center;
    /* Désactive double-tap zoom natif iOS / Android */
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    /* Empêche le tap-highlight et le callout iOS */
    -webkit-touch-callout: none;
  }
  .pin-btn:active {
    background: var(--orange); color: black;
    transform: scale(0.92);
    box-shadow: 0 0 30px var(--orange-glow);
  }
  .pin-btn.action {
    font-size: 14px;
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-3);
  }

  /* PIN rate-limit lockout */
  .pin-pad.disabled .pin-btn {
    opacity: 0.3;
    cursor: not-allowed;
    pointer-events: none;
  }
  .pin-pad.disabled .pin-btn:active { transform: none; }
  .pin-lockout {
    margin: 0 auto 16px;
    max-width: 280px;
    padding: 16px;
    background: linear-gradient(135deg, rgba(239,68,68,0.08), rgba(239,68,68,0.02));
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: 12px;
    text-align: center;
  }
  .pin-lockout-icon {
    font-size: 28px;
    margin-bottom: 6px;
  }
  .pin-lockout-title {
    font-family: 'Anton', sans-serif;
    font-size: 14px;
    color: var(--red);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .pin-lockout-timer {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    font-weight: 700;
    color: var(--red);
    line-height: 1;
    margin-bottom: 8px;
    text-shadow: 0 0 12px rgba(239,68,68,0.3);
  }
  .pin-lockout-msg {
    font-size: 10px;
    color: var(--ink-3);
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  /* Selfie victoire */
  .win-selfie-wrap {
    margin: 0 18px 14px;
  }
  .win-selfie-frame {
    position: relative;
    border-radius: var(--radius-lg);
    overflow: hidden;
    border: 3px solid var(--orange);
    box-shadow: 0 12px 40px rgba(255,107,0,0.25), 0 0 80px rgba(255,107,0,0.1) inset;

<!-- ============================================================
     KILL-SWITCH SERVICE WORKER
     L'ancien SW bug avait été déployé. On désenregistre tout SW restant
     et on vide tous les caches. Le sw.js sur le serveur est aussi un
     kill-switch (no fetch listener, claim + reload + delete caches).
     ============================================================ -->
<script>
(function () {
  if (!('serviceWorker' in navigator)) return;
  // 1) Désenregistrer toute registration restante
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(r => r.unregister().catch(() => {}));
  }).catch(() => {});
  // 2) Vider tous les caches CacheStorage
  if ('caches' in window) {
    caches.keys().then(keys => keys.forEach(k => caches.delete(k).catch(() => {})))
      .catch(() => {});
  }
})();
</script>

<!-- ============================================================
     SUPABASE BACKEND — couche d'abstraction
     - L1 PIN : reste piloté côté client (verify_pin RPC en bonus)
     - L2 email/password : pour les données perso joueuse
     - Realtime : live score multi-device (#public)
     - Fallback : localStorage si Supabase indisponible
     ============================================================ -->
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://orertxlsvkdqayybgwaq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_pJwgqWwDDhhST6xh9IbzbA_a0ANDwUt';

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, storageKey: 'pb8_sb_auth' },
  realtime: { params: { eventsPerSecond: 10 } }
});

window.sb = sb;

// ---- État connectivité ----
const Pb = {
  ready: false,
  online: navigator.onLine,
  user: null,          // session Supabase (L2)
  profile: null,       // ligne profiles
  liveChannel: null,   // realtime channel actif (#public)
  statChannel: null,   // realtime channel stat'man (pour matches updates)
  playersChannel: null,// realtime channel sync effectif
  _dirtyQueue: [],     // ops à retry quand on revient online
  listeners: new Set(),
};
window.Pb = Pb;

function emit(evt, payload) {
  Pb.listeners.forEach(fn => { try { fn(evt, payload); } catch(e){ console.warn(e); } });
}

window.addEventListener('online',  () => { Pb.online = true;  emit('online');  flushQueue(); });
window.addEventListener('offline', () => { Pb.online = false; emit('offline'); });

async function flushQueue() {
  if (!Pb._dirtyQueue.length) return;
  const q = Pb._dirtyQueue.splice(0);
  for (const op of q) { try { await op(); } catch(e){ Pb._dirtyQueue.push(op); break; } }
}

// ---- Auth L2 ----
async function refreshSession() {
  const { data: { session } } = await sb.auth.getSession();
  Pb.user = session?.user || null;
  if (Pb.user) {
    const { data } = await sb.from('profiles').select('*').eq('user_id', Pb.user.id).maybeSingle();
    Pb.profile = data || null;
  } else {
    Pb.profile = null;
  }
  emit('auth', { user: Pb.user, profile: Pb.profile });
  // Email binding strict : à chaque (re)résolution de session cloud, on vérifie
  // la cohérence avec l'identité applicative liée. _enforceEmailBinding est
  // défini dans le script principal (classic, global) → accès via window depuis
  // ce module. Au boot il peut ne pas encore exister : guard + try/catch.
  try { if (typeof window._enforceEmailBinding === 'function') window._enforceEmailBinding(); } catch (e) {}
}

sb.auth.onAuthStateChange((_evt, _session) => { refreshSession(); });

window.SbAuth = {
  isAuthed: () => !!Pb.user,
  current: () => ({ user: Pb.user, profile: Pb.profile }),
  async signIn(email, password) {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    await refreshSession();
    return data;
  },
  async signUp(email, password, { displayName, role = 'player', playerId = null } = {}) {
    const { data, error } = await sb.auth.signUp({ email, password });
    if (error) throw error;
    // Le profil sera créé au premier login si la session est immédiate
    if (data.user) {
      await sb.from('profiles').upsert({
        user_id: data.user.id,
        display_name: displayName || email.split('@')[0],
        role, player_id: playerId
      });
    }
    await refreshSession();
    return data;
  },
  async signOut() { await sb.auth.signOut(); await refreshSession(); },
  onChange(fn) { Pb.listeners.add(fn); return () => Pb.listeners.delete(fn); },
};

// ---- PIN verification (RPC) — fallback local si échec ----
window.SbPin = {
  async verify(role, playerId, pin) {
    try {
      const { data, error } = await sb.rpc('verify_pin', {
        p_role: role, p_player_id: playerId, p_pin: pin
      });
      if (error) throw error;
      return { ok: !!data, source: 'remote' };
    } catch (e) {
      return { ok: null, source: 'offline', error: e?.message };
    }
  }
};

// ---- Store : push entités vers Supabase (best-effort, queue si offline) ----
function _wrap(op) {
  return async () => {
    if (!Pb.online) { Pb._dirtyQueue.push(op); return; }
    try { await op(); }
    catch (e) {
      console.warn('[Pb] push failed, queued:', e?.message || e);
      Pb._dirtyQueue.push(op);
    }
  };
}

window.PbStore = {
  // ---- MATCHES ----
  async upsertMatch(m) {
    await _wrap(async () => {
      const row = {
        id: m.id, date: m.date, opponent: m.opponent, home: !!m.home,
        score_us: m.scoreUs|0, score_opp: m.scoreOpp|0,
        quarters: m.quarters || {}, notes: m.notes || null,
        video_url: m.videoUrl || null,
        is_live: !!m.isLive, live_stream_url: m.liveStreamUrl || null,
        public_live: !!m.publicLive,
        public_live_started_at: m.publicLiveStartedAt ? new Date(m.publicLiveStartedAt).toISOString() : null,
        last_live_update: m.lastLiveUpdate ? new Date(m.lastLiveUpdate).toISOString() : null,
      };
      const { error } = await sb.from('matches').upsert(row);
      if (error) throw error;
    })();
  },
  async pushMatchScore(matchId, { scoreUs, scoreOpp, publicLive }) {
    await _wrap(async () => {
      const patch = {
        score_us: scoreUs|0, score_opp: scoreOpp|0,
        last_live_update: new Date().toISOString(),
      };
      if (publicLive !== undefined) patch.public_live = !!publicLive;
      const { error } = await sb.from('matches').update(patch).eq('id', matchId);
      if (error) throw error;
    })();
  },
  async upsertPlayerStats(matchId, playerId, stats) {
    await _wrap(async () => {
      const { error } = await sb.from('match_player_stats').upsert({
        match_id: matchId, player_id: playerId, stats
      });
      if (error) throw error;
    })();
  },
  async pushLiveEvent({ matchId, playerId, key, inc, value, label }) {
    await _wrap(async () => {
      const { error } = await sb.from('live_events').insert({
        match_id: matchId, player_id: playerId || null,
        key, inc: inc|0 || 1, value: value ?? null, label: label || null
      });
      if (error) throw error;
    })();
  },

  // ---- TEAM REVIEWS (perso, L2 only) ----
  async upsertTeamReview(r) {
    if (!Pb.user) throw new Error('Authentification requise (compte personnel)');
    const { error } = await sb.from('team_reviews').upsert({
      id: r.id, player_id: r.pid, date: r.date,
      ambiance: r.ambiance, role_clarity: r.roleClarity,
      playtime: r.playtime, physique: r.physique, comment: r.comment
    });
    if (error) throw error;
  },
  async listMyTeamReviews(playerId) {
    if (!Pb.user) return [];
    const { data } = await sb.from('team_reviews').select('*').eq('player_id', playerId).order('date', { ascending: false });
    return data || [];
  },

  // ---- LIVE REALTIME (spectateur #public) ----
  subscribeLive(matchId, onUpdate) {
    if (Pb.liveChannel) { sb.removeChannel(Pb.liveChannel); Pb.liveChannel = null; }
    const ch = sb.channel('match-live-' + matchId)
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'matches', filter: 'id=eq.' + matchId },
        (p) => onUpdate({ type: 'match', new: p.new, old: p.old }))
      .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'live_events', filter: 'match_id=eq.' + matchId },
        (p) => onUpdate({ type: 'event', row: p.new }))
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'match_player_stats', filter: 'match_id=eq.' + matchId },
        (p) => onUpdate({ type: 'stat', new: p.new, old: p.old }));
    ch.subscribe();
    Pb.liveChannel = ch;
    return ch;
  },
  // Variante : subscribe à TOUS les matchs en live public (pour le portail)
  subscribeAnyLive(onUpdate) {
    if (Pb.liveChannel) { sb.removeChannel(Pb.liveChannel); Pb.liveChannel = null; }
    const ch = sb.channel('any-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'matches' },
        (p) => onUpdate({ type: 'match', new: p.new, old: p.old }))
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'live_events' },
        (p) => onUpdate({ type: 'event', row: p.new }));
    ch.subscribe();
    Pb.liveChannel = ch;
    return ch;
  },
  unsubscribeLive() {
    if (Pb.liveChannel) { sb.removeChannel(Pb.liveChannel); Pb.liveChannel = null; }
  },

  // ---- PLAYERS (effectif, sync multi-device) ----
  async upsertPlayer(p) {
    // On n'envoie JAMAIS pin_hash depuis le client : trigger protect_player_pin_hash
    // forcerait sa réinitialisation à bcrypt('0000') sur INSERT. Pour modifier
    // un PIN il faut passer par l'RPC set_player_pin (L2 coach uniquement).
    const row = { id: p.id, name: p.name, num: p.num|0 };
    if (p.photo !== undefined) row.photo = p.photo || null;
    // feedback coach (positives/negatives/axes) : toujours envoyé pour
    // garantir la sync cross-device (saveFeedback delete p.feedback sur
    // clear → on l'envoie comme {} qui = "pas de feedback"). Cf
    // migration 20260524_005.
    row.feedback = p.feedback || {};
    const { error } = await sb.from('players').upsert(row);
    if (error) throw error;
  },
  async deletePlayer(pid) {
    const { error } = await sb.from('players').delete().eq('id', pid);
    if (error) throw error;
  },
  // Dernière connexion : UPDATE ciblé d'une seule colonne (ne touche pas au
  // reste de la ligne, contrairement à upsertPlayer). Tolère l'absence de la
  // colonne last_seen_at (migration 20260601_001 pas encore appliquée) : le
  // caller catch en silence.
  async touchLastSeen(playerId) {
    if (!playerId) return;
    const { error } = await sb.from('players').update({ last_seen_at: new Date().toISOString() }).eq('id', playerId);
    if (error) throw error;
  },
  subscribePlayers(onChange) {
    if (Pb.playersChannel) { sb.removeChannel(Pb.playersChannel); Pb.playersChannel = null; }
    const ch = sb.channel('players-sync')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'players' },
        (p) => onChange({ event: p.eventType, new: p.new, old: p.old }));
    ch.subscribe();
    Pb.playersChannel = ch;
    return ch;
  },

  // ---- FETCH (lecture initiale) ----
  async fetchMatches() {
    const { data } = await sb.from('matches').select('*').order('date', { ascending: false });
    return (data || []).map(_dbMatchToClient);
  },
  async fetchPlayers() {
    // last_seen_at peut ne pas encore exister en base (migration 20260601_001) :
    // on tente le select enrichi, fallback legacy si la colonne manque.
    let res = await sb.from('players').select('id,name,num,photo,feedback,last_seen_at').order('num');
    if (res.error) {
      res = await sb.from('players').select('id,name,num,photo,feedback').order('num');
    }
    return res.data || [];
  },
  async fetchLiveMatch() {
    const { data } = await sb.from('matches').select('*').eq('public_live', true).maybeSingle();
    return data ? _dbMatchToClient(data) : null;
  }
};

function _dbMatchToClient(r) {
  return {
    id: r.id, date: r.date, opponent: r.opponent, home: r.home,
    scoreUs: r.score_us, scoreOpp: r.score_opp,
    quarters: r.quarters || {}, notes: r.notes || '', videoUrl: r.video_url || '',
    isLive: r.is_live, liveStreamUrl: r.live_stream_url || '',
    publicLive: r.public_live,
    publicLiveStartedAt: r.public_live_started_at ? Date.parse(r.public_live_started_at) : null,
    lastLiveUpdate: r.last_live_update ? Date.parse(r.last_live_update) : null,
    winSelfie: r.win_selfie_url || '',
    transport: r.transport || {},
    roster: r.roster || {},
    onCourt: Array.isArray(r.on_court) ? r.on_court : [],
    // Phase 4 — prépa match. DB.location ↔ state.place (le state JS a
    // toujours utilisé `place`, on garde le naming local pour ne pas
    // casser editMatch / saveMatch / renderMatchDetail).
    status: r.status || 'to_play',
    prepVideos: Array.isArray(r.prep_videos) ? r.prep_videos : [],
    prepComment: r.prep_comment || '',
    place: r.location || '',
    time: r.time || '',
    positives: [], negatives: [], playerStats: {}
  };
}

// Initialisation
refreshSession().then(() => {
  Pb.ready = true;
  emit('ready');
  // Le main script (regular <script>) a déjà appelé render() avant que ce
  // module soit évalué (module = deferred). On retrigger un render() ici
  // pour que _initPlayersSync() puisse voir window.PbStore / window.PbSync.
  if (typeof window.render === 'function') {
    try { window.render(); } catch (e) { console.warn('[sync] post-init render:', e.message); }
  }
});

// ============================================================
// SYNC ENGINE GÉNÉRIQUE — toutes les entités équipe
// Hooké sur persist(), debouncé. Diff par hash JSON → upsert/delete.
// Realtime sur le sous-ensemble configuré. Anti-loop via _lastSeen.
// ============================================================

// Sérialisation déterministe pour le hash de diff
function _stableJson(o) {
  if (o === null || typeof o !== 'object') return JSON.stringify(o);
  if (Array.isArray(o)) return '[' + o.map(_stableJson).join(',') + ']';
  return '{' + Object.keys(o).sort().map(k => JSON.stringify(k) + ':' + _stableJson(o[k])).join(',') + '}';
}

// Définition déclarative des entités synchronisées
// dump(state) → { rowKey: rowObjet } : produit les lignes DB à partir du state
// apply(state, rows) : applique rows reçus (fetch/realtime) dans state
// pk : nom de colonne PK ou tableau de colonnes (composite)
// realtime : bool, auto-subscribe
// auth : 'anon' (toutes les entités équipe) ou 'l2' (perso)
const ENTITIES = [
  {
    key: 'plays', table: 'plays', pk: 'id', realtime: true, auth: 'anon',
    dump: (state) => Object.fromEntries((state.plays || []).map(p => {
      // Normalise : videos[] est la source de vérité. Backward compat avec videoUrl.
      const videos = (p.videos && p.videos.length) ? p.videos
        : (p.videoUrl ? [{ url: p.videoUrl }] : []);
      // images : on ne pousse que les URLs Storage (http/https). Les anciennes
      // entrées base64 (data:image/...) restent en localStorage uniquement
      // pour ne pas exploser le 1 MB / cellule jsonb. À la prochaine édition
      // du play, addPlayImages uploadera les nouvelles dans le bucket.
      const imageUrls = (p.images || []).filter(s => typeof s === 'string' && /^https?:\/\//i.test(s));
      return [p.id, {
        id: p.id, cat: p.cat || 'off', title: p.title || '',
        descr: p.desc || null, tags: p.tags || [],
        video_url: videos[0] ? videos[0].url : null,  // legacy pour backward compat
        videos: videos,
        images: imageUrls
      }];
    })),
    apply: (state, rows) => {
      // Préserve les extras locaux (concepts, attachments, images base64
      // legacy) ET les plays locaux pas encore pushés (race : un realtime
      // event d'un autre browser arrive pendant la fenêtre de debounce 400ms
      // de NOTRE push → sinon le play est wipé avant son upsert). Heuristique
      // : tout play local non présent dans rows ET dont l'id commence par 'x'
      // (uid() format) est considéré "pending push" et conservé.
      const localList = state.plays || [];
      const byId = Object.fromEntries(localList.map(p => [p.id, p]));
      const remoteIds = new Set(rows.map(r => r.id));
      const fromRemote = rows.map(r => {
        const local = byId[r.id] || {};
        // videos remote prioritaire, fallback sur video_url legacy
        const videos = (r.videos && r.videos.length) ? r.videos
          : (r.video_url ? [{ url: r.video_url }] : (local.videos || []));
        // Merge images : remote (URLs Storage, source de vérité cross-device)
        // + base64 legacy locales (pas encore migrées, vivent en localStorage).
        const remoteImgs = Array.isArray(r.images) ? r.images : [];
        const localImgs = Array.isArray(local.images) ? local.images : [];
        const legacyBase64 = localImgs.filter(s => typeof s === 'string' && s.startsWith('data:'));
        // Dédup au cas où une URL remote est déjà dans local
        const merged = [...remoteImgs];
        legacyBase64.forEach(b => { if (!merged.includes(b)) merged.push(b); });
        return {
          ...local,
          id: r.id, cat: r.cat, title: r.title,
          desc: r.descr || '', tags: r.tags || [],
          videoUrl: videos[0] ? videos[0].url : '',  // legacy
          videos: videos,
          images: merged
        };
      });
      // Préserve les locaux récents non encore push (id format uid() = 'x...')
      const pendingLocal = localList.filter(p => !remoteIds.has(p.id) && typeof p.id === 'string' && p.id.startsWith('x'));
      state.plays = [...pendingLocal, ...fromRemote];
    }
  },
  {
    key: 'customConcepts', table: 'custom_concepts', pk: 'label', realtime: true, auth: 'anon',
    dump: (state) => Object.fromEntries((state.customConcepts || []).map(label => [label, { label }])),
    apply: (state, rows) => { state.customConcepts = rows.map(r => r.label); }
  },
  {
    key: 'matches', table: 'matches', pk: 'id', realtime: true, auth: 'anon',
    dump: (state) => Object.fromEntries((state.matches || []).map(m => {
      // win_selfie_url : on ne pousse que les URLs Storage (http/https).
      // Les anciens selfies base64 (data:image/...) restent en local et seront
      // migrés via migrateLocalSelfiesToStorage() au prochain boot coach.
      const winSelfieUrl = (typeof m.winSelfie === 'string' && /^https?:\/\//i.test(m.winSelfie))
        ? m.winSelfie : null;
      // Status : si absent (matches legacy localStorage), on l'infère depuis
      // les scores au moment du dump pour ne pas pousser un null sur une
      // colonne NOT NULL. Bascule auto vers 'played' dès qu'un score est saisi.
      const inferredStatus = m.status
        || (((m.scoreUs | 0) > 0 || (m.scoreOpp | 0) > 0) ? 'played' : 'to_play');
      return [m.id, {
        id: m.id, date: m.date, opponent: m.opponent || '', home: !!m.home,
        score_us: m.scoreUs | 0, score_opp: m.scoreOpp | 0,
        quarters: m.quarters || {},
        notes: m.notes || null, video_url: m.videoUrl || null,
        is_live: !!m.isLive, live_stream_url: m.liveStreamUrl || null,
        public_live: !!m.publicLive,
        public_live_started_at: m.publicLiveStartedAt ? new Date(m.publicLiveStartedAt).toISOString() : null,
        last_live_update: m.lastLiveUpdate ? new Date(m.lastLiveUpdate).toISOString() : null,
        win_selfie_url: winSelfieUrl,
        // Extras coach : covoiturage, feuille de match, rotation live. Avant
        // 2026-05-24 vivaient en localStorage seul (m.transport/roster/onCourt
        // jamais sérialisés). Cf migration 20260524_004.
        transport: m.transport || {},
        roster: m.roster || {},
        on_court: Array.isArray(m.onCourt) ? m.onCourt : [],
        season_id: m.seasonId || null,
        // Phase 4 — prépa match (cf. migration 20260524_007).
        status: inferredStatus,
        prep_videos: Array.isArray(m.prepVideos) ? m.prepVideos : [],
        prep_comment: m.prepComment || null,
        location: m.place || null,
        time: m.time || null,
        team_tag: (m.teamTag === 'e2') ? 'e2' : 'e1'  // multi-effectif : e1 | e2 (jamais both pour un match)
      }];
    })),
    apply: (state, rows) => {
      // Préserve : extras locaux (positives/negatives, playerStats, playerReviews,
      // playerFeedback) ET les matches locaux pending push (race anti-wipe).
      // winSelfie : depuis 2026-05-24, vit dans matches.win_selfie_url (Storage
      // bucket match-selfies). Remote URL = source de vérité cross-device. On
      // garde le base64 legacy local UNIQUEMENT si remote est null, le temps
      // que migrateLocalSelfiesToStorage() le pousse en Storage.
      // transport / roster / onCourt : depuis 2026-05-24, synchronisés via
      // matches.transport / roster / on_court (jsonb). Remote = source vérité.
      const localList = state.matches || [];
      const byId = Object.fromEntries(localList.map(m => [m.id, m]));
      const remoteIds = new Set(rows.map(r => r.id));
      const fromRemote = rows.map(r => {
        const local = byId[r.id] || {};
        const localSelfie = typeof local.winSelfie === 'string' ? local.winSelfie : '';
        const isLocalLegacyBase64 = localSelfie.startsWith('data:');
        const winSelfie = r.win_selfie_url || (isLocalLegacyBase64 ? localSelfie : '');
        return {
          ...local, // préserve playerStats/positives/negatives/playerReviews
          id: r.id, date: r.date, opponent: r.opponent, home: r.home,
          scoreUs: r.score_us, scoreOpp: r.score_opp,
          quarters: r.quarters || {},
          notes: r.notes || '', videoUrl: r.video_url || '',
          isLive: r.is_live, liveStreamUrl: r.live_stream_url || '',
          publicLive: r.public_live,
          publicLiveStartedAt: r.public_live_started_at ? Date.parse(r.public_live_started_at) : null,
          lastLiveUpdate: r.last_live_update ? Date.parse(r.last_live_update) : null,
          winSelfie,
          transport: r.transport || {},
          roster: r.roster || {},
          onCourt: Array.isArray(r.on_court) ? r.on_court : [],
          // Phase 4 — prépa match. DB.location → state.place pour rester
          // compat avec le code existant (editMatch / saveMatch utilisent
          // déjà `m.place` / `m.time` depuis longtemps).
          status: r.status || 'to_play',
          prepVideos: Array.isArray(r.prep_videos) ? r.prep_videos : [],
          prepComment: r.prep_comment || '',
          place: r.location || local.place || '',
          time: r.time || local.time || '',
          positives: local.positives || [], negatives: local.negatives || [],
          playerStats: local.playerStats || {},
          seasonId: r.season_id || local.seasonId || null,
          teamTag: (r.team_tag === 'e2') ? 'e2' : 'e1'  // rétrocompat : colonne absente → 'e1'
        };
      });
      // Préserve les matches locaux non encore push (id format uid() = 'x...')
      const pendingLocal = localList.filter(m => !remoteIds.has(m.id) && typeof m.id === 'string' && m.id.startsWith('x'));
      state.matches = [...pendingLocal, ...fromRemote];
    }
  },
  {
    key: 'matchFeedback', table: 'match_feedback', pk: 'id', realtime: true, auth: 'anon',
    dump: (state) => {
      const out = {};
      (state.matches || []).forEach(m => {
        (m.positives || []).forEach(f => out[f.id] = { id: f.id, match_id: m.id, kind: 'positive',
          text: f.text || '', minute: f.minute || null, images: f.images || [], videos: f.videos || [] });
        (m.negatives || []).forEach(f => out[f.id] = { id: f.id, match_id: m.id, kind: 'negative',
          text: f.text || '', minute: f.minute || null, images: f.images || [], videos: f.videos || [] });
      });
      return out;
    },
    apply: (state, rows) => {
      const byMatch = {};
      rows.forEach(r => {
        byMatch[r.match_id] = byMatch[r.match_id] || { positives: [], negatives: [] };
        const arr = r.kind === 'positive' ? byMatch[r.match_id].positives : byMatch[r.match_id].negatives;
        arr.push({ id: r.id, text: r.text || '', minute: r.minute || '', images: r.images || [], videos: r.videos || [] });
      });
      (state.matches || []).forEach(m => {
        if (byMatch[m.id]) { m.positives = byMatch[m.id].positives; m.negatives = byMatch[m.id].negatives; }
      });
    }
  },
  {
    key: 'matchPlayerStats', table: 'match_player_stats', pk: ['match_id', 'player_id'], realtime: true, auth: 'anon',
    dump: (state) => {
      const out = {};
      (state.matches || []).forEach(m => {
        Object.entries(m.playerStats || {}).forEach(([pid, stats]) => {
          out[`${m.id}|${pid}`] = { match_id: m.id, player_id: pid, stats: stats || {} };
        });
      });
      return out;
    },
    apply: (state, rows) => {
      const byMatch = {};
      rows.forEach(r => {
        byMatch[r.match_id] = byMatch[r.match_id] || {};
        byMatch[r.match_id][r.player_id] = r.stats || {};
      });
      (state.matches || []).forEach(m => {
        if (byMatch[m.id]) m.playerStats = byMatch[m.id];
      });
    }
  },
  {
    key: 'challenges', table: 'challenges', pk: 'id', realtime: true, auth: 'anon',
    dump: (state) => Object.fromEntries((state.challenges || []).map(c => [c.id, {
      id: c.id, title: c.title || '', descr: c.desc || null,
      type: c.type || 'skill', metric: c.metric || null,
      end_date: c.endDate || null, scope: c.scope || 'individual',
      auto_count: !!c.autoCount, lower_is_better: !!c.lowerIsBetter,
      season_id: c.seasonId || null,
      team_tag: c.teamTag || 'e1'  // multi-effectif : e1 | e2 | both
    }])),
    apply: (state, rows) => {
      const byId = Object.fromEntries((state.challenges || []).map(c => [c.id, c]));
      state.challenges = rows.map(r => ({
        ...(byId[r.id] || {}), // préserve scores (entité séparée)
        id: r.id, title: r.title, desc: r.descr || '', type: r.type,
        metric: r.metric || '', endDate: r.end_date || '',
        scope: r.scope, autoCount: r.auto_count, lowerIsBetter: r.lower_is_better,
        scores: (byId[r.id] || {}).scores || {},
        seasonId: r.season_id || (byId[r.id] || {}).seasonId || null,
        teamTag: r.team_tag || 'e1'  // rétrocompat : colonne absente → 'e1'
      }));
    }
  },
  {
    key: 'challengeScores', table: 'challenge_scores', pk: ['challenge_id', 'player_id'], realtime: true, auth: 'anon',
    dump: (state) => {
      const out = {};
      (state.challenges || []).forEach(c => {

    }
  },
  {
    key: 'convocations', table: 'convocations', pk: 'id', realtime: true, auth: 'anon',

  },
  {
    key: 'convocationResponses', table: 'convocation_responses',

  {
    key: 'lineups', table: 'lineups', pk: 'id', realtime: true, auth: 'anon',

  {
    key: 'ffbb', table: 'ffbb_config', pk: 'id', realtime: false, auth: 'anon',

    key: 'offseasonLogs', table: 'offseason_logs',

      Object.entries(logs).forEach(([pid, byWeek]) => {

              logged_at: entry.at ? new Date(entry.at).toISOString() : null
            };
          });
        });
      });
      return out;
    },
    apply: (state, rows) => {
      const next = {};
      rows.forEach(r => {
        next[r.player_id] = next[r.player_id] || {};
        next[r.player_id][r.iso_week] = next[r.player_id][r.iso_week] || {};
        next[r.player_id][r.iso_week][r.exercise_id] = {
          done: !!r.done,
          value: r.value,
          at: r.logged_at ? Date.parse(r.logged_at) : null
        };
      });
      state.offseasonLogs = next;
    }
  },
  {
    // Ressentis équipe : joueuses écrivent, coach lit. Sync anon pour que le
    // dashboard coach se MAJ live quand une joueuse soumet (avant : team_reviews
    // n'était dans NI ENTITIES NI realtime → reload obligatoire côté coach).
    key: 'teamReviews', table: 'team_reviews', pk: 'id', realtime: true, auth: 'anon',
    dump: (state) => Object.fromEntries((state.teamReviews || []).map(r => [r.id, {
      id: r.id, player_id: r.pid, date: r.date,
      ambiance: r.ambiance ?? null, role_clarity: r.roleClarity ?? null,
      playtime: r.playtime ?? null, physique: r.physique ?? null,
      comment: r.comment || null
    }])),
    apply: (state, rows) => {
      state.teamReviews = rows.map(r => ({
        id: r.id, pid: r.player_id, date: r.date,
        ambiance: r.ambiance, roleClarity: r.role_clarity,
        playtime: r.playtime, physique: r.physique,
        comment: r.comment || '',
        updatedAt: r.updated_at ? Date.parse(r.updated_at) : Date.now()
      }));
    }
  },
  {
    // Match feedback joueuse (ressenti post-match : note + commentaire).
    // Source de vérité state JS = m.playerReviews[pid] = { rating, positives,
    // negatives, comment, updatedAt }. Pour la sync DB, on flatten en
    // (rating, note) — les arrays positives/negatives restent locaux car
    // schema simple. Coach peut consulter la note + commentaire multi-device.
    key: 'playerMatchFeedback', table: 'player_match_feedback', pk: ['match_id', 'player_id'], realtime: true, auth: 'anon',
    dump: (state) => {
      const out = {};
      (state.matches || []).forEach(m => {
        const reviews = m.playerReviews || {};
        Object.entries(reviews).forEach(([pid, r]) => {
          if (r == null) return;
          out[`${m.id}|${pid}`] = {
            match_id: m.id, player_id: pid,
            rating: r.rating ?? null,
            note: r.comment || null
          };
        });
      });
      return out;
    },
    apply: (state, rows) => {
      const byMatch = {};
      rows.forEach(r => {
        byMatch[r.match_id] = byMatch[r.match_id] || {};
        byMatch[r.match_id][r.player_id] = {
          rating: r.rating,
          comment: r.note || '',
          // positives/negatives non-sync : on préserve les valeurs locales si existantes
          positives: [], negatives: [],
          updatedAt: r.updated_at ? Date.parse(r.updated_at) : Date.now()
        };
      });
      (state.matches || []).forEach(m => {
        if (byMatch[m.id]) {

          const existing = m.playerReviews || {};

              ...remote,

              negatives: local.negatives || []
            };

    }
  },
  {
    // Wellness journalier joueuse (forme physique + mental). 1 row par
    // (player_id, date). Coach lit, joueuse écrit self.
    key: 'playerWellness', table: 'player_wellness_log', pk: ['player_id', 'date'], realtime: true, auth: 'anon',
    dump: (state) => {
      const out = {};
      const logs = state.wellnessLogs || {};
      Object.entries(logs).forEach(([pid, byDate]) => {
        Object.entries(byDate || {}).forEach(([date, w]) => {
          if (w == null) return;
          out[`${pid}|${date}`] = {
            player_id: pid, date,
            physical: w.physical ?? null,
            mental: w.mental ?? null,
            note: w.note || null
          };

    },
    apply: (state, rows) => {
      const logs = {};
      rows.forEach(r => {
        logs[r.player_id] = logs[r.player_id] || {};
        logs[r.player_id][r.date] = {
          physical: r.physical, mental: r.mental,
          note: r.note || '',
          updatedAt: r.updated_at ? Date.parse(r.updated_at) : Date.now()

      state.wellnessLogs = logs;
    }
  },
  // ==========================================================================
  // SAISONS (fondation Saison v1 — voir migration 20260524_002_seasons.sql)
  // - seasons : index des saisons (draft/active/archived). Backend garantit
  //   au max 1 active (unique partial index).
  // - season_players : N-N joueuses ↔ saison (joined_at/left_at pour retrait
  //   non destructif).
  // - season_plays : N-N plays ↔ saison (active=true/false pour désactiver un
  //   play sur une saison sans le supprimer du catalogue global).
  // Le filtrage côté front : helpers currentSeasonMatches() etc. + état
  // state.currentSeasonId. Cf. boot logic après PbSync.fetchAll.
  // ==========================================================================
  {
    key: 'seasons', table: 'seasons', pk: 'id', realtime: true, auth: 'anon',
    dump: (state) => Object.fromEntries((state.seasons || []).map(s => [s.id, {
      id: s.id, name: s.name || '',
      start_date: s.startDate || null, end_date: s.endDate || null,
      status: s.status || 'draft',
      activated_at: s.activatedAt ? new Date(s.activatedAt).toISOString() : null,
      archived_at: s.archivedAt ? new Date(s.archivedAt).toISOString() : null
    }])),
    apply: (state, rows) => {
      state.seasons = rows.map(r => ({
        id: r.id, name: r.name || '',
        startDate: r.start_date || '', endDate: r.end_date || '',
        status: r.status || 'draft',
        createdAt: r.created_at ? Date.parse(r.created_at) : null,
        activatedAt: r.activated_at ? Date.parse(r.activated_at) : null,
        archivedAt: r.archived_at ? Date.parse(r.archived_at) : null
      }));
    }
  },
  {
    key: 'seasonPlayers', table: 'season_players', pk: ['season_id', 'player_id'], realtime: true, auth: 'anon',
    dump: (state) => {
      const out = {};
      (state.seasonPlayers || []).forEach(sp => {
        out[`${sp.seasonId}|${sp.playerId}`] = {
          season_id: sp.seasonId, player_id: sp.playerId,
          joined_at: sp.joinedAt || null,
          left_at: sp.leftAt || null,
          role: sp.role || null,
          team_tag: sp.teamTag || 'e1'  // multi-effectif : e1 | e2 | both
        };
      });
      return out;
    },
    apply: (state, rows) => {
      state.seasonPlayers = rows.map(r => ({
        seasonId: r.season_id, playerId: r.player_id,
        joinedAt: r.joined_at || '', leftAt: r.left_at || '',
        role: r.role || '',
        teamTag: r.team_tag || 'e1'  // rétrocompat : colonne absente → 'e1'
      }));
    }
  },
  {
    key: 'seasonPlays', table: 'season_plays', pk: ['season_id', 'play_id'], realtime: true, auth: 'anon',
    dump: (state) => {
      const out = {};
      (state.seasonPlays || []).forEach(sp => {
        out[`${sp.seasonId}|${sp.playId}`] = {
          season_id: sp.seasonId, play_id: sp.playId,
          active: sp.active !== false
        };
      });
      return out;
    },
    apply: (state, rows) => {
      state.seasonPlays = rows.map(r => ({
        seasonId: r.season_id, playId: r.play_id,
        active: r.active !== false
      }));
    }
  },
  // ==========================================================================
  // PRÉPA MATCH — plays liés au match avec note coach + ordre.
  // Cf. migration 20260524_008_match_play_links.sql. Calque exact de
  // seasonPlays (PK composite anon write-all + realtime).
  // ==========================================================================
  {
    key: 'matchPlayLinks', table: 'match_play_links', pk: ['match_id', 'play_id'], realtime: true, auth: 'anon',
    dump: (state) => {
      const out = {};
      (state.matchPlayLinks || []).forEach(lk => {
        out[`${lk.matchId}|${lk.playId}`] = {
          match_id: lk.matchId, play_id: lk.playId,
          position: Number.isFinite(lk.position) ? lk.position : 0,
          coach_note: lk.coachNote || null
        };
      });
      return out;
    },
    apply: (state, rows) => {
      state.matchPlayLinks = rows.map(r => ({
        matchId: r.match_id, playId: r.play_id,
        position: Number.isFinite(r.position) ? r.position : 0,
        coachNote: r.coach_note || '',
        createdAt: r.created_at ? Date.parse(r.created_at) : null
      }));
    }
  },
  // ==========================================================================
  // JOUEUSES GUESTS — Phase 5 (cf. migration 20260524_009_guest_players.sql).
  // guest_players : humains temporaires (copine, essayeuse) suivis cross-
  //   instance pour permettre la suggestion "récents 30j" et la promotion.
  // training_guests : N-N convoc↔guest avec instance_date dans la PK pour
  //   gérer les trainings récurrents.
  // ==========================================================================
  {
    key: 'guestPlayers', table: 'guest_players', pk: 'id', realtime: true, auth: 'anon',
    dump: (state) => Object.fromEntries((state.guestPlayers || []).map(g => [g.id, {
      id: g.id,
      name: g.name || '',
      note: g.note || null,
      promoted_to_player_id: g.promotedToPlayerId || null,
      first_seen_at: g.firstSeenAt ? new Date(g.firstSeenAt).toISOString() : new Date().toISOString(),
      last_seen_at: g.lastSeenAt ? new Date(g.lastSeenAt).toISOString() : new Date().toISOString()
    }])),

      state.guestPlayers = rows.map(r => ({
        id: r.id,
        name: r.name || '',
        note: r.note || '',
        promotedToPlayerId: r.promoted_to_player_id || null,

        lastSeenAt: r.last_seen_at ? Date.parse(r.last_seen_at) : null,
        createdAt: r.created_at ? Date.parse(r.created_at) : null

  {
    key: 'trainingGuests', table: 'training_guests',
    pk: ['convocation_id', 'guest_player_id', 'instance_date'], realtime: true, auth: 'anon',
    dump: (state) => {
      const out = {};
      (state.trainingGuests || []).forEach(tg => {
        const idate = tg.instanceDate;
        if (!idate) return; // skip rows sans instance_date (NOT NULL en DB)
        out[`${tg.convocationId}|${tg.guestPlayerId}|${idate}`] = {
          convocation_id: tg.convocationId,
          guest_player_id: tg.guestPlayerId,
          instance_date: idate
        };
