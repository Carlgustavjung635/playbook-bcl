              <div class="stat-tile-sub">${state.matches.length} matchs</div>
            </div>
            <div class="stat-tile">
              <div class="stat-tile-label">Win rate</div>
              <div class="stat-tile-value">${state.matches.length ? Math.round(100*wins/state.matches.length) : 0}<span style="font-size:22px;color:var(--ink-4)">%</span></div>
              <div class="stat-tile-sub">D2F IDF2</div>
            </div>
          </div>
        ` : ''}

        <div class="section-header">
          <div>
            <div class="eyebrow">Derniers résultats</div>
            <h2 class="display-md mt-2">Saison</h2>
          </div>
        </div>

        ${recent.length === 0 ? `
          <div class="empty"><div class="empty-icon">○</div><div class="empty-title">Aucun match</div></div>
        ` : `
          <div class="list-section">
            ${recent.map(m => {
              const win = m.scoreUs > m.scoreOpp;
              return `
                <div class="match-row" style="cursor:default">
                  <div class="match-result-badge ${win ? 'match-result-w' : 'match-result-l'}">${win ? 'V' : 'D'}</div>
                  <div style="flex:1;min-width:0">
                    <div style="font-family:'Anton';font-size:15px;text-transform:uppercase;letter-spacing:0.02em">vs ${esc(m.opponent)}</div>
                    <div style="font-size:11px;color:var(--ink-3);margin-top:2px;font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.05em">
                      ${formatDate(m.date)} · ${m.home ? 'Domicile' : 'Extérieur'}
                    </div>
                  </div>
                  <div class="match-score">${m.scoreUs}–${m.scoreOpp}</div>
                </div>
              `;
            }).join('')}
          </div>
        `}

        <div style="text-align:center;padding:20px;color:var(--ink-4);font-size:10px;font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.15em">
          IE-Basket Club L'Islois · D2 Féminine IDF2
        </div>
      </main>
    </div>
  `;
}

// Réagir au changement de hash dans l'URL
window.addEventListener('hashchange', () => render());

// ============================================================
// MAIN RENDER
// ============================================================
// ---- Sync globale toutes entités équipe ----
// 1) players reste géré séparément (RPC verify_pin + protect pin_hash)
// 2) tout le reste est piloté par window.PbSync (sync engine générique)
// Tamponne la dernière connexion de la joueuse courante (rôle 'player').
// Optimiste local + UPDATE ciblé Supabase (silencieux si colonne absente).
function _touchCurrentPlayerLastSeen() {
  if (!state.auth || state.auth.role !== 'player' || !state.auth.playerId) return;
  const pid = state.auth.playerId;
  const p = state.players.find(x => x.id === pid);
  if (p) p.lastSeenAt = Date.now();
  try { save(K.players, state.players); } catch (e) {}
  if (window.PbStore) PbStore.touchLastSeen(pid).catch(() => {});
}

// Badge "dernière connexion" pour l'effectif coach.
// Vert < 24h · orange < 7j · rouge >= 7j ou jamais (spec).
function _lastSeenBadge(ms) {
  if (!ms) return { label: 'jamais vue', color: 'var(--red)', dot: '●' };
  const hours = (Date.now() - ms) / 3600000;
  const days = Math.floor(hours / 24);
  const color = hours < 24 ? 'var(--green)' : (hours < 24 * 7 ? 'var(--orange)' : 'var(--red)');
  let label;
  if (days <= 0) label = "vue aujourd'hui";
  else if (days === 1) label = 'vue hier';
  else if (days < 7) label = 'vue il y a ' + days + 'j';
  else if (days < 30) label = 'vue il y a ' + Math.floor(days / 7) + ' sem';
  else label = 'vue il y a ' + Math.floor(days / 30) + ' mois';
  return { label, color, dot: '●' };
}

function _initPlayersSync() {
  if (window._syncInitDone || !window.PbStore || !window.PbSync) return;
  window._syncInitDone = true;

  // --- A) Players (logique spécifique, conserve la fusion pin + extras) ---
  PbStore.fetchPlayers().then(remote => {
    if (remote && remote.length) {
      const localById = Object.fromEntries(state.players.map(p => [p.id, p]));
      const merged = remote.map(rp => {
        const lp = localById[rp.id] || {};
        return { ...lp, id: rp.id, name: rp.name, num: rp.num,
          photo: rp.photo || lp.photo || null,
          pin: lp.pin || '0000',
          feedback: rp.feedback || lp.feedback || {},
          lastSeenAt: rp.last_seen_at ? Date.parse(rp.last_seen_at) : (lp.lastSeenAt || null) };
      });
      const remoteIds = new Set(remote.map(r => r.id));
      const localOnly = state.players.filter(p => !remoteIds.has(p.id));
      state.players = [...merged, ...localOnly];
      localOnly.forEach(p => PbStore.upsertPlayer(p).catch(()=>{}));
    }
    // Dernière connexion : si une joueuse charge l'app, on tamponne son
    // last_seen_at (après la fusion → la joueuse existe dans state.players).
    try { _touchCurrentPlayerLastSeen(); } catch (e) {}
  }).catch(e => console.warn('[sync] fetchPlayers:', e.message))
    .finally(() => {
      // --- B) Toutes les autres entités via PbSync ---
      PbSync.fetchAll(state).then(() => {
        // SAISON : après la 1re sync, on a state.seasons / seasonPlayers /
        // seasonPlays. Valide / fixe state.currentSeasonId selon le rôle :
        // - coach garde son choix s'il est valide, sinon fallback active
        // - joueuse toujours forcée sur la saison active
        try { ensureCurrentSeasonId(); } catch(e) {}
        // PHASE 2 : migration one-shot des plans d'entraînement legacy
        // (c.trainingPlan convoc-level, localStorage only) → entité per-instance
        // synchronisée. Idempotente (ne recrée pas une entrée existante).
        try { _migrateLegacyTrainingPlans(); } catch(e) { console.warn('[migration] training plans:', e.message); }
        // PHASE 3 : migration one-shot des ateliers/rotations legacy (ancien
        // format global plan.workshop_rotations, PR #36) → rattachés au 1er exo.
        try { _migrateLegacyWorkshopRotations(); } catch(e) { console.warn('[migration] workshop rotations:', e.message); }
        persist();
        render();
        // Subscribe Realtime sur toutes les entités configurées. On utilise
        // scheduleRender (debouncé 100ms) au lieu de render() direct pour
        // collapser plusieurs events Realtime en un seul re-render.
        PbSync.subscribeAll(state, (entityKey) => {
          // Si l'event concerne `seasons` (changement d'active depuis un autre
          // device), re-valider currentSeasonId — surtout pour la joueuse qui
          // doit suivre la saison active.
          if (entityKey === 'seasons') {
            try { ensureCurrentSeasonId(); } catch(e) {}
          }
          scheduleRender();
        });
        // Filet de sécurité : si l'utilisateur ferme l'onglet avant la fin
        // du debounce 400ms du PbSync, on flush immédiatement pour ne pas
        // perdre un play qui vient d'être créé/modifié.
        if (!window._pbSyncUnloadGuard) {
          window._pbSyncUnloadGuard = true;
          const flush = () => { try { PbSync.flushNow(state); } catch(e){} };
          window.addEventListener('pagehide', flush);
          window.addEventListener('beforeunload', flush);
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') flush();
          });
        }
        // One-shot : migration des selfies legacy base64 (localStorage) vers
        // le bucket Storage. Coach uniquement, gate localStorage idempotente.
        // Délai 500ms pour laisser le render initial respirer.
        if (typeof migrateLocalSelfiesToStorage === 'function') {
          setTimeout(() => { migrateLocalSelfiesToStorage().catch(()=>{}); }, 500);
        }
      });
    });

  // --- C) Players Realtime (pattern dédié) ---
  PbStore.subscribePlayers(({ event, new: row, old }) => {
    if (event === 'INSERT' || event === 'UPDATE') {
      const i = state.players.findIndex(p => p.id === row.id);
      const lp = i >= 0 ? state.players[i] : {};
      const patched = { ...lp, id: row.id, name: row.name, num: row.num,
        photo: row.photo || lp.photo || null,
        pin: lp.pin || '0000',
        feedback: row.feedback || lp.feedback || {},
        lastSeenAt: row.last_seen_at ? Date.parse(row.last_seen_at) : (lp.lastSeenAt || null) };
      if (i >= 0) state.players[i] = patched;
      else state.players.push(patched);
    } else if (event === 'DELETE' && old) {
      state.players = state.players.filter(p => p.id !== old.id);
    }
    // Pas de persist() ici : on évite la cascade PbSync (cache pas concerné par players)
    save(K.players, state.players);
    render();
  });
}

// Cleanup : appelé UNE SEULE FOIS au boot (pas à chaque render — sinon
// chaque création/suppression de convoc déclenche persist → PbSync → broadcast
// → re-render → cleanup en boucle = "mouvement permanent" UX).
function _bootCleanupOnce() {
  if (window._bootCleanupDone) return;
  window._bootCleanupDone = true;
  if (typeof cleanupOrphanMatchConvocs === 'function') cleanupOrphanMatchConvocs();
  if (typeof checkAndAwardBadges === 'function') checkAndAwardBadges();
}

// Debounce render : si plusieurs events Realtime arrivent en rafale, ne
// re-render qu'une seule fois après 100ms. Préserve aussi le scroll Y.
let _renderPending = null;
function scheduleRender(immediate) {
  if (immediate) { _doRender(); return; }
  if (_renderPending) return;
  _renderPending = setTimeout(() => { _renderPending = null; _doRender(); }, 100);
}

function _doRender() {
  // Snapshot scroll + active element pour restauration après innerHTML reflow.
  // IMPORTANT : depuis le fix scroll-past-footer, le scroll est sur .app
  // (overflow-y:auto interne), pas sur window. On capture les deux pour
  // backward compat.
  const scrollY = window.scrollY;
  const scrollX = window.scrollX;
  const appEl = document.querySelector('.app');
  const appScrollTop = appEl ? appEl.scrollTop : 0;
  const activeId = document.activeElement && document.activeElement.id;
  const selStart = document.activeElement && 'selectionStart' in document.activeElement ? document.activeElement.selectionStart : null;
  const selEnd = document.activeElement && 'selectionEnd' in document.activeElement ? document.activeElement.selectionEnd : null;
  _renderBody();
  // Restore scroll (synchrone, avant repaint)
  window.scrollTo(scrollX, scrollY);
  const newAppEl = document.querySelector('.app');
  if (newAppEl) newAppEl.scrollTop = appScrollTop;
  // Restore focus + caret si l'élément existe encore
  if (activeId) {
    const el = document.getElementById(activeId);
    if (el && typeof el.focus === 'function') {
      el.focus({ preventScroll: true });
      if (selStart != null && 'setSelectionRange' in el) {
        try { el.setSelectionRange(selStart, selEnd); } catch(e) {}
      }
    }
  }
}

function render() {
  // BACK BUTTON : render() est le point de passage unique des vues détail
  // (state.view). On synchronise ici l'historique : push à l'ouverture d'une
  // vue, history.back à sa fermeture programmatique (bouton « ← Retour »).
  // Les var _pb* sont hoistées (déclarées en bas du script) : undefined/falsy
  // tant que non initialisées, donc sans effet pendant le boot.
  if (!_pbInPop) {
    if (state.view && !_pbViewActive) {
      _pbViewActive = true;
      try { history.pushState({ pbView: true }, ''); } catch (e) {}
    } else if (!state.view && _pbViewActive) {
      _pbViewActive = false;
      _pbSuppressPop = true;
      try { history.back(); } catch (e) { _pbSuppressPop = false; }
    }
  }
  _doRender();
}

// Scroll to top : depuis le fix scroll-past-footer, le scroll est interne au
// .app. window.scrollTo ne fait plus rien. Helper centralisé pour cibler le
// bon élément. Appelé par goSection / openPlay / openMatch / etc.
function _scrollTopApp() {
  const a = document.querySelector('.app');
  if (a) a.scrollTop = 0;
  window.scrollTo(0, 0); // fallback no-op
}

function _renderBody() {
  _bootCleanupOnce();
  // Sync effectif au premier render (idempotent : flag interne)
  _initPlayersSync();
  // Portail public via hash #public
  if (window.location.hash === '#public') {
    // 1) Fetch initial des matches depuis Supabase (si dispo) puis re-render
    if (window.PbStore && !window._publicInitDone) {
      window._publicInitDone = true;
      PbStore.fetchMatches().then(remote => {
        if (remote && remote.length) {
          // Merge : on garde les positives/negatives/playerStats locaux si déjà présents
          const byId = Object.fromEntries(state.matches.map(m => [m.id, m]));
          state.matches = remote.map(rm => ({ ...(byId[rm.id] || {}), ...rm }));
          document.getElementById('root').innerHTML = renderPublic();
        }
      }).catch(()=>{});
    }
    // 2) Realtime : subscribe pour MAJ live (remplace le polling)
    if (window.PbStore && !window._publicLiveSub) {
      window._publicLiveSub = PbStore.subscribeAnyLive((evt) => {
        if (evt.type === 'match' && evt.new) {
          const i = state.matches.findIndex(m => m.id === evt.new.id);
          const patched = {
            id: evt.new.id, date: evt.new.date, opponent: evt.new.opponent, home: evt.new.home,
            scoreUs: evt.new.score_us, scoreOpp: evt.new.score_opp,
            quarters: evt.new.quarters || {},
            isLive: evt.new.is_live, liveStreamUrl: evt.new.live_stream_url || '',
            publicLive: evt.new.public_live,
            lastLiveUpdate: evt.new.last_live_update ? Date.parse(evt.new.last_live_update) : Date.now(),
          };
          if (i >= 0) state.matches[i] = { ...state.matches[i], ...patched };
          else state.matches.push({ positives: [], negatives: [], playerStats: {}, ...patched });
          document.getElementById('root').innerHTML = renderPublic();
        }
      });
    }
    document.getElementById('root').innerHTML = renderPublic();
    return;
  } else if (window._publicLiveSub && window.PbStore) {
    // On a quitté le portail public → unsubscribe
    PbStore.unsubscribeLive();
    window._publicLiveSub = null;
    window._publicInitDone = false;
  }

  if (!state.auth) {
    document.getElementById('root').innerHTML = renderAuth();
    return;
  }

  const role = state.auth.role;

  // SAISON · Écran "pas de saison active" pour la joueuse :
  // Si les seasons sont chargés ET qu'il n'y a aucune saison active en BD,
  // la joueuse ne peut rien voir (pas d'équipe en cours). On affiche un
  // écran simple plein écran. Le coach voit toujours son UI normale (il
  // peut créer/activer une saison via 📅 Saisons).
  if (role === 'player' && _seasonsLoaded() && getActiveSeasonId() === null) {
    document.getElementById('root').innerHTML = renderNoActiveSeasonScreen();
    return;
  }

  let content = '';

  if (role === 'coach') {
    if (state.section === 'home') content = renderHomeCoach();
    else if (state.section === 'plays') content = renderPlays();
    else if (state.section === 'matches') content = renderMatches();
    else if (state.section === 'team') content = renderTeam();
    else if (state.section === 'inspire') content = renderInspire();
    else if (state.section === 'ffbb') content = renderFFBB();
  } else if (role === 'stat') {
    if (state.section === 'live') content = renderLive();
    else if (state.section === 'matches') content = renderMatches();
    else if (state.section === 'team') content = renderTeam();
    else if (state.section === 'ffbb') content = renderFFBB();
  } else if (role === 'player') {
    // Legacy section IDs → redirection vers la nouvelle archi
    if (state.section === 'matches') state.section = 'match';
    if (state.section === 'mystats') state.section = 'home';
    if (state.section === 'team') state.section = 'calendrier';
    if (state.section === 'ffbb') state.section = 'calendrier';
    // Priorité state.view : détail Match (depuis click joueuse dans Match
    // ou Agenda), détail Play (depuis click carrousel home). Sinon rendu
    // par section.
    if (state.view && state.view.type === 'match') content = renderMatchDetail();
    else if (state.view && state.view.type === 'play') content = renderPlayDetail();
    else if (state.section === 'home') content = renderHomePlayer();
    else if (state.section === 'plays') content = renderPlays();
    else if (state.section === 'challenges') content = renderPlayerChallenges();
    else if (state.section === 'match') content = renderPlayerMatches();
    else if (state.section === 'calendrier') content = renderPlayerCalendrier();
    else if (state.section === 'programme') content = renderPlayerProgramme();
    else content = renderHomePlayer();
  }

  document.getElementById('root').innerHTML = `
    <div class="app">
      ${renderTopbar()}
      <main>${content}</main>
    </div>
    ${renderNav()}
  `;
}

// ============================================================
// BACK BUTTON / NAVIGATION HISTORY (Phase 1 — bouton retour)
// Objectif : le bouton retour navigateur (et le back physique Android/PWA)
// ferme d'abord les modals, puis les vues détail (state.view), puis change
// d'onglet via le hash routing (#/section), au lieu de sortir de l'app.
// Chokepoints instrumentés : openModal/closeModal (toutes les popups coach +
// joueuses), viewImage, viewPdf, render() (vues détail), goSection() (onglets).
// ============================================================
var _pbViewActive = false;   // une vue détail (state.view) a une entrée d'historique
var _pbModalDepth = 0;       // 1 si une modal a une entrée d'historique, 0 sinon
var _pbSuppressPop = false;  // ignore le prochain popstate (close programmatique)
var _pbInPop = false;        // true pendant le traitement d'un popstate (anti-boucle)

var _PB_SECTIONS = ['home','plays','matches','team','inspire','ffbb','live','challenges','match','calendrier','programme'];
function _pbIsValidSection(id) { return _PB_SECTIONS.indexOf(id) !== -1; }
function _pbHashSection() { var h = (location.hash || '').replace(/^#\/?/, '').trim(); return h || null; }
function _pbModalOpen() { var r = document.getElementById('modal-root'); return !!(r && r.innerHTML.trim() !== ''); }

// Empile une entrée d'historique pour une modal (idempotent : une seule par
// modal visible, car modal-root ne contient qu'une modal à la fois).
function _pbModalPush() {
  if (_pbInPop) return;
  if (_pbModalDepth === 0) {
    _pbModalDepth = 1;
    try { history.pushState({ pbModal: true }, ''); } catch (e) {}
  }
}

// Historique du changement d'onglet (hash routing #/section).
function _pbGoSectionHistory(id, changed) {
  try {
    if (changed) history.pushState({ pbTab: id }, '', '#/' + id);
    else history.replaceState({ pbTab: id }, '', '#/' + id);
  } catch (e) {}
}

window.addEventListener('popstate', function (e) {
  if (_pbSuppressPop) { _pbSuppressPop = false; return; }
  _pbInPop = true;
  try {
    // 1) Modal ouverte → la fermer (prioritaire).
    if (_pbModalOpen()) {
      _pbModalDepth = 0;
      closeModal();
      return;
    }
    // 2) Vue détail ouverte → revenir à la liste.
    if (typeof state !== 'undefined' && state && state.view) {
      _pbViewActive = false;
      state.view = null;
      _doRender();
      return;
    }
    // 3) Niveau onglet → restaurer la section (état d'historique ou hash).
    var sec = (e.state && e.state.pbTab) || _pbHashSection();
    if (sec && _pbIsValidSection(sec) && typeof state !== 'undefined' && state) {
      state.section = sec;
      state.view = null;
    }
    _pbViewActive = false;
    _doRender();
  } finally {
    _pbInPop = false;
  }
});

// Boot : applique le hash de l'URL (deep-link / reload), pose l'entrée de base.
function _pbBoot() {
  try {
    var sec = _pbHashSection();
    if (sec && _pbIsValidSection(sec) && typeof state !== 'undefined' && state) state.section = sec;
    _pbViewActive = !!(typeof state !== 'undefined' && state && state.view);
    var s = (typeof state !== 'undefined' && state && state.section) ? state.section : '';
    history.replaceState({ pbTab: s }, '', s ? ('#/' + s) : location.pathname);
  } catch (e) {}
  render();
}

_pbBoot();
</script>
