// Renvoie la clé semaine ISO (ex '2026-W23')
function getWeekKey(date) {
  const d = date ? new Date(date) : new Date();
  // ISO week : adapter le jeudi de la semaine pour avoir le bon n°
  const target = new Date(d.valueOf());
  const dayNr = (d.getDay() + 6) % 7; // 0 = lundi
  target.setDate(target.getDate() - dayNr + 3);
  const firstThursday = new Date(target.getFullYear(), 0, 4);
  const diff = target - firstThursday;
  const weekNum = 1 + Math.round(diff / (7 * 24 * 3600 * 1000));
  return target.getFullYear() + '-W' + String(weekNum).padStart(2, '0');
}

// Renvoie le lundi et dimanche de la semaine actuelle
function getWeekRange(date) {
  const d = date ? new Date(date) : new Date();
  const day = (d.getDay() + 6) % 7; // 0 = lundi
  const monday = new Date(d);
  monday.setDate(d.getDate() - day);
  monday.setHours(0,0,0,0);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  return { monday, sunday };
}

function formatWeekRange(date) {
  const { monday, sunday } = getWeekRange(date);
  return monday.getDate() + ' ' + monday.toLocaleDateString('fr-FR', {month:'short'}) + ' → ' + sunday.getDate() + ' ' + sunday.toLocaleDateString('fr-FR', {month:'short'});
}

// Vérifie si la prépa est active aujourd'hui
function isOffseasonActive() {
  const o = state.offseason;
  if (!o || !o.startDate || !o.endDate) return false;
  const today = new Date().toISOString().slice(0,10);
  return today >= o.startDate && today <= o.endDate;
}

// === COACH : configuration du programme ===

function openOffseasonConfig() {
  const o = state.offseason || { startDate: '', endDate: '', title: 'Prépa estivale', exercises: [], mode: 'weekly', dailySchedule: {} };
  state._editingOffseason = JSON.parse(JSON.stringify(o));
  if (!state._editingOffseason.exercises) state._editingOffseason.exercises = [];
  // PHASE 4 : rétrocompat — un programme legacy sans mode est hebdo.
  if (state._editingOffseason.mode !== 'daily') state._editingOffseason.mode = 'weekly';
  if (!state._editingOffseason.dailySchedule) state._editingOffseason.dailySchedule = {};
  renderOffseasonEditor();
}

// PHASE 4 : bascule hebdo ↔ journalier. Les deux modes sont mutuellement
// exclusifs. On NE détruit PAS les données de l'autre mode (exercises[] et
// dailySchedule{} coexistent dans le state d'édition) : on confirme juste le
// changement de mode actif, et l'autre jeu reste en backup tant que non
// enregistré / écrasé. À l'enregistrement, on persiste les deux structures.
function setOffseasonMode(mode) {
  const e = state._editingOffseason;
  if (!e || e.mode === mode) return;
  const fromWeekly = e.mode === 'weekly';
  const hasWeekly = (e.exercises || []).some(ex => (ex.label || '').trim());
  const hasDaily = Object.values(e.dailySchedule || {}).some(arr => (arr || []).length);
  // Avertir uniquement si on quitte un mode qui contient des données.
  const leavingData = fromWeekly ? hasWeekly : hasDaily;
  if (leavingData) {
    const msg = fromWeekly
      ? 'Passer en mode journalier ? Tes exercices hebdomadaires restent sauvegardés mais ne seront plus utilisés tant que tu es en mode journalier.'
      : 'Repasser en mode hebdomadaire ? Ton planning journalier reste sauvegardé mais ne sera plus utilisé tant que tu es en mode hebdo.';
    if (!confirm(msg)) return;
  }
  e.mode = mode;
  renderOffseasonEditor();
}

  const e = state._editingOffseason;
  openModal(`
    <div class="modal-header">
      <div>
        <div class="eyebrow">Prépa individuelle</div>

      <button class="modal-close" onclick="closeModal();state._editingOffseason=null">✕</button>
    </div>
    <div class="modal-body">
      <!-- PHASE 4 : toggle mode hebdo / journalier -->
      <div class="segmented" style="margin-bottom:14px">
        <button class="segmented-btn ${e.mode !== 'daily' ? 'active' : ''}" onclick="setOffseasonMode('weekly')">📅 Hebdomadaire</button>
        <button class="segmented-btn ${e.mode === 'daily' ? 'active' : ''}" onclick="setOffseasonMode('daily')">🗓 Journalier</button>
      </div>

      <div style="padding:10px 12px;background:var(--bg-3);border-left:3px solid var(--orange);border-radius:6px;margin-bottom:14px;font-size:11px;color:var(--ink-2);line-height:1.5">
        ${e.mode === 'daily'
          ? 'Mode journalier : tu planifies des exercices date par date. Chaque joueuse voit son programme du jour.'
          : 'Mode hebdomadaire : les mêmes exercices chaque semaine. Les joueuses cochent ce qui est fait, reset auto chaque lundi.'}
      </div>

      <div class="fld">
        <label class="fld-label">Titre du programme</label>
        <input id="os-title" value="${esc(e.title || '')}" placeholder="Ex : Prépa estivale 2026">
      </div>
      <div class="fld-row">
        <div class="fld">
          <label class="fld-label">Début</label>
          <input id="os-start" type="date" value="${e.startDate || ''}">
        </div>
        <div class="fld">
          <label class="fld-label">Fin</label>
          <input id="os-end" type="date" value="${e.endDate || ''}">
        </div>
      </div>

      ${e.mode === 'daily' ? renderDailySchedule(e) : `
      <div class="eyebrow-muted" style="margin-top:14px;margin-bottom:8px">Exercices hebdomadaires (${e.exercises.length})</div>
      <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:8px">
        ${e.exercises.length === 0 ? `<div style="padding:14px;text-align:center;color:var(--ink-3);font-size:12px;font-style:italic;border:1px dashed var(--border);border-radius:8px">Aucun exercice · ajoute via les templates ou en perso</div>` : e.exercises.map((ex, i) => `
          <div class="warmup-step">
            <div style="font-family:'Anton';font-size:14px;color:var(--orange);min-width:24px">${i+1}</div>
            <div style="flex:1;min-width:0">
              <input type="text" value="${esc(ex.label)}" placeholder="Description" onchange="state._editingOffseason.exercises[${i}].label=this.value" style="width:100%;background:transparent;border:0;color:var(--ink);font-family:'Inter';font-size:13px;padding:2px 0;outline:none">
              <div style="display:flex;gap:6px;margin-top:4px">
                <input type="number" value="${ex.target || 0}" min="0" placeholder="Cible" onchange="state._editingOffseason.exercises[${i}].target=parseInt(this.value)||0" style="width:60px;background:var(--bg-1);border:1px solid var(--border);border-radius:4px;color:var(--ink);font-family:'JetBrains Mono';font-size:11px;padding:3px 6px;text-align:center">
                <input type="text" value="${esc(ex.unit || '')}" placeholder="Unité (min, séries, tirs...)" onchange="state._editingOffseason.exercises[${i}].unit=this.value" style="flex:1;background:var(--bg-1);border:1px solid var(--border);border-radius:4px;color:var(--ink-2);font-family:'JetBrains Mono';font-size:10px;padding:3px 6px;outline:none">
              </div>
              <input type="text" value="${esc(ex.notes || '')}" placeholder="Notes / consignes (optionnel)" onchange="state._editingOffseason.exercises[${i}].notes=this.value" style="width:100%;background:var(--bg-1);border:1px solid var(--border);border-radius:4px;color:var(--ink-2);font-family:'Inter';font-size:11px;padding:4px 6px;margin-top:4px;outline:none">
            </div>
            <div style="display:flex;flex-direction:column;gap:2px">
              ${i > 0 ? `<button class="btn btn-icon" onclick="moveOffseasonStep(${i},-1)" style="width:24px;height:20px;font-size:10px;padding:0">▲</button>` : ''}
              ${i < e.exercises.length - 1 ? `<button class="btn btn-icon" onclick="moveOffseasonStep(${i},1)" style="width:24px;height:20px;font-size:10px;padding:0">▼</button>` : ''}
            </div>
            <button class="btn btn-icon" onclick="removeOffseasonStep(${i})" style="color:var(--red);flex-shrink:0">✕</button>
          </div>
        `).join('')}
      </div>

      <button class="btn btn-secondary btn-block" onclick="addOffseasonStep()" style="margin-bottom:14px">+ Exercice personnalisé</button>

      <div class="eyebrow-muted" style="margin-bottom:6px;font-size:9px">Templates rapides (tap pour ajouter)</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px">
        ${OFFSEASON_TEMPLATES.map((t, i) => `
          <button class="feedback-suggest-chip suggest-pos" onclick="addOffseasonTemplate(${i})">+ ${esc(t.label)}</button>
        `).join('')}
      </div>
      `}
    </div>
    <div class="modal-footer" style="flex-direction:column;gap:6px">
      <div style="display:flex;gap:6px;width:100%">
        <button class="btn btn-secondary btn-block" onclick="closeModal();state._editingOffseason=null">Annuler</button>
        <button class="btn btn-primary btn-block" onclick="saveOffseason()">Enregistrer</button>
      </div>
      ${state.offseason ? `<button class="btn btn-ghost btn-block" style="color:var(--red);font-size:11px" onclick="deleteOffseason()">🗑 Supprimer le programme</button>` : ''}
    </div>
  `);
}

function addOffseasonStep() {
  state._editingOffseason.exercises.push({ id: uid(), label: '', target: 0, unit: '', notes: '' });
  renderOffseasonEditor();
}

function addOffseasonTemplate(idx) {
  const t = OFFSEASON_TEMPLATES[idx];
  state._editingOffseason.exercises.push({ id: uid(), label: t.label, target: t.target, unit: t.unit, notes: t.notes });
  renderOffseasonEditor();
}

function removeOffseasonStep(idx) {
  state._editingOffseason.exercises.splice(idx, 1);
  renderOffseasonEditor();
}

function moveOffseasonStep(idx, delta) {
  const arr = state._editingOffseason.exercises;
  const newIdx = idx + delta;
  if (newIdx < 0 || newIdx >= arr.length) return;
  const tmp = arr[idx]; arr[idx] = arr[newIdx]; arr[newIdx] = tmp;
  renderOffseasonEditor();
}

// ============================================================
// PHASE 4 — MODE JOURNALIER (daily schedule)
// ------------------------------------------------------------
// state._editingOffseason.dailySchedule : { 'YYYY-MM-DD': [{ id, label, sets,
// reps, durationMin, notes }] }. UI : liste des dates planifiées (triées) +
// ajout d'une date dans la fenêtre [startDate, endDate]. Chaque date = liste
// d'exos avec sets/reps/durée. Auto-save : voir saveOffseason (bouton commun).
// ============================================================
function renderDailySchedule(e) {
  const sched = e.dailySchedule || {};
  const dates = Object.keys(sched).sort();
  const dateInputMin = e.startDate || '';
  const dateInputMax = e.endDate || '';

  const dateBlocks = dates.length === 0
    ? `<div style="padding:14px;text-align:center;color:var(--ink-3);font-size:12px;font-style:italic;border:1px dashed var(--border);border-radius:8px">Aucune date planifiée · ajoute une date ci-dessous</div>`
    : dates.map(date => {
        const items = sched[date] || [];
        return `
        <div style="border:1px solid var(--border);border-radius:8px;margin-bottom:10px;overflow:hidden">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--bg-3)">
            <div style="font-family:'Anton';font-size:13px;text-transform:uppercase;letter-spacing:0.03em">${formatDate(date, 'long')}</div>
            <button class="btn btn-icon" onclick="removeOffseasonDay('${date}')" style="color:var(--red);width:24px;height:24px" title="Retirer cette date">✕</button>
          </div>
          <div style="padding:8px 10px;display:flex;flex-direction:column;gap:6px">
            ${items.length === 0 ? `<div style="color:var(--ink-4);font-size:11px;font-family:'JetBrains Mono'">Aucun exo</div>` : items.map((it, i) => `
              <div class="warmup-step">
                <div style="font-family:'Anton';font-size:13px;color:var(--orange);min-width:20px">${i+1}</div>
                <div style="flex:1;min-width:0">
                  <input type="text" value="${esc(it.label || '')}" placeholder="Exercice" onchange="setOffseasonDayField('${date}',${i},'label',this.value)" style="width:100%;background:transparent;border:0;color:var(--ink);font-family:'Inter';font-size:13px;padding:2px 0;outline:none">
                  <div style="display:flex;gap:6px;margin-top:4px;flex-wrap:wrap">
                    <input type="number" value="${it.sets || ''}" min="0" placeholder="séries" onchange="setOffseasonDayField('${date}',${i},'sets',parseInt(this.value)||0)" style="width:62px;background:var(--bg-1);border:1px solid var(--border);border-radius:4px;color:var(--ink);font-family:'JetBrains Mono';font-size:10px;padding:3px 6px;text-align:center">
                    <input type="number" value="${it.reps || ''}" min="0" placeholder="reps" onchange="setOffseasonDayField('${date}',${i},'reps',parseInt(this.value)||0)" style="width:62px;background:var(--bg-1);border:1px solid var(--border);border-radius:4px;color:var(--ink);font-family:'JetBrains Mono';font-size:10px;padding:3px 6px;text-align:center">
                    <input type="number" value="${it.durationMin || ''}" min="0" placeholder="min" onchange="setOffseasonDayField('${date}',${i},'durationMin',parseInt(this.value)||0)" style="width:54px;background:var(--bg-1);border:1px solid var(--border);border-radius:4px;color:var(--ink);font-family:'JetBrains Mono';font-size:10px;padding:3px 6px;text-align:center">
                  </div>
                  <input type="text" value="${esc(it.notes || '')}" placeholder="Notes (optionnel)" onchange="setOffseasonDayField('${date}',${i},'notes',this.value)" style="width:100%;background:var(--bg-1);border:1px solid var(--border);border-radius:4px;color:var(--ink-2);font-family:'Inter';font-size:11px;padding:4px 6px;margin-top:4px;outline:none">
                </div>
                <button class="btn btn-icon" onclick="removeOffseasonDayExercise('${date}',${i})" style="color:var(--red);flex-shrink:0">✕</button>
              </div>
            `).join('')}
            <button class="btn btn-secondary btn-block" onclick="addOffseasonDayExercise('${date}')" style="font-size:11px">+ Ajouter un exo à cette date</button>
          </div>
        </div>`;
      }).join('');

  return `
    <div class="eyebrow-muted" style="margin-top:14px;margin-bottom:8px">Planning journalier (${dates.length} date${dates.length>1?'s':''})</div>
    ${dateBlocks}
    <div style="display:flex;gap:6px;margin-top:10px;margin-bottom:8px">
      <input id="os-new-date" type="date" ${dateInputMin?`min="${dateInputMin}"`:''} ${dateInputMax?`max="${dateInputMax}"`:''} style="flex:1;padding:8px 10px;background:var(--bg-3);border:1px solid var(--border);border-radius:6px;color:var(--ink);font-size:12px">
      <button class="btn btn-secondary" onclick="addOffseasonDay()" style="font-size:12px;white-space:nowrap">+ Date</button>
    </div>
  `;
}

function addOffseasonDay() {
  const e = state._editingOffseason;
  const input = document.getElementById('os-new-date');
  const date = input && input.value;
  if (!date) return;
  if (e.startDate && date < e.startDate) { alert('Date avant le début du programme.'); return; }
  if (e.endDate && date > e.endDate) { alert('Date après la fin du programme.'); return; }
  e.dailySchedule = e.dailySchedule || {};
  if (!e.dailySchedule[date]) e.dailySchedule[date] = [];
  renderOffseasonEditor();
}

function removeOffseasonDay(date) {
  const e = state._editingOffseason;
  if (!e.dailySchedule) return;
  const items = e.dailySchedule[date] || [];
  if (items.length && !confirm('Retirer cette date et ses ' + items.length + ' exo(s) ?')) return;
  delete e.dailySchedule[date];
  renderOffseasonEditor();
}

function addOffseasonDayExercise(date) {
  const e = state._editingOffseason;
  e.dailySchedule = e.dailySchedule || {};
  e.dailySchedule[date] = e.dailySchedule[date] || [];
  e.dailySchedule[date].push({ id: uid(), label: '', sets: 0, reps: 0, durationMin: 0, notes: '' });
  renderOffseasonEditor();
}

function removeOffseasonDayExercise(date, idx) {
  const e = state._editingOffseason;
  if (!e.dailySchedule || !e.dailySchedule[date]) return;
  e.dailySchedule[date].splice(idx, 1);
  renderOffseasonEditor();
}

// MAJ d'un champ sans re-render (préserve le focus dans l'input en cours).
function setOffseasonDayField(date, idx, field, value) {
  const e = state._editingOffseason;
  if (!e.dailySchedule || !e.dailySchedule[date] || !e.dailySchedule[date][idx]) return;
  e.dailySchedule[date][idx][field] = value;
}

function saveOffseason() {
  const e = state._editingOffseason;
  const title = document.getElementById('os-title').value.trim() || 'Prépa estivale';
  const startDate = document.getElementById('os-start').value;
  const endDate = document.getElementById('os-end').value;
  if (!startDate || !endDate) { alert('Date de début et de fin requises'); return; }
  const mode = e.mode === 'daily' ? 'daily' : 'weekly';
  const exercises = e.exercises.filter(ex => (ex.label || '').trim());
  // PHASE 4 : nettoie le planning journalier (purge dates vides) + assure les id.
  const dailySchedule = {};
  Object.entries(e.dailySchedule || {}).forEach(([date, arr]) => {
    const items = (arr || []).filter(it => (it.label || '').trim());
    items.forEach(it => { if (!it.id) it.id = uid(); });
    if (items.length) dailySchedule[date] = items;
  });
  // Validation selon le mode actif (l'autre mode est conservé en backup).
  if (mode === 'weekly' && exercises.length === 0) { alert('Au moins un exercice hebdomadaire est requis'); return; }
  if (mode === 'daily' && Object.keys(dailySchedule).length === 0) { alert('Ajoute au moins un exercice à une date'); return; }
  // Réassigner des id pour s'assurer qu'ils sont uniques (hebdo).
  exercises.forEach(ex => { if (!ex.id) ex.id = uid(); });
  state.offseason = { title, startDate, endDate, mode, exercises, dailySchedule };
  state._editingOffseason = null;
  persist();
  closeModal();
  render();
}

function deleteOffseason() {
  if (!confirm('Supprimer le programme et tous les suivis associés ?')) return;
  state.offseason = null;
  state.offseasonLogs = {};
  state._editingOffseason = null;
  persist();
  closeModal();
  render();
}

// === JOUEUSE : cocher les exercices ===

function openMyOffseason() {
  if (state.auth.role !== 'player') return;
  const o = state.offseason;
  const pid = state.auth.playerId;
  if (!o || !pid) return;
  // PHASE 4 : mode journalier → vue "programme du jour" dédiée.
  if (o.mode === 'daily') return openMyOffseasonDaily();
  const todayStr = new Date().toISOString().slice(0,10);
  const beforeStart = o.startDate && todayStr < o.startDate;
  const afterEnd = o.endDate && todayStr > o.endDate;
  const active = !beforeStart && !afterEnd;
  const weekKey = getWeekKey();
  state.offseasonLogs = state.offseasonLogs || {};
  state.offseasonLogs[pid] = state.offseasonLogs[pid] || {};
  state.offseasonLogs[pid][weekKey] = state.offseasonLogs[pid][weekKey] || {};
  const log = state.offseasonLogs[pid][weekKey];
  const doneCount = active ? o.exercises.filter(ex => log[ex.id] && log[ex.id].done).length : 0;
  const pct = active && o.exercises.length > 0 ? Math.round((doneCount / o.exercises.length) * 100) : 0;

  // Bandeau d'info selon l'état
  let infoBanner;
  if (beforeStart) {
    infoBanner = `<div style="padding:10px 12px;background:rgba(99,102,241,0.10);border-left:3px solid #6366f1;border-radius:6px;margin-bottom:14px;font-size:12px;color:var(--ink-2);line-height:1.5">📅 <strong>Démarre le ${formatDate(o.startDate)}</strong>.<br>Découvre le programme dès maintenant pour t'organiser.</div>`;
  } else if (afterEnd) {
    infoBanner = `<div style="padding:10px 12px;background:rgba(34,197,94,0.10);border-left:3px solid var(--green);border-radius:6px;margin-bottom:14px;font-size:12px;color:var(--ink-2);line-height:1.5">🏁 <strong>Programme terminé le ${formatDate(o.endDate)}</strong>.<br>Tu peux consulter ton historique ci-dessous.</div>`;
  } else {
    infoBanner = `<div style="padding:10px 12px;background:var(--bg-3);border-left:3px solid var(--orange);border-radius:6px;margin-bottom:14px;font-size:11px;color:var(--ink-2);line-height:1.5">Coche chaque exercice fait cette semaine. Reset auto chaque lundi. Ton coach voit ta progression.</div>`;
  }

  openModal(`
    <div class="modal-header">
      <div>
        <div class="eyebrow">${active ? formatWeekRange() : (beforeStart ? 'À venir' : 'Terminé')}</div>
        <div class="modal-title">☀ ${esc(o.title)}</div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      ${infoBanner}

      <!-- Progression semaine -->
      ${active ? `
      <div style="text-align:center;padding:14px;background:var(--bg-2);border-radius:10px;margin-bottom:14px;border:1px solid ${pct===100?'var(--green)':'var(--border)'}">
        <div style="font-family:'Anton';font-size:36px;color:${pct===100?'var(--green)':'var(--orange)'};line-height:1">${doneCount}<span style="font-size:18px;color:var(--ink-4)">/${o.exercises.length}</span></div>
        <div style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.06em;margin:6px 0 10px">Exercices · ${pct}%</div>
        <div style="height:6px;background:var(--bg-1);border-radius:3px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--orange),${pct===100?'var(--green)':'#cc5400'});transition:width 0.3s"></div>
        </div>
      </div>
      ` : ''}

      <!-- Liste exos -->
      <div style="display:flex;flex-direction:column;gap:8px">
        ${o.exercises.map(ex => {
          const entry = log[ex.id] || {};
          const isDone = active && !!entry.done;
          const clickAttr = active ? `onclick="toggleOffseasonExercise('${ex.id}')"` : '';
          return `
            <div class="warmup-step-do ${isDone ? 'done' : ''}" ${clickAttr} style="${active ? '' : 'cursor:default;opacity:0.85'}">
              <div style="font-family:'Anton';font-size:18px;color:${isDone?'var(--green)':'var(--orange)'};min-width:32px;text-align:center">${isDone ? '✓' : '○'}</div>
              <div style="flex:1;min-width:0">
                <div style="font-family:'Anton';font-size:14px;text-transform:uppercase;${isDone?'text-decoration:line-through;color:var(--ink-3)':''}">${esc(ex.label)}</div>
                <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:3px">
                  ${ex.target > 0 ? `<span style="font-size:10px;color:var(--orange);font-family:'JetBrains Mono';text-transform:uppercase">🎯 ${ex.target} ${esc(ex.unit || '')}</span>` : ''}
                  ${ex.notes ? `<span style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';font-style:italic">${esc(ex.notes)}</span>` : ''}
                </div>
              </div>
            </div>
          `;
        }).join('')}
      </div>

      <!-- Historique des semaines passées -->
      ${(() => {
        const allWeeks = Object.keys(state.offseasonLogs[pid] || {}).filter(w => w !== weekKey).sort().reverse().slice(0, 4);
        if (allWeeks.length === 0) return '';
        return `
          <div class="eyebrow-muted mb-2" style="margin-top:18px">Semaines passées</div>
          <div style="display:flex;flex-direction:column;gap:4px">
            ${allWeeks.map(wk => {
              const wLog = state.offseasonLogs[pid][wk] || {};
              const wDone = o.exercises.filter(ex => wLog[ex.id] && wLog[ex.id].done).length;
              const wPct = o.exercises.length > 0 ? Math.round((wDone / o.exercises.length) * 100) : 0;
              const color = wPct >= 80 ? 'var(--green)' : wPct >= 50 ? 'var(--orange)' : 'var(--red)';
              return `
                <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg-2);border-radius:6px">
                  <div style="font-family:'JetBrains Mono';font-size:10px;color:var(--ink-3);text-transform:uppercase;min-width:60px">${wk}</div>
                  <div style="flex:1;height:5px;background:var(--bg-1);border-radius:3px;overflow:hidden">
                    <div style="height:100%;width:${wPct}%;background:${color}"></div>
                  </div>
                  <div style="font-family:'Anton';font-size:13px;color:${color};min-width:50px;text-align:right">${wDone}/${o.exercises.length}</div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      })()}
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary btn-block" onclick="closeModal()">Fermer</button>
    </div>
  `);
}

function toggleOffseasonExercise(exId) {
  if (state.auth.role !== 'player') return;
  const pid = state.auth.playerId;
  const weekKey = getWeekKey();
  state.offseasonLogs = state.offseasonLogs || {};
  state.offseasonLogs[pid] = state.offseasonLogs[pid] || {};
  state.offseasonLogs[pid][weekKey] = state.offseasonLogs[pid][weekKey] || {};
  const log = state.offseasonLogs[pid][weekKey];
  log[exId] = log[exId] || {};
  log[exId].done = !log[exId].done;
  if (log[exId].done) log[exId].at = Date.now();
  persist();
  // 1. MAJ home en arrière-plan (carte progression)
  render();
  // 2. Préserver scroll dans le modal avant re-render
  const mb = document.querySelector('#modal-root .modal-body');
  const prevScroll = mb ? mb.scrollTop : 0;
  // 3. Re-monter le modal avec le nouvel état
  openMyOffseason();
  // 4. Restaurer scroll
  const newMb = document.querySelector('#modal-root .modal-body');
  if (newMb) newMb.scrollTop = prevScroll;
}

// === JOUEUSE : vue mode journalier (programme du jour + à venir) ===
// Les logs de complétion sont stockés dans state.offseasonLogs[pid][dateKey]
// (dateKey = 'YYYY-MM-DD' au lieu de 'YYYY-Www'). La colonne iso_week étant un
// text, ça transite par la même entité offseasonLogs sans changement de schéma.
function openMyOffseasonDaily() {
  const o = state.offseason;
  const pid = state.auth.playerId;
  const sched = o.dailySchedule || {};
  const todayStr = new Date().toISOString().slice(0, 10);
  const allDates = Object.keys(sched).sort();
  // Dates à afficher : aujourd'hui + à venir (dans la fenêtre du programme).
  const upcoming = allDates.filter(d => d >= todayStr);
  const past = allDates.filter(d => d < todayStr).reverse().slice(0, 5);

  state.offseasonLogs = state.offseasonLogs || {};
  state.offseasonLogs[pid] = state.offseasonLogs[pid] || {};

  const dayBlock = (date, isToday) => {
    const items = sched[date] || [];
    const dlog = state.offseasonLogs[pid][date] || {};
    const doneCount = items.filter(it => dlog[it.id] && dlog[it.id].done).length;
    const pct = items.length ? Math.round((doneCount / items.length) * 100) : 0;
    return `
      <div style="border:1px solid ${isToday ? 'var(--orange)' : 'var(--border)'};border-radius:10px;margin-bottom:10px;overflow:hidden">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:${isToday ? 'rgba(255,107,0,0.08)' : 'var(--bg-3)'}">
          <div>
            <div class="eyebrow" style="color:${isToday ? 'var(--orange)' : 'var(--ink-3)'}">${isToday ? "Aujourd'hui" : formatDate(date, 'short')}</div>
            <div style="font-family:'Anton';font-size:14px;text-transform:uppercase">${formatDate(date, 'long')}</div>
          </div>
          <div style="font-family:'Anton';font-size:20px;color:${pct===100?'var(--green)':'var(--orange)'}">${doneCount}<span style="font-size:12px;color:var(--ink-4)">/${items.length}</span></div>
        </div>
        <div style="padding:8px 12px;display:flex;flex-direction:column;gap:6px">
          ${items.map(it => {
            const entry = dlog[it.id] || {};
            const isDone = !!entry.done;
            const meta = [
              it.sets ? it.sets + ' séries' : '',
              it.reps ? it.reps + ' reps' : '',
              it.durationMin ? it.durationMin + ' min' : '',
            ].filter(Boolean).join(' · ');
            return `
              <div class="warmup-step-do ${isDone ? 'done' : ''}" onclick="toggleOffseasonDailyExercise('${date}','${it.id}')">
                <div style="font-family:'Anton';font-size:18px;color:${isDone?'var(--green)':'var(--orange)'};min-width:32px;text-align:center">${isDone ? '✓' : '○'}</div>
                <div style="flex:1;min-width:0">
                  <div style="font-family:'Anton';font-size:14px;text-transform:uppercase;${isDone?'text-decoration:line-through;color:var(--ink-3)':''}">${esc(it.label)}</div>
                  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:3px">
                    ${meta ? `<span style="font-size:10px;color:var(--orange);font-family:'JetBrains Mono';text-transform:uppercase">🎯 ${esc(meta)}</span>` : ''}
                    ${it.notes ? `<span style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';font-style:italic">${esc(it.notes)}</span>` : ''}
                  </div>
                </div>
              </div>`;
          }).join('')}
        </div>
      </div>`;
  };

  const todayHasPlan = !!sched[todayStr];
  openModal(`
    <div class="modal-header">
      <div>
        <div class="eyebrow">Programme journalier</div>
        <div class="modal-title">☀ ${esc(o.title)}</div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      ${todayHasPlan ? dayBlock(todayStr, true) : `<div style="padding:14px;background:var(--bg-3);border-left:3px solid var(--ink-3);border-radius:6px;margin-bottom:14px;font-size:12px;color:var(--ink-2);line-height:1.5">Rien de prévu aujourd'hui. Repos ou séance libre 💪</div>`}
      ${upcoming.filter(d => d !== todayStr).length ? `<div class="eyebrow-muted mb-2" style="margin-top:14px">À venir</div>${upcoming.filter(d => d !== todayStr).map(d => dayBlock(d, false)).join('')}` : ''}
      ${past.length ? `<div class="eyebrow-muted mb-2" style="margin-top:14px">Jours passés</div>${past.map(d => dayBlock(d, false)).join('')}` : ''}
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary btn-block" onclick="closeModal()">Fermer</button>
    </div>
  `);
}

function toggleOffseasonDailyExercise(date, exId) {
  if (state.auth.role !== 'player') return;
  const pid = state.auth.playerId;
  state.offseasonLogs = state.offseasonLogs || {};
  state.offseasonLogs[pid] = state.offseasonLogs[pid] || {};
  state.offseasonLogs[pid][date] = state.offseasonLogs[pid][date] || {};
  const log = state.offseasonLogs[pid][date];
  log[exId] = log[exId] || {};
  log[exId].done = !log[exId].done;
  if (log[exId].done) log[exId].at = Date.now();
  persist();
  render();
  const mb = document.querySelector('#modal-root .modal-body');
  const prevScroll = mb ? mb.scrollTop : 0;
  openMyOffseasonDaily();
  const newMb = document.querySelector('#modal-root .modal-body');
  if (newMb) newMb.scrollTop = prevScroll;
}

// PHASE 4 : dashboard coach en mode journalier (suivi du jour).
function openOffseasonDashboardDaily() {
  const o = state.offseason;
  const sched = o.dailySchedule || {};
  const today = new Date().toISOString().slice(0, 10);
  const items = sched[today] || [];
  const logs = state.offseasonLogs || {};
  const _seasonPool = currentSeasonPlayers();

  const playersStats = _seasonPool.map(p => {
    const pLog = (logs[p.id] || {})[today] || {};
    const doneCount = items.filter(it => pLog[it.id] && pLog[it.id].done).length;
    const pct = items.length > 0 ? Math.round((doneCount / items.length) * 100) : 0;
    return { player: p, doneCount, pct };
  }).sort((a, b) => b.pct - a.pct);

  const totalDone = playersStats.reduce((acc, x) => acc + x.doneCount, 0);
  const totalExpected = _seasonPool.length * items.length;
  const teamPct = totalExpected > 0 ? Math.round((totalDone / totalExpected) * 100) : 0;
  const teamColor = teamPct >= 70 ? 'var(--green)' : teamPct >= 40 ? 'var(--orange)' : 'var(--red)';
  const plannedDates = Object.keys(sched).length;

  openModal(`
    <div class="modal-header">
      <div>
        <div class="eyebrow">🗓 Journalier · ${formatDate(today, 'long')}</div>
        <div class="modal-title">Suivi · ${esc(o.title)}</div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      ${items.length === 0 ? `
        <div style="padding:14px;background:var(--bg-3);border-left:3px solid var(--ink-3);border-radius:6px;margin-bottom:14px;font-size:12px;color:var(--ink-2);line-height:1.5">
          Aucun exercice prévu aujourd'hui (${plannedDates} date${plannedDates>1?'s':''} planifiée${plannedDates>1?'s':''} au total).
        </div>
      ` : `
        <div style="text-align:center;padding:14px;background:var(--bg-2);border-radius:10px;margin-bottom:14px;border:1px solid ${teamPct===100?'var(--green)':'var(--border)'}">
          <div style="font-family:'Anton';font-size:36px;color:${teamColor};line-height:1">${teamPct}%</div>
          <div style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.06em;margin-top:6px">Engagement équipe · aujourd'hui · ${items.length} exo${items.length>1?'s':''}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px">
          ${playersStats.map(x => {
            const color = x.pct >= 80 ? 'var(--green)' : x.pct >= 40 ? 'var(--orange)' : 'var(--red)';
            return `
              <div class="offseason-row" onclick="openOffseasonPlayerDetail('${x.player.id}')">
                <div style="flex:1;min-width:0">
                  <div style="font-family:'Anton';font-size:13px;text-transform:uppercase">${esc(x.player.name)}</div>
                  <div style="height:5px;background:var(--bg-1);border-radius:3px;overflow:hidden;margin-top:5px">
                    <div style="height:100%;width:${x.pct}%;background:${color}"></div>
                  </div>
                </div>
                <div style="font-family:'Anton';font-size:15px;color:${color};min-width:54px;text-align:right">${x.doneCount}/${items.length}</div>
              </div>`;
          }).join('')}
        </div>
      `}
    </div>
    <div class="modal-footer" style="flex-direction:column;gap:6px">
      <button class="btn btn-secondary btn-block" onclick="closeModal();setTimeout(()=>openOffseasonConfig(),50)">✎ Modifier le programme</button>
      <button class="btn btn-primary btn-block" onclick="closeModal()">Fermer</button>
    </div>
  `);
}

function openOffseasonDashboard() {
  const o = state.offseason;
  if (!o) return;
  // PHASE 4 : en mode journalier, le suivi est par date (aujourd'hui).
  if (o.mode === 'daily') return openOffseasonDashboardDaily();
  const weekKey = getWeekKey();
  const logs = state.offseasonLogs || {};

  // SAISON : suivi offseason scopé à l'effectif de la saison courante
  const _seasonPool = currentSeasonPlayers();

  // Stats par joueuse pour la semaine en cours
  const playersStats = _seasonPool.map(p => {
    const playerLogs = (logs[p.id] || {})[weekKey] || {};
    const doneCount = o.exercises.filter(ex => playerLogs[ex.id] && playerLogs[ex.id].done).length;
    const pct = o.exercises.length > 0 ? Math.round((doneCount / o.exercises.length) * 100) : 0;
    // Calcul moyenne sur les 4 dernières semaines
    const allWeeks = Object.keys(logs[p.id] || {}).sort().reverse().slice(0, 4);
    let totalDone = 0, totalExpected = 0;
    allWeeks.forEach(wk => {
      const wLog = (logs[p.id] || {})[wk] || {};
      o.exercises.forEach(ex => { totalExpected++; if (wLog[ex.id] && wLog[ex.id].done) totalDone++; });
    });
    const avgPct = totalExpected > 0 ? Math.round((totalDone / totalExpected) * 100) : 0;
    return { player: p, doneCount, pct, avgPct, weeksTracked: allWeeks.length };
  }).sort((a,b) => b.pct - a.pct);

  // Stats globales équipe
  const totalDone = playersStats.reduce((acc, x) => acc + x.doneCount, 0);
  const totalExpected = _seasonPool.length * o.exercises.length;
  const teamPct = totalExpected > 0 ? Math.round((totalDone / totalExpected) * 100) : 0;

  openModal(`
    <div class="modal-header">
      <div>
        <div class="eyebrow">${formatWeekRange()}</div>
        <div class="modal-title">☀ ${esc(o.title)} · Suivi</div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

        <div class="stat-tile">
          <div class="stat-tile-label">Engagement</div>
          <div class="stat-tile-value" style="color:${teamPct>=70?'var(--green)':teamPct>=40?'var(--orange)':'var(--red)'}">${teamPct}%</div>
        </div>
        <div class="stat-tile">
          <div class="stat-tile-label">Exos done</div>
          <div class="stat-tile-value">${totalDone}<span style="font-size:14px;color:var(--ink-4)">/${totalExpected}</span></div>
        </div>
        <div class="stat-tile">
          <div class="stat-tile-label">Période</div>
          <div class="stat-tile-value" style="font-size:14px">${formatDate(o.startDate, 'short')}<br><span style="font-size:10px;color:var(--ink-3)">→ ${formatDate(o.endDate, 'short')}</span></div>
        </div>
      </div>

      <!-- Détail par joueuse -->
      <div class="eyebrow-muted mb-2">Cette semaine · classement par engagement</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${playersStats.map((x, i) => {
          const color = x.pct >= 70 ? 'var(--green)' : x.pct >= 40 ? 'var(--orange)' : 'var(--red)';
          const status = x.pct === 100 ? '🔥 PARFAIT' : x.pct >= 70 ? '✓ ENGAGÉE' : x.pct >= 40 ? '~ EN COURS' : x.pct > 0 ? '⚠ FAIBLE' : '✕ AUCUN';
          return `
            <div class="offseason-row" onclick="openOffseasonPlayerDetail('${x.player.id}')">
              ${x.player.photo ? `<img src="${x.player.photo}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:1.5px solid var(--border)">` : `<div style="width:36px;height:36px;border-radius:50%;background:var(--bg-3);display:flex;align-items:center;justify-content:center;font-family:'Anton';font-size:14px;color:var(--orange)">${esc(x.player.name.charAt(0).toUpperCase())}</div>`}
              <div style="flex:1;min-width:0">
                <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
                  <div style="font-family:'Anton';font-size:13px;text-transform:uppercase">#${x.player.num} ${esc(x.player.name)}</div>
                  <div style="font-size:8px;color:${color};font-family:'JetBrains Mono';font-weight:700;text-transform:uppercase;letter-spacing:0.06em">${status}</div>
                </div>
                <div style="height:4px;background:var(--bg-1);border-radius:2px;overflow:hidden">
                  <div style="height:100%;width:${x.pct}%;background:${color}"></div>
                </div>
                ${x.weeksTracked > 1 ? `<div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:3px;text-transform:uppercase">Moy. ${x.weeksTracked} sem. · ${x.avgPct}%</div>` : ''}
              </div>
              <div style="text-align:right;min-width:50px">
                <div style="font-family:'Anton';font-size:18px;color:${color}">${x.doneCount}<span style="font-size:11px;color:var(--ink-4)">/${o.exercises.length}</span></div>
                <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase">${x.pct}%</div>
              </div>
              <div style="color:var(--ink-3);font-size:14px">›</div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary btn-block" onclick="closeModal();setTimeout(()=>openOffseasonConfig(),50)">✎ Modifier le programme</button>
      <button class="btn btn-primary btn-block" onclick="closeModal()">Fermer</button>

  const p = state.players.find(x => x.id === pid);

  const existing = (p.warmupRoutine && p.warmupRoutine.steps) || [];
  state._editingRoutine = {

              <input type="text" value="${esc(s.label)}" placeholder="Description" onchange="state._editingRoutine.steps[${i}].label=this.value" style="width:100%;background:transparent;border:0;color:var(--ink);font-family:'Inter';font-size:13px;padding:2px 0;outline:none">
              <div style="display:flex;gap:6px;margin-top:4px">
                <input type="number" value="${s.count || 0}" min="0" placeholder="Nb" onchange="state._editingRoutine.steps[${i}].count=parseInt(this.value)||0" style="width:60px;background:var(--bg-1);border:1px solid var(--border);border-radius:4px;color:var(--ink);font-family:'JetBrains Mono';font-size:11px;padding:3px 6px;text-align:center">
                <input type="text" value="${esc(s.notes || '')}" placeholder="Notes (ex: à droite, vif...)" onchange="state._editingRoutine.steps[${i}].notes=this.value" style="flex:1;background:var(--bg-1);border:1px solid var(--border);border-radius:4px;color:var(--ink-2);font-family:'JetBrains Mono';font-size:10px;padding:3px 6px;outline:none">
              </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:2px">
              ${i > 0 ? `<button class="btn btn-icon" onclick="moveWarmupStep(${i},-1)" style="width:24px;height:20px;font-size:10px;padding:0">▲</button>` : ''}
              ${i < r.steps.length - 1 ? `<button class="btn btn-icon" onclick="moveWarmupStep(${i},1)" style="width:24px;height:20px;font-size:10px;padding:0">▼</button>` : ''}
            </div>
            <button class="btn btn-icon" onclick="removeWarmupStep(${i})" style="color:var(--red);flex-shrink:0">✕</button>
          </div>
        `).join('')}
      </div>

      <!-- Ajout perso -->
      <button class="btn btn-secondary btn-block" onclick="addWarmupStep()" style="margin-bottom:14px">+ Étape personnalisée</button>

      <!-- Templates -->
      <div class="eyebrow-muted" style="margin-bottom:6px;font-size:9px">Templates rapides (tap pour ajouter)</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px">
        ${WARMUP_TEMPLATES.map((t, i) => `
          <button class="feedback-suggest-chip suggest-pos" onclick="addWarmupTemplate(${i})">+ ${esc(t.label)} ${t.count > 1 ? '×' + t.count : ''}</button>
        `).join('')}
      </div>
    </div>
    <div class="modal-footer" style="flex-direction:column;gap:6px">
      <div style="display:flex;gap:6px;width:100%">
        <button class="btn btn-secondary btn-block" onclick="closeModal();state._editingRoutine=null;setTimeout(()=>editPlayer('${r.pid}'),50)">Annuler</button>
        <button class="btn btn-primary btn-block" onclick="saveWarmupRoutine()">Enregistrer</button>
      </div>
    </div>
  `);
}

function addWarmupStep() {
  state._editingRoutine.steps.push({ label: '', count: 0, notes: '' });
  renderWarmupEditor();
}

function addWarmupTemplate(idx) {
  const t = WARMUP_TEMPLATES[idx];
  state._editingRoutine.steps.push({ label: t.label, count: t.count || 0, notes: '' });
  renderWarmupEditor();
}

function removeWarmupStep(idx) {
  state._editingRoutine.steps.splice(idx, 1);
  renderWarmupEditor();
}

function moveWarmupStep(idx, delta) {
  const r = state._editingRoutine;
  const newIdx = idx + delta;
  if (newIdx < 0 || newIdx >= r.steps.length) return;
  const tmp = r.steps[idx];
  r.steps[idx] = r.steps[newIdx];
  r.steps[newIdx] = tmp;
  renderWarmupEditor();
}

function saveWarmupRoutine() {
  const r = state._editingRoutine;
  const p = state.players.find(x => x.id === r.pid);
  if (!p) return;
  const steps = r.steps.map(s => ({ ...s, label: (s.label || '').trim() })).filter(s => s.label.length > 0);
  if (steps.length === 0) {
    delete p.warmupRoutine;
  } else {
    p.warmupRoutine = { steps, updatedAt: Date.now() };
  }
  state._editingRoutine = null;
  persist();
  closeModal();
  setTimeout(() => editPlayer(r.pid), 50);
}

function savePlayerEdit(pid) {
  const p = state.players.find(x => x.id === pid);
  if (!p) return;
  const name = document.getElementById('edp-name').value.trim();
  const num = parseInt(document.getElementById('edp-num').value) || 0;
  const pin = document.getElementById('edp-pin').value.trim();
  if (!name) { alert('Le nom est requis'); return; }
  if (!/^\d{4}$/.test(pin)) { alert('Le PIN doit être 4 chiffres'); return; }
  const pinChanged = (p.pin !== pin);
  p.name = name;
  p.num = num;
  p.pin = pin;
  persist();
  if (window.PbStore) {
    PbStore.upsertPlayer(p).catch(e => console.warn('[sync] upsertPlayer:', e.message));
    // Le PIN ne peut être changé côté serveur que via l'RPC set_player_pin
    // (L2 coach requis). En L1, on change uniquement en local — multi-device
    // ne syncera pas le PIN tant que le coach ne s'est pas connecté L2.
    if (pinChanged && window.sb && Pb.user) {
      sb.rpc('set_player_pin', { p_player_id: pid, p_new_pin: pin })

  }
  closeModal();
  setTimeout(() => managePlayers(), 50);
}

// Compression d'image basique pour rester sous une taille raisonnable.
// Renvoie une dataURL base64 — gardée pour les anciens call-sites (selfie
// match, feedback positifs/négatifs, avatars) qui n'ont pas encore basculé
// sur Storage.
function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => {
      img.onload = () => {
        let { width, height } = img;
        if (width > height) {
          if (width > maxDim) { height *= maxDim / width; width = maxDim; }
        } else {
          if (height > maxDim) { width *= maxDim / height; height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('Image invalide'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Lecture impossible'));
    reader.readAsDataURL(file);
  });
}

// Variante Blob : utilisée par addPlayImages pour upload Supabase Storage.
// Évite l'overhead base64 (+33%) et permet de passer le content-type au bucket.
function compressImageBlob(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => {
      img.onload = () => {
        let { width, height } = img;
        if (width > height) {
          if (width > maxDim) { height *= maxDim / width; width = maxDim; }
        } else {
          if (height > maxDim) { width *= maxDim / height; height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob(b => {
          if (!b) return reject(new Error('Compression échouée'));
          resolve(b);
        }, 'image/jpeg', quality);
      };
      img.onerror = () => reject(new Error('Image invalide'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Lecture impossible'));
    reader.readAsDataURL(file);
  });
}

// ============================================================
// CHAMPIONNAT FFBB (scraping via proxy public)
// ============================================================
// Utilise allorigins.win comme proxy CORS (gratuit, instable)
// À terme, remplacer par /.netlify/functions/ffbb-scraper

// Proxy 1 : notre fonction Netlify (fiable, hébergée avec l'app)
// Proxy 2-4 : proxies publics en fallback (peuvent tomber en panne)
const FFBB_PROXIES = [
  url => '/api/ffbb?url=' + encodeURIComponent(url), // Netlify Function (notre proxy)
  url => 'https://api.allorigins.win/get?url=' + encodeURIComponent(url),
  url => 'https://corsproxy.io/?' + encodeURIComponent(url),
  url => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url),
];

async function fetchViaProxy(targetUrl) {
  let lastErr = null;
  for (const proxyFn of FFBB_PROXIES) {
    try {
      const proxyUrl = proxyFn(targetUrl);
      const resp = await fetch(proxyUrl, { method: 'GET' });
      if (!resp.ok) { lastErr = 'HTTP ' + resp.status; continue; }
      const contentType = resp.headers.get('content-type') || '';
      // allorigins renvoie { contents: "..." }
      if (contentType.includes('application/json') && proxyUrl.includes('allorigins')) {
        const j = await resp.json();
        if (j.contents) return j.contents;
        lastErr = 'allorigins empty';
        continue;
      }
      // Les autres renvoient le HTML brut
      const text = await resp.text();
      if (text && text.length > 500) return text;
      lastErr = 'short response';
    } catch (e) {
      lastErr = e.message;
    }
  }
  throw new Error('Tous les proxies ont échoué : ' + lastErr);
}

// FFBB v2 (2026) : Next.js App Router → plus de __NEXT_DATA__.
// On parse directement le HTML rendu côté serveur. Les matchs apparaissent avec
// une structure régulière (compétition + date + équipes + score/heure + salle).

// Parser principal : extrait les matchs depuis le HTML brut de la page club
function parseClubMatchesFromHTML(html, clubTeamHint) {
  const matches = [];
  if (!html) return matches;

  // On utilise un DOMParser pour naviguer le HTML proprement
  let doc;
  try {
    doc = new DOMParser().parseFromString(html, 'text/html');
  } catch (e) {
    console.error('DOMParser failed', e);
    return matches;
  }

  // Méthode 1 : chercher les blocs "Match" qui contiennent les images d'équipes + score/heure
  // Pattern observé : un titre h3/h4 avec "Journée X", suivi d'une date+heure, puis 2 liens vers équipes avec image, et un lien score/feuille de match.
  
  // On cherche tous les liens vers une page de match : .../match/<id>
  const matchLinks = Array.from(doc.querySelectorAll('a[href*="/match/"]'));
  const processedMatchIds = new Set();
  // Compteur de matchs uniques traités (1-indexé) — sert de fallback de journée
  // pour la page équipe : les matchs sont listés en ordre J1, J2, ..., JN.
  // Quand le texte est glué ("J229 mai" ambigu entre 22+9 ou 2+29), on utilise
  // cet index pour stripper la journée correctement avant de parser le jour.
  let sequentialJourneeIdx = 0;

  matchLinks.forEach(link => {
    const href = link.getAttribute('href') || '';
    const idMatch = href.match(/\/match\/(\d+)/);
    if (!idMatch) return;
    const matchId = idMatch[1];
    if (processedMatchIds.has(matchId)) return;
    sequentialJourneeIdx++;
    processedMatchIds.add(matchId);

    let scoreHome = null, scoreAway = null, played = false;

    // === Méthode 1 (la + fiable, page équipe FFBB 2026) ===
    // Les scores sont dans 2 <span> distincts à l'intérieur du <a> :
    //   - span text-[#8A8FA2] gris = score adversaire
    //   - span text-[#00288e] bleu = score de notre équipe (couleur d'identité club)
    // Ordre dans le DOM : adversaire d'abord, nous ensuite (avec un SVG "versus" entre).
    let myScore = null, oppScore = null;
    const innerSpans = Array.from(link.querySelectorAll('span'));
    innerSpans.forEach(sp => {
      const txt = (sp.textContent || '').trim();
      if (!/^\d{1,3}$/.test(txt)) return;
      const n = parseInt(txt);
      const cls = (sp.getAttribute('class') || '').toLowerCase();
      // Couleurs FFBB :
      //   #00288e (bleu navy) = NOTRE score quand on a GAGNÉ
      //   #dd031f (rouge)     = NOTRE score quand on a PERDU
      //   #8a8fa2 (gris)      = score de l'ADVERSAIRE (toujours)
      if (cls.includes('#00288e') || cls.includes('#dd031f')) myScore = n;
      else if (cls.includes('#8a8fa2')) oppScore = n;
      else if (oppScore === null) oppScore = n;       // ordre de fallback : 1er = adv
      else if (myScore === null) myScore = n;          // 2e = nous
    });
    if (myScore !== null && oppScore !== null) {
      played = true;
      // On range home/away après avoir détecté la perspective (Domicile/Extérieur)
      // plus bas dans le code après extraction du contexte ; on stocke pour l'instant
      // dans des var temporaires.
    }

    // === Méthode 2 (fallback : page club ou format collé) ===
    if (!played) {
      const linkText = (link.textContent || '').trim().replace(/\s+/g, '');
      const scoreMatch = linkText.match(/^(\d{1,3})\s*[-–]?\s*(\d{1,3})$/);
      if (scoreMatch) {
        scoreHome = parseInt(scoreMatch[1]);
        scoreAway = parseInt(scoreMatch[2]);
        played = true;
      } else if (/^\d{4,6}$/.test(linkText)) {
        const len = linkText.length;
        if (len === 4) {
          scoreHome = parseInt(linkText.slice(0, 2));
          scoreAway = parseInt(linkText.slice(2));
        } else if (len === 6) {
          scoreHome = parseInt(linkText.slice(0, 3));
          scoreAway = parseInt(linkText.slice(3));
        } else if (len === 5) {
          const a = [parseInt(linkText.slice(0, 2)), parseInt(linkText.slice(2))];
          const b = [parseInt(linkText.slice(0, 3)), parseInt(linkText.slice(3))];
          if (a[0] >= 20 && a[0] <= 200 && a[1] >= 20 && a[1] <= 200) {
            scoreHome = a[0]; scoreAway = a[1];
          } else {
            scoreHome = b[0]; scoreAway = b[1];
          }
        }
        if (scoreHome !== null && scoreAway !== null && !isNaN(scoreHome) && !isNaN(scoreAway) && (scoreHome > 0 || scoreAway > 0)) {
          played = true;
        } else {
          scoreHome = null; scoreAway = null;
          played = false;
        }
      }
    }

    // Sécurité supplémentaire : si played mais l'un des deux scores est null, on annule
    if (played && scoreHome !== null && (scoreHome === null || scoreAway === null || isNaN(scoreHome) || isNaN(scoreAway))) {
      played = false;
      scoreHome = null;
      scoreAway = null;
    }

    // Remonter dans le DOM pour récupérer le contexte (équipes + date + compétition + salle)
    // Critère : un ancêtre qui contient
    //  - soit ≥2 /equipes/ (page club),
    //  - soit ≥1 /equipes/ + une indication "Domicile|Extérieur" (page équipe)
    // NB : on n'utilise PAS \b parce que la textContent du DOM colle souvent
    // les mots adjacents sans espace (ex: "21h30Extérieur").
    let context = link.parentElement;
    for (let i = 0; i < 8 && context; i++) {
      const teamLinks = context.querySelectorAll('a[href*="/equipes/"]');
      const txt = context.textContent || '';
      const hasLieu = /Domicile|Ext[eé]rieur/i.test(txt);
      if (teamLinks.length >= 2 && hasLieu) break;          // page club : 2 équipes nommées + lieu
      if (teamLinks.length >= 1 && hasLieu) break;          // page équipe : 1 lien adversaire + lieu
      context = context.parentElement;
    }
    if (!context) return;

    // Récupérer les liens vers les équipes — sur la page club il y en a
    // typiquement 2 (home/away). Sur la page équipe il peut n'y en avoir
    // qu'1 (l'adversaire) car notre équipe est implicite (c'est sa page).
    const teamLinks = Array.from(context.querySelectorAll('a[href*="/equipes/"]'));

    function extractTeamName(a) {
      const title = a.getAttribute('title') || '';
      if (title) return title.trim();
      const txt = (a.textContent || '').trim();
      const cleaned = txt.replace(/^https?:[^\s]+\s*/, '').trim();
      return cleaned;
    }

    // Détection Domicile/Extérieur depuis le texte de contexte.
    // NB : pas de \b — le textContent FFBB colle souvent les mots
    // ("21h30Extérieur"), ce qui empêche les frontières \b de matcher
    // → tous les matches finissaient marqués Extérieur par défaut.
    const ctxTextRaw = (context.textContent || '').replace(/\s+/g, ' ');
    const isExterieur = /Ext[eé]rieur/i.test(ctxTextRaw);
    const isDomicile  = /Domicile/i.test(ctxTextRaw);

    let homeTeam, awayTeam;
    if (teamLinks.length >= 2) {
      homeTeam = extractTeamName(teamLinks[0]);
      awayTeam = extractTeamName(teamLinks[1]);
    } else if (teamLinks.length === 1) {
      // Page équipe : 1 seul lien = adversaire. Notre équipe = clubTeamHint
      // si fourni, sinon "Mon équipe" (fallback générique).
      const opp = extractTeamName(teamLinks[0]);
      const us  = clubTeamHint || 'Mon équipe';
      if (isDomicile) { homeTeam = us; awayTeam = opp; }
      else { homeTeam = opp; awayTeam = us; }   // Extérieur par défaut
    } else {
      return; // pas assez d'info, on saute ce match
    }
    if (!homeTeam || !awayTeam) return;

    // Sanity check sur les scores : un score > 200 est aberrant en basket.
    // Origine probable : placeholder, format mal parsé, journée concaténée.
    if (played && ((scoreHome != null && scoreHome > 200) || (scoreAway != null && scoreAway > 200))) {
      played = false;
      scoreHome = null;
      scoreAway = null;
      myScore = null;
      oppScore = null;
    }

    // Remettre scoreHome/scoreAway selon la perspective (uniquement si extraction
    // par spans colorés ; sinon scoreHome/scoreAway ont déjà été assignés par
    // la méthode fallback ci-dessus).
    if (played && myScore !== null && oppScore !== null && scoreHome === null) {
      if (isDomicile) { scoreHome = myScore; scoreAway = oppScore; }
      else { scoreHome = oppScore; scoreAway = myScore; }
    }

    // Chercher la date / heure dans le contexte (avant ou juste avant le score)
    // On strippe "J<sequentialJourneeIdx>" du texte pour désambiguer le jour
    // (FFBB colle "J229 mai" : sans strip, regex pourrait lire "29 mai" au
    // lieu de "9 mai"). Si le strip ne trouve rien, le texte reste intact.
    let ctxText = context.textContent || '';
    if (sequentialJourneeIdx > 0) {
      const expectedJ = 'J' + sequentialJourneeIdx;
      // Remplace l'occurrence par un espace pour préserver les frontières
      const idx0 = ctxText.indexOf(expectedJ);
      if (idx0 >= 0) {
        ctxText = ctxText.slice(0, idx0) + ' ' + ctxText.slice(idx0 + expectedJ.length);
      }
    }
    // Patterns : "9 mai 13h00", "27 sept. 22h30", "5 oct. 15h00", "9 nov. 16h30",
    // "15 mars 18:30", "9/05/2025". Accepte les abréviations FFBB
    // ("sept.", "oct.", "nov.", "déc.", "fév.", "avr.", "juil.")
    // f[ée]vr?\\.? = "fév", "fév.", "févr", "févr." (FFBB utilise "févr.")
    const monthPat = '(janvier|janv\\.?|f[ée]vrier|f[ée]vr?\\.?|mars|avril|avr\\.?|mai|juin|juillet|juil\\.?|ao[uû]t|septembre|sept\\.?|sep\\.?|octobre|oct\\.?|novembre|nov\\.?|d[ée]cembre|d[ée]c\\.?)';
    // Préfixe "J<journee>" optionnel et collé devant le jour (FFBB 2026
    // sort le textContent sans espace : "#130J229 mai" → journée=22, jour=9).
    // Le greedy sur \\d+ assure que la journée prend le maximum, puis
    // backtrack pour que (\\d{1,2})\\s+ se cale sur le jour réel.
    const dateMatch = ctxText.match(new RegExp(
      '(?:J(\\d+)\\s*)?(\\d{1,2})\\s+' + monthPat + '(?:\\s+(\\d{4}))?\\s*(?:à\\s*)?(\\d{1,2})[h:](\\d{2})?',
      'i'
    ));
    let dateStr = null, timeStr = null;
    const MONTHS = {
      'janvier':1, 'janv':1,
      'fevrier':2, 'fev':2,
      'mars':3,
      'avril':4, 'avr':4,
      'mai':5,
      'juin':6,
      'juillet':7, 'juil':7,
      'aout':8,
      'septembre':9, 'sept':9, 'sep':9,
      'octobre':10, 'oct':10,
      'novembre':11, 'nov':11,
      'decembre':12, 'dec':12
    };
    // Capture groups : [1]=journ\u00e9e optionnelle, [2]=jour, [3]=mois,
    // [4]=ann\u00e9e optionnelle, [5]=heure, [6]=minutes
    let journeeFromDate = null;
    if (dateMatch) {
      if (dateMatch[1]) journeeFromDate = parseInt(dateMatch[1]);
      const day = parseInt(dateMatch[2]);
      const monthRaw = dateMatch[3].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\./g, '').trim();
      let month = MONTHS[monthRaw];
      if (!month) {
        // Fallback : essayer un pr\u00e9fixe (au cas o\u00f9 l'abr\u00e9viation est partielle)
        const key = Object.keys(MONTHS).find(k => monthRaw.startsWith(k) || k.startsWith(monthRaw));
        if (key) month = MONTHS[key];
      }
      let year = dateMatch[4] ? parseInt(dateMatch[4]) : null;
      const hour = parseInt(dateMatch[5]);
      const minutes = dateMatch[6] ? parseInt(dateMatch[6]) : 0;
      // Si pas d'année : deviner d'après la saison sportive en cours (sept-juin)
      if (!year) {
        const now = new Date();
        const currentMonth = now.getMonth() + 1;
        const currentYear = now.getFullYear();
        // Si on est en sept-dec → match peut être de cette année (sept-dec) ou suivante (jan-juin)
        if (currentMonth >= 9) {
          year = month >= 9 ? currentYear : currentYear + 1;
        } else {
          year = month >= 9 ? currentYear - 1 : currentYear;
        }
      }
      dateStr = year + '-' + String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0');
      timeStr = String(hour).padStart(2, '0') + ':' + String(minutes).padStart(2, '0');
    }

    // Chercher la compétition (h3, h4 ou texte avant le match)
    let competition = '';
    let cur = context;
    for (let i = 0; i < 8 && cur; i++) {
      const heading = cur.querySelector('h2, h3, h4');
      if (heading) {
        const t = (heading.textContent || '').trim();
        if (t && !competition) competition = t;
      }
      cur = cur.parentElement;
    }
    // Nettoyer : "U13M HON P2 | Journée 8" → on garde tout, "Inter-départementale masculine U13 - Division 2" si dispo
    competition = competition.replace(/\s*\|\s*Journée\s*\d+/i, '').trim();

    // Numéro de journée : priorité
    //   1. Mot complet "Journée X" (page club, sans ambiguïté)
    //   2. Capture du préfixe "J<journee>" dans le pattern de date
    //   3. Index séquentiel (page équipe, ordre d'affichage J1..JN)
    // Valeur > 30 considérée comme erreur de parsing → fallback.
    let journee = null;
    const jMatch = ctxText.match(/Journée\s*(\d+)/i);
    if (jMatch) journee = parseInt(jMatch[1]);
    if (!journee && journeeFromDate && journeeFromDate <= 30) journee = journeeFromDate;
    if (!journee && sequentialJourneeIdx > 0) journee = sequentialJourneeIdx;
    if (journee && journee > 99) journee = sequentialJourneeIdx || null;

    // Salle : souvent le dernier élément de texte non-link (genre "CENTRE ANDRE GIRARD")
    let venue = '';
    // On cherche un élément de texte court en majuscules après les liens (heuristique)
    const allText = ctxText;
    const lines = allText.split(/\n+/).map(s => s.trim()).filter(Boolean);
    for (const line of lines) {
      if (line.length > 4 && line.length < 80
          && line === line.toUpperCase()
          && !/^\d/.test(line)
          && !line.includes('JOURNÉE')
          && !line.includes('JOURNEE')
          && line !== homeTeam.toUpperCase()
          && line !== awayTeam.toUpperCase()) {
        venue = line;
        break;
      }
    }

    matches.push({
      id: matchId,
      date: dateStr,
      time: timeStr,
      home: homeTeam,
      away: awayTeam,
      scoreHome,
      scoreAway,
      played,
      competition,
      journee,
      venue,
      matchUrl: 'https://competitions.ffbb.com' + (href.startsWith('http') ? new URL(href).pathname : href),
    });
  });

  // Filtrer par hint d'équipe si fourni (ne garder que les matchs de cette équipe)
  if (clubTeamHint) {
    const hint = clubTeamHint.toLowerCase();
    return matches.filter(m =>
      (m.home || '').toLowerCase().includes(hint) ||
      (m.away || '').toLowerCase().includes(hint)
    );
  }

  return matches;
}

// La page CLUB FFBB n'affiche que ~1 match par équipe (résumé).
// Pour avoir le CALENDRIER COMPLET d'une équipe, il faut aller sur sa
// page dédiée. On cherche son URL dans le payload JSON Next.js imbriqué
// dans le HTML de la page club.
function extractTeamUrlFromClubHtml(html, teamName) {
  if (!html || !teamName) return null;
  // L'HTML escape les guillemets en \" dans le payload JSON.
  // On cherche : "name":"<teamName>" ... "url":{"url":"/ligues/.../equipes/<id>"
  // En passant par regex sur la forme escaped.
  const escName = teamName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(
    '\\\\?"name\\\\?":\\\\?"' + escName + '\\\\?"[\\s\\S]{0,800}?' +
    '\\\\?"url\\\\?":\\s*\\{\\\\?"url\\\\?":\\\\?"([^"\\\\]+/equipes/[^"\\\\]+)',
    'i'
  );
  const m = html.match(re);
  if (m && m[1]) return m[1];
  // Fallback : essayer sans tenir compte des guillemets échappés (cas non-escapé)
  const re2 = new RegExp('"name":"' + escName + '"[\\s\\S]{0,800}?"url":\\s*\\{"url":"([^"]+/equipes/[^"]+)', 'i');
  const m2 = html.match(re2);
  return m2 && m2[1] ? m2[1] : null;
}

async function syncFFBB() {
  const url = (state.ffbb.clubUrl || '').trim();
  if (!url) { alert('URL du club FFBB requise'); return; }
  state.ffbb.syncing = true;
  state.ffbb.syncError = null;
  render();

  try {
    const clubHtml = await fetchViaProxy(url);
    if (!clubHtml || clubHtml.length < 500) throw new Error('Page FFBB vide ou trop courte');

    // Stratégie : si on a un teamName, on essaie d'aller chercher la page
    // DÉDIÉE de l'équipe (= calendrier complet, ~20 matches au lieu de ~1
    // visible sur la page club résumé).
    const teamHint = (state.ffbb.teamName || '').trim();
    let matchesHtml = clubHtml;
    let teamPageUsed = false;
    if (teamHint) {
      const teamPath = extractTeamUrlFromClubHtml(clubHtml, teamHint);
      if (teamPath) {
        const teamUrl = teamPath.startsWith('http')
          ? teamPath
          : 'https://competitions.ffbb.com' + teamPath;
        try {
          const teamHtml = await fetchViaProxy(teamUrl);
          if (teamHtml && teamHtml.length >= 500) {
            matchesHtml = teamHtml;
            teamPageUsed = true;
          }
        } catch (e) {
          console.warn('[ffbb] team page fetch failed, fallback to club page', e.message);
        }
      }
    }

    // On passe TOUJOURS le hint au parser : il en a besoin pour nommer
    // correctement notre équipe dans les rows à 1 seul lien /equipes/
    // (page équipe FFBB). Le filtre final reste actif mais devient un
    // no-op puisque chaque match contient déjà le nom dans home OU away.
    const matches = parseClubMatchesFromHTML(matchesHtml, teamHint || null);
    const standings = parseStandingsFromHTML(matchesHtml);

    if (matches.length === 0) {
      const snippet = matchesHtml.replace(/\s+/g, ' ').slice(0, 300);
      throw new Error('Aucun match trouvé sur cette page. Vérifie l\'URL du club FFBB. Aperçu : ' + snippet);
    }

    state.ffbb.matches = matches;
    state.ffbb.standings = standings;
    state.ffbb.lastSync = new Date().toISOString();
    state.ffbb.syncing = false;
    persist();
    render();
  } catch (e) {
    state.ffbb.syncing = false;
    state.ffbb.syncError = e.message || String(e);
    render();
  }
}

function renderFFBB() {

            </div>
          </div>
          <button class="btn ${f.syncing?'btn-secondary':'btn-primary'} btn-block" onclick="syncFFBB()" ${f.syncing?'disabled':''}>
            ${f.syncing ? '⟳ Synchronisation...' : '⟳ Synchroniser maintenant'}
          </button>
          ${f.syncError ? `
            <div style="margin-top:10px;padding:10px;background:var(--red-soft);border:1px solid rgba(239,68,68,0.3);border-radius:8px;font-size:11px;color:var(--red);font-family:'JetBrains Mono';line-height:1.5">
              ⚠ ${esc(f.syncError)}<br>

      ${myMatches.length === 0 ? `

        ${recent.length > 0 ? `

            <div>

            </div>

          </div>

              <table class="stats-table">

                <tbody>
                  ${standings.map(s => {

function ffbbMatchRow(m, myTeamName) {
  const teamLower = (myTeamName || '').toLowerCase();
  const isHome = (m.home || '').toLowerCase().includes(teamLower);
  const myScore = isHome ? m.scoreHome : m.scoreAway;
  const oppScore = isHome ? m.scoreAway : m.scoreHome;
  const opp = isHome ? m.away : m.home;
  // Détermine résultat seulement si on a 2 scores valides
  const hasValidScores = m.played && myScore != null && oppScore != null && !isNaN(myScore) && !isNaN(oppScore);
  const win = hasValidScores && myScore > oppScore;
  const loss = hasValidScores && myScore < oppScore;
  const badge = hasValidScores
    ? (win ? '<div class="match-result-badge match-result-w">V</div>' : '<div class="match-result-badge match-result-l">D</div>')
    : '<div class="match-result-badge" style="background:var(--bg-3);color:var(--ink-3)">→</div>';

  // Date formatée
  let dateLabel = '';
  if (m.date && typeof m.date === 'string' && m.date.match(/^\d{4}-\d{2}-\d{2}$/)) {
    const d = new Date(m.date + 'T00:00:00');
    dateLabel = d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' });
  } else if (m.date) {
    dateLabel = String(m.date);
  } else {
    dateLabel = 'Date inconnue';
  }

  return `
    <div class="match-row" style="cursor:default">
      ${badge}
      <div style="flex:1;min-width:0">
        <div style="font-family:'Anton';font-size:14px;text-transform:uppercase;letter-spacing:0.02em">${isHome ? '' : '@ '}${esc(opp || 'Adversaire inconnu')}</div>
        <div style="font-size:11px;color:var(--ink-3);margin-top:2px;font-family:'JetBrains Mono';text-transform:uppercase">${dateLabel}${m.time ? ' · ' + m.time : ''}${isHome ? ' · DOM' : ' · EXT'}</div>
      </div>
      ${hasValidScores
        ? `<div class="match-score">${myScore}–${oppScore}</div>`
        : (m.time
          ? `<div style="font-family:'JetBrains Mono';font-size:11px;color:var(--orange);text-transform:uppercase">${esc(m.time)}</div>`
          : `<div style="font-family:'JetBrains Mono';font-size:10px;color:var(--ink-3);text-transform:uppercase">À venir</div>`
        )}
    </div>
  `;
}
