                <a href="${f.data}" target="_blank" rel="noopener" download="${esc(f.name)}" style="flex:1;display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit;min-width:0">

                    <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:2px">${(f.size/1024).toFixed(0)} Ko · ouvrir</div>

                <button class="btn btn-icon" onclick="removeExerciseFileInDetail(${idx})" style="color:var(--red);width:24px;height:24px">✕</button>

            `).join('')}

        <label class="btn btn-secondary btn-block" style="cursor:pointer;font-size:11px;margin-top:4px">
          + Ajouter un PDF
          <input type="file" accept="application/pdf,.pdf" multiple style="display:none" onchange="addExerciseFilesInDetail(event)">
        </label>
      </div>

      <!-- GROUPES -->
      <div style="padding-top:14px;border-top:1px solid var(--border-soft);margin-top:14px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:6px;flex-wrap:wrap">

          <div style="display:flex;gap:4px">
            ${(state.lineups && state.lineups.length > 0) ? `<button class="btn btn-secondary" onclick="openLineupImporter()" style="font-size:10px;padding:4px 10px">📋 Importer compo</button>` : ''}
            <button class="btn btn-secondary" onclick="addExerciseGroup()" style="font-size:10px;padding:4px 10px">+ Groupe</button>

        <div style="display:flex;flex-direction:column;gap:8px">
          ${groups.map((g, gIdx) => `
            <div class="group-card">
              <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
                <input value="${esc(g.name)}" onchange="updateGroupField(${gIdx},'name',this.value)" placeholder="Nom du groupe" style="flex:1;background:transparent;border:0;color:var(--ink);font-family:'Anton';font-size:13px;text-transform:uppercase;padding:2px 0;outline:none;border-bottom:1px solid var(--border-soft)">
                <span style="font-family:'JetBrains Mono';font-size:10px;color:var(--orange)">${(g.players || []).length}</span>
                ${groups.length > 1 ? `<button class="btn btn-icon" onclick="removeExerciseGroup(${gIdx})" style="color:var(--red);width:24px;height:24px">✕</button>` : ''}
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:4px;min-height:32px">
                ${(g.players || []).map(k => {
                  if (typeof k === 'string' && k.startsWith('guest:')) {
                    const gp = (state.guestPlayers || []).find(x => x.id === k.slice(6));

                    return `<button class="player-chip-assigned" onclick="removePlayerFromGroup(${gIdx},'${k}')" title="Invitée · ${esc(gp.name)}" style="border-style:dashed">👤 ${esc((gp.name || '').split(' ')[0] || gp.name)} ✕</button>`;
                  }
                  const pl = state.players.find(x => x.id === k);

                  return `<button class="player-chip-assigned" onclick="removePlayerFromGroup(${gIdx},'${k}')">#${pl.num} ${esc(pl.name.split(' ')[0])} ✕</button>`;

        ${unassigned.length > 0 ? `
          <div style="margin-top:12px;padding:10px 12px;background:var(--bg-2);border:1px dashed var(--border);border-radius:8px">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:6px;flex-wrap:wrap">

function updateExerciseField(field, value) {
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
  c.trainingPlan.exercises[state._editingExerciseIdx][field] = value;
  persist();
}

function addExerciseGroup() {
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
  const ex = c.trainingPlan.exercises[state._editingExerciseIdx];
  ex.groups = ex.groups || [];
  const next = ex.groups.length + 1;
  ex.groups.push({ name: 'Groupe ' + String.fromCharCode(64 + next), players: [] });
  persist();
  _flashSaved();
  renderExerciseDetail();
}

function removeExerciseGroup(gIdx) {
  // Suppression directe sans confirm() (bloqué en sandbox) — l'utilisateur peut recréer si erreur
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
  if (!c || !c.trainingPlan) return;
  const ex = c.trainingPlan.exercises[state._editingExerciseIdx];
  if (!ex || !ex.groups) return;
  ex.groups.splice(gIdx, 1);
  if (ex.groups.length === 0) ex.groups.push({ name: 'Toute l\'équipe', players: [] });
  persist();
  _flashSaved();
  renderExerciseDetail();
}

function updateGroupField(gIdx, field, value) {
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
  const ex = c.trainingPlan.exercises[state._editingExerciseIdx];
  ex.groups[gIdx][field] = value;
  persist();
  _flashSaved();
}

function removePlayerFromGroup(gIdx, pid) {
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
  const ex = c.trainingPlan.exercises[state._editingExerciseIdx];
  ex.groups[gIdx].players = (ex.groups[gIdx].players || []).filter(x => x !== pid);
  persist();
  _flashSaved();
  renderExerciseDetail();
}

function openAssignPlayerToGroup(pid) {
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
  const ex = c.trainingPlan.exercises[state._editingExerciseIdx];
  const groups = ex.groups || [];
  // pid peut être un uuid de joueuse régulière OU `guest:<id>` pour une invitée
  let displayLabel;
  if (typeof pid === 'string' && pid.startsWith('guest:')) {
    const gp = (state.guestPlayers || []).find(x => x.id === pid.slice(6));
    displayLabel = gp ? '👤 ' + gp.name : 'Invitée';
  } else {
    const p = state.players.find(x => x.id === pid);
    displayLabel = p ? p.name : 'Joueuse';
  }
  openModal(`

// Place toutes les joueuses présentes non assignées dans un nouveau groupe
function groupAllRemaining() {
  const { convocId, dateStr } = state._editingTraining;
  const c = state.convocations.find(x => x.id === convocId);
  const ex = c.trainingPlan.exercises[state._editingExerciseIdx];

  // Recalculer les non assignées (parmi présentes + invitées)
  // SAISON : effectif scopé à la saison de la convoc
  const _instDate = dateStr || c.date;
  const instance = makeConvocInstance(c, _instDate);
  const responses = instance.responses || {};
  const _seasonId = c.seasonId || state.currentSeasonId;
  const _seasonPool = _seasonsLoaded() && _seasonId
    ? getSeasonPlayers(_seasonId)
    : (state.players || []);
  const presentKeys = _seasonPool
    .filter(p => { const r = responses[p.id]; return !r || r.status !== 'absent'; })
    .map(p => p.id);
  const guestKeys = (c.type === 'training')
    ? getTrainingGuests(c.id, _instDate).map(g => 'guest:' + g.id)
    : [];
  const allKeys = [...presentKeys, ...guestKeys];
  const assignedIds = new Set();
  (ex.groups || []).forEach(g => (g.players || []).forEach(k => assignedIds.add(k)));
  const remainingIds = allKeys.filter(k => !assignedIds.has(k));

  if (remainingIds.length === 0) {
    alert('Toutes les présentes sont déjà placées.');
    return;
  }

  // Nom intelligent : si un groupe existe déjà, l'appeler "Groupe B" sinon "Toute l'équipe"
  const existingCount = (ex.groups || []).filter(g => (g.players || []).length > 0).length;
  let name;
  if (existingCount === 0) {
    name = "Toute l'équipe";
  } else if (existingCount === 1) {
    name = "Reste de l'effectif";
  } else {
    name = 'Groupe ' + String.fromCharCode(65 + existingCount); // A, B, C...
  }

  ex.groups = ex.groups || [];
  ex.groups.push({ name, players: remainingIds });
  persist();
  _flashSaved();
  renderExerciseDetail();
}

// === Édition images/PDF dans le détail exo (après création) ===
async function addExerciseImagesInDetail(event) {
  const files = Array.from(event.target.files || []);
  if (!files.length) return;
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
  const ex = c.trainingPlan.exercises[state._editingExerciseIdx];
  if (!ex) return;
  ex.images = ex.images || [];
  for (const file of files) {
    try {
      const compressed = await compressImage(file, 1000, 0.8);
      ex.images.push(compressed);
    } catch (e) { console.error(e); }
  }
  persist();
  renderExerciseDetail();
}

function removeExerciseImageInDetail(idx) {

async function addExerciseFilesInDetail(event) {
  const files = Array.from(event.target.files || []);
  if (!files.length) return;
  const c = state.convocations.find(x => x.id === state._editingTraining.convocId);
  const ex = c.trainingPlan.exercises[state._editingExerciseIdx];
  if (!ex) return;
  ex.attachments = ex.attachments || [];
  for (const file of files) {
    if (file.size > 5 * 1024 * 1024) {
      alert('Fichier trop volumineux : ' + file.name + ' (max 5 Mo)');
      continue;
    }
    try {
      const dataUrl = await new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = reject;
        r.readAsDataURL(file);
      });
      ex.attachments.push({
        name: file.name,
        type: file.type || 'application/pdf',
        size: file.size,
        data: dataUrl
      });
    } catch (e) { console.error(e); }
  }
  persist();
  renderExerciseDetail();
}

function applyLineupToGroups(lineupId) {
  const l = state.lineups.find(x => x.id === lineupId);
  if (!l) return;
  const { convocId, dateStr } = state._editingTraining;
  const c = state.convocations.find(x => x.id === convocId);
  const ex = c.trainingPlan.exercises[state._editingExerciseIdx];

  // Récupérer toutes les joueuses de la compo (titulaires + banc)
  const rawLineupIds = [
    ...Object.entries(l.starters || {}).filter(([_, pos]) => pos).map(([pid]) => pid),
    ...Object.entries(l.bench || {}).filter(([_, pos]) => pos).map(([pid]) => pid),
  ];

  // CRITIQUE : ne garder QUE les IDs qui existent réellement dans l'effectif actuel
  // (évite les IDs orphelins si la compo a été créée avec d'anciens joueurs)
  // SAISON : on filtre sur l'effectif de la saison courante (une joueuse
  // partie ne doit pas être ré-importée dans un exercice en cours).
  const _seasonPool = currentSeasonPlayers();
  const validPlayerIds = new Set(_seasonPool.map(p => p.id));
  const lineupPlayerIds = rawLineupIds.filter(pid => validPlayerIds.has(pid));

  if (rawLineupIds.length > lineupPlayerIds.length) {
    console.log('[importCompo] IDs orphelins filtrés:', rawLineupIds.length - lineupPlayerIds.length);
  }

  if (lineupPlayerIds.length === 0) {
    alert('Cette compo ne contient aucune joueuse de l\'effectif actuel.\n\nLes IDs des joueuses ne correspondent pas. Tu peux recréer la compo depuis l\'onglet Équipe → Compos.');
    return;
  }

  // Filtrer celles qui sont PRÉSENTES à l'événement (pas absentes)
  const instance = makeConvocInstance(c, dateStr || c.date);
  const responses = instance.responses || {};
  const presentLineupIds = lineupPlayerIds.filter(pid => {
    const r = responses[pid];
    return !r || r.status !== 'absent';
  });

  if (presentLineupIds.length === 0) {
    alert('Aucune joueuse de cette compo n\'est présente aujourd\'hui.');
    return;
  }

  // Demander confirmation si groupes déjà remplis
  const totalCurrent = (ex.groups || []).reduce((acc, g) => acc + (g.players || []).length, 0);
  if (totalCurrent > 0) {
    if (!confirm('Remplacer les groupes actuels par les ' + presentLineupIds.length + ' joueuses présentes de la compo "' + l.name + '" ?')) return;
  }

  // Tout dans un seul groupe nommé d'après la compo (sans doublons par sécurité)
  ex.groups = [{ name: l.name, players: [...new Set(presentLineupIds)] }];

  persist();
  closeModal();
  setTimeout(() => renderExerciseDetail(), 50);
}

function navPExoImg(convocId, exId, delta) {
  const images = getCombinedExerciseImages(convocId, exId);

  window._pExoIdx = ((window._pExoIdx || 0) + delta + images.length) % images.length;

function togglePlayerExerciseDone(convocId, exerciseId, dateStr) {
  const c = state.convocations.find(x => x.id === convocId);

  const _idate = dateStr || c.date;

  plan.completedExercises = plan.completedExercises || {};

  openMyTrainingPlan(convocId, _idate);

// APPEL EN TEMPS RÉEL (avec calcul de retard en minutes)

// Récupère la "feuille d'appel" stockée dans l'instance/convoc
// Format : { arrivals: { pid: { at: timestamp, lateMin: number } } }
function getCallSheet(c, dateStr) {
  if (c.recurrence && dateStr) {
    c.instanceOverrides = c.instanceOverrides || {};
    c.instanceOverrides[dateStr] = c.instanceOverrides[dateStr] || {};
    c.instanceOverrides[dateStr].callSheet = c.instanceOverrides[dateStr].callSheet || { arrivals: {} };
    return c.instanceOverrides[dateStr].callSheet;
  }
  c.callSheet = c.callSheet || { arrivals: {} };
  return c.callSheet;
}

// Calcule le retard en minutes par rapport à l'heure prévue
function computeLateMinutes(scheduledTime, dateStr, validatedAt) {
  if (!scheduledTime || !dateStr) return 0;
  const [hh, mm] = scheduledTime.split(':').map(n => parseInt(n));
  if (isNaN(hh) || isNaN(mm)) return 0;
  const scheduled = new Date(dateStr + 'T' + scheduledTime.padStart(5, '0') + ':00');
  const validated = new Date(validatedAt);
  const diffMs = validated - scheduled;
  return Math.max(0, Math.round(diffMs / 60000));
}

function openCallSheet(parentId, dateStr) {
  const c = state.convocations.find(x => x.id === parentId);
  if (!c) return;
  const instance = makeConvocInstance(c, dateStr);
  const responses = instance.responses || {};
  // SAISON : effectif scopé à la saison de la convoc
  const _seasonId = c.seasonId || state.currentSeasonId;
  const _seasonPool = _seasonsLoaded() && _seasonId
    ? getSeasonPlayers(_seasonId)
    : (state.players || []);
  const present = _seasonPool.filter(p => !responses[p.id] || responses[p.id].status === 'present');
  const absent = _seasonPool.filter(p => responses[p.id] && responses[p.id].status === 'absent');
  const sheet = getCallSheet(c, c.recurrence ? dateStr : null);
  const arrivals = sheet.arrivals || {};

  // Trier : pas encore validée en premier, puis validées à l'heure, puis en retard
  const sorted = [...present].sort((a, b) => {
    const ra = arrivals[a.id];
    const rb = arrivals[b.id];
    if (!ra && !rb) return 0;
    if (!ra) return -1;
    if (!rb) return 1;
    return ra.at - rb.at;
  });

  const pendingCount = present.filter(p => !arrivals[p.id]).length;
  const onTimeCount = present.filter(p => arrivals[p.id] && arrivals[p.id].lateMin === 0).length;
  const lateCount = present.filter(p => arrivals[p.id] && arrivals[p.id].lateMin > 0).length;
  const totalLateMin = present.reduce((acc, p) => acc + (arrivals[p.id] ? arrivals[p.id].lateMin : 0), 0);

  openModal(`
    <div class="modal-header">
      <div>
        <div class="eyebrow">${formatDate(dateStr)} · ${esc(instance.time || '?')}</div>
        <div class="modal-title">📋 Appel · ${esc(instance.title)}</div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div style="padding:10px 12px;background:var(--bg-3);border-left:3px solid var(--orange);border-radius:6px;margin-bottom:14px;font-size:11px;color:var(--ink-2);line-height:1.5">
        Tap <strong>✓ Présente</strong> quand chaque joueuse est <strong>prête</strong> (équipée, sur le terrain). Le retard est calculé automatiquement par rapport à l'heure prévue (${esc(instance.time || '?')}).
      </div>

      <!-- Compteurs -->
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px">
        <div class="stat-tile" style="padding:8px;text-align:center">
          <div style="font-family:'Anton';font-size:22px;color:var(--ink-3)">${pendingCount}</div>
          <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase">Attente</div>
        </div>
        <div class="stat-tile" style="padding:8px;text-align:center">
          <div style="font-family:'Anton';font-size:22px;color:var(--green)">${onTimeCount}</div>
          <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase">À l'heure</div>
        </div>
        <div class="stat-tile" style="padding:8px;text-align:center">
          <div style="font-family:'Anton';font-size:22px;color:var(--red)">${lateCount}</div>
          <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase">En retard</div>
        </div>
        <div class="stat-tile" style="padding:8px;text-align:center">
          <div style="font-family:'Anton';font-size:22px;color:${totalLateMin>0?'var(--orange)':'var(--ink-3)'}">${totalLateMin}</div>
          <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase">Min total</div>
        </div>
      </div>

      <!-- Liste joueuses présentes -->
      <div class="eyebrow-muted mb-2">Joueuses convoquées (${present.length})</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${sorted.map(p => {
          const r = arrivals[p.id];
          const validated = !!r;
          const onTime = validated && r.lateMin === 0;
          const lateMin = validated ? r.lateMin : 0;
          const arrivalTime = validated ? new Date(r.at).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}) : '';
          return `
            <div class="call-row ${validated ? (onTime ? 'on-time' : 'late') : 'pending'}">
              <div style="flex-shrink:0">
                ${p.photo ? `<img src="${p.photo}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid ${validated ? (onTime ? 'var(--green)' : 'var(--red)') : 'var(--border)'}">` : `<div style="width:36px;height:36px;border-radius:50%;background:var(--bg-3);display:flex;align-items:center;justify-content:center;font-family:'Anton';font-size:14px;color:var(--orange);border:2px solid ${validated ? (onTime ? 'var(--green)' : 'var(--red)') : 'var(--border)'}">${esc(p.name.charAt(0).toUpperCase())}</div>`}
              </div>
              <div style="flex:1;min-width:0">
                <div style="font-family:'Anton';font-size:14px;text-transform:uppercase">#${p.num} ${esc(p.name)}</div>
                ${validated ? `
                  <div style="font-size:10px;font-family:'JetBrains Mono';margin-top:2px;text-transform:uppercase;letter-spacing:0.04em">
                    ${onTime ? `<span style="color:var(--green)">✓ Arrivée ${arrivalTime} · À l'heure</span>` : `<span style="color:var(--red)">⚠ Arrivée ${arrivalTime} · +${lateMin} min retard</span>`}
                  </div>
                ` : `<div style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:2px;text-transform:uppercase">En attente...</div>`}
              </div>
              ${validated ? `
                <button class="btn btn-icon" onclick="undoArrival('${parentId}','${dateStr}','${p.id}')" title="Annuler validation">↺</button>
              ` : `

// Valider l'arrivée d'une joueuse (le coach tap quand elle est prête)
function validateArrival(parentId, dateStr, pid) {
  const c = state.convocations.find(x => x.id === parentId);
  if (!c) return;
  const instance = makeConvocInstance(c, dateStr);
  const sheet = getCallSheet(c, c.recurrence ? dateStr : null);
  sheet.arrivals = sheet.arrivals || {};

  const now = Date.now();
  const lateMin = computeLateMinutes(instance.time, dateStr, now);

  // Récupérer le retard précédent s'il existe (cas de re-validation)
  const oldEntry = sheet.arrivals[pid];
  const oldLate = oldEntry ? oldEntry.lateMin : 0;

  sheet.arrivals[pid] = { at: now, lateMin };

  // Mettre à jour le challenge ponctualité (delta)
  const ch = state.challenges.find(x => x.type === 'punctuality' && x.autoCount);
  if (ch) {
    ch.scores = ch.scores || {};
    ch.scores[pid] = Math.max(0, (ch.scores[pid] || 0) - oldLate + lateMin);
  }

  persist();
  closeModal();
  setTimeout(() => openCallSheet(parentId, dateStr), 50);
}

// Annuler une validation (cas d'erreur)
function undoArrival(parentId, dateStr, pid) {
  const c = state.convocations.find(x => x.id === parentId);
  if (!c) return;
  const sheet = getCallSheet(c, c.recurrence ? dateStr : null);
  const entry = sheet.arrivals && sheet.arrivals[pid];
  if (!entry) return;

  // Retirer du challenge
  const ch = state.challenges.find(x => x.type === 'punctuality' && x.autoCount);
  if (ch && ch.scores) {
    ch.scores[pid] = Math.max(0, (ch.scores[pid] || 0) - entry.lateMin);
  }

  delete sheet.arrivals[pid];
  persist();
  closeModal();
  setTimeout(() => openCallSheet(parentId, dateStr), 50);
}

async function addTempInstanceAttachments(e) {
  const files = Array.from(e.target.files);
  for (const file of files) {
    try {
      const a = await makeAttachment(file);
      state._tempInstanceAttachments.push(a);
    } catch(err) { console.error(err); }
  }
  // Refresh
  const modal = document.querySelector('.modal-body');
  if (modal) {
    const grids = modal.querySelectorAll('.attachments-grid');
    const lastGrid = grids[grids.length - 1];
    const html = renderAttachments(state._tempInstanceAttachments, true, 'removeTempInstanceAttachment');
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    if (lastGrid && tmp.firstElementChild) lastGrid.replaceWith(tmp.firstElementChild);
    else if (tmp.firstElementChild) {
      const uploader = modal.querySelector('label[for="iov-files"]');
      if (uploader) uploader.parentNode.insertBefore(tmp.firstElementChild, uploader);
    }
  }
}
function removeTempInstanceAttachment(idx) {
  state._tempInstanceAttachments.splice(idx, 1);
  // Refresh
  const modal = document.querySelector('.modal-body');
  if (modal) {
    const grids = modal.querySelectorAll('.attachments-grid');
    const lastGrid = grids[grids.length - 1];
    const html = renderAttachments(state._tempInstanceAttachments, true, 'removeTempInstanceAttachment');
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    if (lastGrid && tmp.firstElementChild) lastGrid.replaceWith(tmp.firstElementChild);
  }
}

function saveInstanceOverride(parentId, dateStr) {
  const c = state.convocations.find(x => x.id === parentId);
  if (!c) return;
  c.instanceOverrides = c.instanceOverrides || {};
  const existing = c.instanceOverrides[dateStr] || {};
  const ov = { ...existing };
  const title = document.getElementById('iov-title').value.trim();
  const time = document.getElementById('iov-time').value;
  const loc = document.getElementById('iov-loc').value.trim();
  const note = document.getElementById('iov-note').value.trim();

  // Stocker seulement les diffs
  if (title) ov.title = title; else delete ov.title;
  if (time && time !== c.time) ov.time = time; else delete ov.time;
  if (loc && loc !== (c.location || '')) ov.location = loc; else delete ov.location;
  if (note !== (c.note || '')) ov.note = note; else delete ov.note;
  if (state._tempInstanceAttachments && state._tempInstanceAttachments.length > 0) {
    ov.attachments = state._tempInstanceAttachments;
  } else {
    delete ov.attachments;
  }

  if (Object.keys(ov).length === 0) {
    delete c.instanceOverrides[dateStr];
  } else {
    c.instanceOverrides[dateStr] = ov;
  }
  state._tempInstanceAttachments = null;
  persist();
  closeModal();
  openEventInstance(parentId, dateStr);
}

function resetInstanceOverride(parentId, dateStr) {
  if (!confirm("Retirer toutes les modifs de ce jour et revenir aux paramètres de la série ?")) return;

}

// Challenges
function renderChallenges() {
  const isCoach = state.auth.role === 'coach';
  const todayStr = new Date().toISOString().slice(0,10);
  // SAISON : filtre les challenges par state.currentSeasonId. Les challenges
  // legacy sans seasonId sont rattachés à la saison `active`.
  const seasonChallenges = currentSeasonChallenges();
  // Tri : Collectif + Individuel manuel en haut, Auto (compteurs auto) en bas.
  // - "Auto" = c.autoCount === true (peu importe le scope) OU scope === 'season'
  //   qui historiquement = compteurs auto sur stats live.
  // - Dans chaque groupe : non-archivés d'abord, triés par endDate desc (plus
  //   urgent en haut), puis par updatedAt desc en fallback.
  const isAuto = c => !!c.autoCount || c.scope === 'season';
  const isArchived = c => c.scope !== 'season' && c.endDate && c.endDate < todayStr;
  const sortRecent = (a, b) => {
    if (a.endDate && b.endDate) return b.endDate.localeCompare(a.endDate);
    if (a.endDate) return -1;
    if (b.endDate) return 1;
    return (b.updatedAt || 0) - (a.updatedAt || 0);
  };
  // Manuels (non-auto) actifs : collectif d'abord, individuel ensuite — cohérent
  // avec la priorité produit (engagement collectif > perso > compteurs auto).
  const collective = seasonChallenges
    .filter(c => c.scope === 'collective' && !isArchived(c) && !isAuto(c))
    .sort(sortRecent);
  const individual = seasonChallenges
    .filter(c => c.scope === 'individual' && !isArchived(c) && !isAuto(c))
    .sort(sortRecent);
  // Auto (= season ou autoCount), en bas
  const autoChallenges = seasonChallenges
    .filter(c => isAuto(c) && !isArchived(c))
    .sort(sortRecent);
  const archived = seasonChallenges.filter(isArchived);

  // Incitation : si coach et aucun challenge actif (individuel/collectif), on suggère
  const hasActive = individual.length > 0 || collective.length > 0;
  const ideas = [
    { scope: 'collective', icon: '🤝', title: '100 paniers à 3pts', desc: 'Équipe entière jusqu\'à atteindre 100 tirs réussis', metric: 'paniers', target: 100 },
    { scope: 'collective', icon: '💪', title: '500 pompes en équipe', desc: 'Total cumulé sur la semaine', metric: 'pompes', target: 500 },
    { scope: 'collective', icon: '🏃', title: '50 km collectifs', desc: 'Footings cumulés à reporter', metric: 'km', target: 50 },
    { scope: 'individual', icon: '🎯', title: 'Free Throw Streak', desc: 'Plus longue série de LF consécutifs', metric: 'LF' },
    { scope: 'individual', icon: '🏀', title: 'Tirs à 3pts du mois', desc: 'Nombre de 3pts marqués', metric: '3pts' },
  ];

  return `
    <div style="padding:0 18px 12px;display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:12px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.05em">${seasonChallenges.length} défi${seasonChallenges.length>1?'s':''}</div>
      ${isCoach ? `<button class="btn btn-primary" onclick="editChallenge()">+ Challenge</button>` : ''}
    </div>

    ${isCoach && !hasActive ? `
      <div style="margin:0 18px 18px;padding:14px;background:linear-gradient(135deg,rgba(255,107,0,0.10),var(--surface));border:1.5px dashed var(--orange);border-radius:var(--radius)">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
          <span style="font-size:24px">💡</span>
          <div style="flex:1">
            <div style="font-family:'Anton';font-size:14px;text-transform:uppercase">Aucun challenge actif</div>
            <div style="font-size:11px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:2px">Lance-en un pour motiver le groupe !</div>
          </div>
        </div>
        <div style="font-size:11px;color:var(--ink-2);line-height:1.5;margin-bottom:10px">
          Idées rapides à lancer en 1 tap :
        </div>
        <div style="display:flex;flex-direction:column;gap:6px">
          ${ideas.map(idea => `
            <button class="btn btn-secondary" style="text-align:left;padding:10px 12px;display:flex;align-items:center;gap:10px;width:100%" onclick='createChallengeFromIdea(${JSON.stringify(idea).replace(/"/g, "&quot;")})'>
              <span style="font-size:22px">${idea.icon}</span>
              <div style="flex:1;min-width:0">
                <div style="font-family:'Anton';font-size:12px;text-transform:uppercase">${esc(idea.title)}</div>
                <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:2px;text-transform:uppercase">${idea.scope === 'collective' ? '🤝 Collectif · cible ' + idea.target : '🎯 Individuel'}</div>
              </div>
              <span style="color:var(--orange);font-size:18px;font-family:'Anton'">+</span>
            </button>
          `).join('')}
        </div>
        <button class="btn btn-ghost btn-block" onclick="editChallenge()" style="margin-top:8px;font-size:11px">… ou créer un challenge personnalisé →</button>
      </div>
    ` : ''}

    ${collective.length > 0 ? `

      </div>

      <div class="section-header" style="margin-top:8px">
        <div><div class="eyebrow" style="color:var(--ink-3)">Terminés</div><h2 class="display-md mt-2" style="color:var(--ink-3)">Archives (${archived.length})</h2></div>

// Création rapide depuis une idée pré-remplie
function createChallengeFromIdea(idea) {
  const challenge = {
    id: uid(),
    title: idea.title,
    desc: idea.desc,
    scope: idea.scope,
    type: idea.scope === 'collective' ? 'collective' : 'skill',
    metric: idea.metric,
    endDate: '',
    scores: {},
    seasonId: state.currentSeasonId || null,
  };
  if (idea.scope === 'collective') {
    challenge.target = idea.target;
    challenge.teamScore = 0;
  }
  state.challenges.unshift(challenge);
  persist();
  render();
}

function challengeCard(c, isCoach) {
  const scores = c.scores || {};
  const isCollective = c.scope === 'collective';
  const isAuto = c.autoCount;
  const scopeBadge = isCollective ? '🤝 Collectif' : (c.scope === 'season' ? '📅 Saison' : '🎯 Individuel');
  const scopeColor = isCollective ? 'chip-purple' : (c.scope === 'season' ? 'chip-blue' : 'chip-orange');

  // === MODE COLLECTIF : compteur somme des contributions individuelles ===
  if (isCollective) {
    // Total = somme des contributions de chaque joueuse
    // SAISON : on liste uniquement les joueuses de la saison du challenge
    const _seasonId = c.seasonId || state.currentSeasonId;
    const _seasonPool = _seasonsLoaded() && _seasonId
      ? getSeasonPlayers(_seasonId)
      : (state.players || []);
    const contributors = _seasonPool.map(pl => ({ player: pl, score: (c.scores || {})[pl.id] || 0 }));
    const teamScore = contributors.reduce((acc, x) => acc + x.score, 0);
    const target = c.target || 1;
    const pct = Math.min(100, Math.round((teamScore / target) * 100));
    const done = teamScore >= target;
    // Top contributrices (>0, triées)
    const topContributors = contributors.filter(x => x.score > 0).sort((a, b) => b.score - a.score);
    const isPlayer = state.auth.role === 'player';
    const myPid = isPlayer ? state.auth.playerId : null;
    const myContrib = myPid ? ((c.scores || {})[myPid] || 0) : 0;

    return `
      <div class="list-section">
        <div style="padding:14px 16px;border-bottom:1px solid var(--border-soft)">
          <div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap">
            <span class="chip ${scopeColor}">${scopeBadge}</span>
            ${c.endDate ? `<span class="chip">Fin ${formatDate(c.endDate)}</span>` : ''}
            ${done ? `<span class="chip chip-green">✓ Objectif atteint</span>` : ''}
          </div>
          <div style="font-family:'Anton';font-size:18px;text-transform:uppercase;letter-spacing:0.02em;margin-bottom:4px">${esc(c.title)}</div>
          <div style="font-size:12px;color:var(--ink-3);line-height:1.5;margin-bottom:14px">${esc(c.desc)}</div>

          <!-- Compteur collectif géant -->
          <div style="text-align:center;padding:18px;background:var(--bg-2);border-radius:12px;border:1px solid ${done?'var(--green)':'var(--orange)'};margin-bottom:12px">
            <div style="display:flex;align-items:baseline;justify-content:center;gap:8px;margin-bottom:6px">
              <div style="font-family:'Anton';font-size:48px;color:${done?'var(--green)':'var(--orange)'};line-height:1">${teamScore}</div>
              <div style="font-family:'Anton';font-size:24px;color:var(--ink-4);line-height:1">/ ${target}</div>
            </div>
            <div style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px">${esc(c.metric)} · ${pct}%</div>
            <div style="height:8px;background:var(--bg-1);border-radius:4px;overflow:hidden;position:relative">
              <div style="position:absolute;top:0;left:0;height:100%;width:${pct}%;background:linear-gradient(90deg,var(--orange),${done?'var(--green)':'#cc5400'});transition:width 0.3s"></div>
            </div>
          </div>

          ${isPlayer && myPid ? `
            <div style="text-align:center;margin-bottom:10px;padding:10px;background:rgba(255,107,0,0.06);border-radius:8px">
              <div style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.06em">Ma contribution</div>
              <div style="font-family:'Anton';font-size:24px;color:var(--orange);margin-top:2px">${myContrib} <span style="font-size:14px;color:var(--ink-3)">${esc(c.metric)}</span></div>
            </div>
          ` : ''}

          ${!done ? `
            <!-- Boutons d'ajout : pour la joueuse, contribution perso. Pour le coach, choisir qui contribue -->
            ${isPlayer ? `
              <div style="display:flex;gap:4px;justify-content:center;flex-wrap:wrap">
                <button class="btn btn-secondary" onclick="contributeToCollective('${c.id}','${myPid}', 1)" style="min-width:56px;font-family:'Anton';font-size:14px">+1</button>
                <button class="btn btn-secondary" onclick="contributeToCollective('${c.id}','${myPid}', 5)" style="min-width:56px;font-family:'Anton';font-size:14px">+5</button>
                <button class="btn btn-secondary" onclick="contributeToCollective('${c.id}','${myPid}', 10)" style="min-width:56px;font-family:'Anton';font-size:14px">+10</button>
                <button class="btn btn-primary" onclick="contributeToCollectiveCustom('${c.id}','${myPid}')" style="min-width:64px;font-family:'Anton';font-size:14px">+ Custom</button>
              </div>
              <div style="text-align:center;margin-top:8px;font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase">Tape pour ajouter à TA contribution</div>
            ` : `
              <button class="btn btn-primary btn-block" onclick="openCollectiveContributor('${c.id}')">+ Ajouter une contribution</button>
              <div style="text-align:center;margin-top:8px;font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase">Choisis la joueuse qui contribue</div>
            `}
          ` : `
            <div style="text-align:center;padding:10px;font-family:'Anton';color:var(--green);font-size:16px;text-transform:uppercase;letter-spacing:0.04em">🎉 Objectif atteint !</div>
          `}

          ${isCoach ? `
            <div style="display:flex;gap:4px;margin-top:12px;justify-content:flex-end;flex-wrap:wrap">
              ${topContributors.length > 0 ? `<button class="btn btn-secondary" onclick="openChallengeStoryModal('${c.id}')" style="font-size:10px;padding:6px 10px">📸 Exporter victoire</button>` : ''}
              ${!c.badgesAwarded ? `<button class="btn btn-secondary" onclick="closeChallengeNow('${c.id}')" style="font-size:10px;padding:6px 10px">🏁 Clôturer & attribuer trophées</button>` : '<span class="chip chip-green">🏆 Trophées attribués</span>'}

              <button class="btn btn-icon" onclick="resetCollective('${c.id}')" title="Réinitialiser le compteur">↺</button>
              <button class="btn btn-icon" onclick="deleteChallenge('${c.id}')" style="color:var(--red)">🗑</button>
            </div>
          ` : ''}
        </div>

        ${topContributors.length > 0 ? `
          <div style="padding:10px 16px 4px;font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.06em">Top contributrices · ${topContributors.length} joueuses</div>
          ${topContributors.map((x, i) => {
            const medal = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
            const isMine = myPid && x.player.id === myPid;
            const contribPct = teamScore > 0 ? Math.round((x.score / teamScore) * 100) : 0;
            return `
              <div class="lb-row${isMine?' lb-row-me':''}">
                <div class="lb-medal ${medal}">${medal ? (i===0?'🥇':i===1?'🥈':'🥉') : (i+1)}</div>
                <div>
                  <div style="font-family:'Anton';font-size:13px;text-transform:uppercase">${isMine ? '⭐ ' : ''}#${x.player.num} ${esc(x.player.name)}${isMine ? ' · TOI' : ''}</div>
                  <div class="lb-progress"><div class="lb-progress-fill" style="width:${contribPct}%"></div></div>
                </div>
                <div style="text-align:right">
                  <div style="font-family:'Anton';font-size:18px;color:${isMine?'var(--orange)':'var(--ink)'}">${x.score}</div>
                  <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase">${contribPct}%</div>
                </div>
              </div>
            `;
          }).join('')}
        ` : '<div style="padding:14px;text-align:center;color:var(--ink-3);font-size:11px;font-style:italic;font-family:\'JetBrains Mono\'">Aucune contribution pour le moment</div>'}
      </div>
    `;
  }

  // === MODE INDIVIDUEL / SAISON : classement entre joueuses ===
  // SAISON : leaderboard restreint à l'effectif de la saison du challenge
  const _seasonId2 = c.seasonId || state.currentSeasonId;
  const _seasonPool2 = _seasonsLoaded() && _seasonId2
    ? getSeasonPlayers(_seasonId2)
    : (state.players || []);
  const entries = _seasonPool2.map(p => ({ id: p.id, name: p.name, num: p.num, score: scores[p.id] || 0 }));
  if (c.lowerIsBetter) {
    entries.sort((a,b) => a.score - b.score);
  } else {
    entries.sort((a,b) => b.score - a.score);
  }
  const max = Math.max(...entries.map(e => e.score), 1);

  return `
    <div class="list-section">
      <div style="padding:14px 16px;border-bottom:1px solid var(--border-soft)">
        <div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap">
          <span class="chip ${scopeColor}">${scopeBadge}</span>
          ${isAuto ? `<span class="chip chip-purple">AUTO</span>` : ''}
          ${c.endDate ? `<span class="chip">Fin ${formatDate(c.endDate)}</span>` : ''}
        </div>
        <div style="font-family:'Anton';font-size:18px;text-transform:uppercase;letter-spacing:0.02em;margin-bottom:4px">${esc(c.title)}</div>
        <div style="font-size:12px;color:var(--ink-3);line-height:1.5">${esc(c.desc)}</div>
        ${isAuto ? `<div style="margin-top:8px;font-size:11px;color:var(--orange);font-family:'JetBrains Mono'">⚙ Compte automatiquement</div>` : ''}
        ${isCoach ? `
          <div style="display:flex;gap:4px;margin-top:10px;justify-content:flex-end;flex-wrap:wrap">
            ${entries.some(e => e.score > 0) ? `<button class="btn btn-secondary" onclick="openChallengeStoryModal('${c.id}')" style="font-size:10px;padding:6px 10px">📸 Exporter victoire</button>` : ''}
            ${(c.scope === 'individual' && !c.badgesAwarded) ? `<button class="btn btn-secondary" onclick="closeChallengeNow('${c.id}')" style="font-size:10px;padding:6px 10px">🏁 Clôturer & attribuer trophées</button>` : (c.scope === 'individual' && c.badgesAwarded ? '<span class="chip chip-green">🏆 Trophées attribués</span>' : '')}
            <button class="btn btn-icon" onclick="editChallenge('${c.id}')">✎</button>
            <button class="btn btn-icon" onclick="deleteChallenge('${c.id}')" style="color:var(--red)">🗑</button>
          </div>
        ` : ''}
      </div>
      ${entries.map((e, i) => {
        const medal = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
        const myPid = state.auth && state.auth.role === 'player' ? state.auth.playerId : null;
        const isMine = myPid && myPid === e.id;
        const canEdit = !isAuto && (isCoach || isMine);
        const clickAttr = canEdit ? `onclick="updateChallengeScore('${c.id}','${e.id}')"` : '';
        return `
          <div class="lb-row${isMine ? ' lb-row-me' : ''}" ${clickAttr} style="${canEdit ? '' : 'cursor:default'}">
            <div class="lb-medal ${medal}">${i + 1}</div>
            <div>
              <div style="font-family:'Anton';font-size:14px;text-transform:uppercase">${isMine ? '⭐ ' : ''}#${e.num} ${esc(e.name)}${isMine ? ' · TOI' : ''}</div>
              <div class="lb-progress"><div class="lb-progress-fill" style="width:${(e.score/max)*100}%"></div></div>
            </div>
            <div style="display:flex;align-items:center;gap:6px">
              ${isMine && !isAuto ? `<button class="lb-quick-btn" onclick="event.stopPropagation();quickIncrementChallenge('${c.id}','${e.id}',1)" title="+1">+1</button>` : ''}
              <div style="text-align:right">
                <div style="font-family:'Anton';font-size:20px;color:${isMine?'var(--orange)':'var(--ink)'}">${e.score}</div>
                <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase">${esc(c.metric)}</div>
              </div>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

// Ajouter une contribution d'une joueuse à un challenge collectif
function contributeToCollective(cid, pid, delta) {
  const c = state.challenges.find(x => x.id === cid);
  if (!c || c.scope !== 'collective') return;
  if (!pid) { alert('Aucune joueuse sélectionnée'); return; }
  c.scores = c.scores || {};
  const before = Object.values(c.scores).reduce((a,b) => a+b, 0);
  c.scores[pid] = Math.max(0, (c.scores[pid] || 0) + delta);
  const after = Object.values(c.scores).reduce((a,b) => a+b, 0);
  persist();
  render();
  // Confirmation visuelle si on vient d'atteindre l'objectif
  if (after >= (c.target || 0) && before < (c.target || 0)) {
    setTimeout(() => alert('🎉 Objectif équipe atteint !\n\n' + c.title + '\n' + after + ' / ' + c.target + ' ' + c.metric), 100);
  }
}

function contributeToCollectiveCustom(cid, pid) {
  const c = state.challenges.find(x => x.id === cid);
  if (!c) return;
  const val = prompt('Combien ajouter à TA contribution sur "' + c.title + '" ?', '1');
  if (val === null) return;
  const n = parseInt(val);
  if (isNaN(n) || n === 0) return;
  contributeToCollective(cid, pid, n);
}

// Clôturer un défi manuellement : attribuer les badges immédiatement
const BADGE_MEDALS = ['🥇', '🥈', '🥉'];

function renderBadge(b) {
  const medal = BADGE_MEDALS[(b.rank || 1) - 1] || '🏆';
  const rankLabel = b.rank === 1 ? '1ère' : b.rank === 2 ? '2ème' : b.rank === 3 ? '3ème' : '';
  const dateLabel = b.date ? formatDate(b.date, 'short') : '';
  return `
    <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)">
      <div style="font-size:26px;line-height:1">${medal}</div>
      <div style="flex:1;min-width:0">
        <div style="font-family:'Anton';font-size:14px;text-transform:uppercase;letter-spacing:0.02em;line-height:1.2">${esc(b.challengeTitle || 'Trophée')}</div>
        <div style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.04em;margin-top:3px">${rankLabel}${rankLabel ? ' · ' : ''}${b.score || 0} ${esc(b.metric || '')}${dateLabel ? ' · ' + dateLabel : ''}</div>
      </div>
    </div>
  `;
}

function closeChallengeNow(cid) {
  const c = state.challenges.find(x => x.id === cid);
  if (!c) return;
  // Calculer le podium actuel
  // SAISON : podium parmi l'effectif de la saison du challenge
  const scores = c.scores || {};
  const _seasonId = c.seasonId || state.currentSeasonId;
  const _seasonPool = _seasonsLoaded() && _seasonId
    ? getSeasonPlayers(_seasonId)
    : (state.players || []);
  const entries = _seasonPool.map(p => ({ pid: p.id, name: p.name, score: scores[p.id] || 0 }));
  if (c.lowerIsBetter) entries.sort((a,b) => a.score - b.score);
  else entries.sort((a,b) => b.score - a.score);
  const podium = entries.filter(e => e.score > 0).slice(0, 3);

  if (podium.length === 0) {
    alert('Aucune contribution pour le moment · personne ne peut recevoir de trophée');
    return;
  }

  const msg = 'Clôturer ce défi maintenant ?\n\nPodium :\n' + podium.map((e, i) => `${BADGE_MEDALS[i]} ${e.name} · ${e.score} ${c.metric}`).join('\n') + '\n\nLes trophées seront ajoutés au palmarès des joueuses concernées.';
  if (!confirm(msg)) return;

  podium.forEach((e, i) => {
    const player = state.players.find(p => p.id === e.pid);
    if (!player) return;
    player.badges = player.badges || [];
    if (player.badges.find(b => b.challengeId === c.id)) return;
    player.badges.push({
      id: uid(),
      challengeId: c.id,
      challengeTitle: c.title,
      rank: i + 1,
      score: e.score,
      metric: c.metric,
      scope: c.scope,
      date: new Date().toISOString().slice(0,10),
    });
  });
  c.badgesAwarded = true;
  // Si pas de endDate, la fixer à aujourd'hui pour l'archivage
  if (!c.endDate) c.endDate = new Date().toISOString().slice(0,10);
  persist();
  alert('🏆 Trophées attribués !');
  render();

// ============================================================
// JOUEUSES GUESTS — invitées temporaires sur une instance training
// (Phase 5 — cf. migrations 20260524_009_guest_players.sql).
//
// Une guest = un humain identifié par son nom (texte libre coach), suivi
// cross-instance pour permettre la suggestion "récents 30j" et la
// promotion en joueuse régulière.
// ============================================================

function getTrainingGuests(convocationId, instanceDate) {
  return (state.trainingGuests || [])
    .filter(tg => tg.convocationId === convocationId && tg.instanceDate === instanceDate)
    .map(tg => {
      const g = (state.guestPlayers || []).find(x => x.id === tg.guestPlayerId);
      return g ? { ...g, _link: tg } : null;
    })
    .filter(Boolean);
}

// "Guests récents" pour suggestion : seen dans les N derniers jours ET
// pas encore promus ET pas encore liés à cette instance précise.
function suggestRecentGuests(convocationId, instanceDate, daysWindow) {
  daysWindow = daysWindow || 30;
  const since = Date.now() - daysWindow * 24 * 3600 * 1000;
  const linkedHere = new Set(
    (state.trainingGuests || [])
      .filter(tg => tg.convocationId === convocationId && tg.instanceDate === instanceDate)
      .map(tg => tg.guestPlayerId)
  );
  return (state.guestPlayers || [])
    .filter(g => !g.promotedToPlayerId)
    .filter(g => !linkedHere.has(g.id))
    .filter(g => (g.lastSeenAt || 0) >= since)
    .sort((a, b) => (b.lastSeenAt || 0) - (a.lastSeenAt || 0));
}

// Crée un nouveau guest et le lie à l'instance. Si name existe déjà
// (case-insensitive) parmi les non-promus, on réutilise le guest existant
// au lieu de créer un doublon — c'est le comportement attendu quand le
// coach retape "Lina" plusieurs entraînements de suite.
function addGuestToTraining(convocationId, instanceDate, name, note) {
  const cleanName = (name || '').trim();
  if (!cleanName) return null;
  state.guestPlayers = state.guestPlayers || [];
  state.trainingGuests = state.trainingGuests || [];
  let existing = state.guestPlayers.find(g =>
    !g.promotedToPlayerId &&
    (g.name || '').trim().toLowerCase() === cleanName.toLowerCase()
  );
  const now = Date.now();
  if (!existing) {
    existing = {
      id: uid(),
      name: cleanName,
      note: (note || '').trim(),
      promotedToPlayerId: null,
      firstSeenAt: now,
      lastSeenAt: now,
      createdAt: now
    };
    state.guestPlayers.push(existing);
  } else {
    existing.lastSeenAt = now;
    if (note) existing.note = note.trim();
  }
  linkExistingGuestToTraining(convocationId, instanceDate, existing.id, { skipPersist: true });
  persist();
  return existing;
}

function linkExistingGuestToTraining(convocationId, instanceDate, guestId, opts) {
  opts = opts || {};
  state.trainingGuests = state.trainingGuests || [];
  const dup = state.trainingGuests.find(tg =>
    tg.convocationId === convocationId &&
    tg.guestPlayerId === guestId &&
    tg.instanceDate === instanceDate
  );
  if (!dup) {
    state.trainingGuests.push({
      convocationId, guestPlayerId: guestId, instanceDate,
      createdAt: Date.now()
    });
  }
  // MAJ lastSeenAt même sur ré-link (un guest réutilisé est "vu" à nouveau)
  const g = (state.guestPlayers || []).find(x => x.id === guestId);
  if (g) g.lastSeenAt = Date.now();
  if (!opts.skipPersist) persist();
}

function removeGuestFromTraining(convocationId, instanceDate, guestId) {
  state.trainingGuests = (state.trainingGuests || []).filter(tg =>
    !(tg.convocationId === convocationId && tg.guestPlayerId === guestId && tg.instanceDate === instanceDate)
  );
  persist();
}

// Promote : crée une row players + flag le guest comme promu (pour ne plus
// le suggérer mais garder l'historique du lien). Demande un numéro de
// maillot car obligatoire côté players.
function promoteGuestToPlayer(guestId) {
  const g = (state.guestPlayers || []).find(x => x.id === guestId);
  if (!g) return;
  if (g.promotedToPlayerId) { alert('Cette guest a déjà été promue.'); return; }
  const num = prompt(`Promouvoir "${g.name}" en joueuse régulière.\n\nNuméro de maillot ?`, '');
  if (num === null) return;
  const n = parseInt(num);
  if (isNaN(n) || n <= 0) { alert('Numéro invalide.'); return; }
  if ((state.players || []).some(p => p.num === n)) {
    if (!confirm(`Le numéro ${n} est déjà utilisé. Continuer quand même ?`)) return;
  }
  const newPlayer = {
    id: uid(),
    name: g.name,
    num: n,
    photo: null,
    feedback: {}
  };
  state.players = state.players || [];
  state.players.unshift(newPlayer);
  g.promotedToPlayerId = newPlayer.id;
  // Auto-rattache à la saison courante si une est active
  if (state.currentSeasonId) {
    state.seasonPlayers = state.seasonPlayers || [];
    state.seasonPlayers.push({
      seasonId: state.currentSeasonId,
      playerId: newPlayer.id,
      joinedAt: new Date().toISOString().slice(0, 10),
      leftAt: '',
      role: ''
    });
  }
  persist();
  alert(`✓ ${g.name} ajoutée à l'effectif${state.currentSeasonId ? ' et à la saison courante' : ''}.`);
  render();
}

// ============================================================
// EXPORT VICTOIRE CHALLENGE — story Instagram 1080x1920 portrait,
// Canvas 2D vanilla. Pas de dépendance, pas de stockage Supabase :
// le blob JPEG est généré à la demande et téléchargé via <a download>.
// Layout B : grosse photo joueuse gagnante (cercle 400px), nom XL, score
// énorme, titre challenge, date, runner-up compact dessous.
// ============================================================

function _slugifyForFile(s) {
  return String(s || '')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')  // strip diacritics
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '_')
    .replace(/^_+|_+$/g, '')
    .slice(0, 40) || 'item';
}

// Promise-wrapped image load. crossOrigin pour permettre toDataURL/toBlob
// quand le bucket Storage le permet ; fallback silencieux sur erreur (le
// caller dessine alors un placeholder).
function loadImage(url) {
  return new Promise((resolve, reject) => {
    if (!url) return reject(new Error('no url'));
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('img load failed'));
    img.src = url;
  });
}

// Clip + draw une image dans un cercle (cover, centré). Garde le ratio.
function drawCircleImage(ctx, img, cx, cy, r) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.closePath();
  ctx.clip();
  // Fit cover : ratio préservé, on remplit le cercle puis crop par le clip.
  const iw = img.width, ih = img.height;
  const scale = Math.max((2 * r) / iw, (2 * r) / ih);
  const dw = iw * scale, dh = ih * scale;
  ctx.drawImage(img, cx - dw / 2, cy - dh / 2, dw, dh);
  ctx.restore();
}

// Placeholder cercle avec initiale (utilisé si pas de photo joueuse).
function drawCirclePlaceholder(ctx, name, cx, cy, r, bgColor, fgColor) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.closePath();
  ctx.fillStyle = bgColor;
  ctx.fill();
  ctx.fillStyle = fgColor;
  ctx.font = `bold ${r * 0.9}px 'Anton', system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const initial = ((name || '?').trim().charAt(0) || '?').toUpperCase();
  ctx.fillText(initial, cx, cy + r * 0.05);
  ctx.restore();
}

// Word-wrap simple. Retourne nb de lignes effectivement dessinées (utile
// pour placer du contenu en dessous).
function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
  const words = String(text || '').split(/\s+/).filter(Boolean);
  const lines = [];
  let cur = '';
  words.forEach(w => {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width <= maxWidth) {
      cur = test;
    } else {
      if (cur) lines.push(cur);
      cur = w;
    }
  });
  if (cur) lines.push(cur);
  const out = (maxLines && lines.length > maxLines)
    ? lines.slice(0, maxLines - 1).concat([lines[maxLines - 1].replace(/.{0,3}$/, '…')])
    : lines;
  out.forEach((ln, i) => ctx.fillText(ln, x, y + i * lineHeight));
  return out.length;
}

// Returns { player, score } | null. Gère lowerIsBetter et les modes
// individual/season/collective. Pour collectif, le "winner" = top
// contributrice (joueuse avec score max, peu importe l'objectif).
function getChallengeWinner(c) {
  const scores = c.scores || {};
  const _seasonId = c.seasonId || state.currentSeasonId;
  const pool = _seasonsLoaded() && _seasonId
    ? getSeasonPlayers(_seasonId)
    : (state.players || []);
  const entries = pool
    .map(p => ({ player: p, score: scores[p.id] || 0 }))
    .filter(e => e.score > 0);
  if (!entries.length) return null;
  if (c.lowerIsBetter) entries.sort((a, b) => a.score - b.score);
  else entries.sort((a, b) => b.score - a.score);
  return entries[0];
}

function getChallengeRunnerUp(c, excludeId, n) {
  n = n || 2;
  const scores = c.scores || {};
  const _seasonId = c.seasonId || state.currentSeasonId;
  const pool = _seasonsLoaded() && _seasonId
    ? getSeasonPlayers(_seasonId)
    : (state.players || []);
  const entries = pool
    .map(p => ({ player: p, score: scores[p.id] || 0 }))
    .filter(e => e.score > 0 && e.player.id !== excludeId);
  if (!entries.length) return [];
  if (c.lowerIsBetter) entries.sort((a, b) => a.score - b.score);
  else entries.sort((a, b) => b.score - a.score);
  return entries.slice(0, n);
}

// Construit le canvas 1080x1920 et résout en Blob JPEG q=0.85.
async function generateChallengeStory(challengeId) {
  const c = state.challenges.find(x => x.id === challengeId);
  if (!c) throw new Error('Challenge introuvable');
  const winner = getChallengeWinner(c);
  if (!winner) throw new Error('Aucune joueuse avec un score > 0');
  const runnerUps = getChallengeRunnerUp(c, winner.player.id, 2);

  const W = 1080, H = 1920;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // Fond dégradé sombre (cohérent avec --bg-1 / --orange de l'app)
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#1a0e08');
  bg.addColorStop(0.5, '#0f0805');
  bg.addColorStop(1, '#000');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Halo orange derrière la photo
  const halo = ctx.createRadialGradient(W / 2, 620, 80, W / 2, 620, 480);
  halo.addColorStop(0, 'rgba(255,107,0,0.35)');
  halo.addColorStop(1, 'rgba(255,107,0,0)');
  ctx.fillStyle = halo;
  ctx.fillRect(0, 240, W, 760);

  // Eyebrow top : "🏆 CHAMPIONNE" + date
  ctx.fillStyle = '#ff6b00';
  ctx.font = `bold 38px 'JetBrains Mono', monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText('🏆  CHAMPIONNE', W / 2, 120);

  const today = new Date();
  const dateStr = today.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = `28px 'JetBrains Mono', monospace`;
  ctx.fillText(dateStr.toUpperCase(), W / 2, 180);

  // === Photo gagnante (cercle 400px) ===
  const photoCx = W / 2, photoCy = 620, photoR = 200;
  // Ring orange
  ctx.beginPath();
  ctx.arc(photoCx, photoCy, photoR + 12, 0, Math.PI * 2);
  ctx.strokeStyle = '#ff6b00';
  ctx.lineWidth = 8;
  ctx.stroke();

  let photoOk = false;
  if (winner.player.photo) {
    try {
      const img = await loadImage(winner.player.photo);
      drawCircleImage(ctx, img, photoCx, photoCy, photoR);
      photoOk = true;
    } catch (e) {
      // CORS ou 404 → fallback placeholder. Pas de log car attendu si la
      // photo vit en data: ou sur un host sans CORS.
    }
  }
  if (!photoOk) {
    drawCirclePlaceholder(ctx, winner.player.name, photoCx, photoCy, photoR, '#2a1810', '#ff6b00');
  }

  // === Nom joueuse ===
  ctx.fillStyle = '#fff';
  ctx.font = `bold 72px 'Anton', 'Impact', system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  const nameStr = `#${winner.player.num || '–'}  ${(winner.player.name || '').toUpperCase()}`;
  ctx.fillText(nameStr, W / 2, 900);

  // === Score énorme ===
  ctx.fillStyle = '#ff6b00';
  ctx.font = `bold 220px 'Anton', 'Impact', system-ui, sans-serif`;
  ctx.fillText(String(winner.score), W / 2, 1010);

  // Métrique sous le score
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = `36px 'JetBrains Mono', monospace`;
  ctx.fillText((c.metric || '').toUpperCase(), W / 2, 1250);

  // === Titre challenge (wrapped, max 2 lignes) ===
  ctx.fillStyle = '#fff';
  ctx.font = `48px 'Anton', 'Impact', system-ui, sans-serif`;
  ctx.textAlign = 'center';
  const titleLines = drawWrappedText(ctx, (c.title || '').toUpperCase(), W / 2, 1330, W - 160, 60, 2);

  // === Runner-up compact ===
  if (runnerUps.length > 0) {
    const blockY = 1530;
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = `26px 'JetBrains Mono', monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('PODIUM', W / 2, blockY);

    // 2nd (et 3e si dispo)
    runnerUps.forEach((r, i) => {
      const y = blockY + 60 + i * 80;
      const medal = i === 0 ? '🥈' : '🥉';
      const txt = `${medal}  #${r.player.num || '–'} ${r.player.name}  ·  ${r.score} ${c.metric || ''}`;
      ctx.fillStyle = '#fff';
      ctx.font = `36px 'Anton', 'Impact', system-ui, sans-serif`;
      ctx.fillText(txt.toUpperCase(), W / 2, y);
    });
  }

  // === Footer signature ===
  ctx.fillStyle = 'rgba(255,107,0,0.7)';
  ctx.font = `28px 'JetBrains Mono', monospace`;
  ctx.textAlign = 'center';
  ctx.fillText('PLAYBOOK · BCL', W / 2, H - 80);

  return new Promise((resolve, reject) => {
    canvas.toBlob(b => b ? resolve({ blob: b, winner, challenge: c }) : reject(new Error('toBlob failed')), 'image/jpeg', 0.85);
  });
}

function getFeedback(p) {
  // Défensif : p.feedback peut être undefined (jamais set), {} (reset DB),
  // ou {positives, negatives, updatedAt}. On garantit toujours la shape
  // {positives:[], negatives:[]} pour les callers qui font fb.positives.length
  // direct sans `|| []`.
  const fb = (p && p.feedback) || {};
  return { positives: fb.positives || [], negatives: fb.negatives || [] };
}

function addFeedbackItem(type) {
  if (state._editingFeedback[type].length >= 5) return;
  state._editingFeedback[type].push('');
  renderFeedbackEditor();
  setTimeout(() => {
    const inputs = document.querySelectorAll('.feedback-item-edit input');
    if (inputs.length > 0) inputs[inputs.length - 1].focus();
  }, 50);
}

function addFeedbackSuggestion(type, text) {
  if (state._editingFeedback[type].length >= 5) return;
  state._editingFeedback[type].push(text);
  renderFeedbackEditor();
}

function removeFeedbackItem(type, idx) {
  state._editingFeedback[type].splice(idx, 1);
  renderFeedbackEditor();
}

function saveFeedback() {
  const fb = state._editingFeedback;
  const p = state.players.find(x => x.id === fb.pid);
  if (!p) return;
  const positives = fb.positives.map(s => s.trim()).filter(s => s.length > 0);
  const negatives = fb.negatives.map(s => s.trim()).filter(s => s.length > 0);
  if (positives.length === 0 && negatives.length === 0) {
    delete p.feedback;
  } else {
    p.feedback = { positives, negatives, updatedAt: Date.now() };
  }
  state._editingFeedback = null;
  persist();
  // Sync feedback vers Supabase (players n'est pas dans ENTITIES, on push
  // explicitement via le canal dédié PbStore.upsertPlayer enrichi).
  if (window.PbStore) {
    PbStore.upsertPlayer(p).catch(e => console.warn('[sync] upsertPlayer feedback:', e.message));
  }
  closeModal();
  setTimeout(() => editPlayer(fb.pid), 50);
}

}

function removeReviewItem(type, idx) {
  state._editingReview[type].splice(idx, 1);
  renderPlayerReviewEditor();
}

function savePlayerReview() {
  const r = state._editingReview;
  const m = state.matches.find(x => x.id === r.matchId);
  if (!m) return;
  if (r.rating === 0) { alert('Choisis une note ⭐ avant d\'envoyer'); return; }
  m.playerReviews = m.playerReviews || {};
  m.playerReviews[r.pid] = {
    rating: r.rating,
    positives: r.positives.map(s => s.trim()).filter(s => s.length > 0),
    negatives: r.negatives.map(s => s.trim()).filter(s => s.length > 0),
    comment: r.comment.trim(),
    updatedAt: Date.now(),
  };
  state._editingReview = null;
  persist();
  closeModal();
  render();
}

function deletePlayerReview() {
  const r = state._editingReview;
  if (!confirm('Supprimer ton ressenti pour ce match ?')) return;
  const m = state.matches.find(x => x.id === r.matchId);
  if (m && m.playerReviews) delete m.playerReviews[r.pid];
  state._editingReview = null;
  persist();
  closeModal();
  render();
}

function saveTeamReview() {
  const r = state._editingTeamReview;
  if (!r) return;
  const today = new Date().toISOString().slice(0,10);
  const review = {
    id: r.id,
    pid: r.pid,
    date: today,
    ambiance: r.ambiance,
    roleClarity: r.roleClarity,
    playtime: r.playtime,
    physique: r.physique,
    comment: (r.comment || '').trim(),
    updatedAt: Date.now(),
  };
  state.teamReviews = state.teamReviews || [];
  // Dedupe : une seule entrée par (player, date). Si la joueuse soumet
  // 2× le même jour, on remplace son entrée existante au lieu d'empiler.
  // Avant : push() systématique → state grossit + sync upsert PK conflict.
  const existingIdx = state.teamReviews.findIndex(x => x.pid === r.pid && x.date === today);
  if (existingIdx >= 0) {
    review.id = state.teamReviews[existingIdx].id; // garder l'ID pour upsert idempotent
    state.teamReviews[existingIdx] = review;
  } else {
    state.teamReviews.push(review);
  }
  state._editingTeamReview = null;
  persist();
  // Render AVANT alert : la home/dashboard reflète l'update immédiatement,
  // même si l'alert bloque (ex. en PWA standalone). Avant : alert d'abord
  // donc render différé jusqu'au clic OK → impression de "MAJ pas dynamique".
  closeModal();
  render();
  setTimeout(() => alert('✓ Ressenti envoyé au coach. Merci !'), 0);
}

  const reviews = state.teamReviews || [];

  const _seasonIds = new Set(_seasonPool.map(p => p.id));

  `);
}

// =========== STORY INSTAGRAM 9:16 ===========

async function exportStory(matchId, style, customMessage) {
  const m = state.matches.find(x => x.id === matchId);
  if (!m) return;
  const win = m.scoreUs > m.scoreOpp;
  style = style || 'simple';

  // Top 3 par Game Score (si stats dispo)
  const players = Object.entries(m.playerStats || {})
    .map(([pid, s]) => ({ player: state.players.find(p => p.id === pid), stats: s, gs: gameScore(s) }))
    .filter(r => r.player && r.gs > 0)
    .sort((a,b) => b.gs - a.gs)
    .slice(0, 3);

  const canvas = document.createElement('canvas');
  canvas.width = 1080;
  canvas.height = 1920;
  const ctx = canvas.getContext('2d');

  // Fond dégradé noir
  const grad = ctx.createLinearGradient(0, 0, 0, 1920);
  grad.addColorStop(0, '#000000');
  grad.addColorStop(0.5, '#0f0f0f');
  grad.addColorStop(1, win ? '#1a0e00' : '#0f0000');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1080, 1920);

  // Accent orange en haut
  const accGrad = ctx.createLinearGradient(0, 0, 1080, 0);
  accGrad.addColorStop(0, 'transparent');
  accGrad.addColorStop(0.5, '#ff6b00');
  accGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = accGrad;
  ctx.fillRect(0, 0, 1080, 4);

  // === HEADER ===
  ctx.fillStyle = '#ff6b00';
  ctx.font = 'bold 32px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('IE-BASKET CLUB L\'ISLOIS · 2', 540, 130);

  ctx.fillStyle = '#888';
  ctx.font = '24px monospace';
  ctx.fillText(formatDate(m.date, 'long').toUpperCase(), 540, 175);

  // === ZONE STYLE 'SELFIE' : photo en grand au centre ===
  if (style === 'selfie' && m.winSelfie) {
    // Charger la photo via loadImage() (crossOrigin='anonymous') pour NE PAS
    // tainter le canvas. Le selfie victoire vit dans Supabase Storage (URL
    // cross-origin) depuis la migration Storage : un `new Image()` brut sans
    // crossOrigin teintait le canvas → canvas.toDataURL() levait "Tainted
    // canvas may not be exported" et la story ne se générait plus. Si le chargement
    // échoue (CORS/Storage indispo), on dégrade : story sans photo plutôt que crash.
    let selfieImg = null;
    try { selfieImg = await loadImage(m.winSelfie); }
    catch (e) { console.warn('[exportStory] selfie load échoué (CORS/Storage ?):', e && e.message); }
    if (selfieImg) {
      const img = selfieImg;
      // Calc dimensions pour fit dans 880x880 centré
      const targetSize = 880;
      const x = (1080 - targetSize) / 2;
      const y = 240;
      // Cadre orange
      ctx.fillStyle = '#ff6b00';
      roundedRect(ctx, x - 6, y - 6, targetSize + 12, targetSize + 12, 20);
      ctx.fill();
      // Photo (cover crop)
      ctx.save();
      roundedRect(ctx, x, y, targetSize, targetSize, 16);
      ctx.clip();
      const ratio = img.width / img.height;
      let dw = targetSize, dh = targetSize;
      if (ratio > 1) { dw = targetSize * ratio; }
      else { dh = targetSize / ratio; }
      const dx = x - (dw - targetSize) / 2;
      const dy = y - (dh - targetSize) / 2;
      ctx.drawImage(img, dx, dy, dw, dh);
      ctx.restore();
      // Bandeau noir bas
      ctx.fillStyle = 'rgba(0,0,0,0.85)';
      ctx.fillRect(x, y + targetSize - 130, targetSize, 130);
      // Score sur le bandeau
      ctx.fillStyle = win ? '#22c55e' : '#ef4444';
      ctx.font = 'bold 18px monospace';
      ctx.fillText(win ? 'VICTOIRE' : 'DÉFAITE', 540, y + targetSize - 88);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 70px sans-serif';
      ctx.fillText((m.scoreUs||0) + '–' + (m.scoreOpp||0), 540, y + targetSize - 30);
    }
    // Sous photo : adversaire
    ctx.fillStyle = '#aaa';
    ctx.font = '32px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('vs ' + (m.opponent || '').toUpperCase(), 540, 1240);
    ctx.fillStyle = '#666';
    ctx.font = '22px monospace';
    ctx.fillText(m.home ? 'À DOMICILE' : 'À L\'EXTÉRIEUR', 540, 1280);

    // Légende optionnelle (texte custom passé via exportSelfieWithText)
    if (customMessage && customMessage.trim()) {
      ctx.fillStyle = '#ff6b00';
      ctx.font = 'bold 22px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('— LÉGENDE —', 540, 1400);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 42px sans-serif';
      const lines = wrapText(ctx, customMessage.trim(), 920);
      const startY = 1480;
      const lh = 60;
      lines.slice(0, 4).forEach((line, idx) => {
        ctx.fillText(line, 540, startY + idx * lh);
      });
    }
  } else {
    // === BANDEAU VICTOIRE/DÉFAITE ===
    ctx.fillStyle = win ? '#22c55e' : '#ef4444';
    ctx.font = 'bold 80px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(win ? 'VICTOIRE' : 'DÉFAITE', 540, 320);

    // === SCORE GÉANT ===
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 280px sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText((m.scoreUs || 0) + '–' + (m.scoreOpp || 0), 540, 530);
    ctx.textBaseline = 'alphabetic';

    // === VS Adversaire ===
    ctx.fillStyle = '#aaa';
    ctx.font = '40px monospace';
    ctx.fillText('vs ' + (m.opponent || '').toUpperCase(), 540, 740);

    ctx.fillStyle = '#666';
    ctx.font = '24px monospace';
    ctx.fillText(m.home ? 'À DOMICILE' : 'À L\'EXTÉRIEUR', 540, 785);

    // Trait orange
    ctx.fillStyle = '#ff6b00';
    ctx.fillRect(390, 850, 300, 3);
  }

  // === CONTENU PRINCIPAL SELON LE STYLE ===
  if (style === 'stats' && players.length > 0) {
    // Top 3
    ctx.fillStyle = '#ff6b00';
    ctx.font = 'bold 28px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('TOP 3 · CONTRIBUTRICES', 540, 920);

    const medals = ['🥇', '🥈', '🥉'];
    for (let i = 0; i < 3; i++) {
      const r = players[i];
      const y = 1020 + i * 200;
      ctx.fillStyle = 'rgba(255,107,0,' + (0.15 - i*0.03) + ')';
      ctx.strokeStyle = 'rgba(255,107,0,0.4)';
      ctx.lineWidth = 2;
      const cardW = 880, cardH = 170, cardX = 100;
      roundedRect(ctx, cardX, y, cardW, cardH, 16);
      ctx.fill();
      ctx.stroke();
      if (r) {
        ctx.font = '80px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#fff';
        ctx.fillText(medals[i], cardX + 90, y + 110);
        ctx.font = 'bold 44px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillStyle = '#fff';
        const name = '#' + r.player.num + ' ' + r.player.name.toUpperCase();
        ctx.fillText(name.length > 22 ? name.slice(0,22) : name, cardX + 180, y + 70);
        ctx.font = '28px monospace';
        ctx.fillStyle = '#ff6b00';
        ctx.fillText((r.stats.pts || 0) + ' PTS  ·  ' + (r.stats.reb || 0) + ' REB  ·  ' + (r.stats.ast || 0) + ' PD', cardX + 180, y + 115);
        ctx.font = 'bold 24px monospace';
        ctx.fillStyle = r.gs >= 15 ? '#22c55e' : r.gs < 5 ? '#ef4444' : '#ff6b00';
        ctx.fillText('+/− ' + (r.gs >= 0 ? '+' : '') + r.gs.toFixed(1), cardX + 180, y + 150);
      } else {
        ctx.font = '32px monospace';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#555';
        ctx.fillText('—', 540, y + 100);
      }
    }
  } else if (style === 'custom' && customMessage) {
    // Message personnalisé
    ctx.fillStyle = '#ff6b00';
    ctx.font = 'bold 24px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('— MOT DU COACH —', 540, 940);

    // Texte : on découpe les lignes pour qu'elles tiennent dans 960px
    ctx.fillStyle = '#fff';
    ctx.font = '46px sans-serif';
    const maxWidth = 920;
    const lineHeight = 70;
    const lines = wrapText(ctx, customMessage, maxWidth);
    const startY = 1080;
    lines.slice(0, 8).forEach((line, idx) => {
      ctx.fillText(line, 540, startY + idx * lineHeight);
    });
  } else if (style === 'simple' || (style === 'stats' && players.length === 0) || (style === 'selfie' && !m.winSelfie)) {
    // Style minimaliste : juste le score, espace propre + adversaire en bas
    // Ajout d'éléments décoratifs
    ctx.fillStyle = '#ff6b00';
    ctx.font = 'bold 28px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('— MATCH ' + (win ? 'GAGNÉ' : 'JOUÉ') + ' —', 540, 970);

    // Stats équipe basiques si dispo
    const totalReb = Object.values(m.playerStats||{}).reduce((acc,s) => acc + (s.reb||0), 0);
    const totalAst = Object.values(m.playerStats||{}).reduce((acc,s) => acc + (s.ast||0), 0);
    const totalStl = Object.values(m.playerStats||{}).reduce((acc,s) => acc + (s.stl||0), 0);
    if (totalReb + totalAst + totalStl > 0) {
      ctx.fillStyle = '#aaa';
      ctx.font = '40px monospace';
      ctx.fillText(totalReb + ' REB · ' + totalAst + ' PD · ' + totalStl + ' INT', 540, 1100);
      ctx.fillStyle = '#666';
      ctx.font = '22px monospace';
      ctx.fillText('STATS COLLECTIVES', 540, 1145);
    }

    // Citation motivante au centre
    const quotes = win
      ? ['Talent gagne des matchs.', 'Esprit d\'équipe.', 'Toutes ensemble.', 'On reste concentrées.']
      : ['On apprend et on revient.', 'La suite nous appartient.', 'Plus fortes ensemble.', 'On garde la tête haute.'];
    const quote = quotes[Math.floor(Math.random() * quotes.length)];
    ctx.fillStyle = '#fff';
    ctx.font = 'italic 54px sans-serif';
    ctx.fillText(quote, 540, 1380);

    // Logo / hashtag
    ctx.fillStyle = '#ff6b00';
    ctx.font = 'bold 32px monospace';
    ctx.fillText('#BCL2', 540, 1600);
  }

  // === FOOTER ===
  ctx.fillStyle = '#444';
  ctx.font = '20px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('PLAYBOOK BCL · ' + new Date().toLocaleDateString('fr-FR'), 540, 1870);

  // === EXPORT ===
  let dataUrl;
  try {
    dataUrl = canvas.toDataURL('image/png');
  } catch (e) {
    // Canvas teinté (image cross-origin sans CORS) → toDataURL lève SecurityError.
    console.error('[exportStory] toDataURL échoué (canvas teinté ?):', e && e.message);
    alert("Impossible de générer l'image (photo non accessible). Réessaie, ou retire/réajoute le selfie du match.");
    return;
  }
  const shareSupported = navigator.share && navigator.canShare;

  openModal(`
    <div class="modal-header">
      <div class="modal-title">📱 Story prête</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" style="text-align:center">
      <img src="${dataUrl}" style="max-width:100%;max-height:60vh;border-radius:12px;border:2px solid var(--orange);box-shadow:0 8px 32px rgba(255,107,0,0.25)">
      <div style="margin-top:14px;display:flex;flex-direction:column;gap:6px">
        ${shareSupported ? `<button class="btn btn-primary btn-block" onclick="shareStory('${matchId}', this)">📤 Partager (WhatsApp / Insta...)</button>` : ''}
        <a href="${dataUrl}" download="playbook-vs-${(m.opponent||'match').replace(/[^a-z0-9]/gi,'-')}.png" class="btn btn-secondary btn-block" style="text-decoration:none;text-align:center">⬇ Télécharger l'image</a>
        <button class="btn btn-ghost btn-block" onclick="closeModal();setTimeout(()=>openExportMenu('${matchId}'),50)" style="font-size:11px">← Choisir un autre style</button>
        <div style="margin-top:8px;font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';line-height:1.5">
          Sur iPhone : appui long sur l'image → "Enregistrer dans Photos" → publier dans ton app.
        </div>
      </div>
    </div>
  `);

  state._lastStoryDataUrl = dataUrl;
  state._lastStoryMatchId = matchId;
}

// Découpe un texte en lignes qui rentrent dans maxWidth
function wrapText(ctx, text, maxWidth) {
  const lines = [];
  // On respecte d'abord les \n explicites
  text.split('\n').forEach(paragraph => {
    if (!paragraph.trim()) { lines.push(''); return; }
    const words = paragraph.split(' ');
    let line = '';
    words.forEach(word => {
      const test = line ? line + ' ' + word : word;
      const w = ctx.measureText(test).width;
      if (w > maxWidth && line) {
        lines.push(line);
        line = word;
      } else {
        line = test;
      }
    });
    if (line) lines.push(line);
  });
  return lines;
}

async function shareStory(matchId, btn) {
  if (!state._lastStoryDataUrl) return;
  try {
    // Convertir dataUrl en blob
    const resp = await fetch(state._lastStoryDataUrl);
    const blob = await resp.blob();
    const m = state.matches.find(x => x.id === matchId);
    const file = new File([blob], 'playbook-match.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({
        files: [file],
        title: 'BCL vs ' + (m.opponent || 'Match'),
        text: (m.scoreUs > m.scoreOpp ? 'Victoire ' : 'Match ') + m.scoreUs + '–' + m.scoreOpp + ' vs ' + (m.opponent || ''),
      });
    } else {
      alert('Partage non supporté · télécharge l\'image et partage manuellement.');
    }
  } catch (e) {
    if (e.name !== 'AbortError') alert('Partage annulé ou erreur : ' + e.message);
  }
}

function roundedRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function exportMatchSheet(matchId) {
  const m = state.matches.find(x => x.id === matchId);
  if (!m) return;
  const win = m.scoreUs > m.scoreOpp;
