function renderMatches() {
  if (state.view && state.view.type === 'match') return renderMatchDetail();

  // SAISON : filtre par state.currentSeasonId (les matches legacy sans
  // seasonId sont rattachés visuellement à la saison `active`).
  const matches = [...currentSeasonMatches()].sort((a,b) => b.date.localeCompare(a.date));
  // Seuls les matchs joués (avec un score) entrent dans le bilan
  const playedMatches = matches.filter(m => (m.scoreUs || 0) > 0 || (m.scoreOpp || 0) > 0);
  const wins = playedMatches.filter(m => m.scoreUs > m.scoreOpp).length;
  const losses = playedMatches.filter(m => m.scoreUs < m.scoreOpp).length;
  const avgFor = playedMatches.length ? (playedMatches.reduce((a,m) => a + m.scoreUs, 0) / playedMatches.length).toFixed(1) : '0';
  const avgAgainst = playedMatches.length ? (playedMatches.reduce((a,m) => a + m.scoreOpp, 0) / playedMatches.length).toFixed(1) : '0';
  const isCoach = state.auth.role === 'coach';
  const isStat = state.auth.role === 'stat';

  return `
    <div class="fade-up">
      <div class="section-header">
        <div>
          <div class="eyebrow-muted">${matches.length} match${matches.length > 1 ? 's' : ''}</div>
          <h2 class="display-lg mt-2">Saison</h2>
        </div>
        <div style="display:flex;gap:6px">
          ${matches.length > 0 ? `<button class="btn btn-secondary" onclick="openDashboard()" style="font-size:11px">📊 Dashboard</button>` : ''}
          ${(isCoach || isStat) ? `<button class="btn btn-primary" onclick="editMatch()">+ MATCH</button>` : ''}
        </div>
      </div>

      <div class="stat-grid mb-3">
        <div class="stat-tile">
          <div class="stat-tile-label">Bilan</div>
          <div class="stat-tile-value">${wins}<span style="color:var(--ink-4)"> · ${losses}</span></div>
        </div>
        <div class="stat-tile">
          <div class="stat-tile-label">PPG</div>
          <div class="stat-tile-value">${avgFor}<span style="font-size:20px;color:var(--ink-4)"> / ${avgAgainst}</span></div>
        </div>
      </div>

      <div class="section-header">
        <h2 class="display-md">Historique</h2>
      </div>

      ${matches.length === 0 ? `
        <div class="empty">
          <div class="empty-icon">○</div>
          <div class="empty-title">Aucun match</div>
        </div>
      ` : `
        <div class="list-section">${matches.map(m => matchRow(m)).join('')}</div>
      `}
    </div>
  `;
}

function matchRow(m) {
  const played = (m.scoreUs || 0) > 0 || (m.scoreOpp || 0) > 0;
  const win = played && m.scoreUs > m.scoreOpp;
  const todayStr = new Date().toISOString().slice(0,10);
  const upcoming = !played && m.date >= todayStr;
  const badgeClass = played ? (win ? 'match-result-w' : 'match-result-l') : '';
  const badgeStyle = !played ? 'background:var(--bg-3);color:var(--ink-3);border:1px solid var(--border)' : '';
  const badgeLabel = played ? (win ? 'V' : 'D') : (upcoming ? '→' : '○');
  return `
    <div class="match-row" onclick="openMatch('${m.id}')">
      <div class="match-result-badge ${badgeClass}" style="${badgeStyle}">${badgeLabel}</div>
      <div style="flex:1;min-width:0">
        <div style="font-family:'Anton';font-size:16px;text-transform:uppercase;letter-spacing:0.02em">${esc(m.opponent)}</div>
        <div style="font-size:11px;color:var(--ink-3);margin-top:2px;font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.05em">
          ${formatDate(m.date)} · ${m.home ? 'Domicile' : 'Extérieur'}${m.videoUrl ? ' · ▶' : ''}
        </div>
      </div>
      ${played ? `<div class="match-score">${m.scoreUs}–${m.scoreOpp}</div>` : `<div style="font-family:'JetBrains Mono';font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.06em">${upcoming ? 'À venir' : '—'}</div>`}
    </div>
  `;
}

function openMatch(id) {
  // Le détail match (renderMatchDetail) est accessible depuis :
  // - coach/stat : section 'matches'
  // - joueuse : section 'match' (nouvel onglet dédié) ou 'calendrier' (agenda)
  //   On conserve la section courante si c'est déjà l'un des deux ; sinon
  //   on tombe sur 'match' (plus pertinent que l'agenda pour ce flux).
  // La vue détail est lue depuis state.view = { type:'match', id } et le
  // dispatcher de render() gère la priorité view > section.
  if (state.auth && state.auth.role === 'player') {
    if (state.section !== 'match' && state.section !== 'calendrier') {
      state.section = 'match';
    }
  } else {
    state.section = 'matches';
  }
  state.view = { type: 'match', id };
  render(); _scrollTopApp();
}

function renderDashTeam(matches) {
  if (matches.length === 0) {
    return `<div class="empty" style="padding:30px"><div class="empty-icon">○</div><div class="empty-title">Aucun match joué</div></div>`;
  }
  const wins = matches.filter(m => m.scoreUs > m.scoreOpp);
  const losses = matches.filter(m => m.scoreUs < m.scoreOpp);
  const winRate = Math.round(100 * wins.length / matches.length);
  const avgFor = matches.reduce((a,m) => a + (m.scoreUs||0), 0) / matches.length;
  const avgAgainst = matches.reduce((a,m) => a + (m.scoreOpp||0), 0) / matches.length;
  const diff = avgFor - avgAgainst;

  // Last 5
  const last5 = matches.slice(-5);
  const last5W = last5.filter(m => m.scoreUs > m.scoreOpp).length;

  // Domicile vs Extérieur
  const home = matches.filter(m => m.home);
  const away = matches.filter(m => !m.home);
  const homeW = home.filter(m => m.scoreUs > m.scoreOpp).length;
  const awayW = away.filter(m => m.scoreUs > m.scoreOpp).length;

  return `
    <div class="stat-grid mb-3">
      <div class="stat-tile">
        <div class="stat-tile-label">Bilan</div>
        <div class="stat-tile-value">${wins.length}<span style="color:var(--ink-4)">−${losses.length}</span></div>
        <div class="stat-tile-sub">${winRate}% de victoires</div>
      </div>
      <div class="stat-tile">
        <div class="stat-tile-label">Différentiel</div>
        <div class="stat-tile-value" style="color:${diff>=0?'var(--green)':'var(--red)'}">${diff>=0?'+':''}${diff.toFixed(1)}</div>
        <div class="stat-tile-sub">par match</div>
      </div>
    </div>

    <div class="stat-grid mb-3">
      <div class="stat-tile">
        <div class="stat-tile-label">PTS marqués</div>
        <div class="stat-tile-value">${avgFor.toFixed(1)}</div>
        <div class="stat-tile-sub">moyenne / match</div>
      </div>
      <div class="stat-tile">
        <div class="stat-tile-label">PTS encaissés</div>
        <div class="stat-tile-value">${avgAgainst.toFixed(1)}</div>
        <div class="stat-tile-sub">moyenne / match</div>
      </div>
    </div>

    <div class="eyebrow-muted mb-2" style="margin-top:14px">Forme récente · 5 derniers</div>
    <div style="display:flex;gap:4px;margin-bottom:14px">
      ${last5.map(m => {
        const w = m.scoreUs > m.scoreOpp;
        return `<div title="${esc(m.opponent)} ${m.scoreUs}-${m.scoreOpp}" style="flex:1;padding:8px 4px;text-align:center;background:${w?'rgba(34,197,94,0.15)':'rgba(239,68,68,0.15)'};border:1px solid ${w?'var(--green)':'var(--red)'};border-radius:6px;font-family:'Anton';font-size:16px;color:${w?'var(--green)':'var(--red)'}">${w?'V':'D'}</div>`;
      }).join('')}
      ${last5.length < 5 ? Array.from({length: 5-last5.length}, () => '<div style="flex:1"></div>').join('') : ''}
    </div>
    <div style="text-align:center;font-family:'JetBrains Mono';font-size:11px;color:var(--ink-3);margin-bottom:14px">${last5W} V · ${last5.length-last5W} D sur les 5 derniers</div>

    <div class="stat-grid mb-3">
      <div class="stat-tile">
        <div class="stat-tile-label">À domicile</div>
        <div class="stat-tile-value">${homeW}<span style="color:var(--ink-4)">−${home.length-homeW}</span></div>
        <div class="stat-tile-sub">${home.length} matchs</div>
      </div>
      <div class="stat-tile">
        <div class="stat-tile-label">À l'extérieur</div>
        <div class="stat-tile-value">${awayW}<span style="color:var(--ink-4)">−${away.length-awayW}</span></div>
        <div class="stat-tile-sub">${away.length} matchs</div>
      </div>
    </div>

    <div class="eyebrow-muted mb-2" style="margin-top:14px">Évolution scores</div>
    ${renderScoreSparkline(matches)}
  `;
}

function renderScoreSparkline(matches) {
  if (matches.length < 2) return '<div style="font-size:11px;color:var(--ink-3);text-align:center;padding:14px">Plus de matchs nécessaires</div>';
  const w = 320, h = 80;
  const padding = 6;
  const allScores = matches.flatMap(m => [m.scoreUs||0, m.scoreOpp||0]);
  const maxS = Math.max(...allScores, 60);
  const minS = 0;
  const xStep = (w - 2*padding) / Math.max(1, matches.length - 1);
  const ptToCoord = (s, i) => {
    const x = padding + i * xStep;
    const y = h - padding - ((s - minS) / (maxS - minS)) * (h - 2*padding);
    return [x, y];
  };
  const usPath = matches.map((m, i) => {
    const [x, y] = ptToCoord(m.scoreUs || 0, i);
    return (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
  const oppPath = matches.map((m, i) => {
    const [x, y] = ptToCoord(m.scoreOpp || 0, i);
    return (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');

  return `
    <div style="background:var(--bg-2);border:1px solid var(--border);border-radius:8px;padding:10px 6px">
      <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
        <path d="${oppPath}" stroke="var(--red)" stroke-width="1.5" fill="none" opacity="0.7"></path>
        <path d="${usPath}" stroke="var(--orange)" stroke-width="2" fill="none"></path>
        ${matches.map((m, i) => {
          const [xu, yu] = ptToCoord(m.scoreUs || 0, i);
          const [xo, yo] = ptToCoord(m.scoreOpp || 0, i);
          return `<circle cx="${xu.toFixed(1)}" cy="${yu.toFixed(1)}" r="2.5" fill="var(--orange)"></circle><circle cx="${xo.toFixed(1)}" cy="${yo.toFixed(1)}" r="2" fill="var(--red)"></circle>`;
        }).join('')}
      </svg>
      <div style="display:flex;gap:14px;justify-content:center;margin-top:6px;font-size:10px;font-family:'JetBrains Mono'">
        <span style="color:var(--orange)">━ Nous</span>
        <span style="color:var(--red)">━ Adversaire</span>
      </div>
    </div>
  `;
}

function renderDashPlayers(matches) {
  if (matches.length === 0) {
    return `<div class="empty" style="padding:30px"><div class="empty-icon">○</div><div class="empty-title">Aucun match joué</div></div>`;
  }
  // Calculer stats agrégées par joueuse
  // SAISON : on agrège uniquement pour l'effectif de la saison courante. Les
  // stats des joueuses parties restent dans m.playerStats (cross-saison via
  // boxscore détail) mais pas dans ce dashboard agrégé.
  const _seasonPool = currentSeasonPlayers();
  const agg = {};
  _seasonPool.forEach(p => {
    agg[p.id] = { player: p, games: 0, pts: 0, reb: 0, ast: 0, stl: 0, fouls: 0, gs: 0, p2i:0, p2iA:0, p2e:0, p2eA:0, p3:0, p3A:0, ft:0, ftA:0, ca:0, def:0, to:0 };
  });
  matches.forEach(m => {
    Object.entries(m.playerStats || {}).forEach(([pid, s]) => {
      if (!agg[pid]) return;
      agg[pid].games++;
      ['pts','reb','ast','stl','fouls','p2i','p2iA','p2e','p2eA','p3','p3A','ft','ftA','ca','def','to'].forEach(k => {
        agg[pid][k] += (s[k] || 0);
      });
      agg[pid].gs += gameScore(s);
    });
  });
  // Tendance : 3 derniers matchs vs reste
  _seasonPool.forEach(p => {
    const recent = matches.slice(-3);
    const older = matches.slice(0, -3);
    let recentGS = 0, olderGS = 0, rN = 0, oN = 0;
    recent.forEach(m => { const s = (m.playerStats || {})[p.id]; if (s) { recentGS += gameScore(s); rN++; } });
    older.forEach(m => { const s = (m.playerStats || {})[p.id]; if (s) { olderGS += gameScore(s); oN++; } });
    if (rN > 0 && oN > 0) {
      agg[p.id].trend = (recentGS/rN) - (olderGS/oN);
    } else {
      agg[p.id].trend = 0;
    }
  });
  // Tri par GS moyen décroissant
  const rows = Object.values(agg).filter(r => r.games > 0).sort((a,b) => (b.gs/b.games) - (a.gs/a.games));

  if (rows.length === 0) return `<div class="empty" style="padding:30px"><div class="empty-title">Aucune stat joueuse</div></div>`;

  return `
    <div class="eyebrow-muted mb-2">Tri par +/− moyen (Game Score)</div>
    <div style="display:flex;flex-direction:column;gap:6px">
      ${rows.map((r, idx) => {
        const avgGS = r.gs / r.games;
        const avgPts = r.pts / r.games;
        const trend = r.trend || 0;
        const trendIcon = Math.abs(trend) < 0.5 ? '→' : (trend > 0 ? '↗' : '↘');
        const trendColor = Math.abs(trend) < 0.5 ? 'var(--ink-3)' : (trend > 0 ? 'var(--green)' : 'var(--red)');
        const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '';
        return `
          <div style="display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg-2);border-radius:8px;border:1px solid var(--border-soft)">
            <div style="font-family:'Anton';font-size:14px;color:var(--orange);min-width:24px">#${r.player.num}</div>
            <div style="flex:1;min-width:0">
              <div style="font-family:'Anton';font-size:13px;text-transform:uppercase">${medal}${esc(r.player.name)}</div>
              <div style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:2px">${r.games} matchs · ${avgPts.toFixed(1)} pts</div>
            </div>
            <div style="text-align:right">
              <div style="display:flex;align-items:baseline;gap:6px">
                <span style="font-family:'Anton';font-size:18px;color:${avgGS>=15?'var(--green)':avgGS<5?'var(--red)':'var(--orange)'}">${avgGS>=0?'+':''}${avgGS.toFixed(1)}</span>
                <span style="font-size:14px;color:${trendColor}">${trendIcon}</span>
              </div>
              <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono'">+/− moyen</div>
            </div>
          </div>
        `;
      }).join('')}
    </div>
    <div style="margin-top:14px;padding:10px;background:var(--bg-1);border-radius:6px;font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';line-height:1.5">
      <strong>↗</strong> = progression (3 derniers vs reste) · <strong>↘</strong> = baisse · <strong>→</strong> = stable
    </div>
  `;
}

function renderDashRecords(matches) {
  if (matches.length === 0) return `<div class="empty" style="padding:30px"><div class="empty-icon">○</div><div class="empty-title">Aucun record</div></div>`;
  // Plus large victoire
  let widest = null, widestDiff = -Infinity;
  matches.forEach(m => {
    const d = (m.scoreUs||0) - (m.scoreOpp||0);
    if (d > widestDiff) { widestDiff = d; widest = m; }
  });
  // Plus serré
  let tightest = null, tightestDiff = Infinity;
  matches.filter(m => m.scoreUs > m.scoreOpp).forEach(m => {
    const d = m.scoreUs - m.scoreOpp;
    if (d < tightestDiff) { tightestDiff = d; tightest = m; }
  });
  // Records individuels
  const allStats = [];
  matches.forEach(m => {
    Object.entries(m.playerStats || {}).forEach(([pid, s]) => {
      const p = state.players.find(x => x.id === pid);
      if (p) allStats.push({ match: m, player: p, stats: s, gs: gameScore(s) });
    });
  });
  const topPts = allStats.slice().sort((a,b) => (b.stats.pts||0) - (a.stats.pts||0))[0];
  const topReb = allStats.slice().sort((a,b) => (b.stats.reb||0) - (a.stats.reb||0))[0];
  const topAst = allStats.slice().sort((a,b) => (b.stats.ast||0) - (a.stats.ast||0))[0];
  const topGS = allStats.slice().sort((a,b) => b.gs - a.gs)[0];

  const recordCard = (label, value, sub) => `
    <div style="padding:12px;background:var(--bg-2);border:1px solid var(--border-soft);border-radius:8px;border-left:3px solid var(--orange)">
      <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px">${label}</div>
      <div style="font-family:'Anton';font-size:14px;text-transform:uppercase;line-height:1.3">${value}</div>
      ${sub ? `<div style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:4px">${sub}</div>` : ''}
    </div>
  `;

  return `
    <div style="display:flex;flex-direction:column;gap:8px">
      ${widest && widestDiff > 0 ? recordCard('🏆 Plus large victoire', '+' + widestDiff + ' pts vs ' + esc(widest.opponent), widest.scoreUs + '−' + widest.scoreOpp + ' · ' + formatDate(widest.date)) : ''}
      ${tightest ? recordCard('💪 Victoire la plus serrée', '+' + tightestDiff + ' pt' + (tightestDiff>1?'s':'') + ' vs ' + esc(tightest.opponent), tightest.scoreUs + '−' + tightest.scoreOpp + ' · ' + formatDate(tightest.date)) : ''}
      ${topPts && topPts.stats.pts > 0 ? recordCard('🎯 Record points', topPts.player.name + ' · ' + topPts.stats.pts + ' pts', 'vs ' + esc(topPts.match.opponent) + ' · ' + formatDate(topPts.match.date)) : ''}
      ${topReb && topReb.stats.reb > 0 ? recordCard('💥 Record rebonds', topReb.player.name + ' · ' + topReb.stats.reb + ' reb', 'vs ' + esc(topReb.match.opponent) + ' · ' + formatDate(topReb.match.date)) : ''}
      ${topAst && topAst.stats.ast > 0 ? recordCard('👁 Record passes décisives', topAst.player.name + ' · ' + topAst.stats.ast + ' PD', 'vs ' + esc(topAst.match.opponent) + ' · ' + formatDate(topAst.match.date)) : ''}
      ${topGS && topGS.gs > 0 ? recordCard('⭐ MVP de la saison (meilleur +/−)', topGS.player.name + ' · ' + topGS.gs.toFixed(1), 'vs ' + esc(topGS.match.opponent) + ' · ' + formatDate(topGS.match.date)) : ''}
    </div>
  `;
}

function renderMatchDetail() {
  const m = state.matches.find(x => x.id === state.view.id);
  if (!m) { state.view = null; return renderMatches(); }
  // Phase 4 : `status` est la source de vérité. Migration runtime pour les
  // matchs legacy (localStorage avant 2026-05-24) sans status → on infère.
  if (!m.status) {
    m.status = ((m.scoreUs | 0) > 0 || (m.scoreOpp | 0) > 0) ? 'played' : 'to_play';
  }
  const isToPlay = m.status === 'to_play';
  const scoreEntered = (m.scoreUs || 0) > 0 || (m.scoreOpp || 0) > 0;
  const played = m.status === 'played';
  const todayStr = new Date().toISOString().slice(0,10);
  const upcoming = isToPlay && m.date >= todayStr;
  const win = played && m.scoreUs > m.scoreOpp;
  const positives = m.positives || [];
  const negatives = m.negatives || [];
  const stats = m.playerStats || {};
  const isCoach = state.auth.role === 'coach';
  const isStat = state.auth.role === 'stat';
  // Toggle UI : "Voir la prépa" pour les matchs déjà joués (historique).
  const showPrepArchive = isCoach && played && state._showPrepArchive === m.id;

  return `
    <div class="fade-up">
      <button class="detail-back" onclick="state.view=null;render()">← ${state.auth.role === 'player' ? 'Agenda' : 'Tous les matchs'}</button>

      <div class="px" style="padding-top:6px">
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center">
          ${played
            ? `<span class="chip ${win ? 'chip-green' : 'chip-red'}" style="font-weight:700;letter-spacing:0.04em">🏀 JOUÉ · ${win ? 'Victoire' : 'Défaite'}</span>`
            : `<span class="chip" style="background:rgba(255,107,0,0.14);border-color:var(--orange);color:var(--orange);font-weight:700;letter-spacing:0.04em">${upcoming ? '⏳ À VENIR' : '○ À JOUER'}</span>`}
          <span class="chip">${m.home ? 'Domicile' : 'Extérieur'}</span>
          <span class="chip">${formatDate(m.date, 'long')}</span>
        </div>
        <div class="display-lg" style="margin-bottom:4px">vs ${esc(m.opponent)}</div>
        ${played ? `
          <div style="font-family:'Anton';font-size:64px;line-height:0.9;margin:10px 0;letter-spacing:0.02em;color:${win?'var(--green)':'var(--red)'}">
            ${m.scoreUs}<span style="color:var(--ink-4);margin:0 10px">·</span>${m.scoreOpp}
          </div>
        ` : `
          <!-- Phase E : status to_play → pas de score (0·0), on met en avant le coup d'envoi -->
          <div style="display:flex;gap:22px;margin:12px 0 4px;flex-wrap:wrap">
            <div>
              <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.06em">Coup d'envoi</div>
              <div style="font-family:'Anton';font-size:30px;color:var(--orange);line-height:1">${esc(m.time || '—')}</div>
            </div>
            <div style="min-width:0">
              <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.06em">Lieu</div>
              <div style="font-family:'Anton';font-size:22px;line-height:1.1">${esc(m.place || (m.home ? 'Domicile' : 'Extérieur'))}</div>
            </div>
          </div>
        `}
        ${(isCoach || isStat) ? `
          <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
            ${isStat ? `<button class="btn btn-primary" onclick="startLive('${m.id}')">● Saisir Live</button>` : ''}
            ${isCoach ? `<button class="btn ${m.isLive?'btn-primary':'btn-secondary'}" onclick="editLiveStream('${m.id}')" style="${m.isLive?'background:#ff2222;color:white':''}">${m.isLive?'● Live ON':'Live public'}</button>` : ''}
            ${isCoach ? `<button class="btn btn-secondary" onclick="openPlayerReviewsList('${m.id}')">📝 Ressentis joueuses</button>` : ''}
            ${isCoach ? `<button class="btn btn-secondary" onclick="openExportMenu('${m.id}')">📤 Exporter</button>` : ''}
            ${isCoach ? `<button class="btn btn-secondary" onclick="editMatch('${m.id}')">Modifier</button>` : ''}
            ${isCoach ? `<button class="btn btn-danger" onclick="deleteMatch('${m.id}')">Supprimer</button>` : ''}
          </div>
        ` : ''}
        ${(() => {
          // Joueuse : bouton 'Mon ressenti' toujours visible (même sans stats enregistrées)
          if (state.auth.role !== 'player') return '';
          const myPid = state.auth.playerId;
          const myReview = (m.playerReviews || {})[myPid];
          const filled = !!myReview;
          return `
            <div style="margin-top:14px;padding:14px;background:linear-gradient(135deg,rgba(255,107,0,0.10),var(--surface));border:1.5px solid var(--orange);border-radius:var(--radius)">
              <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
                <span style="font-size:24px">📝</span>
                <div>
                  <div style="font-family:'Anton';font-size:14px;text-transform:uppercase;letter-spacing:0.04em">${filled ? 'Mon ressenti enregistré' : 'Donner mon ressenti'}</div>
                  <div style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:2px;text-transform:uppercase;letter-spacing:0.04em">🔒 Visible uniquement par le coach</div>
                </div>
              </div>
              <button class="btn ${filled ? 'btn-secondary' : 'btn-primary'} btn-block" onclick="openPlayerReview('${m.id}')">
                ${filled ? `✎ Modifier · ${myReview.rating}/5 ⭐` : 'Auto-évaluation + commentaires'}
              </button>
            </div>
          `;
        })()}
      </div>

      ${(() => {
        // Section transport : visible pour les extérieurs non encore joués
        const todayStr = new Date().toISOString().slice(0,10);
        const isFuture = m.date >= todayStr;
        const showTransport = !m.home && isFuture;
        if (!showTransport) return '';

        const transport = m.transport || { drivers: {}, coachDriving: null };
        const drivers = transport.drivers || {};
        const coachDriving = transport.coachDriving;
        const isCoachRole = state.auth.role === 'coach';
        const isPlayerRole = state.auth.role === 'player';
        const myPid = isPlayerRole ? state.auth.playerId : null;
        const roster = getMatchRoster(m);

        // Calculs capacités
        const driverIds = Object.keys(drivers);
        const driverPlayers = roster.filter(p => driverIds.includes(p.id));
        const directIds = (transport.direct || []);
        // Total places joueuses dispo : somme des seats des conductrices + seats du coach si conduit
        const seatsFromPlayers = driverPlayers.reduce((acc, p) => acc + (drivers[p.id].seats || 0), 0);
        const coachSeats = coachDriving ? (coachDriving.seats || 0) : 0;
        const totalSeats = seatsFromPlayers + coachSeats;
        // Joueuses qui ont besoin d'une place : roster - conductrices - direct
        const needsRideIds = roster.filter(p => !driverIds.includes(p.id) && !directIds.includes(p.id)).map(p => p.id);
        const needRideCount = needsRideIds.length;

        // Mon statut (si joueuse)
        let myStatus = null; // 'driver' | 'direct' | 'passenger' | 'undecided'
        let mySeats = 0;
        if (myPid) {
          if (drivers[myPid]) { myStatus = 'driver'; mySeats = drivers[myPid].seats || 0; }
          else if (directIds.includes(myPid)) myStatus = 'direct';
          else myStatus = 'undecided';
        }

        // Compteur saison : nb de fois conductrice
        function countDrove(pid) {
          let n = 0;
          state.matches.forEach(mt => {
            const t = mt.transport || {};
            const d = t.drivers || {};
            if (d[pid]) n++;
          });
          return n;
        }

        return `
          <div class="section-header">
            <div>
              <div class="eyebrow">🚗 Déplacement</div>
              <h2 class="display-md mt-2">Organisation transport</h2>
            </div>
          </div>

          <div style="padding:0 18px 14px">
            <!-- Infos RDV -->
            <div style="padding:12px 14px;background:var(--bg-2);border:1px solid var(--border-soft);border-radius:10px;margin-bottom:10px">
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
                <div>
                  <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.06em;margin-bottom:2px">Match</div>
                  <div style="font-family:'Anton';font-size:16px;color:var(--orange)">${m.time || '?'}</div>
                  ${m.place ? `<div style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:2px;line-height:1.3">${esc(m.place)}</div>` : ''}
                </div>
                <div>
                  <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.06em;margin-bottom:2px">RDV équipe</div>
                  <div style="font-family:'Anton';font-size:16px;color:var(--orange)">${m.rdvTime || '?'}</div>
                  ${m.rdvPlace ? `<div style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:2px;line-height:1.3">${esc(m.rdvPlace)}</div>` : ''}
                </div>

            </div>

            <!-- Capacité globale -->
            <div style="padding:12px 14px;background:linear-gradient(135deg,${totalSeats >= needRideCount ? 'rgba(34,197,94,0.10)' : 'rgba(239,68,68,0.10)'},var(--surface));border:1.5px solid ${totalSeats >= needRideCount ? 'var(--green)' : 'var(--red)'};border-radius:10px;margin-bottom:10px">
              <div style="display:flex;align-items:center;justify-content:space-between">
                <div>
                  <div style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.06em">Places dispo / besoin</div>
                  <div style="font-family:'Anton';font-size:24px;color:${totalSeats >= needRideCount ? 'var(--green)' : 'var(--red)'};margin-top:2px">${totalSeats}<span style="color:var(--ink-4);font-size:16px"> / ${needRideCount}</span></div>
                </div>
                <div style="text-align:right">
                  <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase">Direct</div>
                  <div style="font-family:'Anton';font-size:20px;color:var(--orange)">${directIds.length}</div>
                </div>
              </div>
              ${totalSeats < needRideCount ? `<div style="margin-top:8px;font-size:11px;color:var(--red);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.04em">⚠ Manque ${needRideCount - totalSeats} place${needRideCount - totalSeats > 1 ? 's' : ''}</div>` : (needRideCount === 0 && (driverPlayers.length > 0 || coachDriving) ? '<div style="margin-top:8px;font-size:11px;color:var(--green);font-family:\'JetBrains Mono\';text-transform:uppercase;letter-spacing:0.04em">✓ Toutes les joueuses sont placées</div>' : '')}
            </div>

            <!-- Mon statut (joueuse) -->
            ${myPid ? `
              <div style="padding:14px;background:var(--surface);border:1.5px solid var(--orange);border-radius:10px;margin-bottom:10px">
                <div style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px">Mon transport · saison : conduit ${countDrove(myPid)}x</div>
                ${myStatus === 'driver' ? `
                  <div style="display:flex;align-items:center;gap:10px;padding:10px;background:rgba(34,197,94,0.12);border-radius:8px;margin-bottom:8px">
                    <span style="font-size:24px">🚗</span>
                    <div style="flex:1">
                      <div style="font-family:'Anton';font-size:13px;color:var(--green);text-transform:uppercase">Je conduis</div>
                      <div style="font-size:11px;color:var(--ink-2);font-family:'JetBrains Mono';margin-top:2px;text-transform:uppercase">${mySeats} place${mySeats>1?'s':''} joueuse${mySeats>1?'s':''} en plus de moi</div>
                    </div>
                    <button class="btn btn-icon" onclick="clearMyTransport('${m.id}')" title="Annuler">✕</button>
                  </div>
                ` : myStatus === 'direct' ? `
                  <div style="display:flex;align-items:center;gap:10px;padding:10px;background:rgba(255,107,0,0.12);border-radius:8px;margin-bottom:8px">
                    <span style="font-size:24px">🎯</span>
                    <div style="flex:1">
                      <div style="font-family:'Anton';font-size:13px;color:var(--orange);text-transform:uppercase">Je vais direct</div>
                      <div style="font-size:11px;color:var(--ink-2);font-family:'JetBrains Mono';margin-top:2px;text-transform:uppercase">RDV au gymnase adverse</div>
                    </div>
                    <button class="btn btn-icon" onclick="clearMyTransport('${m.id}')" title="Annuler">✕</button>
                  </div>
                ` : `
                  <div style="display:flex;flex-direction:column;gap:6px">
                    <button class="btn btn-secondary btn-block" onclick="setMyDriver('${m.id}')">🚗 Je peux conduire</button>
                    <button class="btn btn-secondary btn-block" onclick="setMyDirect('${m.id}')">🎯 Je vais directement au gymnase</button>
                  </div>
                `}
              </div>
            ` : ''}

            <!-- Liste conductrices -->
            ${(driverPlayers.length > 0 || coachDriving) ? `
              <div class="eyebrow-muted" style="margin-bottom:6px">🚗 Conductrices · ${driverPlayers.length + (coachDriving ? 1 : 0)}</div>
              <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px">

                ${driverPlayers.map(dp => {

                  const droveCount = countDrove(dp.id);
                  const isMine = myPid === dp.id;
                  return `
                    <div class="transport-row" style="border-left:3px solid var(--green)${isMine ? ';background:rgba(255,107,0,0.06)' : ''}">
                      ${dp.photo ? `<img src="${dp.photo}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--green)">` : `<div style="width:36px;height:36px;border-radius:50%;background:var(--bg-3);display:flex;align-items:center;justify-content:center;font-family:'Anton';font-size:14px;color:var(--green);border:2px solid var(--green)">${esc(dp.name.charAt(0).toUpperCase())}</div>`}
                      <div style="flex:1;min-width:0">
                        <div style="font-family:'Anton';font-size:13px;text-transform:uppercase">${isMine?'⭐ ':''}#${dp.num} ${esc(dp.name)}</div>
                        <div style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:2px;text-transform:uppercase">+ ${seats} place${seats>1?'s':''} · saison ${droveCount}x</div>
                      </div>
                      ${(isCoachRole || isMine) ? `<button class="btn btn-icon" onclick="clearDriver('${m.id}','${dp.id}')" title="Retirer">✕</button>` : ''}
                    </div>
                  `;
                }).join('')}
              </div>
            ` : ''}

            <!-- Joueuses qui vont direct -->
            ${directIds.length > 0 ? `
              <div class="eyebrow-muted" style="margin-bottom:6px">🎯 Vont directement · ${directIds.length}</div>
              <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px">
                ${directIds.map(did => {
                  const dp = state.players.find(x => x.id === did);
                  if (!dp) return '';
                  const isMine = myPid === did;
                  return `
                    <span class="chip" style="background:rgba(255,107,0,0.10);border-color:var(--orange);color:var(--orange)${isMine?';font-weight:700':''}">${isMine?'⭐ ':''}#${dp.num} ${esc(dp.name)}</span>
                  `;
                }).join('')}
              </div>
            ` : ''}

            <!-- Joueuses sans solution -->
            ${needRideCount > 0 ? `
              <div class="eyebrow-muted" style="margin-bottom:6px;color:${totalSeats >= needRideCount ? 'var(--ink-3)' : 'var(--red)'}">${totalSeats >= needRideCount ? '👥 Sans positionnement' : '⚠ Sans positionnement'} · ${needRideCount}</div>
              <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px">
                ${needsRideIds.map(nid => {
                  const dp = state.players.find(x => x.id === nid);
                  if (!dp) return '';

                  return `<span class="chip" style="background:var(--bg-2);border-color:var(--border)${isMine?';color:var(--orange);font-weight:700':''}">${isMine?'⭐ ':''}#${dp.num} ${esc(dp.name)}</span>`;
                }).join('')}
              </div>
            ` : ''}

            <!-- Boutons coach -->
            ${isCoachRole ? `
              <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
                ${!coachDriving ? `<button class="btn btn-secondary" onclick="setCoachDriving('${m.id}')" style="flex:1">🎽 Je conduis aussi</button>` : ''}
                <button class="btn btn-secondary" onclick="openTransportSummary('${m.id}')" style="flex:1">📊 Bilan saison</button>
              </div>
            ` : ''}
          </div>
        `;
      })()}

      ${isToPlay && scoreEntered && isCoach ? `
        <div style="margin:0 18px 12px;padding:12px 14px;background:linear-gradient(135deg,rgba(34,197,94,0.10),var(--surface));border:1.5px solid var(--green);border-radius:10px;display:flex;align-items:center;gap:10px">
          <span style="font-size:20px">🏁</span>
          <div style="flex:1;min-width:0">
            <div style="font-family:'Anton';font-size:13px;text-transform:uppercase;color:var(--green)">Ce match a été joué ?</div>
            <div style="font-size:11px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:2px">Score saisi mais status = à jouer. Bascule pour débloquer points±, stats, selfie.</div>
          </div>
          <button class="btn btn-primary" onclick="markMatchAs('${m.id}','played')">Marquer comme joué</button>
        </div>

      ${isToPlay ? renderMatchPrep(m) : `
        ${isCoach ? `
          <div style="padding:0 18px 6px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
            <button class="btn btn-ghost" onclick="state._showPrepArchive=${showPrepArchive?'null':`'${m.id}'`};render()" style="font-size:11px">
              ${showPrepArchive ? '▲ Masquer la prépa' : '▼ Voir la prépa du match'}
            </button>
            <button class="btn btn-ghost" onclick="markMatchAs('${m.id}','to_play')" style="font-size:11px;color:var(--ink-3)">↶ Repasser en "à jouer"</button>
          </div>
          ${showPrepArchive ? `<div style="opacity:0.85">${renderMatchPrep(m)}</div>` : ''}
        ` : ''}

        ${win || m.winSelfie ? `
          <div class="section-header">
            <div>
              <div class="eyebrow">${win ? 'Trophée' : 'Souvenir'}</div>
              <h2 class="display-md mt-2">${win ? '🏆 Selfie de la victoire' : '📸 Selfie d\'équipe'}</h2>
            </div>
            ${isCoach ? `
              <label class="section-action" style="cursor:pointer">
                ${m.winSelfie ? '✎ Changer' : '+ Ajouter'}
                <input type="file" accept="image/*" style="display:none" onchange="changeWinSelfie('${m.id}', event)">
              </label>
            ` : ''}
          </div>
          ${m.winSelfie ? `
            <div class="win-selfie-wrap">
              <div class="win-selfie-frame" onclick="openImageViewer('${m.id}_winselfie')">
                <img src="${m.winSelfie}" class="win-selfie-img" alt="Selfie victoire">
                ${win ? `<div class="win-selfie-banner">${m.scoreUs} − ${m.scoreOpp} · ${esc(m.opponent)}</div>` : ''}
              </div>

          </div>

function focusItem(matchId, type, p, color, canEdit) {
  return `
    <div style="padding:14px 16px;border-bottom:1px solid var(--border-soft);display:flex;gap:10px">
      <div style="width:3px;background:var(--${color});border-radius:2px;flex-shrink:0"></div>
      <div style="flex:1;min-width:0">
        ${p.minute ? `<div class="chip chip-${color}" style="margin-bottom:6px">Min ${esc(p.minute)}'</div>` : ''}
        <div style="font-size:14px;color:var(--ink);line-height:1.5">${esc(p.text)}</div>
        ${p.images && p.images.length ? `
          <div class="focus-images">
            ${p.images.map((img, i) => `
              <div class="focus-img-thumb" onclick="viewImage('${img.replace(/'/g, "\\'")}')">
                <img src="${img}" alt="">
              </div>
            `).join('')}
          </div>
        ` : ''}
        ${p.videos && p.videos.length ? `
          <div class="focus-images">
            ${p.videos.map(v => {
              const parsed = parseVideo(v.url);
              const thumb = parsed && parsed.thumb ? parsed.thumb : '';
              const startSec = (v.startSec | 0);
              const tsBadge = startSec > 0 ? `<span style="position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,0.75);color:#fff;font-size:9px;padding:1px 4px;border-radius:3px;font-family:'JetBrains Mono'">🎬 ${formatSecToTimestamp(startSec)}</span>` : '';
              const lbl = v.label ? `<div style="font-size:10px;color:var(--ink-2);margin-top:3px;line-height:1.2;text-align:center">${esc(v.label)}</div>` : '';
              const safeUrl = String(v.url).replace(/'/g, "\\'");
              return `
                <div>
                  <div class="focus-img-thumb" onclick="viewFocusVideo('${safeUrl}',${startSec})" style="position:relative">
                    ${thumb ? `<img src="${esc(thumb)}" alt="">` : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:28px">▶</div>`}
                    <span style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,0.75);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px">▶</span>
                    ${tsBadge}
                  </div>
                  ${lbl}
                </div>
              `;
            }).join('')}
          </div>
        ` : ''}
      </div>
      ${canEdit ? `
        <div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0">
          <button class="btn btn-icon" onclick="editFocus('${matchId}','${type}','${p.id}')">✎</button>
          <button class="btn btn-icon" onclick="deleteFocus('${matchId}','${type}','${p.id}')" style="color:var(--red)">🗑</button>
        </div>
      ` : ''}
    </div>
  `;
}

function renderStatsTable(m, stats, canEdit) {
  const playerIds = Object.keys(stats);
  let totals = {};
  STAT_FIELDS.forEach(f => totals[f.key] = 0);
  totals.p2iA = totals.p2eA = totals.p3A = totals.ftA = 0;

  playerIds.forEach(pid => {
    const s = stats[pid];
    Object.keys(totals).forEach(k => totals[k] += (s[k] || 0));
  });
  const pct = (a, b) => b > 0 ? Math.round(100*a/b) : 0;

  // Calc Game Score total
  const totalGS = playerIds.reduce((acc, pid) => acc + gameScore(stats[pid]), 0);
  // Trouver MVP (meilleur GS)
  let mvpPid = null, mvpGS = -Infinity;
  playerIds.forEach(pid => {
    const gs = gameScore(stats[pid]);
    if (gs > mvpGS) { mvpGS = gs; mvpPid = pid; }
  });

  return `
    <table class="stats-table">
      <thead>
        <tr>
          <th>Joueuse</th>
          <th>MIN</th><th>PTS</th><th>CA</th>
          <th>2P INT</th><th>2P EXT</th><th>3PT</th><th>LF</th>
          <th>REB</th><th>PD</th><th>INT</th><th>DEF</th><th>PB</th><th>FT</th>
          <th style="color:var(--orange)">+/−</th>
        </tr>
      </thead>
      <tbody>
        ${playerIds.map(pid => {
          const player = state.players.find(p => p.id === pid);
          if (!player) return '';
          const s = stats[pid];
          const clickHandler = canEdit ? `onclick="addPlayerStat('${m.id}','${pid}')"` : '';
          const gs = gameScore(s);
          const isMVP = pid === mvpPid && mvpGS > 0;
          const myPid = state.auth && state.auth.role === 'player' ? state.auth.playerId : null;
          const isMe = myPid && pid === myPid;
          const hasReview = state.auth.role === 'coach' && m.playerReviews && m.playerReviews[pid];
          return `<tr ${clickHandler} style="${canEdit ? 'cursor:pointer;' : ''}${isMe ? 'background:rgba(255,107,0,0.10);border-left:3px solid var(--orange)' : ''}">
            <td style="font-family:'Anton';font-size:14px;text-transform:uppercase">${isMVP ? '👑 ' : ''}${isMe ? '⭐ ' : ''}${esc(player.name)}${isMe ? ' · TOI' : ''}${hasReview ? ' <span title="A donné son ressenti" style="font-size:11px;opacity:0.8">📝</span>' : ''}</td>
            <td>${s.min||0}'</td>
            <td class="num">${s.pts||0}</td>
            <td style="color:var(--orange)">${s.ca||0}</td>
            <td>${s.p2i||0}/${s.p2iA||0} <span class="pct">${pct(s.p2i, s.p2iA)}%</span></td>
            <td>${s.p2e||0}/${s.p2eA||0} <span class="pct">${pct(s.p2e, s.p2eA)}%</span></td>
            <td>${s.p3||0}/${s.p3A||0} <span class="pct">${pct(s.p3, s.p3A)}%</span></td>
            <td>${s.ft||0}/${s.ftA||0} <span class="pct">${pct(s.ft, s.ftA)}%</span></td>
            <td>${s.reb||0}</td>
            <td>${s.ast||0}</td>
            <td>${s.stl||0}</td>
            <td>${s.def||0}</td>
            <td>${s.to||0}</td>
            <td style="color:${(s.fouls||0)>=4?'var(--red)':'var(--ink)'}">${s.fouls||0}</td>
            <td class="num" style="color:${gs>=15?'var(--green)':gs<5?'var(--red)':'var(--orange)'}">${gs>0?'+':''}${gs.toFixed(1)}</td>
          </tr>`;
        }).join('')}
        <tr class="stats-total-row">
          <td>TOTAL</td>
          <td>${totals.min}'</td>
          <td class="num">${totals.pts}</td>
          <td>${totals.ca||0}</td>
          <td>${totals.p2i}/${totals.p2iA} <span class="pct">${pct(totals.p2i, totals.p2iA)}%</span></td>
          <td>${totals.p2e}/${totals.p2eA} <span class="pct">${pct(totals.p2e, totals.p2eA)}%</span></td>
          <td>${totals.p3}/${totals.p3A} <span class="pct">${pct(totals.p3, totals.p3A)}%</span></td>
          <td>${totals.ft}/${totals.ftA} <span class="pct">${pct(totals.ft, totals.ftA)}%</span></td>
          <td>${totals.reb}</td><td>${totals.ast}</td><td>${totals.stl}</td>
          <td>${totals.def}</td><td>${totals.to}</td><td>${totals.fouls}</td>
          <td class="num" style="color:var(--orange)">${totalGS.toFixed(1)}</td>
        </tr>
      </tbody>
    </table>
    <div style="padding:12px 16px;background:var(--bg-3);font-size:11px;color:var(--ink-3);line-height:1.5;border-top:1px solid var(--border-soft)">
      <strong style="color:var(--orange)">+/−</strong> = Game Score (Hollinger). Pts + 0.7×Reb + 0.4×PD + Int + 0.7×Def − 0.4×TirsRatés − PB − 0.4×Fautes.<br>
      <span style="color:var(--ink-4)">Indicateur de contribution globale. Vert : ≥15 (excellent) · Orange : 5-15 · Rouge : &lt;5</span>
    </div>
  `;
}

    ? { id: uid(), date: new Date().toISOString().slice(0,10), opponent: '', home: true, scoreUs: 0, scoreOpp: 0, notes: '', videoUrl: '', positives: [], negatives: [], playerStats: {}, status: 'to_play', prepVideos: [], prepComment: '' }

    <div class="modal-header">
      <div class="modal-title">${isNew ? 'Nouveau match' : 'Modifier'}</div>
      <button class="modal-close" onclick="closeModal()">✕</button>

      <div class="fld-row">

      </div>

      </div>

          <div class="fld">

    <div class="modal-footer">

function saveMatch(id, isNew) {
  const opp = document.getElementById('m-opp').value.trim();
  if (!opp) return alert('Adversaire requis');
  const existing = isNew ? null : state.matches.find(x => x.id === id);
  const matchTime = document.getElementById('m-time').value || '';
  const home = document.getElementById('m-home').value === 'true';
  let rdvTime = document.getElementById('m-rdv-time').value || '';
  let rdvPlace = document.getElementById('m-rdv-place').value.trim();
  // Auto-fill RDV pour les extérieurs si vide
  if (!home && !rdvTime && matchTime) {
    const [hh, mm] = matchTime.split(':').map(n => parseInt(n));
    let h = hh - 1;
    if (h < 0) h = 0;
    rdvTime = String(h).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
  }

  // Phase 4 : un nouveau match commence en 'to_play'. Sur édition, on
  // bascule auto 'to_play' → 'played' dès qu'un score est saisi (le coach
  // peut toujours forcer 'played' / 'to_play' depuis l'UI prépa).
  const newScoreUs = parseInt(document.getElementById('m-us').value) || 0;
  const newScoreOpp = parseInt(document.getElementById('m-them').value) || 0;
  let nextStatus = existing ? (existing.status || 'to_play') : 'to_play';
  if (nextStatus === 'to_play' && (newScoreUs > 0 || newScoreOpp > 0)) nextStatus = 'played';

  const obj = {
    id, opponent: opp,
    date: document.getElementById('m-date').value,
    home,
    time: matchTime,
    place: document.getElementById('m-place').value.trim(),
    rdvTime,
    rdvPlace,
    scoreUs: newScoreUs,
    scoreOpp: newScoreOpp,
    notes: document.getElementById('m-notes').value.trim(),
    videoUrl: existing ? existing.videoUrl : '',
    positives: existing ? existing.positives : [],
    negatives: existing ? existing.negatives : [],
    playerStats: existing ? existing.playerStats : {},
    transport: existing ? existing.transport : null,
    winSelfie: existing ? existing.winSelfie : undefined,
    roster: existing ? existing.roster : undefined,
    onCourt: existing ? existing.onCourt : undefined,
    playerFeedback: existing ? existing.playerFeedback : undefined,
    playerReviews: existing ? existing.playerReviews : undefined,
    convocId: existing ? existing.convocId : null,
    // Saison : à la création, rattache à la saison courante. À la modif, on
    // préserve le seasonId existant (ne pas écraser même si user a switché
    // de saison en cours d'édition).
    seasonId: existing ? (existing.seasonId || state.currentSeasonId || null) : (state.currentSeasonId || null),
    // Phase 4 — prépa match.
    status: nextStatus,
    prepVideos: existing ? (existing.prepVideos || []) : [],
    prepComment: existing ? (existing.prepComment || '') : '',
  };
  if (isNew) { state.matches.unshift(obj); state.view = { type: 'match', id: obj.id }; }
  else { const i = state.matches.findIndex(x => x.id === id); state.matches[i] = obj; }
  // Synchronisation convocation associée
  syncConvocFromMatch(obj);
  persist(); closeModal(); render();
}

// Crée/met à jour la convocation liée à un match
function syncConvocFromMatch(m) {
  state.convocations = state.convocations || [];
  let convoc = m.convocId ? state.convocations.find(c => c.id === m.convocId) : null;
  // Heure d'événement : RDV si défini, sinon heure du match
  const effectiveTime = m.rdvTime || m.time || '';
  const effectivePlace = m.rdvPlace || m.place || '';
  if (!convoc) {
    // Création
    convoc = {
      id: uid(),
      type: 'match',
      matchId: m.id,
      title: 'vs ' + m.opponent,
      date: m.date,
      time: effectiveTime,
      place: effectivePlace,
      home: m.home,
      notes: m.notes || '',
      responses: {},
      // Saison : hérite du match (la convoc match doit toujours être dans la
      // même saison que son match parent — sinon filtrage incohérent).
      seasonId: m.seasonId || state.currentSeasonId || null,
    };
    state.convocations.unshift(convoc);
    m.convocId = convoc.id;
  } else {
    // Mise à jour des champs synchronisés (on ne touche pas aux responses/callSheet)
    convoc.title = 'vs ' + m.opponent;
    convoc.date = m.date;
    convoc.time = effectiveTime;
    convoc.place = effectivePlace;
    convoc.home = m.home;
    convoc.matchId = m.id;
    // Si le match a un seasonId (et que la convoc n'en a pas encore — legacy),
    // on synchronise. Sinon on préserve l'existant pour ne pas réécrire.
    if (m.seasonId && !convoc.seasonId) convoc.seasonId = m.seasonId;
  }
}

function deleteMatch(id) {
  if (!confirm('Supprimer ce match ?\nLa convocation associée sera aussi supprimée.')) return;
  const m = state.matches.find(x => x.id === id);
  if (m && m.convocId) {
    state.convocations = state.convocations.filter(c => c.id !== m.convocId);
  }
  state.matches = state.matches.filter(x => x.id !== id);
  state.view = null;
  persist(); render();
}

// ============================================================

// Nettoyage : supprime les convocations 'match' orphelines (sans matchId) — appelé au démarrage
function cleanupOrphanMatchConvocs() {
  if (!state.convocations) return;
  const before = state.convocations.length;
  state.convocations = state.convocations.filter(c => {
    if (c.type !== 'match') return true; // garder tout sauf match
    if (c.matchId && state.matches.find(m => m.id === c.matchId)) return true; // garder si liée à un match valide
    return false; // supprimer les orphelines
  });
  // Vérifier l'inverse : matchs avec convocId pointant vers rien → recréer la convoc
  let recreated = 0;
  (state.matches || []).forEach(m => {
    if (m.convocId && !state.convocations.find(c => c.id === m.convocId)) {
      m.convocId = null; // sera recréé au sync
    }
    if (!m.convocId) {
      // Créer la convoc maintenant
      const effectiveTime = m.rdvTime || m.time || '';
      const effectivePlace = m.rdvPlace || m.place || '';
      const convoc = {
        id: uid(),
        type: 'match',
        matchId: m.id,
        title: 'vs ' + (m.opponent || '?'),
        date: m.date,
        time: effectiveTime,
        place: effectivePlace,
        home: m.home,
        notes: m.notes || '',
        responses: {},
        seasonId: m.seasonId || state.currentSeasonId || null,
      };
      state.convocations.unshift(convoc);
      m.convocId = convoc.id;
      recreated++;
    }
  });
  if (state.convocations.length !== before || recreated > 0) {
    persist();
    console.log('[cleanup] convocs match orphelines supprimées :', before - state.convocations.length, '· convocs recréées :', recreated);
  }
}

function ensureTransport(m) {
  if (!m.transport) m.transport = { drivers: {}, coachDriving: null, direct: [] };
  if (!m.transport.drivers) m.transport.drivers = {};
  if (!m.transport.direct) m.transport.direct = [];
}

  // Retirer du direct si elle y était
  m.transport.direct = (m.transport.direct || []).filter(x => x !== pid);
  persist();
  closeModal();
  render();
}

// Joueuse : se déclare 'va direct'
function setMyDirect(matchId) {

  const m = state.matches.find(x => x.id === matchId);
  if (!m) return;
  const pid = state.auth.playerId;
  ensureTransport(m);
  // Retirer des drivers si elle y était
  delete m.transport.drivers[pid];
  if (!m.transport.direct.includes(pid)) m.transport.direct.push(pid);
  persist();
  render();

// Coach : bilan saison transport (qui a conduit combien de fois)
function openTransportSummary(matchId) {
  // SAISON : on calcule les stats sur les matchs ET l'effectif de la saison
  // courante uniquement.
  const stats = currentSeasonPlayers().map(p => {
    let droveCount = 0;
    let directCount = 0;
    let extMatchCount = 0;
    currentSeasonMatches().forEach(mt => {
      if (mt.home) return; // ignore domiciles
      extMatchCount++;
      const t = mt.transport || {};
      if ((t.drivers || {})[p.id]) droveCount++;
      if ((t.direct || []).includes(p.id)) directCount++;
    });
    return { player: p, droveCount, directCount, extMatchCount };
  });
  // Tri : moins conduit en premier (à inciter)
  stats.sort((a,b) => a.droveCount - b.droveCount);

  const totalExtMatches = state.matches.filter(m => !m.home).length;

  openModal(`
    <div class="modal-header">
      <div>
        <div class="eyebrow">${totalExtMatches} match${totalExtMatches>1?'s':''} extérieur${totalExtMatches>1?'s':''}</div>
        <div class="modal-title">📊 Bilan transport saison</div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div style="padding:10px 12px;background:var(--bg-3);border-left:3px solid var(--orange);border-radius:6px;margin-bottom:14px;font-size:11px;color:var(--ink-2);line-height:1.5">
        Joueuses triées de <strong>celles qui ont le moins conduit</strong> à celles qui ont le plus, pour identifier qui solliciter prochainement.
      </div>
      <div style="display:flex;flex-direction:column;gap:4px">
        ${stats.map(x => {
          const ratio = totalExtMatches > 0 ? (x.droveCount / totalExtMatches) : 0;
          const color = ratio === 0 ? 'var(--ink-3)' : ratio < 0.2 ? 'var(--orange)' : ratio < 0.4 ? '#fbbf24' : 'var(--green)';
          return `
            <div class="transport-row">
              ${x.player.photo ? `<img src="${x.player.photo}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;border:1.5px solid var(--border)">` : `<div style="width:32px;height:32px;border-radius:50%;background:var(--bg-3);display:flex;align-items:center;justify-content:center;font-family:'Anton';font-size:12px;color:var(--orange)">${esc(x.player.name.charAt(0).toUpperCase())}</div>`}
              <div style="flex:1;min-width:0">
                <div style="font-family:'Anton';font-size:13px;text-transform:uppercase">#${x.player.num} ${esc(x.player.name)}</div>
                <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:2px;text-transform:uppercase">Direct: ${x.directCount}x</div>
              </div>
              <div style="text-align:right">
                <div style="font-family:'Anton';font-size:20px;color:${color}">${x.droveCount}<span style="font-size:11px;color:var(--ink-4)">x</span></div>
                <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase">A conduit</div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary btn-block" onclick="closeModal()">Fermer</button>
    </div>
  `);
}

// Upload du selfie victoire dans le bucket Supabase Storage 'match-selfies'.
// Avant : on stockait du base64 inline (~150 KB) en localStorage → quota 5 MB
// silencieux + jamais synchronisé cross-device. Maintenant : URL dans
// matches.win_selfie_url, sync via realtime (cf PR #22 pour plays.images).
async function changeWinSelfie(matchId, event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const m = state.matches.find(x => x.id === matchId);
  if (!m) {
    event.target.value = '';
    return alert('Match introuvable');
  }
  if (!window.sb || !window.Pb || !window.Pb.online) {
    event.target.value = '';
    return alert('⚠ Hors ligne. Reconnecte-toi pour ajouter une photo.');
  }
  const previousSelfie = m.winSelfie;
  try {
    // Compression conservative : maxDim 1000 + quality 0.78 → ~120-180 KB en Blob.
    const blob = await compressImageBlob(file, 1000, 0.78);
    const path = `${matchId}-${Date.now()}.jpg`;
    const { error: upErr } = await sb.storage.from('match-selfies').upload(path, blob, {
      contentType: 'image/jpeg', cacheControl: '31536000', upsert: false
    });
    if (upErr) throw upErr;
    const { data: pub } = sb.storage.from('match-selfies').getPublicUrl(path);
    const url = pub && pub.publicUrl;
    if (!url) throw new Error('publicUrl manquante');
    // Best-effort : si l'ancienne valeur était déjà une URL bucket, on supprime
    // l'orphelin côté serveur pour ne pas accumuler. Swallow erreur.
    const oldKey = _extractMatchSelfieKey(previousSelfie);
    if (oldKey) sb.storage.from('match-selfies').remove([oldKey]).catch(() => {});
    m.winSelfie = url;
    persist();
    render();
  } catch (e) {
    console.error('[changeWinSelfie]', e);
    m.winSelfie = previousSelfie; // rollback mémoire si upload échoue
    alert('⚠ Erreur upload selfie : ' + (e && e.message ? e.message : e));
  } finally {
    event.target.value = ''; // permet de re-uploader le même fichier
  }
}

function removeWinSelfie(matchId) {
  const m = state.matches.find(x => x.id === matchId);
  if (!m) return;
  if (!confirm('Retirer la photo de victoire ?')) return;
  const previous = m.winSelfie;
  delete m.winSelfie;
  persist();
  render();
  // Best-effort : delete du fichier serveur. Ne bloque pas l'UI, log si KO.
  const key = _extractMatchSelfieKey(previous);
  if (key && window.sb) {
    sb.storage.from('match-selfies').remove([key]).catch(e => {
      console.warn('[removeWinSelfie] storage cleanup:', e && e.message ? e.message : e);
    });
  }
}

// Extrait la clé fichier d'une URL publique du bucket match-selfies, pour
// pouvoir appeler storage.remove(). Renvoie null si l'URL n'est pas du bucket
// (ex: ancien base64 data:, URL externe, undefined).
function _extractMatchSelfieKey(url) {
  if (typeof url !== 'string' || !url.includes('/match-selfies/')) return null;
  const m = url.match(/\/match-selfies\/(.+?)(?:\?|$)/);
  return m && m[1] ? decodeURIComponent(m[1]) : null;
}

// Migration one-shot des selfies legacy base64 (vivant en localStorage) vers
// le bucket Storage. Gate par flag pb8_selfie_migration_done pour pas refaire
// à chaque reload. Coach uniquement (les joueuses ne voient/éditent pas les
// selfies victoire). Si une upload échoue, on log et on continue : le flag
// est posé même en cas d'échec partiel pour pas spammer ; pour retry,
// supprimer la clé localStorage manuellement.
async function migrateLocalSelfiesToStorage() {
  if (!window.sb || !window.Pb || !window.Pb.online) return;
  if (!state.auth || state.auth.role !== 'coach') return;
  if (localStorage.getItem('pb8_selfie_migration_done') === '1') return;
  const candidates = (state.matches || []).filter(m =>
    typeof m.winSelfie === 'string' && m.winSelfie.startsWith('data:')
  );
  if (!candidates.length) {
    localStorage.setItem('pb8_selfie_migration_done', '1');
    return;
  }
  console.info(`[selfie-migration] ${candidates.length} selfie(s) legacy à migrer vers Storage`);
  let migrated = 0;
  for (const m of candidates) {
    try {
      const blob = await (await fetch(m.winSelfie)).blob();
      const path = `${m.id}-${Date.now()}.jpg`;
      const { error: upErr } = await sb.storage.from('match-selfies').upload(path, blob, {
        contentType: 'image/jpeg', cacheControl: '31536000', upsert: false
      });
      if (upErr) throw upErr;
      const { data: pub } = sb.storage.from('match-selfies').getPublicUrl(path);
      const url = pub && pub.publicUrl;
      if (!url) throw new Error('publicUrl manquante');
      m.winSelfie = url;
      migrated++;
    } catch (e) {
      console.warn('[selfie-migration] match', m.id, ':', e && e.message ? e.message : e);
    }
  }
  if (migrated > 0) {
    persist(); // déclenche PbSync.schedule → push win_selfie_url en DB
    render();
    console.info(`[selfie-migration] ${migrated}/${candidates.length} selfie(s) migré(s)`);
  }
  localStorage.setItem('pb8_selfie_migration_done', '1');
}

function setLiveStatus(matchId, on) {
  const m = state.matches.find(x => x.id === matchId);
  if (!m) return;
  if (on) {
    // Désactiver tout autre live actif
    state.matches.forEach(x => { if (x.id !== matchId) x.isLive = false; });
  }
  m.isLive = on;
  persist();
  editLiveStream(matchId);
}
function saveLiveStream(matchId) {
  const m = state.matches.find(x => x.id === matchId);
  if (!m) return;
  m.liveStreamUrl = document.getElementById('ls-url').value.trim();
  persist(); closeModal(); render();
}
function copyPublicUrl() {
  const inp = document.getElementById('ls-public-url');
  inp.select();
  try {
    navigator.clipboard.writeText(inp.value);
    const btn = event.target;
    const original = btn.textContent;
    btn.textContent = '✓ Copié';
    setTimeout(() => { btn.textContent = original; }, 1500);
  } catch {
    document.execCommand('copy');
  }
}

// FOCUS POINTS avec images
function addFocus(matchId, type) { openFocusModal(matchId, type, null); }
function editFocus(matchId, type, focusId) { openFocusModal(matchId, type, focusId); }
function openFocusModal(matchId, type, focusId) {
  const m = state.matches.find(x => x.id === matchId);
  m[type] = m[type] || [];
  const isNew = !focusId;
  const f = isNew ? { id: uid(), text: '', minute: '', images: [], videos: [] } : m[type].find(x => x.id === focusId);
  if (!f) return;
  f.images = f.images || [];
  f.videos = f.videos || [];

  // Stocker temporairement les images + vidéos dans state pour les manipuler
  state._focusImages = [...f.images];
  state._focusVideos = f.videos.map(v => ({ ...v }));

  renderFocusModal(matchId, type, f.id, isNew);
}

function renderFocusModal(matchId, type, focusId, isNew) {
  const m = state.matches.find(x => x.id === matchId);
  const f = isNew ? { text: '', minute: '' } : m[type].find(x => x.id === focusId);
  const images = state._focusImages || [];
  const videos = state._focusVideos || [];
  const videosMax = videos.length >= 3;

  openModal(`
    <div class="modal-header">
      <div class="modal-title">${type === 'positives' ? '✓ Point positif' : '✕ À corriger'}</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="fld"><label class="fld-label">Minute (optionnel)</label><input id="fo-min" value="${esc(f.minute || '')}" placeholder="24"></div>
      <div class="fld"><label class="fld-label">Commentaire</label><textarea id="fo-text" placeholder="Décris le point...">${esc(f.text || '')}</textarea></div>
      <div class="fld">
        <label class="fld-label">Images / Photos d'écran</label>
        <div class="focus-images">
          ${images.map((img, i) => `

// ===== Vidéos liées (focus positives/negatives) =====
// Parse "mm:ss" ou "h:mm:ss" ou "Xs"/"XmYs" en secondes. Retourne 0 si vide/invalide.
function parseTimestampToSec(input) {
  if (!input) return 0;
  const raw = String(input).trim();
  if (!raw) return 0;
  if (/^\d+$/.test(raw)) return parseInt(raw, 10);
  // Format h:mm:ss ou mm:ss
  const colon = raw.match(/^(?:(\d+):)?(\d+):(\d+)$/);
  if (colon) {
    const h = (colon[1] | 0), mn = (colon[2] | 0), s = (colon[3] | 0);
    return h * 3600 + mn * 60 + s;
  }
  // Format "1h2m3s" / "2m30s" / "90s"
  const h = (raw.match(/(\d+)h/i) || [])[1] | 0;
  const mn = (raw.match(/(\d+)m(?!s)/i) || [])[1] | 0;
  const s = (raw.match(/(\d+)s/i) || [])[1] | 0;
  const tot = h * 3600 + mn * 60 + s;
  return tot > 0 ? tot : 0;
}
function formatSecToTimestamp(sec) {
  sec = sec | 0;
  if (sec <= 0) return '';
  const h = Math.floor(sec / 3600);
  const mn = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  if (h > 0) return `${h}:${String(mn).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  return `${mn}:${String(s).padStart(2, '0')}`;
}
function addFocusVideo(matchId, type, focusId, isNew) {
  const urlEl = document.getElementById('fo-vid-url');
  const tsEl = document.getElementById('fo-vid-ts');
  const lblEl = document.getElementById('fo-vid-label');
  const url = (urlEl.value || '').trim();
  if (!url) return alert('URL YouTube requise');
  const parsed = parseVideo(url);
  if (!parsed || parsed.provider !== 'youtube') return alert('URL YouTube invalide');
  state._focusVideos = state._focusVideos || [];
  if (state._focusVideos.length >= 3) return alert('Maximum 3 vidéos par point');
  const startSec = parseTimestampToSec(tsEl.value) || parsed.startSec || 0;
  const label = (lblEl.value || '').trim();
  const item = { url };
  if (label) item.label = label;
  if (startSec > 0) item.startSec = startSec;
  state._focusVideos.push(item);
  renderFocusModal(matchId, type, focusId, isNew);
}
function removeFocusVideo(idx, matchId, type, focusId, isNew) {
  state._focusVideos = state._focusVideos || [];
  state._focusVideos.splice(idx, 1);
  renderFocusModal(matchId, type, focusId, isNew);
}
// Ouvre une vidéo focus en plein écran (iframe avec start=N appliqué)
function viewFocusVideo(url, startSec) {
  const parsed = parseVideo(url);
  if (!parsed) return;
  let embed = parsed.embed;
  if (startSec > 0 && !/[?&]start=/.test(embed)) {
    embed += (embed.includes('?') ? '&' : '?') + 'start=' + (startSec | 0);
  }
  // Autoplay pour ouvrir directement la vidéo (lightbox = user gesture).
  embed += (embed.includes('?') ? '&' : '?') + 'autoplay=1';
  let root = document.getElementById('modal-root');
  if (!root) { root = document.createElement('div'); root.id = 'modal-root'; document.body.appendChild(root); }
  root.innerHTML = `
    <div class="img-viewer" onclick="closeModal()">
      <button class="img-viewer-close" onclick="event.stopPropagation();closeModal()">✕</button>
      <div onclick="event.stopPropagation()" style="width:min(100%,960px);aspect-ratio:16/9;max-height:90vh">
        <iframe src="${esc(embed)}" allowfullscreen
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          style="width:100%;height:100%;border:0;border-radius:8px;background:#000"></iframe>
      </div>
    </div>
  `;
  document.body.style.overflow = 'hidden';
}

// PRÉPA MATCH (Phase 4)
// Plays liés (state.matchPlayLinks), vidéos prépa (m.prepVideos),
// notes coach (m.prepComment). UI réservée au coach. Bascule
// to_play / played via markMatchAs(...).
// ============================================================
function getMatchPlayLinks(matchId) {
  return (state.matchPlayLinks || [])
    .filter(lk => lk.matchId === matchId)
    .sort((a, b) => (a.position | 0) - (b.position | 0));
}
function addPlayToMatch(matchId, playId, coachNote) {
  state.matchPlayLinks = state.matchPlayLinks || [];
  if (state.matchPlayLinks.some(lk => lk.matchId === matchId && lk.playId === playId)) return;
  const existing = getMatchPlayLinks(matchId);
  const nextPos = existing.length ? (existing[existing.length - 1].position | 0) + 1 : 0;
  state.matchPlayLinks.push({
    matchId, playId,
    position: nextPos,
    coachNote: coachNote || '',
    createdAt: Date.now()
  });
  persist();
}
function removePlayFromMatch(matchId, playId) {
  state.matchPlayLinks = (state.matchPlayLinks || []).filter(lk => !(lk.matchId === matchId && lk.playId === playId));
  // Recompacte les positions pour éviter trous (utile pour reorder ultérieur)
  const remaining = getMatchPlayLinks(matchId);
  remaining.forEach((lk, i) => { lk.position = i; });
  persist();
}
function updatePlayLinkNote(matchId, playId, note) {
  const lk = (state.matchPlayLinks || []).find(x => x.matchId === matchId && x.playId === playId);
  if (!lk) return;
  lk.coachNote = note || '';
  persist();
}
function movePlayLink(matchId, playId, dir) {
  // dir = -1 (up) ou +1 (down). On bouge en swappant les positions.
  const list = getMatchPlayLinks(matchId);
  const idx = list.findIndex(lk => lk.playId === playId);
  const swapIdx = idx + dir;
  if (idx < 0 || swapIdx < 0 || swapIdx >= list.length) return;
  const a = list[idx], b = list[swapIdx];
  const tmp = a.position; a.position = b.position; b.position = tmp;
  persist(); render();
}

function renderMatchPlayPicker() {
  const ctx = state._matchPlayPicker;
  if (!ctx) return;
  const filter = ctx.filter;
  const linkedIds = new Set(getMatchPlayLinks(ctx.matchId).map(lk => lk.playId));
  let filtered = [...(state.plays || [])];
  if (filter.cat !== 'all') filtered = filtered.filter(p => p.cat === filter.cat);
  if (filter.concept) filtered = filtered.filter(p => (p.concepts || []).includes(filter.concept));
  if (filter.search) {
    const q = filter.search.toLowerCase();
    filtered = filtered.filter(p =>
      (p.title || '').toLowerCase().includes(q) ||
      (p.desc || '').toLowerCase().includes(q) ||
      (p.tags || []).some(t => t.toLowerCase().includes(q))
    );
  }
  const usedConcepts = new Set();
  (state.plays || []).forEach(p => (p.concepts || []).forEach(c => usedConcepts.add(c)));
  const conceptList = [...usedConcepts].sort();

  openModal(`

        <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px">

// PLAYER STATS
function addPlayerStat(matchId, playerId) {
  const m = state.matches.find(x => x.id === matchId);
  m.playerStats = m.playerStats || {};
  const isNew = !playerId;
  const existing = playerId ? m.playerStats[playerId] : null;
  // En stockage, p2i/p2iA incluent les contre-attaques (cohérent avec
  // liveActionFor + savePlayerStat). Pour l'affichage du formulaire,
  // on inverse le merge : l'user voit p2i SANS la part ca dans son champ
  // dédié. La sauvegarde re-merge automatiquement.
  const _src = existing || { min: 0, pts: 0, p2i: 0, p2iA: 0, p2e: 0, p2eA: 0, p3: 0, p3A: 0, ft: 0, ftA: 0, reb: 0, ast: 0, stl: 0, def: 0, to: 0, fouls: 0 };
  const _ca = _src.ca || 0;
  const s = {
    ..._src,
    p2i:  Math.max(0, (_src.p2i  || 0) - _ca),
    p2iA: Math.max(0, (_src.p2iA || 0) - _ca),
  };
  // SAISON : on propose les joueuses de la saison du match (ou de la saison
  // courante en fallback). m.playerStats peut déjà contenir une joueuse
  // partie : la condition `p.id === playerId` (édition d'une row existante)
  // est traitée à part. Pour la création (isNew), on liste uniquement les
  // joueuses encore actives sur la saison.
  const _matchSeasonId = m.seasonId || state.currentSeasonId;
  const _matchPool = _seasonsLoaded() && _matchSeasonId
    ? getSeasonPlayers(_matchSeasonId)
    : (state.players || []);
  const available = _matchPool.filter(p => !m.playerStats[p.id] || p.id === playerId);
  const playerName = playerId ? (state.players.find(p => p.id === playerId) || {}).name : '';

  openModal(`
    <div class="modal-header">
      <div class="modal-title">${isNew ? 'Stats joueuse' : esc(playerName)}</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      ${isNew ? `
        <div class="fld"><label class="fld-label">Joueuse</label>
          <select id="ps-pid">${available.map(p => `<option value="${p.id}">#${p.num} ${esc(p.name)}</option>`).join('')}</select>
        </div>
      ` : `<input type="hidden" id="ps-pid" value="${playerId}">`}

      <div class="fld-row">
        <div class="fld"><label class="fld-label">Minutes</label><input id="ps-min" type="number" value="${s.min}" min="0"></div>
        <div class="fld"><label class="fld-label">Fautes</label><input id="ps-fouls" type="number" value="${s.fouls}" min="0" max="5"></div>
      </div>

      <div class="fld-label" style="margin-top:6px">2 pts intérieurs sur attaque placée (R / T)</div>
      <div class="fld-row">
        <div class="fld"><input id="ps-p2i" type="number" value="${s.p2i}" min="0" placeholder="R"></div>
        <div class="fld"><input id="ps-p2iA" type="number" value="${s.p2iA}" min="0" placeholder="T"></div>
      </div>
      <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';margin:-6px 0 6px;line-height:1.4">Hors contre-attaque (champ dédié plus bas).</div>
      <div class="fld-label">2 pts extérieurs / mid-range</div>
      <div class="fld-row">
        <div class="fld"><input id="ps-p2e" type="number" value="${s.p2e}" min="0" placeholder="R"></div>
        <div class="fld"><input id="ps-p2eA" type="number" value="${s.p2eA}" min="0" placeholder="T"></div>
      </div>
      <div class="fld-label">3 points</div>
      <div class="fld-row">
        <div class="fld"><input id="ps-p3" type="number" value="${s.p3}" min="0" placeholder="R"></div>
        <div class="fld"><input id="ps-p3A" type="number" value="${s.p3A}" min="0" placeholder="T"></div>
      </div>
      <div class="fld-label">Lancers francs</div>
      <div class="fld-row">
        <div class="fld"><input id="ps-ft" type="number" value="${s.ft}" min="0" placeholder="R"></div>
        <div class="fld"><input id="ps-ftA" type="number" value="${s.ftA}" min="0" placeholder="T"></div>
      </div>

      <div class="fld-label" style="margin-top:6px">Autres stats</div>
      <div class="fld-row">
        <div class="fld"><label class="fld-label">Rebonds</label><input id="ps-reb" type="number" value="${s.reb||0}" min="0"></div>
        <div class="fld"><label class="fld-label">Passes déc.</label><input id="ps-ast" type="number" value="${s.ast||0}" min="0"></div>
      </div>
      <div class="fld-row">
        <div class="fld"><label class="fld-label">Interceptions</label><input id="ps-stl" type="number" value="${s.stl||0}" min="0"></div>
        <div class="fld"><label class="fld-label">Déflexions</label><input id="ps-def" type="number" value="${s.def||0}" min="0"></div>
      </div>
      <div class="fld-row">
        <div class="fld"><label class="fld-label">Pertes de balle</label><input id="ps-to" type="number" value="${s.to||0}" min="0"></div>
        <div class="fld"><label class="fld-label">Contre-attaques ✓</label><input id="ps-ca" type="number" value="${s.ca||0}" min="0"></div>
      </div>
      <div style="font-size:9px;color:var(--ink-3);font-family:'JetBrains Mono';margin:-6px 0 4px;line-height:1.4">Paniers en contre-attaque (auto-ajoutés aux 2pts INT + au total points).</div>
    </div>
    <div class="modal-footer">
      ${!isNew ? `<button class="btn btn-danger" onclick="deletePlayerStat('${matchId}','${playerId}')">Supprimer</button>` : ''}
      <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="savePlayerStat('${matchId}',${isNew})">Enregistrer</button>

function savePlayerStat(matchId, isNew) {
  const m = state.matches.find(x => x.id === matchId);
  const pid = document.getElementById('ps-pid').value;
  if (!pid) return alert('Joueuse requise');
  const g = id => parseInt(document.getElementById(id).value) || 0;
  // Champs bruts du formulaire (p2i ici = 2pts INT en attaque placée,
  // hors contre-attaque ; ca = contre-attaques marquées, en plus)
  const formP2i  = g('ps-p2i'),  formP2iA = g('ps-p2iA');
  const formP2e  = g('ps-p2e'),  formP2eA = g('ps-p2eA');
  const formP3   = g('ps-p3'),   formP3A  = g('ps-p3A');
  const formFt   = g('ps-ft'),   formFtA  = g('ps-ftA');
  const formCa   = g('ps-ca');
  // Contre-attaque = panier 2pts INT marqué. On la merge dans p2i/p2iA
  // pour rester cohérent avec le live tracker (liveActionFor incrémente
  // p2i + p2iA quand CA est tappée) et avec la perception basket :
  // un panier en contre-attaque EST un panier 2pts intérieur réussi.
  const p2i  = formP2i  + formCa;
  const p2iA = formP2iA + formCa;
  const p2e = formP2e, p2eA = formP2eA;
  const p3  = formP3,  p3A  = formP3A;
  const ft  = formFt,  ftA  = formFtA;
  const pts = (p2i + p2e) * 2 + p3 * 3 + ft;
  m.playerStats = m.playerStats || {};
  m.playerStats[pid] = {
    min: g('ps-min'), pts, fouls: g('ps-fouls'),
    p2i, p2iA, p2e, p2eA, p3, p3A, ft, ftA,
    reb: g('ps-reb'), ast: g('ps-ast'), stl: g('ps-stl'), def: g('ps-def'), to: g('ps-to'),
    ca: formCa,
  };
  persist(); closeModal(); render();
}
function deletePlayerStat(matchId, pid) {
  if (!confirm('Supprimer ces stats ?')) return;
  const m = state.matches.find(x => x.id === matchId);
  delete m.playerStats[pid];
  persist(); closeModal(); render();
}
