<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Playbook BCL</title>
<meta name="description" content="Playbook BCL — IE-Basket Club l'Islois : plays, matchs, convocations, stats.">
<meta name="theme-color" content="#000000">
<meta name="background-color" content="#000000">
<meta name="color-scheme" content="dark">
<!-- PWA manifest -->
<link rel="manifest" href="/manifest.json">
<!-- iOS / Safari standalone -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Playbook BCL">
<!-- Android Chrome -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Playbook BCL">
<!-- Icons -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --bg-1: #0a0a0a;
    --bg-2: #141414;
    --bg-3: #1c1c1c;
    --surface: #181818;
    --surface-2: #222222;
    --border: #2a2a2a;
    --border-soft: #1f1f1f;
    --ink: #ffffff;
    --ink-2: #b8b8b8;
    --ink-3: #707070;
    --ink-4: #4a4a4a;

    --orange: #ff6b00;
    --orange-2: #ff8533;
    --orange-soft: rgba(255, 107, 0, 0.12);
    --orange-glow: rgba(255, 107, 0, 0.3);

    --green: #22c55e;
    --green-soft: rgba(34, 197, 94, 0.12);
    --red: #ef4444;
    --red-soft: rgba(239, 68, 68, 0.12);
    --blue: #3b82f6;
    --blue-soft: rgba(59, 130, 246, 0.12);
    --yellow: #eab308;
    --yellow-soft: rgba(234, 179, 8, 0.12);
    --purple: #a855f7;
    --purple-soft: rgba(168, 85, 247, 0.12);

    --radius: 10px;
    --radius-sm: 6px;
    --radius-lg: 16px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  html { background: #000000; }
  body { min-height: 100dvh; }
  .font-display { font-family: 'Anton', sans-serif; letter-spacing: 0.01em; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }

  /* ========== APP SHELL ========== */
  .app {
    max-width: 480px; margin: 0 auto;
    min-height: 100vh; min-height: 100dvh;
    background: var(--bg);
    padding-bottom: calc(72px + env(safe-area-inset-bottom));
    overflow-x: hidden;
    /* Empêche le scroll de "dépasser" le footer (rebond iOS + zone vide) */
    overscroll-behavior: contain;
  }
  @media (min-width: 768px) {
    .app { max-width: 560px; border-left: 1px solid var(--border); border-right: 1px solid var(--border); min-height: 100vh; min-height: 100dvh; }
  }
  /* Sécurité : pas de scroll horizontal global */
  body { overflow-x: hidden; }
  /* Spacer final pour garantir que la dernière section reste visible au-dessus du footer */
  main::after {
    content: '';
    display: block;
    height: 8px;
  }

  /* ========== TOP BAR ========== */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    padding: 14px 18px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border-soft);
  }
  .topbar-logo {
    display: flex; align-items: center; gap: 10px;
  }
  .topbar-orb {
    width: 32px; height: 32px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ff8533, var(--orange));
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    box-shadow: 0 0 16px var(--orange-glow);
  }
  .topbar-title {
    font-family: 'Anton', sans-serif;
    font-size: 18px; letter-spacing: 0.04em;
  }
  .topbar-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; color: var(--orange);
    text-transform: uppercase; letter-spacing: 0.18em;
    margin-top: -2px;
  }
  .role-badge {
    padding: 4px 8px; border-radius: 999px;
    background: var(--orange-soft); color: var(--orange);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em;
    font-weight: 700;
    border: 1px solid rgba(255, 107, 0, 0.3);
  }

  /* ========== BOTTOM NAV ========== */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
    background: rgba(0, 0, 0, 0.92);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: 1px solid var(--border);
    padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
    display: flex; justify-content: space-around;
  }
  @media (min-width: 768px) {
    .bottom-nav {
      max-width: 560px; left: 50%; transform: translateX(-50%);
      border-left: 1px solid var(--border); border-right: 1px solid var(--border);
    }
  }
  .nav-btn {
    flex: 1; min-width: 0; background: none; border: none;
    padding: 8px 4px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    color: var(--ink-3); transition: color 0.15s;
  }
  .nav-btn:active { color: var(--ink-2); }
  .nav-btn.active { color: var(--orange); }
  .nav-btn-icon {
    font-size: 20px; line-height: 1;
    font-family: 'Anton', sans-serif;
  }
  .nav-btn-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em;
  }

  /* ========== TYPOGRAPHY ========== */
  .display-xl {
    font-family: 'Anton', sans-serif;
    font-size: 48px; line-height: 0.95;
    letter-spacing: 0.005em;
    text-transform: uppercase;
  }
  .display-lg {
    font-family: 'Anton', sans-serif;
    font-size: 32px; line-height: 1;
    text-transform: uppercase;
  }
  .display-md {
    font-family: 'Anton', sans-serif;
    font-size: 22px; line-height: 1;
    text-transform: uppercase;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.15em; color: var(--orange);
    font-weight: 600;
  }
  .eyebrow-muted {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--ink-3);
    font-weight: 500;
  }

  /* ========== SECTION HEADERS ========== */
  .section-header {
    padding: 20px 18px 10px;
    display: flex; align-items: end; justify-content: space-between;
    gap: 12px;
  }
  .section-action {
    background: none; border: none; color: var(--orange);
    font-size: 12px; font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase; letter-spacing: 0.1em;
    cursor: pointer; padding: 4px 0;
  }
  .section-action:active { opacity: 0.6; }

  /* ========== CARDS ========== */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
    transition: all 0.15s; cursor: pointer;
  }
  .card:active { transform: scale(0.98); }

  /* HERO CARD (next event) */
  .hero-card {
    margin: 0 18px 14px;
    background: linear-gradient(135deg, var(--orange) 0%, #cc5500 100%);
    color: white;
    border-radius: var(--radius-lg);
    padding: 22px 20px;
    position: relative; overflow: hidden;
    cursor: pointer;
  }
  .hero-card::before {
    content: ''; position: absolute;
    inset: 0;
    background: radial-gradient(circle at top right, rgba(255,255,255,0.15), transparent 50%);
    pointer-events: none;
  }
  .hero-card::after {
    content: '🏀'; position: absolute;
    right: -30px; bottom: -30px;
    font-size: 180px; opacity: 0.08;
    transform: rotate(-15deg);
  }
  .hero-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.15em; color: rgba(255,255,255,0.85);
    margin-bottom: 8px; font-weight: 700;
  }
  .hero-title {
    font-family: 'Anton', sans-serif;
    font-size: 30px; line-height: 1; text-transform: uppercase;
    letter-spacing: 0.01em; margin-bottom: 14px;
    position: relative;
  }
  .hero-meta {
    display: flex; gap: 14px; flex-wrap: wrap;
    font-size: 12px; color: rgba(255,255,255,0.95);
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase; letter-spacing: 0.05em;
    position: relative;
  }
  .hero-cta {
    margin-top: 16px; padding: 11px 16px;
    background: black; color: white;
    border-radius: 8px; font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
    border: none; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    position: relative;
  }

  /* SCROLL ROW (horizontal) */
  .scroll-row {
    display: flex; gap: 10px; padding: 0 18px 4px;
    overflow-x: auto; scrollbar-width: none;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
  }
  .scroll-row::-webkit-scrollbar { display: none; }
  .scroll-row > * { scroll-snap-align: start; flex-shrink: 0; }

  /* VIDEO TILE */
  .v-tile {
    width: 138px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
    cursor: pointer; transition: transform 0.15s, border-color 0.15s;
  }
  /* Dans un carousel : largeur ~1 tile de moins qu'une grille Plays 2 cols pour effet "peek" cohérent */
  .scroll-row .v-tile { width: 138px; }
  @media (min-width: 768px) {
    .scroll-row .v-tile { width: 150px; }
  }
  /* Dans la grille Plays : 2/3/4 cols responsive, géré par grid-template-columns */
  .plays-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    padding: 0 18px;
  }
  @media (min-width: 600px) { .plays-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 900px) { .plays-grid { grid-template-columns: repeat(4, 1fr); } }
  .plays-grid .v-tile { width: 100%; }
  .v-tile:active { transform: scale(0.96); }
  .v-tile-media {
    aspect-ratio: 9/16;
    background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  /* Thumbnails dans tuiles : pas interactifs (juste preview) */
  .v-tile-media iframe, .v-tile-media video, .v-tile-media img {
    width: 100%; height: 100%; border: 0;
    object-fit: cover; pointer-events: none;
  }
  /* Lecteur vidéo : iframe embed propre */
  .video-wrap {
    padding: 0 18px;
    margin-bottom: 14px;
  }
  .video-player {
    position: relative;
    width: 100%;
    background: #000;
    border-radius: var(--radius);
    overflow: hidden;
  }
  .video-player.horizontal {
    aspect-ratio: 16 / 9;
  }
  .video-player.vertical {
    aspect-ratio: 9 / 16;
    max-width: 320px;
    margin: 0 auto;
  }
  .video-player iframe,
  .video-player video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
  .video-open-link {
    display: block;
    text-align: center;
    margin-top: 8px;
    padding: 8px 12px;
    color: var(--ink-3);
    text-decoration: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border: 1px solid var(--border);
    border-radius: 6px;
    transition: all 0.15s;
  }
  .video-open-link:active,
  .video-open-link:hover {
    color: var(--orange);
    border-color: var(--orange);
  }
  .v-tile-media-emoji {
    font-family: 'Anton', sans-serif;
    font-size: 48px; color: var(--ink-4);
  }
  .v-tile-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 18px 12px;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(255,107,0,0.06), var(--bg-2));
    text-align: center;
  }
  .v-tile-placeholder-icon {
    font-size: 36px;
    line-height: 1;
    opacity: 0.85;
  }
  .v-tile-placeholder-tags {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    line-height: 1.4;
    max-width: 90%;
  }

  /* === V8: Plan d'entraînement === */
  .training-exo-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    transition: all 0.15s;
  }
  .training-exo-row:hover { border-color: var(--orange); }
  .training-exo-handle {
    color: var(--ink-3);
    font-size: 18px;
    line-height: 1;
    cursor: grab;
    padding: 0 4px;
    user-select: none;
  }
  .training-exo-num {
    font-family: 'Anton', sans-serif;
    font-size: 18px;
    color: var(--orange);
    min-width: 24px;
    text-align: center;
  }
  .training-exo-info {
    flex: 1;
    min-width: 0;
    cursor: pointer;
  }
  /* Picker plays (depuis bibliothèque) */
  .picker-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--bg-2);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .picker-row:active { transform: scale(0.99); }
  .picker-row:hover { border-color: var(--orange); }
  /* Carte groupe dans détail exo */
  .group-card {
    padding: 10px 12px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  /* Chip joueuse (non assignée) */
  .player-chip {
    background: var(--bg-1);
    border: 1px solid var(--border);
    color: var(--ink-2);
    border-radius: 12px;
    padding: 4px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    cursor: pointer;
  }
  .player-chip:active { transform: scale(0.94); }
  .player-chip:hover { border-color: var(--orange); color: var(--orange); }
  /* Chip joueuse assignée à un groupe */
  .player-chip-assigned {
    background: rgba(255,107,0,0.15);
    border: 1px solid var(--orange);
    color: var(--orange);
    border-radius: 12px;
    padding: 4px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    cursor: pointer;
  }
  .player-chip-assigned:active { transform: scale(0.94); }
  /* Côté joueuse : exo à cocher */
  .player-exo-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 14px;
    background: var(--bg-2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .player-exo-row:active { transform: scale(0.99); }
  .player-exo-row.done {
    background: rgba(34,197,94,0.06);
    border-color: rgba(34,197,94,0.3);
  }
  /* === V8: Concept chips === */
  .concept-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 10px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    color: var(--ink-2);
    border-radius: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.12s;
  }
  .concept-chip:active { transform: scale(0.96); }
  .concept-chip.selected {
    background: color-mix(in srgb, var(--color, var(--orange)) 15%, var(--bg-2));
    border-color: var(--color, var(--orange));
    color: var(--color, var(--orange));
  }
  /* === V8: Galerie play (carrousel) === */
  .play-gallery {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    margin: 0 0 8px;
    padding: 0 18px;
  }
  .play-gallery::-webkit-scrollbar { display: none; }
  .play-gallery-slide {
    flex: 0 0 calc(100% - 36px);
    scroll-snap-align: center;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--bg-2);
    aspect-ratio: 3 / 4;
    max-height: 60vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .play-gallery-slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    cursor: zoom-in;
  }
  .play-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--ink-4);
    transition: all 0.2s;
  }
  .play-dot.active {
    background: var(--orange);
    width: 18px;
    border-radius: 3px;
  }
  .v-tile-badge {
    position: absolute; top: 8px; left: 8px;
    background: rgba(0,0,0,0.85); color: white;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; font-weight: 700;
    padding: 3px 7px; border-radius: 4px;
    text-transform: uppercase; letter-spacing: 0.08em;
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .v-tile-cat {
    position: absolute; bottom: 8px; left: 8px;
    background: var(--orange); color: black;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; font-weight: 800;
    padding: 3px 7px; border-radius: 4px;
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .v-tile-cat.def { background: var(--blue); color: white; }
  .v-tile-cat.rem { background: var(--red); color: white; }
  .v-tile-cat.sp { background: var(--purple); color: white; }
  .v-tile-cat.exo { background: var(--yellow); color: black; }
  .v-tile-cat.con { background: var(--green); color: black; }
  .v-tile-body { padding: 10px 12px 12px; }
  .v-tile-title {
    font-family: 'Anton', sans-serif;
    font-weight: 400; font-size: 14px; line-height: 1.1;
    text-transform: uppercase; letter-spacing: 0.02em;
    margin-bottom: 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .v-tile-meta {
    font-size: 11px; color: var(--ink-3); line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ========== STATS GRID ========== */
  .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 0 18px; }
  .stat-tile {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px;
    position: relative; overflow: hidden;
  }
  .stat-tile::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; height: 2px;
    background: var(--orange);
  }
  .stat-tile-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--ink-3);
    margin-bottom: 8px; font-weight: 600;
  }
  .stat-tile-value {
    font-family: 'Anton', sans-serif;
    font-size: 36px; line-height: 0.9;
  }
  .stat-tile-sub {
    font-size: 11px; color: var(--ink-3);
    margin-top: 4px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* ========== LIST ========== */
  .list-section {
    margin: 0 18px 14px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  .list-row {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border-soft);
    cursor: pointer; transition: background 0.15s;
  }
  .list-row:last-child { border-bottom: 0; }
  .list-row:active { background: var(--bg-3); }
  .list-row-icon {
    width: 36px; height: 36px; border-radius: 8px;
    background: var(--bg-3);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Anton', sans-serif; font-size: 16px;
    flex-shrink: 0; color: var(--orange);
  }
  .list-row-content { flex: 1; min-width: 0; }
  .list-row-title {
    font-family: 'Anton', sans-serif;
    font-size: 15px; line-height: 1.2;
    text-transform: uppercase; letter-spacing: 0.02em;
  }
  .list-row-subtitle {
    font-size: 12px; color: var(--ink-3); margin-top: 2px;
  }
  .list-row-trail { color: var(--ink-4); font-size: 16px; }

  /* ========== CHIPS ========== */
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 8px; border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
    background: var(--bg-3); color: var(--ink-2);
    white-space: nowrap;
    border: 1px solid var(--border);
  }
  .chip-orange { background: var(--orange-soft); color: var(--orange); border-color: rgba(255, 107, 0, 0.3); }
  .chip-green { background: var(--green-soft); color: var(--green); border-color: rgba(34, 197, 94, 0.3); }
  .chip-red { background: var(--red-soft); color: var(--red); border-color: rgba(239, 68, 68, 0.3); }
  .chip-blue { background: var(--blue-soft); color: var(--blue); border-color: rgba(59, 130, 246, 0.3); }
  .chip-yellow { background: var(--yellow-soft); color: var(--yellow); border-color: rgba(234, 179, 8, 0.3); }
  .chip-purple { background: var(--purple-soft); color: var(--purple); border-color: rgba(168, 85, 247, 0.3); }

  /* ========== BUTTONS ========== */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 11px 16px; border-radius: var(--radius-sm);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    border: none; cursor: pointer;
    transition: all 0.15s;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary {
    background: var(--orange); color: black;
    box-shadow: 0 4px 16px rgba(255, 107, 0, 0.3);
  }
  .btn-primary:hover { background: var(--orange-2); }
  .btn-secondary {
    background: var(--surface-2); color: var(--ink);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--bg-3); border-color: var(--ink-4); }
  .btn-ghost {
    background: transparent; color: var(--ink-2);
    padding: 8px 12px; font-size: 10px;
  }
  .btn-ghost:hover { background: var(--bg-3); color: var(--ink); }
  .btn-danger { background: transparent; color: var(--red); padding: 8px 12px; font-size: 10px; }
  .btn-danger:hover { background: var(--red-soft); }
  .btn-block { width: 100%; }
  .btn-lg { padding: 14px 20px; font-size: 12px; }
  .btn-icon {
    width: 32px; height: 32px; padding: 0;
    background: var(--bg-3); color: var(--ink-2);
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  /* ========== FORMS ========== */
  input, textarea, select {
    width: 100%; padding: 12px 14px;
    background: var(--bg-1); border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: inherit; font-size: 15px; color: var(--ink);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input::placeholder, textarea::placeholder { color: var(--ink-4); }
  input:focus, textarea:focus, select:focus {
    outline: none; border-color: var(--orange);
    box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.15);
  }
  textarea { min-height: 80px; resize: vertical; }
  .fld { margin-bottom: 12px; }
  .fld-label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--ink-3);
    margin-bottom: 6px; font-weight: 600;
  }
  .fld-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  /* ========== MODAL ========== */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100;
    backdrop-filter: blur(6px);
    display: flex; align-items: flex-end; justify-content: center;
    animation: fadeIn 0.2s;
  }
  @media (min-width: 640px) {
    .modal-bg { align-items: center; padding: 20px; }
  }
  .modal {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    max-width: 480px; width: 100%;
    max-height: 92vh; overflow-y: auto;
    animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    padding-bottom: env(safe-area-inset-bottom);
  }
  @media (min-width: 640px) {
    .modal { border-radius: var(--radius-lg); animation: scaleIn 0.2s ease-out; }
  }
  .modal-handle {
    width: 36px; height: 4px; border-radius: 2px;
    background: var(--ink-4); margin: 8px auto 0;
  }
  @media (min-width: 640px) { .modal-handle { display: none; } }
  .modal-header {
    padding: 18px 20px 14px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border-soft);
  }
  .modal-title {
    font-family: 'Anton', sans-serif;
    font-size: 20px; letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .modal-close {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--bg-3); border: 1px solid var(--border); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-2); font-size: 14px;
  }
  .modal-body { padding: 18px 20px; }
  .modal-footer {
    padding: 14px 20px;
    border-top: 1px solid var(--border-soft);
    display: flex; gap: 8px; justify-content: flex-end;
  }

  /* ========== EMPTY ========== */
  .empty {
    text-align: center; padding: 48px 20px;
  }
  .empty-icon {
    font-family: 'Anton', sans-serif;
    font-size: 64px; color: var(--ink-4);
    margin-bottom: 12px;
  }
  .empty-title {
    font-family: 'Anton', sans-serif;
    font-size: 18px; margin-bottom: 4px;
    text-transform: uppercase; letter-spacing: 0.02em;
  }
  .empty-desc {
    font-size: 13px; color: var(--ink-3); margin-bottom: 16px;
  }

  /* ========== ANIMATIONS ========== */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes scaleIn { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .fade-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }

  /* ========== MATCH ROW ========== */
  .match-row {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border-soft);
    cursor: pointer; transition: background 0.15s;
  }
  .match-row:last-child { border-bottom: 0; }
  .match-row:active { background: var(--bg-3); }
  .match-result-badge {
    width: 38px; height: 38px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Anton', sans-serif; font-size: 18px;
    flex-shrink: 0;
  }
  .match-result-w { background: var(--green-soft); color: var(--green); border: 1px solid rgba(34, 197, 94, 0.3); }
  .match-result-l { background: var(--red-soft); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.3); }
  .match-score {
    font-family: 'Anton', sans-serif;
    font-size: 22px; line-height: 1;
  }

  /* ========== TABLE STATS ========== */
  .stats-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .stats-table {
    min-width: 100%;
    width: max-content;
    border-collapse: collapse; font-size: 12px;
  }
  .stats-table th {
    text-align: left; padding: 10px 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--ink-3);
    border-bottom: 1px solid var(--border);
    font-weight: 700; background: var(--bg-2);
    white-space: nowrap;
  }
  .stats-table td {
    padding: 11px 8px; white-space: nowrap;
    border-bottom: 1px solid var(--border-soft);
    color: var(--ink);
  }
  .stats-table tr:last-child td { border-bottom: 0; }
  .stats-table tr:active { background: var(--bg-3); }
  .stats-total-row td {
    background: var(--bg-3); border-top: 2px solid var(--orange);
    font-weight: 700;
  }
  .stats-table .num {
    font-family: 'Anton', sans-serif; font-size: 15px;
  }
  .stats-table .pct {
    color: var(--ink-3); font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* ========== LEADERBOARD ========== */
  .lb-row {
    display: grid; grid-template-columns: 36px 1fr auto; gap: 12px;
    align-items: center; padding: 12px 16px;
    border-bottom: 1px solid var(--border-soft);
    cursor: pointer; transition: background 0.15s;
  }
  .lb-row:last-child { border-bottom: 0; }
  .lb-row:active { background: var(--bg-3); }
  .lb-medal {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Anton', sans-serif; font-size: 13px;
    background: var(--bg-3); color: var(--ink-2);
    border: 1px solid var(--border);
  }
  .lb-medal.gold { background: linear-gradient(135deg, #ffd700, #b8860b); color: #000; border-color: #ffd700; }
  .lb-medal.silver { background: linear-gradient(135deg, #d4d4d4, #888); color: #000; border-color: #c0c0c0; }
  .lb-medal.bronze { background: linear-gradient(135deg, #cd7f32, #8b4513); color: white; border-color: #cd7f32; }
  .lb-progress {
    height: 3px; background: var(--bg-3); border-radius: 2px;
    overflow: hidden; margin-top: 6px;
  }
  .lb-progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--orange), var(--yellow));
    transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* ========== CONVOC ========== */
  .convoc-chip {
    padding: 8px 12px; border-radius: 999px;
    background: var(--green-soft); color: var(--green);
    border: 1px solid rgba(34, 197, 94, 0.3);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em;
    cursor: pointer; transition: all 0.15s;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .convoc-chip:active { transform: scale(0.94); }
  .convoc-absent-row {
    display: flex; gap: 10px; padding: 12px;
    background: var(--red-soft);
    border: 1px solid rgba(239, 68, 68, 0.2);
    border-radius: 8px; margin-bottom: 6px;
  }

  /* ========== SEGMENTED ========== */
  .segmented {
    display: flex; padding: 3px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin: 0 18px 14px;
    overflow-x: auto; scrollbar-width: none;
  }
  .segmented::-webkit-scrollbar { display: none; }
  .segmented-btn {
    flex: 1; min-width: max-content;
    padding: 8px 12px;
    background: none; border: none; border-radius: 7px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-3); cursor: pointer;
    transition: all 0.15s; white-space: nowrap;
  }
  .segmented-btn.active {
    background: var(--orange); color: black;
    box-shadow: 0 2px 6px rgba(255, 107, 0, 0.3);
  }

  /* ========== DETAIL ========== */
  .detail-back {
    display: inline-flex; align-items: center; gap: 4px;
    background: none; border: none; cursor: pointer;
    color: var(--ink-2);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 14px 18px 0;
  }
  .detail-back:active { color: var(--orange); }
  .detail-title {
    font-family: 'Anton', sans-serif;
    font-size: 38px; line-height: 0.95;
    text-transform: uppercase;
    padding: 10px 18px 6px;
  }
  .detail-subtitle {
    color: var(--ink-3); font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 0 18px 16px;
  }

  /* ========== FAB ========== */
  .fab {
    position: fixed; bottom: 86px;
    right: max(18px, calc(50vw - 240px + 18px));
    z-index: 35;
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--orange); color: black;
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 300;
    box-shadow: 0 8px 24px rgba(255, 107, 0, 0.4);
    transition: all 0.2s;
  }
  .fab:active { transform: scale(0.92); }
  @media (min-width: 768px) {
    .fab { right: calc(50vw - 280px + 18px); }
  }
  @media (max-width: 480px) {
    .fab { right: 18px; }
  }

  /* ========== AUTH SCREEN ========== */
  .auth-screen {
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 30px 20px;
    background: var(--bg);
    position: relative; overflow: hidden;
  }
  .auth-bg-glow {
    position: absolute; width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--orange-soft), transparent 70%);
    top: -100px; right: -100px;
    pointer-events: none;
  }
  .auth-logo {
    width: 80px; height: 80px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ff8533, var(--orange));
    display: flex; align-items: center; justify-content: center;
    font-size: 44px;
    box-shadow: 0 0 60px var(--orange-glow), inset 0 0 30px rgba(0,0,0,0.3);
    margin-bottom: 24px;
    animation: pulseGlow 2.5s ease-in-out infinite;
  }
  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 60px var(--orange-glow), inset 0 0 30px rgba(0,0,0,0.3); }
    50% { box-shadow: 0 0 100px rgba(255, 107, 0, 0.5), inset 0 0 30px rgba(0,0,0,0.3); }
  }
  .auth-title {
    font-family: 'Anton', sans-serif;
    font-size: 38px; letter-spacing: 0.02em;
    text-align: center; margin-bottom: 4px;
    text-transform: uppercase;
  }
  .auth-subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--orange);
    text-transform: uppercase; letter-spacing: 0.2em;
    margin-bottom: 40px; text-align: center;
    font-weight: 700;
  }
  .role-picker {
    display: flex; flex-direction: column; gap: 10px;
    width: 100%; max-width: 320px;
  }
  .role-btn {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    display: flex; align-items: center; gap: 14px;
    cursor: pointer; transition: all 0.15s;
    text-align: left; width: 100%;
    color: var(--ink);
  }
  .role-btn:active { transform: scale(0.98); }
  .role-btn:hover { border-color: var(--orange); background: var(--bg-3); }
  .role-icon {
    width: 44px; height: 44px; border-radius: 10px;
    background: var(--bg-3); display: flex;
    align-items: center; justify-content: center;
    font-family: 'Anton', sans-serif; font-size: 20px;
    color: var(--orange); flex-shrink: 0;
  }
  .role-info { flex: 1; }
  .role-name {
    font-family: 'Anton', sans-serif;
    font-size: 16px; text-transform: uppercase; letter-spacing: 0.02em;
  }
  .role-desc {
    font-size: 12px; color: var(--ink-3); margin-top: 2px;
  }

  /* PIN PAD */
  .pin-display {
    display: flex; gap: 10px; justify-content: center;
    margin: 30px 0 20px;
  }
  .pin-dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--bg-3); border: 2px solid var(--border);
    transition: all 0.15s;
  }
  .pin-dot.filled { background: var(--orange); border-color: var(--orange); box-shadow: 0 0 12px var(--orange-glow); }
  .pin-pad {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    max-width: 280px; margin: 0 auto;
    touch-action: manipulation;
  }
  .pin-btn {
    aspect-ratio: 1; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--border);
    font-family: 'Anton', sans-serif; font-size: 26px;
    color: var(--ink); cursor: pointer;
    transition: all 0.1s;
    display: flex; align-items: center; justify-content: center;
    /* Désactive double-tap zoom natif iOS / Android */
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    /* Empêche le tap-highlight et le callout iOS */
    -webkit-touch-callout: none;
  }
  .pin-btn:active {
    background: var(--orange); color: black;
    transform: scale(0.92);
    box-shadow: 0 0 30px var(--orange-glow);
  }
  .pin-btn.action {
    font-size: 14px;
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-3);
  }

  /* PIN rate-limit lockout */
  .pin-pad.disabled .pin-btn {
    opacity: 0.3;
    cursor: not-allowed;
    pointer-events: none;
  }
  .pin-pad.disabled .pin-btn:active { transform: none; }
  .pin-lockout {
    margin: 0 auto 16px;
    max-width: 280px;
    padding: 16px;
    background: linear-gradient(135deg, rgba(239,68,68,0.08), rgba(239,68,68,0.02));
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: 12px;
    text-align: center;
  }
  .pin-lockout-icon {
    font-size: 28px;
    margin-bottom: 6px;
  }
  .pin-lockout-title {
    font-family: 'Anton', sans-serif;
    font-size: 14px;
    color: var(--red);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .pin-lockout-timer {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    font-weight: 700;
    color: var(--red);
    line-height: 1;
    margin-bottom: 8px;
    text-shadow: 0 0 12px rgba(239,68,68,0.3);
  }
  .pin-lockout-msg {
    font-size: 10px;
    color: var(--ink-3);
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  /* Selfie victoire */
  .win-selfie-wrap {
    margin: 0 18px 14px;
  }
  .win-selfie-frame {
    position: relative;
    border-radius: var(--radius-lg);
    overflow: hidden;
    border: 3px solid var(--orange);
    box-shadow: 0 12px 40px rgba(255,107,0,0.25), 0 0 80px rgba(255,107,0,0.1) inset;
    cursor: pointer;
    transition: transform 0.15s;
    background: black;
  }
  .win-selfie-frame:active { transform: scale(0.99); }
  .win-selfie-img {
    width: 100%;
    display: block;
    object-fit: cover;
    max-height: 70vh;
  }
  .win-selfie-banner {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 12px 14px;
    background: linear-gradient(0deg, rgba(0,0,0,0.9), rgba(0,0,0,0));
    color: white;
    font-family: 'Anton', sans-serif;
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    text-align: center;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  }

  /* Statut médical */
  .injury-status-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 14px 8px;
    background: var(--bg-2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--ink-2);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: all 0.15s;
  }
  .injury-status-btn:active { transform: scale(0.97); }
  .injury-status-btn.active {
    border-color: var(--color);
    background: var(--bg);
    color: var(--color);
    box-shadow: 0 0 0 1px var(--color);
  }
  .injury-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .lb-row-me {
    background: linear-gradient(90deg, rgba(255,107,0,0.12), transparent) !important;
    border-left: 3px solid var(--orange) !important;
  }
  .lb-quick-btn {
    background: var(--orange);
    color: black;
    border: 0;
    border-radius: 8px;
    padding: 8px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s;
    box-shadow: 0 4px 12px rgba(255,107,0,0.3);
  }
  .lb-quick-btn:active { transform: scale(0.92); }
  .scope-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 14px 10px;
    background: var(--bg-2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--ink-2);
  }
  .scope-btn:active { transform: scale(0.97); }
  .scope-btn.active {
    background: var(--bg);
    border-color: var(--orange);
    color: var(--orange);
    box-shadow: 0 0 0 1px var(--orange);
  }

  /* Routine d'échauffement */
  .warmup-step {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 10px 12px;
    background: var(--bg-2);
    border-left: 3px solid var(--orange);

// Game Score (formule Hollinger adaptée) - reflète la contribution globale
// PTS + 0.4*PD + 0.7*REB + INT + 0.7*DEF - 0.4*(tirs ratés) - PB - 0.4*Fautes
function gameScore(s) {
  if (!s) return 0;
  const tirsRates = (s.p2iA||0) - (s.p2i||0) + (s.p2eA||0) - (s.p2e||0) + (s.p3A||0) - (s.p3||0);
  const lfRates = (s.ftA||0) - (s.ft||0);
  const gs = (s.pts||0)
    + 0.4 * (s.ast||0)
    + 0.7 * (s.reb||0)
    + (s.stl||0)
    + 0.7 * (s.def||0)
    - 0.4 * tirsRates
    - 0.4 * lfRates
    - (s.to||0)
    - 0.4 * (s.fouls||0);
  return Math.round(gs * 10) / 10;
}

function esc(s) { return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid() { return 'x' + Date.now() + Math.random().toString(36).slice(2,6); }

function parseVideo(url) {
  if (!url) return null;
  url = url.trim();
  const isVertical = /shorts\/|tiktok\.com|instagram\.com\/reels?/i.test(url);
  let m = url.match(/(?:youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*?&)?v=|embed\/|shorts\/|v\/|live\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})(?:[?&#\/]|$)/);
  if (m) {
    const id = m[1];
    const embed = `https://www.youtube.com/embed/${id}?rel=0&modestbranding=1&playsinline=1`;
    const watchUrl = isVertical
      ? `https://www.youtube.com/shorts/${id}`
      : `https://www.youtube.com/watch?v=${id}`;
    return {
      provider: 'youtube', id,
      embed,
      watchUrl,
      thumb: `https://img.youtube.com/vi/${id}/hqdefault.jpg`,
      thumbHQ: `https://img.youtube.com/vi/${id}/maxresdefault.jpg`,
      vertical: isVertical
    };
  }
  m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (m) return { provider: 'vimeo', id: m[1], embed: `https://player.vimeo.com/video/${m[1]}`, watchUrl: `https://vimeo.com/${m[1]}`, thumb: null, vertical: isVertical };

  // === INSTAGRAM (posts, reels, IGTV) ===
  // Accepte instagram.com/p/<id>/, /reel/<id>/, /reels/<id>/, /tv/<id>/
  m = url.match(/instagram\.com\/(?:p|reel|reels|tv)\/([A-Za-z0-9_-]+)/i);
  if (m) {
    const id = m[1];
    const isReel = /\/reels?\//i.test(url);
    return {
      provider: 'instagram', id,
      embed: `https://www.instagram.com/p/${id}/embed/`,
      watchUrl: `https://www.instagram.com/${isReel ? 'reel' : 'p'}/${id}/`,
      thumb: null,
      vertical: isReel || isVertical
    };
  }

  // === TIKTOK ===
  // Format long : tiktok.com/@user/video/<numeric_id>
  m = url.match(/tiktok\.com\/@[^\/]+\/video\/(\d+)/i);
  if (m) {
    const id = m[1];
    return {
      provider: 'tiktok', id,
      embed: `https://www.tiktok.com/embed/v2/${id}`,
      watchUrl: url,
      thumb: null,
      vertical: true
    };
  }
  // Format court : vm.tiktok.com/<code> ou tiktok.com/t/<code>
  m = url.match(/(?:vm\.tiktok\.com\/([A-Za-z0-9]+)|tiktok\.com\/t\/([A-Za-z0-9]+))/i);
  if (m) {
    const code = m[1] || m[2];
    return {
      provider: 'tiktok', id: code,
      embed: null, // pas d'ID numérique : on ouvre dans l'app
      watchUrl: url,
      thumb: null,
      vertical: true
    };
  }

  if (/\.(mp4|webm|ogg)(\?|$)/i.test(url)) return { provider: 'direct', id: url, embed: url, watchUrl: url, thumb: null, vertical: isVertical };
  return null;
}

function videoEmbed(url) {
  const v = parseVideo(url);

  if (v.provider === 'direct') return `<video controls preload="metadata"><source src="${v.embed}"></video>`;

function formatDate(iso, format = 'short') {
  if (!iso) return '';
  const d = new Date(iso);
  if (format === 'short') return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' });
  if (format === 'long') return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  return iso;
}
function daysUntil(iso) {
  const d = new Date(iso + 'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((d - today) / 86400000);
}

function secondsAgo(timestamp) {
  if (!timestamp) return '';
  const sec = Math.floor((Date.now() - timestamp) / 1000);
  if (sec < 5) return "À L'INSTANT";
  if (sec < 60) return sec + 's';
  const min = Math.floor(sec / 60);
  if (min < 60) return min + 'min';
  return Math.floor(min/60) + 'h';
}

// MOTEUR DE RÉCURRENCE
// ============================================================
const DAY_NAMES_FR = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];
const DAY_NAMES_FR_FULL = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];

function isoDate(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// Génère toutes les instances d'une convocation entre deux dates
function getConvocInstances(convoc, fromISO, toISO) {
  const instances = [];
  const from = new Date(fromISO + 'T00:00:00');
  const to = new Date(toISO + 'T00:00:00');

  if (!convoc.recurrence) {
    // Pas de récurrence : juste la date elle-même si dans la plage
    const d = new Date(convoc.date + 'T00:00:00');
    if (d >= from && d <= to) {
      instances.push(makeConvocInstance(convoc, convoc.date));
    }
    return instances;
  }

  // Récurrence hebdo
  const r = convoc.recurrence;
  if (r.type === 'weekly' && r.days && r.days.length > 0) {
    const start = new Date(convoc.date + 'T00:00:00');
    const until = r.until ? new Date(r.until + 'T00:00:00') : new Date(to.getTime());
    // Parcourir jour par jour de start à min(to, until)
    const stopAt = until < to ? until : to;
    let cursor = new Date(Math.max(start.getTime(), from.getTime()));
    cursor.setHours(0,0,0,0);
    while (cursor <= stopAt) {
      if (cursor >= start && r.days.includes(cursor.getDay())) {
        const dateStr = isoDate(cursor);
        if (!(convoc.cancelledInstances || []).includes(dateStr)) {
          instances.push(makeConvocInstance(convoc, dateStr));
        }
      }
      cursor.setDate(cursor.getDate() + 1);
    }
  }

  return instances;
}

// Crée une instance enrichie (convoc + override éventuel + flag virtuel)
function makeConvocInstance(convoc, dateStr) {
  const override = (convoc.instanceOverrides || {})[dateStr] || {};
  return {
    ...convoc,
    date: dateStr,
    responses: override.responses || convoc.responses || {},
    note: override.note !== undefined ? override.note : convoc.note,
    title: override.title || convoc.title,
    location: override.location || convoc.location,
    time: override.time || convoc.time,
    attachments: override.attachments || convoc.attachments || [],
    _isInstance: true,
    _instanceDate: dateStr,
    _parentId: convoc.id,
    _instanceKey: convoc.id + '__' + dateStr,
    closed: (override.closed || convoc.closed) === true,
  };
}

// Tous les événements (instances) entre deux dates, triés
function getAllEventsBetween(fromISO, toISO) {
  const all = [];
  state.convocations.forEach(c => {
    getConvocInstances(c, fromISO, toISO).forEach(i => all.push(i));
  });
  return all.sort((a, b) => {
    if (a.date !== b.date) return a.date.localeCompare(b.date);
    return (a.time || '').localeCompare(b.time || '');
  });
}

// Annuler une instance précise d'une récurrence
function cancelInstance(parentId, dateStr) {
  const c = state.convocations.find(x => x.id === parentId);
  if (!c) return;
  c.cancelledInstances = c.cancelledInstances || [];
  if (!c.cancelledInstances.includes(dateStr)) {
    c.cancelledInstances.push(dateStr);
  }
  persist();
}

// Restaurer une instance annulée
function restoreInstance(parentId, dateStr) {
  const c = state.convocations.find(x => x.id === parentId);
  if (!c) return;
  c.cancelledInstances = (c.cancelledInstances || []).filter(d => d !== dateStr);
  persist();
}

            </button>

        </div>

  if (flow.stage === 'pin') {

    const att = state.pinAttempts[key];
    const remaining = getRemainingLockMs(key);
    const isLocked = remaining > 0;
    const failedCount = att ? att.count : 0;
    const remainingAttemptsBeforeLock = Math.max(0, 3 - failedCount);

    // Format mm:ss du cooldown
    const remainingSec = Math.ceil(remaining / 1000);
    const mm = Math.floor(remainingSec / 60);
    const ss = remainingSec % 60;
    const lockLabel = mm > 0 ? `${mm}m${ss.toString().padStart(2,'0')}` : `${ss}s`;

    // Si verrouillé, démarrer le timer pour rafraîchir
    if (isLocked) setTimeout(() => startCooldownTimer(), 0);

    return `

            ${remainingAttemptsBeforeLock > 0 && remainingAttemptsBeforeLock <= 2 ? `<br><span style="color:var(--orange);text-transform:none;letter-spacing:0">Encore ${remainingAttemptsBeforeLock} tentative${remainingAttemptsBeforeLock>1?'s':''} avant verrouillage</span>` : ''}
          </div>
        ` : ''}

        <div class="pin-pad ${isLocked ? 'disabled' : ''}">
          ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="pin-btn" ${isLocked?'disabled':''} onclick="pinKey('${n}')">${n}</button>`).join('')}
          <button class="pin-btn action" ${isLocked?'disabled':''} onclick="pinKey('clear')">EFFACER</button>
          <button class="pin-btn" ${isLocked?'disabled':''} onclick="pinKey('0')">0</button>
          <button class="pin-btn action" ${isLocked?'disabled':''} onclick="pinKey('back')">←</button>
        </div>
        <button class="btn btn-ghost mt-3" onclick="pinKey('exit')">Changer d'utilisateur</button>
        ${!isLocked ? `<div style="margin-top:20px;font-size:11px;color:var(--ink-4);text-align:center">Code par défaut : 0000</div>` : ''}
      </div>
    `;
  }
}

function pickRole(role) {
  state.authFlow.role = role;
  if (role === 'player') {
    state.authFlow.stage = 'pickPlayer';
  } else {
    state.authFlow.stage = 'pin';
    state.authFlow.pinInput = '';
  }
  render();
}
function pickPlayer(pid) {
  state.authFlow.playerId = pid;
  state.authFlow.stage = 'pin';
  state.authFlow.pinInput = '';
  render();
}
function pinKey(key) {
  if (key === 'exit') {
    state.authFlow = { stage: 'role', role: null, playerId: null, pinInput: '' };
    render(); return;
  }
  // Bloquer toute saisie si verrouillé (sauf exit)
  const { role, playerId } = state.authFlow;
  if (role) {
    const k = getRateLimitKey(role, playerId);
    if (getRemainingLockMs(k) > 0) return;
  }
  if (key === 'clear') { state.authFlow.pinInput = ''; state.authFlow.pinError = false; render(); return; }
  if (key === 'back') { state.authFlow.pinInput = state.authFlow.pinInput.slice(0, -1); state.authFlow.pinError = false; render(); return; }
  if (state.authFlow.pinInput.length >= 4) return;
  state.authFlow.pinInput += key;
  state.authFlow.pinError = false;
  if (state.authFlow.pinInput.length === 4) {
    setTimeout(() => tryPin(), 200);
  }
  render();
}
// Identifiant unique pour le rate-limit selon le rôle
function getRateLimitKey(role, playerId) {
  if (role === 'player') return 'player_' + playerId;
  return role; // 'coach' ou 'stat'
}

// Délai exponentiel APRÈS la 3e erreur
// Tentatives 1, 2, 3 = libres (0s)
// 4e échec = 5s, 5e = 10s, 6e = 20s, 7e = 40s, 8e = 80s, 9e = 160s, 10e+ = 300s (cap 5min)
function computeCooldown(failedCount) {
  if (failedCount <= 3) return 0;
  const base = 5;
  const exp = failedCount - 4;
  const delay = base * Math.pow(2, exp);
  return Math.min(delay * 1000, 300 * 1000);
}

function getRemainingLockMs(key) {
  const att = state.pinAttempts[key];
  if (!att || !att.lockedUntil) return 0;
  return Math.max(0, att.lockedUntil - Date.now());
}

function tryPin() {
  const { role, playerId, pinInput } = state.authFlow;
  const key = getRateLimitKey(role, playerId);

  // Vérifier si encore en cooldown
  const remaining = getRemainingLockMs(key);
  if (remaining > 0) {
    state.authFlow.pinInput = '';
    render();
    return;
  }

  let valid = false;
  if (role === 'coach' && pinInput === (state.pins.coach || '1234')) valid = true;
  else if (role === 'stat' && pinInput === (state.pins.stat || '1234')) valid = true;
  else if (role === 'player') {
    const p = state.players.find(p => p.id === playerId);
    if (p && p.pin === pinInput) valid = true;
  }

  if (valid) {
    // Reset compteur en cas de succès
    delete state.pinAttempts[key];
    state.auth = { role, playerId: role === 'player' ? playerId : null };
    state.authFlow = { stage: 'role', role: null, playerId: null, pinInput: '' };
    if (role === 'stat') state.section = 'live';
    else state.section = 'home';
    persist();
    render();
    return;
  }

  // Échec : incrémenter compteur
  state.pinAttempts[key] = state.pinAttempts[key] || { count: 0, lockedUntil: 0 };
  state.pinAttempts[key].count++;
  const cooldown = computeCooldown(state.pinAttempts[key].count);
  if (cooldown > 0) {
    state.pinAttempts[key].lockedUntil = Date.now() + cooldown;
  }
  state.authFlow.pinError = true;
  state.authFlow.pinInput = '';
  persist();
  render();

  // Démarrer un timer pour rafraîchir l'UI quand le cooldown se termine
  if (cooldown > 0) startCooldownTimer();
}

let _cooldownInterval = null;
function startCooldownTimer() {
  if (_cooldownInterval) return;
  _cooldownInterval = setInterval(() => {
    // Si on n'est plus sur l'écran de PIN, arrêter
    if (state.auth || !state.authFlow || state.authFlow.stage !== 'pin') {
      clearInterval(_cooldownInterval);
      _cooldownInterval = null;
      return;
    }
    const key = getRateLimitKey(state.authFlow.role, state.authFlow.playerId);
    const remaining = getRemainingLockMs(key);
    // Rafraîchir l'affichage pour mettre à jour le compte à rebours
    render();
    if (remaining === 0) {
      clearInterval(_cooldownInterval);
      _cooldownInterval = null;
    }
  }, 1000);
}

  openSettings();

// ============================================================
// FILE TO BASE64
// ============================================================
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

// ============================================================
// ATTACHMENTS UNIVERSEL (images + PDF)
// ============================================================
// Format : { id, type: 'image'|'pdf', name, data (base64), size }

function isImageFile(file) { return file.type.startsWith('image/'); }
function isPdfFile(file) { return file.type === 'application/pdf'; }

async function makeAttachment(file) {
  const data = await fileToBase64(file);
  return {
    id: uid(),
    type: isImageFile(file) ? 'image' : isPdfFile(file) ? 'pdf' : 'other',
    name: file.name,
    data,
    size: file.size
  };
}

  const role = state.auth.role;
  const player = currentPlayer();

  const newVal = document.getElementById('pin-new').value;
  const confirmVal = document.getElementById('pin-confirm').value;
  const errEl = document.getElementById('pin-error');

  function showErr(msg) {
    errEl.style.display = 'block';
    errEl.textContent = msg;
  }

  if (oldVal !== currentPin) return showErr('✕ Code actuel incorrect');
  if (!/^\d{4}$/.test(newVal)) return showErr('✕ Le nouveau code doit être 4 chiffres');
  if (newVal !== confirmVal) return showErr('✕ Les codes ne correspondent pas');

  if (role === 'player') {
    player.pin = newVal;
  } else {
    state.pins[role] = newVal;

  persist();
  closeModal();
  setTimeout(() => alert('✓ Code PIN modifié'), 200);

                <div style="font-family:'JetBrains Mono';font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.06em">Moyenne équipe</div>
                <div style="font-family:'Anton';font-size:28px;color:${color};line-height:1">${overallAvg.toFixed(1)}<span style="color:var(--ink-4);font-size:14px">/5</span></div>
              </div>
              <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">
                ${TEAM_REVIEW_FIELDS.map(f => {
                  const v = avg[f.key];
                  const c = v >= 4 ? 'var(--green)' : v <= 2 ? 'var(--red)' : 'var(--orange)';
                  return `
                    <div style="text-align:center">
                      <div style="font-size:16px;margin-bottom:2px">${f.icon}</div>
                      <div style="font-family:'Anton';font-size:18px;color:${c};line-height:1">${v.toFixed(1)}</div>
                      <div style="font-size:8px;color:var(--ink-4);font-family:'JetBrains Mono';text-transform:uppercase;margin-top:2px">${f.label.slice(0,8)}</div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        `;
      })()}

      ${(() => {
        const o = state.offseason;
        const active = isOffseasonActive();
        if (!o) {
          return `
            <div style="padding:0 18px;margin-bottom:18px">
              <div onclick="openOffseasonConfig()" style="padding:14px;background:var(--bg-2);border:1.5px dashed var(--ink-3);border-radius:var(--radius);cursor:pointer;display:flex;align-items:center;gap:12px">
                <span style="font-size:32px">☀</span>
                <div style="flex:1">
                  <div style="font-family:'Anton';font-size:14px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-2)">Configurer la prépa estivale</div>
                  <div style="font-size:11px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:2px;text-transform:uppercase;letter-spacing:0.04em">Programme hebdo de prépa physique pour les joueuses</div>
                </div>
                <span style="color:var(--ink-3);font-size:18px;font-family:'Anton'">+</span>
              </div>
            </div>
          `;
        }
        // Calcul engagement équipe semaine en cours
        const weekKey = getWeekKey();
        const logs = state.offseasonLogs || {};
        const totalDone = state.players.reduce((acc, p) => {
          const pLog = (logs[p.id] || {})[weekKey] || {};
          return acc + o.exercises.filter(ex => pLog[ex.id] && pLog[ex.id].done).length;
        }, 0);
        const totalExpected = state.players.length * o.exercises.length;
        const teamPct = totalExpected > 0 ? Math.round((totalDone / totalExpected) * 100) : 0;
        const color = teamPct >= 70 ? 'var(--green)' : teamPct >= 40 ? 'var(--orange)' : 'var(--red)';
        // Joueuses actives cette semaine
        const activePlayers = state.players.filter(p => {
          const pLog = (logs[p.id] || {})[weekKey] || {};
          return o.exercises.some(ex => pLog[ex.id] && pLog[ex.id].done);
        }).length;
        return `
          <div class="section-header">
            <div>
              <div class="eyebrow" style="color:${active?'var(--orange)':'var(--ink-3)'}">${active ? '☀ Actif · ' + formatWeekRange() : '○ Inactif · ' + formatDate(o.startDate, 'short') + ' → ' + formatDate(o.endDate, 'short')}</div>
              <h2 class="display-md mt-2">${esc(o.title)}</h2>
            </div>
            <button class="section-action" onclick="openOffseasonDashboard()">Suivi →</button>
          </div>
          <div style="padding:0 18px;margin-bottom:18px">
            <div onclick="openOffseasonDashboard()" style="padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
                <div style="font-family:'JetBrains Mono';font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.06em">Engagement équipe · semaine</div>
                <div style="font-family:'Anton';font-size:28px;color:${color};line-height:1">${teamPct}%</div>
              </div>
              <div style="height:6px;background:var(--bg-1);border-radius:3px;overflow:hidden;margin-bottom:8px">
                <div style="height:100%;width:${teamPct}%;background:${color}"></div>
              </div>
              <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';text-transform:uppercase">
                <span>${activePlayers}/${state.players.length} joueuses actives</span>
                <span>${o.exercises.length} exos × semaine</span>
              </div>
            </div>
          </div>
        `;
      })()}

    </div>
  `;
}

// Row pour une instance d'événement (utilisée Home + Team)
function eventInstanceRow(ev, isCoach) {
  const d = new Date(ev.date + 'T00:00:00');
  const dayName = DAY_NAMES_FR_FULL[d.getDay()];
  const day = d.getDate();
  const month = d.toLocaleDateString('fr-FR', { month: 'short' });
  const isToday = isoDate(new Date()) === ev.date;
  const isMatch = ev.type === 'match';
  const instanceKey = ev._instanceKey || ev.id;
  return `
    <div class="list-row" onclick="openEventInstance('${ev._parentId || ev.id}','${ev._instanceDate || ev.date}')">
      <div class="event-date-badge">
        <div class="event-date-day">${day}</div>
        <div class="event-date-month">${month}</div>
      </div>
      <div class="list-row-content">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">
          <div class="list-row-title">${esc(ev.title)}</div>
          ${isMatch ? '<span class="chip chip-orange" style="font-size:9px;padding:2px 6px">MATCH</span>' : ''}
          ${isToday ? '<span class="chip chip-red" style="font-size:9px;padding:2px 6px">AUJOURD\'HUI</span>' : ''}
        </div>
        <div class="list-row-subtitle">${dayName}${ev.time ? ' · ' + ev.time : ''}${ev.location ? ' · ' + esc(ev.location) : ''}</div>
      </div>
      <span class="list-row-trail">›</span>
    </div>
  `;
}

function heroCard(ev) {
  const days = daysUntil(ev.date);
  const daysLabel = days === 0 ? "Aujourd'hui" : days === 1 ? 'Demain' : `Dans ${days} jours`;
  const responses = ev.responses || {};
  const absent = state.players.filter(p => responses[p.id] && responses[p.id].status === 'absent').length;
  const parentId = ev._parentId || ev.id;
  const instanceDate = ev._instanceDate || ev.date;

  return `
    <div class="hero-card fade-up" onclick="openEventInstance('${parentId}','${instanceDate}')">
      <div class="hero-eyebrow">${ev.type === 'match' ? '◆ Prochain match' : '● Prochain entraînement'} · ${daysLabel}</div>
      <div class="hero-title">${esc(ev.title)}</div>
      <div class="hero-meta">
        <div>◷ ${formatDate(ev.date, 'long')}${ev.time ? ' · ' + ev.time : ''}</div>
        ${ev.location ? `<div>⌖ ${esc(ev.location)}</div>` : ''}
      </div>
      ${absent > 0 ? `
        <div class="hero-meta mt-2">
          <div style="color:#ffe5d6">⚠ ${absent} absente${absent>1?'s':''}</div>
        </div>
      ` : ''}
      <button class="hero-cta" onclick="event.stopPropagation();openEventInstance('${parentId}','${instanceDate}')">Détails →</button>
    </div>
  `;
}

function playTile(p) {
  const images = p.images || [];
  const hasGallery = images.length > 0;
  const v = p.videoUrl ? parseVideo(p.videoUrl) : null;
  const hasVideo = !!v;
  const previewSrc = hasGallery ? images[0] : (v && v.thumb ? v.thumb : null);
  const concepts = p.concepts || [];
  return `
    <div class="v-tile" onclick="openPlay('${p.id}')">
      <div class="v-tile-media">
        ${previewSrc
          ? `<img src="${previewSrc}" alt="" onerror="this.style.display='none'">`
          : `<div class="v-tile-placeholder">
              <div class="v-tile-placeholder-icon">${hasVideo ? '▶' : '🏀'}</div>
              ${concepts.length > 0
                ? `<div class="v-tile-placeholder-tags">${concepts.slice(0,2).map(c => esc(c)).join(' · ')}</div>`
                : (p.tags && p.tags.length > 0
                  ? `<div class="v-tile-placeholder-tags">${p.tags.slice(0,2).map(t => esc(t)).join(' · ')}</div>`
                  : `<div class="v-tile-placeholder-tags">${esc((p.desc || '').slice(0, 40))}${(p.desc || '').length > 40 ? '…' : ''}</div>`)}
            </div>`}
        <div style="position:absolute;top:6px;left:6px;display:flex;gap:4px;flex-wrap:wrap">
          ${hasGallery ? `<div class="v-tile-badge" style="background:rgba(255,107,0,0.9);color:black">📷 ${images.length}</div>` : ''}
          ${hasVideo ? `<div class="v-tile-badge">▶</div>` : ''}
        </div>
        <div class="v-tile-cat ${getCatClass(p.cat)}">${getCatShort(p.cat)}</div>
      </div>
      <div class="v-tile-body">
        <div class="v-tile-title">${esc(p.title)}</div>
        <div class="v-tile-meta">${esc(p.desc || (concepts.length > 0 ? concepts.slice(0,3).join(' · ') : ''))}</div>
      </div>
    </div>
  `;
}

// ============================================================
// PLAYER VIEW — Architecture 5 onglets (v2)
// 1. home (Mon Playbook = dashboard compact)
// 2. plays (catalogue — utilise renderPlays)
// 3. challenges (renderPlayerChallenges)
// 4. calendrier (renderPlayerCalendrier : convoc + matchs + FFBB)
// 5. programme (renderPlayerProgramme : prépa estivale)
// ============================================================

function renderHomePlayer() {
  const p = currentPlayer();
  if (!p) return renderHomeCoach();

  const today = new Date(); today.setHours(0,0,0,0);
  const todayStr = isoDate(today);
  const threeWeeksLater = new Date(today.getTime() + 21 * 86400000);
  const upcoming = getAllEventsBetween(todayStr, isoDate(threeWeeksLater));
  const nextEvent = upcoming[0];

  // Dernières stats persos (compact)
  const myMatches = state.matches
    .filter(m => m.playerStats && m.playerStats[p.id])
    .sort((a,b) => b.date.localeCompare(a.date));
  const lastStats = myMatches.length > 0 ? myMatches[0].playerStats[p.id] : null;

  // Challenges actifs (non clôturés)
  const myActiveChallenges = (state.challenges || []).filter(c => !c.badgesAwarded).slice(0, 3);
  const myBadgesCount = (p.badges || []).length;

  // Carrousel plays récents
  const featuredPlays = state.plays.slice(0, 6);

  return `
    <div class="fade-up">
      <div class="section-header">
        <div>
          <div class="eyebrow">Salut #${p.num}</div>
          <h2 class="display-lg mt-2">${esc(p.name)}</h2>
        </div>
      </div>

      <!-- 1. Prochain événement (RSVP en 1 clic via heroCard / openEventInstance) -->
      ${nextEvent ? heroCard(nextEvent) : `
        <div style="padding:0 18px;margin-bottom:14px">
          <div class="card" style="padding:14px;display:flex;align-items:center;gap:12px;cursor:default">
            <div style="font-size:32px">📅</div>
            <div style="flex:1">
              <div style="font-family:'Anton';font-size:15px;text-transform:uppercase">Aucun match prévu</div>
              <div style="font-size:11px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:2px;text-transform:uppercase">Ton coach te préviendra</div>
            </div>
          </div>
        </div>
      `}

      <!-- 2. Challenges actifs (preview 2-3, lien Tout → onglet) -->
      ${myActiveChallenges.length > 0 ? `
        <div class="section-header">
          <div>
            <div class="eyebrow">Défis en cours</div>
            <h2 class="display-md mt-2">Challenges</h2>
          </div>
          <button class="section-action" onclick="goSection('challenges')">Tout →</button>
        </div>
        <div style="padding:0 18px;display:flex;flex-direction:column;gap:8px;margin-bottom:18px">
          ${myActiveChallenges.map(c => playerChallengeRow(c, p.id)).join('')}
        </div>
      ` : ''}

      <!-- 3. Carrousel plays récents (lien → onglet Plays) -->
      <div class="section-header">
        <div>
          <div class="eyebrow">Plays à revoir</div>
          <h2 class="display-md mt-2">Playbook</h2>
        </div>
        <button class="section-action" onclick="goSection('plays')">Voir tout →</button>
      </div>
      <div class="scroll-row">
        ${featuredPlays.map(pl => playTile(pl)).join('')}
      </div>

      <!-- 4. Mini stats persos (en arrière-plan, compact) -->
      ${lastStats ? `
        <div class="section-header">
          <div>
            <div class="eyebrow-muted">Dernier match · vs ${esc(myMatches[0].opponent)}</div>
            <h2 class="display-md mt-2" style="font-size:18px;color:var(--ink-2)">Mes stats</h2>
          </div>
        </div>
        <div class="stat-grid mb-3">
          <div class="stat-tile">
            <div class="stat-tile-label">PTS</div>
            <div class="stat-tile-value" style="font-size:24px">${lastStats.pts || 0}</div>
            <div class="stat-tile-sub">${lastStats.min || 0} min</div>
          </div>
          <div class="stat-tile">
            <div class="stat-tile-label">REB · PD</div>
            <div class="stat-tile-value" style="font-size:24px">${lastStats.reb || 0}<span style="color:var(--ink-4)"> · ${lastStats.ast || 0}</span></div>
            <div class="stat-tile-sub">${myBadgesCount} trophée${myBadgesCount>1?'s':''}</div>
          </div>
        </div>
      ` : (myBadgesCount > 0 ? `
        <div style="padding:0 18px;margin-bottom:18px">
          <div onclick="openAllBadges()" style="padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);display:flex;align-items:center;gap:10px;cursor:pointer">
            <div style="font-size:28px">🏆</div>
            <div style="flex:1">
              <div style="font-family:'Anton';font-size:14px;text-transform:uppercase">Mon palmarès</div>
              <div style="font-size:11px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:2px;text-transform:uppercase">${myBadgesCount} trophée${myBadgesCount>1?'s':''}</div>
            </div>
            <div style="color:var(--orange);font-family:'Anton';font-size:18px">›</div>
          </div>
        </div>
      ` : '')}

      <!-- 5. Ressenti équipe (CTA discret) -->
      ${(() => {
        const myReviews = (state.teamReviews || []).filter(r => r.pid === p.id);
        const last = myReviews.length > 0 ? myReviews[myReviews.length - 1] : null;
        return `
          <div style="padding:0 18px;margin-bottom:18px">
            <div onclick="openTeamReview()" style="padding:12px 14px;background:var(--bg-2);border:1px dashed var(--border);border-radius:var(--radius);display:flex;align-items:center;gap:10px;cursor:pointer">
              <div style="font-size:22px">💭</div>
              <div style="flex:1;min-width:0">
                <div style="font-family:'Anton';font-size:13px;text-transform:uppercase;letter-spacing:0.02em">Mon ressenti équipe</div>
                <div style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono';margin-top:2px;text-transform:uppercase">${last ? 'Dernière : ' + formatDate(last.date, 'short') : 'Confidentiel · visible coach uniquement'}</div>
              </div>
              <div style="color:var(--orange);font-family:'Anton';font-size:16px">${last ? '✎' : '+'}</div>
            </div>
          </div>
        `;
      })()}
    </div>
  `;
}

  const active = (state.challenges || []).filter(c => !c.badgesAwarded);
  const finished = (state.challenges || []).filter(c => c.badgesAwarded);
  const myBadges = (p.badges || []).slice().sort((a,b) => (b.date || '').localeCompare(a.date || ''));

  return `
    <div class="fade-up">
      <div class="section-header">
        <div>
          <div class="eyebrow">${active.length} en cours · ${myBadges.length} trophée${myBadges.length>1?'s':''}</div>
          <h2 class="display-lg mt-2">Défis</h2>
        </div>
      </div>

      ${active.length > 0 ? `
        <div class="section-header"><div><div class="eyebrow">En cours</div><h2 class="display-md mt-2">Mes challenges</h2></div></div>
        <div style="padding:0 18px;display:flex;flex-direction:column;gap:8px;margin-bottom:18px">
          ${active.map(c => playerChallengeRow(c, p.id)).join('')}

      ` : `
        <div class="empty"><div class="empty-icon">🎯</div><div class="empty-title">Aucun défi actif</div><div class="empty-desc">Reviens plus tard, ton coach va en lancer.</div></div>

      ${myBadges.length > 0 ? `
        <div class="section-header">
          <div><div class="eyebrow">${myBadges.length} trophée${myBadges.length>1?'s':''}</div><h2 class="display-md mt-2">🏆 Mon palmarès</h2></div>
          ${myBadges.length > 5 ? `<button class="section-action" onclick="openAllBadges()">Tout →</button>` : ''}
        </div>
        <div style="padding:0 18px;display:flex;flex-direction:column;gap:6px;margin-bottom:18px">

        <div style="padding:0 18px;display:flex;flex-direction:column;gap:8px;margin-bottom:18px">

  `;
