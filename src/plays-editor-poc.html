<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Éditeur de plays — POC (jalon 3)</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  JALON 3 — temps (steps) · lecture animée · persistance · import/export
  ══════════════════════════════════════════════════════════════════════════
  Fichier toujours ISOLÉ de l'app (index.html) : aucun import de son code,
  aucun état partagé, aucune entité PbSync. Ce que le jalon 3 ajoute par
  rapport au jalon 2 :

    · les TEMPS (steps) — un play n'est plus une photo mais une suite de
      photos, chacune avec ses flèches ;
    · la LECTURE animée de ces temps (rAF, jamais setInterval) ;
    · la PERSISTANCE — brouillon local toutes les 5 s + publication dans la
      table `plays_v2` (migration 20260823_001) ;
    · l'IMPORT / EXPORT JSON, format d'échange atk-zone.

  ── UN TEMPS = UNE PHOTO + CE QUI SE PASSE PENDANT ────────────────────────
  Chaque temps porte SES PROPRES positions (`pos`) plutôt que de les dériver
  du temps précédent à la volée. C'est un choix, et il est motivé :

    · dériver imposerait de recalculer toute la suite à chaque geste, donc de
      reconstruire la scène pendant un drag — exactement ce que le jalon 2
      s'interdit pour tenir la fluidité sur iPhone ;
    · le coach range souvent un temps « à la main » sans vouloir qu'il découle
      mécaniquement du précédent (repositionner tout le monde après un rebond,
      par exemple). Une photo indépendante dit ça sans détour.

  Le prix : un temps peut DIVERGER de ce que produit le temps d'avant. On ne
  le cache pas — la vignette porte alors un point orange, et le bouton 🔄
  recale la photo sur la sortie du temps précédent. Un décalage visible et
  réparable vaut mieux qu'un recalcul silencieux qui écrase le travail.

  ── UNITÉS ────────────────────────────────────────────────────────────────
  1 unité SVG = 10 cm. Toutes les cotes viennent des dimensions officielles
  FIBA : terrain 28,00 × 15,00 m · raquette 4,90 m de large · ligne des
  lancers francs à 5,80 m de la ligne de fond · cercle des LF r = 1,80 m ·
  arc à 3 pts r = 6,75 m depuis l'axe du cercle · corners droits à 0,90 m des
  lignes de touche · cercle (panier) à 1,575 m du fond, r = 0,225 m · planche
  à 1,20 m du fond, largeur 1,80 m · zone de non-charge r = 1,25 m.

  MARGE — 12 unités (1,20 m) tout autour de l'aire de jeu : c'est l'espace
  hors terrain où se place la joueuse qui fait la remise en touche.

  ── MODÈLE vs VUE ─────────────────────────────────────────────────────────
  Le modèle ne connaît QUE des coordonnées terrain ; une vue n'est qu'une
  projection (project/unproject) plus un dessin de terrain. La 2D top-down est
  l'identité, la 3D (lecture seule, jalon 4+) se branchera dans le même
  registre sans toucher au moteur d'édition. L'ÉDITION reste 2D : viser un
  jeton en perspective avec un doigt est frustrant sur iPhone.

  UN MODÈLE PAR MODE (demi / plein) — les deux terrains n'ont pas le même
  repère : chaque mode garde SON jeu de temps. Basculer ne détruit jamais le
  travail en cours. C'est le mode ACTIF qui est publié / exporté.

  ── PERF iPhone ───────────────────────────────────────────────────────────
  Le drag ne reconstruit RIEN : il écrit un transform sur le <g> du jeton et
  réécrit le d= des seules flèches qui touchent ce jeton, une fois par frame
  (rAF). La LECTURE suit la même règle : elle prépare ses éléments une fois en
  entrant dans un temps, puis ne fait qu'écrire des attributs par frame. Aucun
  setInterval nulle part — un timer qui dérive ferait glisser l'animation dès
  que Safari met l'onglet en veille.

  ── SÉCURITÉ ──────────────────────────────────────────────────────────────
  La clé Supabase ci-dessous est la clé PUBLISHABLE, déjà publique dans
  index.html : elle est faite pour vivre dans du JS servi au navigateur. Aucun
  secret de service n'est présent dans ce fichier.
-->
<style>
  /* ── Thème : suit le système, surchargeable par le bouton 🌓 ─────────
     Accent primaire cyan #22D3EE (attaque, cohérent avec le format JSON des
     plays), accent secondaire violet #7B2FFF (défense + contrôles actifs). */
  :root{
    --bg:#F1F3F7; --panel:#FFFFFF; --ink:#0F131A; --ink-2:#5A6472;
    --border:#DCE1E9; --btn:#FFFFFF; --field:#F6F8FB;
    --accent-2:#7B2FFF; --accent-2-ink:#FFFFFF;
    --out-hi:#EDF0F5; --out-lo:#E1E6EE;    /* zone hors-jeu (remises en touche) */
    --court-hi:#F6EAD4; --court-lo:#E8D6B6; /* parquet, dégradé vertical */
    --line:#A98F66; --line-strong:#8A7048;  /* lignes du terrain */
    --hoop:#E4572E;
    --player:#22D3EE; --player-hi:#7BE7F7; --player-ink:#04252E;
    --def:#7B2FFF; --def-hi:#A87CFF; --def-ink:#FFFFFF; --def-line:#3D1180;
    --arw-atk:#0E9BB8; --arw-def:#7B2FFF; --arw-shot:#E4572E;
    --ball:#F97316; --ball-line:#7C2D12;
    --warn:#D97706; --ok:#0E9F6E; --err:#DC2626;
    --sheen:#FFFFFF; --scrim:rgba(9,12,18,.42);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#080B10; --panel:#121821; --ink:#E9EFF7; --ink-2:#8592A4;
      --border:#212936; --btn:#19212C; --field:#0D131B;
      --accent-2:#9B5CFF; --accent-2-ink:#0B0616;
      --out-hi:#141B25; --out-lo:#0D1219;
      --court-hi:#222B37; --court-lo:#161D26;
      --line:#55647A; --line-strong:#70819A;
      --hoop:#F2703F;
      --player:#22D3EE; --player-hi:#8FEEFB; --player-ink:#04252E;
      --def:#8B4CFF; --def-hi:#B78EFF; --def-ink:#FFFFFF; --def-line:#2B0A5E;
      --arw-atk:#38D9F0; --arw-def:#A87CFF; --arw-shot:#F2703F;
      --ball:#FB923C; --ball-line:#431407;
      --warn:#F59E0B; --ok:#34D399; --err:#F87171;
      --sheen:#FFFFFF; --scrim:rgba(0,0,0,.6);
    }
  }
  html[data-theme="light"]{
    --bg:#F1F3F7; --panel:#FFFFFF; --ink:#0F131A; --ink-2:#5A6472;
    --border:#DCE1E9; --btn:#FFFFFF; --field:#F6F8FB;
    --accent-2:#7B2FFF; --accent-2-ink:#FFFFFF;
    --out-hi:#EDF0F5; --out-lo:#E1E6EE; --court-hi:#F6EAD4; --court-lo:#E8D6B6;
    --line:#A98F66; --line-strong:#8A7048; --hoop:#E4572E; --player-hi:#7BE7F7;
    --def:#7B2FFF; --def-hi:#A87CFF; --def-ink:#FFFFFF; --def-line:#3D1180;
    --arw-atk:#0E9BB8; --arw-def:#7B2FFF; --arw-shot:#E4572E;
    --ball:#F97316; --ball-line:#7C2D12;
    --warn:#D97706; --ok:#0E9F6E; --err:#DC2626; --scrim:rgba(9,12,18,.42);
  }
  html[data-theme="dark"]{
    --bg:#080B10; --panel:#121821; --ink:#E9EFF7; --ink-2:#8592A4;
    --border:#212936; --btn:#19212C; --field:#0D131B;
    --accent-2:#9B5CFF; --accent-2-ink:#0B0616;
    --out-hi:#141B25; --out-lo:#0D1219; --court-hi:#222B37; --court-lo:#161D26;
    --line:#55647A; --line-strong:#70819A; --hoop:#F2703F; --player-hi:#8FEEFB;
    --def:#8B4CFF; --def-hi:#B78EFF; --def-ink:#FFFFFF; --def-line:#2B0A5E;
    --arw-atk:#38D9F0; --arw-def:#A87CFF; --arw-shot:#F2703F;
    --ball:#FB923C; --ball-line:#431407;
    --warn:#F59E0B; --ok:#34D399; --err:#F87171; --scrim:rgba(0,0,0,.6);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex; flex-direction:column; height:100dvh;
    /* Rien ne doit scroller : le drag ne doit jamais entrer en concurrence
       avec le scroll/bounce iOS. */
    overflow:hidden; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header{
    display:flex; align-items:center; gap:8px; padding:8px 10px;
    background:var(--panel); border-bottom:1px solid var(--border); flex:none;
  }
  header .title{font-size:13px; font-weight:700; letter-spacing:.02em; flex:1; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  header .sub{font-size:10px; color:var(--ink-2); font-weight:500}
  .btn{
    appearance:none; border:1px solid var(--border); background:var(--btn);
    color:var(--ink); border-radius:10px; padding:0 12px; min-height:38px;
    font-size:13px; font-weight:600; cursor:pointer; touch-action:manipulation;
    transition:background .12s ease, border-color .12s ease, color .12s ease;
    white-space:nowrap;
  }
  .btn.on{
    background:var(--accent-2); color:var(--accent-2-ink);
    border-color:var(--accent-2); box-shadow:0 2px 10px -3px var(--accent-2);
  }
  .btn:disabled{opacity:.35; cursor:default; box-shadow:none}
  .btn.sm{min-height:34px; padding:0 9px; font-size:12px}
  .btn.xs{min-height:30px; padding:0 8px; font-size:11px; border-radius:8px}
  .btn.wide{width:100%; justify-content:center; text-align:left; padding:0 14px}
  .btn.danger{color:var(--err)}
  .bar{
    display:flex; align-items:center; gap:6px; padding:6px 8px; flex:none;
    flex-wrap:wrap; border-bottom:1px solid var(--border); background:var(--panel);
  }
  .seg{display:flex; gap:4px}
  .sep{width:1px; align-self:stretch; background:var(--border); margin:2px 1px}
  /* Encart d'info : compteurs du schéma + FPS mesuré pendant le drag/lecture. */
  .badge{
    margin-left:auto; display:flex; gap:8px; align-items:center;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px;
    color:var(--ink-2); white-space:nowrap;
  }
  .badge b{color:var(--ink); font-weight:700}
  .stage{flex:1; min-height:0; padding:5px 8px; display:flex}
  svg#court{
    width:100%; height:100%; display:block;
    /* CLÉ iPhone : coupe scroll, pinch et double-tap-zoom sur toute la
       surface du terrain, sinon Safari « vole » le geste au 1er mouvement. */
    touch-action:none;
  }

  /* ── Dégradés (les attributs SVG n'acceptent pas var(), on passe par CSS) */
  #gOut .a{stop-color:var(--out-hi)}     #gOut .b{stop-color:var(--out-lo)}
  #gFloor .a{stop-color:var(--court-hi)} #gFloor .b{stop-color:var(--court-lo)}
  #gDisc .a{stop-color:var(--player-hi)} #gDisc .b{stop-color:var(--player)}
  #gDef .a{stop-color:var(--def-hi)}     #gDef .b{stop-color:var(--def)}
  #gBall .a{stop-color:var(--ball)}      #gBall .b{stop-color:var(--ball-line)}
  #gSheen .a{stop-color:var(--sheen); stop-opacity:.13}
  #gSheen .b{stop-color:var(--sheen); stop-opacity:0}
  #gShadow .a{stop-color:#000; stop-opacity:.34}
  #gShadow .b{stop-color:#000; stop-opacity:.14}
  #gShadow .c{stop-color:#000; stop-opacity:0}

  .out{fill:url(#gOut)}
  .court{fill:url(#gFloor)}
  .sheen{fill:url(#gSheen); pointer-events:none}
  /* Lignes fines : le trait « premium » vient de la finesse + du dégradé
     de fond, pas d'un contour épais. */
  .ln{fill:none; stroke:var(--line); stroke-width:.62; stroke-linecap:round}
  .ln.strong{stroke:var(--line-strong); stroke-width:.95}
  .hp{fill:none; stroke:var(--hoop); stroke-width:1.15; stroke-linecap:round}

  /* ── Flèches ───────────────────────────────────────────────────────── */
  .arw .body{fill:none; stroke-linecap:round; stroke-linejoin:round; pointer-events:none}
  .arw .head{stroke:none; pointer-events:none}
  /* Zone de saisie invisible et large : sur iPhone, un trait de 1,4 unité
     est intouchable au doigt. pointer-events:stroke ne capte QUE le tracé. */
  .arw .hit{fill:none; stroke:transparent; stroke-width:9; pointer-events:stroke; cursor:pointer}
  .arw.atk .body, .arw.atk .head{stroke:var(--arw-atk); fill:var(--arw-atk)}
  .arw.def .body, .arw.def .head{stroke:var(--arw-def); fill:var(--arw-def)}
  .arw.shot .body, .arw.shot .head{stroke:var(--arw-shot); fill:var(--arw-shot)}
  .arw .body{stroke-width:1.45}
  /* Passe = trait pointillé (convention basket). Le tiret est exprimé en
     unités terrain, donc il garde la même densité dans les deux modes. */
  .arw.pass .body{stroke-width:1.25; stroke-dasharray:3.4 2.8}
  .arw.shot .body{stroke-width:1.35; stroke-dasharray:5.5 3}
  .arw .wp{fill:var(--panel); stroke:var(--ink-2); stroke-width:.5; pointer-events:none}
  /* Zone de saisie du waypoint : le disque dessiné est petit, la cible ne
     doit pas l'être (même raison que .hit sur le tracé). */
  .arw .wphit{fill:transparent; pointer-events:all; cursor:grab}
  /* En mode gomme, on annonce la cible au survol/au doigt. */
  body[data-tool="erase"] .arw .body{opacity:.9}
  body[data-tool="erase"] .arw:hover .body{stroke:var(--hoop)}
  body[data-tool="erase"] .arw:hover .head{fill:var(--hoop)}
  body[data-tool="erase"] .arw .wp{stroke:var(--hoop); stroke-width:.9}
  /* Les waypoints ne sont manipulables qu'en sélection et en gomme (poser,
     déplacer, retirer) — pendant un tracé de flèche ils ne feraient que gêner. */
  body[data-tool="move"] .arw .wp, body[data-tool="pass"] .arw .wp,
  body[data-tool="shot"] .arw .wp{display:none}
  body[data-tool="move"] .arw .wphit, body[data-tool="pass"] .arw .wphit,
  body[data-tool="shot"] .arw .wphit{display:none}

  .token{cursor:grab}
  /* Ombre PEINTE (ellipse en dégradé radial) plutôt qu'un filter CSS : un
     drop-shadow se recalcule à chaque frame et coûte cher sur iPhone, alors
     que cette ellipse suit le jeton gratuitement dans le même transform. */
  .token .sh{fill:url(#gShadow); pointer-events:none}
  .token .disc{fill:url(#gDisc); stroke:var(--player-ink); stroke-width:.55}
  .token.def .disc{fill:url(#gDef); stroke:var(--def-line); stroke-width:.55}
  .token .halo{
    fill:none; stroke:var(--accent-2); stroke-width:1.6; opacity:0;
    pointer-events:none;
  }
  /* Les défenseurs SONT violets : leur halo doit contraster, donc cyan. */
  .token.def .halo{stroke:var(--player)}
  .token .num{
    fill:var(--player-ink); font-weight:800; text-anchor:middle;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif; pointer-events:none;
  }
  .token.def .num{fill:var(--def-ink)}
  .token .ball{display:none; pointer-events:none}
  .token.has-ball .ball{display:block}
  .token .ball .b{fill:url(#gBall); stroke:var(--ball-line); stroke-width:.4}
  .token .ball .s{fill:none; stroke:var(--ball-line); stroke-width:.35; stroke-linecap:round}
  /* Sélection : la joueuse active prend le halo, les autres reculent d'un
     cran (80 %). Une opacité, pas un filtre : gratuit au compositing. */
  .token.active .halo{opacity:.9}
  #lay-tok.has-active .token:not(.active){opacity:.8}
  /* Retour visuel au doigt : halo violet, aucune transition (une transition
     ajouterait de la latence perçue pendant le déplacement). */
  .token.drag{cursor:grabbing}
  .token.drag .halo{opacity:.85}
  .token.drag .disc{stroke-width:.9}
  /* Source d'une flèche en cours de tracé : halo qui respire. */
  .token.pending .halo{opacity:.95; animation:pulse .9s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}

  /* ── Couche de LECTURE ──────────────────────────────────────────────── */
  body.playing .token{cursor:default}
  body.playing #lay-arw{display:none}
  #lay-play{pointer-events:none}
  #lay-play .trail{fill:none; stroke:var(--arw-atk); stroke-width:1.1; opacity:.35;
    stroke-linecap:round; pointer-events:none}
  #lay-play .trail.def{stroke:var(--arw-def)}
  #lay-play .pline{fill:none; stroke:var(--arw-atk); stroke-width:1.25;
    stroke-dasharray:3.4 2.8; stroke-linecap:round; pointer-events:none}
  #lay-play .sline{fill:none; stroke:var(--arw-shot); stroke-width:1.35;
    stroke-dasharray:5.5 3; stroke-linecap:round; pointer-events:none}
  #lay-play .spulse{fill:none; stroke:var(--arw-shot); stroke-width:1.5; pointer-events:none}
  #lay-play .fb .b{fill:url(#gBall); stroke:var(--ball-line); stroke-width:.4}
  #lay-play .fb .s{fill:none; stroke:var(--ball-line); stroke-width:.35; stroke-linecap:round}

  /* ── Timeline des temps ─────────────────────────────────────────────── */
  .tl{
    flex:none; display:flex; align-items:center; gap:6px; padding:5px 8px;
    background:var(--panel); border-top:1px solid var(--border);
  }
  .tl-scroll{
    flex:1; min-width:0; display:flex; gap:6px; overflow-x:auto; overflow-y:hidden;
    padding:2px; scrollbar-width:none; -webkit-overflow-scrolling:touch;
    touch-action:pan-x;
  }
  .tl-scroll::-webkit-scrollbar{display:none}
  .chip{
    position:relative; flex:none; width:46px; height:42px; border-radius:10px;
    border:1px solid var(--border); background:var(--btn); color:var(--ink-2);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:14px; font-weight:800; cursor:pointer; touch-action:none;
    transition:background .12s ease, border-color .12s ease, color .12s ease;
  }
  .chip .mini{font-size:8px; font-weight:600; letter-spacing:.04em; opacity:.75;
    line-height:1.1; margin-top:1px}
  .chip.on{background:var(--accent-2); color:var(--accent-2-ink); border-color:var(--accent-2)}
  .chip.grab{opacity:.55; transform:scale(1.06); z-index:2}
  /* Point orange : la photo de ce temps ne découle pas du temps précédent
     (cf. en-tête). Ce n'est pas une erreur, juste une information. */
  .chip.desync::after{
    content:''; position:absolute; top:3px; left:3px; width:6px; height:6px;
    border-radius:50%; background:var(--warn);
  }
  .chip .x{
    position:absolute; top:-6px; right:-6px; width:20px; height:20px; display:none;
    border-radius:50%; border:1px solid var(--border); background:var(--panel);
    color:var(--err); font-size:12px; font-weight:800; line-height:1;
    align-items:center; justify-content:center; padding:0; cursor:pointer;
  }
  .chip.on .x{display:flex}

  /* ── Barre de lecture ───────────────────────────────────────────────── */
  .pb{border-top:1px solid var(--border); border-bottom:none; padding:5px 8px; gap:5px}
  .prog{
    flex:1; min-width:60px; height:22px; display:flex; align-items:center;
    cursor:pointer; touch-action:none;
  }
  .prog .track{width:100%; height:5px; border-radius:3px; background:var(--field);
    border:1px solid var(--border); overflow:hidden}
  .prog .fill{height:100%; width:0; background:var(--accent-2); border-radius:3px}
  select.sel{
    appearance:none; border:1px solid var(--border); background:var(--btn);
    color:var(--ink); border-radius:9px; min-height:34px; font-size:12px;
    font-weight:600; padding:0 22px 0 8px; cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),
                     linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
    background-position:calc(100% - 12px) 50%, calc(100% - 8px) 50%;
    background-size:4px 4px, 4px 4px; background-repeat:no-repeat;
  }

  .hint{
    flex:none; margin:0; padding:4px 12px 7px; font-size:11px; line-height:1.45;
    color:var(--ink-2); text-align:center; min-height:28px;
    background:var(--panel); border-top:1px solid var(--border);
  }
  .hint b{color:var(--ink)}

  /* ── Bandeau brouillon ──────────────────────────────────────────────── */
  .draft{
    flex:none; display:none; align-items:center; gap:8px; padding:8px 10px;
    background:var(--field); border-bottom:1px solid var(--border); font-size:12px;
  }
  .draft.show{display:flex}
  .draft span{flex:1; min-width:0}

  /* ── Feuilles (métadonnées, plays, menu) ────────────────────────────── */
  .scrim{
    position:fixed; inset:0; background:var(--scrim); z-index:40; display:none;
    -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
  }
  .scrim.show{display:block}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:41; display:none;
    background:var(--panel); border-top:1px solid var(--border);
    border-radius:16px 16px 0 0; padding:12px 12px calc(12px + env(safe-area-inset-bottom));
    max-height:82dvh; overflow-y:auto; -webkit-overflow-scrolling:touch;
    box-shadow:0 -8px 30px -12px rgba(0,0,0,.4);
  }
  .sheet.show{display:block}
  .sheet h2{margin:2px 0 10px; font-size:14px; font-weight:800}
  .sheet .row{display:flex; gap:6px; margin-bottom:8px}
  .sheet .row .btn{flex:1}
  .fld{margin-bottom:9px}
  .fld label{display:block; font-size:11px; font-weight:700; color:var(--ink-2); margin-bottom:3px}
  .fld input, .fld textarea, .fld select{
    width:100%; background:var(--field); border:1px solid var(--border);
    color:var(--ink); border-radius:9px; padding:9px 10px; font-size:13px;
    font-family:inherit; -webkit-user-select:text; user-select:text; outline:none;
  }
  .fld textarea{resize:vertical; min-height:64px; line-height:1.5}
  .fld .note{font-size:10px; color:var(--ink-2); margin-top:3px}
  .fld input:focus, .fld textarea:focus, .fld select:focus{border-color:var(--accent-2)}
  .plist{display:flex; flex-direction:column; gap:6px}
  .pitem{
    display:flex; align-items:center; gap:9px; padding:9px 10px; cursor:pointer;
    border:1px solid var(--border); background:var(--btn); border-radius:10px;
  }
  .pitem .dot{width:9px; height:9px; border-radius:50%; flex:none; background:var(--player)}
  .pitem .t{flex:1; min-width:0}
  .pitem .t b{display:block; font-size:13px; font-weight:700;

  /* ── Toast ──────────────────────────────────────────────────────────── */
  .toast{
    position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(14px); z-index:50; opacity:0;
    background:var(--panel); border:1px solid var(--border); border-radius:11px;
    padding:9px 14px; font-size:12px; font-weight:600; pointer-events:none;
    box-shadow:0 8px 26px -12px rgba(0,0,0,.5); max-width:88vw; text-align:center;
    transition:opacity .18s ease, transform .18s ease;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

</style>

<script>
(function () {
  'use strict';

  // ─────────────────────────────────────────────────────────────────────
  // 0. VUES — 2D aujourd'hui, 3D au jalon 4+
  // ─────────────────────────────────────────────────────────────────────
  // SÉPARATION VOULUE : le modèle (positions des jetons, points des flèches)
  // vit TOUJOURS en « coordonnées terrain » — origine au coin haut-gauche de
  // la zone hors-jeu, 1 unité = 10 cm. Une vue n'est qu'une projection de ces
  // coordonnées vers la scène + un dessin de terrain.
  //
  //   project(p)   coordonnées terrain → coordonnées de la scène (dessin)
  //   unproject(p) coordonnées de la scène → coordonnées terrain (drag)
  //
  // En 2D top-down les deux sont l'identité, mais TOUT le code d'édition
  // (drag, clamp, tracé des flèches, pose du ballon) et TOUTE la lecture
  // animée passent déjà par elles : brancher une 3D au jalon 4 ne touchera pas
  // au moteur d'édition.
  var VIEWS = {
    '2d': {
      label: '2D', ready: true, editable: true,
      project:   function (p) { return { x: p.x, y: p.y }; },
      unproject: function (p) { return { x: p.x, y: p.y }; },
      court:     function (m) { return m === 'half' ? halfCourt() : fullCourt(); }
    },
    '3d': {
      label: '3D', ready: false, editable: false,
      project: null, unproject: null, court: null
    }
  };
  var view = '2d';

  // ─────────────────────────────────────────────────────────────────────
  // 1. GÉOMÉTRIE DU TERRAIN (1 unité = 10 cm)
  // ─────────────────────────────────────────────────────────────────────
  var R3 = 67.5;           // rayon arc 3 pts (6,75 m)
  // Écart entre le centre du cercle et le raccord de l'arc sur la ligne
  // droite du corner : √(R3² − (demi-largeur − 0,90 m)²) ≈ 14,15
  var JOIN = Math.sqrt(R3 * R3 - 66 * 66);

  var MODES = {
    // Demi-terrain vertical (panier en haut) — orientation naturelle sur iPhone.
    half: { vb: '0 0 174 164', w: 174, h: 164, hoop: { x: 87, y: 27.75 } },
    // Terrain complet horizontal (deux paniers, on attaque à droite).
    full: { vb: '0 0 304 174', w: 304, h: 174, hoop: { x: 276.25, y: 87 } }
  };

  // Dispositions de départ. Attaque en 2-1-2 face au panier, défense en
  // miroir intercalée entre l'attaque et le cercle : c'est juste un point de
  // départ raisonnable, le coach ré-arrange tout au doigt.
  // ⚠️ Contrainte de départ : deux jetons ne doivent JAMAIS se chevaucher à
  // l'ouverture, sinon on ne peut pas attraper celui du dessous au doigt. Le
  // diamètre d'un jeton vaut w/9,5 unités, soit ~18,3 en demi-terrain mais
  // ~32 en terrain plein : les écarts du plein sont donc BEAUCOUP plus larges
  // que ceux du demi, ce n'est pas une coquille.
  var LAYOUT = {
    half: {
      atk: [ {x:87,y:112}, {x:33,y:96},  {x:141,y:96},  {x:52,y:50},  {x:122,y:50} ],
      def: [ {x:87,y:90},  {x:46,y:78},  {x:128,y:78},  {x:64,y:33},  {x:110,y:33} ]
    },
    full: {
      atk: [ {x:140,y:87}, {x:168,y:30}, {x:168,y:144}, {x:228,y:48},  {x:228,y:126} ],
      def: [ {x:174,y:87}, {x:202,y:24}, {x:202,y:150}, {x:262,y:48},  {x:262,y:126} ]
    }
  };

  // Les 10 jetons sont FIXES et communs à tous les temps : seule leur position
  // change d'un temps à l'autre. Les garder statiques permet à une flèche de
  // référencer une joueuse par son id sans se soucier du temps courant.
  var TOKENS = (function () {
    var t = [], i;
    for (i = 1; i <= 5; i++) t.push({ id: 'a' + i, side: 'atk', n: i });
    for (i = 1; i <= 5; i++) t.push({ id: 'd' + i, side: 'def', n: i });
    return t;
  })();
  var TOKMAP = (function () { var m = {}, i; for (i = 0; i < TOKENS.length; i++) m[TOKENS[i].id] = TOKENS[i]; return m; })();

  function defs() {
    return '<defs>'
      + '<linearGradient id="gOut" x1="0" y1="0" x2="0" y2="1"><stop class="a" offset="0"/><stop class="b" offset="1"/></linearGradient>'
      + '<linearGradient id="gFloor" x1="0" y1="0" x2="0" y2="1"><stop class="a" offset="0"/><stop class="b" offset="1"/></linearGradient>'
      + '<linearGradient id="gDisc" x1="0" y1="0" x2="0" y2="1"><stop class="a" offset="0"/><stop class="b" offset="1"/></linearGradient>'
      + '<linearGradient id="gDef" x1="0" y1="0" x2="0" y2="1"><stop class="a" offset="0"/><stop class="b" offset="1"/></linearGradient>'
      + '<linearGradient id="gBall" x1="0" y1="0" x2="0" y2="1"><stop class="a" offset="0"/><stop class="b" offset="1"/></linearGradient>'
      + '<radialGradient id="gSheen" cx="50%" cy="34%" r="72%"><stop class="a" offset="0"/><stop class="b" offset="1"/></radialGradient>'
      + '<radialGradient id="gShadow"><stop class="a" offset="0"/><stop class="b" offset="0.6"/><stop class="c" offset="1"/></radialGradient>'
      + '</defs>';
  }

  function halfCourt() {
    return ''
      + '<rect class="out" x="0" y="0" width="174" height="164"/>'
      + '<rect class="court" x="12" y="12" width="150" height="140"/>'
      // Limites de l'aire de jeu (fond + touches) et ligne médiane.
      + '<rect class="ln strong" x="12" y="12" width="150" height="140"/>'
      + '<line class="ln strong" x1="12" y1="152" x2="162" y2="152"/>'
      // Demi cercle central (l'autre moitié est hors du demi-terrain).
      + '<path class="ln" d="M 69 152 A 18 18 0 0 1 105 152"/>'
      // Raquette 4,90 m (x 62,5 → 111,5) profonde de 5,80 m + cercle des LF.
      + '<rect class="ln" x="62.5" y="12" width="49" height="58"/>'
      + '<circle class="ln" cx="87" cy="70" r="18"/>'
      // Arc à 3 pts : corners droits puis arc de 6,75 m autour du panier.
      + '<path class="ln" d="M 21 12 L 21 ' + f(27.75 + JOIN) + ' A 67.5 67.5 0 0 0 153 ' + f(27.75 + JOIN) + ' L 153 12"/>'
      // Zone de non-charge (1,25 m).
      + '<path class="ln" d="M 74.5 27.75 A 12.5 12.5 0 0 0 99.5 27.75"/>'
      // Planche + cercle.
      + '<line class="hp" x1="78" y1="24" x2="96" y2="24"/>'
      + '<line class="hp" x1="87" y1="24" x2="87" y2="25.5"/>'
      + '<circle class="hp" cx="87" cy="27.75" r="2.25"/>'
      // Voile lumineux : donne du relief au parquet sans coûter une frame.
      + '<rect class="sheen" x="12" y="12" width="150" height="140"/>';
  }

  function fullCourt() {
    var j = f(27.75 + JOIN), jr = f(276.25 - JOIN);   // raccords arc/corner
    return ''
      + '<rect class="out" x="0" y="0" width="304" height="174"/>'
      + '<rect class="court" x="12" y="12" width="280" height="150"/>'
      + '<rect class="ln strong" x="12" y="12" width="280" height="150"/>'
      + '<line class="ln strong" x1="152" y1="12" x2="152" y2="162"/>'
      + '<circle class="ln" cx="152" cy="87" r="18"/>'
      // ── Panier gauche ────────────────────────────────────────────────
      + '<rect class="ln" x="12" y="62.5" width="58" height="49"/>'
      + '<circle class="ln" cx="70" cy="87" r="18"/>'
      + '<path class="ln" d="M 12 21 L ' + j + ' 21 A 67.5 67.5 0 0 1 ' + j + ' 153 L 12 153"/>'
      + '<path class="ln" d="M 27.75 74.5 A 12.5 12.5 0 0 1 27.75 99.5"/>'
      + '<line class="hp" x1="24" y1="78" x2="24" y2="96"/>'
      + '<line class="hp" x1="24" y1="87" x2="25.5" y2="87"/>'
      + '<circle class="hp" cx="27.75" cy="87" r="2.25"/>'
      // ── Panier droit (miroir) ────────────────────────────────────────
      + '<rect class="ln" x="234" y="62.5" width="58" height="49"/>'
      + '<circle class="ln" cx="234" cy="87" r="18"/>'
      + '<path class="ln" d="M 292 21 L ' + jr + ' 21 A 67.5 67.5 0 0 0 ' + jr + ' 153 L 292 153"/>'
      + '<path class="ln" d="M 276.25 74.5 A 12.5 12.5 0 0 0 276.25 99.5"/>'
      + '<line class="hp" x1="280" y1="78" x2="280" y2="96"/>'
      + '<line class="hp" x1="280" y1="87" x2="278.5" y2="87"/>'
      + '<circle class="hp" cx="276.25" cy="87" r="2.25"/>'
      + '<rect class="sheen" x="12" y="12" width="280" height="150"/>';
  }

  function f(n) { return Math.round(n * 100) / 100; }

  // ─────────────────────────────────────────────────────────────────────
  // 2. MODÈLE
  // ─────────────────────────────────────────────────────────────────────
  // doc = le play complet.
  //   métadonnées   id, title, tag, side, color, description, points, author
  //   ballStart     id du jeton porteur au temps 0 (un seul), ou null
  //   defOn         la défense est-elle montrée ?
  //   mode          'half' | 'full' — le mode ACTIF, celui qui sera publié
  //   half / full   { steps: [ … ] } — un jeu de temps par mode (cf. en-tête)
  //
  // Un TEMPS =
  //   pos   { idJeton : {x,y} }  la photo au DÉBUT du temps
  //   arw   [ {id, kind:'move'|'pass', from:<idJeton>,
  //            to:<idJeton>|{x,y}, via:[{x,y}…]} ]
  //   shot  <idJeton> | null     qui tire à la fin du temps
  //   note  texte libre
  //
  // La défense EXISTE toujours dans le modèle : le toggle ne fait que la
  // montrer ou la cacher, donc couper puis rallumer la défense ne perd ni les
  // positions ni les flèches qui la touchent.
  var seq = 0;               // compteur d'ids (flèches, temps) unique par session

  function uid(p) { return p + (++seq) + '-' + Math.random().toString(36).slice(2, 6); }

  function startPos(m) {
    var p = {}, i;
    for (i = 0; i < 5; i++) { p['a' + (i+1)] = { x: LAYOUT[m].atk[i].x, y: LAYOUT[m].atk[i].y }; }
    for (i = 0; i < 5; i++) { p['d' + (i+1)] = { x: LAYOUT[m].def[i].x, y: LAYOUT[m].def[i].y }; }
    return p;
  }
  function clonePos(p) { var o = {}, k; for (k in p) o[k] = { x: p[k].x, y: p[k].y }; return o; }

  function makeStep(pos) { return { id: uid('s'), pos: pos, arw: [], shot: null, note: '' }; }

  function makeDoc() {
    return {
      id: null, title: '', tag: '', side: 'attaque', color: '#22D3EE',
      description: '', points: '', author: '',
      ballStart: 'a1', defOn: false, mode: 'half',
      half: { steps: [ makeStep(startPos('half')) ] },
      full: { steps: [ makeStep(startPos('full')) ] }
    };
  }

  var doc = makeDoc();
  var cur = 0;               // index du temps en cours d'édition

  var svg   = document.getElementById('court');
  var elArw = document.getElementById('i-arw');
  var elTok = document.getElementById('i-tok');
  var elBal = document.getElementById('i-ball');
  var elFps = document.getElementById('fps');
  var elHint= document.getElementById('hint');

  var tool  = 'select';
  var active  = null;        // id du jeton sélectionné (halo violet)
  var pending = null;        // id du jeton source d'une flèche en cours

  var PR = 0;                // rayon du jeton en unités terrain
  var layC = null, layA = null, layT = null, layP = null, layM = null;
  var tokEl = {};            // id jeton  → <g>
  var arwEl = {};            // id flèche → { g, body, hit, head }

  function mode() { return doc.mode; }
  function steps() { return doc[doc.mode].steps; }
  function step() { return steps()[cur] || steps()[0]; }
  function pos() { return step().pos; }
  function hoop() { return MODES[mode()].hoop; }

  // Un jeton « live » : identité statique + position du temps courant. Les
  // écritures passent TOUJOURS par pos()[id], jamais par cet objet jetable.
  function tokById(id, p) {
    var t = TOKMAP[id];
    if (!t) return null;
    var q = (p || pos())[id];
    if (!q) return null;
    return { id: t.id, side: t.side, n: t.n, x: q.x, y: q.y };
  }
  function visible(t) { return !!t && (t.side === 'atk' || doc.defOn); }
  // Une flèche n'est rendue (ni comptée) que si ses deux extrémités le sont.
  function arwVisible(a) {
    if (!visible(tokById(a.from))) return false;
    if (typeof a.to === 'string' && !visible(tokById(a.to))) return false;
    return true;
  }

  // Le jeton doit rester ~40 px de diamètre à l'écran quel que soit le mode :
  // on l'exprime donc en fraction de la largeur du viewBox (qui, lui, est
  // toujours mis à l'échelle sur la largeur disponible).
  function radiusFor(m) { return MODES[m].w / 19; }

  // Sortie d'un temps = sa photo à laquelle on applique ses déplacements.
  // Sert à fabriquer le temps suivant et à détecter les décalages.
  function endPos(st) {
    var p = clonePos(st.pos), i, a;
    for (i = 0; i < st.arw.length; i++) {
      a = st.arw[i];
      if (a.kind !== 'move') continue;
      var d = typeof a.to === 'string' ? p[a.to] : a.to;
      if (d && p[a.from]) p[a.from] = { x: d.x, y: d.y };
    }
    return p;
  }
  function samePos(p, q) {
    var k;
    for (k in p) { if (!q[k]) return false; if (Math.abs(p[k].x - q[k].x) > 0.5 || Math.abs(p[k].y - q[k].y) > 0.5) return false; }
    return true;
  }
  function desynced(i) { return i > 0 && !samePos(steps()[i].pos, endPos(steps()[i - 1])); }

  // Porteuse du ballon au DÉBUT du temps i : on repart de doc.ballStart et on
  // suit les passes. Dérivé, jamais stocké — une passe supprimée se répercute
  // donc immédiatement sur tous les temps qui suivent.
  function holderAt(i) {
    var h = doc.ballStart, k, j, st;
    for (k = 0; k < i && k < steps().length; k++) {
      st = steps()[k];
      for (j = 0; j < st.arw.length; j++)
        if (st.arw[j].kind === 'pass' && typeof st.arw[j].to === 'string') h = st.arw[j].to;
      if (st.shot) h = null;   // après un tir, plus personne ne tient la balle
    }
    return h;
  }
  function passOf(st) {
    var j;
    for (j = 0; j < st.arw.length; j++) if (st.arw[j].kind === 'pass') return st.arw[j];
    return null;
  }

  // ─────────────────────────────────────────────────────────────────────
  // 3. RENDU — couches reconstruites séparément
  // ─────────────────────────────────────────────────────────────────────
  // terrain (jamais retouché hors changement de mode/vue) · flèches · jetons ·
  // lecture. Le drag n'écrit que des attributs, il ne reconstruit rien.
  function drawAll() {
    PR = radiusFor(mode());
    svg.setAttribute('viewBox', MODES[mode()].vb);
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    svg.innerHTML = defs()
      + '<g id="lay-court">' + VIEWS[view].court(mode()) + '</g>'
      + '<g id="lay-arw"></g><g id="lay-tok"></g><g id="lay-play"></g>'
      // Couche de MESURE : des <path> jamais peints, uniquement là pour que
      // getPointAtLength() nous donne la position d'une joueuse le long de sa
      // courbe pendant la lecture. Native, exacte, et ça évite de ré-implémenter
      // l'échantillonnage d'une Catmull-Rom à la main.
      + '<g id="lay-meas" style="display:none"></g>';
    layC = document.getElementById('lay-court');
    layA = document.getElementById('lay-arw');
    layT = document.getElementById('lay-tok');
    layP = document.getElementById('lay-play');
    layM = document.getElementById('lay-meas');
    drawTokens();
    drawArrows();
    syncInfo();
  }

  function tokenMarkup(t) {
    var lbl = t.side === 'atk' ? String(t.n) : 'X' + t.n;
    var fs  = t.side === 'atk' ? PR * 1.05 : PR * 0.82;
    var br  = PR * 0.44, bx = PR * 0.82, by = -PR * 0.78;
    return '<g class="token ' + t.side + '" data-id="' + t.id + '">'
      + '<ellipse class="sh" cx="0" cy="' + f(PR * 0.46) + '" rx="' + f(PR * 1.02) + '" ry="' + f(PR * 0.52) + '"/>'
      + '<circle class="disc" cx="0" cy="0" r="' + f(PR) + '"/>'
      + '<circle class="halo" cx="0" cy="0" r="' + f(PR + 1.6) + '"/>'
      + '<text class="num" x="0" y="0" dy="0.35em" font-size="' + f(fs) + '">' + lbl + '</text>'
      // Ballon : petit disque orange collé en haut à droite du chiffre, avec
      // deux coutures. Masqué par CSS tant que le jeton n'a pas .has-ball.
      + '<g class="ball">'
      +   '<circle class="b" cx="' + f(bx) + '" cy="' + f(by) + '" r="' + f(br) + '"/>'
      +   '<line class="s" x1="' + f(bx - br) + '" y1="' + f(by) + '" x2="' + f(bx + br) + '" y2="' + f(by) + '"/>'
      +   '<line class="s" x1="' + f(bx) + '" y1="' + f(by - br) + '" x2="' + f(bx) + '" y2="' + f(by + br) + '"/>'
      + '</g>'
      + '</g>';
  }

  function drawTokens() {
    var html = '', i, t;
    for (i = 0; i < TOKENS.length; i++) {
      t = tokById(TOKENS[i].id);
      if (visible(t)) html += tokenMarkup(t);
    }
    layT.innerHTML = html;
    tokEl = {};
    var gs = layT.querySelectorAll('.token');
    for (i = 0; i < gs.length; i++) {
      var g = gs[i], id = g.getAttribute('data-id');
      tokEl[id] = g;
      placeToken(id);
      attachTokenPointer(g, id);
    }
    syncSelection();
    syncBall();
  }

  function placeToken(id, p) {
    var g = tokEl[id];
    if (!g) return;
    var q = p || pos()[id];
    if (!q) return;
    var s = VIEWS[view].project(q);   // terrain → scène (identité en 2D)
    // transform (composité) plutôt que cx/cy : moins de recalcul par frame,
    // et l'ombre peinte suit le jeton sans travail supplémentaire.
    g.setAttribute('transform', 'translate(' + f(s.x) + ' ' + f(s.y) + ')');
  }

  function syncSelection() {
    var id;
    for (id in tokEl) {
      tokEl[id].classList.toggle('active', id === active);
      tokEl[id].classList.toggle('pending', id === pending);
    }
    if (layT) layT.classList.toggle('has-active', !!(active && tokEl[active]));
    document.getElementById('b-ball').disabled = !(active && tokEl[active]) || playing;
  }

  // Le porteur affiché dépend du TEMPS COURANT : au temps 3 c'est la dernière
  // réceptionneuse, pas la porteuse du temps 0.
  function syncBall() {
    var h = holderAt(cur), id;
    for (id in tokEl) tokEl[id].classList.toggle('has-ball', id === h);
  }

  // ── Flèches ──────────────────────────────────────────────────────────
  // Points du modèle (source → waypoints → cible), en coordonnées terrain.
  function rawPts(a, p) {
    var src = tokById(a.from, p);
    if (!src) return null;
    var out = [{ x: src.x, y: src.y }], i, v = a.via || [];
    for (i = 0; i < v.length; i++) out.push({ x: v[i].x, y: v[i].y });
    var dst = typeof a.to === 'string' ? tokById(a.to, p) : a.to;
    if (!dst) return null;
    out.push({ x: dst.x, y: dst.y });
    return out;
  }

  // Rogne l'extrémité i vers son voisin : le trait part du BORD du jeton et
  // s'arrête au bord du jeton cible, jamais de centre à centre.
  function shrink(p, i, pad) {
    if (pad <= 0) return;
    var j = i === 0 ? 1 : i - 1;
    var dx = p[j].x - p[i].x, dy = p[j].y - p[i].y;
    var L = Math.sqrt(dx * dx + dy * dy);
    if (L < 0.01) return;
    if (L < pad + 0.6) pad = Math.max(0, L - 0.6);
    p[i] = { x: p[i].x + dx / L * pad, y: p[i].y + dy / L * pad };
  }

  // Tracé + angle de la pointe. Sans waypoint : segment droit. Avec : une
  // Catmull-Rom convertie en cubiques — le chemin passe EXACTEMENT par les
  // points posés par le coach, ce qu'une quadratique de contrôle ne fait pas
  // (avec une quadratique, le point posé au doigt ne serait qu'un point de
  // CONTRÔLE : la courbe passerait à côté, et le coach corrigerait à l'aveugle).
  function buildPath(p) {
    var i, d, last;
    if (p.length === 2) {
      return {
        d: 'M ' + f(p[0].x) + ' ' + f(p[0].y) + ' L ' + f(p[1].x) + ' ' + f(p[1].y),
        ang: Math.atan2(p[1].y - p[0].y, p[1].x - p[0].x)
      };
    }
    d = 'M ' + f(p[0].x) + ' ' + f(p[0].y);
    var c2 = null;
    for (i = 0; i < p.length - 1; i++) {
      var a = p[i - 1] || p[i], b = p[i], c = p[i + 1], e = p[i + 2] || p[i + 1];
      var k1 = { x: b.x + (c.x - a.x) / 6, y: b.y + (c.y - a.y) / 6 };
      var k2 = { x: c.x - (e.x - b.x) / 6, y: c.y - (e.y - b.y) / 6 };
      d += ' C ' + f(k1.x) + ' ' + f(k1.y) + ' ' + f(k2.x) + ' ' + f(k2.y) + ' ' + f(c.x) + ' ' + f(c.y);
      c2 = k2;
    }
    last = p[p.length - 1];
    // Tangente en fin de cubique = (point final − dernier point de contrôle).
    var dx = last.x - c2.x, dy = last.y - c2.y;
    if (dx * dx + dy * dy < 1e-4) { dx = last.x - p[p.length - 2].x; dy = last.y - p[p.length - 2].y; }
    return { d: d, ang: Math.atan2(dy, dx) };
  }

  function headPath(x, y, ang, hl, hw) {
    var cx = Math.cos(ang), sy = Math.sin(ang);
    var bx = x - hl * cx, by = y - hl * sy;
    return 'M ' + f(x) + ' ' + f(y)
      + ' L ' + f(bx - hw * sy) + ' ' + f(by + hw * cx)
      + ' L ' + f(bx + hw * sy) + ' ' + f(by - hw * cx) + ' Z';
  }

  function arrowMarkup(a) {
    var t = tokById(a.from);
    var cls = 'arw ' + (t && t.side === 'atk' ? 'atk' : 'def') + ' ' + a.kind;
    var wp = '', v = a.via || [], i;
    for (i = 0; i < v.length; i++)
      wp += '<circle class="wphit" data-arw="' + a.id + '" data-i="' + i + '" cx="' + f(v[i].x) + '" cy="' + f(v[i].y) + '" r="' + f(PR * 0.85) + '"/>'
          + '<circle class="wp" data-arw="' + a.id + '" data-i="' + i + '" cx="' + f(v[i].x) + '" cy="' + f(v[i].y) + '" r="' + f(PR * 0.3) + '"/>';
    return '<g class="' + cls + '" data-id="' + a.id + '">'
      + '<path class="hit" d=""/><path class="body" d=""/><path class="head" d=""/>' + wp + '</g>';
  }

  // Le tir n'est pas une flèche du modèle mais un drapeau sur le temps : on le
  // DESSINE comme une flèche (vers le cercle) sans l'y stocker, pour que
  // supprimer la tireuse du terrain ne laisse jamais de flèche orpheline.
  function shotMarkup() {
    return '<g class="arw shot" data-id="__shot">'
      + '<path class="hit" d=""/><path class="body" d=""/><path class="head" d=""/></g>';
  }

  function drawArrows() {
    var list = step().arw, html = '', i;
    for (i = 0; i < list.length; i++) if (arwVisible(list[i])) html += arrowMarkup(list[i]);
    var sh = step().shot;
    if (sh && visible(tokById(sh))) html += shotMarkup();
    layA.innerHTML = html;
    arwEl = {};
    var gs = layA.querySelectorAll('.arw');
    for (i = 0; i < gs.length; i++) {
      var g = gs[i], id = g.getAttribute('data-id');
      arwEl[id] = { g: g, body: g.querySelector('.body'), hit: g.querySelector('.hit'), head: g.querySelector('.head') };
      updateArrow(id);
      attachArrowPointer(g, id);
    }
    var wps = layA.querySelectorAll('.wphit');
    for (i = 0; i < wps.length; i++) attachWaypointPointer(wps[i]);
  }

  // Recalcule le d= d'UNE flèche. C'est le seul travail fait pendant un drag,
  // et uniquement pour les flèches réellement attachées au jeton déplacé.
  function updateArrow(id) {
    var el = arwEl[id];
    if (!el) return;
    var a, p, endPad;
    if (id === '__shot') {
      var s = tokById(step().shot);
      if (!s) return;
      var h = hoop();
      a = { kind: 'shot', to: null };
      p = [{ x: s.x, y: s.y }, { x: h.x, y: h.y }];
      endPad = 2.6;
    } else {
      a = findArw(id);
      if (!a) return;
      p = rawPts(a);
      if (!p) return;
      endPad = typeof a.to === 'string' ? PR + 1.2 : 0;
    }
    shrink(p, 0, PR + 0.8);
    shrink(p, p.length - 1, endPad);
    var r  = buildPath(p);
    var k  = a.kind;
    var hl = PR * (k === 'move' ? 0.8 : 0.72);
    var hw = PR * (k === 'move' ? 0.4 : 0.34);
    el.body.setAttribute('d', r.d);
    el.hit.setAttribute('d', r.d);
    el.head.setAttribute('d', headPath(p[p.length - 1].x, p[p.length - 1].y, r.ang, hl, hw));
  }

  function arrowsOf(tokId) {
    var out = [], list = step().arw, i;
    for (i = 0; i < list.length; i++)
      if (list[i].from === tokId || list[i].to === tokId) out.push(list[i].id);
    if (step().shot === tokId) out.push('__shot');
    return out;
  }

  function findArw(id) {
    var l = step().arw, i;
    for (i = 0; i < l.length; i++) if (l[i].id === id) return l[i];
    return null;
  }

  // ─────────────────────────────────────────────────────────────────────
  // 4. COORDONNÉES ÉCRAN → TERRAIN
  // ─────────────────────────────────────────────────────────────────────
  // getScreenCTM().inverse() : exact quelle que soit la mise à l'échelle du
  // viewBox, le zoom ou la rotation de l'écran.
  function toCourt(clientX, clientY) {
    var ctm = svg.getScreenCTM();
    if (!ctm) return null;
    var p = svg.createSVGPoint();
    p.x = clientX; p.y = clientY;
    var s = p.matrixTransform(ctm.inverse());
    return VIEWS[view].unproject(s);   // scène → terrain (identité en 2D)
  }

  // Le jeton peut aller jusqu'au bord du viewBox (donc dans la marge de
  // remise en touche) mais jamais au-delà : le disque reste entièrement
  // visible.
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function clampPt(p, pad) {
    var c = MODES[mode()];
    return { x: clamp(p.x, pad, c.w - pad), y: clamp(p.y, pad, c.h - pad) };
  }

  // ─────────────────────────────────────────────────────────────────────
  // 5. DRAG — PointerEvents (iPhone + desktop, même chemin de code)
  // ─────────────────────────────────────────────────────────────────────
  // Moteur générique : il ne sait rien des jetons ni des waypoints, il reçoit
  // « lis la position », « écris la position », « et voilà un tap ».
  function makeDrag(el, opts) {
    var on = false, off = { x: 0, y: 0 }, moved = 0;
    var queued = null, raf = 0;

    // On ne rend QU'UNE fois par frame : les pointermove arrivent souvent
    // plus vite que 60 Hz sur iPhone (jusqu'à 120 Hz), inutile de recalculer
    // le CTM à chaque événement.
    function flush() {
      raf = 0;
      var e = queued; queued = null;
      if (!e) return;
      var p = toCourt(e.clientX, e.clientY);
      if (!p) return;
      opts.set(clampPt({ x: p.x + off.x, y: p.y + off.y }, opts.pad()));
      fpsTick();
    }

    el.addEventListener('pointerdown', function (e) {
      e.stopPropagation();
      if (!VIEWS[view].editable || playing) return;
      if (opts.down && opts.down(e) === false) return;
      e.preventDefault();
      var p = toCourt(e.clientX, e.clientY);
      if (!p) return;
      var c = opts.get();
      if (!c) return;
      on = true; moved = 0;
      off.x = c.x - p.x; off.y = c.y - p.y;
      // Capture : le doigt garde le jeton même s'il sort du <g> (et on reçoit
      // toujours le pointerup, y compris hors de l'élément).
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      el.classList.add('drag');
      fpsReset();
    }, { passive: false });

    el.addEventListener('pointermove', function (e) {
      if (!on) return;
      e.preventDefault(); e.stopPropagation();
      moved++;
      queued = e;
      if (!raf) raf = requestAnimationFrame(flush);
    }, { passive: false });

    function end(e) {
      if (!on) return;
      on = false;
      if (queued) { if (raf) cancelAnimationFrame(raf); raf = 0; flush(); }
      try { el.releasePointerCapture(e.pointerId); } catch (_) {}
      el.classList.remove('drag');
      elFps.textContent = '—';
      // Un geste de moins de 3 frames de mouvement = un tap, pas un drag.
      if (moved < 3 && opts.tap) opts.tap();
      else if (moved >= 3) touch();
    }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    // Filet iOS : un geste système (swipe bord d'écran) peut avaler le pointer.
    el.addEventListener('lostpointercapture', function () { el.classList.remove('drag'); on = false; });
  }

  function attachTokenPointer(g, id) {
    makeDrag(g, {
      // Hors mode sélection, le jeton ne se déplace pas : il sert de cible aux
      // outils flèche / gomme / tir. On refuse le drag mais on garde le tap.
      down: function (e) {
        if (tool !== 'select') { e.preventDefault(); onTokenClick(id); return false; }
        return true;
      },
      pad: function () { return PR; },
      get: function () { var q = pos()[id]; return q ? { x: q.x, y: q.y } : null; },
      set: function (p) {
        var q = pos()[id];
        q.x = p.x; q.y = p.y;
        placeToken(id);
        var ids = arrowsOf(id), i;
        for (i = 0; i < ids.length; i++) updateArrow(ids[i]);
      },
      tap: function () { onTokenClick(id); }
    });
  }

  function attachWaypointPointer(el) {
    var aid = el.getAttribute('data-arw'), idx = +el.getAttribute('data-i');
    var dot = layA.querySelector('.wp[data-arw="' + aid + '"][data-i="' + idx + '"]');
    makeDrag(el, {
      down: function () {
        // Mode gomme : un simple tap RETIRE le point de passage. Le chemin
        // redevient droit (ou repasse par les points restants).
        if (tool === 'erase') { removeWaypoint(aid, idx); return false; }
        return tool === 'select';
      },
      pad: function () { return 1; },
      get: function () { var a = findArw(aid); return a && a.via[idx] ? a.via[idx] : null; },
      set: function (p) {
        var a = findArw(aid);
        if (!a || !a.via[idx]) return;
        a.via[idx].x = p.x; a.via[idx].y = p.y;
        el.setAttribute('cx', f(p.x)); el.setAttribute('cy', f(p.y));
        if (dot) { dot.setAttribute('cx', f(p.x)); dot.setAttribute('cy', f(p.y)); }
        updateArrow(aid);
      }
    });
  }

  // ─────────────────────────────────────────────────────────────────────
  // 6. OUTILS — machine à états des clics
  // ─────────────────────────────────────────────────────────────────────
  function onTokenClick(id) {
    if (playing) return;
    if (tool === 'select') {
      active = (active === id) ? null : id;
      pending = null;
      syncSelection(); setHint();
      return;
    }
    if (tool === 'erase') return;   // la gomme ne touche qu'aux flèches
    if (tool === 'shot') {
      // Un seul tir par temps : re-taper la tireuse annule le tir.
      step().shot = (step().shot === id) ? null : id;
      drawArrows(); syncInfo(); syncBall(); renderTimeline(); touch(); setHint();
      return;
    }
    if (!pending) { pending = id; syncSelection(); setHint(); return; }
    if (pending === id) { pending = null; syncSelection(); setHint(); return; }
    if (tool === 'pass') { addArrow('pass', pending, id); pending = null; syncSelection(); return; }
    // Mode déplacement : cliquer un autre jeton vaut « va à cet endroit ».
    var t = tokById(id);
    addArrow('move', pending, { x: t.x, y: t.y });
    pending = null; syncSelection();
  }

  function onCourtClick(p) {
    if (playing) return;
    if (tool === 'move' && pending) {
      addArrow('move', pending, clampPt(p, 1));
      pending = null; syncSelection();
      return;
    }
    // Un clic dans le vide annule la sélection / le tracé en cours.
    if (pending || active) { pending = null; active = null; syncSelection(); setHint(); }
  }

  function addArrow(kind, from, to) {
    // Une seule flèche de déplacement par joueuse et par temps : deux
    // destinations pour la même joueuse au même moment ne veut rien dire, et
    // l'animation devrait en choisir une au hasard. La nouvelle remplace.
    var l = step().arw, i;
    if (kind === 'move') {
      for (i = l.length - 1; i >= 0; i--) if (l[i].kind === 'move' && l[i].from === from) l.splice(i, 1);
    }
    l.push({ id: uid('w'), kind: kind, from: from, to: to, via: [] });
    drawArrows(); syncInfo(); renderTimeline(); touch(); setHint();
  }

  function removeArrow(id) {
    if (id === '__shot') { step().shot = null; }
    else {
      var l = step().arw, i;
      for (i = 0; i < l.length; i++) if (l[i].id === id) { l.splice(i, 1); break; }
    }
    drawArrows(); syncInfo(); syncBall(); renderTimeline(); touch();
  }

  function removeWaypoint(aid, idx) {
    var a = findArw(aid);
    if (!a || !a.via[idx]) return;
    a.via.splice(idx, 1);
    drawArrows(); touch();
  }

  // Distance d'un point à un segment — sert à savoir DANS QUEL segment de la
  // flèche insérer un waypoint (sinon un point ajouté en fin de course
  // atterrirait au mauvais rang et la courbe ferait un aller-retour).
  function distSeg(p, a, b) {
    var dx = b.x - a.x, dy = b.y - a.y, L = dx * dx + dy * dy;
    var t = L ? ((p.x - a.x) * dx + (p.y - a.y) * dy) / L : 0;
    t = clamp(t, 0, 1);
    var qx = a.x + t * dx - p.x, qy = a.y + t * dy - p.y;
    return Math.sqrt(qx * qx + qy * qy);
  }

  function addWaypoint(id, p) {
    var a = findArw(id);
    if (!a) return;
    var pts = rawPts(a);
    if (!pts) return;
    var best = 0, bd = Infinity, i;
    for (i = 0; i < pts.length - 1; i++) {
      var d = distSeg(p, pts[i], pts[i + 1]);
      if (d < bd) { bd = d; best = i; }
    }
    a.via.splice(best, 0, clampPt(p, 1));
    drawArrows(); touch();
  }

  function attachArrowPointer(g, id) {
    // Double-tap maison plutôt que dblclick : sur iPhone, dblclick n'est pas
    // fiable sur un <path> et arrive trop tard. On mesure nous-mêmes.
    var lastT = 0, lastP = null;
    g.addEventListener('pointerdown', function (e) {
      e.stopPropagation();
      if (!VIEWS[view].editable || playing) return;
      e.preventDefault();
      if (tool === 'erase') { removeArrow(id); return; }
      if (tool !== 'select' || id === '__shot') return;   // pas de waypoint sur un tir
      var p = toCourt(e.clientX, e.clientY);
      if (!p) return;
      var now = performance.now();
      if (lastP && now - lastT < 400 && Math.abs(p.x - lastP.x) < 6 && Math.abs(p.y - lastP.y) < 6) {
        lastT = 0; lastP = null;
        addWaypoint(id, p);
        return;
      }
      lastT = now; lastP = p;
    }, { passive: false });
  }

  // Clic sur le fond (terrain ou hors-jeu) : les jetons et les flèches
  // stoppent la propagation, donc tout ce qui arrive ici est bien du vide.
  svg.addEventListener('pointerdown', function (e) {
    if (!VIEWS[view].editable || playing) return;
    var p = toCourt(e.clientX, e.clientY);
    if (p) onCourtClick(p);
  }, { passive: true });

  // ─────────────────────────────────────────────────────────────────────
  // 7. TEMPS (steps) — timeline
  // ─────────────────────────────────────────────────────────────────────
  var strip = document.getElementById('tl-strip');

  function stepSummary(st) {
    var mv = 0, ps = 0, i;
    for (i = 0; i < st.arw.length; i++) { if (st.arw[i].kind === 'move') mv++; else ps++; }
    var out = [];
    if (mv) out.push(mv + '→');
    if (ps) out.push(ps + '⇢');
    if (st.shot) out.push('🎯');
    return out.join(' ') || '·';
  }

  function renderTimeline() {
    var l = steps(), html = '', i;
    for (i = 0; i < l.length; i++) {
      html += '<div class="chip' + (i === cur ? ' on' : '') + (desynced(i) ? ' desync' : '') + '" data-i="' + i + '">'
        + (i + 1)
        + '<span class="mini">' + stepSummary(l[i]) + '</span>'
        + '<button class="x" data-del="' + i + '" title="Supprimer ce temps">×</button>'
        + '</div>';
    }
    strip.innerHTML = html;
    var chips = strip.querySelectorAll('.chip');
    for (i = 0; i < chips.length; i++) attachChip(chips[i]);
    document.getElementById('s-sync').disabled = (cur === 0) || playing;
    updateProgress();
  }

  function gotoStep(i, keepTool) {
    if (i < 0 || i >= steps().length) return;
    cur = i;
    active = null; pending = null;
    if (!keepTool) { /* l'outil courant reste actif d'un temps à l'autre */ }
    drawTokens(); drawArrows(); renderTimeline(); syncInfo(); setHint();
  }

  function addStep() {
    var src = steps()[steps().length - 1];
    steps().push(makeStep(endPos(src)));
    gotoStep(steps().length - 1);
    touch();
  }

  function delStep(i) {
    if (steps().length <= 1) { toast('Un play garde au moins un temps.', 'err'); return; }
    if (!confirm('Supprimer le temps ' + (i + 1) + ' ?\nSes flèches et sa disposition sont perdues.')) return;
    steps().splice(i, 1);
    if (cur >= steps().length) cur = steps().length - 1;
    gotoStep(cur); touch();
  }

  // Recale la photo du temps courant sur la SORTIE du temps précédent, sans
  // toucher à ses flèches (cf. l'en-tête : on répare, on n'écrase pas en douce).
  function syncStep() {
    if (cur === 0) return;
    steps()[cur].pos = endPos(steps()[cur - 1]);
    gotoStep(cur); touch();
    toast('Temps ' + (cur + 1) + ' recalé.', 'ok');
  }

  // Réordonnancement au doigt. Un seuil de 6 px sépare le tap (sélection) du
  // glissé (déplacement) : sur iPhone, un doigt bouge toujours un peu.
  function attachChip(el) {
    var i0 = +el.getAttribute('data-i');
    var down = false, x0 = 0, dragging = false;

    el.addEventListener('pointerdown', function (e) {
      if (e.target && e.target.getAttribute('data-del') !== null) return;
      if (playing) return;
      down = true; dragging = false; x0 = e.clientX;
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
    });
    el.addEventListener('pointermove', function (e) {
      if (!down) return;
      var dx = e.clientX - x0;
      if (!dragging && Math.abs(dx) > 6) { dragging = true; el.classList.add('grab'); }
      if (dragging) { e.preventDefault(); el.style.transform = 'translateX(' + dx + 'px) scale(1.06)'; }
    }, { passive: false });
    function up(e) {
      if (!down) return;
      down = false;
      try { el.releasePointerCapture(e.pointerId); } catch (_) {}
      el.style.transform = '';
      el.classList.remove('grab');
      if (!dragging) { gotoStep(i0); return; }
      // Où lâche-t-on ? On compare le centre du doigt aux centres des chips.
      var chips = strip.querySelectorAll('.chip'), j, target = i0;
      for (j = 0; j < chips.length; j++) {
        var r = chips[j].getBoundingClientRect();
        if (e.clientX > r.left + r.width / 2) target = j;
        else break;
      }
      if (target !== i0) {
        var l = steps(), moved = l.splice(i0, 1)[0];
        l.splice(target, 0, moved);
        cur = target;
        touch();
      } else cur = i0;
      gotoStep(cur);
    }
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  }

  strip.addEventListener('click', function (e) {
    var d = e.target && e.target.getAttribute && e.target.getAttribute('data-del');
    if (d === null || d === undefined) return;
    e.stopPropagation();
    delStep(+d);
  });
  document.getElementById('s-add').addEventListener('click', addStep);
  document.getElementById('s-sync').addEventListener('click', syncStep);

  // ─────────────────────────────────────────────────────────────────────
  // 8. LECTURE ANIMÉE
  // ─────────────────────────────────────────────────────────────────────
  // Découpage d'un temps, en fraction u ∈ [0,1] de sa durée :
  //   déplacements   u ∈ [0   , 0.65]   les joueuses glissent le long de leur
  //                                     courbe (easing doux aux deux bouts)
  //   passe          u ∈ [0.45, 0.90]   le trait pointillé se révèle, le
  //                                     ballon voyage dessus
  //   tir            u ∈ [0.70, 1.00]   halo qui pulse sur la tireuse, puis
  //                                     trajectoire jusqu'au cercle
  // Les fenêtres se CHEVAUCHENT volontairement : dans la réalité la passe part
  // avant que tout le monde ait fini de bouger. Un enchaînement strictement
  // séquentiel donne une animation hachée et beaucoup plus longue.
  var PLAY = { move: [0, 0.65], pass: [0.45, 0.90], shot: [0.70, 1.00] };

  var playing = false;       // lecture en cours (≠ « une frame est affichée »)
  var pRaf = 0, pT0 = 0, pStep = 0, pU = 0, pPrepared = -1, pPaths = null;
  var elPlay = document.getElementById('p-play');
  var elProg = document.getElementById('prog');
  var elFill = document.getElementById('prog-fill');
  var elSpeed = document.getElementById('p-speed');

  function stepMs() { return +elSpeed.value || 2000; }
  function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function win(u, w) { return clamp((u - w[0]) / (w[1] - w[0]), 0, 1); }

  // Prépare les <path> de mesure du temps k. Fait UNE fois par temps, jamais
  // par frame : getTotalLength() force un layout, c'est cher.
  function prepare(k) {
    if (pPrepared === k) return;
    pPrepared = k;
    layM.innerHTML = '';
    layP.innerHTML = '';
    pPaths = { moves: [], pass: null, shot: null };
    var st = steps()[k];
    if (!st) return;
    var p0 = st.pos, i;

    for (i = 0; i < st.arw.length; i++) {
      var a = st.arw[i];
      if (a.kind !== 'move') continue;
      var t = tokById(a.from, p0);
      if (!visible(t)) continue;
      var pts = rawPts(a, p0);
      if (!pts) continue;
      var d = buildPath(pts).d;
      var el = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      el.setAttribute('d', d);
      layM.appendChild(el);
      var trail = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      trail.setAttribute('class', 'trail' + (t.side === 'def' ? ' def' : ''));
      trail.setAttribute('d', d);
      var L = 0;
      try { L = el.getTotalLength(); } catch (_) { L = 0; }
      trail.setAttribute('stroke-dasharray', f(L) + ' ' + f(L));
      trail.setAttribute('stroke-dashoffset', f(L));
      layP.appendChild(trail);
      pPaths.moves.push({ id: a.from, el: el, len: L, trail: trail });
    }

    var ps = passOf(st);
    if (ps && arwVisibleIn(ps, p0)) {
      var g = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      g.setAttribute('class', 'pline');
      layP.appendChild(g);
      pPaths.pass = { arw: ps, el: g, ball: flyingBall() };
    }
    if (st.shot && visible(tokById(st.shot, p0))) {
      var sl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      sl.setAttribute('class', 'sline');
      var pu = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      pu.setAttribute('class', 'spulse');
      layP.appendChild(sl); layP.appendChild(pu);
      pPaths.shot = { id: st.shot, el: sl, pulse: pu, ball: flyingBall() };
    }
  }

  function arwVisibleIn(a, p) {
    if (!visible(tokById(a.from, p))) return false;
    if (typeof a.to === 'string' && !visible(tokById(a.to, p))) return false;
    return true;
  }

  function flyingBall() {
    var br = PR * 0.5;
    var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'fb');
    g.innerHTML = '<circle class="b" cx="0" cy="0" r="' + f(br) + '"/>'
      + '<line class="s" x1="' + f(-br) + '" y1="0" x2="' + f(br) + '" y2="0"/>'
      + '<line class="s" x1="0" y1="' + f(-br) + '" x2="0" y2="' + f(br) + '"/>';
    g.style.display = 'none';
    layP.appendChild(g);
    return g;
  }

  // Rend la frame (temps k, fraction u). Écrit UNIQUEMENT des attributs.
  function renderFrame(k, u) {
    var st = steps()[k];
    if (!st) return;
    prepare(k);
    var p0 = st.pos, id, i;

    // 1) positions — la joueuse suit sa courbe, les autres restent en place
    var live = {};
    for (id in p0) live[id] = { x: p0[id].x, y: p0[id].y };
    var mu = ease(win(u, PLAY.move));
    for (i = 0; i < pPaths.moves.length; i++) {
      var m = pPaths.moves[i];
      if (m.len > 0.01) {
        var q = m.el.getPointAtLength(m.len * mu);
        live[m.id] = { x: q.x, y: q.y };
      }
      m.trail.setAttribute('stroke-dashoffset', f(m.len * (1 - mu)));
    }
    for (id in tokEl) placeToken(id, live[id]);

    // 2) porteuse — masquée pendant qu'un ballon vole
    var holder = holderAt(k);
    var flying = false;
    var pf = 0, ps = pPaths.pass;
    if (ps) {
      pf = win(u, PLAY.pass);
      var A = live[ps.arw.from], B = typeof ps.arw.to === 'string' ? live[ps.arw.to] : ps.arw.to;
      if (A && B) {
        var pp = [{ x: A.x, y: A.y }].concat((ps.arw.via || []).map(function (v) { return { x: v.x, y: v.y }; }), [{ x: B.x, y: B.y }]);
        shrink(pp, 0, PR + 0.8); shrink(pp, pp.length - 1, PR + 1.2);
        ps.el.setAttribute('d', buildPath(pp).d);
        // Apparition puis effacement : le trait ne doit pas rester à l'écran,
        // sinon on ne distingue plus la passe de ce temps de celle du suivant.
        ps.el.setAttribute('opacity', f(pf <= 0 ? 0 : (pf < 0.15 ? pf / 0.15 : (pf > 0.9 ? (1 - pf) / 0.1 : 1))));
        if (pf > 0 && pf < 1) {
          flying = true;
          var bp = lerpPts(pp, pf);
          ps.ball.style.display = 'block';
          ps.ball.setAttribute('transform', 'translate(' + f(bp.x) + ' ' + f(bp.y) + ')');
        } else ps.ball.style.display = 'none';
        if (pf >= 1 && typeof ps.arw.to === 'string') holder = ps.arw.to;
      }
    }

    // 3) tir
    var sh = pPaths.shot;
    if (sh) {
      var sf = win(u, PLAY.shot), S = live[sh.id], H = hoop();
      if (S) {
        // Halo qui respire sur la tireuse pendant la première moitié.
        var pulseT = clamp(sf / 0.45, 0, 1);
        sh.pulse.setAttribute('cx', f(S.x)); sh.pulse.setAttribute('cy', f(S.y));
        sh.pulse.setAttribute('r', f(PR * (1.15 + 0.55 * Math.sin(pulseT * Math.PI))));
        sh.pulse.setAttribute('opacity', f(sf <= 0 ? 0 : (1 - pulseT) * 0.9));
        // Trajectoire : une cloche, pas une corde — un tir monte.
        var arc = shotArc(S, H);
        sh.el.setAttribute('d', arc.d);
        var rf = clamp((sf - 0.4) / 0.6, 0, 1);
        sh.el.setAttribute('stroke-dasharray', f(arc.len * rf) + ' ' + f(arc.len));
        sh.el.setAttribute('opacity', rf > 0 ? 1 : 0);
        if (rf > 0 && rf < 1) {
          flying = true;
          var q2 = quadAt(S, arc.c, H, rf);
          sh.ball.style.display = 'block';
          sh.ball.setAttribute('transform', 'translate(' + f(q2.x) + ' ' + f(q2.y) + ')');
        } else sh.ball.style.display = 'none';
        if (rf > 0) holder = null;
      }
    }

    for (id in tokEl) tokEl[id].classList.toggle('has-ball', !flying && id === holder);
    updateProgress(k, u);
  }

  // Position à la fraction t d'une polyligne (utilisée pour le ballon d'une
  // passe : le trait est court, l'approximation linéaire suffit et évite un
  // getPointAtLength par frame).
  function lerpPts(p, t) {
    var seg = [], total = 0, i;
    for (i = 0; i < p.length - 1; i++) {
      var d = Math.sqrt(Math.pow(p[i+1].x - p[i].x, 2) + Math.pow(p[i+1].y - p[i].y, 2));
      seg.push(d); total += d;
    }
    if (total < 0.01) return { x: p[0].x, y: p[0].y };
    var want = total * t, acc = 0;
    for (i = 0; i < seg.length; i++) {
      if (acc + seg[i] >= want) {
        var u = seg[i] ? (want - acc) / seg[i] : 0;
        return { x: p[i].x + (p[i+1].x - p[i].x) * u, y: p[i].y + (p[i+1].y - p[i].y) * u };
      }
      acc += seg[i];
    }
    return { x: p[p.length-1].x, y: p[p.length-1].y };
  }

  // Cloche du tir : point de contrôle décalé perpendiculairement au segment
  // tireuse→cercle, d'un quart de sa longueur. Simple, lisible, et ça donne la
  // même silhouette quel que soit l'endroit du terrain.
  function shotArc(S, H) {
    var dx = H.x - S.x, dy = H.y - S.y, L = Math.sqrt(dx * dx + dy * dy) || 1;
    var mx = (S.x + H.x) / 2, my = (S.y + H.y) / 2;
    var c = { x: mx - dy / L * (L * 0.22), y: my + dx / L * (L * 0.22) };
    return {
      d: 'M ' + f(S.x) + ' ' + f(S.y) + ' Q ' + f(c.x) + ' ' + f(c.y) + ' ' + f(H.x) + ' ' + f(H.y),
      len: L * 1.08, c: c
    };
  }
  function quadAt(a, c, b, t) {
    var m = 1 - t;
    return { x: m*m*a.x + 2*m*t*c.x + t*t*b.x, y: m*m*a.y + 2*m*t*c.y + t*t*b.y };
  }

  function updateProgress(k, u) {
    var n = steps().length;
    if (k === undefined) { k = cur; u = 0; }
    elFill.style.width = f(clamp((k + u) / n, 0, 1) * 100) + '%';
  }

  function enterPlay() {
    document.body.classList.add('playing');
    active = null; pending = null;
    syncSelection();
    pPrepared = -1;
  }
  function exitPlay() {
    document.body.classList.remove('playing');
    playing = false;
    if (pRaf) cancelAnimationFrame(pRaf);
    pRaf = 0;
    elPlay.textContent = '▶';
    elPlay.classList.remove('on');
    layP.innerHTML = ''; layM.innerHTML = '';
    pPrepared = -1; pPaths = null;
    elFps.textContent = '—';
    document.getElementById('s-sync').disabled = (cur === 0);
    // On retombe sur la PHOTO du temps où on s'est arrêté : l'éditeur reprend
    // exactement là, sans avoir à deviner un état intermédiaire.
    gotoStep(pStep);
  }

  function play() {
    if (playing) { pause(); return; }
    if (pU >= 1 && pStep >= steps().length - 1) { pStep = 0; pU = 0; }
    playing = true;
    enterPlay();
    elPlay.textContent = '⏸';
    elPlay.classList.add('on');
    fpsReset();
    pT0 = performance.now() - pU * stepMs();
    pRaf = requestAnimationFrame(tick);
  }
  function pause() {
    if (!playing) return;
    playing = false;
    if (pRaf) cancelAnimationFrame(pRaf);
    pRaf = 0;
    elPlay.textContent = '▶';
    elPlay.classList.remove('on');
    elFps.textContent = '—';
  }

  function tick(now) {
    if (!playing) return;
    var d = stepMs();
    var u = (now - pT0) / d;
    while (u >= 1) {
      if (pStep >= steps().length - 1) {
        pU = 1;
        renderFrame(pStep, 1);
        pause();
        return;
      }
      pStep++; u -= 1; pT0 += d;
    }
    pU = u;
    renderFrame(pStep, u);
    if (Math.floor(u * 1000) % 1000 === 0 || u < 0.02) setHint();
    fpsTick();
    pRaf = requestAnimationFrame(tick);
  }

  // Se placer n'importe où dans le play, lecture en cours ou non.
  function seek(r) {
    var n = steps().length;
    var g = clamp(r, 0, 0.9999) * n;
    pStep = Math.min(n - 1, Math.floor(g));
    pU = g - pStep;
    if (!document.body.classList.contains('playing')) enterPlay();
    renderFrame(pStep, pU);
    setHint();
    if (playing) pT0 = performance.now() - pU * stepMs();
  }

  elPlay.addEventListener('click', play);
  document.getElementById('p-first').addEventListener('click', function () {
    if (playing) pause();
    if (document.body.classList.contains('playing')) { pStep = 0; pU = 0; exitPlay(); }
    else gotoStep(0);
    pStep = cur; pU = 0; updateProgress();
  });
  document.getElementById('p-last').addEventListener('click', function () {
    if (playing) pause();
    if (document.body.classList.contains('playing')) { pStep = steps().length - 1; pU = 0; exitPlay(); }
    else gotoStep(steps().length - 1);
    pStep = cur; pU = 0; updateProgress();
  });
  elSpeed.addEventListener('change', function () {
    if (playing) pT0 = performance.now() - pU * stepMs();
  });

  (function scrub() {
    var on = false;
    function at(e) {
      var r = elProg.getBoundingClientRect();
      seek((e.clientX - r.left) / (r.width || 1));
    }
    elProg.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      on = true;
      try { elProg.setPointerCapture(e.pointerId); } catch (_) {}
      at(e);
    }, { passive: false });
    elProg.addEventListener('pointermove', function (e) { if (on) { e.preventDefault(); at(e); } }, { passive: false });
    function up(e) {
      if (!on) return;
      on = false;
      try { elProg.releasePointerCapture(e.pointerId); } catch (_) {}
      // Relâcher hors lecture = on adopte le temps visé comme temps d'édition.
      if (!playing) exitPlay();
    }
    elProg.addEventListener('pointerup', up);
    elProg.addEventListener('pointercancel', up);
  })();

  // ─────────────────────────────────────────────────────────────────────
  // 9. ENCART D'INFO + FPS
  // ─────────────────────────────────────────────────────────────────────
  function syncInfo() {
    var n = 0, l = step().arw, i;
    for (i = 0; i < l.length; i++) if (arwVisible(l[i])) n++;
    if (step().shot && visible(tokById(step().shot))) n++;
    elTok.textContent = doc.defOn ? '10' : '5';
    elArw.textContent = String(n);
    var b = tokById(holderAt(cur));
    elBal.textContent = (b && visible(b)) ? (b.side === 'atk' ? '#' + b.n : 'X' + b.n) : '—';
  }

  var fpsN = 0, fpsT = 0;
  function fpsReset() { fpsN = 0; fpsT = performance.now(); elFps.textContent = '…'; }
  function fpsTick() {
    fpsN++;
    var now = performance.now();
    if (now - fpsT >= 400) {
      elFps.textContent = Math.round(fpsN * 1000 / (now - fpsT));
      fpsN = 0; fpsT = now;
    }
  }

  var HINTS = {
    select: 'Glisse les jetons. <b>Tape</b> une joueuse puis <b>🏀</b> pour lui donner le ballon.<br><b>Double-tape une flèche</b> pour lui ajouter un point de passage.',
    move:   'Tape la joueuse qui se déplace, <b>puis l\'endroit où elle va</b>. Flèche pleine.',
    pass:   'Tape la <b>passeuse</b>, puis la <b>réceptionneuse</b>. Flèche pointillée.',
    shot:   'Tape la joueuse qui <b>tire</b> à la fin de ce temps. Re-tape pour annuler.',
    erase:  'Tape une flèche pour la <b>supprimer</b>, un point de passage pour le <b>retirer</b>.'
  };
  function setHint() {
    var h = HINTS[tool];
    if (playing || document.body.classList.contains('playing')) {
      elHint.innerHTML = 'Lecture — temps <b>' + (pStep + 1) + '</b> / ' + steps().length + '. Glisse la barre pour te déplacer.';
      return;
    }
    if (pending) {
      var t = tokById(pending);
      h = 'Source : <b>' + (t.side === 'atk' ? t.n : 'X' + t.n) + '</b> — '
        + (tool === 'pass' ? 'tape maintenant la réceptionneuse.' : 'tape maintenant la destination.')
        + ' (tape dans le vide pour annuler)';
    } else {
      h = '<b>Temps ' + (cur + 1) + '/' + steps().length + '</b> · ' + h;
    }
    elHint.innerHTML = h;
  }

  // ─────────────────────────────────────────────────────────────────────
  // 10. UI — outils, terrain, vue
  // ─────────────────────────────────────────────────────────────────────
  var TOOLS = ['select', 'move', 'pass', 'shot', 'erase'];
  function setTool(t) {
    if (playing || document.body.classList.contains('playing')) exitPlay();
    tool = t;
    pending = null;
    if (t !== 'select') active = null;
    document.body.setAttribute('data-tool', t);
    TOOLS.forEach(function (k) { document.getElementById('t-' + k).classList.toggle('on', k === t); });
    syncSelection(); setHint();
  }
  TOOLS.forEach(function (k) {
    document.getElementById('t-' + k).addEventListener('click', function () { setTool(k); });
  });

  // Ballon : un seul porteur AU TEMPS 0. Re-cliquer sur la porteuse le retire
  // (il faut pouvoir dessiner une situation sans ballon, ex. un écran hors
  // ballon). Aux temps suivants, la porteuse est DÉRIVÉE des passes : la
  // changer à la main n'aurait pas de sens, on renvoie donc au temps 0.
  document.getElementById('b-ball').addEventListener('click', function () {
    if (!active) return;
    if (cur !== 0) { toast('La porteuse se règle au temps 1 ; ensuite elle suit les passes.', 'err'); return; }
    doc.ballStart = (doc.ballStart === active) ? null : active;
    syncBall(); syncInfo(); touch();
  });

  // La défense n'est jamais détruite (cf. section 2) : on ne fait que la
  // montrer ou la cacher, positions et flèches comprises.
  document.getElementById('b-def').addEventListener('click', function () {
    doc.defOn = !doc.defOn;
    this.classList.toggle('on', doc.defOn);
    if (!doc.defOn && active && TOKMAP[active].side === 'def') active = null;
    if (!doc.defOn && pending && TOKMAP[pending].side === 'def') pending = null;
    drawTokens(); drawArrows(); syncInfo(); setHint(); touch();
  });

  document.getElementById('b-reset').addEventListener('click', function () {
    if (!confirm('Repartir de la disposition de départ ?\nTous les temps de ce terrain sont perdus.')) return;
    doc[doc.mode] = { steps: [ makeStep(startPos(doc.mode)) ] };
