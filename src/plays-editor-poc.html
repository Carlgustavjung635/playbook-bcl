  // ─────────────────────────────────────────────────────────────────────
  // 12. FORMAT D'ÉCHANGE — export / import JSON
  // ─────────────────────────────────────────────────────────────────────
  // Numéro SIGNÉ : +n = attaquante n, −n = défenseure n. Un seul entier suffit
  // donc à désigner n'importe qui, ce qui garde `ball_start` et `shot` dans un
  // `int` en base et évite un objet {side,n} partout dans le JSON.
  function numOf(id) { var t = TOKMAP[id]; return t ? (t.side === 'atk' ? t.n : -t.n) : null; }
  function idOfNum(v) {
    v = Number(v);
    if (!v || !isFinite(v)) return null;
    var id = v > 0 ? 'a' + v : 'd' + (-v);
    return TOKMAP[id] ? id : null;
  }
  function pt(p) { return { x: f(p.x), y: f(p.y) }; }

  function toJSON() {
    var st = steps(), i, j;
    var players = [], id;
    for (i = 0; i < TOKENS.length; i++) {
      id = TOKENS[i].id;
      var q = st[0].pos[id];
      if (!q) continue;
      players.push({ id: id, side: TOKENS[i].side, n: TOKENS[i].n, x: f(q.x), y: f(q.y) });
    }
    var outSteps = [], flat = [];
    for (i = 0; i < st.length; i++) {
      var s = st[i], moves = [], passes = [];
      for (j = 0; j < s.arw.length; j++) {
        var a = s.arw[j];
        var via = (a.via || []).map(pt);
        if (a.kind === 'move') {
          var d = typeof a.to === 'string' ? s.pos[a.to] : a.to;
          if (!d) continue;
          moves.push({ player: numOf(a.from), to: pt(d), via: via });
          flat.push({ step: i, kind: 'move', from: numOf(a.from), to: pt(d), via: via });
        } else {
          passes.push({ from: numOf(a.from), to: typeof a.to === 'string' ? numOf(a.to) : pt(a.to), via: via });
          flat.push({ step: i, kind: 'pass', from: numOf(a.from), to: typeof a.to === 'string' ? numOf(a.to) : pt(a.to), via: via });
        }
      }
      var positions = {};
      for (id in s.pos) positions[id] = pt(s.pos[id]);
      if (s.shot) flat.push({ step: i, kind: 'shot', from: numOf(s.shot) });
      outSteps.push({
        n: i + 1, note: s.note || '',
        moves: moves,
        // `pass` (singulier) duplique passes[0] : c'est la clé du format
        // d'échange atk-zone. `passes` porte le cas — rare mais réel — de deux
        // passes dans le même temps.
        pass: passes.length ? passes[0] : null,
        passes: passes,
        shot: s.shot ? numOf(s.shot) : null,
        positions: positions
      });
    }
    return {
      format: 'pb-play/2',
      id: doc.id || slug(doc.title) || 'play',
      title: doc.title || 'Sans titre',
      tag: doc.tag || null,
      side: doc.side || 'attaque',
      color: doc.color || '#22D3EE',
      description: doc.description || '',
      points_md: doc.points || '',
      court_type: doc.mode,
      defense_enabled: !!doc.defOn,
      ball_start: doc.ballStart ? numOf(doc.ballStart) : null,
      created_by: doc.author || null,
      players: players,
      arrows: flat,
      steps: outSteps
    };
  }

  // Import TOLÉRANT : le fichier peut venir d'ailleurs (atk-zone.json de
  // référence, export d'un autre outil). On accepte les deux conventions de
  // nommage vues dans la nature (snake_case et camelCase) et les deux façons
  // de désigner une joueuse (numéro signé, ou {side,n}, ou id 'a3'). Ce qu'on
  // n'accepte pas : un fichier sans les clés obligatoires — on refuse alors
  // proprement plutôt que de charger un demi-play silencieusement cassé.
  function pick(o) {
    var i;
    for (i = 1; i < arguments.length; i++) if (o[arguments[i]] !== undefined && o[arguments[i]] !== null) return o[arguments[i]];
    return undefined;
  }
  function refId(v) {
    if (v === null || v === undefined) return null;
    if (typeof v === 'number') return idOfNum(v);
    if (typeof v === 'string') {
      if (TOKMAP[v]) return v;
      var n = Number(v);
      return isFinite(n) ? idOfNum(n) : null;
    }
    if (typeof v === 'object') {
      if (v.id && TOKMAP[v.id]) return v.id;
      if (v.n !== undefined) return (v.side === 'def' || v.side === 'defense') ? idOfNum(-Math.abs(v.n)) : idOfNum(Math.abs(v.n));
      if (v.x !== undefined && v.y !== undefined) return null;   // c'est un point, pas une joueuse
    }
    return null;
  }
  function refPoint(v) {
    if (v && typeof v === 'object' && v.x !== undefined && v.y !== undefined) return { x: +v.x, y: +v.y };
    return null;
  }

  function fromJSON(o) {
    if (!o || typeof o !== 'object') throw new Error('Ce fichier n\'est pas un objet JSON.');
    var miss = [];
    if (!o.id) miss.push('id');
    if (!o.title) miss.push('title');
    if (!Array.isArray(o.players)) miss.push('players');
    if (!Array.isArray(o.steps)) miss.push('steps');
    if (miss.length) throw new Error('Clés manquantes ou invalides : ' + miss.join(', ') + '.');

    var m = (pick(o, 'court_type', 'courtType') === 'full') ? 'full' : 'half';
    var d = makeDoc();
    d.id = String(o.id);
    d.title = String(o.title);
    d.tag = pick(o, 'tag') || '';
    d.side = pick(o, 'side') || 'attaque';
    if (['attaque','defense','transition','remise'].indexOf(d.side) < 0) d.side = 'attaque';
    d.color = pick(o, 'color') || '#22D3EE';
    d.description = pick(o, 'description') || '';
    d.points = pick(o, 'points_md', 'pointsMd', 'points') || '';
    if (Array.isArray(d.points)) d.points = d.points.join('\n');
    d.author = pick(o, 'created_by', 'createdBy', 'author') || '';
    d.mode = m;
    d.defOn = !!pick(o, 'defense_enabled', 'defenseEnabled');
    d.ballStart = refId(pick(o, 'ball_start', 'ballStart'));

    // Positions de départ : ce que `players` dit, complété par la disposition
    // par défaut pour tout jeton absent (un fichier à 5 joueuses reste valide,
    // la défense prend alors ses places de départ et reste masquée).
    var p0 = startPos(m), i, j;
    for (i = 0; i < o.players.length; i++) {
      var pl = o.players[i];
      var id = refId(pl);
      if (!id || !isFinite(+pl.x) || !isFinite(+pl.y)) continue;
      p0[id] = { x: +pl.x, y: +pl.y };
    }

    var out = [], prev = p0;
    for (i = 0; i < o.steps.length; i++) {
      var s = o.steps[i] || {};
      // `positions` si le fichier la porte (round-trip exact), sinon on dérive
      // du temps précédent — c'est la seule information disponible.
      var sp = clonePos(prev);
      var given = pick(s, 'positions', 'pos');
      if (given && typeof given === 'object') {
        for (var k in given) {
          var kid = refId(k) || (TOKMAP[k] ? k : null);
          var q = refPoint(given[k]);
          if (kid && q) sp[kid] = q;
        }
      }
      var st = makeStep(sp);
      st.note = s.note || '';
      var moves = Array.isArray(s.moves) ? s.moves : [];
      for (j = 0; j < moves.length; j++) {
        var mv = moves[j];
        var from = refId(pick(mv, 'player', 'p', 'from', 'id'));
        var to = refPoint(pick(mv, 'to', 'dest', 'end'));
        if (!from || !to) continue;
        st.arw.push({ id: uid('w'), kind: 'move', from: from, to: to, via: (Array.isArray(mv.via) ? mv.via : []).map(refPoint).filter(Boolean) });
      }
      var ps = Array.isArray(s.passes) ? s.passes : (s.pass ? [s.pass] : []);
      for (j = 0; j < ps.length; j++) {
        var pa = ps[j];
        if (!pa) continue;
        var pf = refId(pick(pa, 'from', 'passer'));
        var ptTo = refId(pick(pa, 'to', 'receiver')) || refPoint(pick(pa, 'to'));
        if (!pf || !ptTo) continue;
        st.arw.push({ id: uid('w'), kind: 'pass', from: pf, to: ptTo, via: (Array.isArray(pa.via) ? pa.via : []).map(refPoint).filter(Boolean) });
      }
      st.shot = refId(s.shot);
      out.push(st);
      prev = endPos(st);
    }
    if (!out.length) out.push(makeStep(p0));
    d[m] = { steps: out };
    return d;
  }

  function slug(s) {
    return String(s || '').toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
  }

  // ─────────────────────────────────────────────────────────────────────
  // 13. PERSISTANCE — brouillon local + publication Supabase
  // ─────────────────────────────────────────────────────────────────────
  // Clé publishable, déjà publique dans index.html (cf. en-tête du fichier).
  var SB_URL = 'https://orertxlsvkdqayybgwaq.supabase.co';
  var SB_KEY = 'sb_publishable_pJwgqWwDDhhST6xh9IbzbA_a0ANDwUt';
  var DRAFT_KEY = 'pb_editor_v2_draft';

  function sbFetch(path, opts) {
    opts = opts || {};
    var h = {
      'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,
      'Content-Type': 'application/json', 'Accept': 'application/json'
    };
    if (opts.prefer) h['Prefer'] = opts.prefer;
    return fetch(SB_URL + '/rest/v1/' + path, {
      method: opts.method || 'GET', headers: h,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw new Error('HTTP ' + r.status + ' — ' + t.slice(0, 180)); });
      if (r.status === 204) return null;
      return r.text().then(function (t) { return t ? JSON.parse(t) : null; });
    });
  }

  // `dirty` = du travail non publié existe. On ne réécrit le brouillon que
  // s'il a changé : un setInterval qui sérialise 10 temps toutes les 5 s pour
  // rien réveille le CPU de l'iPhone sans raison.
  var dirty = false, lastSaved = '';
  function touch() { dirty = true; renderTimelineSoon(); }

  var tlRaf = 0;
  function renderTimelineSoon() {
    if (tlRaf) return;
    tlRaf = requestAnimationFrame(function () { tlRaf = 0; renderTimeline(); });
  }

  function draftPayload() {
    return JSON.stringify({ v: 2, at: new Date().toISOString(), doc: doc, cur: cur });
  }
  function saveDraft() {
    try {
      var s = draftPayload();
      if (s === lastSaved) return;
      localStorage.setItem(DRAFT_KEY, s);
      lastSaved = s;
    } catch (e) { /* quota plein / mode privé : le brouillon est un confort, pas une garantie */ }
  }
  // Toutes les 5 s, et à chaque fois que l'app passe en arrière-plan (sur
  // iPhone, `pagehide` est le seul signal fiable avant que Safari gèle
  // l'onglet — `beforeunload` n'y est pas garanti).
  setInterval(function () { if (dirty) saveDraft(); }, 5000);
  window.addEventListener('pagehide', saveDraft);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') saveDraft(); });

  var draftBar = document.getElementById('draft-bar');
  function offerDraft() {
    var raw;
    try { raw = localStorage.getItem(DRAFT_KEY); } catch (e) { return; }
    if (!raw) return;
    var o;
    try { o = JSON.parse(raw); } catch (e) { return; }
    if (!o || !o.doc || !o.doc.half) return;
    var when = '';
    try { when = new Date(o.at).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); } catch (e) {}
    document.getElementById('draft-txt').textContent =
      '📝 Brouillon récupéré — ' + (o.doc.title || 'sans titre') + (when ? ' · ' + when : '');
    draftBar.classList.add('show');
    document.getElementById('d-resume').onclick = function () {
      draftBar.classList.remove('show');
      loadDoc(reviveDoc(o.doc));
      cur = Math.min(o.cur || 0, steps().length - 1);
      gotoStep(cur);
      dirty = true;
      toast('Brouillon repris.', 'ok');
    };
    document.getElementById('d-new').onclick = function () {
      draftBar.classList.remove('show');
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
      lastSaved = '';
    };
  }

  // Un brouillon relu est du JSON nu : on le remet dans la forme attendue et
  // on rebouche ce qui manquerait (version antérieure du POC, champ ajouté
  // depuis). Mieux vaut un play amputé d'un champ qu'un écran blanc.
  function reviveDoc(d) {
    var base = makeDoc(), k;
    for (k in base) if (d[k] === undefined) d[k] = base[k];
    ['half', 'full'].forEach(function (m) {
      if (!d[m] || !Array.isArray(d[m].steps) || !d[m].steps.length) d[m] = { steps: [ makeStep(startPos(m)) ] };
      d[m].steps.forEach(function (s) {
        if (!s.pos) s.pos = startPos(m);
        if (!Array.isArray(s.arw)) s.arw = [];
        if (s.shot === undefined) s.shot = null;
        s.arw.forEach(function (a) { if (!Array.isArray(a.via)) a.via = []; });
      });
    });
    if (d.mode !== 'full') d.mode = 'half';
    return d;
  }

  // ── Publier ──────────────────────────────────────────────────────────
  document.getElementById('a-publish').addEventListener('click', function () {
    closeSheets();
    if (!doc.title.trim()) { metaToForm(); openSheet('sh-meta'); toast('Un titre est obligatoire pour publier.', 'err'); F.title.focus(); return; }
    if (!doc.id) doc.id = (slug(doc.title) || 'play') + '-' + Math.random().toString(36).slice(2, 7);
    var o = toJSON();
    var row = {
      id: doc.id, title: o.title, tag: o.tag, side: o.side, color: o.color,
      description: o.description, points_md: o.points_md, ball_start: o.ball_start,
      players: o.players, arrows: o.arrows, steps: o.steps,
      defense_enabled: o.defense_enabled, court_type: o.court_type,
      created_by: o.created_by, updated_at: new Date().toISOString(), deleted_at: null
    };
    toast('Publication…');
    sbFetch('plays_v2', { method: 'POST', body: row, prefer: 'resolution=merge-duplicates,return=minimal' })
      .then(function () {
        dirty = false; saveDraft();
        toast('Publié : ' + o.title, 'ok');
      })
      .catch(function (e) {
        // Le cas le plus probable au premier essai : la migration n'a pas
        // encore été appliquée. On le dit, plutôt que de laisser un code HTTP.
        var m = /HTTP 40[04]/.test(e.message) ? 'table plays_v2 absente — applique la migration 20260823_001.' : e.message;
        toast('Échec de la publication — ' + m, 'err');
      });
  });

  // ── Supprimer (soft-delete) ──────────────────────────────────────────

    sbFetch('plays_v2?id=eq.' + encodeURIComponent(doc.id),
      { method: 'PATCH', body: { deleted_at: new Date().toISOString() }, prefer: 'return=minimal' })
      .then(function () { toast('Supprimé.', 'ok'); doc.id = null; touch(); })
      .catch(function (e) { toast('Échec de la suppression — ' + e.message, 'err'); });
  });

  // ── Liste des plays publiés ──────────────────────────────────────────
  var plist = document.getElementById('plays-list');
  function loadPlays() {
    plist.innerHTML = '<div class="empty">Chargement…</div>';
    sbFetch('plays_v2?deleted_at=is.null&select=id,title,tag,side,color,court_type,steps,updated_at&order=updated_at.desc&limit=100')
      .then(function (rows) {
        if (!rows || !rows.length) { plist.innerHTML = '<div class="empty">Aucun play publié pour l\'instant.</div>'; return; }
        var html = '', i;
        for (i = 0; i < rows.length; i++) {
          var r = rows[i];
          var nst = Array.isArray(r.steps) ? r.steps.length : 0;
          html += '<div class="pitem" data-id="' + esc(r.id) + '">'
            + '<span class="dot" style="background:' + esc(/^#[0-9a-f]{3,8}$/i.test(r.color || '') ? r.color : '#22D3EE') + '"></span>'
            + '<span class="t"><b>' + esc(r.title) + '</b><small>'
            + esc(r.tag || r.side || '') + ' · ' + nst + ' temps · '
            + esc(r.court_type === 'full' ? 'terrain complet' : 'demi-terrain') + '</small></span>'
            + '<span style="font-size:16px;color:var(--ink-2)">›</span></div>';
        }
        plist.innerHTML = html;
      })
      .catch(function (e) {
        var m = /HTTP 40[04]/.test(e.message) ? 'table plays_v2 absente — applique la migration 20260823_001.' : e.message;
        plist.innerHTML = '<div class="empty">Impossible de charger — ' + esc(m) + '</div>';
      });
  }
  plist.addEventListener('click', function (e) {
    var it = e.target && e.target.closest ? e.target.closest('.pitem') : null;
    if (!it) return;
    var id = it.getAttribute('data-id');
    if (dirty && !confirm('Un play est en cours d\'édition.\nL\'ouvrir va le remplacer. Continuer ?')) return;
    sbFetch('plays_v2?id=eq.' + encodeURIComponent(id) + '&select=*&limit=1')
      .then(function (rows) {
        if (!rows || !rows.length) throw new Error('play introuvable');
        var d = fromJSON(rows[0]);
        closeSheets();
        loadDoc(d);
        dirty = false; saveDraft();
        toast('Ouvert : ' + d.title, 'ok');
      })
      .catch(function (err) { toast('Ouverture impossible — ' + err.message, 'err'); });
  });
  document.getElementById('a-plays').addEventListener('click', function () { openSheet('sh-plays'); loadPlays(); });
  document.getElementById('pl-reload').addEventListener('click', loadPlays);

  document.getElementById('a-newdoc').addEventListener('click', function () {
    closeSheets();
    if (dirty && !confirm('Un play est en cours d\'édition. Le remplacer par un play vierge ?')) return;
    loadDoc(makeDoc());
    dirty = false;
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    lastSaved = '';
    toast('Nouveau play.', 'ok');
  });

  // ─────────────────────────────────────────────────────────────────────
  // 14. DÉMARRAGE
  // ─────────────────────────────────────────────────────────────────────
  syncTitle();
  metaToForm();
  drawAll();
  renderTimeline();
  setHint();
  offerDraft();
})();
</script>
</body>
</html>
