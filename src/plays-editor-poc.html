  strip.addEventListener('click', function (e) {
    var t = e.target;
    if (!t || !t.getAttribute) return;
    var d = t.getAttribute('data-del');
    if (d !== null && d !== undefined) { e.stopPropagation(); delStep(+d); return; }
    var ins = t.getAttribute('data-ins');
    if (ins !== null && ins !== undefined) { e.stopPropagation(); insertStep(+ins); return; }
    if (playing) return;
    var chip = t.closest ? t.closest('.chip') : null;
    if (chip) gotoStep(+chip.getAttribute('data-i'));
  });
  document.getElementById('s-add').addEventListener('click', addStep);
  document.getElementById('s-sync').addEventListener('click', syncStep);

  // ─────────────────────────────────────────────────────────────────────
  // 8. LECTURE ANIMÉE
  // ─────────────────────────────────────────────────────────────────────
  // Découpage d'un temps, en fraction u ∈ [0,1] de sa durée :
  //   déplacements   u ∈ [0   , 0.65]   les joueuses glissent le long de leur
  //                                     courbe (easing doux aux deux bouts)
  //   passe          u ∈ [0.45, 0.90]   le trait pointillé se révèle, le
  //                                     ballon voyage dessus
  //   tir            u ∈ [0.70, 1.00]   halo qui pulse sur la tireuse, puis
  //                                     trajectoire jusqu'au cercle
  // Les fenêtres se CHEVAUCHENT volontairement : dans la réalité la passe part
  // avant que tout le monde ait fini de bouger. Un enchaînement strictement
  // séquentiel donne une animation hachée et beaucoup plus longue.
  var PLAY = { move: [0, 0.65], pass: [0.45, 0.90], shot: [0.70, 1.00] };

  var playing = false;       // lecture en cours (≠ « une frame est affichée »)
  var pRaf = 0, pT0 = 0, pStep = 0, pU = 0, pPrepared = -1, pPaths = null;
  var elPlay = document.getElementById('p-play');
  var elProg = document.getElementById('prog');
  var elFill = document.getElementById('prog-fill');
  var elSpeed = document.getElementById('p-speed');

  // Le viewer joueuse a SON réglage de vitesse (🐢/🐇), qui n'a pas à toucher
  // au sélecteur de l'éditeur : les deux mondes ne partagent que le moteur.
  function stepMs() { return vwOn ? VW_SPEEDS[vwSpeedIx] : (+elSpeed.value || 2000); }
  function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function win(u, w) { return clamp((u - w[0]) / (w[1] - w[0]), 0, 1); }

  // Prépare les <path> de mesure du temps k. Fait UNE fois par temps, jamais
  // par frame : getTotalLength() force un layout, c'est cher.
  function prepare(k) {
    if (pPrepared === k) return;
    pPrepared = k;
    layM.innerHTML = '';
    layP.innerHTML = '';
    pPaths = { moves: [], pass: null, shot: null };
    var st = steps()[k];
    if (!st) return;
    var p0 = st.pos, i;

    for (i = 0; i < st.arw.length; i++) {
      var a = st.arw[i];
      if (!isMoveKind(a.kind)) continue;
      var t = tokById(a.from, p0);
      if (!visible(t)) continue;
      var pts = rawPts(a, p0);
      if (!pts) continue;
      var d = buildPath(pts).d;
      var el = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      el.setAttribute('d', d);
      layM.appendChild(el);
      var trail = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      trail.setAttribute('class', 'trail' + (t.side === 'def' ? ' def' : ''));
      trail.setAttribute('d', d);
      var L = 0;
      try { L = el.getTotalLength(); } catch (_) { L = 0; }
      trail.setAttribute('stroke-dasharray', f(L) + ' ' + f(L));
      trail.setAttribute('stroke-dashoffset', f(L));
      layP.appendChild(trail);
      pPaths.moves.push({ id: a.from, el: el, len: L, trail: trail });
    }

    var ps = passOf(st);
    if (ps && arwVisibleIn(ps, p0)) {
      var g = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      g.setAttribute('class', 'pline');
      layP.appendChild(g);
      pPaths.pass = { arw: ps, el: g, ball: flyingBall() };
    }
    if (st.shot && visible(tokById(st.shot, p0))) {
      var sl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      sl.setAttribute('class', 'sline');
      var pu = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      pu.setAttribute('class', 'spulse');
      layP.appendChild(sl); layP.appendChild(pu);
      pPaths.shot = { id: st.shot, el: sl, pulse: pu, ball: flyingBall() };
    }
  }

  function arwVisibleIn(a, p) {
    if (!visible(tokById(a.from, p))) return false;
    if (typeof a.to === 'string' && !visible(tokById(a.to, p))) return false;
    return true;
  }

  function flyingBall() {
    var br = PR * 0.5;
    var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'fb');
    g.innerHTML = '<circle class="b" cx="0" cy="0" r="' + f(br) + '"/>'
      + '<line class="s" x1="' + f(-br) + '" y1="0" x2="' + f(br) + '" y2="0"/>'
      + '<line class="s" x1="0" y1="' + f(-br) + '" x2="0" y2="' + f(br) + '"/>';
    g.style.display = 'none';
    layP.appendChild(g);
    return g;
  }

  // Rend la frame (temps k, fraction u). Écrit UNIQUEMENT des attributs.
  function renderFrame(k, u) {
    var st = steps()[k];
    if (!st) return;
    prepare(k);
    var p0 = st.pos, id, i;

    // 1) positions — la joueuse suit sa courbe, les autres restent en place
    var live = {};
    for (id in p0) live[id] = { x: p0[id].x, y: p0[id].y };
    var mu = ease(win(u, PLAY.move));
    for (i = 0; i < pPaths.moves.length; i++) {
      var m = pPaths.moves[i];
      if (m.len > 0.01) {
        var q = m.el.getPointAtLength(m.len * mu);
        live[m.id] = { x: q.x, y: q.y };
      }
      m.trail.setAttribute('stroke-dashoffset', f(m.len * (1 - mu)));
    }
    for (id in tokEl) placeToken(id, live[id]);

    // 2) porteuse — masquée pendant qu'un ballon vole
    var holder = holderAt(k);
    var flying = false;
    var pf = 0, ps = pPaths.pass;
    if (ps) {
      pf = win(u, PLAY.pass);
      var A = live[ps.arw.from], B = typeof ps.arw.to === 'string' ? live[ps.arw.to] : ps.arw.to;
      if (A && B) {
        var pp = [{ x: A.x, y: A.y }].concat((ps.arw.via || []).map(function (v) { return { x: v.x, y: v.y }; }), [{ x: B.x, y: B.y }]);
        shrink(pp, 0, PR + 0.8); shrink(pp, pp.length - 1, PR + 1.2);
        ps.el.setAttribute('d', buildPath(pp).d);
        // Apparition puis effacement : le trait ne doit pas rester à l'écran,
        // sinon on ne distingue plus la passe de ce temps de celle du suivant.
        ps.el.setAttribute('opacity', f(pf <= 0 ? 0 : (pf < 0.15 ? pf / 0.15 : (pf > 0.9 ? (1 - pf) / 0.1 : 1))));
        if (pf > 0 && pf < 1) {
          flying = true;
          var bp = lerpPts(pp, pf);
          ps.ball.style.display = 'block';
          ps.ball.setAttribute('transform', 'translate(' + f(bp.x) + ' ' + f(bp.y) + ')');
        } else ps.ball.style.display = 'none';
        if (pf >= 1 && typeof ps.arw.to === 'string') holder = ps.arw.to;
      }
    }

    // 3) tir
    var sh = pPaths.shot;
    if (sh) {
      var sf = win(u, PLAY.shot), S = live[sh.id], H = hoop(S);
      if (S) {
        // Halo qui respire sur la tireuse pendant la première moitié.
        var pulseT = clamp(sf / 0.45, 0, 1);
        sh.pulse.setAttribute('cx', f(S.x)); sh.pulse.setAttribute('cy', f(S.y));
        sh.pulse.setAttribute('r', f(PR * (1.15 + 0.55 * Math.sin(pulseT * Math.PI))));
        sh.pulse.setAttribute('opacity', f(sf <= 0 ? 0 : (1 - pulseT) * 0.9));
        // Trajectoire : une cloche, pas une corde — un tir monte.
        var arc = shotArc(S, H);
        sh.el.setAttribute('d', arc.d);
        var rf = clamp((sf - 0.4) / 0.6, 0, 1);
        sh.el.setAttribute('stroke-dasharray', f(arc.len * rf) + ' ' + f(arc.len));
        sh.el.setAttribute('opacity', rf > 0 ? 1 : 0);
        if (rf > 0 && rf < 1) {
          flying = true;
          var q2 = quadAt(S, arc.c, H, rf);
          sh.ball.style.display = 'block';
          sh.ball.setAttribute('transform', 'translate(' + f(q2.x) + ' ' + f(q2.y) + ')');
        } else sh.ball.style.display = 'none';
        if (rf > 0) holder = null;
      }
    }

    for (id in tokEl) tokEl[id].classList.toggle('has-ball', !flying && id === holder);

    // Dribble : uniquement si la porteuse a une VRAIE courbe dans ce temps et
    // qu'on est dans la fenêtre de déplacement. Ballon en vol (passe ou tir) →
    // pas de dribble ; réception → la porteuse ne change qu'en fin de passe
    // (u >= 0.90), soit après la fenêtre de move : le receveur reste statique
    // jusqu'à ce que SON temps le fasse bouger.
    var drib = false;
    if (holder && !flying) {
      var mw = win(u, PLAY.move);
      if (mw > 0 && mw < 1) {
        for (i = 0; i < pPaths.moves.length; i++)
          if (pPaths.moves[i].id === holder && pPaths.moves[i].len > 0.01) { drib = true; break; }
      }
    }
    for (id in tokEl) tokEl[id].classList.toggle('dribbling', drib && id === holder);
    updateProgress(k, u);
  }

  // Position à la fraction t d'une polyligne (utilisée pour le ballon d'une
  // passe : le trait est court, l'approximation linéaire suffit et évite un
  // getPointAtLength par frame).
  function lerpPts(p, t) {
    var seg = [], total = 0, i;
    for (i = 0; i < p.length - 1; i++) {
      var d = Math.sqrt(Math.pow(p[i+1].x - p[i].x, 2) + Math.pow(p[i+1].y - p[i].y, 2));
      seg.push(d); total += d;
    }
    if (total < 0.01) return { x: p[0].x, y: p[0].y };
    var want = total * t, acc = 0;
    for (i = 0; i < seg.length; i++) {
      if (acc + seg[i] >= want) {
        var u = seg[i] ? (want - acc) / seg[i] : 0;
        return { x: p[i].x + (p[i+1].x - p[i].x) * u, y: p[i].y + (p[i+1].y - p[i].y) * u };
      }
      acc += seg[i];
    }
    return { x: p[p.length-1].x, y: p[p.length-1].y };
  }

  // Cloche du tir : point de contrôle décalé perpendiculairement au segment
  // tireuse→cercle, d'un quart de sa longueur. Simple, lisible, et ça donne la
  // même silhouette quel que soit l'endroit du terrain.
  function shotArc(S, H) {
    var dx = H.x - S.x, dy = H.y - S.y, L = Math.sqrt(dx * dx + dy * dy) || 1;
    var mx = (S.x + H.x) / 2, my = (S.y + H.y) / 2;
    var c = { x: mx - dy / L * (L * 0.22), y: my + dx / L * (L * 0.22) };
    return {
      d: 'M ' + f(S.x) + ' ' + f(S.y) + ' Q ' + f(c.x) + ' ' + f(c.y) + ' ' + f(H.x) + ' ' + f(H.y),
      len: L * 1.08, c: c
    };
  }
  function quadAt(a, c, b, t) {
    var m = 1 - t;
    return { x: m*m*a.x + 2*m*t*c.x + t*t*b.x, y: m*m*a.y + 2*m*t*c.y + t*t*b.y };
  }

  function updateProgress(k, u) {
    var n = steps().length;
    if (k === undefined) { k = cur; u = 0; }
    elFill.style.width = f(clamp((k + u) / n, 0, 1) * 100) + '%';
  }

  function enterPlay() {
    document.body.classList.add('playing');
    active = null; pending = null;
    syncSelection();
    pPrepared = -1;
  }
  function exitPlay() {
    document.body.classList.remove('playing');
    playing = false;
    if (pRaf) cancelAnimationFrame(pRaf);
    pRaf = 0;
    elPlay.textContent = '▶';
    elPlay.classList.remove('on');
    layP.innerHTML = ''; layM.innerHTML = '';
    pPrepared = -1; pPaths = null;
    elFps.textContent = '—';
    document.getElementById('s-sync').disabled = (cur === 0);
    // On retombe sur la PHOTO du temps où on s'est arrêté : l'éditeur reprend
    // exactement là, sans avoir à deviner un état intermédiaire.
    gotoStep(pStep);
  }

  function play() {
    if (playing) { pause(); return; }
    if (pU >= 1 && pStep >= steps().length - 1) { pStep = 0; pU = 0; }
    vwHalt = false;
    playing = true;
    enterPlay();
    elPlay.textContent = '⏸';
    elPlay.classList.add('on');
    fpsReset();
    pT0 = performance.now() - pU * stepMs();
    pRaf = requestAnimationFrame(tick);
  }
  function pause() {
    if (!playing) return;
    playing = false;
    if (pRaf) cancelAnimationFrame(pRaf);
    pRaf = 0;
    elPlay.textContent = '▶';
    elPlay.classList.remove('on');
    elFps.textContent = '—';
  }

  function tick(now) {
    if (!playing) return;
    var d = stepMs();
    var u = (now - pT0) / d;
    while (u >= 1) {
      if (pStep >= steps().length - 1) {
        // Côté joueuse : jamais de fin. On reboucle (et on remonte à la ligne
        // principale si on sortait d'une branche qui y revient).
        if (vwOn) { vwLoopEnd(now); u = 0; break; }
        pU = 1;
        renderFrame(pStep, 1);
        pause();
        return;
      }
      pStep++; u -= 1; pT0 += d;
      if (vwOn) { vwStepChanged(); if (vwHalt) break; }
    }
    // Pause automatique sur une bifurcation : on rend la photo du temps
    // atteint et on sort SANS replanifier — pause() a deja annule pRaf, et
    // replanifier ici ferait tourner deux boucles a la reprise.
    if (vwHalt) { vwHalt = false; pU = 0; renderFrame(pStep, 0); return; }
    pU = u;
    renderFrame(pStep, u);
    if (Math.floor(u * 1000) % 1000 === 0 || u < 0.02) setHint();
    fpsTick();
    pRaf = requestAnimationFrame(tick);
  }

  // Se placer n'importe où dans le play, lecture en cours ou non.
  function seek(r) {
    var n = steps().length;
    var g = clamp(r, 0, 0.9999) * n;
    pStep = Math.min(n - 1, Math.floor(g));
    pU = g - pStep;
    if (!document.body.classList.contains('playing')) enterPlay();
    renderFrame(pStep, pU);
    setHint();
    if (playing) pT0 = performance.now() - pU * stepMs();
  }

  elPlay.addEventListener('click', play);
  document.getElementById('p-first').addEventListener('click', function () {
    if (playing) pause();
    if (document.body.classList.contains('playing')) { pStep = 0; pU = 0; exitPlay(); }
    else gotoStep(0);
    pStep = cur; pU = 0; updateProgress();
  });
  document.getElementById('p-last').addEventListener('click', function () {
    if (playing) pause();
    if (document.body.classList.contains('playing')) { pStep = steps().length - 1; pU = 0; exitPlay(); }
    else gotoStep(steps().length - 1);
    pStep = cur; pU = 0; updateProgress();
  });
  elSpeed.addEventListener('change', function () {
    if (playing) pT0 = performance.now() - pU * stepMs();
  });

  (function scrub() {
    var on = false;
    function at(e) {
      var r = elProg.getBoundingClientRect();
      seek((e.clientX - r.left) / (r.width || 1));
    }
    elProg.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      on = true;
      try { elProg.setPointerCapture(e.pointerId); } catch (_) {}
      at(e);
    }, { passive: false });
    elProg.addEventListener('pointermove', function (e) { if (on) { e.preventDefault(); at(e); } }, { passive: false });
    function up(e) {
      if (!on) return;
      on = false;
      try { elProg.releasePointerCapture(e.pointerId); } catch (_) {}
      // Relâcher hors lecture = on adopte le temps visé comme temps d'édition.
      if (!playing) exitPlay();
    }
    elProg.addEventListener('pointerup', up);
    elProg.addEventListener('pointercancel', up);
  })();

  // ─────────────────────────────────────────────────────────────────────
  // 9. ENCART D'INFO + FPS
  // ─────────────────────────────────────────────────────────────────────
  function syncInfo() {
    var n = 0, l = step().arw, i;
    for (i = 0; i < l.length; i++) if (arwVisible(l[i])) n++;
    if (step().shot && visible(tokById(step().shot))) n++;
    elTok.textContent = doc.defOn ? '10' : '5';
    elArw.textContent = String(n);
    var b = tokById(holderAt(cur));
    // Pas de préfixe « # » : il ne veut plus rien dire devant une lettre, et
    // le 🏀 de l'encart annonce déjà de quoi on parle.
    elBal.textContent = (b && visible(b)) ? labelOf(b.id) : '—';
  }

  var fpsN = 0, fpsT = 0;
  function fpsReset() { fpsN = 0; fpsT = performance.now(); elFps.textContent = '…'; }
  function fpsTick() {
    fpsN++;
    var now = performance.now();
    if (now - fpsT >= 400) {
      elFps.textContent = Math.round(fpsN * 1000 / (now - fpsT));
      fpsN = 0; fpsT = now;
    }
  }

  var HINTS = {
    select: 'Glisse les jetons. <b>Tape</b> une joueuse puis <b>🏀</b> pour lui donner le ballon.<br><b>Double-tape une flèche</b> pour lui ajouter un point de passage.',
    move:   'Tape la joueuse qui se déplace, <b>puis l\'endroit où elle va</b>. Flèche pleine.',
    screen: 'Tape la <b>poseuse d\'écran</b>, puis <b>où elle pose son écran</b>. Flèche de déplacement + le mur à l\'arrivée.',
    pass:   'Tape la <b>passeuse</b>, puis la <b>réceptionneuse</b>. Flèche pointillée.',
    shot:   'Tape la joueuse qui <b>tire</b> à la fin de ce temps. Re-tape pour annuler.',
    erase:  'Tape une flèche pour la <b>supprimer</b>, un point de passage pour le <b>retirer</b>.'
  };
  function setHint() {
    var h = HINTS[tool];
    if (playing || document.body.classList.contains('playing')) {
      elHint.innerHTML = 'Lecture — temps <b>' + (pStep + 1) + '</b> / ' + steps().length + '. Glisse la barre pour te déplacer.';
      return;
    }
    if (pending) {
      h = 'Source : <b>' + labelOf(pending) + '</b> — '
        + (tool === 'pass' ? 'tape maintenant la réceptionneuse.' : 'tape maintenant la destination.')
        + ' (tape dans le vide pour annuler)';
    } else {
      h = '<b>Temps ' + (cur + 1) + '/' + steps().length + '</b> · ' + h;
    }
    elHint.innerHTML = h;
  }

  // ─────────────────────────────────────────────────────────────────────
  // 10. UI — outils, terrain, vue
  // ─────────────────────────────────────────────────────────────────────
  var TOOLS = ['select', 'move', 'screen', 'pass', 'shot', 'erase'];
  function setTool(t) {
    if (playing || document.body.classList.contains('playing')) exitPlay();
    tool = t;
    pending = null;
    if (t !== 'select') active = null;
    document.body.setAttribute('data-tool', t);
    TOOLS.forEach(function (k) { document.getElementById('t-' + k).classList.toggle('on', k === t); });
    syncSelection(); setHint();
  }
  TOOLS.forEach(function (k) {
    document.getElementById('t-' + k).addEventListener('click', function () { setTool(k); });
  });

  // Ballon : un seul porteur AU TEMPS 0. Re-cliquer sur la porteuse le retire
  // (il faut pouvoir dessiner une situation sans ballon, ex. un écran hors
  // ballon). Aux temps suivants, la porteuse est DÉRIVÉE des passes : la
  // changer à la main n'aurait pas de sens, on renvoie donc au temps 0.
  document.getElementById('b-ball').addEventListener('click', function () {
    if (!active) return;
    if (cur !== 0) { toast('La porteuse se règle au temps 1 ; ensuite elle suit les passes.', 'err'); return; }
    doc.ballStart = (doc.ballStart === active) ? null : active;
    syncBall(); syncInfo(); touch();
  });

  // La défense n'est jamais détruite (cf. section 2) : on ne fait que la
  // montrer ou la cacher, positions et flèches comprises.
  document.getElementById('b-def').addEventListener('click', function () {
    doc.defOn = !doc.defOn;
    this.classList.toggle('on', doc.defOn);
    if (!doc.defOn && active && TOKMAP[active].side === 'def') active = null;
    if (!doc.defOn && pending && TOKMAP[pending].side === 'def') pending = null;
    drawTokens(); drawArrows(); syncInfo(); setHint(); touch();
  });

  document.getElementById('b-reset').addEventListener('click', function () {
    if (!confirm('Repartir de la disposition de départ ?\nTous les temps de ce terrain sont perdus.')) return;
    doc[doc.mode] = { steps: [ makeStep(startPos(doc.mode)) ] };
    cur = 0; active = null; pending = null;
    drawAll(); renderTimeline(); setHint(); touch();
  });

  function setMode(m) {
    if (m === mode()) return;
    if (document.body.classList.contains('playing')) exitPlay();
    doc.mode = m;
    document.getElementById('m-half').classList.toggle('on', m === 'half');
    document.getElementById('m-full').classList.toggle('on', m === 'full');
    bpath = [];   // chaque mode a SES temps, donc SES branches
    cur = 0; active = null; pending = null;
    pStep = 0; pU = 0;
    drawAll(); renderTimeline(); setHint(); touch();
  }
  document.getElementById('m-half').addEventListener('click', function () { setMode('half'); });
  document.getElementById('m-full').addEventListener('click', function () { setMode('full'); });

  // ── MIROIR : basculer le play sur l'autre demi-terrain ───────────────
  // Les deux demi-terrains sont géométriquement identiques au miroir près :
  // « le même play de l'autre côté » n'est donc pas une nouvelle vue, c'est la
  // MÊME donnée avec x → largeur − x. On la retourne pour de bon (positions,
  // destinations libres et points de passage, sur TOUS les temps du mode
  // courant) plutôt que de porter un drapeau « je suis à droite » qu'il
  // faudrait ensuite honorer dans le drag, l'export, la lecture et le JSON.
  // L'opération est sa propre inverse : re-taper ⇋ ramène le play d'où il
  // venait, donc rien n'est jamais perdu.
  //
  // Les jetons ne se touchent pas : ils ne portent aucune orientation propre.
  // Les tirs non plus — en terrain complet, hoop() vise déjà le panier le plus
  // proche, donc ils suivent le play sans rien à recalculer.
  //
  // Depuis le jalon 4 le miroir descend dans TOUTES les branches : ne
  // retourner que la ligne courante laisserait les variantes de l'autre côté
  // du terrain, et la première bifurcation téléporterait l'équipe entière.
  function mirrorMode() {
    if (document.body.classList.contains('playing') && !vwOn) exitPlay();
    var W = MODES[mode()].w;
    function mx(p) { if (p && typeof p.x === 'number') p.x = f(W - p.x); }
    (function walk(l) {
      var i, j, k;
      for (i = 0; i < l.length; i++) {
        for (k in l[i].pos) mx(l[i].pos[k]);
        for (j = 0; j < l[i].arw.length; j++) {
          var a = l[i].arw[j];
          if (a.to && typeof a.to === 'object') mx(a.to);
          (a.via || []).forEach(mx);
        }
        if (Array.isArray(l[i].branches)) for (j = 0; j < l[i].branches.length; j++) walk(l[i].branches[j].steps);
      }
    })(rootSteps());
    active = null; pending = null;
    // Côté joueuse le miroir est un CONFORT de lecture : il ne salit pas le
    // document (pas de touch(), donc pas de brouillon, pas de publication).
    if (vwOn) { vwRedraw(); return; }
    drawAll(); renderTimeline(); setHint(); touch();
    toast(mode() === 'half' ? 'Play basculé sur l\'autre demi-terrain.' : 'Play basculé sur l\'autre panier.', 'ok');
  }
  document.getElementById('b-mirror').addEventListener('click', mirrorMode);

  // ── Taille des jetons ────────────────────────────────────────────────
  function syncSizeButtons() {
    var v = doc.tokenSize || 1, k;
    for (k in SIZES) document.getElementById('z-' + k).classList.toggle('on', SIZES[k] === v);
  }
  function setTokenSize(k) {
    var v = SIZES[k] || 1;
    if ((doc.tokenSize || 1) === v) return;
    doc.tokenSize = v;
    syncSizeButtons();
    // drawAll() recalcule PR, donc les jetons, les chiffres, les ballons ET
    // les markers (pointes / barres d'écran) d'un seul geste.
    // Côté joueuse : réglage de confort, on ne sort pas de la lecture (et on
    // ne salit pas le document — cf. mirrorMode).
    if (vwOn) { vwRedraw(); return; }
    if (document.body.classList.contains('playing')) exitPlay();
    drawAll(); touch();
  }
  Object.keys(SIZES).forEach(function (k) {
    document.getElementById('z-' + k).addEventListener('click', function () { setTokenSize(k); });
  });

  // ── Étiquette des pastilles : chiffres ou lettres (v.175) ────────────
  // Affichage PUR : le modèle continue de désigner les joueuses par leur id
  // ('a3') et le format d'échange par son numéro SIGNÉ (+3 / −3). Basculer ne
  // renumérote donc rien, et un JSON exporté en lettres reste lisible par
  // n'importe quel outil qui ignore `player_label_style`.
  function syncLabelButton() {
    var letters = doc.labelStyle === 'letters';
    var b = document.getElementById('b-label');
    b.textContent = letters ? '🔤' : '🔢';
    b.classList.toggle('on', letters);
  }
  document.getElementById('b-label').addEventListener('click', function () {
    doc.labelStyle = doc.labelStyle === 'letters' ? 'numbers' : 'letters';
    syncLabelButton();
    // Les positions vivent dans step().pos, pas dans le DOM : redessiner les
    // jetons ne peut pas les perdre. Et pas de drawAll() — ni le terrain ni
    // les flèches n'ont bougé, seul le texte des pastilles change.
    drawTokens(); syncInfo(); setHint(); touch();
  });

  // Le bouton 3D est présent mais désactivé tant que VIEWS['3d'].ready est
  // false — la bascule elle-même est déjà écrite, il ne manquera que le
  // renderer au jalon 4.
  function setView(v) {
    if (!VIEWS[v] || !VIEWS[v].ready || v === view) return;
    view = v;
    document.getElementById('v-2d').classList.toggle('on', v === '2d');
    document.getElementById('v-3d').classList.toggle('on', v === '3d');
    drawAll();
  }
  document.getElementById('v-2d').addEventListener('click', function () { setView('2d'); });
  document.getElementById('v-3d').addEventListener('click', function () { setView('3d'); });
  document.getElementById('v-3d').disabled = !VIEWS['3d'].ready;

  // ─────────────────────────────────────────────────────────────────────
  // 10 bis. COULEURS D'ÉQUIPE PILOTÉES PAR LE THÈME (v.174)
  // ─────────────────────────────────────────────────────────────────────
  // Les jetons et les flèches ne sont plus cyan/violet en dur : ils dérivent
  // de `--pb-primary` (attaque) et `--pb-secondary` (défense). L'ordre de
  // recherche va du plus explicite au plus général —
  //   ?accent= / ?accent2=  (l'appelant a le dernier mot)
  //   --pb-primary / --pb-secondary
  //   --accent / --primary / --accent-rgb   (les tokens de l'app)
  // — et si RIEN n'est lisible, on ne touche à rien : le repli déclaré dans
  // la feuille de style (cyan/violet) tient, en clair comme en sombre.
  //
  // Pas de secondaire ⇒ elle est la COMPLÉMENTAIRE de la primaire (+180° en
  // HSL), avec une saturation plancher : la complémentaire d'un gris est un
  // gris, et deux équipes grises ne se distinguent pas.
  //
  // Une seule teinte suffit à tout : les variantes claires (dégradé du jeton),
  // le liseré sombre, l'encre du chiffre (choisie au contraste) et la couleur
  // des flèches (assombrie sur parquet clair, éclaircie sur parquet sombre).
  function hx2(n) { n = Math.round(clamp(n, 0, 255)); return (n < 16 ? '0' : '') + n.toString(16); }
  function rgbHex(r, g, b) { return '#' + hx2(r) + hx2(g) + hx2(b); }
  function hexToRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  // Accepte #abc, #aabbcc, rgb()/rgba(), et « 255, 107, 0 » — la forme que
  // prend `--accent-rgb` côté app, qui n'est pas une couleur CSS valide seule.
  function hexOf(v) {
    v = String(v == null ? '' : v).trim();
    if (!v) return null;
    if (/^#[0-9a-f]{3}$/i.test(v)) return ('#' + v[1] + v[1] + v[2] + v[2] + v[3] + v[3]).toLowerCase();

  var TEAM_VARS = ['--player', '--player-hi', '--player-ink', '--def', '--def-hi',

  }

  }
  function applyTeamColors() {
    var R = document.documentElement, i;

    // qu'on a écrite au tour précédent au lieu de celle du thème courant, et
    // la couleur dériverait à chaque bascule 🌓.

  // ── Logo du parquet ──────────────────────────────────────────────────
  // Chargé UNE fois, converti en data: URI, puis re-posé après chaque
  // drawAll(). Le data: est indispensable : à l'export photo le SVG est
  // rasterisé depuis une data: URL, et un SVG servi ainsi n'a pas le droit
  // d'aller chercher une ressource externe — avec un simple chemin, le logo
  // serait à l'écran mais absent du PNG.
  var LOGO_SRC = '/assets/bcl-logo-256.png';
  var XLINK = 'http://www.w3.org/1999/xlink';
  var logoData = null;

    var el = document.getElementById('court-logo');

    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
    .then(function (b) {
      return new Promise(function (res, rej) {
        var rd = new FileReader();
        rd.onload = function () { res(String(rd.result)); };
        rd.onerror = function () { rej(new Error('lecture impossible')); };
        rd.readAsDataURL(b);
      });

    .then(function (d) { logoData = d; applyLogo(); })
    // TODO logo introuvable (assets/bcl-logo-256.png déplacé ?) : le parquet
    // reste nu. Ce n'est pas bloquant, on ne dérange donc pas le coach.
    .catch(function () {});

    updateArrow('__shot');
  });

  // ─────────────────────────────────────────────────────────────────────

  };

  // ─────────────────────────────────────────────────────────────────────
  // 12. FORMAT D'ÉCHANGE — export / import JSON
  // ─────────────────────────────────────────────────────────────────────
  // Numéro SIGNÉ : +n = attaquante n, −n = défenseure n. Un seul entier suffit
  // donc à désigner n'importe qui, ce qui garde `ball_start` et `shot` dans un
  // `int` en base et évite un objet {side,n} partout dans le JSON.
  function numOf(id) { var t = TOKMAP[id]; return t ? (t.side === 'atk' ? t.n : -t.n) : null; }
  function idOfNum(v) {
    v = Number(v);

    var id = v > 0 ? 'a' + v : 'd' + (-v);
    return TOKMAP[id] ? id : null;
  }
  function pt(p) { return { x: f(p.x), y: f(p.y) }; }

  // Encodage d'UNE ligne de temps — la principale, ou celle d'une branche.
  // Les branches sont rangées DANS leur temps de départ (`branches[]`), donc
  // récursivement : un lecteur qui ignore la clé lit la ligne principale et
  // rien de plus, ce qui est exactement le comportement voulu (rétrocompat).
  //
  // `flat` (le tableau `arrows` du format d'échange, plat par construction) ne
  // reçoit QUE la ligne principale : il n'a pas de place pour dire « ce
  // déplacement appartient à la variante 2 », et le remplir avec les branches
  // ferait lire à un outil tiers un play impossible.
  function encSteps(list, flat, depth) {
    var out = [], i, j, id;
    for (i = 0; i < list.length; i++) {
      var s = list[i], moves = [], passes = [], screens = [];
      for (j = 0; j < s.arw.length; j++) {
        var a = s.arw[j];
        var via = (a.via || []).map(pt);

          var d = typeof a.to === 'string' ? s.pos[a.to] : a.to;
          if (!d) continue;
          var rec = { player: numOf(a.from), to: pt(d), via: via };

          // un lecteur qui ne connaît pas les écrans (le format d'échange
          // atk-zone, un export antérieur à la v.174) ignore la clé et affiche
          // un play correct, simplement sans les barres.
          if (a.kind === 'screen') screens.push(rec); else moves.push(rec);
          if (flat) flat.push({ step: i, kind: a.kind, from: numOf(a.from), to: pt(d), via: via });
        } else {
          passes.push({ from: numOf(a.from), to: typeof a.to === 'string' ? numOf(a.to) : pt(a.to), via: via });
          if (flat) flat.push({ step: i, kind: 'pass', from: numOf(a.from), to: typeof a.to === 'string' ? numOf(a.to) : pt(a.to), via: via });
        }
      }

      for (id in s.pos) positions[id] = pt(s.pos[id]);
      if (s.shot && flat) flat.push({ step: i, kind: 'shot', from: numOf(s.shot) });

        n: i + 1, note: s.note || '',

        // `pass` (singulier) duplique passes[0] : c'est la clé du format
        // d'échange atk-zone. `passes` porte le cas — rare mais réel — de deux
        // passes dans le même temps.
        pass: passes.length ? passes[0] : null,
        passes: passes,
        shot: s.shot ? numOf(s.shot) : null,
        positions: positions
      };
      if (depth < BR_DEPTH_MAX && Array.isArray(s.branches) && s.branches.length) {
        o.branches = s.branches.slice(0, BR_PER_STEP).map(function (b) {
          return {
            id: b.id, name: b.name || 'Variante', description: b.description || '',
            returns_to_main: b.returns_to_main !== false,
            steps: encSteps(b.steps || [], null, depth + 1)

    }
    return out;
  }

  // ⚠️ rootSteps() et NON steps() : publier depuis l'intérieur d'une branche
  // doit publier le play ENTIER, pas promouvoir la variante en ligne
  // principale. Le chemin de navigation ne doit jamais fuir dans le document.
  function toJSON() {
    var st = rootSteps(), i;
    var players = [], id;
    for (i = 0; i < TOKENS.length; i++) {
      id = TOKENS[i].id;
      var q = st[0].pos[id];
      if (!q) continue;
      players.push({ id: id, side: TOKENS[i].side, n: TOKENS[i].n, x: f(q.x), y: f(q.y) });
    }
    var flat = [];
    var outSteps = encSteps(st, flat, 0);
    return {
      format: 'pb-play/2',
      id: doc.id || slug(doc.title) || 'anim',
      title: doc.title || 'Sans titre',
      tag: doc.tag || null,
      side: doc.side || 'attaque',
      color: doc.color || '#22D3EE',
      description: doc.description || '',
      points_md: doc.points || '',
      court_type: doc.mode,
      defense_enabled: !!doc.defOn,
      players_size: doc.tokenSize || 1,
      player_label_style: doc.labelStyle === 'letters' ? 'letters' : 'numbers',
      ball_start: doc.ballStart ? numOf(doc.ballStart) : null,
      created_by: doc.author || null,
      players: players,
      arrows: flat,
      steps: outSteps

  }

  // Import TOLÉRANT : le fichier peut venir d'ailleurs (atk-zone.json de
  // référence, export d'un autre outil). On accepte les deux conventions de
  // nommage vues dans la nature (snake_case et camelCase) et les deux façons
  // de désigner une joueuse (numéro signé, ou {side,n}, ou id 'a3'). Ce qu'on
  // n'accepte pas : un fichier sans les clés obligatoires — on refuse alors
  // proprement plutôt que de charger un demi-play silencieusement cassé.
  function pick(o) {
    var i;
    for (i = 1; i < arguments.length; i++) if (o[arguments[i]] !== undefined && o[arguments[i]] !== null) return o[arguments[i]];
    return undefined;
  }
  function refId(v) {
    if (v === null || v === undefined) return null;
    if (typeof v === 'number') return idOfNum(v);
    if (typeof v === 'string') {
      if (TOKMAP[v]) return v;
      var n = Number(v);
      return isFinite(n) ? idOfNum(n) : null;
    }
    if (typeof v === 'object') {
      if (v.id && TOKMAP[v.id]) return v.id;
      if (v.n !== undefined) return (v.side === 'def' || v.side === 'defense') ? idOfNum(-Math.abs(v.n)) : idOfNum(Math.abs(v.n));
      if (v.x !== undefined && v.y !== undefined) return null;   // c'est un point, pas une joueuse
    }
    return null;
  }
  function refPoint(v) {
    if (v && typeof v === 'object' && v.x !== undefined && v.y !== undefined) return { x: +v.x, y: +v.y };
    return null;
  }

  function fromJSON(o) {
    if (!o || typeof o !== 'object') throw new Error('Ce fichier n\'est pas un objet JSON.');
    var miss = [];
    if (!o.id) miss.push('id');
    if (!o.title) miss.push('title');
    if (!Array.isArray(o.players)) miss.push('players');
    if (!Array.isArray(o.steps)) miss.push('steps');
    if (miss.length) throw new Error('Clés manquantes ou invalides : ' + miss.join(', ') + '.');

    var m = (pick(o, 'court_type', 'courtType') === 'full') ? 'full' : 'half';
    var d = makeDoc();
    d.id = String(o.id);
    d.title = String(o.title);
    d.tag = pick(o, 'tag') || '';
    d.side = pick(o, 'side') || 'attaque';
    if (['attaque','defense','transition','remise'].indexOf(d.side) < 0) d.side = 'attaque';
    d.color = pick(o, 'color') || '#22D3EE';
    d.description = pick(o, 'description') || '';
    d.points = pick(o, 'points_md', 'pointsMd', 'points') || '';
    if (Array.isArray(d.points)) d.points = d.points.join('\n');
    d.author = pick(o, 'created_by', 'createdBy', 'author') || '';
    d.mode = m;
    d.defOn = !!pick(o, 'defense_enabled', 'defenseEnabled');
    // Taille des jetons : on n'accepte que les trois crans connus. Un fichier
    // qui dirait 3,7 étalerait des jetons plus larges que la raquette.
    var ts = +pick(o, 'players_size', 'playersSize', 'token_size');
    d.tokenSize = (ts === 0.75 || ts === 1 || ts === 1.25) ? ts : 1;
    // Liste fermée : tout ce qui n'est pas 'letters' retombe sur les chiffres,
    // qui restent le défaut historique.
    d.labelStyle = pick(o, 'player_label_style', 'playerLabelStyle', 'label_style') === 'letters' ? 'letters' : 'numbers';
    d.ballStart = refId(pick(o, 'ball_start', 'ballStart'));

    // Positions de départ : ce que `players` dit, complété par la disposition
    // par défaut pour tout jeton absent (un fichier à 5 joueuses reste valide,
    // la défense prend alors ses places de départ et reste masquée).
    var p0 = startPos(m), i, j;
    for (i = 0; i < o.players.length; i++) {
      var pl = o.players[i];
      var id = refId(pl);
      if (!id || !isFinite(+pl.x) || !isFinite(+pl.y)) continue;
      p0[id] = { x: +pl.x, y: +pl.y };
    }

    var out = decSteps(o.steps, p0, 0);
    if (!out.length) out.push(makeStep(p0));
    d[m] = { steps: out };
    return d;
  }

  // Décodage d'une ligne de temps, récursif sur `branches`. Une branche part
  // de la SORTIE de son temps de départ : c'est la seule entrée cohérente,
  // et c'est aussi celle que l'éditeur fige au moment de la bifurcation.
  function decSteps(arr, prev, depth) {
    var out = [], i, j;
    if (!Array.isArray(arr)) return out;
    for (i = 0; i < arr.length; i++) {
      var s = arr[i] || {};
      // `positions` si le fichier la porte (round-trip exact), sinon on dérive
      // du temps précédent — c'est la seule information disponible.
      var sp = clonePos(prev);
      var given = pick(s, 'positions', 'pos');
      if (given && typeof given === 'object') {
        for (var k in given) {

          var q = refPoint(given[k]);

      var st = makeStep(sp);
      st.note = s.note || '';
      var moves = Array.isArray(s.moves) ? s.moves : [];
      for (j = 0; j < moves.length; j++) {
        var mv = moves[j];
        var from = refId(pick(mv, 'player', 'p', 'from', 'id'));
        var to = refPoint(pick(mv, 'to', 'dest', 'end'));
        if (!from || !to) continue;
        st.arw.push({ id: uid('w'), kind: 'move', from: from, to: to, via: (Array.isArray(mv.via) ? mv.via : []).map(refPoint).filter(Boolean) });
      }
      var scr = Array.isArray(s.screens) ? s.screens : [];
      for (j = 0; j < scr.length; j++) {
        var sc = scr[j];
        var sfrom = refId(pick(sc, 'player', 'p', 'from', 'id'));
        var sto = refPoint(pick(sc, 'to', 'dest', 'end'));
        if (!sfrom || !sto) continue;
        st.arw.push({ id: uid('w'), kind: 'screen', from: sfrom, to: sto, via: (Array.isArray(sc.via) ? sc.via : []).map(refPoint).filter(Boolean) });
      }
      var ps = Array.isArray(s.passes) ? s.passes : (s.pass ? [s.pass] : []);
      for (j = 0; j < ps.length; j++) {
        var pa = ps[j];
        if (!pa) continue;
        var pf = refId(pick(pa, 'from', 'passer'));
        var ptTo = refId(pick(pa, 'to', 'receiver')) || refPoint(pick(pa, 'to'));
        if (!pf || !ptTo) continue;
        st.arw.push({ id: uid('w'), kind: 'pass', from: pf, to: ptTo, via: (Array.isArray(pa.via) ? pa.via : []).map(refPoint).filter(Boolean) });
      }
      st.shot = refId(s.shot);

      // ── Branches (jalon 4) ──────────────────────────────────────────
      // Caps appliqués À L'IMPORT : un fichier bricoté à la main ne doit pas
      // pouvoir faire exploser la profondeur (et donc la pile) de l'éditeur.
      var br = Array.isArray(s.branches) ? s.branches : [];
      if (br.length && depth < BR_DEPTH_MAX) {
        var kids = [];
        for (j = 0; j < br.length && kids.length < BR_PER_STEP; j++) {
          var b = br[j];
          if (!b || typeof b !== 'object') continue;
          var ks = decSteps(b.steps, endPos(st), depth + 1);
          if (!ks.length) continue;   // une branche vide n'est pas une branche
          kids.push({
            id: String(b.id || uid('b')),
            name: String(b.name || 'Variante').slice(0, 60),
            description: String(b.description || pick(b, 'desc') || '').slice(0, 160),

  // ─────────────────────────────────────────────────────────────────────
  // Rastériser un <svg> du document ne suffit pas : une fois sérialisé, il est
  // COUPÉ de la feuille de style, donc de toutes les var(--…). Un export naïf
  // sort un terrain blanc sur fond blanc. On inline donc les styles CALCULÉS
  // sur une copie avant de sérialiser — c'est la seule façon d'obtenir la même
  // image que ce que le coach a sous les yeux, thème sombre compris.

    'fill', 'fill-opacity', 'stroke', 'stroke-opacity', 'stroke-width',
    'stroke-dasharray', 'stroke-dashoffset', 'stroke-linecap', 'stroke-linejoin',
    'opacity', 'display', 'visibility',

    // écrans SANS barre : la tête n'est plus un <path> du document, c'est un

        // servi en data:. On ne garde que le fragment.

  // une impression A4 ou une projection, sans peser 4 Mo par temps.
  //
  // v.177 — le commentaire d'origine affirmait « aucune image externe dans la
  // scène, le canvas ne peut donc pas être teinté ». La v.174 a posé le LOGO du
  // club — un <image> raster — sur le parquet : l'affirmation est devenue
  // fausse. Sur WebKit, rastériser un SVG qui embarque une image teinte le
  // canvas, et le toBlob() partait alors en SecurityError DEPUIS le img.onload,
  // c'est-à-dire hors de toute chaîne de promesse : ni res(), ni rej(). Le
  // toast « Photo… » restait affiché pour l'éternité et aucun fichier ne
  // descendait — d'où « l'export photo ne fonctionne pas ».
  // On sonde donc la teinte tout de suite (getImageData d'un pixel), et on
  // refait une passe SANS le logo plutôt que de ne rien rendre du tout.
  function courtCanvas(px, noLogo) {
    return new Promise(function (res, rej) {

      var scale = (px || 1800) / c0.w;
      var W = Math.round(c0.w * scale), H = Math.round(c0.h * scale);
      var clone = svg.cloneNode(true);
      // Inliner AVANT de retirer quoi que ce soit : les deux arbres sont
      // parcourus en parallèle, ils doivent avoir exactement la même forme.
      inlineStyles(svg, clone);
      // Les markers (pointes, barres d'écran) vivent dans <defs> : selon le
      // navigateur, le `display` CALCULÉ de leurs enfants peut valoir `none`.
      // Recopié tel quel dans la copie, il ferait disparaître toutes les
      // pointes du PNG. On le retire — un marker n'est de toute façon dessiné
      // que là où il est référencé.
      [].slice.call(clone.querySelectorAll('marker, marker *')).forEach(function (e) {
        e.style.removeProperty('display');

  // ─────────────────────────────────────────────────────────────────────
  // 13bis. EXPORT ANIMÉ — vidéo (WebM/MP4) et GIF
  // ─────────────────────────────────────────────────────────────────────
  // Même source que la photo : chaque image est un seek() dans la lecture,
  // rastérisé en SVG→canvas. On NE capture PAS le terrain à l'écran — un
  // captureStream() du <svg> vivant embarquerait les poignées d'édition et
  // tournerait à la vitesse du rendu, pas à celle du play. Ici, la cadence est
  // décidée par nous, pas subie.

  var VID_PX = 720;
  var GIF_PX = 500;       // au-delà, un GIF de 8 temps dépasse allègrement 10 Mo

  function animFrames() {
    var total = steps().length * stepMs();
    // Plafond dur : au-delà, la génération devient plus longue que la patience
    // du coach, et le GIF plus lourd que ce qu'un SMS accepte.
    return Math.max(2, Math.min(200, Math.round(total / 1000 * ANIM_FPS)));
  }

          for (j = 0; j < px.length; j++) px[j] = gifIndex(d[j*4], d[j*4+1], d[j*4+2]);
          frames.push(px);
          toast('GIF — ' + Math.round((k + 1) * 100 / n) + '%…');
          return loop(k + 1);
        });
      })(0);
    }).then(function () {
      if (!frames.length) throw new Error('aucune image');
      var b = gifBlob(frames, W, H, delay);
      dl(b, baseName() + '.gif');
      toast('GIF enregistré — ' + frames.length + ' images, ' + Math.round(b.size / 1024) + ' Ko.', 'ok');
    }).catch(function (e) { toast('GIF impossible — ' + e.message, 'err'); });
  });

  // ─────────────────────────────────────────────────────────────────────
  // 14. PERSISTANCE — brouillon local + animations d'un play existant
  // ─────────────────────────────────────────────────────────────────────
  // L'animation n'est PAS une entité à part : c'est un média du play, au même
  // titre qu'une vidéo ou une photo. Elle vit donc dans `plays.animations`
  // (jsonb, un tableau d'objets au format d'échange de la section 12) et non
  // dans une table dédiée.
  //
  // CANAL SÉPARÉ, ET C'EST VOLONTAIRE — l'entité PbSync `plays` d'index.html
  // LIT la colonne (pour afficher la liste des animations) mais ne l'ÉCRIT
  // jamais. Sans cette asymétrie, un appareil au localStorage un peu vieux
  // repousserait son `animations` périmé au prochain flush et effacerait le
  // travail d'un autre : c'est exactement le scénario du playbook
  // « réconcilier avant de pousser ». Ici l'éditeur est le seul écrivain, et
  // un upsert PostgREST ne touche pas aux colonnes qu'on ne lui donne pas.
  //
  // Il reste une course, assumée : deux coachs qui éditent DEUX animations du
  // MÊME play en même temps. On la réduit en relisant le tableau juste avant
  // d'écrire et en ne remplaçant que l'entrée concernée (read-modify-write) ;
  // la fenêtre résiduelle se compte en centaines de millisecondes.
  //
  // Clé publishable, déjà publique dans index.html (cf. en-tête du fichier).
  var SB_URL = 'https://orertxlsvkdqayybgwaq.supabase.co';
  var SB_KEY = 'sb_publishable_pJwgqWwDDhhST6xh9IbzbA_a0ANDwUt';
  var DRAFT_KEY = 'pb_editor_v2_draft';

  var Q = new URLSearchParams(location.search);
  var playId = Q.get('play') || null;      // le play auquel on est rattaché
  var wantAnim = Q.get('anim') || null;    // l'animation à ouvrir, s'il y en a
  var wantView = Q.get('mode') === 'view'; // ouvrir directement en lecture
  var playTitle = '';

  function sbFetch(path, opts) {
    opts = opts || {};
    var h = {
      'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,
      'Content-Type': 'application/json', 'Accept': 'application/json'
    };
    if (opts.prefer) h['Prefer'] = opts.prefer;
    return fetch(SB_URL + '/rest/v1/' + path, {
      method: opts.method || 'GET', headers: h,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw new Error('HTTP ' + r.status + ' — ' + t.slice(0, 180)); });
      if (r.status === 204) return null;
      return r.text().then(function (t) { return t ? JSON.parse(t) : null; });
    });
  }

  // Message parlant plutôt qu'un code HTTP : au premier essai, la cause la plus
  // probable est que la migration n'a pas encore été appliquée.
  function sbMsg(e) {
    if (/animations/.test(e.message) && /column|colonne/i.test(e.message))
      return 'colonne plays.animations absente — applique la migration 20260823_002.';
    if (/HTTP 40[04]/.test(e.message)) return 'play introuvable ou colonne animations absente (migration 20260823_002).';
    return e.message;
  }

  function fetchAnims() {
    if (!playId) return Promise.resolve([]);
    return sbFetch('plays?id=eq.' + encodeURIComponent(playId) + '&select=id,title,animations&limit=1')
      .then(function (rows) {
        if (!rows || !rows.length) throw new Error('play introuvable');
        playTitle = rows[0].title || '';
        return Array.isArray(rows[0].animations) ? rows[0].animations : [];
      });
  }

  function writeAnims(list) {
    return sbFetch('plays?id=eq.' + encodeURIComponent(playId),
      { method: 'PATCH', body: { animations: list }, prefer: 'return=minimal' });
  }

  // `dirty` = du travail non publié existe. On ne réécrit le brouillon que
  // s'il a changé : un setInterval qui sérialise 10 temps toutes les 5 s pour
  // rien réveille le CPU de l'iPhone sans raison.
  var dirty = false, lastSaved = '';
  // TOUTE édition passe par touch() : c'est donc LE point unique d'où la
  // cascade repart. Un seul appel plutôt qu'un rappel dispersé dans les douze
  // fonctions d'édition (ajout de flèche, gomme, tir, miroir…) — c'est
  // exactement l'erreur qu'on refait sinon : une porte oubliée, et le play
  // redevient incohérent en silence.
  //
  // Par défaut on repart de cur + 1 : le temps que le coach vient d'éditer
  // est la NOUVELLE référence, ce sont les suivants qui doivent le rejoindre.
  // Les gestes qui déplacent la frontière (supprimer, réordonner un temps)
  // passent l'index de départ explicitement.
  function touch(from) { dirty = true; cascade(from === undefined ? cur + 1 : from); renderTimelineSoon(); }

  var tlRaf = 0;
  function renderTimelineSoon() {
    if (tlRaf) return;
    tlRaf = requestAnimationFrame(function () { tlRaf = 0; renderTimeline(); });
  }

  function draftPayload() {
    return JSON.stringify({ v: 3, at: new Date().toISOString(), play: playId, doc: doc, cur: cur });
  }
  function saveDraft() {
    try {
      var s = draftPayload();
      if (s === lastSaved) return;
      localStorage.setItem(DRAFT_KEY, s);
      lastSaved = s;
    } catch (e) { /* quota plein / mode privé : le brouillon est un confort, pas une garantie */ }
  }
  // Toutes les 5 s, et à chaque fois que l'app passe en arrière-plan (sur
  // iPhone, `pagehide` est le seul signal fiable avant que Safari gèle
  // l'onglet — `beforeunload` n'y est pas garanti).
  setInterval(function () { if (dirty) saveDraft(); }, 5000);
  window.addEventListener('pagehide', saveDraft);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') saveDraft(); });

  var draftBar = document.getElementById('draft-bar');
  function offerDraft() {
    var raw;
    try { raw = localStorage.getItem(DRAFT_KEY); } catch (e) { return; }
    if (!raw) return;
    var o;
    try { o = JSON.parse(raw); } catch (e) { return; }
    if (!o || !o.doc || !o.doc.half) return;
    // Un brouillon appartient à SON play : le proposer sur un autre play
    // ferait recoller le travail au mauvais endroit.
    if ((o.play || null) !== playId) return;
    // Et il n'a plus d'intérêt si on vient d'ouvrir l'animation qu'il décrit
    // dans une version déjà publiée — sauf s'il est plus récent, ce qu'on ne
    // peut pas savoir : on le propose, le coach tranche.
    var when = '';
    try { when = new Date(o.at).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); } catch (e) {}
    document.getElementById('draft-txt').textContent =
      '📝 Brouillon récupéré — ' + (o.doc.title || 'sans titre') + (when ? ' · ' + when : '');
    draftBar.classList.add('show');
    document.getElementById('d-resume').onclick = function () {
      draftBar.classList.remove('show');
      loadDoc(reviveDoc(o.doc));
      cur = Math.min(o.cur || 0, steps().length - 1);
      gotoStep(cur);
      dirty = true;
      toast('Brouillon repris.', 'ok');
    };
    document.getElementById('d-new').onclick = function () {
      draftBar.classList.remove('show');
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
      lastSaved = '';
    };
  }

  // Un brouillon relu est du JSON nu : on le remet dans la forme attendue et
  // on rebouche ce qui manquerait (version antérieure du POC, champ ajouté
  // depuis). Mieux vaut un play amputé d'un champ qu'un écran blanc.
  function reviveDoc(d) {
    var base = makeDoc(), k;
    for (k in base) if (d[k] === undefined) d[k] = base[k];
    ['half', 'full'].forEach(function (m) {
      if (!d[m] || !Array.isArray(d[m].steps) || !d[m].steps.length) d[m] = { steps: [ makeStep(startPos(m)) ] };
      // Récursif depuis le jalon 4 : un temps peut porter des branches, qui
      // sont elles-mêmes des lignes de temps à reboucher exactement pareil.
      (function fix(list, depth) {
        list.forEach(function (s) {
          if (!s.pos) s.pos = startPos(m);
          if (!Array.isArray(s.arw)) s.arw = [];
          if (s.shot === undefined) s.shot = null;
          s.arw.forEach(function (a) { if (!Array.isArray(a.via)) a.via = []; });
          if (!Array.isArray(s.branches) || !s.branches.length || depth >= BR_DEPTH_MAX) { delete s.branches; return; }
          s.branches = s.branches.filter(function (b) {
            return b && b.id && Array.isArray(b.steps) && b.steps.length;
          }).slice(0, BR_PER_STEP);
          if (!s.branches.length) { delete s.branches; return; }
          s.branches.forEach(function (b) {
            if (!b.name) b.name = 'Variante';
            if (b.returns_to_main === undefined) b.returns_to_main = true;
            fix(b.steps, depth + 1);
          });
        });
      })(d[m].steps, 0);
    });
    if (d.mode !== 'full') d.mode = 'half';
    if (d.tokenSize !== 0.75 && d.tokenSize !== 1.25) d.tokenSize = 1;
    if (d.labelStyle !== 'letters') d.labelStyle = 'numbers';
    return d;
  }

  // ── Publier ──────────────────────────────────────────────────────────
  document.getElementById('a-publish').addEventListener('click', function () {
    closeSheets();
    if (!playId) { toast('Bac à sable : ouvre l\'éditeur depuis un play pour publier.', 'err'); return; }
    if (!doc.title.trim()) { metaToForm(); openSheet('sh-meta'); toast('Un titre est obligatoire pour publier.', 'err'); F.title.focus(); return; }
    if (!doc.id) doc.id = (slug(doc.title) || 'anim') + '-' + Math.random().toString(36).slice(2, 7);
    var o = toJSON();
    o.updated_at = new Date().toISOString();
    toast('Publication…');
    fetchAnims()
      .then(function (list) {
        var out = list.slice(), i, found = false;
        for (i = 0; i < out.length; i++) if (out[i] && out[i].id === o.id) { out[i] = o; found = true; break; }
        if (!found) out.push(o);
        return writeAnims(out).then(function () { return out.length; });
      })
      .then(function (n) {
        dirty = false; saveDraft();
        toast('Publiée dans « ' + (playTitle || 'le play') + ' » (' + n + ' animation' + (n > 1 ? 's' : '') + ').', 'ok');
      })
      .catch(function (e) { toast('Échec de la publication — ' + sbMsg(e), 'err'); });
  });

  // ── Supprimer une animation du play ──────────────────────────────────
  document.getElementById('a-delete').addEventListener('click', function () {
    closeSheets();
    if (!playId || !doc.id) { toast('Cette animation n\'a jamais été publiée.', 'err'); return; }
    if (!confirm('Retirer « ' + (doc.title || doc.id) + ' » des animations de ce play ?')) return;
    var gone = doc.id;
    fetchAnims()
      .then(function (list) {
        return writeAnims(list.filter(function (a) { return a && a.id !== gone; }));
      })
      .then(function () { doc.id = null; touch(); toast('Animation retirée du play.', 'ok'); })
      .catch(function (e) { toast('Échec de la suppression — ' + sbMsg(e), 'err'); });
  });

  // ── Liste des animations du play ─────────────────────────────────────
  var plist = document.getElementById('plays-list');
  function loadPlays() {
    if (!playId) {
      plist.innerHTML = '<div class="empty">Bac à sable — cet éditeur n\'est rattaché à aucun play.<br>'
        + 'Ouvre-le depuis la fiche d\'un play pour publier une animation.</div>';

    }
    plist.innerHTML = '<div class="empty">Chargement…</div>';
    fetchAnims()
      .then(function (list) {
        document.getElementById('sh-plays-h').textContent = '🎬 Animations de « ' + (playTitle || '…') + ' »';
        if (!list.length) { plist.innerHTML = '<div class="empty">Aucune animation sur ce play pour l\'instant.</div>'; return; }
        var html = '', i;
        for (i = 0; i < list.length; i++) {
          var r = list[i] || {};
          var nst = Array.isArray(r.steps) ? r.steps.length : 0;
          html += '<div class="pitem" data-id="' + esc(r.id) + '">'
            + '<span class="dot" style="background:' + esc(/^#[0-9a-f]{3,8}$/i.test(r.color || '') ? r.color : '#22D3EE') + '"></span>'
            + '<span class="t"><b>' + esc(r.title || 'Sans titre') + '</b><small>'
            + esc(r.tag || r.side || '') + ' · ' + nst + ' temps · '
            + esc(r.court_type === 'full' ? 'terrain complet' : 'demi-terrain') + '</small></span>'
            + '<span style="font-size:16px;color:var(--ink-2)">›</span></div>';
        }
        plist.innerHTML = html;
      })
      .catch(function (e) { plist.innerHTML = '<div class="empty">Impossible de charger — ' + esc(sbMsg(e)) + '</div>'; });
  }
  plist.addEventListener('click', function (e) {
    var it = e.target && e.target.closest ? e.target.closest('.pitem') : null;
    if (!it) return;
    var id = it.getAttribute('data-id');
    if (dirty && !confirm('Une animation est en cours d\'édition.\nL\'ouvrir va la remplacer. Continuer ?')) return;
    fetchAnims()
      .then(function (list) {
        var found = null, i;
        for (i = 0; i < list.length; i++) if (list[i] && list[i].id === id) found = list[i];
        if (!found) throw new Error('animation introuvable');
        var d = fromJSON(found);
        closeSheets();
        loadDoc(d);
        dirty = false; saveDraft();
        toast('Ouverte : ' + d.title, 'ok');
      })
      .catch(function (err) { toast('Ouverture impossible — ' + sbMsg(err), 'err'); });
  });
  document.getElementById('a-plays').addEventListener('click', function () { openSheet('sh-plays'); loadPlays(); });
  document.getElementById('pl-reload').addEventListener('click', loadPlays);

  document.getElementById('a-newdoc').addEventListener('click', function () {
    closeSheets();
    if (dirty && !confirm('Une animation est en cours d\'édition. La remplacer par une animation vierge ?')) return;
    loadDoc(makeDoc());
    dirty = false;
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    lastSaved = '';
    toast('Nouvelle animation.', 'ok');
  });

  // ─────────────────────────────────────────────────────────────────────
  // 14 bis. BRANCHES — arbre, pistes, création (jalon 4)
  // ─────────────────────────────────────────────────────────────────────
  // Le modèle est déjà en place (cf. section 2) : ici, uniquement la
  // NAVIGATION et les gestes du coach. Règle d'or : tout passe par goPath(),
  // le seul endroit qui change `bpath` côté éditeur — sinon on se retrouve
  // avec un terrain qui affiche une ligne et une timeline qui en édite une
  // autre, exactement le genre d'écart qu'on ne voit qu'après publication.

  function pathKey(p) {
    var s = '', i;
    for (i = 0; i < p.length; i++) s += (i ? '|' : '') + p[i].si + '~' + p[i].bid;
    return s;
  }
  function pathFromKey(k) {
    if (!k) return [];
    return k.split('|').map(function (h) { var a = h.split('~'); return { si: +a[0], bid: a[1] }; });
  }

  function goPath(p) {
    if (document.body.classList.contains('playing') && !vwOn) exitPlay();
    bpath = p;
    cur = 0; pStep = 0; pU = 0; pPrepared = -1;
    active = null; pending = null;
    drawTokens(); drawArrows(); renderTimeline(); syncInfo(); setHint();
  }

  // Création d'une branche : à la FIN du temps courant, jamais au milieu. Son
  // premier temps naît sur la SORTIE de ce temps — l'état figé au point de
  // bifurcation — donc la variante démarre exactement là où la ligne
  // principale en était, sans téléportation.
  function addBranchHere() {
    if (playing || vwOn) return;
    if (bpath.length >= BR_DEPTH_MAX) { toast('Trois niveaux de branches au maximum.', 'err'); return; }
    var st = step(), bs = Array.isArray(st.branches) ? st.branches : [];
    if (bs.length >= BR_PER_STEP) { toast('Cinq branches au maximum sur un temps.', 'err'); return; }
    // Nommage OBLIGATOIRE : une variante « Branche 2 » ne se retrouve pas
    // dans l'arbre trois semaines plus tard, et surtout elle ne dit rien à la
    // joueuse dans le menu du viewer. On refuse plutôt que de replier sur un
    // nom par défaut.
    var name = prompt('Nom de la variante (obligatoire)\nEx. « Écran non servi », « Passe interceptée »');
    if (name === null) return;
    name = String(name).trim();
    if (!name) { toast('Nom obligatoire : une variante sans nom ne se retrouve pas.', 'err'); return; }
    var desc = prompt('Quand la jouer ? (facultatif)\nEx. « Si l\'aide vient »') || '';
    var b = {
      id: uid('b'), name: name.slice(0, 60), description: String(desc).trim().slice(0, 160),
      returns_to_main: true, steps: [ makeStep(endPos(st)) ]
    };
    st.branches = bs.concat([b]);
    dirty = true;
    goPath(bpath.concat([{ si: cur, bid: b.id }]));
    toast('Branche « ' + b.name + ' » créée.', 'ok');
  }

  function delBranchPath(path) {
    if (!path.length) return;
    var hop = path[path.length - 1];
    var parent = stepsAt(path.slice(0, -1));
    var st = parent[hop.si];
    if (!st || !Array.isArray(st.branches)) return;
    var b = branchIn(parent, hop.si, hop.bid);
    if (!b) return;
    if (!confirm('Supprimer la branche « ' + b.name + ' » ?\nSes ' + b.steps.length + ' temps et ses sous-branches sont perdus.')) return;
    st.branches = st.branches.filter(function (x) { return x.id !== hop.bid; });
    if (!st.branches.length) delete st.branches;
    dirty = true;
    // Si on était DEDANS (ou dessous), on remonte au niveau du parent :
    // rester sur un chemin mort afficherait la ligne du dessus en croyant
    // éditer la branche.
    var k = pathKey(path);
    if (pathKey(bpath).slice(0, k.length) === k) goPath(path.slice(0, -1));
    else renderTimeline();
    toast('Branche supprimée.', 'ok');
  }

  // ── Arbre + pistes ───────────────────────────────────────────────────
  var elTree = document.getElementById('tree');
  var elTreeList = document.getElementById('tree-list');
  var elLanes = document.getElementById('tl-lanes');

  function treeRows(list, path, depth, out) {
    var i, j, bs, p;
    for (i = 0; i < list.length; i++) {
      bs = Array.isArray(list[i].branches) ? list[i].branches : [];
      for (j = 0; j < bs.length; j++) {
        p = path.concat([{ si: i, bid: bs[j].id }]);
        out.push({ path: p, depth: depth, name: bs[j].name, from: i, n: bs[j].steps.length, ret: bs[j].returns_to_main !== false });
        treeRows(bs[j].steps, p, depth + 1, out);
      }
    }
    return out;
  }

  function blocksOf(n) {
    var s = '', i;
    for (i = 0; i < Math.min(n, 24); i++) s += '<i></i>';
    return s;
  }

  function renderTree() {
    if (!elTreeList) return;
    var here = pathKey(bpath);
    var rows = treeRows(rootSteps(), [], 0, []);
    var html = '<div class="tnode' + (here === '' ? ' on' : '') + '" data-p="">'
      + '<span class="nm">Principale</span>'
      + '<span class="ct">' + rootSteps().length + ' temps</span></div>';
    rows.forEach(function (r) {
      var k = pathKey(r.path);
      html += '<div class="tnode' + (k === here ? ' on' : '') + '" data-p="' + esc(k) + '"'
        + ' style="margin-left:' + ((r.depth + 1) * 11) + 'px">'
        + '<span class="nm" title="' + esc(r.name) + '">🔀 ' + esc(r.name) + '</span>'
        + '<span class="ct">T' + (r.from + 1) + ' · ' + r.n + '</span>'
        + '<button class="del" data-del="' + esc(k) + '" title="Supprimer cette branche">🗑</button></div>';
    });
    elTreeList.innerHTML = html;

    // PISTES — la ligne courante en piste principale, ses branches empilées
    // dessous, décalées à leur temps de bifurcation (repère visuel, pas une
    // règle graduée : les pastilles n'ont pas toutes la même largeur).
    var l = steps(), i, j, lanes = '<div class="cap">Pistes — ' + (bpath.length ? 'branche courante' : 'ligne principale') + '</div>';
    lanes += '<div class="lane main" data-p="' + esc(here) + '"><span class="lbl">▶ ' + (bpath.length ? esc((branchAt(bpath) || {}).name || '') : 'Principale')
      + '</span><span class="blocks">' + blocksOf(l.length) + '</span></div>';
    for (i = 0; i < l.length; i++) {
      var bs = Array.isArray(l[i].branches) ? l[i].branches : [];
      for (j = 0; j < bs.length; j++) {
        lanes += '<div class="lane" data-p="' + esc(pathKey(bpath.concat([{ si: i, bid: bs[j].id }]))) + '">'
          + '<span class="lbl">⤷ ' + esc(bs[j].name) + '</span>'
          + '<span class="blocks" style="margin-left:' + (i * 15) + 'px">' + blocksOf(bs[j].steps.length) + '</span></div>';
      }
    }
    elLanes.innerHTML = lanes;
  }

  elTree.addEventListener('click', function (e) {
    var t = e.target;
    if (!t || !t.getAttribute) return;
    var del = t.getAttribute('data-del');
    if (del !== null) { e.stopPropagation(); delBranchPath(pathFromKey(del)); return; }
    var node = t.closest ? t.closest('[data-p]') : null;
    if (!node) return;
    goPath(pathFromKey(node.getAttribute('data-p')));
  });
  document.getElementById('s-tree').addEventListener('click', function () { elTree.classList.toggle('show'); renderTree(); });
  document.getElementById('tr-close').addEventListener('click', function () { elTree.classList.remove('show'); });
  document.getElementById('tr-home').addEventListener('click', function () { goPath([]); });
  document.getElementById('s-branch').addEventListener('click', addBranchHere);

  // ─────────────────────────────────────────────────────────────────────
  // 14 ter. VIEWER JOUEUSE (jalon 4)
  // ─────────────────────────────────────────────────────────────────────
  // Le MÊME moteur que l'éditeur, sans aucune de ses portes : la lecture
  // boucle à l'infini et les seuls boutons sont ceux du confort (vitesse,
  // taille, miroir) plus le choix d'une variante. Rien n'écrit dans le
  // document — miroir et taille passent par vwRedraw(), qui ne touche ni au
  // brouillon ni à la publication.
  //
  // L'édition n'est pas seulement « cachée » : VIEWS['2d'].editable passe à
  // false, donc les trois gardes du moteur (drag de jeton, drag de flèche,
  // clic terrain) refusent le geste. Masquer la barre d'outils n'aurait pas
  // suffi : à l'arrêt sur pause, un drag serait redevenu possible.
  var VW_SPEEDS = [3200, 1900, 1050];
  var VW_LABEL  = ['🐢 Lent', '⏱ Normal', '🐇 Rapide'];
  var SIZE_KEYS = ['s', 'm', 'l'];
  var vwOn = false, vwFrom = 'url', vwSpeedIx = 1, vwBar = null, vwBadge = -1;
  // Compteur de lectures de la ligne principale. 0 = premiere lecture, on ne
  // coupe JAMAIS (la joueuse decouvre le play en entier, comme une video) ;
  // des la deuxieme, chaque temps qui bifurque attend son choix.
  var vwLoop = 0, vwToldLoop = false, vwHalt = false;
  // Un reglage que la joueuse a touche elle-meme n est plus jamais ecrase par
  // les defauts de la 2e lecture.
  var vwUserSpeed = false, vwUserSize = false;

  function vwCrumb() {
    var names = ['Principale'], l = rootSteps(), i, b;
    for (i = 0; i < bpath.length; i++) {
      b = branchIn(l, bpath[i].si, bpath[i].bid);
      if (!b) break;
      names.push(b.name); l = b.steps;
    }
    document.getElementById('vw-crumb').textContent = names.join(' → ');
  }

  function vwStepChanged(force, ask) {
    var st = steps()[pStep];
    var n = (st && Array.isArray(st.branches)) ? st.branches.length : 0;
    if (force || n !== vwBadge) {
      vwBadge = n;
      var b = document.getElementById('vw-br');
      // Le bouton reste offert tant que la LIGNE bifurque quelque part : il
      // amene alors au prochain temps a variantes. Sur un play sans branche
      // il n'a rien a proposer, donc il disparait.
      b.style.display = vwHasBranches() ? '' : 'none';
      b.textContent = n ? ('🔀 ' + n + (n > 1 ? ' variantes' : ' variante')) : '🔀';
    }
    // Par defaut on ne questionne que sur un changement de temps NATUREL ;
    // les changements de chemin passent leur tour, sauf quand l appelant le
    // demande explicitement (reboucle : le temps 1 peut bifurquer, et sans ca
    // sa variante n etait JAMAIS proposee — il n y a pas de `pStep++` qui y
    // mene).
    if (ask === undefined) ask = !force;
    if (ask && n && vwLoop >= 1 && playing) vwOpenMenu(pStep);
  }

  function vwHasBranches() {
    var l = steps(), i;
    for (i = 0; i < l.length; i++) if (Array.isArray(l[i].branches) && l[i].branches.length) return true;
    return false;
  }

  function vwGoPath(p, now, ask) {
    bpath = p;
    cur = 0; pStep = 0; pU = 0; pPrepared = -1;
    vwCrumb();
    renderFrame(0, 0);
    vwStepChanged(true, ask);
    pT0 = now || performance.now();
  }

  function vwLoopEnd(now) {
    var b = branchAt(bpath);
    if (b && b.returns_to_main !== false) {
      vwGoPath([], now);
      toast('↩ Retour à la ligne principale.');
    } else {
      if (!bpath.length) {
        vwLoop++;
        if (vwLoop === 1) vwSecondRead();
        vwGoPath(bpath, now, true);
        return;
      }
      vwGoPath(bpath, now);
    }
  }

  // Passage a la 2e lecture : on ralentit et on rapetisse les pions UNE seule
  // fois. A partir de la, la lecture sert a comprendre les variantes, pas a
  // faire joli — et des pions plus petits laissent voir tout le terrain
  // pendant qu on choisit. Un reglage deja touche a la main est respecte.
  function vwSecondRead() {
    var chg = [];
    if (!vwUserSpeed && vwSpeedIx !== 0) { vwSpeedIx = 0; chg.push('lecture lente'); }
    if (!vwUserSize && sizeKeyOf() !== 's') { setTokenSize('s'); chg.push('pions S'); }
    vwSyncButtons();
    if (vwToldLoop) return;
    vwToldLoop = true;
    if (vwHasBranches()) toast('🔀 Choisis tes variantes maintenant.');
    else if (chg.length) toast('↻ 2e lecture — ' + chg.join(', ') + '.');
  }

  // Redessin complet SANS quitter la lecture (miroir, taille des pions).
  function vwRedraw() {
    drawAll();
    pPrepared = -1;
    renderFrame(pStep, pU);
    if (playing) pT0 = performance.now() - pU * stepMs();
  }

  function vwSyncButtons() {
    document.getElementById('vw-speed').textContent = VW_LABEL[vwSpeedIx];
    document.getElementById('vw-size').textContent = '⤢ ' + SIZE_KEYS[SIZE_KEYS.indexOf(sizeKeyOf())].toUpperCase();
    document.getElementById('vw-play').textContent = playing ? '⏸' : '▶';
  }
  function sizeKeyOf() {
    var v = doc.tokenSize || 1, k;
    for (k in SIZES) if (SIZES[k] === v) return k;
    return 'm';
  }

  function enterViewer(from) {
    if (vwOn) return;
    vwOn = true;
    vwFrom = from || 'url';
    closeSheets();
    elTree.classList.remove('show');
    document.getElementById('draft-bar').classList.remove('show');
    document.body.classList.add('viewer');
    VIEWS['2d'].editable = false;
    // La barre de lecture de l'éditeur n'a pas de classe à elle : on la range
    // par son conteneur plutôt que d'inventer un sélecteur fragile.
    vwBar = elPlay.parentNode;
    if (vwBar) vwBar.style.display = 'none';
    bpath = []; cur = 0; pStep = 0; pU = 0;
    vwLoop = 0; vwToldLoop = false; vwHalt = false; vwBadge = -1;
    vwUserSpeed = false; vwUserSize = false;
    vwCrumb();
    drawAll();
    play();
    vwStepChanged(true);
    vwSyncButtons();
  }

  function exitViewer() {
    if (!vwOn) return;
    vwOn = false;
    document.body.classList.remove('viewer');
    VIEWS['2d'].editable = true;
    if (vwBar) vwBar.style.display = '';
    document.getElementById('vw-menu').classList.remove('show');
    if (playing) pause();
    exitPlay();
    goPath([]);
  }

  document.getElementById('vw-play').addEventListener('click', function () { play(); vwSyncButtons(); });
  document.getElementById('vw-speed').addEventListener('click', function () {
    vwUserSpeed = true;
    vwSpeedIx = (vwSpeedIx + 1) % VW_SPEEDS.length;
    // Recaler l'origine du temps sur la position COURANTE : sans ça, changer
    // de vitesse en pleine lecture fait sauter l'animation en arrière.
    pT0 = performance.now() - pU * stepMs();
    vwSyncButtons();
  });
  document.getElementById('vw-size').addEventListener('click', function () {
    vwUserSize = true;
    setTokenSize(SIZE_KEYS[(SIZE_KEYS.indexOf(sizeKeyOf()) + 1) % 3]);
    vwSyncButtons();
  });
  document.getElementById('vw-mirror').addEventListener('click', mirrorMode);
  document.getElementById('vw-close').addEventListener('click', function () {
    if (vwFrom === 'editor') { exitViewer(); return; }
    if (history.length > 1) history.back(); else location.href = '/';
  });

  // ── Menu des variantes ───────────────────────────────────────────────
  var vwMenu = document.getElementById('vw-menu');
  // Bouton manuel : le temps courant s'il bifurque, sinon le PROCHAIN qui
  // bifurque (en repartant du debut si on est deja passe apres le dernier).
  // Disponible a tout moment, y compris pendant la premiere lecture.
  document.getElementById('vw-br').addEventListener('click', function () {
    var l = steps(), n = l.length, i, k, ix = -1;
    for (i = 0; i < n; i++) {
      k = (pStep + i) % n;
      if (Array.isArray(l[k].branches) && l[k].branches.length) { ix = k; break; }
    }
    if (ix >= 0) vwOpenMenu(ix);
  });

  // Pause + menu sur le temps `ix`. Meme mecanisme que le bouton ⏸ : aucun
  // cout supplementaire, la boucle rAF s'arrete vraiment.
  function vwOpenMenu(ix) {
    var st = steps()[ix];
    if (!st || !Array.isArray(st.branches) || !st.branches.length) return;
    if (ix !== pStep) { pStep = ix; pU = 0; pPrepared = -1; renderFrame(pStep, 0); vwStepChanged(true); }
    if (playing) { pause(); vwSyncButtons(); }
    vwHalt = true;
    var html = '<div style="font-size:12px;font-weight:700;margin-bottom:8px">Temps ' + (ix + 1) + ' — quelle suite ?</div>'
      + '<div class="row"><button class="btn wide" data-b="">▶ Ligne principale</button></div>';
    st.branches.forEach(function (b) {
      html += '<div class="row"><button class="btn wide" data-b="' + esc(b.id) + '">🔀 ' + esc(b.name)
        + (b.description ? '<br><small style="opacity:.65;font-weight:400">' + esc(b.description) + '</small>' : '')
        + '</button></div>';
    });
    document.getElementById('vw-menu-card').innerHTML = html;
    vwMenu.classList.add('show');
  }
  vwMenu.addEventListener('click', function (e) {
    var btn = e.target && e.target.closest ? e.target.closest('[data-b]') : null;
    if (!btn) { if (e.target === vwMenu) vwMenu.classList.remove('show'); return; }
    var id = btn.getAttribute('data-b');
    vwMenu.classList.remove('show');
    if (id) vwGoPath(bpath.concat([{ si: pStep, bid: id }]));
    if (!playing) { play(); }
    vwSyncButtons();
  });

  // Aperçu joueuse depuis l'éditeur — ajouté au menu ⋯ en JS pour garder le
  // balisage du jalon 3 intact.
  (function () {
    var anchor = document.getElementById('a-publish').parentNode;
    var row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<button class="btn wide" id="a-viewer">👁 Aperçu joueuse</button>';
    anchor.parentNode.insertBefore(row, anchor.nextSibling);
    document.getElementById('a-viewer').addEventListener('click', function () { closeSheets(); enterViewer('editor'); });
  })();

  // ─────────────────────────────────────────────────────────────────────
  // 15. DÉMARRAGE
  // ─────────────────────────────────────────────────────────────────────
  function setContext(txt) { document.getElementById('doc-ctx').textContent = txt; }

  applyTeamColors();   // AVANT le premier drawAll : les jetons naissent déjà à la bonne couleur
  syncTitle();
  metaToForm();
  syncSizeButtons();
  syncLabelButton();
  drawAll();
  renderTimeline();
  setHint();

  if (!playId) {
    setContext('bac à sable');
    offerDraft();
  } else {
    setContext('chargement du play…');
    // mode=view : on masque l'éditeur AVANT le fetch. Sinon la joueuse voit la
    // barre d'outils clignoter le temps du chargement — et surtout elle peut
    // la toucher.
    if (wantView) document.body.classList.add('viewer');
    fetchAnims()
      .then(function (list) {
        setContext(playTitle ? '↳ ' + playTitle : '↳ play');
        if (!wantAnim) { offerDraft(); return; }
        var found = null, i;
        for (i = 0; i < list.length; i++) if (list[i] && list[i].id === wantAnim) found = list[i];
        if (!found) { toast('Animation introuvable — on repart d\'une page blanche.', 'err'); offerDraft(); return; }
        loadDoc(fromJSON(found));
        dirty = false;
        // mode=view : viewer joueuse plein écran, en boucle (jalon 4).
        if (wantView) setTimeout(function () { document.body.classList.remove('viewer'); enterViewer('url'); }, 120);
      })
      .catch(function (e) {
        setContext('play injoignable');
        toast('Play injoignable — ' + sbMsg(e), 'err');
        offerDraft();
      });
  }
})();
</script>
</body>
</html>
