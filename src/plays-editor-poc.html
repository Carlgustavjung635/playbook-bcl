<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Éditeur d'animations — plays BCL</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  ÉDITEUR D'ANIMATIONS — un média du play, au même titre qu'une vidéo
  ══════════════════════════════════════════════════════════════════════════
  Le fichier ne partage toujours AUCUN code ni état avec index.html : il est
  invoqué en pleine page depuis la fiche d'un play, avec le play (et
  éventuellement l'animation) en paramètres d'URL —

      /src/plays-editor-poc.html?play=<idPlay>[&anim=<idAnim>][&mode=view]

  — et il écrit son résultat dans `plays.animations` (migration
  20260823_002). Sans `?play=`, il s'ouvre en BAC À SABLE : tout fonctionne
  sauf la publication.

  Ce que ce jalon apporte, par rapport au drag-and-drop du jalon 2 :

    · les TEMPS (steps) — un play n'est plus une photo mais une suite de
      photos, chacune avec ses flèches ;
    · la LECTURE animée de ces temps (rAF, jamais setInterval) ;
    · la PERSISTANCE — brouillon local toutes les 5 s + publication dans les
      animations du play ;
    · l'IMPORT / EXPORT JSON d'UNE animation, format d'échange atk-zone ;
    · l'EXPORT PHOTO — un PNG du temps affiché, ou la série complète en ZIP.

  ── CE QUE LA v.174 AJOUTE ────────────────────────────────────────────────
    · la POINTE des flèches est un `marker-end`, plus un triangle peint à part
      — c'est ce qui supprime le « pli » visible avant la tête sur les courbes
      (le trait s'arrête désormais pile à la base de la pointe) ;
    · l'ÉCRAN — une flèche de déplacement ENTIÈRE (trait plein + pointe) suivie
      de la barre perpendiculaire qui matérialise le mur à l'arrivée. C'est un
      déplacement comme un autre pour le modèle (isMoveKind) ;
    · la TAILLE des jetons — S 0,75× · M 1× · L 1,25×, publiée dans le JSON
      (`players_size`). Tout l'habillage étant exprimé en fraction de PR,
      chiffres, ballons et pointes suivent sans cas particulier ;
    · le MIROIR ⇋, qui bascule le play sur l'autre demi-terrain (ou l'autre
      panier) en retournant les coordonnées pour de bon ;
    · les COULEURS D'ÉQUIPE, lues sur le thème (`--pb-primary` /
      `--pb-secondary`, complémentaire HSL à défaut) plutôt qu'en dur ;
    · le LOGO du club peint sur le parquet, embarqué en data: URI pour
      survivre à l'export photo.

  ── CE QUE LA v.175 AJOUTE ────────────────────────────────────────────────
    · l'ÉTIQUETTE des pastilles — chiffres 1…5 ou lettres A…E pour l'attaque,
      la défense restant X1…X5 (`player_label_style`). C'est de l'AFFICHAGE
      pur : le modèle désigne toujours les joueuses par leur id, et le format
      d'échange par son numéro signé. Une seule fonction, labelOf(), sert le
      jeton, l'encart d'info et le fil d'aide.

  ── UN TEMPS = UNE PHOTO + CE QUI SE PASSE PENDANT ────────────────────────
  Chaque temps porte ses positions (`pos`), mais elles ne sont PAS un îlot :
  depuis la v.179 elles DÉCOULENT du temps précédent. C'est l'hérédité qui
  compte — un play est une suite continue, pas une pile de photos.

    · éditer le temps N (déplacer une joueuse, rallonger une flèche) recalcule
      l'entrée de N+1, N+2 … jusqu'au dernier temps : plus personne ne se
      téléporte entre la fin d'un temps et le début du suivant ;
    · le temps que le coach est en train d'éditer, LUI, n'est jamais recalculé
      sous ses doigts : la cascade part toujours de N+1 (cf. touch()). Sans ce
      décalage d'un cran, poser une joueuse serait immédiatement annulé par la
      cascade et le terrain deviendrait inéditable ;
    · la contrepartie est assumée : retoucher un temps AMONT écrase ce qui avait
      été rangé à la main en aval. On édite donc dans l'ordre chronologique.

  Le stockage reste une photo par temps (et non un calcul à la volée) pour la
  raison du jalon 2 : pendant un drag on n'écrit que des attributs, on ne
  reconstruit pas la scène. La cascade coûte 0,03 ms pour 20 temps × 10 jetons,
  elle tourne donc à chaque édition sans cache à invalider.

  ── UNITÉS ────────────────────────────────────────────────────────────────
  1 unité SVG = 10 cm. Toutes les cotes viennent des dimensions officielles
  FIBA : terrain 28,00 × 15,00 m · raquette 4,90 m de large · ligne des
  lancers francs à 5,80 m de la ligne de fond · cercle des LF r = 1,80 m ·
  arc à 3 pts r = 6,75 m depuis l'axe du cercle · corners droits à 0,90 m des
  lignes de touche · cercle (panier) à 1,575 m du fond, r = 0,225 m · planche
  à 1,20 m du fond, largeur 1,80 m · zone de non-charge r = 1,25 m.

  MARGE — 12 unités (1,20 m) tout autour de l'aire de jeu : c'est l'espace
  hors terrain où se place la joueuse qui fait la remise en touche.

  ── MODÈLE vs VUE ─────────────────────────────────────────────────────────
  Le modèle ne connaît QUE des coordonnées terrain ; une vue n'est qu'une
  projection (project/unproject) plus un dessin de terrain. La 2D top-down est
  l'identité, la 3D (lecture seule, jalon 4+) se branchera dans le même
  registre sans toucher au moteur d'édition. L'ÉDITION reste 2D : viser un
  jeton en perspective avec un doigt est frustrant sur iPhone.

  UN MODÈLE PAR MODE (demi / plein) — les deux terrains n'ont pas le même
  repère : chaque mode garde SON jeu de temps. Basculer ne détruit jamais le
  travail en cours. C'est le mode ACTIF qui est publié / exporté.

  ── PERF iPhone ───────────────────────────────────────────────────────────
  Le drag ne reconstruit RIEN : il écrit un transform sur le <g> du jeton et
  réécrit le d= des seules flèches qui touchent ce jeton, une fois par frame
  (rAF). La LECTURE suit la même règle : elle prépare ses éléments une fois en
  entrant dans un temps, puis ne fait qu'écrire des attributs par frame. Aucun
  setInterval nulle part — un timer qui dérive ferait glisser l'animation dès
  que Safari met l'onglet en veille.

  ── SÉCURITÉ ──────────────────────────────────────────────────────────────
  La clé Supabase ci-dessous est la clé PUBLISHABLE, déjà publique dans
  index.html : elle est faite pour vivre dans du JS servi au navigateur. Aucun
  secret de service n'est présent dans ce fichier.
-->
<style>
  /* ── Thème : suit le système, surchargeable par le bouton 🌓 ─────────
     Accent primaire cyan #22D3EE (attaque, cohérent avec le format JSON des
     plays), accent secondaire violet #7B2FFF (défense + contrôles actifs). */
  :root{
    --bg:#F1F3F7; --panel:#FFFFFF; --ink:#0F131A; --ink-2:#5A6472;
    --border:#DCE1E9; --btn:#FFFFFF; --field:#F6F8FB;
    --accent-2:#7B2FFF; --accent-2-ink:#FFFFFF;
    --out-hi:#EDF0F5; --out-lo:#E1E6EE;    /* zone hors-jeu (remises en touche) */
    --court-hi:#F6EAD4; --court-lo:#E8D6B6; /* parquet, dégradé vertical */
    --line:#A98F66; --line-strong:#8A7048;  /* lignes du terrain */
    --hoop:#E4572E;
    --player:#22D3EE; --player-hi:#7BE7F7; --player-ink:#04252E;
    --def:#7B2FFF; --def-hi:#A87CFF; --def-ink:#FFFFFF; --def-line:#3D1180;
    --arw-atk:#0E9BB8; --arw-def:#7B2FFF; --arw-shot:#E4572E;
    --ball:#F97316; --ball-line:#7C2D12;
    --warn:#D97706; --ok:#0E9F6E; --err:#DC2626;
    --sheen:#FFFFFF; --scrim:rgba(9,12,18,.42);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#080B10; --panel:#121821; --ink:#E9EFF7; --ink-2:#8592A4;
      --border:#212936; --btn:#19212C; --field:#0D131B;
      --accent-2:#9B5CFF; --accent-2-ink:#0B0616;
      --out-hi:#141B25; --out-lo:#0D1219;
      --court-hi:#222B37; --court-lo:#161D26;
      --line:#55647A; --line-strong:#70819A;
      --hoop:#F2703F;
      --player:#22D3EE; --player-hi:#8FEEFB; --player-ink:#04252E;
      --def:#8B4CFF; --def-hi:#B78EFF; --def-ink:#FFFFFF; --def-line:#2B0A5E;
      --arw-atk:#38D9F0; --arw-def:#A87CFF; --arw-shot:#F2703F;
      --ball:#FB923C; --ball-line:#431407;
      --warn:#F59E0B; --ok:#34D399; --err:#F87171;
      --sheen:#FFFFFF; --scrim:rgba(0,0,0,.6);
    }
  }
  html[data-theme="light"]{
    --bg:#F1F3F7; --panel:#FFFFFF; --ink:#0F131A; --ink-2:#5A6472;
    --border:#DCE1E9; --btn:#FFFFFF; --field:#F6F8FB;
    --accent-2:#7B2FFF; --accent-2-ink:#FFFFFF;
    --out-hi:#EDF0F5; --out-lo:#E1E6EE; --court-hi:#F6EAD4; --court-lo:#E8D6B6;
    --line:#A98F66; --line-strong:#8A7048; --hoop:#E4572E; --player-hi:#7BE7F7;
    --def:#7B2FFF; --def-hi:#A87CFF; --def-ink:#FFFFFF; --def-line:#3D1180;
    --arw-atk:#0E9BB8; --arw-def:#7B2FFF; --arw-shot:#E4572E;
    --ball:#F97316; --ball-line:#7C2D12;
    --warn:#D97706; --ok:#0E9F6E; --err:#DC2626; --scrim:rgba(9,12,18,.42);
  }
  html[data-theme="dark"]{
    --bg:#080B10; --panel:#121821; --ink:#E9EFF7; --ink-2:#8592A4;
    --border:#212936; --btn:#19212C; --field:#0D131B;
    --accent-2:#9B5CFF; --accent-2-ink:#0B0616;
    --out-hi:#141B25; --out-lo:#0D1219; --court-hi:#222B37; --court-lo:#161D26;
    --line:#55647A; --line-strong:#70819A; --hoop:#F2703F; --player-hi:#8FEEFB;
    --def:#8B4CFF; --def-hi:#B78EFF; --def-ink:#FFFFFF; --def-line:#2B0A5E;
    --arw-atk:#38D9F0; --arw-def:#A87CFF; --arw-shot:#F2703F;
    --ball:#FB923C; --ball-line:#431407;
    --warn:#F59E0B; --ok:#34D399; --err:#F87171; --scrim:rgba(0,0,0,.6);
  }

  /* ── COULEURS D'ÉQUIPE — tokens de thème (v.174) ──────────────────────
     `--pb-primary` (attaque) et `--pb-secondary` (défense) sont désormais LA
     source des couleurs de jetons et de flèches. Elles portent ici les valeurs
     historiques — cyan / violet — pour que rien ne bouge par défaut, mais
     applyTeamColors() les RELIT au démarrage et à chaque bascule de thème :
     si la page hôte, un thème custom ou ?accent=/?accent2= en fournissent
     d'autres, ce sont celles-là qui pilotent tout. Secondaire absente ⇒ elle
     est dérivée de la primaire par rotation de +180° en HSL. Aucune des deux
     lisible ⇒ on garde ces valeurs de repli, telles quelles. */
  :root{--pb-primary:#22D3EE; --pb-secondary:#7B2FFF}
  @media (prefers-color-scheme: dark){:root{--pb-primary:#22D3EE; --pb-secondary:#8B4CFF}}
  html[data-theme="light"]{--pb-primary:#22D3EE; --pb-secondary:#7B2FFF}
  html[data-theme="dark"]{--pb-primary:#22D3EE; --pb-secondary:#8B4CFF}

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex; flex-direction:column; height:100dvh;
    /* Rien ne doit scroller : le drag ne doit jamais entrer en concurrence
       avec le scroll/bounce iOS. */
    overflow:hidden; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header{
    display:flex; align-items:center; gap:8px; padding:8px 10px;
    background:var(--panel); border-bottom:1px solid var(--border); flex:none;
  }
  header .title{font-size:13px; font-weight:700; letter-spacing:.02em; flex:1; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  header .sub{font-size:10px; color:var(--ink-2); font-weight:500}
  .btn{
    appearance:none; border:1px solid var(--border); background:var(--btn);
    color:var(--ink); border-radius:10px; padding:0 12px; min-height:38px;
    font-size:13px; font-weight:600; cursor:pointer; touch-action:manipulation;
    transition:background .12s ease, border-color .12s ease, color .12s ease;
    white-space:nowrap;
  }
  .btn.on{
    background:var(--accent-2); color:var(--accent-2-ink);
    border-color:var(--accent-2); box-shadow:0 2px 10px -3px var(--accent-2);
  }
  .btn:disabled{opacity:.35; cursor:default; box-shadow:none}
  .btn.sm{min-height:34px; padding:0 9px; font-size:12px}
  .btn.xs{min-height:30px; padding:0 8px; font-size:11px; border-radius:8px}
  .btn.wide{width:100%; justify-content:center; text-align:left; padding:0 14px}
  .btn.danger{color:var(--err)}
  .bar{
    display:flex; align-items:center; gap:6px; padding:6px 8px; flex:none;
    flex-wrap:wrap; border-bottom:1px solid var(--border); background:var(--panel);
  }
  .seg{display:flex; gap:4px}
  .sep{width:1px; align-self:stretch; background:var(--border); margin:2px 1px}
  /* Encart d'info : compteurs du schéma + FPS mesuré pendant le drag/lecture. */
  .badge{
    margin-left:auto; display:flex; gap:8px; align-items:center;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px;
    color:var(--ink-2); white-space:nowrap;
  }
  .badge b{color:var(--ink); font-weight:700}
  .stage{flex:1; min-height:0; padding:5px 8px; display:flex}
  svg#court{
    width:100%; height:100%; display:block;
    /* CLÉ iPhone : coupe scroll, pinch et double-tap-zoom sur toute la
       surface du terrain, sinon Safari « vole » le geste au 1er mouvement. */
    touch-action:none;
  }

  /* ── Dégradés (les attributs SVG n'acceptent pas var(), on passe par CSS) */
  #gOut .a{stop-color:var(--out-hi)}     #gOut .b{stop-color:var(--out-lo)}
  #gFloor .a{stop-color:var(--court-hi)} #gFloor .b{stop-color:var(--court-lo)}
  #gDisc .a{stop-color:var(--player-hi)} #gDisc .b{stop-color:var(--player)}
  #gDef .a{stop-color:var(--def-hi)}     #gDef .b{stop-color:var(--def)}
  #gBall .a{stop-color:var(--ball)}      #gBall .b{stop-color:var(--ball-line)}
  #gSheen .a{stop-color:var(--sheen); stop-opacity:.13}
  #gSheen .b{stop-color:var(--sheen); stop-opacity:0}
  #gShadow .a{stop-color:#000; stop-opacity:.34}
  #gShadow .b{stop-color:#000; stop-opacity:.14}
  #gShadow .c{stop-color:#000; stop-opacity:0}

  .out{fill:url(#gOut)}
  .court{fill:url(#gFloor)}
  .sheen{fill:url(#gSheen); pointer-events:none}
  /* Lignes fines : le trait « premium » vient de la finesse + du dégradé
     de fond, pas d'un contour épais. */
  .ln{fill:none; stroke:var(--line); stroke-width:.62; stroke-linecap:round}
  .ln.strong{stroke:var(--line-strong); stroke-width:.95}
  .hp{fill:none; stroke:var(--hoop); stroke-width:1.15; stroke-linecap:round}

  /* ── Flèches ───────────────────────────────────────────────────────── */
  /* v.174 — LA POINTE EST UN marker-end, PLUS UN TRIANGLE DESSINÉ À PART.
     Avant, le tracé allait jusqu'à la pointe ET un triangle était peint
     par-dessus, orienté sur la tangente FINALE. Sur une courbe un peu serrée,
     le trait s'écartait latéralement de cet axe sur la longueur de la tête et
     ressortait par le flanc du triangle : le « pli » / blob visible juste
     avant la pointe. Désormais le tracé s'arrête EXACTEMENT à la base de la
     tête (updateArrow rogne de hl en plus) et le marker prend le relais dans
     l'axe de la tangente : plus rien ne dépasse, à n'importe quelle courbure. */
  .arw .body{fill:none; stroke-linecap:round; stroke-linejoin:round; pointer-events:none}
  /* Zone de saisie invisible et large : sur iPhone, un trait de 1,4 unité
     est intouchable au doigt. pointer-events:stroke ne capte QUE le tracé. */
  .arw .hit{fill:none; stroke:transparent; stroke-width:9; pointer-events:stroke; cursor:pointer}
  .arw.atk .body{stroke:var(--arw-atk); marker-end:url(#mkAtk)}
  .arw.def .body{stroke:var(--arw-def); marker-end:url(#mkDef)}
  .arw.shot .body{stroke:var(--arw-shot); marker-end:url(#mkShot)}
  /* Écran (screen) : une flèche de déplacement ENTIÈRE — même trait plein,
     même pointe — suivie de la barre perpendiculaire qui matérialise le mur.
     Seul le marker change, et il porte les deux formes d'un coup. Trois
     classes, donc plus spécifique que `.arw.atk .body` : c'est lui qui gagne. */
  .arw.atk.screen .body{marker-end:url(#mkScrAtk)}
  .arw.def.screen .body{marker-end:url(#mkScrDef)}
  #mkAtk .h, #mkScrAtk .h{fill:var(--arw-atk)}
  #mkDef .h, #mkScrDef .h{fill:var(--arw-def)}
  #mkShot .h{fill:var(--arw-shot)}
  .arw .body{stroke-width:1.45}
  /* Passe = trait pointillé (convention basket). Le tiret est exprimé en
     unités terrain, donc il garde la même densité dans les deux modes. */
  .arw.pass .body{stroke-width:1.25; stroke-dasharray:3.4 2.8}
  .arw.shot .body{stroke-width:1.35; stroke-dasharray:5.5 3}
  .arw .wp{fill:var(--panel); stroke:var(--ink-2); stroke-width:.5; pointer-events:none}
  /* Zone de saisie du waypoint : le disque dessiné est petit, la cible ne
     doit pas l'être (même raison que .hit sur le tracé). */
  .arw .wphit{fill:transparent; pointer-events:all; cursor:grab}
  /* Poignée d'extrémité (jalon 3.6) : même disque que le waypoint, mais elle
     ne vit qu'en mode Sélection — c'est le seul mode où l'on retouche une
     flèche déjà posée. touch-action:none, sinon iOS lit le geste en scroll. */
  .arw .tip{fill:var(--panel); stroke:var(--ink-2); stroke-width:.6; pointer-events:none}
  .arw .tiphit{fill:transparent; pointer-events:all; cursor:grab; touch-action:none}
  body:not([data-tool="select"]) .arw .tip,
  body:not([data-tool="select"]) .arw .tiphit{display:none}
  /* En mode gomme, on annonce la cible au survol/au doigt. */
  body[data-tool="erase"] .arw .body{opacity:.9}
  body[data-tool="erase"] .arw:hover .body{stroke:var(--hoop)}
  body[data-tool="erase"] .arw:hover .head{fill:var(--hoop)}
  body[data-tool="erase"] .arw .wp{stroke:var(--hoop); stroke-width:.9}
  /* Les waypoints ne sont manipulables qu'en sélection et en gomme (poser,
     déplacer, retirer) — pendant un tracé de flèche ils ne feraient que gêner. */
  body[data-tool="move"] .arw .wp, body[data-tool="pass"] .arw .wp,
  body[data-tool="shot"] .arw .wp, body[data-tool="screen"] .arw .wp{display:none}
  body[data-tool="move"] .arw .wphit, body[data-tool="pass"] .arw .wphit,
  body[data-tool="shot"] .arw .wphit, body[data-tool="screen"] .arw .wphit{display:none}

  /* Logo peint sur le parquet : sous les jetons ET sous les flèches, comme sur
     un vrai terrain. pointer-events:none, sinon il volerait les taps du fond. */
  .logo{pointer-events:none}

  .token{cursor:grab}
  /* Ombre PEINTE (ellipse en dégradé radial) plutôt qu'un filter CSS : un
     drop-shadow se recalcule à chaque frame et coûte cher sur iPhone, alors
     que cette ellipse suit le jeton gratuitement dans le même transform. */
  .token .sh{fill:url(#gShadow); pointer-events:none}
  /* Fantome d'origine (jalon 3.7) : UN noeud SVG statique pose au pointerdown
     et retire au pointerup — aucun re-render pendant le drag. */
  .gh{fill:none; stroke:var(--player); stroke-width:.7; stroke-dasharray:1.6 1.2;
      opacity:.25; pointer-events:none}
  .gh.def{stroke:var(--def)}
  .gh.near{opacity:.6; stroke-width:1.2; stroke-dasharray:none}
  #gh-hint{position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 84px);
    transform:translateX(-50%); z-index:60; padding:8px 13px; border-radius:999px;
    background:var(--panel); color:var(--ink,#e9eef5); border:1px solid var(--line);
    font-size:12px; box-shadow:0 6px 18px rgba(0,0,0,.28); opacity:0;
    transition:opacity .25s; pointer-events:none}
  #gh-hint.on{opacity:.94}
  .token .disc{fill:url(#gDisc); stroke:var(--player-ink); stroke-width:.55}
  .token.def .disc{fill:url(#gDef); stroke:var(--def-line); stroke-width:.55}
  .token .halo{
    fill:none; stroke:var(--accent-2); stroke-width:1.6; opacity:0;
    pointer-events:none;
  }
  /* Les défenseurs SONT violets : leur halo doit contraster, donc cyan. */
  .token.def .halo{stroke:var(--player)}
  .token .num{
    fill:var(--player-ink); font-weight:800; text-anchor:middle;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif; pointer-events:none;
  }
  .token.def .num{fill:var(--def-ink)}
  .token .ball{display:none; pointer-events:none}
  .token.has-ball .ball{display:block}
  .token .ball .b{fill:url(#gBall); stroke:var(--ball-line); stroke-width:.4}
  .token .ball .s{fill:none; stroke:var(--ball-line); stroke-width:.35; stroke-linecap:round}
  /* Dribble : le ballon rebondit tant que sa porteuse se DÉPLACE. Un simple
     translateY (compositor, pas de filter ni de layout) — l'amplitude vient
     de --dribble-y, recalculée avec PR pour rester juste à toutes tailles.
     La couture reste solidaire : c'est le <g class="ball"> entier qui bouge. */
  @keyframes pbDribble{
    0%,100%{transform:translateY(calc(var(--dribble-y, 1px) * -0.35))}
    50%     {transform:translateY(var(--dribble-y, 1px))}
  }

  .token.active .halo{opacity:.9}

  .token.drag{cursor:grabbing}

  .token.drag .disc{stroke-width:.9}

  .token.pending .halo{opacity:.95; animation:pulse .9s ease-in-out infinite}

  .toast{

<!-- THÈME HÔTE (v.186) — en mode viewer (?mode=view), l'app passe les tokens
     résolus de son thème perso : fond, panneau, texte, bordure, accent. On les
     pose en variables inline pour que TOUT le viewer (voile, crumb, boutons,
     badges) suive le thème de l'utilisatrice, en clair comme en sombre. Hors
     mode viewer, l'éditeur garde son propre thème et son propre sélecteur. -->
<script>
(function () {
  'use strict';
  try {
    var q = new URLSearchParams(location.search);
    if (q.get('mode') !== 'view') return;
    var r = document.documentElement;
    var sch = q.get('scheme');
    if (sch === 'light' || sch === 'dark') r.setAttribute('data-theme', sch);
    var MAP = { bg: '--bg', panel: '--panel', ink: '--ink', ink2: '--ink-2',
      border: '--border', btn: '--btn', field: '--field' };
    Object.keys(MAP).forEach(function (k) { var v = q.get(k); if (v) r.style.setProperty(MAP[k], v); });
    var a = q.get('accent');
    if (/^#[0-9a-f]{3,8}$/i.test(a || '')) {
      // Accent = couleur d'attaque ET couleur des contrôles actifs. La
      // secondaire reste DÉRIVÉE (complémentaire HSL, cf. applyTeamColors) :
      // la passer aussi donnerait deux équipes de la même teinte.
      r.style.setProperty('--pb-primary', a);
      r.style.setProperty('--accent-2', a);
      var h = a.slice(1);
      if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
      var L = (0.2126 * parseInt(h.slice(0, 2), 16) + 0.7152 * parseInt(h.slice(2, 4), 16) + 0.0722 * parseInt(h.slice(4, 6), 16)) / 255;
      r.style.setProperty('--accent-2-ink', L > 0.55 ? '#0B0616' : '#FFFFFF');
    }
  } catch (_) {}
})();
</script>

  <div class="row"><button class="btn wide" id="a-newdoc">✨ Nouvelle animation</button></div>

  <div class="row"><button class="btn wide" id="a-theme">🌓 Thème</button></div>
  <div class="fld" style="margin-top:6px">
    <label for="f-author">Signé</label>
    <input type="text" id="f-author" placeholder="Ton nom (facultatif)" maxlength="40">

</div>

<div class="sheet" id="sh-plays">
  <h2 id="sh-plays-h">🎬 Animations de ce play</h2>
  <div class="plist" id="plays-list"><div class="empty">Chargement…</div></div>
  <div class="row" style="margin-top:10px"><button class="btn wide" id="pl-reload">↻ Rafraîchir</button></div>
</div>

<input type="file" id="f-import" accept="application/json,.json" style="display:none">

<!-- ══ JALON 4 · ARBRE DES BRANCHES (tiroir gauche) ═══════════════════════
     L'arbre ET les pistes vivent dans le même tiroir : sur un iPhone en
     portrait, une colonne fixe à gauche mangerait la moitié du terrain. -->
<div class="tree" id="tree">
  <h2>🌳 Arbre du play</h2>
  <div class="scroll" id="tree-list"></div>
  <div class="lanes" id="tl-lanes"></div>
  <div class="row"><button class="btn wide" id="tr-home">🏠 Ligne principale</button></div>
  <div class="row"><button class="btn wide" id="tr-close">Fermer</button></div>
</div>

<!-- ══ JALON 4 · VIEWER JOUEUSE ═══════════════════════════════════════════
     Plein écran, boucle infinie, AUCUNE porte vers l'éditeur : les seuls
     réglages sont ceux du confort de lecture (vitesse, taille, miroir) et le
     choix d'une variante. -->
<div class="vw" id="vw">
  <div class="top">
    <span class="crumb" id="vw-crumb">Ligne principale</span>
    <button class="btn sm" id="vw-close" title="Fermer">✕</button>
  </div>
  <div class="bot">
    <button class="btn sm" id="vw-play" title="Lecture / pause">⏸</button>
    <button class="btn sm" id="vw-speed" title="Vitesse de lecture">🐢</button>
    <button class="btn sm" id="vw-size" title="Taille des pions">⤢</button>
    <button class="btn sm" id="vw-mirror" title="Inverser gauche / droite">↔</button>
    <button class="btn sm" id="vw-br" title="Variantes" style="display:none">🔀</button>
  </div>
</div>
<div class="vwmenu" id="vw-menu"><div class="card" id="vw-menu-card"></div></div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  // ─────────────────────────────────────────────────────────────────────
  // 0. VUES — 2D aujourd'hui, 3D au jalon 4+
  // ─────────────────────────────────────────────────────────────────────
  // SÉPARATION VOULUE : le modèle (positions des jetons, points des flèches)
  // vit TOUJOURS en « coordonnées terrain » — origine au coin haut-gauche de
  // la zone hors-jeu, 1 unité = 10 cm. Une vue n'est qu'une projection de ces
  // coordonnées vers la scène + un dessin de terrain.
  //
  //   project(p)   coordonnées terrain → coordonnées de la scène (dessin)
  //   unproject(p) coordonnées de la scène → coordonnées terrain (drag)
  //
  // En 2D top-down les deux sont l'identité, mais TOUT le code d'édition
  // (drag, clamp, tracé des flèches, pose du ballon) et TOUTE la lecture
  // animée passent déjà par elles : brancher une 3D au jalon 4 ne touchera pas
  // au moteur d'édition.
  var VIEWS = {
    '2d': {
      label: '2D', ready: true, editable: true,
      project:   function (p) { return { x: p.x, y: p.y }; },
      unproject: function (p) { return { x: p.x, y: p.y }; },
      court:     function (m) { return m === 'half' ? halfCourt() : fullCourt(); }
    },
    '3d': {
      label: '3D', ready: false, editable: false,
      project: null, unproject: null, court: null
    }
  };
  var view = '2d';

  // ─────────────────────────────────────────────────────────────────────
  // 1. GÉOMÉTRIE DU TERRAIN (1 unité = 10 cm)
  // ─────────────────────────────────────────────────────────────────────
  var R3 = 67.5;           // rayon arc 3 pts (6,75 m)
  // Écart entre le centre du cercle et le raccord de l'arc sur la ligne
  // droite du corner : √(R3² − (demi-largeur − 0,90 m)²) ≈ 14,15
  var JOIN = Math.sqrt(R3 * R3 - 66 * 66);

  var MODES = {
    // Demi-terrain vertical (panier en haut) — orientation naturelle sur iPhone.
    half: { vb: '0 0 174 164', w: 174, h: 164, hoop: { x: 87, y: 27.75 } },
    // Terrain complet horizontal (deux paniers, on attaque à droite).
    full: { vb: '0 0 304 174', w: 304, h: 174, hoop: { x: 276.25, y: 87 } }
  };

  // Dispositions de départ. Attaque en 2-1-2 face au panier, défense en
  // miroir intercalée entre l'attaque et le cercle : c'est juste un point de
  // départ raisonnable, le coach ré-arrange tout au doigt.
  // ⚠️ Contrainte de départ : deux jetons ne doivent JAMAIS se chevaucher à
  // l'ouverture, sinon on ne peut pas attraper celui du dessous au doigt. Le
  // diamètre d'un jeton vaut w/9,5 unités, soit ~18,3 en demi-terrain mais
  // ~32 en terrain plein : les écarts du plein sont donc BEAUCOUP plus larges
  // que ceux du demi, ce n'est pas une coquille.
  var LAYOUT = {
    half: {
      atk: [ {x:87,y:112}, {x:33,y:96},  {x:141,y:96},  {x:52,y:50},  {x:122,y:50} ],
      def: [ {x:87,y:90},  {x:46,y:78},  {x:128,y:78},  {x:64,y:33},  {x:110,y:33} ]
    },
    full: {
      atk: [ {x:140,y:87}, {x:168,y:30}, {x:168,y:144}, {x:228,y:48},  {x:228,y:126} ],
      def: [ {x:174,y:87}, {x:202,y:24}, {x:202,y:150}, {x:262,y:48},  {x:262,y:126} ]
    }
  };

  // Les 10 jetons sont FIXES et communs à tous les temps : seule leur position
  // change d'un temps à l'autre. Les garder statiques permet à une flèche de
  // référencer une joueuse par son id sans se soucier du temps courant.
  var TOKENS = (function () {
    var t = [], i;
    for (i = 1; i <= 5; i++) t.push({ id: 'a' + i, side: 'atk', n: i });
    for (i = 1; i <= 5; i++) t.push({ id: 'd' + i, side: 'def', n: i });
    return t;
  })();
  var TOKMAP = (function () { var m = {}, i; for (i = 0; i < TOKENS.length; i++) m[TOKENS[i].id] = TOKENS[i]; return m; })();

  // ── Pointes de flèche & barre d'écran (v.174) ────────────────────────
  // Longueurs en unités terrain, donc dépendantes de PR (mode ET taille des
  // jetons) : les markers sont en `userSpaceOnUse` et RECONSTRUITS à chaque
  // drawAll(), pas figés une fois pour toutes.
  function headLen(kind) { return PR * (kind === 'move' ? 0.8 : 0.72); }
  function headWid(kind) { return PR * (kind === 'move' ? 0.4 : 0.34); }
  // Barre d'écran : DEMI-longueur (donc ~5 unités de chaque côté en
  // demi-terrain, soit un mur d'un mètre — la largeur d'épaules d'une
  // joueuse), puis épaisseur. Exprimée en fraction de PR pour rester juste
  // quel que soit le mode de terrain ET la taille de jetons choisie.
  // Épaisseur 2,6 contre 1,45 pour le trait : c'est ce qui distingue au coup
  // d'œil « l'écran est POSÉ ici » du simple tracé qui y mène.
  var SCR_HALF = 0.55, SCR_THICK = 2.6;

  // viewBox == markerWidth/Height ⇒ échelle 1:1, aucune surprise quand PR
  // change. refX/refY placent le point de RÉFÉRENCE (celui qui atterrit sur la
  // fin du tracé) à la BASE de la tête : le trait s'arrête là, la tête
  // continue dans l'axe de la tangente.
  function markerArrow(id, kind) {
    var hl = headLen(kind), hw = headWid(kind);
    var w = f(hl), h = f(hw * 2);
    return '<marker id="' + id + '" markerUnits="userSpaceOnUse" orient="auto" overflow="visible"'
      + ' markerWidth="' + w + '" markerHeight="' + h + '" viewBox="0 0 ' + w + ' ' + h + '"'
      + ' refX="0" refY="' + f(hw) + '">'
      + '<path class="h" d="M 0 0 L ' + w + ' ' + f(hw) + ' L 0 ' + h + ' Z"/></marker>';
  }
  // ÉCRAN = une flèche de déplacement COMPLÈTE + le mur à l'arrivée. Le marker
  // porte donc les DEUX formes : le même triangle qu'un déplacement (la
  // joueuse va bien quelque part), puis la barre perpendiculaire juste
  // derrière la pointe. Un lecteur lit la phrase entière — « elle se déplace
  // là, et elle y pose un écran ».
  //
  // Un seul marker et pas deux formes séparées : SVG n'accepte qu'un
  // `marker-end` par tracé, et surtout les deux doivent partager EXACTEMENT
  // la même orientation. Les faire tourner ensemble dans le même marker le
  // garantit ; deux dessins indépendants rouvriraient le décalage d'axe qui
  // causait le « pli » (cf. updateArrow).
  //
  // Géométrie, en coordonnées marker (+x = sens du déplacement) :
  //   refX = 0        base du triangle, là où s'arrête le tracé
  //   x = hl          pointe du triangle == la DESTINATION visée
  //   x ∈ [hl, hl+th] la barre, face interne collée sur la destination
  function markerScreen(id) {
    var hl = headLen('move'), hw = headWid('move');
    var half = PR * SCR_HALF, th = SCR_THICK;
    var H = Math.max(hw, half) * 2, W = hl + th, cy = H / 2;
    return '<marker id="' + id + '" markerUnits="userSpaceOnUse" orient="auto" overflow="visible"'
      + ' markerWidth="' + f(W) + '" markerHeight="' + f(H) + '" viewBox="0 0 ' + f(W) + ' ' + f(H) + '"'
      + ' refX="0" refY="' + f(cy) + '">'
      + '<path class="h" d="M 0 ' + f(cy - hw) + ' L ' + f(hl) + ' ' + f(cy) + ' L 0 ' + f(cy + hw) + ' Z"/>'
      + '<rect class="h" x="' + f(hl) + '" y="' + f(cy - half) + '" width="' + f(th) + '"'
      + ' height="' + f(half * 2) + '" rx="' + f(th / 2) + '"/>'
      + '</marker>';
  }

  function defs() {
    return '<defs>'
      + markerArrow('mkAtk', 'move') + markerArrow('mkDef', 'move') + markerArrow('mkShot', 'pass')
      + markerScreen('mkScrAtk') + markerScreen('mkScrDef')
      + '<linearGradient id="gOut" x1="0" y1="0" x2="0" y2="1"><stop class="a" offset="0"/><stop class="b" offset="1"/></linearGradient>'
      + '<linearGradient id="gFloor" x1="0" y1="0" x2="0" y2="1"><stop class="a" offset="0"/><stop class="b" offset="1"/></linearGradient>'
      + '<linearGradient id="gDisc" x1="0" y1="0" x2="0" y2="1"><stop class="a" offset="0"/><stop class="b" offset="1"/></linearGradient>'
      + '<linearGradient id="gDef" x1="0" y1="0" x2="0" y2="1"><stop class="a" offset="0"/><stop class="b" offset="1"/></linearGradient>'
      + '<linearGradient id="gBall" x1="0" y1="0" x2="0" y2="1"><stop class="a" offset="0"/><stop class="b" offset="1"/></linearGradient>'
      + '<radialGradient id="gSheen" cx="50%" cy="34%" r="72%"><stop class="a" offset="0"/><stop class="b" offset="1"/></radialGradient>'
      + '<radialGradient id="gShadow"><stop class="a" offset="0"/><stop class="b" offset="0.6"/><stop class="c" offset="1"/></radialGradient>'
      + '</defs>';
  }

  // ── Logo « peint sur le parquet » (v.174) ────────────────────────────
  // Diamètre = 60 % de celui du cercle, opacité 0,34 : présent, jamais
  // envahissant, et il vit dans la couche TERRAIN — donc sous les flèches et
  // sous les jetons, exactement comme la peinture d'un vrai parquet.
  //
  // Placement : en terrain complet, le centre du rond central (parquet NBA).
  // En DEMI-terrain le rond central est coupé en deux par le bord de l'image —
  // un logo posé là déborderait dans la zone de remise en touche. On le met
  // donc sur le cercle des lancers francs, le seul cercle entièrement visible
  // d'un demi-terrain et son centre optique.
  //
  // Le href est vide au départ : il est renseigné par applyLogo() une fois le
  // PNG chargé EN data: URI. Un href de fichier ne survivrait pas à l'export
  // photo (un SVG rasterisé depuis une data: URL n'a pas le droit d'aller
  // chercher une ressource externe : le logo manquerait sur le PNG).
  function courtLogo(cx, cy, r) {
    var s = f(r * 1.2);
    return '<image class="logo" id="court-logo" style="display:none" opacity="0.34"'
      + ' x="' + f(cx - r * 0.6) + '" y="' + f(cy - r * 0.6) + '"'
      + ' width="' + s + '" height="' + s + '" preserveAspectRatio="xMidYMid meet"/>';
  }

  function halfCourt() {
    return ''
      + '<rect class="out" x="0" y="0" width="174" height="164"/>'
      + '<rect class="court" x="12" y="12" width="150" height="140"/>'
      // Limites de l'aire de jeu (fond + touches) et ligne médiane.
      + '<rect class="ln strong" x="12" y="12" width="150" height="140"/>'
      + '<line class="ln strong" x1="12" y1="152" x2="162" y2="152"/>'
      // Demi cercle central (l'autre moitié est hors du demi-terrain).
      + '<path class="ln" d="M 69 152 A 18 18 0 0 1 105 152"/>'
      // Raquette 4,90 m (x 62,5 → 111,5) profonde de 5,80 m + cercle des LF.
      + '<rect class="ln" x="62.5" y="12" width="49" height="58"/>'
      + '<circle class="ln" cx="87" cy="70" r="18"/>'
      // Arc à 3 pts : corners droits puis arc de 6,75 m autour du panier.
      + '<path class="ln" d="M 21 12 L 21 ' + f(27.75 + JOIN) + ' A 67.5 67.5 0 0 0 153 ' + f(27.75 + JOIN) + ' L 153 12"/>'
      // Zone de non-charge (1,25 m).
      + '<path class="ln" d="M 74.5 27.75 A 12.5 12.5 0 0 0 99.5 27.75"/>'
      // Planche + cercle.
      + '<line class="hp" x1="78" y1="24" x2="96" y2="24"/>'
      + '<line class="hp" x1="87" y1="24" x2="87" y2="25.5"/>'
      + '<circle class="hp" cx="87" cy="27.75" r="2.25"/>'
      // Logo du club, sur le cercle des lancers francs (cf. courtLogo).
      + courtLogo(87, 70, 18)
      // Voile lumineux : donne du relief au parquet sans coûter une frame.
      + '<rect class="sheen" x="12" y="12" width="150" height="140"/>';
  }

  function fullCourt() {
    var j = f(27.75 + JOIN), jr = f(276.25 - JOIN);   // raccords arc/corner
    return ''
      + '<rect class="out" x="0" y="0" width="304" height="174"/>'
      + '<rect class="court" x="12" y="12" width="280" height="150"/>'
      + '<rect class="ln strong" x="12" y="12" width="280" height="150"/>'
      + '<line class="ln strong" x1="152" y1="12" x2="152" y2="162"/>'
      + '<circle class="ln" cx="152" cy="87" r="18"/>'
      // ── Panier gauche ────────────────────────────────────────────────
      + '<rect class="ln" x="12" y="62.5" width="58" height="49"/>'
      + '<circle class="ln" cx="70" cy="87" r="18"/>'
      + '<path class="ln" d="M 12 21 L ' + j + ' 21 A 67.5 67.5 0 0 1 ' + j + ' 153 L 12 153"/>'
      + '<path class="ln" d="M 27.75 74.5 A 12.5 12.5 0 0 1 27.75 99.5"/>'
      + '<line class="hp" x1="24" y1="78" x2="24" y2="96"/>'
      + '<line class="hp" x1="24" y1="87" x2="25.5" y2="87"/>'
      + '<circle class="hp" cx="27.75" cy="87" r="2.25"/>'
      // ── Panier droit (miroir) ────────────────────────────────────────
      + '<rect class="ln" x="234" y="62.5" width="58" height="49"/>'
      + '<circle class="ln" cx="234" cy="87" r="18"/>'
      + '<path class="ln" d="M 292 21 L ' + jr + ' 21 A 67.5 67.5 0 0 0 ' + jr + ' 153 L 292 153"/>'
      + '<path class="ln" d="M 276.25 74.5 A 12.5 12.5 0 0 0 276.25 99.5"/>'
      + '<line class="hp" x1="280" y1="78" x2="280" y2="96"/>'
      + '<line class="hp" x1="280" y1="87" x2="278.5" y2="87"/>'
      + '<circle class="hp" cx="276.25" cy="87" r="2.25"/>'
      // Logo du club, au centre du rond central — parquet NBA.
      + courtLogo(152, 87, 18)
      + '<rect class="sheen" x="12" y="12" width="280" height="150"/>';
  }

  function f(n) { return Math.round(n * 100) / 100; }

  // ─────────────────────────────────────────────────────────────────────
  // 2. MODÈLE
  // ─────────────────────────────────────────────────────────────────────
  // doc = le play complet.
  //   métadonnées   id, title, tag, side, color, description, points, author
  //   ballStart     id du jeton porteur au temps 0 (un seul), ou null
  //   defOn         la défense est-elle montrée ?
  //   mode          'half' | 'full' — le mode ACTIF, celui qui sera publié
  //   half / full   { steps: [ … ] } — un jeu de temps par mode (cf. en-tête)
  //
  // Un TEMPS =
  //   pos   { idJeton : {x,y} }  la photo au DÉBUT du temps
  //   arw   [ {id, kind:'move'|'pass', from:<idJeton>,
  //            to:<idJeton>|{x,y}, via:[{x,y}…]} ]
  //   shot  <idJeton> | null     qui tire à la fin du temps
  //   note  texte libre
  //
  // La défense EXISTE toujours dans le modèle : le toggle ne fait que la
  // montrer ou la cacher, donc couper puis rallumer la défense ne perd ni les
  // positions ni les flèches qui la touchent.
  var seq = 0;               // compteur d'ids (flèches, temps) unique par session

  function uid(p) { return p + (++seq) + '-' + Math.random().toString(36).slice(2, 6); }

  function startPos(m) {
    var p = {}, i;
    for (i = 0; i < 5; i++) { p['a' + (i+1)] = { x: LAYOUT[m].atk[i].x, y: LAYOUT[m].atk[i].y }; }
    for (i = 0; i < 5; i++) { p['d' + (i+1)] = { x: LAYOUT[m].def[i].x, y: LAYOUT[m].def[i].y }; }
    return p;
  }
  function clonePos(p) { var o = {}, k; for (k in p) o[k] = { x: p[k].x, y: p[k].y }; return o; }

  function makeStep(pos) { return { id: uid('s'), pos: pos, arw: [], shot: null, note: '' }; }

  function makeDoc() {
    return {
      id: null, title: '', tag: '', side: 'attaque', color: '#22D3EE',
      description: '', points: '', author: '',
      ballStart: 'a1', defOn: false, mode: 'half', tokenSize: 1, labelStyle: 'numbers',
      half: { steps: [ makeStep(startPos('half')) ] },
      full: { steps: [ makeStep(startPos('full')) ] }
    };
  }

  var doc = makeDoc();
  var cur = 0;               // index du temps en cours d'édition

  var svg   = document.getElementById('court');
  var elArw = document.getElementById('i-arw');
  var elTok = document.getElementById('i-tok');
  var elBal = document.getElementById('i-ball');
  var elFps = document.getElementById('fps');
  var elHint= document.getElementById('hint');

  var tool  = 'select';
  var active  = null;        // id du jeton sélectionné (halo violet)
  var pending = null;        // id du jeton source d'une flèche en cours

  var PR = 0;                // rayon du jeton en unités terrain
  var layC = null, layA = null, layT = null, layP = null, layM = null;
  var tokEl = {};            // id jeton  → <g>
  var arwEl = {};            // id flèche → { g, body, hit, head }

  function mode() { return doc.mode; }

  // ── BRANCHES (jalon 4) ───────────────────────────────────────────────
  // Une branche est une LIGNE DE TEMPS comme une autre : même structure,
  // rangée dans le temps d'où elle part (`step.branches[]`). C'est ce qui
  // permet à tout le moteur — cascade, drag, lecture, export photo — de
  // continuer à ne connaître QU'UNE liste de temps : celle du chemin courant.
  //
  //   step.branches = [ { id, name, description, returns_to_main, steps:[…] } ]
  //
  // `bpath` est le chemin de navigation : [] = ligne principale, sinon une
  // suite de sauts { si:<index du temps de départ>, bid:<id de branche> }.
  // Il est VOLATILE (navigation), jamais publié — le JSON, lui, est récursif.
  //
  // Une animation SANS branche n'a aucune clé `branches` : bpath reste vide,
  // steps() renvoie exactement ce qu'il renvoyait avant, et rien ne change.
  var BR_DEPTH_MAX = 3;   // branche → sous-branche → sous-sous-branche
  var BR_PER_STEP  = 5;
  var bpath = [];

  function rootSteps() { return doc[doc.mode].steps; }
  function branchIn(list, si, bid) {
    var st = list[si], i;
    if (!st || !Array.isArray(st.branches)) return null;
    for (i = 0; i < st.branches.length; i++) if (st.branches[i].id === bid) return st.branches[i];
    return null;
  }
  // Résolution TOLÉRANTE : si un saut ne retombe sur rien (branche supprimée
  // sous nos pieds, brouillon d'une autre version), on tronque le chemin et on
  // remonte au niveau du dessus plutôt que de rendre un écran blanc.
  function stepsAt(path) {
    var l = rootSteps(), i, b;
    for (i = 0; i < path.length; i++) {
      b = branchIn(l, path[i].si, path[i].bid);
      if (!b || !Array.isArray(b.steps) || !b.steps.length) { path.length = i; break; }
      l = b.steps;
    }
    return l;
  }
  function branchAt(path) {
    if (!path.length) return null;
    return branchIn(stepsAt(path.slice(0, -1)), path[path.length - 1].si, path[path.length - 1].bid);
  }
  function steps() { return stepsAt(bpath); }
  function step() { return steps()[cur] || steps()[0]; }
  function pos() { return step().pos; }
  // Terrain complet : on tire sur le panier le PLUS PROCHE de la tireuse.
  // Sans ça, un play basculé par le miroir (⇋) continuerait d'attaquer le
  // panier de droite et le tir traverserait tout le terrain.
  function hoop(from) {
    var m = MODES[mode()];
    if (mode() !== 'full' || !from) return m.hoop;
    return from.x < 152 ? { x: 27.75, y: 87 } : m.hoop;
  }

  // Un jeton « live » : identité statique + position du temps courant. Les
  // écritures passent TOUJOURS par pos()[id], jamais par cet objet jetable.
  function tokById(id, p) {
    var t = TOKMAP[id];
    if (!t) return null;
    var q = (p || pos())[id];
    if (!q) return null;
    return { id: t.id, side: t.side, n: t.n, x: q.x, y: q.y };
  }
  // ── ÉTIQUETTE D'UN JETON (v.175) ─────────────────────────────────────
  // LE seul endroit qui décide de ce qui est écrit sur une pastille.
  // tokenMarkup, syncInfo et setHint passent tous par ici : trois formules
  // parallèles finiraient par diverger, et la barre d'info annoncerait
  // « 🏀 3 » pendant que le jeton afficherait « C » — de quoi faire douter le
  // coach de ce qu'il a sous les yeux.
  //
  // Le style ne concerne QUE l'attaque : `X1…X5` est déjà la convention des
  // coachs pour la défense, il n'y a rien à y basculer.
  var ATK_LETTERS = 'ABCDE';
  function labelOf(id) {
    var t = TOKMAP[id];
    if (!t) return '';
    if (t.side !== 'atk') return 'X' + t.n;
    if (doc && doc.labelStyle === 'letters') return ATK_LETTERS.charAt(t.n - 1) || String(t.n);
    return String(t.n);
  }

  function visible(t) { return !!t && (t.side === 'atk' || doc.defOn); }
  // Une flèche n'est rendue (ni comptée) que si ses deux extrémités le sont.
  function arwVisible(a) {
    if (!visible(tokById(a.from))) return false;
    if (typeof a.to === 'string' && !visible(tokById(a.to))) return false;
    return true;
  }

  // Le jeton doit rester ~40 px de diamètre à l'écran quel que soit le mode :
  // on l'exprime donc en fraction de la largeur du viewBox (qui, lui, est
  // toujours mis à l'échelle sur la largeur disponible).
  // × doc.tokenSize (S 0,75 · M 1 · L 1,25) : TOUT ce qui habille le jeton —
  // chiffre, ballon, halo, ombre, pointes de flèche, barre d'écran — est
  // exprimé en fraction de PR, donc tout suit sans un seul cas particulier.
  var SIZES = { s: 0.75, m: 1, l: 1.25 };
  function radiusFor(m) { return MODES[m].w / 19 * (doc && doc.tokenSize || 1); }

  // Sortie d'un temps = sa photo à laquelle on applique ses déplacements.
  // Sert à fabriquer le temps suivant et à détecter les décalages.
  // Un ÉCRAN déplace la joueuse exactement comme un déplacement : c'est un
  // trajet, il se termine simplement par un mur au lieu d'une pointe. Tout ce
  // qui raisonne « qui bouge pendant ce temps » passe donc par isMoveKind() —
  // sortie du temps, lecture animée, et la règle « une seule trajectoire par
  // joueuse et par temps ».
  function isMoveKind(k) { return k === 'move' || k === 'screen'; }

  function endPos(st) {
    var p = clonePos(st.pos), i, a;
    for (i = 0; i < st.arw.length; i++) {
      a = st.arw[i];
      if (!isMoveKind(a.kind)) continue;
      var d = typeof a.to === 'string' ? p[a.to] : a.to;
      if (d && p[a.from]) p[a.from] = { x: d.x, y: d.y };
    }
    return p;
  }
  function samePos(p, q) {
    var k;
    for (k in p) { if (!q[k]) return false; if (Math.abs(p[k].x - q[k].x) > 0.5 || Math.abs(p[k].y - q[k].y) > 0.5) return false; }
    return true;
  }
  function desynced(i) { return i > 0 && !samePos(steps()[i].pos, endPos(steps()[i - 1])); }

  // ── PROPAGATION EN CASCADE (v.179) ────────────────────────────────
  // Le coach édite le temps N : la SORTIE du temps N change, donc l'entrée
  // de N+1 doit suivre, et ainsi de suite jusqu'au dernier temps. Sinon la
  // joueuse se téléporte entre la fin de N et le début de N+1.
  //
  // AUCUNE exception : il n'existe pas de position « épinglée ». Une v.176
  // avait tenté de préserver les positions posées à la main en aval ; c'est
  // l'hérédité qui compte, et deux règles concurrentes sur la même donnée
  // finissent toujours par se contredire à l'écran.
  //
  // Coût : un endPos() (≈ 10 points clonés + les flèches du temps) par temps.
  // Mesuré à 0,03 ms pour 20 temps × 10 jetons — très en dessous des 16 ms
  // d'une frame iPhone, donc on appelle à chaque édition plutôt que
  // d'entretenir un cache à invalider.
  function recomputeList(l, from, curIdx) {
    var i, k, prev, p, q, hit = 0;
    if (!(from > 1)) from = 1;
    for (i = from; i < l.length; i++) {
      prev = endPos(l[i - 1]);          // ← déjà recalculé au tour d'avant
      p = l[i].pos;
      for (k in prev) {
        q = p[k];
        if (!q) { p[k] = { x: prev[k].x, y: prev[k].y }; if (i === curIdx) hit++; continue; }
        if (Math.abs(q.x - prev[k].x) < 0.001 && Math.abs(q.y - prev[k].y) < 0.001) continue;
        q.x = prev[k].x; q.y = prev[k].y;
        if (i === curIdx) hit++;        // le temps affiché a bougé
      }
    }
    return hit;
  }
  function recomputeStepPositions(from) { return recomputeList(steps(), from, cur); }
  // Recalcule PUIS redessine, mais seulement si le temps à l'écran a
  // effectivement bougé : éditer le temps 3 ne doit pas faire clignoter
  // le terrain à chaque frame de drag.
  function cascade(from) {
    if (recomputeStepPositions(from) && !playing) { drawTokens(); drawArrows(); syncInfo(); }
  }

  // Porteuse du ballon au DÉBUT du temps i : on repart de doc.ballStart et on
  // suit les passes. Dérivé, jamais stocké — une passe supprimée se répercute
  // donc immédiatement sur tous les temps qui suivent.
  function holderAt(i) {
    var h = doc.ballStart, k, j, st;
    for (k = 0; k < i && k < steps().length; k++) {
      st = steps()[k];
      for (j = 0; j < st.arw.length; j++)
        if (st.arw[j].kind === 'pass' && typeof st.arw[j].to === 'string') h = st.arw[j].to;
      if (st.shot) h = null;   // après un tir, plus personne ne tient la balle
    }
    return h;
  }
  function passOf(st) {
    var j;
    for (j = 0; j < st.arw.length; j++) if (st.arw[j].kind === 'pass') return st.arw[j];
    return null;
  }

  // ─────────────────────────────────────────────────────────────────────
  // 3. RENDU — couches reconstruites séparément
  // ─────────────────────────────────────────────────────────────────────
  // terrain (jamais retouché hors changement de mode/vue) · flèches · jetons ·
  // lecture. Le drag n'écrit que des attributs, il ne reconstruit rien.
  function drawAll() {
    PR = radiusFor(mode());
    // Amplitude du rebond de dribble : en unités TERRAIN (px CSS sur du SVG
    // = unités utilisateur), donc proportionnelle au jeton.
    document.documentElement.style.setProperty('--dribble-y', f(PR * 0.30) + 'px');
    svg.setAttribute('viewBox', MODES[mode()].vb);
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    svg.innerHTML = defs()
      + '<g id="lay-court">' + VIEWS[view].court(mode()) + '</g>'
      + '<g id="lay-arw"></g><g id="lay-tok"></g><g id="lay-play"></g>'
      // Couche de MESURE : des <path> jamais peints, uniquement là pour que
      // getPointAtLength() nous donne la position d'une joueuse le long de sa
      // courbe pendant la lecture. Native, exacte, et ça évite de ré-implémenter
      // l'échantillonnage d'une Catmull-Rom à la main.
      + '<g id="lay-meas" style="display:none"></g>';
    layC = document.getElementById('lay-court');
    layA = document.getElementById('lay-arw');
    layT = document.getElementById('lay-tok');
    layP = document.getElementById('lay-play');
    layM = document.getElementById('lay-meas');
    drawTokens();
    drawArrows();
    applyLogo();      // le terrain vient d'être reconstruit : on re-pose le logo
    syncInfo();
  }

  function tokenMarkup(t) {
    var lbl = labelOf(t.id);
    var fs  = t.side === 'atk' ? PR * 1.05 : PR * 0.82;
    var br  = PR * 0.44, bx = PR * 0.82, by = -PR * 0.78;
    return '<g class="token ' + t.side + '" data-id="' + t.id + '">'
      + '<ellipse class="sh" cx="0" cy="' + f(PR * 0.46) + '" rx="' + f(PR * 1.02) + '" ry="' + f(PR * 0.52) + '"/>'
      + '<circle class="disc" cx="0" cy="0" r="' + f(PR) + '"/>'
      + '<circle class="halo" cx="0" cy="0" r="' + f(PR + 1.6) + '"/>'
      + '<text class="num" x="0" y="0" dy="0.35em" font-size="' + f(fs) + '">' + lbl + '</text>'
      // Ballon : petit disque orange collé en haut à droite du chiffre, avec
      // deux coutures. Masqué par CSS tant que le jeton n'a pas .has-ball.
      + '<g class="ball">'
      +   '<circle class="b" cx="' + f(bx) + '" cy="' + f(by) + '" r="' + f(br) + '"/>'
      +   '<line class="s" x1="' + f(bx - br) + '" y1="' + f(by) + '" x2="' + f(bx + br) + '" y2="' + f(by) + '"/>'
      +   '<line class="s" x1="' + f(bx) + '" y1="' + f(by - br) + '" x2="' + f(bx) + '" y2="' + f(by + br) + '"/>'
      + '</g>'

      + '</g>';
  }

  function drawTokens() {
    var html = '', i, t;
    for (i = 0; i < TOKENS.length; i++) {
      t = tokById(TOKENS[i].id);
      if (visible(t)) html += tokenMarkup(t);
    }
    layT.innerHTML = html;
    tokEl = {};
    var gs = layT.querySelectorAll('.token');
    for (i = 0; i < gs.length; i++) {
      var g = gs[i], id = g.getAttribute('data-id');
      tokEl[id] = g;
      placeToken(id);
      attachTokenPointer(g, id);
    }
    syncSelection();
    syncBall();
  }

  function placeToken(id, p) {
    var g = tokEl[id];
    if (!g) return;
    var q = p || pos()[id];
    if (!q) return;
    var s = VIEWS[view].project(q);   // terrain → scène (identité en 2D)
    // transform (composité) plutôt que cx/cy : moins de recalcul par frame,
    // et l'ombre peinte suit le jeton sans travail supplémentaire.
    g.setAttribute('transform', 'translate(' + f(s.x) + ' ' + f(s.y) + ')');
  }

  function syncSelection() {
    var id;
    for (id in tokEl) {
      tokEl[id].classList.toggle('active', id === active);
      tokEl[id].classList.toggle('pending', id === pending);
    }
    if (layT) layT.classList.toggle('has-active', !!(active && tokEl[active]));
    document.getElementById('b-ball').disabled = !(active && tokEl[active]) || playing;
  }

  // Le porteur affiché dépend du TEMPS COURANT : au temps 3 c'est la dernière
  // réceptionneuse, pas la porteuse du temps 0.
  function syncBall() {
    var h = holderAt(cur), id;
    for (id in tokEl) tokEl[id].classList.toggle('has-ball', id === h);
  }

  // ── Flèches ──────────────────────────────────────────────────────────
  // Points du modèle (source → waypoints → cible), en coordonnées terrain.
  function rawPts(a, p) {
    var src = tokById(a.from, p);
    if (!src) return null;
    var out = [{ x: src.x, y: src.y }], i, v = a.via || [];
    for (i = 0; i < v.length; i++) out.push({ x: v[i].x, y: v[i].y });
    var dst = typeof a.to === 'string' ? tokById(a.to, p) : a.to;
    if (!dst) return null;
    out.push({ x: dst.x, y: dst.y });
    return out;
  }

  // Rogne l'extrémité i vers son voisin : le trait part du BORD du jeton et
  // s'arrête au bord du jeton cible, jamais de centre à centre.
  function shrink(p, i, pad) {
    if (pad <= 0) return;
    var j = i === 0 ? 1 : i - 1;
    var dx = p[j].x - p[i].x, dy = p[j].y - p[i].y;
    var L = Math.sqrt(dx * dx + dy * dy);
    if (L < 0.01) return;
    if (L < pad + 0.6) pad = Math.max(0, L - 0.6);
    p[i] = { x: p[i].x + dx / L * pad, y: p[i].y + dy / L * pad };
  }

  // Tracé + angle de la pointe. Sans waypoint : segment droit. Avec : une
  // Catmull-Rom convertie en cubiques — le chemin passe EXACTEMENT par les
  // points posés par le coach, ce qu'une quadratique de contrôle ne fait pas
  // (avec une quadratique, le point posé au doigt ne serait qu'un point de
  // CONTRÔLE : la courbe passerait à côté, et le coach corrigerait à l'aveugle).
  function buildPath(p) {
    var i, d, last;
    if (p.length === 2) {
      return {
        d: 'M ' + f(p[0].x) + ' ' + f(p[0].y) + ' L ' + f(p[1].x) + ' ' + f(p[1].y),
        ang: Math.atan2(p[1].y - p[0].y, p[1].x - p[0].x)
      };
    }
    d = 'M ' + f(p[0].x) + ' ' + f(p[0].y);
    var c2 = null;
    for (i = 0; i < p.length - 1; i++) {
      var a = p[i - 1] || p[i], b = p[i], c = p[i + 1], e = p[i + 2] || p[i + 1];
      var k1 = { x: b.x + (c.x - a.x) / 6, y: b.y + (c.y - a.y) / 6 };
      var k2 = { x: c.x - (e.x - b.x) / 6, y: c.y - (e.y - b.y) / 6 };
      d += ' C ' + f(k1.x) + ' ' + f(k1.y) + ' ' + f(k2.x) + ' ' + f(k2.y) + ' ' + f(c.x) + ' ' + f(c.y);
      c2 = k2;
    }
    last = p[p.length - 1];
    // Tangente en fin de cubique = (point final − dernier point de contrôle).
    var dx = last.x - c2.x, dy = last.y - c2.y;
    if (dx * dx + dy * dy < 1e-4) { dx = last.x - p[p.length - 2].x; dy = last.y - p[p.length - 2].y; }
    return { d: d, ang: Math.atan2(dy, dx) };
  }

  function arrowMarkup(a) {
    var t = tokById(a.from);
    var cls = 'arw ' + (t && t.side === 'atk' ? 'atk' : 'def') + ' ' + a.kind;
    var wp = '', v = a.via || [], i;
    // Poignee d'extremite : SEULEMENT la ou la cible est un point LIBRE.
    // Une passe relie deux joueuses : ses deux bouts sont deja tenus par les
    // jetons, il n'y a rien a repositionner (on la refait en mode Passe :
    // joueuse A -> joueuse B). Le deplacement et l'ecran, eux, visent une
    // PLACE sur le terrain — c'est cette place que la poignee regle.
    var tip = a.kind === 'pass' ? ''
      : '<circle class="tiphit" data-arw="' + a.id + '" cx="0" cy="0" r="' + f(PR * 0.85) + '"/>'
      + '<circle class="tip" data-arw="' + a.id + '" cx="0" cy="0" r="' + f(PR * 0.32) + '"/>';
    for (i = 0; i < v.length; i++)
      wp += '<circle class="wphit" data-arw="' + a.id + '" data-i="' + i + '" cx="' + f(v[i].x) + '" cy="' + f(v[i].y) + '" r="' + f(PR * 0.85) + '"/>'
          + '<circle class="wp" data-arw="' + a.id + '" data-i="' + i + '" cx="' + f(v[i].x) + '" cy="' + f(v[i].y) + '" r="' + f(PR * 0.3) + '"/>';
    return '<g class="' + cls + '" data-id="' + a.id + '">'
      + '<path class="hit" d=""/><path class="body" d=""/>' + wp + tip + '</g>';
  }

  // Le tir n'est pas une flèche du modèle mais un drapeau sur le temps : on le
  // DESSINE comme une flèche (vers le cercle) sans l'y stocker, pour que
  // supprimer la tireuse du terrain ne laisse jamais de flèche orpheline.
  function shotMarkup() {
    return '<g class="arw shot" data-id="__shot">'
      + '<path class="hit" d=""/><path class="body" d=""/></g>';
  }

  function drawArrows() {
    var list = step().arw, html = '', i;
    for (i = 0; i < list.length; i++) if (arwVisible(list[i])) html += arrowMarkup(list[i]);
    var sh = step().shot;
    if (sh && visible(tokById(sh))) html += shotMarkup();
    layA.innerHTML = html;
    arwEl = {};
    var gs = layA.querySelectorAll('.arw');
    for (i = 0; i < gs.length; i++) {
      var g = gs[i], id = g.getAttribute('data-id');
      arwEl[id] = { g: g, body: g.querySelector('.body'), hit: g.querySelector('.hit'),
                    tip: g.querySelector('.tip'), tiphit: g.querySelector('.tiphit') };
      updateArrow(id);
      attachArrowPointer(g, id);
    }
    var wps = layA.querySelectorAll('.wphit');
    for (i = 0; i < wps.length; i++) attachWaypointPointer(wps[i]);
    var tps = layA.querySelectorAll('.tiphit');
    for (i = 0; i < tps.length; i++) attachTipPointer(tps[i]);
  }

  // Recalcule le d= d'UNE flèche. C'est le seul travail fait pendant un drag,
  // et uniquement pour les flèches réellement attachées au jeton déplacé.
  function updateArrow(id) {
    var el = arwEl[id];
    if (!el) return;
    var a, p, endPad;
    if (id === '__shot') {
      var s = tokById(step().shot);
      if (!s) return;
      var h = hoop(s);
      a = { kind: 'shot', to: null };
      p = [{ x: s.x, y: s.y }, { x: h.x, y: h.y }];
      endPad = 2.6;
    } else {
      a = findArw(id);
      if (!a) return;
      p = rawPts(a);
      if (!p) return;
      endPad = typeof a.to === 'string' ? PR + 1.2 : 0;
    }
    shrink(p, 0, PR + 0.8);
    // ── LE FIX DU « PLI » AVANT LA POINTE (v.174) ──────────────────────
    // La pointe est maintenant un marker posé sur le DERNIER point du tracé.
    // On rogne donc de sa longueur EN PLUS du retrait de bord : la pointe
    // retombe exactement là où visait la flèche, et le trait s'arrête pile à
    // sa base. Il ne peut plus longer la tête et ressortir par son flanc,
    // quelle que soit la courbure — c'était ça, le blob.
    // L'écran rogne EXACTEMENT comme un déplacement : son marker commence lui
    // aussi par un triangle, la barre n'arrive qu'après la pointe.
    var hl = headLen(id === '__shot' ? 'pass' : 'move');
    shrink(p, p.length - 1, endPad + hl);
    var r = buildPath(p);
    el.body.setAttribute('d', r.d);
    el.hit.setAttribute('d', r.d);
    // La poignée se pose sur la pointe VUE (base du marker + sa longueur), pas
    // sur le point du modèle : sinon, quand la flèche vise une joueuse, elle
    // s'enfouirait sous le jeton et deviendrait impossible à attraper.
    if (el.tip) {
      var lp = p[p.length - 1];
      var tx = lp.x + Math.cos(r.ang) * hl, ty = lp.y + Math.sin(r.ang) * hl;
      el.tip.setAttribute('cx', f(tx)); el.tip.setAttribute('cy', f(ty));
      el.tiphit.setAttribute('cx', f(tx)); el.tiphit.setAttribute('cy', f(ty));
    }
  }

  function arrowsOf(tokId) {
    var out = [], list = step().arw, i;
    for (i = 0; i < list.length; i++)
      if (list[i].from === tokId || list[i].to === tokId) out.push(list[i].id);
    if (step().shot === tokId) out.push('__shot');
    return out;
  }

  function findArw(id) {
    var l = step().arw, i;
    for (i = 0; i < l.length; i++) if (l[i].id === id) return l[i];
    return null;
  }

  // ─────────────────────────────────────────────────────────────────────
  // 4. COORDONNÉES ÉCRAN → TERRAIN
  // ─────────────────────────────────────────────────────────────────────
  // getScreenCTM().inverse() : exact quelle que soit la mise à l'échelle du
  // viewBox, le zoom ou la rotation de l'écran.
  function toCourt(clientX, clientY) {
    var ctm = svg.getScreenCTM();
    if (!ctm) return null;
    var p = svg.createSVGPoint();
    p.x = clientX; p.y = clientY;
    var s = p.matrixTransform(ctm.inverse());
    return VIEWS[view].unproject(s);   // scène → terrain (identité en 2D)
  }

  // Le jeton peut aller jusqu'au bord du viewBox (donc dans la marge de
  // remise en touche) mais jamais au-delà : le disque reste entièrement
  // visible.
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function clampPt(p, pad) {
    var c = MODES[mode()];
    return { x: clamp(p.x, pad, c.w - pad), y: clamp(p.y, pad, c.h - pad) };
  }

  // ─────────────────────────────────────────────────────────────────────
  // 5. DRAG — PointerEvents (iPhone + desktop, même chemin de code)
  // ─────────────────────────────────────────────────────────────────────
  // Moteur générique : il ne sait rien des jetons ni des waypoints, il reçoit
  // « lis la position », « écris la position », « et voilà un tap ».
  // Sous ce seuil (en unites terrain, ~1/3 du diametre d'un jeton), un geste
  // est une hesitation ou un clic accidentel : on annule et on revient au point
  // de depart. Au-dessus, c'est un deplacement voulu.
  var CANCEL_D = 6;

  // Affiche UNE fois dans la vie du navigateur la regle du fantome.
  function ghostHint() {
    try { if (localStorage.getItem('pb_poc_ghosthint')) return; } catch (_) { return; }
    var d = document.getElementById('gh-hint');
    if (!d) { d = document.createElement('div'); d.id = 'gh-hint'; document.body.appendChild(d); }
    d.textContent = 'Relache pres du fantome pour annuler';
    requestAnimationFrame(function () { d.classList.add('on'); });
    setTimeout(function () { d.classList.remove('on'); }, 2600);
    try { localStorage.setItem('pb_poc_ghosthint', '1'); } catch (_) {}
  }

  function makeDrag(el, opts) {
    var on = false, off = { x: 0, y: 0 }, moved = 0, pid = null;
    var queued = null, raf = 0;
    var origin = null, ghost = null, near = false, anim = 0;

    function dist(a, b) { var dx = a.x - b.x, dy = a.y - b.y; return Math.sqrt(dx * dx + dy * dy); }

    function showGhost(c) {
      ghost = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      ghost.setAttribute('class', 'gh' + (opts.ghostDef && opts.ghostDef() ? ' def' : ''));
      ghost.setAttribute('cx', f(c.x)); ghost.setAttribute('cy', f(c.y));
      ghost.setAttribute('r', f(opts.ghostR ? opts.ghostR() : 1.8));
      svg.appendChild(ghost);
      near = false;
    }
    function hideGhost() {
      if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
      ghost = null; near = false;
    }
    // Halo « relache ici pour annuler ». On n'ecrit la classe QUE quand elle
    // change : sinon on touche au DOM a chaque frame pour rien.
    function syncNear() {
      if (!ghost || !origin) return;
      var c = opts.get();
      var n = !!c && dist(c, origin) < CANCEL_D;
      if (n === near) return;
      near = n;
      ghost.setAttribute('class', ghost.getAttribute('class').replace(' near', '') + (n ? ' near' : ''));
    }

    // On ne rend QU'UNE fois par frame : les pointermove arrivent souvent
    // plus vite que 60 Hz sur iPhone (jusqu'a 120 Hz), inutile de recalculer
    // le CTM a chaque evenement.
    function flush() {
      raf = 0;
      var e = queued; queued = null;
      if (!e) return;
      var p = toCourt(e.clientX, e.clientY);
      if (!p) return;
      opts.set(clampPt({ x: p.x + off.x, y: p.y + off.y }, opts.pad()));
      syncNear();
      fpsTick();
    }

    el.addEventListener('pointerdown', function (e) {
      e.stopPropagation();
      if (on) return;                       // 2e doigt : un seul drag a la fois
      if (!VIEWS[view].editable || playing) return;
      if (opts.down && opts.down(e) === false) return;
      e.preventDefault();
      var p = toCourt(e.clientX, e.clientY);
      if (!p) return;
      var c = opts.get();
      if (!c) return;
      on = true; moved = 0; pid = e.pointerId;
      off.x = c.x - p.x; off.y = c.y - p.y;
      origin = { x: c.x, y: c.y };
      if (anim) { cancelAnimationFrame(anim); anim = 0; }
      showGhost(origin);
      ghostHint();
      // Capture : le doigt garde le jeton meme s'il sort du <g> (et on recoit
      // toujours le pointerup, y compris hors de l'element).
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      el.classList.add('drag');
      fpsReset();
    }, { passive: false });

    el.addEventListener('pointermove', function (e) {
      if (!on || e.pointerId !== pid) return;
      e.preventDefault(); e.stopPropagation();
      moved++;
      queued = e;
      if (!raf) raf = requestAnimationFrame(flush);
    }, { passive: false });

    // Retour anime (300 ms, ease-out) puis touch() : pour le reste de l'editeur,
    // un drag annule est un drag qui s'est termine sur son point de depart.
    function animBack(from, to) {
      var t0 = performance.now(), D = 300;
      if (anim) cancelAnimationFrame(anim);
      (function frame(t) {
        var k = Math.min(1, (t - t0) / D);
        var e2 = 1 - Math.pow(1 - k, 3);
        opts.set({ x: from.x + (to.x - from.x) * e2, y: from.y + (to.y - from.y) * e2 });
        if (k < 1) { anim = requestAnimationFrame(frame); return; }
        anim = 0; opts.set({ x: to.x, y: to.y }); touch();
      })(t0);
    }

    function end(e) {
      if (!on || (e && e.pointerId != null && e.pointerId !== pid)) return;
      on = false; pid = null;
      if (queued) { if (raf) cancelAnimationFrame(raf); raf = 0; flush(); }
      try { el.releasePointerCapture(e.pointerId); } catch (_) {}
      el.classList.remove('drag');
      elFps.textContent = '—';
      var start = origin; origin = null;
      hideGhost();
      // Un geste de moins de 3 frames de mouvement = un tap, pas un drag.
      if (moved < 3) { if (opts.tap) opts.tap(); return; }
      var c = opts.get();
      if (start && c && dist(c, start) < CANCEL_D) { animBack(c, start); return; }
      touch();
    }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    // Filet iOS : un geste systeme (swipe bord d'ecran) peut avaler le pointer.
    el.addEventListener('lostpointercapture', function () { el.classList.remove('drag'); on = false; pid = null; origin = null; hideGhost(); });
  }

  function attachTokenPointer(g, id) {
    makeDrag(g, {
      // Hors mode sélection, le jeton ne se déplace pas : il sert de cible aux
      // outils flèche / gomme / tir. On refuse le drag mais on garde le tap.
      down: function (e) {
        if (tool !== 'select') { e.preventDefault(); onTokenClick(id); return false; }
        return true;
      },
      pad: function () { return PR; },
      ghostR: function () { return PR; },
      ghostDef: function () { return g.classList.contains('def'); },
      get: function () { var q = pos()[id]; return q ? { x: q.x, y: q.y } : null; },
      set: function (p) {
        var q = pos()[id];
        q.x = p.x; q.y = p.y;
        // Ce que le coach pose ici définit CE temps ; les temps suivants
        // seront recalculés à la fin du geste, par touch().
        placeToken(id);
        var ids = arrowsOf(id), i;
        for (i = 0; i < ids.length; i++) updateArrow(ids[i]);
      },
      tap: function () { onTokenClick(id); }
    });
  }

  function attachWaypointPointer(el) {
    var aid = el.getAttribute('data-arw'), idx = +el.getAttribute('data-i');
    var dot = layA.querySelector('.wp[data-arw="' + aid + '"][data-i="' + idx + '"]');
    makeDrag(el, {
      down: function () {
        // Mode gomme : un simple tap RETIRE le point de passage. Le chemin
        // redevient droit (ou repasse par les points restants).
        if (tool === 'erase') { removeWaypoint(aid, idx); return false; }
        return tool === 'select';
      },
      pad: function () { return 1; },
      get: function () { var a = findArw(aid); return a && a.via[idx] ? a.via[idx] : null; },
      set: function (p) {
        var a = findArw(aid);
        if (!a || !a.via[idx]) return;
        a.via[idx].x = p.x; a.via[idx].y = p.y;
        el.setAttribute('cx', f(p.x)); el.setAttribute('cy', f(p.y));
        if (dot) { dot.setAttribute('cx', f(p.x)); dot.setAttribute('cy', f(p.y)); }
        updateArrow(aid);
      }
    });
  }

  // ── Poignée d'extrémité (jalon 3.6) ────────────────────────────────────
  // On repositionne UNIQUEMENT la cible. Aucun handle de rotation : la tête
  // est un marker posé sur le dernier point du tracé, donc son angle est la
  // tangente — elle pivote toute seule vers la nouvelle direction, et le T de
  // l'écran, qui est dans le même marker, se réoriente avec elle.
  // Elle ne vit que sur un déplacement ou un écran, dont la cible est un point
  // LIBRE : la déplacer ne débranche donc jamais rien. Pas de snap sur une
  // joueuse — accrocher un déplacement à un jeton en ferait une poursuite.

  function attachTipPointer(el) {
    var aid = el.getAttribute('data-arw');
    makeDrag(el, {
      down: function () { return tool === 'select'; },
      // clampPt de makeDrag : l'extrémité ne peut pas sortir du terrain.
      pad: function () { return 1; },
      // On part du point du MODÈLE (centre du jeton visé ou point libre) :
      // makeDrag mémorise l'écart doigt↔point, donc rien ne saute au premier
      // contact, alors même que la poignée est dessinée en avant, sur la pointe.
      get: function () {
        var a = findArw(aid);
        if (!a) return null;
        var d = typeof a.to === 'string' ? tokById(a.to) : a.to;
        return d ? { x: d.x, y: d.y } : null;
      },
      set: function (p) {
        var a = findArw(aid);
        if (!a) return;
        a.to = { x: p.x, y: p.y };
        updateArrow(aid);
      }
    });
    // Posé APRÈS makeDrag, donc exécuté après lui : sa capture est relâchée
    // quand on redessine. Déplacer une extrémité change la course de la
    // joueuse : la cascade des temps suivants se rejoue, exactement comme
    // après un drag de jeton.
    el.addEventListener('pointerup', function () {
      if (tool !== 'select' || playing) return;
      if (recomputeStepPositions(cur)) drawTokens();
      drawArrows(); syncInfo(); renderTimeline();
    });
  }

  // ─────────────────────────────────────────────────────────────────────
  // 6. OUTILS — machine à états des clics
  // ─────────────────────────────────────────────────────────────────────
  function onTokenClick(id) {
    if (playing) return;
    if (tool === 'select') {
      active = (active === id) ? null : id;
      pending = null;
      syncSelection(); setHint();
      return;
    }
    if (tool === 'erase') return;   // la gomme ne touche qu'aux flèches
    if (tool === 'shot') {
      // Un seul tir par temps : re-taper la tireuse annule le tir.
      step().shot = (step().shot === id) ? null : id;
      drawArrows(); syncInfo(); syncBall(); renderTimeline(); touch(); setHint();
      return;
    }
    if (!pending) { pending = id; syncSelection(); setHint(); return; }
    if (pending === id) { pending = null; syncSelection(); setHint(); return; }
    if (tool === 'pass') { addArrow('pass', pending, id); pending = null; syncSelection(); return; }
    // Déplacement / écran : cliquer un autre jeton vaut « va à cet endroit ».
    var t = tokById(id);
    addArrow(tool, pending, { x: t.x, y: t.y });
    pending = null; syncSelection();
  }

  function onCourtClick(p) {
    if (playing) return;
    if (isMoveKind(tool) && pending) {
      addArrow(tool, pending, clampPt(p, 1));
      pending = null; syncSelection();
      return;
    }
    // Un clic dans le vide annule la sélection / le tracé en cours.
    if (pending || active) { pending = null; active = null; syncSelection(); setHint(); }
  }

  function addArrow(kind, from, to) {
    // Une seule flèche de déplacement par joueuse et par temps : deux
    // destinations pour la même joueuse au même moment ne veut rien dire, et
    // l'animation devrait en choisir une au hasard. La nouvelle remplace.
    var l = step().arw, i;
    if (isMoveKind(kind)) {
      for (i = l.length - 1; i >= 0; i--) if (isMoveKind(l[i].kind) && l[i].from === from) l.splice(i, 1);
    }
    l.push({ id: uid('w'), kind: kind, from: from, to: to, via: [] });
    drawArrows(); syncInfo(); renderTimeline(); touch(); setHint();
  }

  function removeArrow(id) {
    if (id === '__shot') { step().shot = null; }
    else {
      var l = step().arw, i;
      for (i = 0; i < l.length; i++) if (l[i].id === id) { l.splice(i, 1); break; }
    }
    drawArrows(); syncInfo(); syncBall(); renderTimeline(); touch();
  }

  function removeWaypoint(aid, idx) {
    var a = findArw(aid);
    if (!a || !a.via[idx]) return;
    a.via.splice(idx, 1);
    drawArrows(); touch();
  }

  // Distance d'un point à un segment — sert à savoir DANS QUEL segment de la
  // flèche insérer un waypoint (sinon un point ajouté en fin de course
  // atterrirait au mauvais rang et la courbe ferait un aller-retour).
  function distSeg(p, a, b) {
    var dx = b.x - a.x, dy = b.y - a.y, L = dx * dx + dy * dy;
    var t = L ? ((p.x - a.x) * dx + (p.y - a.y) * dy) / L : 0;
    t = clamp(t, 0, 1);
    var qx = a.x + t * dx - p.x, qy = a.y + t * dy - p.y;
    return Math.sqrt(qx * qx + qy * qy);
  }

  function addWaypoint(id, p) {
    var a = findArw(id);
    if (!a) return;
    var pts = rawPts(a);
    if (!pts) return;
    var best = 0, bd = Infinity, i;
    for (i = 0; i < pts.length - 1; i++) {
      var d = distSeg(p, pts[i], pts[i + 1]);
      if (d < bd) { bd = d; best = i; }
    }
    a.via.splice(best, 0, clampPt(p, 1));
    drawArrows(); touch();
  }

  function attachArrowPointer(g, id) {
    // Double-tap maison plutôt que dblclick : sur iPhone, dblclick n'est pas
    // fiable sur un <path> et arrive trop tard. On mesure nous-mêmes.
    var lastT = 0, lastP = null;
    g.addEventListener('pointerdown', function (e) {
      e.stopPropagation();
      if (!VIEWS[view].editable || playing) return;
      e.preventDefault();
      if (tool === 'erase') { removeArrow(id); return; }
      if (tool !== 'select' || id === '__shot') return;   // pas de waypoint sur un tir
      var p = toCourt(e.clientX, e.clientY);
      if (!p) return;
      var now = performance.now();
      if (lastP && now - lastT < 400 && Math.abs(p.x - lastP.x) < 6 && Math.abs(p.y - lastP.y) < 6) {
        lastT = 0; lastP = null;
        addWaypoint(id, p);
        return;
      }
      lastT = now; lastP = p;
    }, { passive: false });
  }

  // Clic sur le fond (terrain ou hors-jeu) : les jetons et les flèches
  // stoppent la propagation, donc tout ce qui arrive ici est bien du vide.
  svg.addEventListener('pointerdown', function (e) {
    if (!VIEWS[view].editable || playing) return;
    var p = toCourt(e.clientX, e.clientY);
    if (p) onCourtClick(p);
  }, { passive: true });

  // ─────────────────────────────────────────────────────────────────────
  // 7. TEMPS (steps) — timeline
  // ─────────────────────────────────────────────────────────────────────
  var strip = document.getElementById('tl-strip');

  function stepSummary(st) {
    var mv = 0, ps = 0, sc = 0, i;
    for (i = 0; i < st.arw.length; i++) {
      if (st.arw[i].kind === 'move') mv++;
      else if (st.arw[i].kind === 'screen') sc++;
      else ps++;
    }
    var out = [];
    if (mv) out.push(mv + '→');
    if (sc) out.push(sc + '⊥');
    if (ps) out.push(ps + '⇢');
    if (st.shot) out.push('🎯');
    return out.join(' ') || '·';
  }

  function renderTimeline() {
    var l = steps(), html = '', i;
    for (i = 0; i < l.length; i++) {
      // Un point d'insertion AVANT chaque temps (celui d'après le dernier,
      // c'est le ＋ de la barre). Insérer en tête est donc possible aussi.
      html += '<button class="ins" data-ins="' + i + '" title="Insérer un temps ici">+</button>';
      // Un temps qui bifurque le DIT sur sa pastille : c'est le seul endroit
      // où le coach voit qu'une variante part d'ici sans ouvrir l'arbre.
      var nb = Array.isArray(l[i].branches) ? l[i].branches.length : 0;
      html += '<div class="chip' + (i === cur ? ' on' : '') + (desynced(i) ? ' desync' : '') + '" data-i="' + i + '">'
        + (i + 1) + (nb ? ' 🔀' + nb : '')
        + '<span class="mini">' + stepSummary(l[i]) + '</span>'
        + '<button class="x" data-del="' + i + '" title="Supprimer ce temps">×</button>'
        + '</div>';
    }
    strip.innerHTML = html;
    document.getElementById('s-sync').disabled = (cur === 0) || playing;
    updateProgress();
    renderTree();
  }

  function gotoStep(i, keepTool) {
    if (i < 0 || i >= steps().length) return;
    cur = i;
    active = null; pending = null;
    if (!keepTool) { /* l'outil courant reste actif d'un temps à l'autre */ }
    drawTokens(); drawArrows(); renderTimeline(); syncInfo(); setHint();
  }

  function addStep() {
    var src = steps()[steps().length - 1];
    steps().push(makeStep(endPos(src)));
    gotoStep(steps().length - 1);
    touch();
  }

  function delStep(i) {
    if (steps().length <= 1) { toast('Un play garde au moins un temps.', 'err'); return; }
    if (!confirm('Supprimer le temps ' + (i + 1) + ' ?\nSes flèches et sa disposition sont perdues.')) return;
    steps().splice(i, 1);
    if (cur >= steps().length) cur = steps().length - 1;
    // Le temps qui prend la place du supprimé doit hériter de son nouveau
    // prédécesseur : la cascade repart de i, pas de cur + 1.
    gotoStep(cur); touch(i);
  }

  // Recale la photo du temps courant sur la SORTIE du temps précédent, sans
  // toucher à ses flèches (cf. l'en-tête : on répare, on n'écrase pas en douce).
  function syncStep() {
    if (cur === 0) return;
    steps()[cur].pos = endPos(steps()[cur - 1]);
    gotoStep(cur); touch();
    toast('Temps ' + (cur + 1) + ' recalé.', 'ok');
  }

  // INSERTION entre deux temps (v.178). Remplace le réordonnancement au
  // doigt du jalon 2 : glisser un temps d'une place à l'autre cassait la
  // cascade (le temps déplacé héritait soudain d'une AUTRE sortie, et tous
  // les temps entre les deux places suivaient). L'ordre est désormais figé
  // par l'ordre d'ajout / d'insertion, et les chips ne servent plus qu'à
  // naviguer.
  //
  // Le temps inséré en position i :
  //   entrée  = la photo du temps qui était à cette place (ou, en queue, la
  //             SORTIE du dernier temps) ;
  //   sortie  = son entrée, puisqu'il naît sans aucune flèche → le temps
  //             suivant garde EXACTEMENT sa photo et la cascade ne bouge rien.
  // Reprendre la photo du SUIVANT plutôt que la sortie du précédent, c'est ce
  // qui rend l'insertion neutre même sur un temps que le coach avait rangé à
  // la main : la divergence, s'il y en a une, passe au temps inséré.
  function insertStep(i) {
    var l = steps();
    if (playing || i < 0 || i > l.length) return;
    var nxt = l[i] || null;
    var st = makeStep(nxt ? clonePos(nxt.pos) : endPos(l[l.length - 1]));

    l.splice(i, 0, st);
    recomputeStepPositions(i + 1);   // no-op attendu : c'est le but du miroir
    cur = i;
    gotoStep(cur); touch();
    var chip = strip.querySelector('.chip[data-i="' + i + '"]');
    if (chip) chip.classList.add('pop');
    toast('Temps ' + (i + 1) + ' inséré.', 'ok');
  }

  // Une seule délégation pour toute la bande : supprimer, insérer, naviguer.
  // Plus aucun pointerdown sur les chips — donc plus rien qui puisse avaler
  // le pan-x du scroll horizontal.
